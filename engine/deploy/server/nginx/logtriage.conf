# LogTriage — nginx 리버스 프록시 (WEB 계층)
# 설치 스크립트가 /etc/nginx/conf.d/logtriage.conf (RHEL 계열) 또는
# /etc/nginx/sites-available/logtriage (Debian/Ubuntu, sites-enabled 에 링크) 로 복사한다.
# TLS 를 쓰면 install.sh --tls 가 자체 서명 인증서를 만들고 아래 443 블록을 활성화한다.

# 동시 접속 제한(IP 당) — 대용량 업로드가 앱 스레드를 오래 점유하는 것을 완화
limit_conn_zone $binary_remote_addr zone=logtriage_perip:10m;

# 접속 기록에 주소의 ? 뒤를 남기지 않는다 — 첫 관리자 1회용 코드(/setup?t=) · 내려받기 표(?ticket=)가 실린다.
# 앱 기록은 22차부터 가린다. nginx 기본 형식($request)은 그대로 적으므로 경로만($uri) 적는 형식을 따로 둔다(23차)
log_format logtriage_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                             '$status $body_bytes_sent "$http_user_agent" $request_time';

upstream logtriage_app {
    server 127.0.0.1:8088;      # WAS: logtriage-server(systemd) — /etc/logtriage/server.env 의 LOGTRIAGE_PORT 와 일치
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # __TLS_REDIRECT__   (install.sh --tls 시 'return 301 https://$host$request_uri;' 로 치환)

    access_log /var/log/nginx/logtriage_access.log logtriage_noquery;
    error_log  /var/log/nginx/logtriage_error.log;

    # 로그 업로드 상한: 앱의 1파일 600MB 한도 + 여유
    client_max_body_size 700m;
    client_body_timeout   600s;
    # 600MB 분석 ≈ 3분(실측), 1GB 급은 10분 이상 → 응답 대기 넉넉히
    proxy_read_timeout    1800s;
    proxy_send_timeout    1800s;
    proxy_connect_timeout 10s;
    proxy_request_buffering off;    # 업로드를 디스크에 이중 저장하지 않고 바로 앱으로 스트리밍
    proxy_buffering       off;
    limit_conn            logtriage_perip 8;

    location / {
        proxy_pass         http://logtriage_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 앱이 'X-Real-IP 는 우리 nginx 가 적은 값' 임을 아는 비밀(install.sh 가 server.env 의 LOGTRIAGE_PROXY_SECRET 과 같은 값으로 치환,
        # 이 설정 파일은 root 만 읽게 0600) — 없으면 같은 서버의 다른 계정이 앱 포트에 직접 붙어 접속자 주소를 꾸며 낼 수 있다
        proxy_set_header   X-LogTriage-Proxy __PROXY_SECRET__;
    }

    location = /healthz {
        proxy_pass http://logtriage_app/healthz;
        access_log off;
    }
}

