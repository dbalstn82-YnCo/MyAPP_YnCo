    · Query Processor 로그: $ALTIBASE_HOME/trc/altibase_qp.log · Replication 로그: $ALTIBASE_HOME/trc/altibase_rp.log · Replication Conflict: $ALTIBASE_HOME/trc/altibase_rp_conflict.log · 통신 로그: $ALTIBASE_HOME/trc/altibase_cm.log
    · IPC 로그: $ALTIBASE_HOME/trc/altibase_ipc.log · IPCDA 로그: $ALTIBASE_HOME/trc/altibase_ipcda.log · XA 로그: $ALTIBASE_HOME/trc/altibase_xa.log · DB Link 로그: $ALTIBASE_HOME/trc/altibase_dk.log · Main Module
