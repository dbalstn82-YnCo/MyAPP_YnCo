- id: TBR-PROC-R6-CLIENTTIMEOUT
  scope: id
  products: [tibero]
  category: connection
  match: [TBR-12099]
  title: 클라이언트 메시지 수신 시간 초과로 연결 종료 (TBR-12099)
  source: "Tibero 7 에러 참조 안내서(TBR-12099 ERROR_READ_MSG_TIMEOUT)·참조 안내서 'V$SESSION'·관리자 안내서 '로그(sys.log)'"
  stages:
  - stage: 1
    steps:
    - do: 발생 시각·빈도·대상 클라이언트 확인 (읽기 전용)
      cmd: |
        grep -n "12099" $TB_HOME/instance/$TB_SID/log/slog/sys.log | tail -20
        tbsql <dba_user>          # 비밀번호는 접속 프롬프트에서 입력
        SQL> select sid, username, ipaddr, status from v$session order by ipaddr;
        SQL> quit
      check: "같은 시각 여러 클라이언트면 네트워크·방화벽 공통 원인, 특정 IP 반복이면 그 WAS(스레드 정지·GC) 원인 · 해당 IP 세션 편중 확인"
      note: "적용: Tibero 7 · 권한: Tibero OS 계정, DBA 조회 권한"
    - do: 클라이언트·경로 상태 확인 (읽기 전용)
      cmd: |
        ping -c 5 <client_ip>
        grep -n -i -E "socket|timeout|SQLException" <was_log> | tail -30
      check: "패킷 손실·지연이 있으면 네트워크 · WAS 로그에 같은 시각 스레드 정지·Full GC·소켓 오류가 있으면 클라이언트 원인 · 정상: 일회성"
      note: "적용: Linux (AIX 는 ping -c 5 동일) · 권한: 일반 사용자"
  - stage: 2
    steps:
    - do: (2차·승인 후) 커넥션 풀 유휴 검증·방화벽 세션 유지 시간 정합
      config:
        file: WAS 데이터소스 설정
        snippet: |
          testWhileIdle = true / validationQuery = select 1 from dual
          idle timeout(유휴 연결 회수) < 방화벽 세션 유지 시간
        note: "사전조건: 방화벽 세션 유지 시간을 네트워크 담당에게 확인, 변경 전 설정값 기록 · 영향: 검증 쿼리로 DB 왕복 소폭 증가, 풀 재기동 필요할 수 있음 · 승인: 애플리케이션 담당·네트워크 담당·DBA · 백업/롤백: 설정 파일 사본 보관 후 원복"
      check: "성공: 적용 후 TBR-12099 재발 없음 · 실패: 특정 WAS 에서 지속 → WAS 스레드 덤프로 정지 원인 분석"
  - stage: 3
    steps:
    - do: TmaxTibero 기술지원 자료
      cmd: |
        grep -n "12099" $TB_HOME/instance/$TB_SID/log/slog/sys.log | tail -200 > tbr12099_$(date +%Y%m%d).txt
      check: "sys.log 발췌·WAS 로그·풀 설정·네트워크 시험 결과"
      note: "민감정보 마스킹: 클라이언트 IP·계정명·호스트명을 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: TBR-PROC-R6-SHAREDPOOL
  scope: id
  products: [tibero]
  category: memory
  match: [TBR-3002]
  title: 공유 풀(shared pool) 메모리 부족 (TBR-3002)
  source: "Tibero 7 에러 참조 안내서(TBR-3002 ERROR_OUT_OF_SHP)·참조 안내서 '초기화 파라미터(TOTAL_SHM_SIZE, DB_CACHE_SIZE)'·'동적 뷰(V$SGA, V$PARAMETERS)'·관리자 안내서 '기동과 종료'"
  stages:
  - stage: 1
    steps:
    - do: 공유 풀 사용량·메모리 설정 확인 (읽기 전용)
      cmd: |
        tbsql <dba_user>          # 비밀번호는 접속 프롬프트에서 입력
        SQL> select name, total, used from v$sga;
        SQL> select name, value from v$parameters where name in ('TOTAL_SHM_SIZE','DB_CACHE_SIZE');
        SQL> quit
        grep -n "3002" $TB_HOME/instance/$TB_SID/log/slog/sys.log | tail -20
      check: "shared pool used 가 total 의 95% 이상이면 확정 · 연속 발생이면 신규 SQL 실행이 계속 실패하므로 2차 DBA 즉시 · 정상: 일회성·사용률 85% 미만"
      note: "적용: Tibero 7 (v$sga 컬럼은 7 기준) · 권한: DBA 조회 권한"
    - do: OS 메모리·공유 메모리 한도 확인 (읽기 전용)
      cmd: |
        free -m
        sysctl kernel.shmmax kernel.shmall
      check: "TOTAL_SHM_SIZE 를 올릴 물리 메모리 여유와 커널 한도가 있는지 확인 — 없으면 상향 대신 리터럴 SQL(바인드 미사용) 정리가 우선"
      note: "적용: Linux · 권한: 일반 사용자"
  - stage: 2
    steps:
    - do: (2차·승인 후) TOTAL_SHM_SIZE 상향 (재기동)
      cmd: |
        cp -p $TB_HOME/config/$TB_SID.tip $TB_HOME/config/$TB_SID.tip.bak_$(date +%Y%m%d)
        vi $TB_HOME/config/$TB_SID.tip     # TOTAL_SHM_SIZE=<값> (DB_CACHE_SIZE 는 그대로 → 늘린 만큼 공유 풀 증가)
        tbdown immediate ; tbboot
      check: "성공: v$parameters 새 값, v$sga shared pool 여유 증가, TBR-3002 미발생 · 실패: 기동 실패(공유 메모리 부족) → tip 백업본 복원 후 tbboot"
      note: "사전조건: 물리 메모리·kernel.shmmax/shmall 여유 확인, 리터럴 SQL 개선 요청 병행, 정기 점검 시간 확보 · 영향: tbdown~tbboot 동안 서비스 중단 · 승인: DBA·서비스 담당·시스템 담당(메모리) · 백업/롤백: tip 백업본 복원 후 tbboot · 적용: Tibero 6/7"
  - stage: 3
    steps:
    - do: TmaxTibero 기술지원 자료
      cmd: |
        tar czf tibero_shp_$(date +%Y%m%d).tgz $TB_HOME/config/$TB_SID.tip $TB_HOME/instance/$TB_SID/log/slog/sys.log
      check: "tip·sys.log·v$sga 결과·free 결과"
      note: "민감정보 마스킹: tip 의 IP·포트·경로, 로그의 SQL 리터럴(개인정보)·계정명을 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: TBR-PROC-R6-PRIV
  scope: id
  products: [tibero]
  category: security
  match: [TBR-8053]
  title: 객체·칼럼 접근 권한 없음 (TBR-8053)
  source: "Tibero 7 에러 참조 안내서(TBR-8053 ERROR_DML_NOT_ENOUGH_PRIVILEGE)·참조 안내서 '정적 뷰(DBA_TBL_PRIVS, DBA_SYS_PRIVS, DBA_ROLE_PRIVS, DBA_SYNONYMS)'·관리자 안내서 '사용자 관리(GRANT/REVOKE)'"
  stages:
  - stage: 1
    steps:
    - do: 실패 SQL·접속 계정·대상 객체 확인 (읽기 전용)
      cmd: |
        grep -n -B5 "TBR-8053" <app_log> | tail -40
      check: "실패 SQL 의 대상 객체(스키마.객체·칼럼)와 접속 계정을 특정"
      note: "적용: Tibero 6/7 · 권한: 애플리케이션 로그 읽기"
    - do: 부여 현황·롤·시노님 확인 (읽기 전용)
      cmd: |
        tbsql <dba_user>          # 비밀번호는 접속 프롬프트에서 입력
        SQL> select grantee, owner, table_name, privilege from dba_tbl_privs where owner='<OWNER>' and table_name='<OBJECT>';
        SQL> select grantee, granted_role from dba_role_privs where grantee='<USER>';
        SQL> select grantee, privilege from dba_sys_privs where grantee='<USER>';
        SQL> select owner, synonym_name, org_object_owner, org_object_name from dba_synonyms where synonym_name='<OBJECT>';
        SQL> quit
      check: "접속 계정(또는 그 롤)에 필요한 권한이 없으면 확정 — 최근 배포·REVOKE 이력과 대조 · 시노님이 다른 소유자 객체를 가리키면 그 원본 객체 권한 확인"
      note: "적용: Tibero 6/7 (Tibero 는 DBA_TAB_PRIVS 대신 DBA_TBL_PRIVS) · 권한: DBA 조회 권한 — 1차는 DBA 에게 결과 요청"
  - stage: 2
    steps:
    - do: (2차·승인 후) 업무에 필요한 최소 권한만 부여
      cmd: |
        tbsql <dba_user>
        SQL> grant <select|insert|update|delete|execute> on <OWNER>.<OBJECT> to <USER>;
        SQL> select grantee, privilege from dba_tbl_privs where owner='<OWNER>' and table_name='<OBJECT>';
      check: "성공: 해당 SQL 재실행 성공·TBR-8053 미발생 · 실패: 같은 오류 → 칼럼 단위 권한·시노님 원본 객체 권한 확인"
      note: "사전조건: 권한 요청 근거(업무·배포 문서)를 보안 담당이 확인, 롤 단위 부여 정책 확인 · 영향: 과도 권한은 보안 위험 · 승인: 보안 담당·DBA · 백업/롤백: revoke <privilege> on <OWNER>.<OBJECT> from <USER>; 로 원복, 부여 전 조회 결과 보관 · 적용: Tibero 6/7"
  - stage: 3
    steps:
    - do: 보안 검토·기술지원 자료
      cmd: |
        grep -n -B5 "TBR-8053" <app_log> | tail -200 > tbr8053_$(date +%Y%m%d).txt
      check: "오류 발췌·권한 조회 결과·배포/REVOKE 이력"
      note: "민감정보 마스킹: 계정명·스키마 업무명·SQL 리터럴을 가린 뒤 전달 · 전달 승인: 보안 담당 승인"

- id: TBR-PROC-R6-DBLINKLOB
  scope: id
  products: [tibero]
  category: upstream
  match: [TBR-26020]
  title: DB Link 원격 LOB 읽기 불가 — 쿼리 형태 문제 (TBR-26020)
  source: "Tibero 7 에러 참조 안내서(TBR-26020 ERROR_LOB_CANT_READ_REMOTE)·관리자 안내서 'DB Link'·참조 안내서 'DBA_DB_LINKS'"
  stages:
  - stage: 1
    steps:
    - do: 실패 SQL 의 링크·LOB 칼럼 확인 (읽기 전용)
      cmd: |
        grep -n -B5 "TBR-26020" <app_log> | tail -40
        tbsql <dba_user>          # 비밀번호는 접속 프롬프트에서 입력
        SQL> select owner, db_link, host from dba_db_links where db_link='<DBLINK>';
        SQL> select count(*) from <remote_table>@<DBLINK> where rownum <= 1;
        SQL> quit
      check: "같은 링크의 LOB 가 아닌 조회가 성공하면 링크 장애가 아닌 쿼리 형태(원격 CLOB/BLOB 직접 읽기) 문제 확정 · 링크 조회도 실패하면 접속·인증 판정(TBR-PROC-R5-CONNECTION·SECURITY)으로"
      note: "적용: Tibero 7 · 권한: DBA 조회 권한, 링크 사용 권한 · 원격 조회는 rownum 1건으로 제한"
  - stage: 2
    steps:
    - do: (2차·승인 후) 원격 LOB 처리 방식 변경 배포 (개발팀)
      config:
        file: 애플리케이션 SQL
        snippet: |
          -- 원격 LOB 를 직접 읽지 말고 원격 측에서 가공(길이 제한 문자열로 변환)하거나
          -- 원격 측 배치로 로컬 테이블에 적재한 뒤 로컬에서 조회
        note: "사전조건: 원격 DB 담당과 처리 위치 합의, 개발 환경 검증 · 영향: 배포 동안 해당 기능 일시 중단 가능, 적재 방식은 데이터 지연 발생 · 승인: 개발팀·원격 DB 담당·DBA · 백업/롤백: 이전 SQL 사본 보관 후 배포, 문제 시 이전 버전 재배포"
      check: "성공: 해당 기능에서 TBR-26020 미발생 · 실패: 다른 오류로 바뀌면 그 코드 판정으로"
  - stage: 3
    steps:
    - do: TmaxTibero 기술지원 자료
      cmd: |
        grep -n -B5 "TBR-26020" <app_log> | tail -100 > tbr26020_$(date +%Y%m%d).txt
      check: "실패 SQL·링크 정의·양쪽 버전"
      note: "민감정보 마스킹: 링크 HOST·계정명·SQL 리터럴을 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

