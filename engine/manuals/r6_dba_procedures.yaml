# 근거 매뉴얼·작성 기준 — 아이디어 3 'R6 전용 절차' DB 묶음 A (Oracle · Tibero · Altibase), 2026-10-16
# 목적: '같은 제품·유형'으로만 붙어 있던 판정 중 기존 절차가 맞지 않는 것(예: ORA-06512 → ORA-00600 절차, TBR-1070 → 테이블스페이스 절차)에 판정 전용 절차를 만든다.
#       기존 절차가 맞는 판정은 r6_dba_proclinks.yaml 로 잇는다(기존 파일은 고치지 않음).
# Oracle: Database Error Messages(docs.oracle.com/en/error-help/db/)·19c Database Reference(V$LOG·V$LOGFILE·V$DATAFILE_HEADER·V$RECOVER_FILE·V$BACKUP·V$INSTANCE·
#         V$DATABASE·V$PDBS·V$DISPATCHER·V$RMAN_STATUS·V$SEGMENT_STATISTICS·DBA_SOURCE·DBA_ERRORS·DBA_TRIGGERS·UNIFIED_AUDIT_TRAIL·DBA_RSRC_PLAN_DIRECTIVES·DBA_2PC_PENDING)·
#         Administrator's Guide(Managing Control Files·Managing the Redo Log·Managing Datafiles)·Backup and Recovery User's Guide(RMAN RESTORE/RECOVER)·
#         Net Services Administrator's Guide/Reference(tnsnames.ora·sqlnet.ora SQLNET.EXPIRE_TIME·TCP.INVITED_NODES·NAMES.DIRECTORY_PATH)·Grid Infrastructure(crsctl) — 11gR2·12c+·19c 차이는 note 에 적음
# Tibero: Tibero 6/7 관리자 안내서(기동·종료 tbboot -t MOUNT/RESETLOGS·tbdown, 백업과 복구 V$RECOVER_FILE·V$BACKUP·RESETLOGS, 로그 $TB_HOME/instance/$TB_SID/log/slog·dlog)·
#         참조 안내서(동적 뷰 V$INSTANCE·V$LOG·V$LOGFILE·V$DATAFILE·V$SESSION·V$SGA·V$PARAMETERS, 정적 뷰 DBA_TBL_PRIVS·DBA_TBL_COLUMNS·DBA_SYNONYMS·DBA_SOURCE·DBA_DB_LINKS)·
#         에러 참조 안내서(TBR-1001~24018·TBR-2004·3002·8053·10007·12099·15163·26020) — technet.tmaxsoft.com
# Altibase: Altibase 7.1 General Reference(성능 뷰 V$SESSION·V$PROPERTY·V$VERSION·V$DATAFILES·V$TABLESPACES·V$ARCHIVE·V$MEMSTAT·V$REPGAP·V$REPSENDER, 메타 SYSTEM_.SYS_CONSTRAINTS_)·
#         Administrator's Manual(trc 로그 altibase_boot/error/rp.log, 백업·아카이브 모드)·Replication Manual(ALTER REPLICATION … STOP/START)·Error Message Reference(ERR-xxxxx)
# 작성 기준: 검증도구/knowledge_spec.md (1차 읽기 전용 · 2차 사전조건·영향·승인·백업/롤백 + 성공/실패 · 3차 민감정보 마스킹·전달 승인 · 확인 못 한 이름은 verify_note)
# 접속 방식: Oracle 은 OS 인증(sqlplus / as sysdba), Tibero·Altibase 는 'tbsql <user>' · 'isql -s localhost -u <user>' 로 접속해 비밀번호를 프롬프트에서 입력한 뒤
#            'SQL>' · 'iSQL>' 줄을 차례로 입력한다(명령행·heredoc 첫 줄에 비밀번호를 두지 않는다 — ps·셸 이력 노출 방지).
procedures:
# ══════════════════════════ Oracle · internal ══════════════════════════
- id: ORA-PROC-R6-SQLERR
  scope: id
  products: [oracle]
  category: internal
  match: [ORA-00001, ORA-01722, ORA-01756, LEG-ORA-01460-IBATIS, LEG-ORA-SQL-STATE, LEG-ORA-00XXX-ERR, LEG-IND-002, LEG-ORACLE-SP2-001-4653]
  title: 애플리케이션 SQL 실행 오류 — 중복 키·숫자 변환·따옴표·바인드 길이·SQL*Plus 스크립트 (ORA-00001 · ORA-01722 · ORA-01756 · ORA-01460 · SP2-)
  source: "Oracle Database Error Messages (ORA-00001·ORA-01722·ORA-01756·ORA-01460)·19c 'Database Reference (DBA_CONSTRAINTS, DBA_CONS_COLUMNS, DBA_SEQUENCES, NLS_DATABASE_PARAMETERS, DBA_TABLESPACE_USAGE_METRICS)'·'SQL Language Reference (ALTER SEQUENCE, VALIDATE_CONVERSION)'·'SQL*Plus User's Guide and Reference (SP2 메시지)'"
  stages:
  - stage: 1
    steps:
    - do: 실제 오류 번호·실패 SQL·입력 키 식별 (읽기 전용, 애플리케이션·배치 로그)
      cmd: |
        grep -oE "ORA-[0-9]{5}|SP2-[0-9]{4}" <app_log> | sort | uniq -c | sort -rn | head -20
        grep -n -B5 -A3 -E "ORA-00001|ORA-01722|ORA-01756|ORA-01460|SQL state|SP2-" <app_log> | tail -60
        grep -n -B2 -A5 "HubLogDB Detail Table Insert Error" <ESB_log> | grep -E "ORA-|transaction id" | tail -20
      check: "가장 많은 번호가 실제 원인 — 00001=중복 키, 01722=숫자 변환, 01756=따옴표 미종결(동적 SQL 결합), 01460=바인드 길이·형, SP2-=SQL*Plus 스크립트·접속 오류. JDBC 의 'SQL state [23000]'·'error code [1]' 은 ORA-00001, SQU-OTO 의 숫자 코드는 ORA-0<번호> 로 읽는다 · 같은 키가 반복되면 재처리 루프(2차) · 정상: 일회성이고 재시도 루프 없음"
      note: "적용: 모든 버전(애플리케이션·배치·ESB 로그 기준) · 권한: 로그 읽기 · DB 인스턴스 장애가 아닌 SQL 단위 오류이므로 DB 재기동·리스너 조치 대상이 아님 · 로그에 입력값(개인정보)이 있을 수 있어 공유 시 가림"
    - do: DB 쪽 원인 확인 — 제약·시퀀스·문자셋·공간 (읽기 전용, DBA 조회 요청)
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        set lines 200 pages 100
        select c.owner, c.table_name, c.constraint_type, cc.column_name from dba_constraints c join dba_cons_columns cc on cc.owner=c.owner and cc.constraint_name=c.constraint_name where c.constraint_name=upper('<CONSTRAINT>');
        select sequence_owner, sequence_name, last_number, cache_size from dba_sequences where sequence_name=upper('<SEQ>');
        select parameter, value from nls_database_parameters where parameter in ('NLS_CHARACTERSET','NLS_NCHAR_CHARACTERSET');
        select tablespace_name, round(used_percent,1) used_pct from dba_tablespace_usage_metrics order by 2 desc fetch first 5 rows only;
        EOF
      check: "ORA-00001: 제약 컬럼 확인 후 시퀀스 last_number 가 키 최대값(select max(<key_col>) from <owner>.<table>)보다 작으면 채번 뒤처짐(이관·수동 입력 뒤 흔함) · ORA-01460: 문자셋이 AL32UTF8 이면 한글 약 1,334자부터 4000바이트 초과 · 허브 로그 INSERT 실패는 대상 테이블스페이스 used_pct 95% 이상이면 공간 원인 · 정상: 제약·시퀀스·공간 이상 없음(→ 입력 데이터·SQL 작성 문제로 개발팀 전달)"
      note: "적용: 11gR2~19c (fetch first 는 12c+, 11gR2 는 rownum 서브쿼리) · 권한: SYSDBA 또는 SELECT_CATALOG_ROLE — 1차는 DBA 에게 결과 요청 · 조회만 하며 잠금을 잡지 않음"
    - do: 잘못 들어간 숫자형 문자 데이터 식별 (ORA-01722, 읽기 전용)
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        select <col> from <owner>.<table> where validate_conversion(<col> as number) = 0 fetch first 20 rows only;
        EOF
      check: "결과 행이 있으면 데이터 오류 — 데이터 담당에 정정 요청 · 결과가 없으면 SQL 의 암시적 변환(문자 컬럼 = 숫자 리터럴) 또는 바인드 형 문제로 개발팀 전달"
      note: "적용: validate_conversion 은 12cR2+, 11gR2 는 where not regexp_like(<col>, '^-?[0-9.]+$') and rownum <= 20 · 큰 테이블은 전체 스캔이 되므로 조건을 붙이거나 업무 외 시간 · 권한: 대상 테이블 SELECT"
  - stage: 2
    steps:
    - do: (2차·승인 후) 중복·오류 데이터 분리 보관과 시퀀스 보정
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        create table <owner>.<table>_bak_<yyyymmdd> as select * from <owner>.<table> where <대상 조건>;
        -- 18c+: alter sequence <owner>.<seq> restart start with <최대키+1>;
        -- 11gR2~12c: alter sequence <owner>.<seq> increment by <최대키-last_number+1>; select <owner>.<seq>.nextval from dual; alter sequence <owner>.<seq> increment by 1;
        EOF
      check: "성공: 재처리 후 ORA-00001/01722 미발생, 업무 건수 대사 일치, dba_sequences.last_number > 최대 키 · 실패: 같은 오류 지속 → 재처리 배치 중지 유지, 개발팀과 키 생성 로직 재확인"
      note: "사전조건: 대상 행·키 값을 업무 담당이 확인, 재처리 배치 일시 중지 합의, 시퀀스 현재값(last_number) 기록 · 영향: 보정 중 다른 세션이 채번하면 번호 공백 발생, 백업 테이블만큼 공간 사용 · 승인: DBA·업무 담당(변경 관리) · 백업/롤백: 정정 전 대상 행을 _bak 테이블로 복사(첫 줄), 시퀀스는 기록한 값으로 재보정 · 적용: restart 절은 18c+ 문서화, 11gR2~12c 는 increment 방식"
    - do: (2차·승인 후) SQL·바인드·배치 스크립트 수정 배포 (개발팀)
      config:
        file: 애플리케이션 SQL·iBatis/MyBatis sqlMap·SQL*Plus 배치 스크립트
        snippet: |
          -- ORA-01756: 문자열 결합 대신 바인드 변수 (PreparedStatement ? / :b1), 스크립트 리터럴은 q'[ … ]'
          -- ORA-01722: where <char_col> = '123' (문자 비교) 또는 to_number(<col> default null on conversion error)  -- 12cR2+
          -- ORA-01460: 4000바이트 넘는 문자열은 jdbcType=CLOB 로 바인딩
          -- SP2-0310: 스크립트 경로·권한·BOM 확인 (file <script.sql>), SP2-0640: 접속 실패 시 whenever sqlerror exit 로 중단
        note: "사전조건: 개발팀이 재현·테스트 환경에서 검증, 변경 대상 SQL ID·스크립트 목록 확정 · 영향: 배포 동안 해당 기능 일시 중단 가능 · 승인: 개발팀·업무 담당(변경 관리) · 백업/롤백: 이전 소스·sqlMap XML·스크립트 사본 보관 후 배포, 문제 시 이전 버전 재배포"
      check: "성공: 같은 입력으로 재실행 시 오류 미발생, 애플리케이션 로그에 ORA-/SP2- 재발 없음 · 실패: 다른 ORA 코드로 바뀌면 그 코드 판정으로 다시 본다"
  - stage: 3
    steps:
    - do: 개발팀·Oracle SR 전달 자료
      cmd: |
        grep -n -B5 -A3 -E "ORA-[0-9]{5}|SP2-" <app_log> | tail -200 > sqlerr_$(date +%Y%m%d).txt
        echo 'select banner from v$version;' | sqlplus -s / as sysdba >> sqlerr_$(date +%Y%m%d).txt
      check: "오류 스택·실패 SQL 원문·제약/시퀀스/문자셋 조회 결과·DB 버전"
      note: "민감정보 마스킹: SQL 리터럴·바인드값·키 값(주민번호·계좌 등 개인정보), 사용자명·호스트명·IP 를 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: ORA-PROC-R6-STACK
  scope: id
  products: [oracle]
  category: internal
  match: [ORA-06512, ORA-00604]
  title: 오류 스택 보조 메시지 — PL/SQL 예외 위치·재귀 SQL 오류 (ORA-06512 · ORA-00604)
  source: "Oracle Database Error Messages (ORA-06512·ORA-00604)·19c 'Database Reference (DBA_SOURCE, DBA_TRIGGERS, DBA_TABLESPACE_USAGE_METRICS)'·'PL/SQL Language Reference (Exception Handling)'·'PL/SQL Packages and Types Reference (DBMS_METADATA.GET_DDL)'"
  stages:
  - stage: 1
    steps:
    - do: 오류 스택의 주(첫) 오류 코드 확인 (읽기 전용)
      cmd: |
        grep -n -B2 -A6 -E "ORA-06512|ORA-00604" <app_log> | tail -60
        grep -n -A3 "ORA-00604" $ORACLE_BASE/diag/rdbms/<db>/<SID>/trace/alert_<SID>.log | tail -30
      check: "ORA-06512 는 위치(at \"<owner>.<unit>\", line <n>)만 알린다 — 스택 맨 위 ORA 코드가 원인 · ORA-00604 는 바로 다음 ORA 코드가 원인(예: ORA-01653 공간, ORA-04031 메모리, ORA-01031 권한) · 그 코드로 판정을 다시 보고 그 코드의 절차를 따른다"
      note: "적용: 10gR2~19c (alert log 경로는 11g+ ADR, 10gR2 는 background_dump_dest) · 권한: 애플리케이션 로그 읽기, alert log 는 oracle OS 계정"
    - do: 오류 위치 소스·시스템 트리거·SYSTEM/SYSAUX 공간 확인 (읽기 전용)
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        set lines 200 pages 100
        select type, line, text from dba_source where owner=upper('<owner>') and name=upper('<unit>') and type='<PACKAGE BODY|PROCEDURE|FUNCTION|TRIGGER>' and line between <n>-5 and <n>+5 order by line;
        select owner, trigger_name, triggering_event, status from dba_triggers where base_object_type in ('DATABASE','SCHEMA');
        select tablespace_name, round(used_percent,1) pct from dba_tablespace_usage_metrics where tablespace_name in ('SYSTEM','SYSAUX');
        EOF
      check: "line <n> 주변 소스로 예외가 난 문장 확인 → 개발팀 전달 · 로그온/DDL 시스템 트리거가 있고 ORA-00604 가 로그온·DDL 때만 나면 트리거 원인 · SYSTEM/SYSAUX 95% 이상이면 공간 원인 · 정상: 트리거·공간 이상 없음"
      note: "패키지는 PACKAGE 와 PACKAGE BODY 의 줄 번호가 다르므로 type 을 지정 · 적용: 10gR2~19c · 권한: SELECT_CATALOG_ROLE 또는 DBA — 1차는 DBA 에게 결과 요청"
  - stage: 2
    steps:
    - do: (2차·승인 후) 원인 시스템 트리거 임시 비활성 (ORA-00604)
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        set long 100000 lines 200
        select dbms_metadata.get_ddl('TRIGGER','<TRG>','<OWNER>') from dual;
        alter trigger <owner>.<trg> disable;
        EOF
      check: "성공: 같은 로그온·DDL 재실행 시 ORA-00604 미발생 · 실패: 오류 지속 → 트리거는 다시 enable 하고 주 오류 코드(스택 다음 줄)의 절차로 조치"
      note: "사전조건: 트리거 용도(감사·접속 통제)를 보안·업무 담당이 확인 — 보안 통제 트리거는 비활성 대신 트리거 소스 수정, DDL 사본 확보(get_ddl) · 영향: 비활성 동안 트리거 기능(감사 기록·접속 통제) 중단 · 승인: DBA·보안 담당 · 백업/롤백: get_ddl 결과 보관, 원복은 alter trigger <owner>.<trg> enable; · 적용: 10gR2~19c"
    - do: (2차·승인 후) PL/SQL 예외 처리 보완 배포 (ORA-06512, 개발팀)
      config:
        file: <owner>.<unit> 소스(개발팀 저장소)
        snippet: |
          EXCEPTION
            WHEN OTHERS THEN
              <오류 로그 테이블 기록>(SQLCODE, DBMS_UTILITY.FORMAT_ERROR_BACKTRACE);
              RAISE;   -- 오류를 삼키지 않는다
        note: "사전조건: 주 오류 코드 원인(데이터·권한·공간)을 먼저 해소, 개발 환경에서 재현 확인 · 영향: 재컴파일 순간 의존 객체 무효화 가능(업무 외 시간) · 승인: 개발팀·DBA(변경 관리) · 백업/롤백: 배포 전 dbms_metadata.get_ddl 로 현재 소스 보관, 문제 시 보관 소스로 재생성"
      check: "성공: 같은 업무에서 주 오류 미발생, 발생 시에도 백트레이스가 기록됨 · 실패: dba_errors 에 컴파일 오류 → 보관 소스로 원복"
  - stage: 3
    steps:
    - do: 개발팀·Oracle SR 전달 자료
      cmd: |
        grep -n -B5 -A8 -E "ORA-06512|ORA-00604" <app_log> | tail -200 > ora_stack_$(date +%Y%m%d).txt
        grep -n -A3 "ORA-00604" $ORACLE_BASE/diag/rdbms/<db>/<SID>/trace/alert_<SID>.log | tail -50 >> ora_stack_$(date +%Y%m%d).txt
      check: "전체 오류 스택·해당 줄 소스·트리거 목록·SYSTEM/SYSAUX 사용률"
      note: "민감정보 마스킹: 스택·SQL 안의 바인드값·업무 데이터(개인정보), 스키마의 업무명, 호스트명·IP 를 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: ORA-PROC-R6-OBJECT
  scope: id
  products: [oracle]
  category: internal
  match: [ORA-00942, ORA-04063, ORA-06508, ORA-08103, LEG-ORACLE-PLS-001-B3AE]
  title: 객체 없음·무효(INVALID)·실행 권한·동시 DDL (ORA-00942 · ORA-04063 · ORA-06508 · ORA-08103 · PLS-)
  source: "Oracle Database Error Messages (ORA-00942·ORA-04063·ORA-06508·ORA-08103·PLS-00103)·19c 'Database Reference (DBA_OBJECTS, DBA_SYNONYMS, DBA_TAB_PRIVS, DBA_ERRORS)'·'PL/SQL Packages and Types Reference (UTL_RECOMP)'·'SQL Language Reference (ANALYZE … VALIDATE STRUCTURE)'"
  stages:
  - stage: 1
    steps:
    - do: 객체 존재·상태·최근 DDL 확인 (읽기 전용)
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        set lines 200 pages 100
        select owner, object_name, object_type, status, last_ddl_time from dba_objects where object_name=upper('<object>');
        select owner, object_type, count(*) from dba_objects where status='INVALID' group by owner, object_type order by 3 desc;
        select owner, object_name, object_type, last_ddl_time from dba_objects where last_ddl_time > sysdate-1/24 order by last_ddl_time;
        EOF
      check: "결과 없음 → 배포 누락·스키마 접두어 누락(ORA-00942) · status INVALID → 컴파일 오류(ORA-04063·PLS-) · 오류 직전 last_ddl_time → 재컴파일로 패키지 상태 무효화(ORA-06508·04068) 또는 동시 TRUNCATE/파티션 DDL(ORA-08103) · 정상: VALID 이고 최근 DDL 없음(→ 권한 확인)"
      note: "적용: 10gR2~19c · 권한: SELECT_CATALOG_ROLE 또는 DBA — 1차는 DBA 에게 결과 요청 · INVALID 가 배포 직후 급증이면 배포 결함으로 개발팀 즉시 통보"
    - do: 동의어·권한·컴파일 오류·접속 컨테이너 확인 (읽기 전용)
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        set lines 200 pages 100
        select owner, synonym_name, table_owner, table_name from dba_synonyms where synonym_name=upper('<object>');
        select grantee, owner, privilege from dba_tab_privs where table_name=upper('<object>');
        select name, type, line, position, text from dba_errors where owner=upper('<owner>') and name=upper('<object>') order by sequence;
        EOF
        grep -n -B3 -A3 -E "ORA-00942|ORA-04063|ORA-06508|ORA-08103|PLS-" <app_log> | tail -40
      check: "접속 계정이 grantee(또는 롤)에 없으면 권한 원인 · 동의어가 없는 객체를 가리키면 동의어 원인 · dba_errors 의 줄·메시지가 컴파일 실패 원인(누락 객체·권한) · 정상: 권한·동의어 있음 — 이때는 접속 계정·PDB 가 맞는지 애플리케이션에서 sys_context('USERENV','CON_NAME'),'CURRENT_SCHEMA' 확인(12c+)"
      note: "적용: 10gR2~19c (CON_NAME 은 12c+ CDB) · 권한: SELECT_CATALOG_ROLE · 롤 경유 권한은 PL/SQL 정의자 권한에서 쓰이지 않으므로 직접 GRANT 여부도 확인"
  - stage: 2
    steps:
    - do: (2차·승인 후) 누락 권한·동의어 부여, 무효 객체 재컴파일
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        grant select on <owner>.<object> to <user>;
        -- 또는 실행 권한: grant execute on <owner>.<unit> to <user>;
        alter package <owner>.<pkg> compile;
        alter package <owner>.<pkg> compile body;
        exec utl_recomp.recomp_serial('<OWNER>');
        select owner, object_name, object_type from dba_objects where status='INVALID' and owner=upper('<owner>');
        EOF
      check: "성공: 마지막 조회에서 INVALID 0건, 업무 재실행 시 ORA-00942/04063/06508 미발생 · 실패: 재컴파일 후에도 INVALID → dba_errors 의 원인(누락 객체·권한)부터 해소, 권한 부여 후에도 ORA-00942 → 접속 스키마·PDB 확인"
      note: "사전조건: 부여할 최소 권한을 보안·개발 담당과 확정, 재컴파일 대상 목록 기록 · 영향: 재컴파일 순간 실행 중 세션에 ORA-04068(패키지 상태 무효) 발생 가능 — 업무 외 시간, 연결풀 재연결 필요할 수 있음 · 승인: DBA·보안 담당(권한)·개발팀 · 백업/롤백: 권한은 revoke select on <owner>.<object> from <user>; 동의어는 drop synonym, 소스는 재컴파일 전 dbms_metadata.get_ddl 로 보관 · 적용: 10gR2~19c"
    - do: (2차·승인 후) 동시 DDL 분리 또는 구조 손상 점검 (ORA-08103)
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        analyze table <owner>.<table> validate structure online;
        EOF
        rman target / <<'EOF'
        validate datafile <n>;
        EOF
      check: "성공: 동시 DDL 이 원인이면 배치(TRUNCATE·파티션 교체)와 조회 시간 분리 후 재발 없음, validate 결과 오류 없음 · 실패: ORA-01498·손상 보고 → 블록 손상(ORA-01578) 판정·절차로 전환"
      note: "사전조건: 오류 시각과 배치 DDL 시각을 먼저 대조(동시 DDL 이면 validate 불요) · 영향: validate 는 테이블·데이터파일 전체를 읽어 I/O 부하가 큼(업무 외 시간) · 승인: DBA·업무 담당 · 백업/롤백: 조회·검사만 하므로 데이터 변경 없음, 배치 일정 변경은 이전 crontab 사본 보관 후 원복 가능 · 적용: 10gR2~19c"
  - stage: 3
    steps:
    - do: 개발팀·Oracle SR 전달 자료
      cmd: |
        sqlplus -s / as sysdba <<'EOF' > ora_obj_$(date +%Y%m%d).txt
        select owner, object_name, object_type, status, last_ddl_time from dba_objects where status='INVALID';
        select owner, name, type, line, text from dba_errors order by owner, name, sequence;
        EOF
      check: "INVALID 목록·컴파일 오류·배포 이력·오류 스택"
      note: "민감정보 마스킹: 스키마·객체 이름의 업무명, 소스 안 업무 상수·계정명, 호스트명·IP 를 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: ORA-PROC-R6-DBSTATE
  scope: id
  products: [oracle]
  category: internal
  match: [ORA-16000, ORA-01089, ORA-01142]
  title: DB 역할·열림 모드·종료 진행·백업 모드 상태 충돌 (ORA-16000 · ORA-01089 · ORA-01142)
  source: "Oracle Database Error Messages (ORA-16000·ORA-01089·ORA-01142)·19c 'Database Reference (V$DATABASE, V$INSTANCE, V$PDBS, V$BACKUP, V$ACTIVE_SERVICES)'·'Data Guard Concepts and Administration'·'Administrator's Guide (Starting Up and Shutting Down)'·'Backup and Recovery User's Guide (User-Managed Backups: BEGIN/END BACKUP)'"
  stages:
  - stage: 1
    steps:
    - do: DB 역할·열림 모드·백업 모드 확인 (읽기 전용)
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        set lines 200
        select database_role, open_mode from v$database;
        select instance_name, status, logins, shutdown_pending from v$instance;
        select name, open_mode from v$pdbs;
        select name from v$active_services;
        select file#, status, change#, time from v$backup where status='ACTIVE';
        EOF
      check: "ORA-16000: role 이 PHYSICAL STANDBY 이거나 open_mode READ ONLY(WITH APPLY)·대상 PDB READ ONLY 면 확정 — 쓰기 업무가 읽기 전용 DB/서비스로 접속 · ORA-01089: shutdown_pending YES 또는 접속 불가면 종료 진행 · ORA-01142: v$backup ACTIVE 가 없으면 이미 END BACKUP 된 정상 상태(스크립트 중복 호출) · 정상: PRIMARY·READ WRITE·OPEN"
      note: "적용: v$pdbs 는 12c+ CDB, 11gR2 는 해당 줄 생략 · 권한: SYSDBA 또는 SELECT_CATALOG_ROLE — 종료 진행 중이면 신규 접속이 안 될 수 있음"
    - do: 종료·백업 작업 주체 확인 (읽기 전용)
      cmd: |
        grep -n -E "Shutting down|SHUTDOWN|Instance shutdown|alter database (begin|end) backup|ALTER TABLESPACE .* BACKUP" $ORACLE_BASE/diag/rdbms/<db>/<SID>/trace/alert_<SID>.log | tail -20
        crontab -l -u oracle 2>/dev/null | grep -v "^#"
        crsctl stat res -t 2>/dev/null | head -40
      check: "종료 명령 시각이 변경 일정·cron·클러스터웨어 작업과 일치하면 계획 종료, 아니면 종료 주체 추적(2차) · 백업 스크립트의 BEGIN/END 순서와 실패 처리 확인"
      note: "적용: alert log 는 11g+ ADR 경로, crsctl 은 RAC·Oracle Restart(11gR2+) · 권한: oracle OS 계정(crontab -u 는 root 필요할 수 있음 — oracle 계정은 crontab -l)"
  - stage: 2
    steps:
    - do: (2차·승인 후) 쓰기 업무 접속 대상을 primary 서비스로 정정 (ORA-16000)
      cmd: |
        cp -p $TNS_ADMIN/tnsnames.ora $TNS_ADMIN/tnsnames.ora.bak_$(date +%Y%m%d)
        vi $TNS_ADMIN/tnsnames.ora      # 쓰기 업무 별칭의 SERVICE_NAME 을 primary 서비스로
        tnsping <alias>
      check: "성공: 애플리케이션 재접속 후 v$database role PRIMARY 로 접속, ORA-16000 미발생 · 실패: tnsping 오류 → 백업본 복원"
      note: "사전조건: Data Guard 구성에서 읽기 전용 서비스와 쓰기 서비스 이름을 DBA 와 확정, 연결풀 재기동 일정 합의 · 영향: 별칭을 쓰는 모든 클라이언트 접속 대상이 바뀜 · 승인: DBA·애플리케이션 담당 · 백업/롤백: tnsnames.ora.bak 복원 · 적용: 11gR2~19c (TNS_ADMIN 미설정 시 $ORACLE_HOME/network/admin)"
    - do: (2차·승인 후) PDB 읽기·쓰기 전환 또는 비계획 종료 뒤 기동
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        alter pluggable database <pdb> close immediate;
        alter pluggable database <pdb> open read write;
        -- 인스턴스가 내려갔을 때(원인 조치 후): startup
        select instance_name, status from v$instance;
        EOF
      check: "성공: v$pdbs open_mode READ WRITE 또는 v$instance OPEN · 실패: ORA-65054 등 열기 오류 → 원래 모드(read only)로 다시 열고 3차"
      note: "사전조건: 읽기 전용으로 둔 이유(점검·복제 대상)를 DBA 가 확인, 비계획 종료면 alert log 의 종료 직전 오류(ORA-00600·자원 고갈)를 먼저 조치 · 영향: PDB close 동안 그 PDB 업무 중단 · 승인: DBA·서비스 담당 · 백업/롤백: 원복은 alter pluggable database <pdb> close immediate; open read only; · 적용: 12c+ CDB (11gR2 는 startup 만)"
    - do: (2차·승인 후) 백업 스크립트 BEGIN/END 처리 수정 (ORA-01142)
      config:
        file: 사용자 관리 백업 스크립트
        snippet: |
          -- END 전에 ACTIVE 파일이 있을 때만 수행
          select count(*) from v$backup where status='ACTIVE';
          alter database end backup;        -- 10g+: 모든 ACTIVE 파일 일괄 종료
        note: "사전조건: 백업 파일 완전성(BEGIN 실패로 빠진 파일 여부)을 백업 담당이 확인 · 영향: 스크립트 수정 전까지 백업 결과 신뢰 불가 — 필요 시 백업 재수행 · 승인: DBA·백업 담당 · 백업/롤백: 수정 전 스크립트 사본 보관 후 원복 가능"
      check: "성공: 다음 백업에서 ORA-01142 미발생, v$backup ACTIVE 0건으로 종료 · 실패: 백업 중 비정상 종료로 ACTIVE 가 남으면 ORA-01113 판정(데이터파일 절차)으로"
  - stage: 3
    steps:
    - do: Oracle SR 자료
      cmd: |
        grep -n -B5 -A5 -E "ORA-16000|ORA-01089|ORA-01142|Shutting down" $ORACLE_BASE/diag/rdbms/<db>/<SID>/trace/alert_<SID>.log | tail -200 > ora_state_$(date +%Y%m%d).txt
      check: "alert log 발췌·v$database/v$instance 결과·백업 스크립트·Data Guard 구성(dgmgrl show configuration)"
      note: "민감정보 마스킹: 호스트명·IP·서비스 이름의 업무명·스크립트 안 계정명을 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: ORA-PROC-R6-CLIENT
  scope: id
  products: [oracle]
  category: internal
  match: [ORA-01013, ORA-01041]
  title: 클라이언트 작업 취소·연결 핸들 오류 — 타임아웃·서버 프로세스 종료·버전 (ORA-01013 · ORA-01041)
  source: "Oracle Database Error Messages (ORA-01013·ORA-01041)·19c 'Database Reference (V$SQL, V$SESSION, V$VERSION)'·'JDBC Developer's Guide (Statement.setQueryTimeout)'·'Net Services Reference (sqlnet.ora TRACE_LEVEL_CLIENT)'"
  stages:
  - stage: 1
    steps:
    - do: 취소·오류 직전 상황과 타임아웃 설정 확인 (읽기 전용)
      cmd: |
        grep -n -B10 -E "ORA-01013|ORA-01041" <app_log> | tail -60
        grep -rn -i -E "queryTimeout|query-timeout|defaultStatementTimeout|transaction-timeout|TransactionTimeout" <was_config_dir> | head -20
      check: "ORA-01013 직전 대기 시간이 queryTimeout·트랜잭션 타임아웃과 같으면 타임아웃 취소(SQL 지연이 원인) · ORA-01041 직전에 ORA-03113/03135 가 있으면 끊긴 연결 핸들 재사용 · 정상: 일회성 사용자 취소(Ctrl+C)"
      note: "적용: 모든 버전(애플리케이션·WAS 설정 기준) · 권한: 애플리케이션 로그·설정 읽기"
    - do: SQL 수행 시간·잠금 대기·서버측 비정상 종료 확인 (읽기 전용)
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        set lines 200
        select sql_id, executions, round(elapsed_time/1e6/greatest(executions,1),1) avg_sec from v$sql where sql_text like '%<식별 문자열>%' fetch first 5 rows only;
        select sid, blocking_session, event, seconds_in_wait from v$session where blocking_session is not null;
        select banner from v$version;
        EOF
        grep -n -E "ORA-00600|ORA-07445|ORA-03113|ORA-04030" $ORACLE_BASE/diag/rdbms/<db>/<SID>/trace/alert_<SID>.log | tail -20
        sqlplus -v
      check: "avg_sec 가 타임아웃 값에 근접하면 SQL 튜닝 대상, 잠금 대기가 있으면 ORA-PROC-LOCK(잠금) 판정으로 · 같은 시각 ORA-00600/07445 가 있으면 서버 프로세스 비정상 종료(ORA-01041 원인) · 클라이언트(sqlplus -v·JDBC/OCI 드라이버) 버전이 DB 와 지원 조합이 아니면 버전 원인"
      note: "적용: fetch first 는 12c+ (11gR2 는 rownum 서브쿼리) · 권한: SELECT_CATALOG_ROLE — 1차는 DBA 에게 결과 요청 · JDBC 는 애플리케이션 lib 의 ojdbc*.jar 이름·MANIFEST 로 버전 확인"
  - stage: 2
    steps:
    - do: (2차·승인 후) 타임아웃 값·연결풀 검증 설정 조정
      config:
        file: WAS 데이터소스·애플리케이션 설정
        snippet: |
          queryTimeout = <SQL 정상 수행 시간 × 2 이상>     # 근본 조치는 SQL 튜닝
          testOnBorrow = true / validationQuery = select 1 from dual   # 끊긴 연결 재사용 방지(ORA-01041)
        note: "사전조건: SQL 평균 수행 시간·잠금 여부 확인 후 값 산정, 튜닝 요청과 함께 진행 · 영향: 타임아웃 상향은 지연 SQL 이 더 오래 자원 점유, 검증 쿼리는 대여마다 왕복 1회 추가 · 승인: 애플리케이션 담당·DBA · 백업/롤백: 변경 전 설정 파일 사본 보관, 원래 값으로 원복 후 재배포"
      check: "성공: ORA-01013/01041 재발 감소, 업무 응답 정상 · 실패: 지속 → SQL 튜닝(sql_id 전달) 또는 클라이언트 트레이스 수집"
    - do: (2차·승인 후) 클라이언트 Net 트레이스 임시 수집 (ORA-01041 반복 시)
      config:
        file: 클라이언트 $TNS_ADMIN/sqlnet.ora
        snippet: |
          TRACE_LEVEL_CLIENT = 16
          TRACE_DIRECTORY_CLIENT = <trace_dir>
        note: "사전조건: 트레이스 디렉터리 디스크 여유 확인, 재현 시간대 합의 · 영향: 트레이스 파일이 빠르게 커지고 응답이 느려질 수 있음(짧게만) · 승인: 애플리케이션 담당·DBA · 백업/롤백: 수정 전 sqlnet.ora 사본 보관, 수집 후 두 줄 제거로 원복"
      check: "성공: 오류 시각의 트레이스 파일 확보 후 설정 원복 · 실패: 파일 미생성 → TNS_ADMIN 경로·디렉터리 권한 확인"
  - stage: 3
    steps:
    - do: Oracle SR 자료
      cmd: |
        tar czf ora_client_$(date +%Y%m%d).tgz <trace_dir> <app_log>
      check: "클라이언트 트레이스·애플리케이션 오류 스택·드라이버/DB 버전·타임아웃 설정"
      note: "민감정보 마스킹: 트레이스의 SQL 바인드값·패킷 덤프(개인정보), 사용자명·호스트명·IP 를 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: ORA-PROC-R6-OSCALL
  scope: id
  products: [oracle]
  category: internal
  match: [ORA-27300]
  title: OS 시스템 호출 실패 — 프로세스·세마포어·공유 메모리·파일 디스크립터 한도 (ORA-27300 · ORA-27301 · ORA-27302)
  source: "Oracle Database Error Messages (ORA-27300·ORA-27301·ORA-27302)·19c 'Grid Infrastructure/Database Installation Guide for Linux (Configuring Kernel Parameters, Resource Limits: nproc·nofile·kernel.sem)'"
  stages:
  - stage: 1
    steps:
    - do: 실패한 시스템 호출·OS 오류 문구 확인 (읽기 전용)
      cmd: |
        grep -n -A3 "ORA-27300" $ORACLE_BASE/diag/rdbms/<db>/<SID>/trace/alert_<SID>.log | tail -30
      check: "ORA-27300 의 호출 이름(fork·semget·shmget)과 ORA-27301 의 OS 문구로 원인 구분 — 'Resource temporarily unavailable'+fork = 프로세스 수(nproc), 'No space left on device'+semget = 세마포어(kernel.sem), 'Cannot allocate memory' = 메모리, 'Too many open files' = nofile"
      note: "적용: 11g+ ADR 경로 · 권한: oracle OS 계정"
    - do: OS 한도·사용량 확인 (읽기 전용)
      cmd: |
        ulimit -a
        ps -u oracle | wc -l
        ipcs -ls ; sysctl kernel.sem kernel.shmmax kernel.shmall fs.file-max
        free -m
      check: "ps 개수가 ulimit -u(max user processes)에 근접하면 nproc · ipcs -ls 의 사용 세마포어가 kernel.sem 한도에 근접하면 세마포어 · free 여유가 거의 없으면 메모리 · 정상: 모두 한도의 80% 미만"
      note: "적용: Linux (AIX: lsattr -El sys0 -a maxuproc, ipcs -a · Solaris: prctl -n project.max-sem-ids) · 권한: oracle 계정(ulimit 은 해당 계정 세션 기준 — 리스너·DB 를 띄운 계정으로 확인)"
  - stage: 2
    steps:
    - do: (2차·승인 후) 원인 한도 상향
      cmd: |
        cp -p /etc/security/limits.conf /etc/security/limits.conf.bak_$(date +%Y%m%d)
        cp -p /etc/sysctl.conf /etc/sysctl.conf.bak_$(date +%Y%m%d)
        vi /etc/security/limits.conf    # oracle soft/hard nproc·nofile
        vi /etc/sysctl.conf              # kernel.sem = <SEMMSL> <SEMMNS> <SEMOPM> <SEMMNI>
        sysctl -p
      check: "성공: sysctl kernel.sem 새 값 반영, oracle 재로그인 후 ulimit -u/-n 새 값, ORA-27300 미발생 · 실패: sysctl -p 오류(문법) → 백업본 복원 후 sysctl -p"
      note: "사전조건: 설치 안내서 최소값·현재 사용량 근거로 값 산정, 프로세스 폭주(접속 누수)가 원인이면 그 원인 먼저 해소 · 영향: limits.conf 는 새 로그인·새로 띄운 프로세스부터 적용(DB·리스너는 다음 기동 때), sysctl 은 즉시 반영 · 승인: 시스템 담당·DBA · 백업/롤백: .bak 파일 복원 후 sysctl -p · 적용: Linux (systemd 로 기동하면 서비스 단위 LimitNPROC/LimitNOFILE 도 확인)"
  - stage: 3
    steps:
    - do: Oracle SR 자료
      cmd: |
        { ulimit -a ; ipcs -ls ; sysctl -a 2>/dev/null | grep -E "kernel.sem|kernel.shm|fs.file" ; } > ora_oslimit_$(date +%Y%m%d).txt
        grep -n -A3 "ORA-27300" $ORACLE_BASE/diag/rdbms/<db>/<SID>/trace/alert_<SID>.log | tail -50 >> ora_oslimit_$(date +%Y%m%d).txt
      check: "alert log ORA-27300/27301/27302·OS 한도·프로세스 수·메모리"
      note: "민감정보 마스킹: 호스트명·계정명·경로를 가린 뒤 전달 · 전달 승인: DBA·시스템 담당 확인 후 보안 담당 승인"

- id: ORA-PROC-R6-SHAREDSRV
  scope: id
  products: [oracle]
  category: internal
  match: [LEG-ORACLE-ORA-001-0AEE]
  title: ORA-001xx 대역 — 공유 서버·디스패처·리스너 파라미터·XA 분산 트랜잭션
  source: "Oracle Database Error Messages (ORA-00100~ORA-00199)·19c 'Administrator's Guide (Configuring Oracle Database for Shared Server)'·'Database Reference (DISPATCHERS, SHARED_SERVERS, MAX_SHARED_SERVERS, LOCAL_LISTENER, REMOTE_LISTENER, V$DISPATCHER, V$SHARED_SERVER, DBA_2PC_PENDING)'·'Administrator's Guide (Managing Distributed Transactions: COMMIT/ROLLBACK FORCE)'"
  stages:
  - stage: 1
    steps:
    - do: 정확한 번호와 공식 문구 확인 (읽기 전용)
      cmd: |
        grep -n -E "ORA-001[0-9][0-9]" $ORACLE_BASE/diag/rdbms/<db>/<SID>/trace/alert_<SID>.log | tail -20
        oerr ora <번호>
      check: "00101~00118 = 공유 서버·디스패처, 00119·00132 = LOCAL/REMOTE_LISTENER 값 해석 실패(기동·등록 실패), 00150~00165 = XA 분산 트랜잭션 — 신규 접속 실패가 같이 있으면 심각"
      note: "적용: oerr 는 Unix/Linux 의 $ORACLE_HOME/bin (Windows 는 오류 메시지 문서) · 권한: oracle OS 계정"
    - do: 디스패처·공유 서버·리스너 파라미터·미결 분산 트랜잭션 확인 (읽기 전용)
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        set lines 200
        show parameter dispatchers
        show parameter shared_servers
        show parameter listener
        select name, status, accept, messages from v$dispatcher;
        select status, count(*) from v$shared_server group by status;
        select local_tran_id, global_tran_id, state, fail_time from dba_2pc_pending;
        EOF
        tnsping <local_listener 별칭>
      check: "local_listener 별칭이 tnsping 으로 해석되지 않으면 ORA-00119/00132 · v$shared_server 가 max_shared_servers 에 닿았으면 공유 서버 한도 · dba_2pc_pending 에 행이 있으면 미결 XA 트랜잭션(WAS 트랜잭션 매니저와 대조) · 정상: 디스패처 accept YES, 미결 0건"
      note: "적용: 10gR2~19c · 권한: SYSDBA 또는 SELECT_CATALOG_ROLE — 1차는 DBA 에게 결과 요청"
  - stage: 2
    steps:
    - do: (2차·승인 후) LOCAL_LISTENER/REMOTE_LISTENER 값 정정
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        create pfile='/tmp/init<SID>_before.ora' from spfile;
        alter system set local_listener='(ADDRESS=(PROTOCOL=TCP)(HOST=<host>)(PORT=<port>))' scope=both;
        alter system register;
        EOF
        lsnrctl services <listener>
      check: "성공: lsnrctl services 에 서비스 READY, ORA-00119/00132 미발생 · 실패: ORA-00119 지속 → 값 형식 확인, 기동 실패 시 백업 pfile 로 startup"
      note: "사전조건: listener.ora 의 실제 HOST/PORT 확인, pfile 백업(첫 줄) · 영향: 등록 변경 동안 신규 접속이 잠시 다른 경로로 갈 수 있음 · 승인: DBA·서비스 담당 · 백업/롤백: 이전 값으로 alter system set local_listener='<이전값>' scope=both, 기동 실패 시 startup pfile='/tmp/init<SID>_before.ora' · 적용: 10gR2~19c (RAC 는 SID='*' 와 remote_listener=SCAN)"
    - do: (2차·승인 후) 공유 서버 한도 상향 또는 미결 XA 트랜잭션 처리
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        alter system set max_shared_servers=<값> scope=both;
        -- 미결 XA: 트랜잭션 매니저 기록과 대조해 결정한 경우만
        -- commit force '<local_tran_id>';   또는   rollback force '<local_tran_id>';
        EOF
      check: "성공: 공유 서버 대기 해소·ORA-001xx 미발생, dba_2pc_pending 해당 행 상태 forced commit/rollback · 실패: 한도 상향 후에도 대기 → 전용 서버(SERVER=DEDICATED) 접속 검토"
      note: "사전조건: XA 처리는 WAS 트랜잭션 로그로 커밋/롤백 방향을 업무 담당이 결정 — 잘못 결정하면 데이터 불일치 · 영향: 공유 서버 증가는 메모리 사용 증가 · 승인: DBA·업무 담당 · 백업/롤백: 파라미터는 이전 값으로 원복, force 처리는 되돌릴 수 없어 처리 전 dba_2pc_pending 결과 보관 · 적용: 10gR2~19c"
  - stage: 3
    steps:
    - do: Oracle SR 자료
      cmd: |
        grep -n -B3 -A5 -E "ORA-001[0-9][0-9]" $ORACLE_BASE/diag/rdbms/<db>/<SID>/trace/alert_<SID>.log | tail -200 > ora_001xx_$(date +%Y%m%d).txt
      check: "alert log 발췌·파라미터·v$dispatcher·dba_2pc_pending·WAS 트랜잭션 로그"
      note: "민감정보 마스킹: 호스트명·IP·포트·트랜잭션 ID 안 업무 식별자를 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

