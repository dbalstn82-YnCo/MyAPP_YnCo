- id: ALT-PROC-R6-PROTOCOL
  scope: id
  products: [altibase]
  category: connection
  match: [ERR-51024, ERR-7101D, ERR-51039, ERR-91015]
  title: 클라이언트·서버·이중화 프로토콜 버전 불일치 (ERR-7101D · ERR-51039 · ERR-91015 · ERR-51024)
  source: "Altibase 7.1 Error Message Reference(ERR-51024·7101D·51039·91015)·General Reference '성능 뷰(V$VERSION, V$SESSION, V$PROPERTY)'·Replication Manual"
  verify_note: "미검증 — V$VERSION 의 프로토콜 버전 컬럼 이름(PROTOCOL_VERSION·REPL_PROTOCOL_VERSION)을 7.x 매뉴얼로 확인하지 못해 SELECT * 로 조회한다"
  stages:
  - stage: 1
    steps:
    - do: 발생 시각·출처 IP 확인 (읽기 전용)
      cmd: |
        grep -rn -E "ERR-(51024|7101D|51039|91015)" $ALTIBASE_HOME/trc | tail -20
      check: "같은 클라이언트 IP 반복이면 그 클라이언트 드라이버 원인 · altibase_rp.log 의 ERR-51024 는 이중화 상대 서버와의 버전 차이(한쪽만 패치한 직후 흔함)"
      note: "적용: Altibase 6.5/7.x trc 경로 · 권한: altibase OS 계정"
    - do: 서버·클라이언트 버전 대조 (읽기 전용)
      cmd: |
        isql -s localhost -u sys          # 비밀번호는 프롬프트에서 입력
        iSQL> SELECT * FROM V$VERSION;
        iSQL> SELECT CLIENT_TYPE, CLIENT_PACKAGE_VERSION, CLIENT_PROTOCOL_VERSION, COUNT(*) FROM V$SESSION GROUP BY CLIENT_TYPE, CLIENT_PACKAGE_VERSION, CLIENT_PROTOCOL_VERSION;
        iSQL> SELECT NAME, VALUE1 FROM V$PROPERTY WHERE NAME IN ('PORT_NO','REPLICATION_PORT_NO');
        iSQL> quit
        ls -l <app_lib>/Altibase*.jar
      check: "클라이언트 패키지·프로토콜 버전이 서버보다 상위이거나 지원 범위 밖이면 확정(ERR-7101D·91015) · 애플리케이션이 PORT_NO 가 아닌 포트(이중화 포트·다른 서비스)로 접속하면 ERR-51039 · 이중화 양쪽 V$VERSION 이 다르면 ERR-51024"
      note: "적용: Altibase 6.5/7.x (V$SESSION 클라이언트 컬럼은 7.1 기준) · 권한: SYS — 1차는 DBA 에게 결과 요청"
  - stage: 2
    steps:
    - do: (2차·승인 후) 호환 드라이버 배포 또는 이중화 양쪽 버전 일치
      cmd: |
        cp -p <app_lib>/Altibase.jar <backup_dir>/Altibase.jar.bak_$(date +%Y%m%d)
        cp -p <서버 버전에 맞는 드라이버> <app_lib>/Altibase.jar
        # 이중화(ERR-51024): 버전이 다른 동안 해당 이중화는 멈춘 채 두고 양쪽 패키지 버전을 맞춘 뒤 ALTER REPLICATION <rep> START
      check: "성공: 애플리케이션 재기동 후 오류 미발생, V$SESSION 클라이언트 버전이 지원 조합 · 실패: 같은 오류 → 백업 드라이버로 원복 후 기술지원"
      note: "사전조건: 서버 버전과 지원되는 드라이버 버전을 기술지원 문서로 확인, 애플리케이션 재기동 일정 합의 · 영향: 애플리케이션 재기동 동안 서비스 중단, 이중화 중지 동안 갭 누적 · 승인: 애플리케이션 담당·DBA · 백업/롤백: 이전 드라이버 사본(첫 줄)으로 원복, 패치는 이전 패키지로 원복 · 적용: Altibase 6.5/7.x"
  - stage: 3
    steps:
    - do: Altibase 기술지원 자료
      cmd: |
        tar czf altibase_proto_$(date +%Y%m%d).tgz $ALTIBASE_HOME/trc $ALTIBASE_HOME/conf/altibase.properties
      check: "trc 로그·서버/클라이언트 버전·V$SESSION 분포·properties"
      note: "민감정보 마스킹: properties·trc 의 IP·포트·사용자명·SQL 바인드값을 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: ALT-PROC-R6-DISCONNECT
  scope: id
  products: [altibase]
  category: connection
  match: [ERR-5104F, ERR-5105A, ERR-71015, ERR-71018, ERR-71019, ERR-0106B, ERR-91020]
  title: 세션 단절·시간 초과·소켓 시스템 호출 실패 (ERR-5104F · 5105A · 71015 · 71018 · 71019 · 0106B · 91020)
  source: "Altibase 7.1 Error Message Reference(ERR-5104F·5105A·71015·71018·71019·0106B·91020)·General Reference '프로퍼티(QUERY_TIMEOUT, FETCH_TIMEOUT, UTRANS_TIMEOUT, IDLE_TIMEOUT, MAX_CLIENT)'·'성능 뷰(V$SESSION, V$PROPERTY)'·Administrator's Manual 'trc 로그'"
  stages:
  - stage: 1
    steps:
    - do: 단절 기록·시간 초과 설정 확인 (읽기 전용)
      cmd: |
        grep -rn -E "ERR-(5104F|5105A|71015|71018|71019|0106B|91020)|timeout" $ALTIBASE_HOME/trc | tail -30
        isql -s localhost -u sys          # 비밀번호는 프롬프트에서 입력
        iSQL> SELECT NAME, VALUE1 FROM V$PROPERTY WHERE NAME IN ('QUERY_TIMEOUT','FETCH_TIMEOUT','UTRANS_TIMEOUT','IDLE_TIMEOUT','MAX_CLIENT');
        iSQL> SELECT COUNT(*) FROM V$SESSION;
        iSQL> quit
      check: "같은 시각 timeout 기록이면 서버 timeout 종료(5104F·5105A — IDLE_TIMEOUT 보다 긴 유휴 뒤 첫 쿼리) · 세션 수가 MAX_CLIENT 근처면 접속 폭주(71015) · 한 클라이언트에 몰리면 그 클라이언트 비정상 종료(71018·71019·0106B)"
      note: "적용: Altibase 6.5/7.x · 권한: SYS — 1차는 DBA 에게 결과 요청"
    - do: 파일 디스크립터·TCP 연결·애플리케이션 직전 오류 확인 (읽기 전용)
      cmd: |
        ps -ef | grep [a]ltibase
        ls /proc/<PID>/fd | wc -l ; grep "open files" /proc/<PID>/limits
        ss -tn state established "( sport = :<PORT_NO> )" | wc -l
        netstat -s | grep -i reset
        grep -n -B10 -E "ERR-5105A|ERR-91020" <app_log> | tail -40
      check: "FD 사용이 한도 근처면 select() 실패(71015) · netstat reset 수가 1분 사이 크게 늘면 네트워크·방화벽 단절 · 앱 로그에서 직전 단절(5104F)·로그인 실패(ERR-4102E 등) 뒤 같은 연결로 실행했으면 5105A·91020(연결 재사용·접속 실패 미처리) · 정상: 일회성"
      note: "적용: Linux (/proc·ss 기준, AIX 는 procfiles <PID>·netstat -an) · 권한: altibase OS 계정(다른 계정 /proc 는 root)"
  - stage: 2
    steps:
    - do: (2차·승인 후) 시간 초과 프로퍼티 조정
      cmd: |
        cp -p $ALTIBASE_HOME/conf/altibase.properties $ALTIBASE_HOME/conf/altibase.properties.bak_$(date +%Y%m%d)
        isql -s localhost -u sys
        iSQL> ALTER SYSTEM SET IDLE_TIMEOUT = <초>;
        iSQL> SELECT NAME, VALUE1 FROM V$PROPERTY WHERE NAME='IDLE_TIMEOUT';
        # 재기동 후에도 유지하려면 altibase.properties 의 같은 항목도 수정
      check: "성공: V$PROPERTY 새 값, 같은 패턴의 5104F·5105A 재발 감소 · 실패: ALTER SYSTEM 미지원(정적 프로퍼티) 오류 → properties 수정 후 정기 점검 시 재기동"
      note: "사전조건: 장시간 쿼리·유휴 연결이 정상 업무인지 확인(쿼리 튜닝이 우선), 현재 값 기록 · 영향: timeout 상향은 비정상 세션도 오래 유지 · 승인: DBA·애플리케이션 담당 · 백업/롤백: ALTER SYSTEM SET <property> = <이전값> 과 properties 백업본 복원 · 적용: Altibase 6.5/7.x (동적 변경 가능 여부는 General Reference 프로퍼티 속성 확인)"
    - do: (2차·승인 후) 연결 풀 검증·FD 한도 조정
      config:
        file: WAS 데이터소스 설정 · /etc/security/limits.conf
        snippet: |
          testOnBorrow = true / validationQuery = SELECT 1 FROM DUAL     # 끊긴 연결 재사용 방지(5105A·91020)
          <altibase_user> soft nofile <값>  /  <altibase_user> hard nofile <값>   # 71015 FD 한도
        note: "사전조건: 변경 전 설정값 기록, FD 한도는 MAX_CLIENT·데이터파일 수로 산정 · 영향: 풀 검증은 대여마다 왕복 추가, limits 는 서버 재기동 후 적용 · 승인: 애플리케이션 담당·시스템 담당·DBA · 백업/롤백: 설정 파일 사본 보관 후 원복"
      check: "성공: 단절 뒤 자동 재연결, 71015 미발생 · 실패: 지속 → 네트워크 담당과 방화벽 idle timeout 대조"
  - stage: 3
    steps:
    - do: Altibase 기술지원 자료
      cmd: |
        tar czf altibase_conn_$(date +%Y%m%d).tgz $ALTIBASE_HOME/trc $ALTIBASE_HOME/conf/altibase.properties
      check: "trc 로그·properties·세션/FD/네트워크 조회 결과·애플리케이션 로그 발췌"
      note: "민감정보 마스킹: 클라이언트 IP·사용자명·SQL 바인드값·호스트명을 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: ALT-PROC-R6-ADDR
  scope: id
  products: [altibase]
  category: connection
  match: [ERR-51192, ERR-51067]
  title: 접속 호스트명 해석·포트 미지정 (ERR-51192 · ERR-51067)
  source: "Altibase 7.1 Error Message Reference(ERR-51192·ERR-51067)·Administrator's Manual '환경변수(ALTIBASE_PORT_NO)'·'altibase.properties(PORT_NO)'·iSQL User's Manual(-s, -port)"
  stages:
  - stage: 1
    steps:
    - do: 호스트명 해석 확인 (ERR-51192, 읽기 전용)
      cmd: |
        getent hosts <서버명> ; getent hosts localhost
        grep -n "localhost" /etc/hosts ; cat /etc/resolv.conf
      check: "결과가 없거나 localhost 가 ::1 만 돌려주면 확정 — is 스크립트·접속 문자열의 서버 값을 IP 또는 해석되는 이름으로 · 정상: IPv4 주소로 해석"
      note: "적용: Linux/Unix · 권한: 일반 사용자"
    - do: 포트 지정 확인 (ERR-51067, 읽기 전용)
      cmd: |
        echo "ALTIBASE_PORT_NO=$ALTIBASE_PORT_NO"
        grep -n "^PORT_NO" $ALTIBASE_HOME/conf/altibase.properties
        grep -n -i -E "PORT_NO|jdbc:Altibase" <app_config>
      check: "접속 문자열 PORT_NO 와 ALTIBASE_PORT_NO 가 모두 비어 있으면 확정 · 값이 서버 PORT_NO 와 다르면 포트 불일치"
      note: "적용: Altibase 6.5/7.x · 권한: 일반 사용자(properties 읽기는 altibase 계정)"
  - stage: 2
    steps:
    - do: (2차·승인 후) 접속 문자열·환경변수·hosts 정정
      cmd: |
        cp -p <app_config> <app_config>.bak_$(date +%Y%m%d)
        vi <app_config>        # 서버 주소(IP 또는 해석되는 이름)·PORT_NO 지정
        isql -s <server> -port <port> -u <user>      # 비밀번호는 프롬프트에서 입력, 접속 확인 후 quit
      check: "성공: isql·애플리케이션 접속 성공, ERR-51192/51067 미발생 · 실패: 같은 오류 → 백업본 복원, /etc/hosts 등록은 시스템 담당"
      note: "사전조건: 올바른 서버 주소·포트를 DBA 와 확정 · 영향: 같은 설정을 쓰는 모든 프로그램 접속 대상 변경 · 승인: DBA·애플리케이션 담당(hosts 는 시스템 담당) · 백업/롤백: .bak 복원 · 적용: Altibase 6.5/7.x"
  - stage: 3
    steps:
    - do: Altibase 기술지원 자료
      cmd: |
        { getent hosts <서버명> ; echo "ALTIBASE_PORT_NO=$ALTIBASE_PORT_NO" ; grep -n "^PORT_NO" $ALTIBASE_HOME/conf/altibase.properties ; } > alt_addr_$(date +%Y%m%d).txt
      check: "이름 해석 결과·포트 설정·접속 문자열(비밀번호 제외)"
      note: "민감정보 마스킹: 호스트명·IP·포트·접속 문자열의 계정을 가리고 비밀번호는 절대 포함하지 않음 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: ALT-PROC-R6-DATAFILE
  scope: id
  products: [altibase]
  category: storage
  match: [ERR-11025, ERR-11027, ERR-11036]
  title: 데이터파일 이미 존재·없음·사용 중 삭제 시도 (ERR-11025 · ERR-11027 · ERR-11036)
  source: "Altibase 7.1 Error Message Reference(ERR-11025·11027·11036)·General Reference '성능 뷰(V$DATAFILES, V$TABLESPACES)'·Administrator's Manual '테이블스페이스·데이터파일 관리'·'trc 로그(altibase_boot.log)'"
  stages:
  - stage: 1
    steps:
    - do: DB 가 아는 데이터파일·상태 확인 (읽기 전용)
      cmd: |
        isql -s localhost -u sys          # 비밀번호는 프롬프트에서 입력
        iSQL> SELECT ID, NAME, SPACEID, STATE FROM V$DATAFILES;
        iSQL> SELECT ID, NAME, STATE FROM V$TABLESPACES;
        iSQL> quit
        tail -50 $ALTIBASE_HOME/trc/altibase_boot.log
      check: "생성하려는 이름이 목록에 있으면 사용 중 파일 — 절대 손대지 않음(ERR-11025) · 목록의 파일이 디스크에 없으면 ERR-11027 · 한 번이라도 쓴 파일을 DROP 하려 했다면 ERR-11036(설계상 불가) · 기동 중 실패면 boot log 의 파일명 확인"
      note: "적용: Altibase 6.5/7.x · 권한: SYS — 1차는 DBA 에게 결과 요청(기동 실패 시 boot log 만)"
    - do: OS 파일·마운트 확인 (읽기 전용)
      cmd: |
        ls -l <path>
        df -h <mount> ; mount | grep <mount>
      check: "DB 에 없는 잔여 파일이 같은 이름으로 있으면 이전 실패 작업 잔여(11025) · 미마운트·경로 오류면 11027 원인 확정"
      note: "적용: Linux/Unix · 권한: altibase OS 계정"
  - stage: 2
    steps:
    - do: (2차·승인 후) 이름 충돌 회피·마운트 복구·파일 복원
      cmd: |
        isql -s localhost -u sys
        iSQL> ALTER TABLESPACE <TS> ADD DATAFILE '<겹치지 않는 새 이름>' SIZE <크기> AUTOEXTEND ON MAXSIZE <상한>;
        # 11027: 시스템 담당이 마운트 복구 → 안 되면 백업에서 해당 파일 복원 후 복구 절차
      check: "성공: V$DATAFILES 에 새 파일 추가 또는 누락 파일 접근 회복, 같은 오류 미발생 · 실패: 파일 유실 확정 → 백업 복원·미디어 복구(기술지원 협의)"
      note: "사전조건: 디스크 여유 확인, 잔여 파일은 DB 미사용임을 확인한 뒤에도 지우지 말고 이름만 바꿔 보관, ERR-11036 은 데이터파일 단위 삭제 대신 테이블스페이스 단위 재구성으로 계획 · 영향: 파일 생성 중 I/O 증가, 복원은 해당 테이블스페이스 사용 중단 · 승인: DBA·시스템 담당 · 백업/롤백: 작업 전 V$DATAFILES 결과 보관, 추가한 파일은 설계상 되돌리기 어려우므로 용량 계획 반영 · 적용: Altibase 6.5/7.x"
  - stage: 3
    steps:
    - do: Altibase 기술지원 자료
      cmd: |
        tar czf altibase_df_$(date +%Y%m%d).tgz $ALTIBASE_HOME/trc/altibase_boot.log $ALTIBASE_HOME/conf/altibase.properties
      check: "boot log·properties·V$DATAFILES 결과·ls/df 결과"
      note: "민감정보 마스킹: 경로의 업무명·호스트명·IP 를 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: ALT-PROC-R6-BACKUP
  scope: id
  products: [altibase]
  category: storage
  match: [ERR-11098, ERR-11018]
  title: 아카이브 모드 아님(온라인 백업 불가)·백업 파일 버전 비호환 (ERR-11098 · ERR-11018)
  source: "Altibase 7.1 Error Message Reference(ERR-11098·ERR-11018)·Administrator's Manual '백업과 복구(온라인 백업·아카이브 로그 모드)'·General Reference '성능 뷰(V$ARCHIVE, V$VERSION)'·Utilities Manual(aexport, iLoader)"
  verify_note: "미검증 — 아카이브 모드 전환 절차(CONTROL 단계에서 ALTER DATABASE ARCHIVELOG)와 V$ARCHIVE 컬럼 이름을 7.x 매뉴얼로 확인하지 못해 조회는 SELECT * 로 적는다"
  stages:
  - stage: 1
    steps:
    - do: 아카이브 모드·실행한 백업 구문 확인 (ERR-11098, 읽기 전용)
      cmd: |
        isql -s localhost -u sys          # 비밀번호는 프롬프트에서 입력
        iSQL> SELECT * FROM V$ARCHIVE;
        iSQL> SELECT * FROM V$VERSION;
        iSQL> quit
        grep -n -i "BACKUP" <backup_script>
      check: "아카이브 모드가 꺼져 있는데 온라인 백업(ALTER DATABASE BACKUP …)을 실행했으면 ERR-11098 확정 — 오프라인 백업으로 대체 가능한지 판단 · 정상: ARCHIVELOG 모드"
      note: "적용: Altibase 6.5/7.x · 권한: SYS — 1차는 DBA 에게 결과 요청"
    - do: 백업 파일과 서버의 버전 정보 대조 (ERR-11018, 읽기 전용)
      cmd: |
        grep -n -A3 "ERR-11018" $ALTIBASE_HOME/trc/altibase_boot.log | tail -20
        tail -100 $ALTIBASE_HOME/trc/altibase_boot.log
      check: "메시지의 Backup DB=>[…] 와 Server=>[…] 값(Version ID·Bit·Endian·LogSize·Transaction Table Size) 중 다른 항목 기록 — 다른 버전·플랫폼 백업이면 확정 · 복원 재시도는 2차"
      note: "적용: Altibase 7.1/7.3 · 권한: altibase OS 계정"
  - stage: 2
    steps:
    - do: (2차·승인 후) 아카이브 모드 전환 (서버 재기동 동반) 또는 오프라인 백업 사용
      cmd: |
        cp -p $ALTIBASE_HOME/conf/altibase.properties $ALTIBASE_HOME/conf/altibase.properties.bak_$(date +%Y%m%d)
        server stop
        isql -s localhost -u sys -sysdba
        iSQL(sysdba)> startup control;
        iSQL(sysdba)> alter database archivelog;
        iSQL(sysdba)> startup service;
      check: "성공: V$ARCHIVE 에 아카이브 모드 표시, 다음 온라인 백업 성공 · 실패: 기동 오류 → alter database noarchivelog(CONTROL 단계)로 원복 후 기동, 아카이브 디렉터리(ARCHIVE_DIR) 공간·권한 확인"
      note: "사전조건: 아카이브 로그 저장 공간·보관 정책 확정(ARCHIVE_DIR), 정기 점검 시간 확보 · 영향: server stop~startup service 동안 서비스 중단, 이후 아카이브 로그 누적 · 승인: DBA·서비스 담당·백업 담당 · 백업/롤백: CONTROL 단계에서 alter database noarchivelog 로 원복, properties 백업 보관 · 적용: Altibase 6.5/7.x"
    - do: (2차·승인 후) 호환 백업으로 재복원 또는 논리 이관 (ERR-11018)
      cmd: |
        cp -rp $ALTIBASE_HOME/dbs <보관 경로>/dbs_before_$(date +%Y%m%d)
        # 같은 버전·플랫폼에서 만든 백업으로 다시 복원, 버전이 다르면 원본 서버에서 aexport → 대상 서버에서 생성 스크립트·iLoader 로 이관
      check: "성공: 복원 후 서버 기동·데이터 대사 일치 · 실패: 같은 비호환 → 원본 서버 버전 확인 후 논리 이관(aexport/iLoader)으로 전환"
      note: "사전조건: 백업을 만든 서버의 버전·OS·비트 확인, 현재 데이터·로그 파일 사본 확보 · 영향: 복원·이관 동안 서비스 중단 · 승인: DBA·서비스 담당 · 백업/롤백: 작업 전 dbs·logs 디렉터리 사본(첫 줄)으로 원복 · 적용: Altibase 7.1/7.3"
  - stage: 3
    steps:
    - do: Altibase 기술지원 자료
      cmd: |
        tar czf altibase_backup_$(date +%Y%m%d).tgz $ALTIBASE_HOME/trc/altibase_boot.log $ALTIBASE_HOME/conf/altibase.properties <backup_script>
      check: "boot log·properties·백업 스크립트·V$ARCHIVE/V$VERSION 결과·백업 생성 서버 정보"
      note: "민감정보 마스킹: 스크립트의 계정명·경로·호스트명·IP 를 가리고 비밀번호는 제외 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: ALT-PROC-R6-REPMEM
  scope: id
  products: [altibase]
  category: memory
  match: [ERR-61055]
  title: 이중화 모듈 메모리 할당 실패 (ERR-61055)
  source: "Altibase 7.1 Error Message Reference(ERR-61055 rpERR_ABORT_MEMORY_ALLOC)·General Reference '성능 뷰(V$MEMSTAT, V$REPGAP, V$REPSENDER)'·Replication Manual(ALTER REPLICATION … STOP/START)·Administrator's Manual 'trc 로그(altibase_rp.log)'"
  stages:
  - stage: 1
    steps:
    - do: OS·서버 프로세스 메모리 확인 (읽기 전용)
      cmd: |
        free -m
        ps -eo pid,rss,vsz,comm --sort=-rss | head -10
      check: "OS 여유 메모리가 거의 없거나 altibase 프로세스 RSS 가 계속 커지면 메모리 원인 확정 · 정상: 여유 충분(→ 이중화 갭 누적 쪽)"
      note: "적용: Linux (AIX 는 svmon -G·ps -ef -o pid,rssize,comm) · 권한: 일반 사용자"
    - do: 모듈별 메모리·이중화 갭 확인 (읽기 전용)
      cmd: |
        isql -s localhost -u sys          # 비밀번호는 프롬프트에서 입력
        iSQL> SELECT NAME, ALLOC_SIZE, MAX_TOTAL_SIZE FROM V$MEMSTAT ORDER BY ALLOC_SIZE DESC LIMIT 10;
        iSQL> SELECT REP_NAME, REP_GAP FROM V$REPGAP;
        iSQL> quit
        tail -100 $ALTIBASE_HOME/trc/altibase_rp.log
      check: "이중화 관련 모듈이 상위이고 REP_GAP 이 계속 늘면 갭 누적으로 버퍼 증가 — 상대 서버·네트워크 지연 원인 확인 · rp.log 에 같은 시각 연결 오류가 있으면 이중화 절차(ALT-PROC-R5-UPSTREAM)도 확인"
      note: "적용: Altibase 7.1/7.3 · 권한: SYS — 1차는 DBA 에게 결과 요청"
  - stage: 2
    steps:
    - do: (2차·승인 후) 메모리 원인 해소 뒤 이중화 재개
      cmd: |
        isql -s localhost -u sys
        iSQL> SELECT REP_NAME, REP_GAP FROM V$REPGAP;
        iSQL> ALTER REPLICATION <rep> STOP;
        iSQL> ALTER REPLICATION <rep> START;
        iSQL> SELECT REP_NAME, REP_GAP FROM V$REPGAP;
      check: "성공: V$REPSENDER 정상·REP_GAP 감소, ERR-61055 미발생 · 실패: 재개 직후 같은 오류 → OS 메모리 확보(다른 프로세스 정리·증설) 전까지 이중화 중지 유지하고 기술지원"
      note: "사전조건: OS 메모리 여유 확보(불필요 프로세스 정리는 시스템 담당), 중지 전 V$REPGAP·이중화 상태 기록 · 영향: 중지 동안 상대 서버 반영 지연·갭 누적 · 승인: DBA·업무 담당 · 백업/롤백: 기록한 상태 기준으로 ALTER REPLICATION <rep> START 로 원상 · 적용: Altibase 7.1/7.3"
  - stage: 3
    steps:
    - do: Altibase 기술지원 자료
      cmd: |
        tar czf altibase_repmem_$(date +%Y%m%d).tgz $ALTIBASE_HOME/trc/altibase_rp.log $ALTIBASE_HOME/conf/altibase.properties
      check: "rp.log·properties·V$MEMSTAT/V$REPGAP 결과·free/ps 결과"
      note: "민감정보 마스킹: 상대 서버 IP·호스트명·이중화 대상 테이블 업무명을 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: ALT-PROC-R6-DUPKEY
  scope: id
  products: [altibase]
  category: internal
  match: [ERR-11058]
  title: 고유 인덱스 중복 키 (ERR-11058)
  source: "Altibase 7.1 Error Message Reference(ERR-11058 smERR_ABORT_smnUniqueViolation)·General Reference '메타 테이블(SYSTEM_.SYS_CONSTRAINTS_, SYSTEM_.SYS_TABLES_)'·'성능 뷰(V$REPRECEIVER)'·SQL Reference(ALTER SEQUENCE)"
  verify_note: "미검증 — Altibase 시퀀스 다음 값 보정 구문(ALTER SEQUENCE … RESTART WITH 등 지원 여부)을 7.x 매뉴얼로 확인하지 못함"
  stages:
  - stage: 1
    steps:
    - do: 실패 SQL·대상 키·중복 요청 확인 (읽기 전용)
      cmd: |
        grep -n -B5 "ERR-11058" <app_log> | tail -40
      check: "같은 키가 짧은 간격으로 반복되면 애플리케이션 중복 요청·재처리 · 양방향 이중화 구성이면 양쪽에서 같은 키 입력 가능성"
      note: "적용: 모든 버전 · 권한: 애플리케이션 로그 읽기"
    - do: 고유 제약·이중화 충돌 확인 (읽기 전용)
      cmd: |
        isql -s localhost -u sys          # 비밀번호는 프롬프트에서 입력
        iSQL> SELECT C.CONSTRAINT_NAME, C.CONSTRAINT_TYPE FROM SYSTEM_.SYS_CONSTRAINTS_ C, SYSTEM_.SYS_TABLES_ T WHERE C.TABLE_ID = T.TABLE_ID AND T.TABLE_NAME = '<TABLE>' AND C.CONSTRAINT_TYPE IN (2, 3, 6);
        iSQL> SELECT MAX(<key_col>) FROM <owner>.<table>;
        iSQL> SELECT REP_NAME, INSERT_FAILURE_COUNT FROM V$REPRECEIVER;
        iSQL> quit
      check: "고유 제약(2 UNIQUE·3 PRIMARY KEY·6 LOCAL UNIQUE) 칼럼 확인 · 채번 값이 MAX(key) 이하이면 채번 꼬임 · 이중화 INSERT_FAILURE_COUNT 증가면 양방향 키 충돌"
      note: "적용: Altibase 7.1/7.3 · 권한: SYS 또는 대상 테이블 조회 권한 — 1차는 DBA 에게 결과 요청"
  - stage: 2
    steps:
    - do: (2차·승인 후) 중복 데이터 보관·채번 보정·중복 요청 차단
      cmd: |
        isql -s localhost -u sys
        iSQL> CREATE TABLE <owner>.<table>_BAK_<yyyymmdd> AS SELECT * FROM <owner>.<table> WHERE <대상 조건>;
