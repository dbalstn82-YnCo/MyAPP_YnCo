- id: ORA-PROC-R6-NAMING
  scope: id
  products: [oracle]
  category: connection
  match: [ORA-12154, TNS-12154, ORA-12545]
  title: 접속 별칭·호스트 이름 해석 실패 (ORA-12154 · TNS-12154 · ORA-12545)
  source: "Oracle 19c 'Net Services Administrator's Guide (Configuring Naming Methods: tnsnames.ora, Easy Connect)'·'Net Services Reference (sqlnet.ora NAMES.DIRECTORY_PATH, TNS_ADMIN)'·Database Error Messages (ORA-12154·ORA-12545)"
  stages:
  - stage: 1
    steps:
    - do: 클라이언트 설정 위치·별칭 해석 확인 (읽기 전용, 접속하는 쪽 서버)
      cmd: |
        echo "TNS_ADMIN=$TNS_ADMIN ORACLE_HOME=$ORACLE_HOME"
        ls -l ${TNS_ADMIN:-$ORACLE_HOME/network/admin}/tnsnames.ora ${TNS_ADMIN:-$ORACLE_HOME/network/admin}/sqlnet.ora
        grep -i "directory_path" ${TNS_ADMIN:-$ORACLE_HOME/network/admin}/sqlnet.ora
        grep -n -i -A6 "^<alias>" ${TNS_ADMIN:-$ORACLE_HOME/network/admin}/tnsnames.ora
        tnsping <alias>
      check: "별칭이 없거나 tnsping 'TNS-03505 Failed to resolve name' 이면 ORA-12154 확정(오타·다른 TNS_ADMIN·미배포) · directory_path 에 TNSNAMES 가 없으면 파일이 있어도 해석 안 됨 · 정상: tnsping 이 주소를 보여 주고 OK"
      note: "적용: 10gR2~19c 클라이언트 · 권한: 일반 사용자 · JDBC thin 은 tnsnames 대신 URL(jdbc:oracle:thin:@//<host>:<port>/<service>) 또는 oracle.net.tns_admin 속성 사용 여부 확인"
    - do: 호스트 이름 해석·RAC 등록 주소 확인 (ORA-12545, 읽기 전용)
      cmd: |
        getent hosts <host>
        nslookup <host>
        sqlplus -s / as sysdba <<'EOF'
        select name, value from v$parameter where name in ('local_listener','remote_listener');
        EOF
      check: "getent 결과가 없으면 DNS/hosts 미등록·오타(ORA-12545) · RAC 는 local_listener(VIP)·remote_listener(SCAN) 호스트명이 클라이언트에서 해석돼야 함 · 정상: 모든 이름이 같은 IP 로 해석"
      note: "적용: SCAN 은 11gR2+ · 권한: 일반 사용자(getent·nslookup), v$parameter 는 DB 서버의 DBA"
  - stage: 2
    steps:
    - do: (2차·승인 후) 별칭 추가·정정 또는 Easy Connect 로 변경, 이름 등록
      cmd: |
        cp -p ${TNS_ADMIN:-$ORACLE_HOME/network/admin}/tnsnames.ora ${TNS_ADMIN:-$ORACLE_HOME/network/admin}/tnsnames.ora.bak_$(date +%Y%m%d)
        vi ${TNS_ADMIN:-$ORACLE_HOME/network/admin}/tnsnames.ora
        tnsping <alias>
      check: "성공: tnsping OK·애플리케이션 접속 성공 · 실패: 같은 오류 → 백업본 복원, 호스트 해석 실패면 DNS/hosts 등록(시스템 담당) 후 재시도"
      note: "사전조건: 올바른 HOST·PORT·SERVICE_NAME 을 DBA 와 확정, /etc/hosts 수정은 시스템 담당이 백업 후 · 영향: 같은 tnsnames.ora 를 쓰는 모든 프로그램에 반영 · 승인: DBA·애플리케이션 담당(hosts·DNS 는 시스템 담당) · 백업/롤백: tnsnames.ora.bak 복원 · 적용: 10gR2~19c"
  - stage: 3
    steps:
    - do: Oracle SR 자료
      cmd: |
        tar czf ora_naming_$(date +%Y%m%d).tgz ${TNS_ADMIN:-$ORACLE_HOME/network/admin}/tnsnames.ora ${TNS_ADMIN:-$ORACLE_HOME/network/admin}/sqlnet.ora
      check: "tnsnames.ora·sqlnet.ora·tnsping 결과·getent/nslookup 결과"
      note: "민감정보 마스킹: 호스트명·IP·포트·서비스 이름의 업무명을 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: ORA-PROC-R6-NETWORK
  scope: id
  products: [oracle]
  category: connection
  match: [ORA-12535, TNS-12535, ORA-12170, TNS-12170, ORA-03135, ORA-12537, TNS-12537]
  title: 네트워크 시간 초과·연결 끊김 — 방화벽·유휴 세션 만료·접속 허용 목록 (ORA-12170 · TNS-12535 · ORA-03135 · ORA-12537)
  source: "Oracle 19c 'Net Services Reference (sqlnet.ora SQLNET.EXPIRE_TIME, SQLNET.INBOUND_CONNECT_TIMEOUT, SQLNET.RECV_TIMEOUT, TCP.VALIDNODE_CHECKING, TCP.INVITED_NODES)'·'Net Services Administrator's Guide 16 Troubleshooting'·Database Error Messages (ORA-12170·ORA-12535·ORA-12537·ORA-03135)"
  verify_note: "미검증 — TCP.INVITED_NODES 변경을 lsnrctl reload 만으로 반영할 수 있는지 버전별 공식 문서로 확인하지 못함(반영 안 되면 리스너 재시작 필요)"
  stages:
  - stage: 1
    steps:
    - do: 경로·포트 도달성 확인 (읽기 전용, 클라이언트 쪽)
      cmd: |
        nc -zvw3 <db_host> <port>
        tnsping <alias>
      check: "nc 시간 초과 = 방화벽·라우팅 차단(ORA-12170) · 'Connection refused' = 리스너 미기동(리스너 절차로) · 연결 성공인데 간헐 오류면 유휴 세션 만료·순단 쪽"
      note: "적용: 모든 버전 · 권한: 일반 사용자 · nc 가 없으면 telnet <db_host> <port>"
    - do: 서버측 기록에서 클라이언트 집중·접속 거부 확인 (읽기 전용)
      cmd: |
        grep -n -A8 -E "TNS-12535|TNS-12170|Fatal NI connect error" $ORACLE_BASE/diag/rdbms/<db>/<SID>/trace/alert_<SID>.log | grep -i "Client address" | sort | uniq -c | sort -rn | head
        grep -n -E "12537|12547|refused" $ORACLE_BASE/diag/tnslsnr/<host>/<listener>/trace/<listener>.log | tail -20
      check: "특정 Client address 에 몰리면 그 구간 방화벽·클라이언트 원인, 전 구간이면 서버·네트워크 공통 원인 · listener.log 의 refused 는 접속 허용 목록·접속률 제한(ORA-12537)"
      note: "적용: 11g+ (alert log 에 Fatal NI connect error 로 기록, 10gR2 는 sqlnet.log) · 권한: oracle OS 계정"
    - do: 시간 초과·허용 목록 설정과 유휴 시간 패턴 확인 (읽기 전용)
      cmd: |
        grep -n -i -E "EXPIRE_TIME|INBOUND_CONNECT_TIMEOUT|RECV_TIMEOUT|SEND_TIMEOUT|INVITED_NODES|EXCLUDED_NODES|VALIDNODE" ${TNS_ADMIN:-$ORACLE_HOME/network/admin}/sqlnet.ora
        ls -l $ORACLE_HOME/bin/oracle
        grep -n -B5 "ORA-03135" <app_log> | tail -40
      check: "ORA-03135 가 매번 비슷한 유휴 시간(30·60분) 뒤 나면 방화벽 idle timeout 이 원인 — EXPIRE_TIME 미설정 확인 · VALIDNODE_CHECKING=YES 인데 클라이언트 IP 가 INVITED_NODES 에 없으면 ORA-12537 · oracle 실행파일 권한이 -rwsr-s--x(6751)가 아니면 서버 프로세스 생성 실패"
      note: "적용: 10gR2~19c (12c+ 는 EXPIRE_TIME 이 TCP keepalive 방식) · 권한: oracle OS 계정"
  - stage: 2
    steps:
    - do: (2차·승인 후) 서버 sqlnet.ora 에 유휴 연결 감지 설정 (ORA-03135 · TNS-12535)
      config:
        file: 서버 ${TNS_ADMIN:-$ORACLE_HOME/network/admin}/sqlnet.ora
        snippet: |
          SQLNET.EXPIRE_TIME = 10      # 분, 방화벽 idle timeout 보다 짧게
        note: "사전조건: 방화벽 idle timeout 값을 네트워크 담당에게 확인, sqlnet.ora 백업(cp -p sqlnet.ora sqlnet.ora.bak_<날짜>) · 영향: 새로 맺는 세션부터 적용, 유휴 세션마다 주기적 탐지 패킷 · 승인: DBA·네트워크 담당 · 백업/롤백: 항목 제거 또는 백업본 복원 · 적용: 10gR2~19c"
      check: "성공: 적용 이후 맺은 세션에서 ORA-03135·TNS-12535 재발 없음 · 실패: 지속 → 방화벽 세션 유지 시간 상향을 네트워크 담당에 요청"
    - do: (2차·승인 후) 접속 허용 목록에 클라이언트 추가 (ORA-12537)
      cmd: |
        cp -p ${TNS_ADMIN:-$ORACLE_HOME/network/admin}/sqlnet.ora ${TNS_ADMIN:-$ORACLE_HOME/network/admin}/sqlnet.ora.bak_$(date +%Y%m%d)
        vi ${TNS_ADMIN:-$ORACLE_HOME/network/admin}/sqlnet.ora     # TCP.INVITED_NODES=(<기존 목록>, <client_ip>)
        lsnrctl reload <listener>
      check: "성공: 해당 클라이언트 접속 성공, listener.log 에 refused 미발생 · 실패: reload 후에도 거부 → 리스너 재시작 필요(서비스 담당 합의 후), 문법 오류면 백업본 복원 후 reload"
      note: "사전조건: 허용할 IP 를 보안 담당이 확인, 기존 목록 누락 없이 추가 · 영향: 목록 오류 시 다른 클라이언트까지 거부될 수 있음 · 승인: DBA·보안 담당 · 백업/롤백: sqlnet.ora.bak 복원 후 lsnrctl reload · 적용: 10gR2~19c"
  - stage: 3
    steps:
    - do: Oracle SR 자료
      cmd: |
        tar czf ora_net_$(date +%Y%m%d).tgz ${TNS_ADMIN:-$ORACLE_HOME/network/admin}/sqlnet.ora $ORACLE_BASE/diag/tnslsnr/<host>/<listener>/trace/<listener>.log
      check: "sqlnet.ora·listener.log·alert log 의 Fatal NI connect error 발췌·nc/tnsping 결과·방화벽 timeout 값"
      note: "민감정보 마스킹: listener.log·alert log 의 Client address(IP)·HOST·USER·PROGRAM, 서버 호스트명을 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: ORA-PROC-R6-INSTSTATE
  scope: id
  products: [oracle]
  category: connection
  match: [ORA-12528, ORA-12560, TNS-12560, ORA-29701]
  title: 접속 대상 인스턴스·클러스터 스택 미기동 또는 제한 모드 (ORA-12528 · ORA-12560 · ORA-29701)
  source: "Oracle 19c 'Net Services Administrator's Guide (lsnrctl services: READY/BLOCKED/RESTRICTED)'·'Administrator's Guide (Starting Up a Database, Restricting Access: ALTER SYSTEM DISABLE RESTRICTED SESSION)'·'Clusterware Administration and Deployment Guide (crsctl check css / start crs / start has)'·Database Error Messages (ORA-12528·ORA-12560·ORA-29701)"
  stages:
  - stage: 1
    steps:
    - do: 환경변수·프로세스·리스너 등록 상태 확인 (읽기 전용)
      cmd: |
        echo "ORACLE_SID=$ORACLE_SID ORACLE_HOME=$ORACLE_HOME"
        ps -ef | grep -E "[o]ra_pmon_|[t]nslsnr|[o]cssd"
        lsnrctl services <listener> | grep -i -E "Service|Instance|status" | head -30
      check: "ORACLE_SID 가 실행 중 pmon(ora_pmon_<SID>) 이름과 다르면 로컬 접속 ORA-12560(. oraenv 로 맞추면 해소) · pmon 없음 = 인스턴스 미기동 · lsnrctl services 에 'status BLOCKED' 또는 RESTRICTED 면 ORA-12528 · ocssd 없음 = CSS 미기동(ORA-29701) · 정상: pmon·tnslsnr 존재, 서비스 READY"
      note: "적용: Linux/Unix (Windows 는 sc query OracleService<SID>) · 권한: oracle(그리드 환경은 grid) OS 계정"
    - do: 인스턴스 단계·제한 모드·클러스터 스택 확인 (읽기 전용)
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        select instance_name, status, logins, database_status from v$instance;
        EOF
        tail -50 $ORACLE_BASE/diag/rdbms/<db>/<SID>/trace/alert_<SID>.log
        crsctl check css
        crsctl stat res -t -init | head -40
      check: "status STARTED/MOUNTED 이거나 logins RESTRICTED 면 신규 접속 차단(ORA-12528) — alert log 로 기동·복구·유지보수 진행 여부 확인 · crsctl check css 가 'CSS appears healthy' 가 아니면 ASM·DB 기동 불가(ORA-29701) · 정상: OPEN·ALLOWED·CSS healthy"
      note: "적용: crsctl 은 Grid Infrastructure·Oracle Restart 11gR2+ (GI alert log 는 12c+ $ORACLE_BASE/diag/crs/<host>/crs/trace/alert.log, 11gR2 는 $GRID_HOME/log/<host>/alert<host>.log) · 권한: oracle/grid OS 계정"
  - stage: 2
    steps:
    - do: (2차·승인 후) DB 열기·제한 모드 해제·리스너 재등록 (ORA-12528)
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        alter database open;
        alter system disable restricted session;
        alter system register;
        select instance_name, status, logins from v$instance;
        EOF
      check: "성공: v$instance OPEN·ALLOWED, lsnrctl services 에 READY · 실패: open 중 ORA-01113/01157 → 데이터파일 절차(복구 필요), 유지보수 중이었다면 작업 담당 확인 후 진행"
      note: "사전조건: 제한 모드·MOUNT 상태가 계획 작업(패치·복구) 때문인지 작업 담당 확인 — 진행 중이면 해제 금지 · 영향: 해제 즉시 일반 사용자 접속 재개 · 승인: DBA·서비스 담당 · 백업/롤백: 상태 변경만 하며 데이터 변경 없음, 다시 막으려면 alter system enable restricted session · 적용: 10gR2~19c"
    - do: (2차·승인 후) 클러스터 스택 기동 (ORA-29701)
      cmd: |
        crsctl start has        # Oracle Restart (root)
        crsctl start crs        # RAC 노드 (root)
        crsctl check css
      check: "성공: crsctl check css 'CSS appears healthy', ASM·DB 리소스 ONLINE · 실패: 보팅 디스크·인터커넥트 오류 → GI alert log·ocssd 트레이스로 3차"
      note: "사전조건: 원인(보팅 디스크 접근·인터커넥트·노드 재부팅) 확인, 다른 노드 상태 확인 · 영향: 기동 동안 해당 노드 DB 서비스 불가 · 승인: DBA·시스템 담당·서비스 담당 · 백업/롤백: 기동만 하며 설정 변경 없음, 실패 시 crsctl stop has/crs -f 후 원인 분석 · 적용: Grid Infrastructure 11gR2+ (root 권한)"
  - stage: 3
    steps:
    - do: Oracle SR 자료
      cmd: |
        tfactl diagcollect -crs -database <db> -last 2h 2>/dev/null || tar czf ora_inst_$(date +%Y%m%d).tgz $ORACLE_BASE/diag/rdbms/<db>/<SID>/trace/alert_<SID>.log
      check: "DB alert log·GI alert log·ocssd 트레이스·lsnrctl services·crsctl stat res -t 결과"
      note: "TFA 가 없으면 tar 로 alert log 수집 · 민감정보 마스킹: 호스트명·VIP/SCAN IP·서비스 이름의 업무명을 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: ORA-PROC-R6-KILLED
  scope: id
  products: [oracle]
  category: connection
  match: [ORA-00028]
  title: 세션 강제 종료 주체 추적 — 운영자·Resource Manager·모니터링 도구 (ORA-00028)
  source: "Oracle Database Error Messages (ORA-00028)·19c 'Database Reference (UNIFIED_AUDIT_TRAIL, DBA_AUDIT_TRAIL, DBA_RSRC_PLAN_DIRECTIVES, V$RSRC_PLAN)'·'Administrator's Guide (Managing Resources with Oracle Database Resource Manager, Terminating Sessions)'"
  stages:
  - stage: 1
    steps:
    - do: 종료 명령·감사 기록 확인 (읽기 전용)
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        set lines 220
        select event_timestamp, dbusername, os_username, userhost, sql_text from unified_audit_trail where action_name='ALTER SYSTEM' and event_timestamp > systimestamp - interval '1' day order by event_timestamp desc fetch first 20 rows only;
        EOF
        grep -n -i "KILL SESSION" $ORACLE_BASE/diag/rdbms/<db>/<SID>/trace/alert_<SID>.log | tail -20
      check: "ALTER SYSTEM KILL/DISCONNECT SESSION 을 실행한 계정·호스트가 나오면 운영자·도구 종료 확정 — 사유·승인 기록 확인 · 기록이 없으면 Resource Manager 자동 종료 확인(다음 단계)"
      note: "적용: unified_audit_trail 은 12c+ 통합 감사 사용 시(11gR2 는 감사 설정 시 dba_audit_trail), alert log 의 KILL SESSION 기록은 버전에 따라 없을 수 있음 · 권한: AUDIT_VIEWER 또는 DBA — 1차는 DBA 에게 결과 요청"
    - do: Resource Manager 자동 종료 조건·애플리케이션 영향 확인 (읽기 전용)
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        show parameter resource_manager_plan
        select plan, group_or_subplan, switch_group, switch_time, max_idle_time, max_idle_blocker_time from dba_rsrc_plan_directives where switch_group in ('KILL_SESSION','CANCEL_SQL') or max_idle_time is not null or max_idle_blocker_time is not null;
        EOF
        grep -n -A3 "ORA-00028" <app_log> | tail -40
      check: "현재 계획에 KILL_SESSION 전환·MAX_IDLE_TIME 지시자가 있고 종료된 세션이 조건(수행 시간·유휴 시간)에 맞으면 자동 종료 확정 · 애플리케이션이 재접속에 성공했는지, 취소된 트랜잭션(처리 누락 건)이 있는지 기록"
      note: "적용: 11gR2+ (max_idle_blocker_time 등 컬럼은 버전 확인) · 권한: SELECT_CATALOG_ROLE"
  - stage: 2
    steps:
    - do: (2차·승인 후) Resource Manager 지시자·계획 조정
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        show parameter resource_manager_plan
        alter system set resource_manager_plan='<새 계획 또는 빈값>' scope=both;
        EOF
      check: "성공: 같은 조건의 세션이 더 이상 종료되지 않고 ORA-00028 미발생 · 실패: 다른 시스템 부하 증가(폭주 SQL 미통제) → 이전 계획으로 원복 후 지시자 값만 조정(dbms_resource_manager)"
      note: "사전조건: 종료 조건이 의도된 통제(폭주 쿼리 차단)인지 DBA·업무 담당 확인, 현재 계획 이름 기록 · 영향: 통제를 풀면 장시간 SQL 이 자원을 계속 점유할 수 있음 · 승인: DBA·업무 담당(변경 관리) · 백업/롤백: alter system set resource_manager_plan='<이전계획>' scope=both 로 원복 · 적용: 11gR2~19c (Maintenance Window 가 계획을 바꾸면 scheduler window 설정도 확인)"
  - stage: 3
    steps:
    - do: 내부 감사·Oracle SR 자료
      cmd: |
        grep -n -B2 -A3 "ORA-00028" <app_log> | tail -100 > ora00028_$(date +%Y%m%d).txt
      check: "감사 기록·Resource Manager 계획/지시자·애플리케이션 로그 발췌"
      note: "민감정보 마스킹: 감사 기록의 사용자명·OS 계정·호스트·IP·SQL 원문을 가린 뒤 전달 · 전달 승인: 보안 담당 승인(감사 기록은 보안 담당이 직접 보관)"

# ══════════════════════════ Oracle · storage ══════════════════════════
- id: ORA-PROC-R6-REDO
  scope: id
  products: [oracle]
  category: storage
  match: [ORA-00312, ORA-00313, ORA-00333, ORA-00354]
  title: 온라인 리두 로그 멤버 열기·읽기 실패·블록 헤더 손상 (ORA-00313 · ORA-00333 · ORA-00354 · ORA-00312)
  source: "Oracle 19c 'Administrator's Guide 11 Managing the Redo Log (ADD/DROP LOGFILE MEMBER, CLEAR LOGFILE)'·'Database Reference (V$LOG, V$LOGFILE)'·Database Error Messages (ORA-00312·ORA-00313·ORA-00333·ORA-00353·ORA-00354)"
  stages:
  - stage: 1
    steps:
    - do: 주 오류·대상 그룹/멤버 확인 (읽기 전용)
      cmd: |
        grep -n -B2 -A4 -E "ORA-00312|ORA-00313|ORA-00333|ORA-00353|ORA-00354" $ORACLE_BASE/diag/rdbms/<db>/<SID>/trace/alert_<SID>.log | tail -60
        sqlplus -s / as sysdba <<'EOF'
        set lines 200
        select status from v$instance;
        select l.group#, l.thread#, l.sequence#, l.status, l.archived, f.member, f.status mstatus from v$log l join v$logfile f on f.group#=l.group# order by l.group#;
        EOF
      check: "ORA-00312 은 파일명 안내 — 바로 앞 주 오류(00313 열기·00333 읽기·00354 헤더 손상) 기준 · 같은 그룹에 정상 멤버가 있으면 DB 는 계속 동작(다중화) · CURRENT/ACTIVE 그룹의 모든 멤버가 실패하면 위험도 최고 → DBA 즉시·3차 · 인스턴스가 MOUNTED 에 머물면 크래시 복구 중 실패"
      note: "적용: 10gR2~19c · 권한: SYSDBA(MOUNT 상태에서도 v$log 조회 가능), alert log 는 oracle OS 계정"
    - do: 멤버 파일·스토리지 상태 확인 (읽기 전용)
      cmd: |
        ls -l <member 경로>
        asmcmd ls -l +<DG>/<db>/ONLINELOG/ 2>/dev/null
        dmesg -T | grep -i "i/o error" | tail
      check: "파일 없음·크기가 같은 그룹 다른 멤버와 다름·I/O 오류 동반이면 스토리지 원인 확정 · 정상: 파일 존재·크기 동일·OS 오류 없음(→ 일시 I/O, 재발 감시)"
      note: "적용: Linux (dmesg -T 는 util-linux 2.20+, AIX 는 errpt | head -20) · 권한: oracle/grid OS 계정, dmesg 는 root 필요할 수 있음"
  - stage: 2
    steps:
    - do: (2차·승인 후) 손상 멤버 재생성 (같은 그룹에 정상 멤버가 있을 때)
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        alter system switch logfile;
        select group#, status from v$log where group#=<n>;
        alter database drop logfile member '<손상 멤버 경로>';
        alter database add logfile member '<새 멤버 경로>' to group <n>;
        EOF
      check: "성공: v$logfile 의 새 멤버 status 공백(정상), 다음 스위치 후 오류 미발생 · 실패: ORA-01609/01623(그룹이 CURRENT·ACTIVE) → 체크포인트(alter system checkpoint) 후 INACTIVE 에서 재시도"
      note: "사전조건: 대상 그룹이 INACTIVE 인지 확인(drop 은 INACTIVE 에서만), 스토리지 원인 해소, 기존 손상 파일은 OS 에서 이름만 바꿔 보관 · 영향: 온라인 수행, 스위치 시 짧은 I/O 증가 · 승인: DBA · 백업/롤백: 작업 전 v$logfile 구성 기록, 추가 멤버는 drop logfile member 로 되돌림 · 적용: 10gR2~19c"
    - do: (2차·승인 후) 그룹 전체 손상 시 로그 초기화 (CURRENT 가 아닐 때만)
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        alter database clear logfile group <n>;
        -- 아카이브되지 않은 그룹이면: alter database clear unarchived logfile group <n>;
        EOF
        rman target / <<'EOF'
        backup database plus archivelog;
        EOF
      check: "성공: 그룹 재생성·DB 정상, 직후 전체 백업 완료 · 실패: ORA-01624(복구에 필요) → 중단하고 Oracle SR(불완전 복구 판단)"
      note: "사전조건: 그룹이 CURRENT 가 아니고 정상 멤버가 없음을 DBA 가 확인, 아카이브 여부(archived) 확인 · 영향: unarchived 초기화는 그 로그가 필요한 복구 경로를 끊음 → 즉시 전체 백업 필수 · 승인: DBA·서비스 담당 · 백업/롤백: 초기화는 되돌릴 수 없음 — 작업 전 컨트롤파일 백업(alter database backup controlfile to '<path>'), 작업 직후 전체 백업 · 적용: 10gR2~19c, CURRENT 그룹 손상은 이 단계 금지(3차)"
  - stage: 3
    steps:
    - do: Oracle SR 자료 (IPS)
      cmd: |
        adrci exec="set home diag/rdbms/<db>/<SID>; ips create package time '<start>' to '<end>'; ips generate package 1 in /tmp"
      check: "IPS 패키지(alert·trace)·v$log/v$logfile 결과·스토리지 오류 기록"
      note: "민감정보 마스킹: 트레이스 안 SQL 바인드값·호스트명·IP·경로의 업무명을 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: ORA-PROC-R6-DATAFILE
  scope: id
  products: [oracle]
  category: storage
  match: [ORA-00376, ORA-01110, ORA-01113, ORA-01122, ORA-01157, ORA-01194]
  title: 데이터파일 접근 불가·검증 실패·미디어 복구 필요 (ORA-01157 · ORA-01113 · ORA-01122 · ORA-00376 · ORA-01194 · ORA-01110)
  source: "Oracle 19c 'Backup and Recovery User's Guide (RMAN RESTORE/RECOVER DATAFILE, Performing Incomplete Recovery)'·'Database Reference (V$DATAFILE, V$DATAFILE_HEADER, V$RECOVER_FILE, V$BACKUP, V$ARCHIVED_LOG)'·'SQL Language Reference (ALTER SYSTEM CHECK DATAFILES, ALTER DATABASE END BACKUP)'·Database Error Messages"
  stages:
  - stage: 1
    steps:
    - do: 문제 파일·복구 필요 여부 확인 (읽기 전용)
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        set lines 220
        select status from v$instance;
        select file#, status, error, recover, fuzzy, checkpoint_change#, name from v$datafile_header where error is not null or recover='YES' or file#=<n>;
        select * from v$recover_file;
        select file#, status from v$backup where status='ACTIVE';
        select file#, name, status from v$datafile where status not in ('ONLINE','SYSTEM');
        EOF
      check: "error 값(FILE NOT FOUND·CANNOT OPEN)이면 접근 불가(ORA-01157) · recover=YES·v$recover_file 행 = 미디어 복구 필요(ORA-01113) · v$backup ACTIVE = hot backup 중 비정상 종료 · status OFFLINE = 읽기 불가(ORA-00376) · ORA-01110 은 파일명 안내이므로 바로 앞 주 오류 기준 · 정상: 행 없음"
      note: "적용: 10gR2~19c (MOUNT 상태에서도 조회 가능) · 권한: SYSDBA — 1차는 DBA 에게 결과 요청"
    - do: OS 파일·스토리지·필요 아카이브 확인 (읽기 전용)
      cmd: |
        ls -l '<datafile 경로>'
        df -h <마운트 지점>
        asmcmd lsdg 2>/dev/null
        dmesg -T | grep -i "i/o error" | tail
        sqlplus -s / as sysdba <<'EOF'
        select sequence#, name from v$archived_log where next_change# > <최소 checkpoint_change#> order by sequence#;
        EOF
      check: "파일 없음·권한 불일치·미마운트·ASM 디스크그룹 DISMOUNTED 면 접근 불가 원인 확정 · 크기가 v$datafile.bytes 와 다르면 잘린·다른 시점 파일(ORA-01122) · 필요 아카이브가 목록·디스크에 모두 있으면 복구 가능, 없으면 백업 매체 확인(ORA-01194)"
      note: "적용: Linux (AIX 는 errpt) · 권한: oracle/grid OS 계정 · 큰 출력은 head 로 제한"
  - stage: 2
    steps:
    - do: (2차·승인 후) 접근 경로 복구 후 재검사·백업 모드 종료
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        alter system check datafiles;
        -- hot backup 중 비정상 종료(v$backup ACTIVE)였다면: alter database end backup;
        select file#, error, recover from v$datafile_header where error is not null or recover='YES';
        EOF
      check: "성공: 마지막 조회 결과 없음, alter database open 가능 · 실패: recover=YES 남음 → 다음 단계(미디어 복구)"
      note: "사전조건: 마운트·권한·ASM 디스크그룹을 시스템 담당과 먼저 복구, end backup 은 v$backup ACTIVE 이고 백업 중 종료가 확실할 때만 · 영향: 상태 재확인만 하며 데이터 변경 없음 · 승인: DBA · 백업/롤백: 작업 전 v$datafile_header 결과 보관(되돌릴 변경 없음) · 적용: 10gR2~19c"
    - do: (2차·승인 후) 데이터파일 복원·미디어 복구·온라인 전환
      cmd: |
        rman target / <<'EOF'
        backup as copy datafile <n> format '<보관 경로>/df<n>_before_%U';
        restore datafile <n>;
        recover datafile <n>;
        sql 'alter database datafile <n> online';
        EOF
      check: "성공: v$recover_file 에서 사라짐, 상태 ONLINE, 업무 조회 정상 · 실패: RMAN-06054(아카이브 없음)·06023(백업 없음) → 중단하고 불완전 복구 여부를 Oracle 지원과 결정"
      note: "사전조건: 유효 백업·이후 아카이브 존재 확인(list backup of datafile <n>), 손상 파일이 읽히지 않으면 copy 단계는 생략하고 OS 에서 이름만 바꿔 보관 · 영향: 해당 파일 소속 테이블스페이스 업무 중단, 아카이브 적용 시간 소요 · 승인: DBA·서비스 담당 · 백업/롤백: 복구 전 현재 파일 사본(첫 줄)·컨트롤파일 백업, 복원은 되돌릴 수 없으므로 사본 유지 · 적용: 10gR2~19c (SYSTEM·UNDO 파일은 MOUNT 상태에서 수행)"
    - do: (2차·승인 후) 불완전 복구 뒤 OPEN 전 추가 복구 (ORA-01194)
      cmd: |
        rman target / <<'EOF'
        restore archivelog from sequence <n> until sequence <m>;
        EOF
        sqlplus / as sysdba
        # SQL> recover database until cancel;    (적용 로그 확인 후 CANCEL)
        # SQL> alter database open resetlogs;    (데이터 손실 범위 승인 후)
      check: "성공: open resetlogs 완료, 이후 즉시 전체 백업 · 실패: ORA-01194 지속 → 필요한 로그가 없음 — 손실 범위 재산정 후 Oracle SR"
      note: "사전조건: 목표 시점과 데이터 손실 범위를 업무 담당이 서면 승인, 현재 데이터파일·컨트롤파일 전체 사본 확보 · 영향: RESETLOGS 이후 이전 백업으로 되돌릴 수 없고 DB 전체 중단 · 승인: DBA·서비스 담당·업무 책임자 · 백업/롤백: 작업 전 콜드 사본(전체 파일) 보관이 유일한 롤백 수단, 완료 직후 전체 백업 · 적용: 10gR2~19c"
  - stage: 3
    steps:
    - do: Oracle SR 자료
      cmd: |
        adrci exec="set home diag/rdbms/<db>/<SID>; ips create package time '<start>' to '<end>'; ips generate package 1 in /tmp"
        rman target / <<'EOF' > rman_list_$(date +%Y%m%d).txt
        list backup summary;
        EOF
      check: "IPS 패키지·v$datafile_header/v$recover_file 결과·RMAN 백업 목록·스토리지 오류 기록"
      note: "민감정보 마스킹: 데이터파일 경로·테이블스페이스 이름의 업무명, 호스트명·IP, 트레이스 안 바인드값을 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: ORA-PROC-R6-CTLFILE
  scope: id
  products: [oracle]
  category: storage
  match: [ORA-00210]
  title: 컨트롤파일 열기 실패 (ORA-00210 · ORA-00202 · ORA-27037)
  source: "Oracle 19c 'Administrator's Guide 10 Managing Control Files (Multiplexing, Recovering from a Lost Control File)'·'Backup and Recovery User's Guide (RESTORE CONTROLFILE FROM AUTOBACKUP)'·Database Error Messages (ORA-00210·ORA-00202)"
  stages:
  - stage: 1
    steps:
    - do: 실패 파일명·OS 오류 확인 (읽기 전용)
      cmd: |
        grep -n -A4 -E "ORA-00210|ORA-00202|ORA-27037|ORA-27041" $ORACLE_BASE/diag/rdbms/<db>/<SID>/trace/alert_<SID>.log | tail -30
        strings $ORACLE_HOME/dbs/spfile<SID>.ora | grep -i control_files
      check: "ORA-00202 의 파일명과 ORA-27037(파일 없음)·27041(열기 실패)의 OS errno 로 원인 구분 · CONTROL_FILES 의 모든 경로 목록 확보"
      note: "적용: 11g+ ADR 경로, spfile 이 ASM 에 있으면 strings 대신 인스턴스 NOMOUNT 상태에서 show parameter control_files(DBA) · 권한: oracle OS 계정"
    - do: 각 컨트롤파일 실재·크기·저장소 확인 (읽기 전용)
      cmd: |
        ls -l <control_file_1> <control_file_2>
        asmcmd ls -l +<DG>/<db>/CONTROLFILE/ 2>/dev/null
        df -h <mount> ; dmesg -T | grep -i "i/o error" | tail
      check: "한 사본만 없거나 크기가 다르면 그 사본이 원인(다른 사본으로 대체 가능) · 모든 사본 실패면 RMAN 자동 백업 복원 필요 · 소유자가 oracle:oinstall 이 아니면 권한 원인"
      note: "적용: Linux (AIX 는 errpt) · 권한: oracle/grid OS 계정"
  - stage: 2
    steps:
    - do: (2차·승인 후) 정상 다중화본으로 교체 또는 자동 백업에서 복원
      cmd: |
        sqlplus / as sysdba
        # SQL> shutdown abort
        cp -p <손상 사본> <손상 사본>.bad_$(date +%Y%m%d)
        cp -p <정상 사본> <손상 사본 경로>
        # SQL> startup
        # 모든 사본 손상 시: rman target /  →  startup nomount; restore controlfile from autobackup; alter database mount; recover database; alter database open resetlogs;
      check: "성공: startup 후 OPEN, alert log 에 ORA-00210 없음 · 실패: 같은 오류 → 정상 사본 판단 오류 가능, .bad 파일은 보관한 채 RMAN 자동 백업 복원으로"
      note: "사전조건: 인스턴스가 이미 내려갔거나 컨트롤파일 오류로 운영 불가 상태, 정상 사본(크기·수정 시각) 확인 · 영향: 작업 동안 DB 전체 중단, 자동 백업 복원 경로는 RESETLOGS 로 이전 백업과 단절 · 승인: DBA·서비스 담당 · 백업/롤백: 손상 사본은 지우지 말고 .bad 로 보관, 복원 직후 전체 백업 · 적용: 10gR2~19c (ASM 은 asmcmd cp 사용)"
  - stage: 3
    steps:
    - do: Oracle SR 자료
      cmd: |
        adrci exec="set home diag/rdbms/<db>/<SID>; ips create package time '<start>' to '<end>'; ips generate package 1 in /tmp"
      check: "IPS 패키지·컨트롤파일 경로/크기 목록·스토리지 오류 기록"
      note: "민감정보 마스킹: 경로의 업무명·호스트명·IP 를 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: ORA-PROC-R6-REDOSIZE
  scope: id
  products: [oracle]
  category: storage
  match: [LEG-ORA-CHECKPOINT, LEG-ORA-WARN-REDO]
  title: 리두 로그 스위치 과다·체크포인트 지연 (Checkpoint not complete · log file switch 대기)
  source: "Oracle 19c 'Administrator's Guide 11 Managing the Redo Log (Planning the Size of Redo Log Files, ADD/DROP LOGFILE GROUP)'·'Performance Tuning Guide (log file switch (checkpoint incomplete), log file sync)'·'Database Reference (V$LOG, V$LOG_HISTORY, V$SYSTEM_EVENT)'"
  stages:
  - stage: 1
    steps:
    - do: 리두 그룹 크기·상태·스위치 빈도 확인 (읽기 전용)
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        set lines 200 pages 100
        select group#, thread#, members, bytes/1048576 mb, status, archived from v$log order by group#;
        select to_char(first_time,'YYYY-MM-DD HH24') hr, count(*) from v$log_history where first_time > sysdate-1 group by to_char(first_time,'YYYY-MM-DD HH24') order by 1;
        select event, total_waits, round(time_waited/100) sec from v$system_event where event like 'log file switch%' or event in ('log file sync','log file parallel write');
        EOF
        grep -c "Checkpoint not complete" $ORACLE_BASE/diag/rdbms/<db>/<SID>/trace/alert_<SID>.log
      check: "시간당 스위치 4회 이상(권장 15~20분 간격)이면 리두 크기 부족 · CURRENT 외 ACTIVE 그룹이 여럿이면 체크포인트 지연 · 'log file switch (checkpoint incomplete)' 대기 누적이면 확정 · 정상: 시간당 4회 미만, Checkpoint not complete 없음"
      note: "적용: 10gR2~19c · 권한: SELECT_CATALOG_ROLE — 1차는 DBA 에게 결과 요청 · AWR 은 Diagnostics Pack 라이선스 필요"
    - do: 리두·데이터파일 디스크 I/O 확인 (읽기 전용)
      cmd: |
        iostat -x 5 3
      check: "리두 볼륨 await 가 수십 ms 이상·%util 90% 이상이면 I/O 병목(크기 조정만으로 해결 안 됨 → 스토리지 담당) · 정상: await 수 ms"
      note: "적용: Linux sysstat (AIX iostat -D 5 3) · 권한: 일반 사용자"
  - stage: 2
    steps:
    - do: (2차·승인 후) 더 큰 리두 그룹 추가 후 작은 그룹 순차 제거
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        alter database add logfile thread <t> group <새 n> ('<경로1>','<경로2>') size <크기>M;
        alter system switch logfile;
        alter system checkpoint;
        select group#, status from v$log;
        -- 작은 그룹이 INACTIVE 이고 archived=YES 일 때만: alter database drop logfile group <옛 n>;
        EOF
      check: "성공: 스위치 간격 15분 이상, Checkpoint not complete 재발 없음 · 실패: ORA-01623/01624(CURRENT·복구 필요) → 스위치·체크포인트 후 INACTIVE 에서 재시도"
      note: "사전조건: 리두 볼륨 여유 확인, 다중화 경로 2곳 지정, 스위치 빈도로 크기 산정(피크 시간 리두 생성량 × 20분) · 영향: 온라인 수행, 그룹 추가 순간 I/O 증가 · 승인: DBA(변경 관리) · 백업/롤백: 작업 전 v$log/v$logfile 구성 기록, 추가 그룹은 INACTIVE 상태에서 drop logfile group 으로 원복, 제거한 그룹 파일은 OS 에서 별도 정리 · 적용: 10gR2~19c (RAC 는 thread 별)"
  - stage: 3
    steps:
    - do: Oracle SR / 성능 분석 자료
      cmd: |
        sqlplus -s / as sysdba <<'EOF' > redo_switch_$(date +%Y%m%d).txt
        select to_char(first_time,'YYYY-MM-DD HH24') hr, count(*) from v$log_history where first_time > sysdate-7 group by to_char(first_time,'YYYY-MM-DD HH24') order by 1;
        EOF
      check: "7일 스위치 이력·v$log 구성·iostat·AWR(라이선스 보유 시)"
      note: "민감정보 마스킹: 호스트명·경로의 업무명을 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

# ══════════════════════════ Oracle · lock ══════════════════════════
- id: ORA-PROC-R6-TXCONFLICT
  scope: id
  products: [oracle]
  category: lock
  match: [ORA-08177, LEG-IND-003]
  title: 직렬화 트랜잭션 충돌·업무 SQL 오류 코드 구분 (ORA-08177 · SQU-OTO SQL ERR CODE)
  source: "Oracle 19c 'Database Concepts 9 Data Concurrency and Consistency (Serializable Isolation, ORA-08177)'·'Database Reference (V$SEGMENT_STATISTICS, DBA_TABLES.INI_TRANS, DBA_TAB_COLUMNS)'·Database Error Messages (ORA-08177·ORA-12899·ORA-00001·ORA-00060)"
  stages:
  - stage: 1
    steps:
    - do: 오류 코드·격리 수준 사용 위치 확인 (읽기 전용)
      cmd: |
        grep -oE "SQL ERR CODE *: *[0-9]+" <app_log> | sort | uniq -c | sort -rn | head
        grep -n -B3 "ORA-08177" <app_log> | tail -30
        grep -rn -i "SERIALIZABLE" <app_config_dir> | head -20
      check: "SQU-OTO 코드 구분: 12899 = 컬럼 길이 초과, 1 = 중복 키(ORA-00001 판정), 60 = 데드락(ORA-00060 — 잠금 절차) · ORA-08177 은 SERIALIZABLE 트랜잭션이 다른 트랜잭션이 바꾼 행을 갱신하려 할 때 — 사용 위치 확인"
      note: "적용: 모든 버전 · 권한: 애플리케이션 로그·설정 읽기"
    - do: ITL 경합·컬럼 길이·데드락 기록 확인 (읽기 전용)
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        set lines 200
        select owner, object_name, value from v$segment_statistics where statistic_name='ITL waits' and value>0 order by value desc fetch first 10 rows only;
        select owner, table_name, ini_trans from dba_tables where table_name=upper('<table>');
        select column_name, data_type, data_length, char_used from dba_tab_columns where table_name=upper('<table>') and column_name=upper('<column>');
        EOF
        grep -n "ORA-00060" $ORACLE_BASE/diag/rdbms/<db>/<SID>/trace/alert_<SID>.log | tail -5
      check: "대상 테이블 ITL waits 가 크고 ini_trans 가 작으면 ITL 경합이 ORA-08177 을 키움 · 12899 는 입력 길이와 data_length(char_used B/C) 비교 · ORA-00060 기록이 있으면 데드락 트레이스로 잠금 순서 확인"
      note: "적용: fetch first 는 12c+ (11gR2 는 rownum 서브쿼리) · 권한: SELECT_CATALOG_ROLE — 1차는 DBA 에게 결과 요청"
  - stage: 2
    steps:
    - do: (2차·승인 후) ITL 여유 확보 (INITRANS 상향)
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        select dbms_metadata.get_ddl('TABLE','<TABLE>','<OWNER>') from dual;
        alter table <owner>.<table> initrans <n>;
        EOF
      check: "성공: 이후 새로 쓰는 블록부터 ITL waits 증가 둔화, ORA-08177 감소 · 실패: 변화 없음 → 기존 블록 재구성(move online·재생성) 계획 또는 애플리케이션 재시도 로직"
      note: "사전조건: 대상 테이블·현재 ini_trans 기록, 기존 블록에는 적용되지 않음을 업무 담당과 공유 · 영향: alter 는 짧은 DDL 잠금, 블록당 ITL 공간 증가로 저장 효율 소폭 감소 · 승인: DBA·업무 담당 · 백업/롤백: get_ddl 결과 보관, alter table <owner>.<table> initrans <이전값> 으로 원복 · 적용: 10gR2~19c"
    - do: (2차·승인 후) 애플리케이션 재시도·격리 수준·컬럼 길이 조정 (개발팀)
      config:
        file: 애플리케이션 트랜잭션 설정·DDL
        snippet: |
          -- ORA-08177: 재시도 로직(같은 트랜잭션 재실행 1~3회) 또는 READ COMMITTED 로 변경 검토
          -- ORA-12899: alter table <owner>.<table> modify (<column> varchar2(<n> char));   -- 길이 확장
        note: "사전조건: 격리 수준 변경이 업무 정합성에 영향 없는지 개발·업무 담당 검토, 길이 확장 전 DDL 백업 · 영향: 격리 수준 변경은 동시성 결과를 바꿈, modify 는 짧은 DDL 잠금 · 승인: 개발팀·DBA·업무 담당(변경 관리) · 백업/롤백: 설정 파일 사본·get_ddl 보관, 길이 축소는 데이터가 맞을 때만 가능하므로 확장값 신중 산정"
      check: "성공: SQU-OTO 코드·ORA-08177 재발 없음 · 실패: 데드락(60) 지속 → 잠금 절차(ORA-PROC-LOCK)로 잠금 순서 조정"
  - stage: 3
    steps:
    - do: Oracle SR / 개발팀 전달 자료
      cmd: |
        grep -n -B3 -A3 -E "ORA-08177|SQU-OTO" <app_log> | tail -200 > tx_conflict_$(date +%Y%m%d).txt
      check: "오류 발췌·ITL waits·ini_trans·격리 수준 설정·데드락 트레이스(있으면)"
      note: "민감정보 마스킹: SQL ERR MSG 안의 입력값(개인정보)·바인드값·사용자명·호스트명을 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: ORA-PROC-R6-CFREAD
  scope: id
  products: [oracle]
  category: lock
  match: [ORA-00235]
  title: 컨트롤파일 읽기 불일치 — RMAN·조회와 컨트롤파일 갱신 동시 발생 (ORA-00235)
  source: "Oracle Database Error Messages (ORA-00235: control file read without a lock inconsistent due to concurrent update)·19c 'Database Reference (V$RMAN_STATUS, V$LOG_HISTORY, V$CONTROLFILE)'·'Backup and Recovery User's Guide (RMAN 작업 일정)'"
  stages:
  - stage: 1
    steps:
    - do: 같은 시각 RMAN·로그 스위치 확인 (읽기 전용)
      cmd: |
        sqlplus -s / as sysdba <<'EOF'
        set lines 200
        select sid, operation, status, start_time, end_time from v$rman_status where start_time > sysdate-1 order by start_time;
        select to_char(first_time,'YYYY-MM-DD HH24') hr, count(*) from v$log_history where first_time > sysdate-1 group by to_char(first_time,'YYYY-MM-DD HH24') order by 1;
        select name, status from v$controlfile;
        EOF
        grep -n -B2 -A3 "ORA-00235" $ORACLE_BASE/diag/rdbms/<db>/<SID>/trace/alert_<SID>.log | tail -20
      check: "오류 시각에 RMAN 작업(백업·crosscheck)과 로그 스위치 폭주(시간당 10회 이상)가 겹치면 동시 갱신에 의한 일시 오류 — 재실행하면 대부분 해소 · v$controlfile status 가 비어 있지 않으면 컨트롤파일 자체 문제(ORA-00210 판정) · 정상: 일회성"
      note: "적용: 10gR2~19c · 권한: SELECT_CATALOG_ROLE — 1차는 DBA 에게 결과 요청 · 조회만 하며 잠금을 잡지 않음"
    - do: 실패한 작업 로그 확인 (읽기 전용)
      cmd: |
        grep -n -B5 -A5 "ORA-00235" <rman_or_job_log> | tail -40
      check: "실패한 작업(백업·모니터링 조회)을 특정 — 백업이면 백업 누락 여부 기록 · 정상: 재시도에서 성공"
      note: "적용: 모든 버전 · 권한: 작업 로그 읽기"
  - stage: 2
    steps:
    - do: (2차·승인 후) 실패 작업 재실행·일정 분리
      cmd: |
        crontab -l > /tmp/crontab_oracle_$(date +%Y%m%d).bak
        crontab -e        # RMAN 백업 시각을 대량 배치(로그 스위치 폭주) 시간과 분리
        rman target / cmdfile=<backup_script.rcv> log=<log_path>
      check: "성공: 재실행 백업 완료(v$rman_status COMPLETED), 이후 ORA-00235 미발생 · 실패: 반복 발생 → 3차(Oracle SR)"
      note: "사전조건: 백업 담당과 새 일정 합의, 재실행 시 업무 부하 확인 · 영향: 백업 수행 중 I/O 부하 · 승인: DBA·백업 담당 · 백업/롤백: crontab 사본(첫 줄)으로 원복(crontab /tmp/crontab_oracle_<날짜>.bak) · 적용: 10gR2~19c"
  - stage: 3
    steps:
    - do: Oracle SR 자료
      cmd: |
        adrci exec="set home diag/rdbms/<db>/<SID>; ips create package time '<start>' to '<end>'; ips generate package 1 in /tmp"
      check: "IPS 패키지·RMAN 로그·v$rman_status·로그 스위치 이력"
      note: "민감정보 마스킹: 호스트명·경로·백업 매체 정보를 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

# ══════════════════════════ Tibero · storage ══════════════════════════
- id: TBR-PROC-R6-FILE
  scope: id
  products: [tibero]
  category: storage
  match: [TBR-1001, TBR-1003]
  title: 파일 생성·열기 실패 — 경로·권한·공간·마운트 (TBR-1001 · TBR-1003)
  source: "Tibero 6/7 에러 참조 안내서(TBR-1001·TBR-1003)·관리자 안내서 '테이블스페이스 관리(데이터파일)'·'로그($TB_HOME/instance/$TB_SID/log/slog·dlog)'·참조 안내서 'V$DATAFILE'"
  stages:
  - stage: 1
    steps:
    - do: 실패 파일 경로·OS 오류 확인 (읽기 전용)
      cmd: |
        grep -h -E "TBR-1001|TBR-1003" $TB_HOME/instance/$TB_SID/log/slog/* $TB_HOME/instance/$TB_SID/log/dlog/* 2>/dev/null | tail -20
      check: "메시지의 파일 경로·errno 기록 — ENOENT=경로 없음, EACCES=권한, ENOSPC=공간 · 실패한 작업(ADD DATAFILE·백업·기동)을 함께 기록"
      note: "적용: Tibero 6/7 로그 경로 · 권한: Tibero 설치 OS 계정"
    - do: 디렉터리·파일·마운트·DB 등록 경로 확인 (읽기 전용)
      cmd: |
        id ; ls -ld <dir> ; ls -l <file>
        df -h <dir> ; df -i <dir> ; mount | grep <mount>
        tbsql <dba_user>          # 비밀번호는 접속 프롬프트에서 입력
        SQL> select file#, name, status from v$datafile;
        SQL> quit
      check: "디렉터리 없음·Tibero 계정 쓰기 권한 없음·공간/inode 100%·미마운트면 확정 · v$datafile 경로와 실제 경로 철자가 다르면 경로 오타 · 실패한 작업은 원인 조치 전 다시 실행하지 않음"
      note: "적용: Tibero 6/7 (DB 가 MOUNT 이상일 때 v$datafile 조회 가능) · 권한: Tibero OS 계정, DBA 조회 권한"
  - stage: 2
    steps:
    - do: (2차·승인 후) 디렉터리·권한 정정 또는 마운트 복구 후 실패 작업 재실행
      cmd: |
        ls -ld <dir> > /tmp/tbr_dir_before_$(date +%Y%m%d).txt
        mkdir -p <dir> ; chown <tibero_user>:<group> <dir>
        df -h <dir>
      check: "성공: 실패했던 작업(ADD DATAFILE·백업·기동) 재실행 성공, 같은 TBR-1001/1003 미발생 · 실패: 파일 유실이면 백업 복구 절차(TBR-PROC-R6-RECOVERY)로"
      note: "사전조건: 올바른 경로를 DBA 와 확정, 마운트 복구는 시스템 담당이 수행 · 영향: 권한 변경이 다른 프로그램 디렉터리에 미치지 않도록 대상만 · 승인: DBA·시스템 담당 · 백업/롤백: 변경 전 ls -ld 결과(첫 줄) 보관, 원래 소유자로 chown 원복, 새로 만든 빈 디렉터리는 제거 가능 · 적용: Tibero 6/7"
  - stage: 3
    steps:
    - do: TmaxTibero 기술지원 자료
      cmd: |
        tar czf tibero_file_$(date +%Y%m%d).tgz $TB_HOME/config/$TB_SID.tip $TB_HOME/instance/$TB_SID/log/slog
      check: "tip·slog·ls/df/mount 결과"
      note: "민감정보 마스킹: tip 의 IP·포트, 경로의 업무명·호스트명을 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: TBR-PROC-R6-REDO
  scope: id
  products: [tibero]
  category: storage
  match: [TBR-1006, TBR-1007, TBR-1008, TBR-1016, TBR-1018, TBR-1019, TBR-1039, TBR-1042]
  title: 리두 로그 멤버 열기·읽기·쓰기 실패·손상 (TBR-1006 · 1007 · 1008 · 1016 · 1018 · 1019 · 1039 · 1042)
  source: "Tibero 6/7 에러 참조 안내서(TBR-1006~1042)·관리자 안내서 '로그 파일 관리(로그 그룹·멤버)'·참조 안내서 'V$LOG, V$LOGFILE'"
  verify_note: "미검증 — Tibero 의 로그 멤버 재구성 구문(ALTER DATABASE DROP LOGFILE MEMBER / ADD LOGFILE MEMBER … TO GROUP)을 버전별 공식 문서로 확인하지 못함(Oracle 호환 구문 기준으로 적음)"
  stages:
  - stage: 1
    steps:
    - do: 오류 멤버·그룹 상태 확인 (읽기 전용)
      cmd: |
        grep -h -E "TBR-10(06|07|08|16|18|19|39|42)" $TB_HOME/instance/$TB_SID/log/slog/* 2>/dev/null | tail -20
        tbsql <dba_user>          # 비밀번호는 접속 프롬프트에서 입력
        SQL> select group#, sequence#, members, archived, status from v$log;
        SQL> select group#, member from v$logfile order by group#;
        SQL> quit
      check: "오류 멤버가 속한 그룹·상태 확인 — 같은 그룹 다른 멤버가 정상이면 운영 계속(다중화 깨짐, TBR-1016/1018) · CURRENT 그룹의 모든 멤버 실패(TBR-1008 쓰기)면 커밋 정지·인스턴스 종료 위험 → DBA 즉시"
      note: "적용: Tibero 6/7 · 권한: Tibero OS 계정, DBA 조회 권한"
    - do: 멤버 파일·공간·스토리지 확인 (읽기 전용)
      cmd: |
        ls -l <member1> <member2>
        df -h <mount> ; mount | grep <mount>
        dmesg -T | grep -i "i/o error" | tail
      check: "파일 없음(1006)·같은 그룹 멤버끼리 크기 다름(1019 잘림·교체)·공간 100%·읽기 전용 마운트(1008)·I/O 오류(1007/1042) 로 원인 구분 · 정상: 존재·크기 동일·오류 없음"
      note: "적용: Linux (AIX 는 errpt) · 권한: Tibero OS 계정, dmesg 는 root 필요할 수 있음"
  - stage: 2
    steps:
    - do: (2차·승인 후) 손상 멤버 재구성 (CURRENT 가 아닌 그룹, 정상 멤버가 있을 때)
      cmd: |
        tbsql <dba_user>
        SQL> select group#, status from v$log where group#=<n>;
        SQL> alter database drop logfile member '<손상 멤버 경로>';
        SQL> alter database add logfile member '<새 멤버 경로>' to group <n>;
        SQL> select group#, member from v$logfile where group#=<n>;
      check: "성공: 새 멤버가 v$logfile 에 보이고 로그 스위치 뒤 오류 미발생 · 실패: 그룹이 CURRENT 라 거부 → 로그 스위치 후 재시도, 구문 오류면 TmaxTibero 기술지원 확인"
      note: "사전조건: 대상 그룹이 CURRENT 가 아님, 공간·스토리지 원인 해소(TBR-1008 은 공간 확보 먼저), 손상 파일은 이름만 바꿔 보관 · 영향: 온라인 수행, 재구성 동안 그 그룹은 다중화 1벌 · 승인: DBA · 백업/롤백: 작업 전 v$logfile 결과 보관, 추가 멤버는 drop logfile member 로 되돌림, 작업 직후 백업 · 적용: Tibero 6/7 (그룹 전체 손상·CURRENT 손상은 3차)"
  - stage: 3
    steps:
    - do: TmaxTibero 기술지원 자료
      cmd: |
        tar czf tibero_redo_$(date +%Y%m%d).tgz $TB_HOME/config/$TB_SID.tip $TB_HOME/instance/$TB_SID/log/slog
      check: "tip·slog·v$log/v$logfile 결과·ls/df/dmesg 결과"
      note: "민감정보 마스킹: tip 의 IP·포트, 경로·호스트명을 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: TBR-PROC-R6-BLOCK
  scope: id
  products: [tibero]
  category: storage
  match: [TBR-1009, TBR-1010, LEG-TBR-CORRUPT]
  title: 데이터 블록 손상·불일치 (TBR-1009 · TBR-1010 · 블록 손상 로그)
  source: "Tibero 6/7 에러 참조 안내서(TBR-1009·TBR-1010)·관리자 안내서 '백업과 복구(미디어 복구, tbrmgr)'·유틸리티 안내서 'tbdv(데이터파일 검증)'·참조 안내서 'V$DATAFILE, DBA_EXTENTS'"
  verify_note: "미검증 — tbdv 실행 조건(DB 정지·파일 오프라인 필요 여부)과 옵션, tbrmgr 블록 단위 복구 지원 여부를 공식 문서로 확인하지 못함"
  stages:
  - stage: 1
    steps:
    - do: 손상 파일·블록 번호 확보 (읽기 전용)
      cmd: |
        grep -rn -i -E "TBR-1009|TBR-1010|corrupt" $TB_HOME/instance/$TB_SID/log 2>/dev/null | tail -20
      check: "file#·block#·발생 시각 기록 — 같은 파일에서 반복되면 하부 I/O(부분 쓰기) 의심"
      note: "적용: Tibero 6/7 (slog·dlog 포함) · 권한: Tibero OS 계정"
    - do: 영향 객체·파일 상태·스토리지 확인 (읽기 전용)
      cmd: |
        tbsql <dba_user>          # 비밀번호는 접속 프롬프트에서 입력
        SQL> select file#, name, status from v$datafile where file#=<file#>;
        SQL> select owner, segment_name, segment_type from dba_extents where file_id=<file#> and <block#> between block_id and block_id+blocks-1;
        SQL> quit
        dmesg -T | grep -i "i/o error" | tail
      check: "segment_type 이 INDEX 면 재생성으로 해결 가능, TABLE 이면 백업 복구 필요 · 파일 status 가 RECOVER 면 미디어 복구 필요 · I/O 오류 동반이면 스토리지 조치 먼저"
      note: "적용: Tibero 6/7 · 권한: DBA 조회 권한, dmesg 는 root 필요할 수 있음 (AIX 는 errpt | head -20)"
  - stage: 2
    steps:
    - do: (2차·승인 후) 손상 인덱스 재생성 (segment_type INDEX)
      cmd: |
        tbsql <dba_user>
        SQL> alter index <owner>.<index> rebuild;
        SQL> select index_name, status from dba_indexes where owner='<OWNER>' and index_name='<INDEX>';
      check: "성공: status VALID, 같은 블록 오류 미발생 · 실패: 오류 지속 → 테이블 블록 손상이므로 아래 복구 단계"
      note: "사전조건: 업무 외 시간, 테이블 크기만큼 임시 공간 확인 · 영향: 재생성 동안 해당 인덱스 사용 SQL 성능 저하·DML 잠금 가능 · 승인: DBA·업무 담당 · 백업/롤백: 인덱스 DDL(dbms_metadata.get_ddl 또는 개발 저장소) 보관 후 재생성, 데이터 변경 없음 · 적용: Tibero 6/7"
    - do: (2차·승인 후) 데이터파일 검증·미디어 복구 (테이블 블록 손상)
      cmd: |
        cp -p <datafile 경로> <보관 경로>/$(basename <datafile 경로>).before_$(date +%Y%m%d)
        tbdv <datafile 경로>
        # 백업(tbrmgr)에서 해당 데이터파일 복원 후 미디어 복구 — 관리자 안내서 '백업과 복구' 절차
      check: "성공: tbdv 결과 손상 블록 0, 복구 후 해당 객체 조회 정상 · 실패: 백업 없음 → 손상 행을 건너뛴 데이터 추출·객체 재생성을 TmaxTibero 기술지원과 결정"
      note: "사전조건: 해당 파일 소속 업무 일시 중지, 유효 백업·아카이브 확인, tbdv 실행 조건(오프라인 필요 여부) 확인 · 영향: 복구 동안 해당 테이블스페이스 사용 불가 · 승인: DBA·서비스 담당 · 백업/롤백: 작업 전 손상 파일 사본(첫 줄) 보관, 복원은 되돌릴 수 없음 · 적용: Tibero 6/7"
  - stage: 3
    steps:
    - do: TmaxTibero 기술지원 자료
      cmd: |
        tar czf tibero_block_$(date +%Y%m%d).tgz $TB_HOME/instance/$TB_SID/log/slog $TB_HOME/config/$TB_SID.tip
      check: "slog·tbdv 결과·dba_extents 결과·스토리지 오류 기록·백업 목록"
      note: "민감정보 마스킹: 세그먼트 이름의 업무명·호스트명·경로를 가리고, 블록 덤프에 업무 데이터가 있으면 제외 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: TBR-PROC-R6-RECOVERY
  scope: id
  products: [tibero]
  category: storage
  match: [TBR-1022, TBR-1023, TBR-1028, TBR-1043, TBR-1044, TBR-1049, TBR-1058, TBR-1070, TBR-1147, TBR-24018]
  title: 미디어 복구·RESETLOGS 진행 오류 — 복구 필요·로그 필요·불완전 복구 완료·CF/DD 불일치 (TBR-1049 · 1147 · 1070 · 1023 · 1022 · 24018 등)
  source: "Tibero 6/7 관리자 안내서 '백업과 복구(미디어 복구·불완전 복구·RESETLOGS, V$RECOVER_FILE)'·'기동과 종료(tbboot -t MOUNT / RESETLOGS)'·에러 참조 안내서(TBR-1022~1147·TBR-24018)"
  verify_note: "미검증 — Tibero 미디어 복구 SQL 구문(ALTER DATABASE RECOVER AUTOMATIC DATABASE [UNTIL …])을 버전별 공식 문서로 확인하지 못함, 관리자 안내서 '백업과 복구' 의 구문을 먼저 확인 후 사용 · V$RECOVER_FILE·V$LOG 가 MOUNT 단계에서 조회되는지도 공식 문서로 확인 못 함(V$LOGFILE 은 MOUNT 조회 가능 — 2차 교차 검토자가 공식 문서로 확인) · TBR-1022 상세 인자(%1$s·%2$s)의 뜻은 확인 못 함"
  stages:
  - stage: 1
    steps:
    - do: 인스턴스 단계·복구 대상 확인 (읽기 전용)
      cmd: |
        ps -ef | grep -E "[t]bsvr"
        tbsql <dba_user>          # 비밀번호는 접속 프롬프트에서 입력
        SQL> select status from v$instance;
        SQL> select * from v$recover_file;
        SQL> select file#, name, status from v$datafile;
        SQL> quit
      check: "MOUNT 상태에서 v$recover_file 에 행 = 미디어 복구 필요(TBR-1049) · 복구 직후 TBR-1070 = 불완전 복구 완료 → 다음은 RESETLOGS 기동 · TBR-1023 = RESETLOGS 로 기동해야 함 · TBR-24018 = 컨트롤파일과 사전의 데이터파일 목록 불일치(백업 이후 추가 파일)"
      note: "적용: Tibero 6/7 · 권한: Tibero OS 계정, sys 등 DBA 계정 · MOUNT 상태에서는 DBA_ 정적 뷰가 조회되지 않을 수 있음"
    - do: 요구 로그·아카이브 존재·복구 기록 확인 (읽기 전용)
      cmd: |
        ls -lt $TB_HOME/instance/$TB_SID/log/slog/ | head -10
        grep -n -B10 -E "TBR-(1022|1023|1028|1043|1044|1049|1058|1070|1147|24018)" $(ls -tr $TB_HOME/instance/$TB_SID/log/slog/* | tail -5) | tail -120
        grep -i "ARCHIVE" $TB_HOME/config/$TB_SID.tip
        ls -lt <archive_dir> | head -20
      check: "가장 최신 slog 파일 하나만 보지 않는다 — 회전으로 오류가 이전 파일에 있을 수 있어 최근 5개 파일(오래된 것→최신 순)을 함께 보고, 출력 앞머리의 파일 이름과 시각으로 장애 시각 줄을 고른다 · 각 오류 줄 앞 10줄(-B10)에 바로 앞 오류가 TBR- 로 시작하지 않는 줄(OS 오류·파일 경로·권한 거부 등)이어도 보이므로 그것을 원인 후보로 기록 · 오류 줄이 파일 첫 10줄 안이면 바로 앞 파일의 끝(`tail -20 <이전 slog 파일>`)도 본다 · TBR-1022(RESETLOGS 실패)는 그 줄의 상세 인자(%1$s·%2$s — 찍힌 문구 그대로 읽는다)와 바로 앞 줄들의 오류(복구 미완료·직전 비정상 종료·리두 로그 경로/권한 후보)로 원인을 가르고, 최근 5개 파일·앞 10줄에서 원인이 보이지 않으면 판정 불가로 기록하고 3차(제조사) 의뢰 · TBR-1147 의 thread·sequence 가 아카이브 디렉터리에 없으면 백업 매체에서 복원 필요 · 같은 시퀀스 파일 크기가 다른 파일보다 작으면 잘림(TBR-1028/1044/1058) · 복구 목표 시점이 승인된 시점과 다르면 RESETLOGS 전에 중단(2차 판단)"
      note: "적용: Tibero 6/7 · 권한: Tibero OS 계정 · 회전된 파일이 압축돼 있으면 grep 대신 zgrep 으로 · 같은 기동·복구 명령을 1차에서 반복 실행하지 않음(RESETLOGS 는 되돌릴 수 없음)"
  - stage: 2
    steps:
    - do: (2차·승인 후) 요구 로그 복원 후 미디어 복구 계속
      cmd: |
        cp -p <backup_media>/<요구 아카이브 파일> <archive_dir>/
        tbboot -t MOUNT
        tbsql <dba_user>
        SQL> alter database recover automatic database;
        SQL> select * from v$recover_file;
      check: "성공: v$recover_file 비어 있음, 이어서 tbdown 후 tbboot(완전 복구) 기동 NORMAL · 실패: TBR-1147 다른 시퀀스 요구 → 그 로그 복원 반복, 로그가 없으면 불완전 복구 범위 승인 요청"
      note: "사전조건: 백업 담당과 요구 시퀀스·백업 매체 확인, 현재 데이터파일·컨트롤파일·tip 사본 확보 · 영향: 복구 동안 DB 서비스 불가, 아카이브 적용 시간 소요 · 승인: DBA·서비스 담당 · 백업/롤백: 복구 전 전체 파일 사본 보관(복구 적용은 되돌릴 수 없음) · 적용: Tibero 6/7"
    - do: (2차·승인 후) 불완전 복구 완료 뒤 RESETLOGS 기동 (TBR-1070 · TBR-1023)
      cmd: |
        tbdown
        tbboot -t RESETLOGS
        tbsql <dba_user>
        SQL> select status from v$instance;
      check: "성공: status NORMAL, sys.log 에 기동 완료 — 즉시 전체 백업 · 실패: TBR-1022(RESETLOGS 실패) → 선행 오류(복구 미완료·직전 비정상 종료·로그 경로 권한) 확인 후 3차"
      note: "사전조건: 복구 목표 시점과 데이터 손실 범위를 업무 책임자가 승인, 복구가 끝났는지(TBR-1070) 확인, 전체 파일 사본 확보 · 영향: RESETLOGS 이후 이전 백업·아카이브로 되돌릴 수 없음, 기동 동안 서비스 불가 · 승인: DBA·서비스 담당·업무 책임자 · 백업/롤백: 작업 전 콜드 사본이 유일한 롤백 수단, 완료 직후 전체 백업(tbrmgr) · 적용: Tibero 6/7 (관리자 안내서: 직전 비정상 종료 시 RESETLOGS 사용 불가)"
  - stage: 3
    steps:
    - do: TmaxTibero 기술지원 자료
      cmd: |
        tar czf tibero_recovery_$(date +%Y%m%d).tgz $TB_HOME/config/$TB_SID.tip $TB_HOME/instance/$TB_SID/log/slog
        ls -l <archive_dir> > tibero_archive_list_$(date +%Y%m%d).txt
      check: "tip·slog·v$recover_file 결과·아카이브 목록·복구 작업 기록(명령·시각)·백업 목록"
      note: "민감정보 마스킹: tip 의 IP·포트, 경로·호스트명을 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: TBR-PROC-R6-BACKUPMODE
  scope: id
  products: [tibero]
  category: storage
  match: [TBR-24010]
  title: 테이블스페이스 온라인 백업 모드 잔존 (TBR-24010)
  source: "Tibero 6/7 관리자 안내서 '백업과 복구(온라인 백업 BEGIN/END BACKUP)'·참조 안내서 'V$BACKUP'·에러 참조 안내서(TBR-24010)"
  stages:
  - stage: 1
    steps:
    - do: 백업 모드 파일·진행 중 백업 확인 (읽기 전용)
      cmd: |
        tbsql <dba_user>          # 비밀번호는 접속 프롬프트에서 입력
        SQL> select * from v$backup;
        SQL> quit
        ps -ef | grep -i -E "[t]brmgr|[b]ackup" | head
        grep -n -i -E "begin backup|end backup|error|TBR-" <backup_script_log> | tail -20
      check: "v$backup 에 ACTIVE 파일이 있고 백업 프로세스가 없으면 END BACKUP 누락(스크립트 비정상 종료) 확정 · 백업이 아직 진행 중이면 끝날 때까지 대기 · 정상: ACTIVE 없음"
      note: "적용: Tibero 6/7 · 권한: DBA 조회 권한, 백업 로그 읽기"
  - stage: 2
    steps:
    - do: (2차·승인 후) 백업 모드 종료 후 요청 작업 재실행
      cmd: |
        tbsql <dba_user>
        SQL> alter tablespace <TS> end backup;
        SQL> select * from v$backup;
      check: "성공: 해당 파일 ACTIVE 해제, 요청 작업(DDL 등) 재실행 성공 · 실패: 오류 → 백업이 진행 중인지 다시 확인"
      note: "사전조건: 백업 담당이 백업 완료·중단 여부 확인, 이번 백업본의 유효성은 별도 확인(불완전하면 재백업) · 영향: 진행 중 백업에 END 를 하면 그 백업은 쓸 수 없음 · 승인: DBA·백업 담당 · 백업/롤백: 상태 해제만 하며 데이터 변경 없음 — 백업 유효성이 의심되면 즉시 재백업, 스크립트는 사본 보관 후 수정 · 적용: Tibero 6/7"
  - stage: 3
    steps:
    - do: TmaxTibero 기술지원 자료
      cmd: |
        tar czf tibero_bkmode_$(date +%Y%m%d).tgz $TB_HOME/instance/$TB_SID/log/slog <backup_script_log>
      check: "slog·백업 스크립트와 로그·v$backup 결과"
      note: "민감정보 마스킹: 스크립트 안 계정명·경로·호스트명을 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

# ══════════════════════════ Tibero · internal ══════════════════════════
- id: TBR-PROC-R6-SQLOBJ
  scope: id
  products: [tibero]
  category: internal
  match: [TBR-28012, TBR-8063, TBR-8103, TBR-10007, TBR-150008]
  title: 객체 상태·SQL 정의 오류 — 인덱스 UNUSABLE·UNIQUE 위반·순환 시노님·LONG 칼럼·Java 클래스 (TBR-28012 · 10007 · 8103 · 8063 · 150008)
  source: "Tibero 7 에러 참조 안내서(TBR-28012·TBR-10007·TBR-8103·TBR-8063·TBR-150008)·참조 안내서 '정적 뷰(DBA_INDEXES, DBA_CONSTRAINTS, DBA_CONS_COLUMNS, DBA_SYNONYMS, DBA_OBJECTS, DBA_TBL_COLUMNS)'·초기화 파라미터 'JAVA_CLASS_PATH'"
  stages:
  - stage: 1
    steps:
    - do: 실패 SQL·대상 객체 확인 (읽기 전용)
      cmd: |
        grep -n -B5 -A2 -E "TBR-(28012|10007|8103|8063|150008)" <app_log> | tail -60
      check: "오류 번호별로 대상 객체를 특정 — 28012 인덱스, 10007 '소유자'.'제약조건', 8103 시노님, 8063 LONG 칼럼 SQL, 150008 Java 클래스 · DB 장애가 아닌 객체·SQL 단위 오류"
      note: "적용: Tibero 6/7 · 권한: 애플리케이션 로그 읽기"
    - do: 객체 상태·정의 확인 (읽기 전용)
      cmd: |
        tbsql <dba_user>          # 비밀번호는 접속 프롬프트에서 입력
        SQL> select owner, index_name, status from dba_indexes where index_name='<INDEX>';
        SQL> select c.owner, c.constraint_name, c.constraint_type, c.table_name, cc.column_name from dba_constraints c, dba_cons_columns cc where cc.owner=c.owner and cc.constraint_name=c.constraint_name and c.owner='<OWNER>' and c.constraint_name='<CONSTRAINT>';
        SQL> select owner, synonym_name, org_object_owner, org_object_name from dba_synonyms where synonym_name='<SYN>';
        SQL> select owner, object_name, object_type, status from dba_objects where object_name='<ORG_OBJECT>';
        SQL> select owner, table_name, column_name from dba_tbl_columns where data_type='LONG' and table_name='<TABLE>';
        SQL> quit
        grep -i "JAVA_CLASS_PATH" $TB_HOME/config/$TB_SID.tip
      check: "인덱스 UNUSABLE = TBR-28012 확정(직전 이동·대량 적재 DDL 확인) · 제약 칼럼의 중복 키 = 10007(채번·중복 요청) · org_object 가 다시 시노님을 가리키거나 원본 객체가 없으면 8103 · LONG 칼럼이 조건·연산에 쓰이면 8063 · JAVA_CLASS_PATH 아래 클래스 파일이 없거나 노드마다 다르면 150008"
      note: "적용: Tibero 6/7 (DBA_TBL_COLUMNS·DBA_SYNONYMS.ORG_OBJECT_* 는 Tibero 명칭) · 권한: DBA 조회 권한 — 1차는 DBA 에게 결과 요청"
  - stage: 2
    steps:
    - do: (2차·승인 후) 인덱스 재생성·시노님 재생성
      cmd: |
        tbsql <dba_user>
        SQL> alter index <owner>.<index> rebuild;
        SQL> create or replace synonym <owner>.<syn> for <원본 소유자>.<원본 객체>;
        SQL> select index_name, status from dba_indexes where index_name='<INDEX>';
      check: "성공: 인덱스 VALID, 시노님으로 조회 성공, 같은 오류 미발생 · 실패: 재생성 오류(공간) → 테이블스페이스 확인, 시노님은 보관한 정의로 원복"
      note: "사전조건: 업무 외 시간, 현재 dba_synonyms 조회 결과 보관, 원본 객체 소유자를 개발팀과 확정 · 영향: 인덱스 재생성 동안 성능 저하·DML 잠금 가능 · 승인: DBA·개발팀 · 백업/롤백: 시노님은 보관한 정의로 재생성, 인덱스 DDL 보관 · 적용: Tibero 6/7"
    - do: (2차·승인 후) 중복 키·SQL·Java 클래스 정정 (개발팀)
      config:
        file: 애플리케이션 SQL·채번 로직·$TB_HOME/config/$TB_SID.tip(JAVA_CLASS_PATH)
        snippet: |
          -- TBR-10007: 중복 요청·재처리 차단, 시퀀스 다음 값을 기존 최대 키보다 크게 (정정 전 대상 행 백업 테이블로 복사)
          -- TBR-8063: LONG 칼럼을 조건·연산·복사 대상에서 빼고 별도 조회로 분리
          -- TBR-150008: 클래스 파일을 모든 노드(TAC)의 JAVA_CLASS_PATH 같은 경로에 같은 버전으로 배포
        note: "사전조건: 개발 환경에서 재현·검증, 배포 대상 노드 목록 확정 · 영향: 배포 동안 해당 기능 일시 중단 가능 · 승인: 개발팀·DBA·업무 담당 · 백업/롤백: 이전 소스·클래스 파일·tip 사본 보관 후 배포, 데이터 정정 전 백업 테이블 생성"
      check: "성공: 같은 입력 재실행 시 오류 미발생 · 실패: 다른 TBR 코드로 바뀌면 그 코드 판정으로"
  - stage: 3
    steps:
    - do: TmaxTibero 기술지원·개발팀 전달 자료
      cmd: |
        grep -n -B5 -A2 -E "TBR-(28012|10007|8103|8063|150008)" <app_log> | tail -200 > tibero_sqlobj_$(date +%Y%m%d).txt
      check: "오류 발췌·객체 조회 결과·tip 의 JAVA_CLASS_PATH·버전"
      note: "민감정보 마스킹: SQL 리터럴·키 값(개인정보)·계정명·호스트명을 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: TBR-PROC-R6-COMPANION
  scope: id
  products: [tibero]
  category: internal
  match: [TBR-2131, TBR-21001, TBR-15163]
  title: 일반 I/O·트랜잭션 시작 불가·PSM 역추적 — 동반 오류로 원인 특정 (TBR-2131 · TBR-21001 · TBR-15163)
  source: "Tibero 7 에러 참조 안내서(TBR-2131·TBR-21001·TBR-15163)·관리자 안내서 '로그(sys.log)'·참조 안내서 'V$SESSION, DBA_SOURCE'"
  stages:
  - stage: 1
    steps:
    - do: 같은 시각 동반 오류·스택의 원래 오류 확인 (읽기 전용)
      cmd: |
        tail -n 300 $TB_HOME/instance/$TB_SID/log/slog/sys.log | grep -E "[[]E[]]|[[]F[]]|TBR-" | tail -30
        grep -n -B8 -A2 -E "TBR-2131|TBR-21001|TBR-15163" <app_log> | tail -60
      check: "이 세 코드는 원인이 아니라 결과·위치 정보 — TBR-21001 앞뒤의 TBR-21002(UNDO 부족)·21004(익스텐트 부족)·세션 한도, TBR-15163 앞에 찍힌 원래 오류, TBR-2131 과 같은 시각의 파일·네트워크 오류가 실제 원인 · 그 코드로 판정을 다시 본다"
      note: "적용: Tibero 6/7 · 권한: Tibero OS 계정(sys.log), 애플리케이션 로그 읽기"
    - do: 네트워크·세션·PSM 위치 확인 (읽기 전용)
      cmd: |
        nc -zvw3 <db_host> <port>
        dmesg -T | tail -30
        tbsql <dba_user>          # 비밀번호는 접속 프롬프트에서 입력
        SQL> select status, count(*) from v$session group by status;
        SQL> select line, text from dba_source where owner='<OWNER>' and name='<PSM>' and line between <줄-5> and <줄+5> order by line;
        SQL> quit
      check: "nc 실패·dmesg 네트워크/디스크 오류면 TBR-2131 하위 원인 · 세션 수가 한도 근처면 21001 의 자원 원인 · PSM 해당 줄 문장을 개발팀에 전달(15163) · 정상: 동반 오류 없음 — 일회성이면 재발 감시"
      note: "적용: Tibero 6/7 · 권한: DBA 조회 권한, dmesg 는 root 필요할 수 있음"
  - stage: 2
    steps:
    - do: (2차·승인 후) 동반 오류 원인 해소 후 실패 업무 재처리
      cmd: |
        tbsql <dba_user>
        SQL> select tablespace_name, round(sum(bytes)/1024/1024) free_mb from dba_free_space group by tablespace_name;
        SQL> alter tablespace <UNDO_TS> add datafile '<path>' size <크기> autoextend on maxsize <상한>;
      check: "성공: 동반 오류·TBR-21001 미발생, 재처리 업무 정상 완료 · 실패: 다른 동반 오류 → 그 코드 절차로"
      note: "사전조건: 동반 오류가 UNDO·공간 부족으로 확인된 경우만 공간 추가, 디스크 여유 확인, 재처리 대상 목록을 업무 담당과 확정 · 영향: 파일 생성 중 I/O 증가, 재처리 중복 실행 위험 · 승인: DBA·업무 담당 · 백업/롤백: 추가 파일은 축소 불가하므로 용량 계획 반영, 재처리 전 대상 데이터 백업 · 적용: Tibero 6/7"
    - do: (2차·승인 후) PSM 예외 처리 보완 (TBR-15163, 개발팀)
      config:
        file: <OWNER>.<PSM> 소스(개발팀 저장소)
        snippet: |
          EXCEPTION
            WHEN OTHERS THEN
              <오류 기록 테이블 INSERT>(SQLCODE, SQLERRM);
              RAISE;   -- 오류를 삼키지 않는다
        note: "사전조건: 원래 오류 원인 수정이 먼저, 개발 환경 검증 · 영향: 재컴파일 순간 의존 객체 무효화 가능 · 승인: 개발팀·DBA · 백업/롤백: 배포 전 현재 소스(dba_source) 보관 후 원복 가능"
      check: "성공: 원래 오류 미발생, 발생 시 기록 테이블에 남음 · 실패: 컴파일 오류 → 보관 소스로 원복"
  - stage: 3
    steps:
    - do: TmaxTibero 기술지원 자료
      cmd: |
        tail -n 1000 $TB_HOME/instance/$TB_SID/log/slog/sys.log > tibero_syslog_$(date +%Y%m%d).txt
      check: "sys.log 발췌·애플리케이션 스택·세션/공간 조회 결과·네트워크 시험 결과"
      note: "민감정보 마스킹: 클라이언트 IP·계정명·SQL 바인드값·호스트명을 가린 뒤 전달 · 전달 승인: DBA 확인 후 보안 담당 승인"

- id: TBR-PROC-R6-UTIL
  scope: id
  products: [tibero]
  category: internal
  match: [LEG-TIBERO-TBRU-001-62FE, LEG-TIBERO-TPR-001-D40A]
  title: 유틸리티(tbexport·tbimport·tbloader)·성능 수집(TPR) 작업 실패 (TBRU- · TPR-)
  source: "Tibero 6/7 유틸리티 안내서(tbexport·tbimport·tbloader)·관리자 안내서 'TPR(Tibero Performance Repository)'·에러 참조 안내서"
  verify_note: "미검증 — TPR 수집 주기·보관 파라미터 이름을 공식 문서로 확인하지 못함(변경은 TmaxTibero 기술지원 확인 후)"
  stages:
  - stage: 1
    steps:
    - do: 실패한 유틸리티·TPR 작업과 번호 확인 (읽기 전용)
      cmd: |
        grep -n "TBRU-" <작업로그경로> | tail -20
        grep -n "TPR-" $TB_HOME/instance/$TB_SID/log/slog/sys.log | tail -20
      check: "TBRU 는 유틸리티 쪽 오류(인자·파일 경로·권한·공간), TPR 은 성능 스냅샷 저장 오류 — DB 서비스 자체 장애인지 아닌지부터 구분"
      note: "적용: Tibero 6/7 · 권한: 작업 로그·Tibero OS 계정"
    - do: DB 상태·공간·덤프 경로 확인 (읽기 전용)
      cmd: |
        tbsql <dba_user>          # 비밀번호는 접속 프롬프트에서 입력
        SQL> select status from v$instance;
        SQL> select tablespace_name, round(sum(bytes)/1024/1024) free_mb from dba_free_space group by tablespace_name;
        SQL> quit
        df -h <dump_or_data_dir> ; ls -ld <dump_or_data_dir>
      check: "DB NORMAL 이면 유틸리티 인자·경로·공간 문제 · 덤프 디렉터리 공간 100%·권한 없음이면 TBRU 원인 · TPR 저장 테이블스페이스 free_mb 가 0 근접이면 TPR 원인"
      note: "적용: Tibero 6/7 · 권한: DBA 조회 권한"
  - stage: 2
    steps:
    - do: (2차·승인 후) 원인 해소 후 유틸리티 재실행·부분 적재분 처리
      cmd: |
        df -h <dump_or_data_dir>
        tbsql <dba_user>
        SQL> alter tablespace <TS> add datafile '<path>' size <크기> autoextend on maxsize <상한>;
        # 이어 실패한 tbexport/tbimport/tbloader 를 같은 인자로 재실행
      check: "성공: 유틸리티 로그에 오류 없이 완료, 적재 건수 대사 일치, TPR- 미발생 · 실패: 같은 TBRU 번호 → 인자·문자셋·파일 형식 확인 후 기술지원"
      note: "사전조건: 부분 적재분 처리 방침(삭제 후 재적재·이어 적재)을 업무 담당이 결정, 공간 추가는 디스크 여유 확인 · 영향: 재적재 동안 대상 테이블 잠금·I/O 증가 · 승인: DBA·업무 담당 · 백업/롤백: 재적재 전 대상 테이블 백업(tbexport), 추가 파일은 축소 불가하므로 용량 계획 반영 · 적용: Tibero 6/7"
  - stage: 3
    steps:
    - do: TmaxTibero 기술지원 자료
      cmd: |
        tar czf tibero_util_$(date +%Y%m%d).tgz <작업로그경로> $TB_HOME/instance/$TB_SID/log/slog/sys.log
      check: "유틸리티 명령 인자·작업 로그·sys.log·공간 조회 결과"
      note: "민감정보 마스킹: 작업 로그의 데이터 행(개인정보)·계정명·경로·호스트명을 가린 뒤 전달, 덤프 파일 자체는 전달하지 않음 · 전달 승인: DBA 확인 후 보안 담당 승인"

