# 근거 매뉴얼·작성 기준 (6차 아이디어 3, 2026-10-16) — 제품 무관('*') 레거시·키워드·하드웨어 룰의 '이 판정 전용' 절차 (계층 공통 토큰 os-common · was-common)
# 근거: ipmitool(1) 매뉴얼(sdr type·sel elist·fru print·chassis power, -E 는 비밀번호를 환경 변수 IPMI_PASSWORD 에서 읽음),
#       RHEL 8/9 문서(Configuring device mapper multipath·Managing storage devices·Configuring and managing virtualization(virsh)),
#       man7.org ip(8)·ethtool(8)·proc(5)(/proc/meminfo·CommitLimit), IBM AIX 7.2 문서(errpt·fcstat·lspath·chpath·lsps·chps·svmon),
#       Microsoft Learn(Get-InitiatorPort·Update-HostStorageCache·mpclaim·Get-Counter·Win32_PageFileUsage),
#       VMware vSphere ESXi 6.7/7.0/8.0 esxcli·vim-cmd·vmkping·vm-support 운용 명령, VMware PowerCLI(Get-Snapshot·Remove-Snapshot·Get-VIEvent·
#       Get-DrsRecommendation·Invoke-DrsRecommendation·Move-VM·Export-VDSwitch·Get-VMHostFirmware·Set-VMHost),
#       Cisco IOS/IOS-XE 운용 명령(show interfaces·show ip ospf neighbor/interface·show spanning-tree detail·show tech-support), Juniper Junos show 명령,
#       Oracle Java SE Troubleshooting Guide 'Fatal Error Log(hs_err_pid)'·'Native Memory Tracking'.
# 작성 기준: knowledge_spec.md(GPT 45차 관문) — 1차는 읽기 전용(재기동·삭제·설정 변경·카운터 초기화 금지), 여러 플랫폼 명령은 '# Linux' '# AIX' '# Windows' '# ESXi' 등으로 나란히,
#           2차는 note 에 사전조건·영향·승인·백업/롤백, check 에 성공/실패, 3차는 민감정보 마스킹·전달 승인. 자리표시자만 사용(<server> <PID> <vm> <esxi> <if> 등).
#           비밀번호는 명령행에 쓰지 않는다(ipmitool 은 -E·환경 변수), 포트 시험은 nc -zvw3 만.
# 이 파일의 절차는 match 의 룰 ID 에 '이 판정 전용'으로 연결된다(logtriage/procedures.py: ID 지정 > 제품+유형 > 계층 공통+유형).
# products 토큰을 os-common/was-common 그대로 두지 않고 '-match' 를 붙인 까닭: 이 파일은 이름순으로 sw_procedures.yaml 보다 먼저 읽혀,
#   계층 공통 토큰을 쓰면 '계층 공통·유형'(점수 1) 후보 중 맨 앞이 되어 다른 판정 51건(AIX·Solaris·HP-UX 등 hardware 37, JEUS·Tomcat·WebLogic memory 14)의
#   COMMON-PROC-HARDWARE·JAVA-PROC-MEMORY 연결을 온도·네이티브 메모리 절차로 바꿔 버린다(2026-10-16 측정). '-match' 토큰은 계층 공통 연결에 쓰이지 않으므로 match 의 ID 로만 붙는다.
# 판정 근거: 기존 연결 COMMON-PROC-HARDWARE(서버 SEL·RAID·SMART·디스크 격리) / JAVA-PROC-MEMORY(힙 OOM — 힙 증설 방향)가 이 룰들의 실제 원인·조치와 맞지 않아 전용으로 둔다.
procedures:
# ───────────────────────── 서버 환경 센서: 온도·팬 ─────────────────────────
- id: OSC-PROC-R6-THERMAL
  scope: id
  products: [os-common-match]
  category: hardware
  match: [LEG-KW-OVERTEMP, LEG-KW-FAN-WARN, LEG-HW-TEMP-WARN, LEG-HW-OVERTEMP, LEG-HW-WARN-TEMP]
  title: 서버 과온도·냉각 팬 이상 (온도 경고·과열 셧다운·팬 속도 저하)
  source: "ipmitool(1) 매뉴얼(sdr type Temperature/Fan·sel elist·fru print·chassis power, -I lanplus -E) / IBM AIX 7.2 errpt / Oracle Solaris 11 fmadm(1M) / 서버 제조사 관리 콘솔(HPE iLO·Dell iDRAC·Lenovo XCC) 온도·팬 화면"
  stages:
  - stage: 1
    steps:
    - do: 온도·팬 센서 값과 상태 확인 (읽기 전용)
      cmd: |
        # Linux (IPMI 지원 서버)
        ipmitool sdr type Temperature
        ipmitool sdr type Fan
        # 서버가 이미 꺼졌으면 BMC 웹 콘솔(iLO·iDRAC·XCC)의 온도·팬 화면으로 같은 내용을 확인
      check: "상태 열이 ok 가 아닌 센서(nc=경고·cr=임계·nr=복구 불가)가 있으면 확정 · 0 RPM·lcr 팬이 있으면 팬 고장이 원인 · 팬 정상인데 Inlet(흡기) 온도가 높으면 서버실 냉각 문제"
      note: "적용: IPMI 2.0 BMC 가 있는 x86 서버, ipmitool 1.8.x(RHEL 7~9) · 권한: root(/dev/ipmi0 접근) · 센서 이름(Inlet·CPU1 Temp·Fan1A 등)은 제조사마다 다름"
    - do: 과열·팬 이벤트 발생 시각과 반복 여부 확인
      cmd: |
        # Linux
        ipmitool sel elist | grep -iE 'temp|thermal|fan' | tail -20
        journalctl -k --since '-1 day' | grep -iE 'thermal|throttl|temperature' | tail -20
        # AIX (Power 서버)
        errpt -d H | head -20
        # Solaris (SPARC·ILOM)
        fmadm faulty
      check: "같은 센서가 반복 Asserted 면 부품(팬·방열판) 문제 · 'CPU throttled'·'temperature above threshold' 가 함께 있으면 성능 저하 동반 · AIX 하드웨어(H) 항목·fmadm faulty 결과에 팬/온도 결함이 있으면 확정"
      note: "적용: ipmitool(Linux) / AIX 7.1~7.3 / Solaris 10·11 · 권한: root · SEL 은 조회만(sel clear 금지 — 제조사 분석 근거가 사라짐)"
    - do: 같은 랙·서버실 동시 상승 여부 확인 (원인 분기)
      cmd: |
        # 같은 랙의 다른 서버 2~3대에서 흡기 온도 비교 (각 서버에서 실행)
        ipmitool sdr type Temperature | grep -iE 'inlet|ambient'
        # 시설(항온항습기·랙 온도) 감시 화면은 시설 담당에 확인 요청
      check: "여러 서버의 Inlet 이 함께 오르면 항온항습·공조 장애(시설 담당) · 한 서버만 높으면 그 서버의 팬·블랭킹 패널·케이블 막힘(서버 담당)"
      note: "적용: IPMI 서버 공통 · 권한: root · 흡기 온도 권고 범위는 제조사 사양서 기준(ASHRAE 권고 18~27℃ 를 많이 따름)"
  - stage: 2
    steps:
    - do: 냉각 복구 요청과 업무 우회 (과열 지속 시)
      cmd: |
        # 1) 시설 담당에 항온항습·공조 복구 요청, 랙 앞면 블랭킹 패널·케이블 막힘 제거
        # 2) 온도가 cr 에 근접하면 업무를 다른 서버로 우회 (L4 제외·클러스터 절체·vMotion)
        # 3) 계획 정지가 필요하면 업무 담당 승인 후 OS 정상 종료
        shutdown -h +5 "planned stop: overheating"      # Linux
      check: "성공: Inlet·CPU 온도가 ok 로 돌아오고 SEL 에 새 온도 이벤트 없음, 우회한 업무 정상 · 실패: 냉각 후에도 단일 서버만 높으면 팬·방열 부품 결함 → 제조사 교체"
      note: "사전조건: 1차에서 원인(시설/단일 서버) 분기 완료, 우회 대상 서버 여유 확인 · 영향: 계획 정지 시 해당 서버 업무 중단, 과열 방치 시 하드웨어 손상·강제 셧다운 · 승인: 시스템 담당·업무 담당·시설 담당 · 백업/롤백: 정지 전 최신 백업 확인, 우회는 L4·클러스터에 원래 구성으로 재투입하면 되돌림 · 적용: 위 shutdown -h 는 Linux 문법 — AIX·Solaris·Windows 는 각 OS 의 정상 종료 절차(업무 서비스 먼저 정지)를 따름"
    - do: 고장 팬 교체 (Hot-swap) — 제조사 엔지니어
      cmd: |
        # 교체 전·후 확인
        ipmitool sdr type Fan
        ipmitool sdr type Temperature
      check: "성공: 교체 팬이 정상 RPM·ok, 온도 ok 복귀 · 실패: 새 팬도 0 RPM 이면 팬 보드·메인보드 문제 → 제조사 추가 진단"
      note: "사전조건: 제조사 케이스 접수·부품 번호 확인, 해당 모델이 Hot-swap 팬인지 사양 확인(아니면 계획 정지 필요) · 영향: 교체 중 다른 팬이 최대 회전(소음)·일시 온도 상승 · 승인: 시스템 담당·변경 관리 · 백업/롤백: 설정 변경 없음, 교체 실패 시 원래 팬 재장착 · 적용: Hot-swap 팬 지원 서버"
    - do: 과열 셧다운 뒤 원격 전원 투입 (냉각 확인 후)
      cmd: |
        # 비밀번호는 명령행에 쓰지 않고 환경 변수로 넘김(-E)
        read -s IPMI_PASSWORD ; export IPMI_PASSWORD
        ipmitool -I lanplus -H <bmc_addr> -U <user> -E chassis power status
        ipmitool -I lanplus -H <bmc_addr> -U <user> -E chassis power on
        unset IPMI_PASSWORD
      check: "성공: power status 가 on, OS 부팅 후 온도 ok·SEL 에 새 과열 이벤트 없음 · 실패: 곧바로 다시 꺼지면 냉각 미복구 또는 센서·팬 결함 → 전원 투입 중단, 제조사 진단"
      note: "사전조건: 서버실 온도 정상 복귀와 팬 정상 확인(BMC 화면), 꺼진 원인이 과열임을 SEL 로 확인 · 영향: 부팅 동안 업무 미복구, 원인 미해소 시 재셧다운·부품 손상 · 승인: 시스템 담당·업무 담당 · 백업/롤백: 설정 변경 없음 — 이상 시 chassis power soft 로 정상 종료 · 적용: IPMI over LAN(lanplus) 활성화된 BMC"
  - stage: 3
    steps:
    - do: 제조사 의뢰 자료
      cmd: |
        ipmitool sel elist > sel_$(date +%Y%m%d).txt
        ipmitool sdr elist > sdr_$(date +%Y%m%d).txt
        ipmitool fru print > fru_$(date +%Y%m%d).txt
        # HPE: Active Health System 로그 · Dell: SupportAssist 수집(TSR) — BMC 웹 콘솔에서 내려받기
      check: "SEL·SDR·FRU(모델·시리얼)·관리 콘솔 진단 로그·발생 시각·서버실 온도 기록"
      note: "민감정보 마스킹: 호스트명·BMC/서버 IP·계정 이름을 가림(FRU 의 시리얼은 케이스 처리에 필요하므로 유지) · 전달 승인: 보안 담당 승인 후 제조사 반출"

# ───────────────────────── 서버 환경 센서: 전원·PSU·전압 ─────────────────────────
- id: OSC-PROC-R6-POWER
  scope: id
  products: [os-common-match]
  category: hardware
  match: [LEG-GEN-POWER-WARN, LEG-KW-PSU-WARN, LEG-KW-VOLT-WARN, LEG-HW-WARN-POWER]
  title: 서버 전원 공급 이상 (PSU 고장·AC 입력 상실·전압 범위 이탈·PDU/UPS 경고)
  source: "ipmitool(1) 매뉴얼(sdr type 'Power Supply'/Voltage·sel elist·fru print) / IBM AIX 7.2 errpt / IBM HMC 명령(lssyscfg·lssvcevents)·ASMI / Oracle Solaris 11 fmadm(1M) / 서버 제조사 관리 콘솔(iLO·iDRAC·XCC) 전원 화면 / 시설 UPS·PDU 감시 화면"
  verify_note: "미검증 — HMC `lssvcevents -t hardware --filter status=open` 형식은 IBM 지원 문서(HMC 업그레이드 준비)로만 확인, `lssyscfg -r sys -F name,state` 의 상태 값과 ASMI 메뉴 이름은 IBM 문서로 확인하지 못함"
  stages:
  - stage: 1
    steps:
    - do: PSU·전압 센서 상태 확인 (읽기 전용) — IPMI 지원 하드웨어(x86 BMC 서버)에만 해당
      cmd: |
        # Linux (IPMI 지원 서버만 — IBM Power·IPMI 없는 장비는 이 단계를 건너뛰고 다음 단계의 HMC/ASMI·errpt·ILOM 으로)
        ipmitool sdr type 'Power Supply'
        ipmitool sdr type Voltage
      check: "PSU 줄에 'Failure detected'·'Power Supply AC lost' 가 있으면 PSU 또는 입력 전원 이상 · 전압 센서가 lnc/lcr/unc/ucr 면 범위 이탈이지만 전압 센서만으로 PSU 고장을 확정하지 않음(PSU 상태 센서·SEL 과 함께 판단) · PSU 가 1개만 정상이면 이중화 상실(긴급)"
      note: "적용: IPMI 2.0 BMC x86 서버, ipmitool 1.8.x — IPMI 를 지원하지 않는 하드웨어(IBM Power 등)에는 해당 없음 · 권한: root · 센서 이름(PS1 Status·12V·Vcore 등)은 제조사마다 다름"
    - do: 전원 이벤트 시각·반복과 다른 장비 동시 발생 여부 확인 (플랫폼별)
      cmd: |
        # Linux (IPMI 지원 서버만)
        ipmitool sel elist | grep -iE 'power supply|ac lost|volt|redundancy' | tail -20
        # IBM Power (HMC CLI, 조회 계정) — 관리 시스템 상태와 열린 하드웨어 서비스 이벤트, 또는 ASMI 오류 로그 화면
        lssyscfg -r sys -F name,state
        lssvcevents -t hardware --filter status=open
        # AIX (Power 서버 OS)
        errpt -d H | head -20
        # Solaris (SPARC·ILOM)
        fmadm faulty
      check: "'AC lost' 가 같은 시각 여러 서버에 있으면 PDU·UPS·분전반(시설) 문제 · 한 서버의 한 PSU 만 반복이면 그 PSU·전원 케이블 · 'Redundancy Lost' 면 남은 PSU 하나로 운영 중 · IBM Power 는 HMC 의 열린 하드웨어 이벤트(전원 관련 SRC)와 errpt 항목 시각이 맞으면 그 부품"
      note: "적용: ipmitool(IPMI 지원 Linux 서버) / IBM HMC(Power 서버) / AIX 7.1~7.3 / Solaris 10·11 · 권한: root, HMC 조회 계정 · SEL·서비스 이벤트는 조회만(sel clear·이벤트 닫기 금지)"
    - do: 전원 이중화(A/B 피드) 연결 확인
      cmd: |
        # 현장·시설 담당 확인: 두 PSU 가 서로 다른 PDU(A/B 피드)에 꽂혀 있는가, 해당 PDU·UPS 의 경보·부하율
        # 관리 콘솔(iLO·iDRAC·XCC) 전원 화면에서 PSU 별 입력 전압·출력 와트 확인
      check: "두 PSU 가 같은 PDU 에 꽂혀 있으면 이중화 무효(구성 결함) · UPS 가 배터리 운전·과부하 경보면 시설 긴급"
      note: "적용: 이중 PSU 서버 공통 · 권한: 관리 콘솔 읽기 계정 · 랙 안 작업(케이블 만지기)은 1차에서 하지 않음"
  - stage: 2
    steps:
    - do: 고장 PSU Hot-swap 교체 — 제조사 엔지니어
      cmd: |
        # 교체 전·후 확인
        ipmitool sdr type 'Power Supply'
        ipmitool sel elist | tail -5
      check: "성공: 모든 PSU 'Presence detected' 만 표시, SEL 에 'Redundancy Regained'(또는 동등) 기록 · 실패: 새 PSU 도 Failure 면 입력 전원(PDU 콘센트)·전원 백플레인 문제 → 시설·제조사 동시 확인"
      note: "사전조건: 남은 PSU 가 정상이고 서버 소비 전력을 혼자 감당하는지(관리 콘솔 와트) 확인, 같은 용량·모델 PSU 준비 · 영향: 교체 동안 단일 PSU 운영(추가 장애 시 서버 정지) · 승인: 시스템 담당·변경 관리 · 백업/롤백: 설정 변경 없음, 새 PSU 이상 시 즉시 분리하고 원래 상태(단일 PSU)로 유지 · 적용: Hot-swap PSU 서버 — ipmitool 확인은 IPMI 지원 서버만, IBM Power 는 HMC 서비스 이벤트·관리 시스템 상태로 교체 전·후 확인"
    - do: 입력 전원(PDU·UPS) 복구 또는 A/B 피드 재배선
      cmd: |
        # 시설 담당: 분전반 차단기·PDU·UPS 복구 / 같은 PDU 에 꽂힌 PSU 는 계획 작업으로 다른 피드로 옮김(한 번에 한 PSU)
        ipmitool sdr type 'Power Supply'      # 각 단계 후 확인
      check: "성공: 두 PSU 모두 AC 입력 정상, 전압 센서 ok · 실패: 재배선 중 'AC lost' 가 두 PSU 에 동시에 뜨면 즉시 원래 콘센트로 복구"
      note: "사전조건: 대상 PDU 의 용량·부하율 확인, 한 번에 한 PSU 만 옮기는 순서 합의, 업무 영향 최소 시간대 · 영향: 작업 순간 단일 PSU 운영, 잘못 뽑으면 서버 정지 · 승인: 시설 담당·시스템 담당·업무 담당 · 백업/롤백: 작업 전 PSU-PDU 연결표 작성·사진 보관, 이상 시 연결표대로 원복"
  - stage: 3
    steps:
    - do: 제조사·시설 의뢰 자료
      cmd: |
        ipmitool sel elist > sel_$(date +%Y%m%d).txt
        ipmitool sdr elist > sdr_$(date +%Y%m%d).txt
        ipmitool fru print > fru_$(date +%Y%m%d).txt
        # 위 ipmitool 3줄은 IPMI 지원 서버만 — IBM Power 는 HMC 의 해당 서비스 이벤트 상세(SRC·FRU 목록)와 errpt -a 출력, 또는 HMC 의 진단 자료 수집 기능
        # 시설: 같은 시각 UPS·PDU 이벤트 기록
      check: "SEL·SDR·FRU(PSU 부품 번호·시리얼)·UPS/PDU 이벤트·발생 시각 (IBM Power: 서비스 이벤트 SRC·errpt)"
      note: "민감정보 마스킹: 호스트명·BMC/서버 IP·계정 이름을 가림(시리얼은 케이스 처리에 필요) · 전달 승인: 보안 담당 승인 후 제조사 반출"

# ───────────────────────── 네트워크 장비: 링크 다운·플래핑 ─────────────────────────
- id: OSC-PROC-R6-NET-LINK
  scope: id
  products: [os-common-match]
  category: hardware
  match: [LEG-NET-LINK-DOWN, LEG-KW-NET-WARN]
  title: 스위치·라우터 포트 링크 다운·플래핑 (LINEPROTO/LINK UPDOWN·BGP/OSPF 인접 변경 경보)
  source: "Cisco IOS/IOS-XE 운용 명령(show interfaces·show interfaces transceiver·show interfaces status err-disabled·show logging·show ip bgp summary·show tech-support) / Juniper Junos(show interfaces extensive·show log messages) / man7.org ip(8)·ethtool(8)"
  stages:
  - stage: 1
    steps:
    - do: 포트 상태·오류 카운터 확인 (읽기 전용)
      cmd: |
        # Cisco IOS / IOS-XE
        show interfaces <if>
        show interfaces status err-disabled
        show interfaces <if> transceiver detail
        # Juniper Junos
        show interfaces <if> extensive
      check: "down/down 이면 물리(케이블·SFP·상대 장비) · up/down 이면 상대와 L2 설정 불일치 · administratively down 이면 누군가 설정으로 닫음(변경 이력 확인) · CRC·input errors 가 계속 늘면 케이블·SFP 불량 · err-disabled 면 사유 열(bpduguard·link-flap 등)대로 분기 · 수광(Rx) 전력이 경고 임계 밖이면 광모듈·광케이블"
      note: "적용: Cisco IOS 15.x·IOS-XE 16.x+ (transceiver detail 은 DOM 지원 SFP·플랫폼만, err-disabled 는 Catalyst 계열), Junos 공통 · 권한: 읽기 권한(privilege 1 또는 운영 계정) · clear counters 는 1차 금지(증가 추세를 잃음)"
    - do: 다운 시각·반복(플래핑)과 인접 경보 확인
      cmd: |
        # Cisco
        show logging | include <if>
        show logging | include UPDOWN|ADJCHANGE|ADJCHG
        show ip bgp summary
        show cdp neighbors <if> detail
        # Juniper
        show log messages | match <if>
      check: "짧은 간격으로 up/down 반복이면 플래핑(케이블·SFP·상대 NIC) · BGP 이웃 State/PfxRcd 칸이 숫자가 아니면(Idle·Active) 세션 다운 → 링크 원인인지 같은 시각 UPDOWN 과 대조 · CDP 로 상대 장비·포트 식별"
      note: "적용: Cisco IOS/IOS-XE, Junos · 권한: 읽기 권한 · BGP·OSPF 만 끊기고 링크는 정상이면 OSC-PROC-R6-NET-OSPF 또는 라우팅 담당으로"
    - do: 상대가 서버면 서버 NIC 쪽 확인
      cmd: |
        # Linux
        ip -s link show <nic>
        ethtool <nic> | grep -E 'Speed|Duplex|Link detected'
        # Windows (PowerShell)
        Get-NetAdapter | Select-Object Name,Status,LinkSpeed
      check: "Link detected: no·Status Disconnected 면 같은 물리 구간 · 속도/듀플렉스가 스위치 포트와 다르면 협상 불일치 · RX errors 증가면 케이블"
      note: "적용: RHEL 7~9(iproute2·ethtool) / Windows Server 2012+ · 권한: 일반 사용자(ethtool 일부 항목은 root)"
  - stage: 2
    steps:
    - do: 케이블·SFP 교체 또는 포트 재활성화 (err-disabled·플래핑 원인 제거 후)
      cmd: |
        show running-config interface <if>       # 변경 전 설정 기록
        configure terminal
         interface <if>
          shutdown
          no shutdown
         end
        show interfaces <if>
      check: "성공: line protocol is up, 오류 카운터 더 늘지 않음, 10분 이상 UPDOWN 재발 없음 · 실패: 다시 down 이나 err-disabled 면 원인 미해소 → 포트 닫힌 상태로 두고 상대 장비·SFP 교체"
      note: "사전조건: 1차에서 원인(케이블·SFP·상대 장비·bpduguard 등) 확인, 해당 포트 연결 장비와 업무 확인, 이중화(포트채널·이중 경로) 다른 쪽 정상 · 영향: shutdown 동안 그 포트 통신 끊김, 단일 경로면 업무 중단 · 승인: 네트워크 담당·업무 담당·변경 관리 · 백업/롤백: 변경 전 running-config 를 저장(터미널 로그 또는 copy running-config flash:<파일>), 검증 전까지 write memory 하지 않음 — 이상 시 기록한 설정으로 원복 · 적용: Cisco IOS/IOS-XE (Junos 는 set/delete interfaces <if> disable 후 commit confirmed)"
    - do: 속도·듀플렉스 불일치 수정
      cmd: |
        configure terminal
         interface <if>
          speed <값>
          duplex <full|auto>
         end
      check: "성공: 양단 속도·듀플렉스 일치, CRC·late collision 증가 멈춤 · 실패: 링크가 올라오지 않으면 즉시 이전 값으로 원복"
      note: "사전조건: 상대 장비(서버 NIC) 설정값 확인, 양단을 같은 방식(둘 다 auto 또는 둘 다 고정)으로 합의 · 영향: 적용 순간 링크 재협상(수 초 끊김) · 승인: 네트워크 담당·서버 담당 · 백업/롤백: show running-config interface <if> 출력 보관 후 이전 값으로 원복"
  - stage: 3
    steps:
    - do: 장비 제조사 의뢰 자료
      cmd: |
        show tech-support | redirect flash:tech_<날짜>.txt
        show inventory
        show logging
      check: "show tech-support·inventory(모델·시리얼·SFP 부품 번호)·장애 시각 로그"
      note: "show tech-support 는 일부 장비에서 CPU 를 오래 쓰므로 업무 부하 낮은 시간에 · 민감정보 마스킹: 설정에 든 비밀번호 해시·SNMP community·TACACS/RADIUS 키·내부 IP 대역·호스트명을 가림 · 전달 승인: 보안 담당 승인 후 반출"

# ───────────────────────── 네트워크 장비: OSPF 인접 ─────────────────────────
- id: OSC-PROC-R6-NET-OSPF
  scope: id
  products: [os-common-match]
  category: hardware
  match: [LEG-NET-OSPF]
  title: OSPF 인접 관계 다운 (Dead Interval 만료·ExStart 정체)
  source: "Cisco IOS/IOS-XE 운용 명령(show ip ospf neighbor·show ip ospf interface·show interfaces·ip ospf hello-interval/dead-interval·ip mtu) / Juniper Junos(show ospf neighbor·show ospf interface detail)"
  stages:
  - stage: 1
    steps:
    - do: 이웃 상태와 정체 단계 확인 (읽기 전용)
      cmd: |
        # Cisco
        show ip ospf neighbor
        show logging | include OSPF
        # Juniper
        show ospf neighbor
      check: "FULL(또는 DROTHER 와 2WAY)이 정상 · 이웃 없음이면 링크·Hello 미수신 · INIT 에 머물면 한쪽만 Hello 수신(ACL·멀티캐스트 차단) · EXSTART/EXCHANGE 에 머물면 MTU 불일치가 가장 흔함 · 'Dead timer expired' 면 Hello 손실(링크·CPU)"
      note: "적용: Cisco IOS 15.x·IOS-XE 16.x+, Junos · 권한: 읽기 권한 · clear ip ospf process 는 1차 금지(모든 인접이 재수립됨)"
    - do: 양단 인터페이스 설정 비교 (타이머·영역·네트워크 유형·MTU)
      cmd: |
        # Cisco (양쪽 장비에서)
        show ip ospf interface <if>
        show interfaces <if> | include MTU|line protocol
        # Juniper
        show ospf interface <if> detail
      check: "Hello/Dead 타이머·Area ID·네트워크 유형(BROADCAST/POINT_TO_POINT)·인증 유형·MTU 가 양단에서 같아야 함 — 다르면 그 항목이 원인 · 링크 자체가 down 이면 OSC-PROC-R6-NET-LINK 로"
      note: "적용: Cisco IOS/IOS-XE, Junos · 권한: 읽기 권한 · 인증 키 값은 화면·기록에 남기지 않음"
  - stage: 2
    steps:
    - do: 불일치 항목을 상대와 맞춤 (타이머·MTU)
      cmd: |
        show running-config interface <if>      # 변경 전 설정 기록
        configure terminal
         interface <if>
          ip ospf hello-interval <초>
          ip ospf dead-interval <초>
          ip mtu <값>
         end
        show ip ospf neighbor
      check: "성공: 이웃이 FULL 로 올라오고 경로가 라우팅 테이블에 복구, 30분 이상 ADJCHG 재발 없음 · 실패: 여전히 EXSTART·INIT 면 다른 불일치(인증·영역) 확인, 다른 이웃까지 끊기면 즉시 원복"
      note: "사전조건: 양단 설정을 1차에서 비교해 바꿀 쪽과 값 합의(보통 표준값을 쓰는 쪽에 맞춤), 우회 경로 확인 · 영향: 타이머·MTU 변경 순간 그 인터페이스 인접 재수립(수 초~수십 초 경로 변동) · 승인: 네트워크 담당·변경 관리 · 백업/롤백: 변경 전 running-config 저장, 검증 전 write memory 금지 — 이상 시 기록 값으로 원복 · 적용: Cisco IOS/IOS-XE (ip ospf mtu-ignore 는 근본 해결이 아니므로 쓰지 않음)"
  - stage: 3
    steps:
    - do: 장비 제조사 의뢰 자료
      cmd: |
        show ip ospf neighbor detail
        show ip ospf database | redirect flash:ospfdb_<날짜>.txt
        show tech-support | redirect flash:tech_<날짜>.txt
      check: "이웃 상세·OSPF DB·show tech·양단 인터페이스 설정·장애 시각 로그"
      note: "show tech-support·ospf database 는 출력이 커 업무 부하 낮은 시간에 · 민감정보 마스킹: OSPF 인증 키·비밀번호 해시·SNMP community·내부 IP 대역·호스트명을 가림 · 전달 승인: 보안 담당 승인 후 반출"

# ───────────────────────── 네트워크 장비: STP 토폴로지 변경 ─────────────────────────
- id: OSC-PROC-R6-NET-STP
  scope: id
  products: [os-common-match]
  category: hardware
  match: [LEG-NET-STP]
  title: STP 토폴로지 변경 반복·루프 의심 (TCN·루트 변경·BPDU 수신)
  source: "Cisco IOS/IOS-XE 운용 명령(show spanning-tree detail/summary/root/inconsistentports·show processes cpu·spanning-tree portfast/bpduguard) / Juniper Junos(show spanning-tree bridge·show spanning-tree interface)"
  stages:
  - stage: 1
    steps:
    - do: 토폴로지 변경 횟수·발생 포트 확인 (읽기 전용)
      cmd: |
        # Cisco
        show spanning-tree detail | include ieee|occurr|from|is exec
        show spanning-tree summary
        # Juniper
        show spanning-tree bridge
      check: "'Number of topology changes' 가 몇 분 사이 계속 늘면 불안정 · 'from <if>' 에 나온 포트가 변경을 일으킨 곳 — 그 포트의 상대 장비를 따라가 같은 명령 반복 · 서버·PC 가 붙은 포트에서 변경이 나오면 PortFast 미설정"
      note: "적용: Cisco IOS 15.x·IOS-XE 16.x+(PVST+/Rapid-PVST+/MST), Junos · 권한: 읽기 권한"
    - do: 루트 브리지 변경·루프 징후 확인
      cmd: |
        # Cisco
        show spanning-tree root
        show spanning-tree inconsistentports
        show interfaces status err-disabled
        show logging | include SPANTREE|MACFLAP
        show processes cpu sorted | include CPU
      check: "루트 브리지 ID 가 설계한 장비가 아니면 잘못된 장비가 루트를 차지(우선순위 문제) · MACFLAP(같은 MAC 이 두 포트 사이 이동)·CPU 급등이 함께 있으면 루프 — 긴급 · inconsistent·bpduguard err-disabled 포트는 보호 기능이 동작한 곳"
      note: "적용: Cisco Catalyst IOS/IOS-XE · 권한: 읽기 권한"
  - stage: 2
    steps:
    - do: 루프 포트 격리 (루프 확정 시)
      cmd: |
        show running-config interface <if>      # 변경 전 설정 기록
        configure terminal
         interface <if>
          shutdown
         end
      check: "성공: MACFLAP·토폴로지 변경 증가가 멈추고 CPU 정상화 · 실패: 계속되면 격리 포트가 원인이 아님 → 즉시 no shutdown 으로 되살리고 다른 후보 포트 확인"
      note: "사전조건: 1차에서 'from <if>'·MACFLAP 포트로 원인 포트 특정, 그 포트 연결 장비·업무 확인 · 영향: 격리 포트에 붙은 장비 통신 끊김 · 승인: 네트워크 담당·업무 담당(루프로 전체 장애 중이면 네트워크 책임자 구두 승인 후 기록) · 백업/롤백: 변경 전 설정 기록, interface <if> → no shutdown 으로 되돌림 · 적용: Cisco IOS/IOS-XE"
    - do: 단말 포트 보호 설정 (PortFast·BPDU Guard)과 루트 우선순위 고정
      cmd: |
        configure terminal
         interface <if>
          spanning-tree portfast
          spanning-tree bpduguard enable
         exit
         spanning-tree vlan <vlan> priority <4096 배수>
         end
      check: "성공: 단말 포트 연결·해제 때 토폴로지 변경이 더 생기지 않고 루트 ID 가 설계 장비로 고정 · 실패: 스위치가 붙은 포트에 portfast·bpduguard 를 걸어 err-disabled 가 나면 그 포트 설정 원복"
      note: "사전조건: 대상 포트가 서버·PC 같은 단말 전용인지(스위치·허브 연결 아님) 확인, 루트로 정한 장비 합의 · 영향: 우선순위 변경은 해당 VLAN 전체 STP 재계산(수 초 통신 지연) · 승인: 네트워크 담당·변경 관리 · 백업/롤백: 변경 전 running-config 저장, 이상 시 no spanning-tree portfast / no spanning-tree bpduguard enable / no spanning-tree vlan <vlan> priority 로 원복 · 적용: Cisco IOS/IOS-XE(트렁크 단말은 portfast trunk)"
  - stage: 3
    steps:
    - do: 장비 제조사 의뢰 자료
      cmd: |
        show spanning-tree detail | redirect flash:stp_<날짜>.txt
        show tech-support | redirect flash:tech_<날짜>.txt
      check: "STP 상세·show tech·토폴로지 변경 발생 포트·루트 변경 시각·네트워크 구성도"
      note: "show tech-support 는 업무 부하 낮은 시간에 · 민감정보 마스킹: 비밀번호 해시·SNMP community·내부 IP 대역·호스트명·구성도의 주소를 가림 · 전달 승인: 보안 담당 승인 후 반출"

# ───────────────────────── 스토리지 경로: FC HBA ─────────────────────────
- id: OSC-PROC-R6-FC-HBA
  scope: id
  products: [os-common-match]
  category: hardware
  match: [LEG-STOR-FIBER-CHANNEL]
  title: FC HBA 포트 오류·링크 다운 (경로 감소)
  source: "RHEL 9 'Configuring device mapper multipath'·'Managing storage devices'(/sys/class/fc_host·rescan-scsi-bus.sh) / IBM AIX 7.2 fcstat·lspath·chpath·cfgmgr / Microsoft Learn Get-InitiatorPort·Update-HostStorageCache·mpclaim / VMware ESXi esxcli storage san fc"
  stages:
  - stage: 1
    steps:
    - do: HBA 포트 상태·WWPN 확인 (읽기 전용)
      cmd: |
        # Linux
        grep -H . /sys/class/fc_host/host*/port_state /sys/class/fc_host/host*/port_name
        grep -H . /sys/class/fc_host/host*/statistics/link_failure_count /sys/class/fc_host/host*/statistics/loss_of_sync_count
        # AIX
        fcstat fcs<N> | head -40
        # Windows (PowerShell)
        Get-InitiatorPort | Select-Object NodeAddress,PortAddress,ConnectionType,OperationalStatus
        # ESXi
        esxcli storage san fc list
      check: "port_state 가 Online 이 아니면(Linkdown·Offline) 그 포트 장애 · link_failure·loss_of_sync 가 계속 늘면 케이블·SFP·스위치 포트 · AIX fcstat 의 Link Failure·Loss of Sync 증가도 같음 · WWPN(port_name)은 스토리지·스위치 담당과 대조용으로 기록"
      note: "적용: RHEL 7~9 / AIX 7.1~7.3 / Windows Server 2012+ / ESXi 6.7~8.0 · 권한: 읽기는 일반 사용자(Linux sysfs)·root(AIX fcstat)·관리자(Windows) · 통계 초기화는 1차 금지"
    - do: 다중 경로 상태 확인 (업무 영향 판단)
      cmd: |
        # Linux
        multipath -ll | grep -iE 'failed|faulty|active' | head -30
        # AIX
        lspath | grep -v Enabled
        # Windows
        mpclaim -s -d
        # ESXi
        esxcli storage core path list | grep -iE 'State:|Runtime Name' | head -40
      check: "모든 LUN 에 active 경로가 하나 이상 남아 있으면 업무는 유지(이중화 상실 상태) · 어떤 LUN 이든 경로가 모두 failed 면 I/O 중단 — 긴급, 스토리지 담당 즉시 호출"
      note: "적용: device-mapper-multipath(RHEL) / AIX MPIO / Windows MPIO / ESXi NMP · 권한: root·관리자"
    - do: 커널 로그·스위치 측 확인 요청
      cmd: |
        # Linux
        journalctl -k --since '-2 hours' | grep -iE 'qla2xxx|lpfc|rport|fc_host' | tail -30
        # AIX
        errpt -d H | head -20
        # FC 스위치 포트 오류(Brocade 예: porterrshow)는 스위치 담당에 요청
      check: "'Link Down'·'rport ... blocked'·'LOOP DOWN' 이 반복이면 물리 구간 · 같은 스위치의 여러 서버가 동시면 스위치·조닝 변경 의심"
      note: "적용: qla2xxx(QLogic/Marvell)·lpfc(Emulex/Broadcom) 드라이버, AIX 7.x · 권한: root"
  - stage: 2
    steps:
    - do: 케이블·SFP 교체 후 경로 재스캔
      cmd: |
        # Linux
        rescan-scsi-bus.sh
        multipath -ll
        # AIX
        cfgmgr -l fcs<N>
        chpath -l <hdisk> -p fscsi<N> -s enable
        lspath
        # Windows (PowerShell)
        Update-HostStorageCache ; mpclaim -s -d
      check: "성공: port_state Online, 모든 경로 active ready·Enabled, 오류 카운터 더 늘지 않음 · 실패: 경로 미복구면 스위치 포트·조닝 확인, 재스캔 중 I/O 오류가 생기면 작업 중단하고 스토리지 담당"
      note: "사전조건: 다른 경로가 active 로 업무를 받치고 있음을 1차에서 확인, 스토리지·스위치 담당과 교체 대상 포트(WWPN) 대조 · 영향: 교체·재스캔 순간 경로 전환에 따른 I/O 지연 · 승인: 스토리지 담당·시스템 담당·변경 관리 · 백업/롤백: 작업 전 multipath -ll·lspath 출력과 WWPN 기록 보관, 이상 시 교체 전 케이블·SFP 로 원복 · 적용: rescan-scsi-bus.sh 는 sg3_utils 패키지(RHEL 7~9), AIX MPIO"
    - do: 반복 오류 시 HBA 교체 (제조사)
      cmd: |
        # 교체 후 새 WWPN 확인 → 스위치 조닝·스토리지 LUN 마스킹 갱신 요청
        grep -H . /sys/class/fc_host/host*/port_name     # Linux
        lscfg -vl fcs<N> | grep -i 'Network Address'      # AIX
      check: "성공: 새 HBA 포트 Online, 조닝 갱신 후 모든 LUN 경로 복구 · 실패: LUN 이 안 보이면 조닝·마스킹 누락 — 스토리지 담당 확인"
      note: "사전조건: 계획 정지 또는 Hot-plug 지원 여부 확인, 이전 WWPN·조닝 기록, 최신 백업 확인 · 영향: HBA 교체 동안 해당 경로 없음, 비 Hot-plug 면 서버 정지 · 승인: 시스템·스토리지 담당·변경 관리 · 백업/롤백: 이전 WWPN·조닝·마스킹 설정 보관 — 새 HBA 이상 시 이전 HBA 재장착과 이전 조닝으로 원복 · 적용: 서버 모델별 PCIe Hot-plug 지원 여부는 제조사 사양 확인"
  - stage: 3
    steps:
    - do: 서버·HBA·스토리지 제조사 의뢰 자료
      cmd: |
        # Linux
        sos report --batch
        modinfo qla2xxx | grep -E '^version' ; modinfo lpfc | grep -E '^version'
        # AIX
        snap -gc
        # ESXi
        vm-support
      check: "sos report/snap·HBA 드라이버·펌웨어 판·multipath 상태·스위치 porterrshow·발생 시각"
      note: "sos report 는 수 분간 CPU·디스크 사용 — 업무 부하 낮은 시간에 (RHEL 7 은 sosreport) · 민감정보 마스킹: 호스트명·IP·계정·설정 파일 내 비밀번호를 가림(sos 4.x 는 --clean 사용 가능), WWPN 은 케이스 처리에 필요한 범위만 · 전달 승인: 보안 담당 승인 후 반출"

# ───────────────────────── VMware: 스냅샷 ─────────────────────────
- id: OSC-PROC-R6-VMW-SNAPSHOT
  scope: id
  products: [os-common-match]
  category: hardware
  match: [LEG-VMW-WARN-SNAPSHOT, LEG-VMW-SNAPSHOT-WARN]
  title: VMware VM 스냅샷 오래됨·체인 과다·통합 필요 (Consolidation needed)
  source: "VMware vSphere ESXi vim-cmd vmsvc(getallvms·get.snapshotinfo·snapshot.remove)·esxcli storage filesystem list / VMware PowerCLI Get-Snapshot·Remove-Snapshot·VirtualMachine.ConsolidateVMDisks"
  stages:
  - stage: 1
    steps:
    - do: 스냅샷 개수·생성일·크기 확인 (읽기 전용)
      cmd: |
        # PowerCLI (vCenter 연결 후)
        Get-Snapshot -VM <vm> | Select-Object VM,Name,Created,SizeGB,Description
        Get-VM | Where-Object { $_.ExtensionData.Runtime.ConsolidationNeeded } | Select-Object Name
        # ESXi 셸
        vim-cmd vmsvc/getallvms | grep <vm>
        vim-cmd vmsvc/get.snapshotinfo <vmid>
      check: "생성 후 72시간 넘은 스냅샷·체인 3개 초과면 정리 대상(VMware 권고: 스냅샷은 백업이 아니며 짧게 유지) · ConsolidationNeeded 가 나온 VM 은 이전 삭제·통합이 실패해 델타가 남은 상태"
      note: "적용: ESXi 6.7·7.0·8.0, PowerCLI 12+ · 권한: vCenter 읽기 전용 역할 이상·ESXi root(SSH) · Description 에 업무 메모가 있을 수 있어 삭제 판단 근거로 기록"
    - do: 델타 디스크 크기와 데이터스토어 여유 확인
      cmd: |
        # ESXi 셸
        ls -lh /vmfs/volumes/<datastore>/<vm>/ | grep -- '-0000'
        esxcli storage filesystem list
      check: "델타(-00000N.vmdk) 합계가 데이터스토어 여유보다 크거나 여유가 10% 미만이면 긴급(델타가 가득 차면 VM 정지) · 통합(삭제)에도 여유 공간이 필요하므로 여유 부족 자체를 먼저 보고"
      note: "적용: ESXi 6.7~8.0(VMFS·NFS) · 권한: ESXi root(SSH) · vSAN 은 파일 이름 형식이 달라 vCenter VM 파일 화면으로 확인"
    - do: 백업 솔루션이 만든 스냅샷인지 확인
      cmd: |
        # PowerCLI — 이름·설명으로 백업 제품(Veeam·NetBackup·Commvault 등) 스냅샷 식별
        Get-Snapshot -VM <vm> | Select-Object Name,Description,Created
      check: "백업 작업 중인 스냅샷이면 손대지 않음(백업 담당 확인) · 백업 종료 후에도 남은 스냅샷이면 백업 제품의 정리 실패 — 2차 정리 대상"
      note: "적용: PowerCLI 12+ · 권한: vCenter 읽기 전용 역할 이상"
  - stage: 2
    steps:
    - do: 불필요 스냅샷 삭제(통합) — 업무 담당 승인 후
      cmd: |
        # PowerCLI
        Get-Snapshot -VM <vm> -Name <snapshot> | Remove-Snapshot -Confirm:$false
        # ESXi 셸 (vCenter 미사용 시)
        vim-cmd vmsvc/snapshot.remove <vmid> <snapshotId>
      check: "성공: 스냅샷 목록에서 사라지고 델타 파일이 없어짐, 데이터스토어 여유 증가 · 실패: 'locked'·'Unable to access file' 이면 백업 프록시가 디스크를 붙잡은 상태 → 백업 담당이 해제 후 재시도"
      note: "사전조건: 업무 담당이 스냅샷 시점으로 되돌릴 필요 없음을 확인, 최신 VM 백업 확인, 데이터스토어 여유 확인 · 영향: 삭제는 델타를 원본에 합치는 작업이라 대용량이면 수십 분~수 시간 I/O 지연·마지막 순간 짧은 멈춤(stun) · 승인: 가상화 담당·업무 담당·변경 관리 · 백업/롤백: 삭제·통합은 되돌릴 수 없음 — 작업 전 VM 백업 성공을 확인하고 비업무 시간에 진행 · 적용: ESXi 6.7~8.0, PowerCLI 12+"
    - do: "'통합 필요' 상태 해소 (Consolidate)"
      cmd: |
        # PowerCLI
        (Get-VM <vm>).ExtensionData.ConsolidateVMDisks()
        # 또는 vCenter › VM › 스냅샷 › 통합
      check: "성공: ConsolidationNeeded 가 False, 남은 델타 없음 · 실패: 파일 잠금 오류면 잠근 호스트·백업 프록시 확인 후 재시도, 공간 부족 오류면 데이터스토어 여유 확보 먼저"
      note: "사전조건: 백업 작업 미실행 확인, 데이터스토어 여유 확인 · 영향: 통합 중 VM I/O 지연·짧은 멈춤 · 승인: 가상화 담당·업무 담당 · 백업/롤백: 되돌릴 수 없음 — 작업 전 VM 백업 확인 · 적용: vSphere 5.0+ 의 ConsolidateVMDisks(ESXi 6.7~8.0)"
  - stage: 3
    steps:
    - do: VMware 지원 의뢰 자료
      cmd: |
        # ESXi 셸
        vm-support
        # VM 폴더의 vmware.log (통합 실패 사유)
        tail -200 /vmfs/volumes/<datastore>/<vm>/vmware.log
      check: "vm-support 번들·vmware.log·스냅샷 목록·통합 실패 오류 문구·데이터스토어 여유"
      note: "민감정보 마스킹: 번들·로그의 호스트명·IP·계정·VM 이름(업무명 노출 시)을 가림 · 전달 승인: 보안 담당 승인 후 반출"

# ───────────────────────── VMware: 호스트 장애·HA·연결 끊김 ─────────────────────────
- id: OSC-PROC-R6-VMW-HOST
  scope: id
  products: [os-common-match]
  category: hardware
  match: [LEG-VMW-HA-FAIL, LEG-VMW-HOST-DISCONNECT]
  title: ESXi 호스트 장애·vCenter 연결 끊김과 vSphere HA 재시작
  source: "VMware vSphere ESXi 운용 명령(esxcli system stats uptime get·esxcli network ip interface·/var/log/fdm.log·hostd.log·vpxa.log·/etc/init.d/hostd·vpxa·vm-support) / VMware PowerCLI Get-VMHost·Get-VIEvent / 서버 관리 콘솔(iLO·iDRAC) 원격 화면"
  stages:
  - stage: 1
    steps:
    - do: 호스트 연결 상태와 HA 이벤트 확인 (읽기 전용)
      cmd: |
        # PowerCLI (vCenter 연결 후)
        Get-VMHost <esxi> | Select-Object Name,ConnectionState,PowerState
        Get-VIEvent -Start (Get-Date).AddHours(-2) -MaxSamples 2000 | Where-Object { $_.FullFormattedMessage -match 'vSphere HA|disconnected|not responding' } | Select-Object CreatedTime,FullFormattedMessage
      check: "ConnectionState 가 Connected 가 아니면(NotResponding·Disconnected) 단절 · HA 로 다시 켜진 VM 목록과 시각을 기록 — 그 VM 들의 업무 정상 여부를 서비스 담당과 확인"
      note: "적용: vCenter 6.7·7.0·8.0, PowerCLI 12+ · 권한: vCenter 읽기 전용 역할 이상"
    - do: 관리 네트워크 도달과 호스트 생존 확인
      cmd: |
        # vCenter 서버(또는 같은 망 Linux)에서
        ping -c 5 <esxi_mgmt_ip>
        nc -zvw3 <esxi_mgmt_ip> 443
        # Windows (PowerShell)
        Test-NetConnection <esxi_mgmt_ip> -Port 443
        # 응답이 없으면 iLO·iDRAC 원격 화면에서 PSOD(보라색 화면)·전원 상태·IML/SEL 확인
      check: "ping·443 모두 무응답이면 호스트 다운·PSOD·관리망 장애 · ping 은 되고 443 무응답이면 hostd 무응답 · 둘 다 되는데 끊김이면 vpxa·UDP 902 하트비트(방화벽) 의심"
      note: "적용: ESXi 6.7~8.0 · 권한: 일반 사용자(시험), 관리 콘솔 읽기 계정"
    - do: 호스트 셸이 되면 재부팅 여부·에이전트 로그 확인
      cmd: |
        # ESXi 셸 (DCUI 또는 SSH)
        esxcli system stats uptime get
        esxcli network ip interface ipv4 get
        tail -100 /var/log/fdm.log
        grep -iE 'error|fail' /var/log/vpxa.log | tail -30
        grep -iE 'error|fail' /var/log/hostd.log | tail -30
        ls -l /var/core/
      check: "uptime(마이크로초)이 짧으면 재부팅됨 → 원인(PSOD·전원)을 SEL·/var/core 덤프로 · vmk0 IP 가 바뀌었거나 없으면 관리망 설정 · fdm.log 의 격리(isolation)·마스터 선출 기록으로 HA 동작 이유 확인"
      note: "적용: ESXi 6.7~8.0 · 권한: ESXi root · 하드웨어 원인이면 COMMON-PROC-HARDWARE 절차로 SEL 확인 병행"
  - stage: 2
    steps:
    - do: 관리 에이전트(hostd·vpxa) 재시작 후 vCenter 재연결
      cmd: |
        # ESXi 셸
        /etc/init.d/hostd restart
        /etc/init.d/vpxa restart
        # vCenter › 호스트 › 연결(Connect)
      check: "성공: 호스트 Connected, VM 목록·상태 정상 표시 · 실패: 재시작 뒤에도 NotResponding 이면 관리망·방화벽(443·UDP 902)·인증서 문제 → VMware 지원"
      note: "사전조건: VM 은 계속 동작 중임을 콘솔로 확인, vSAN·NSX 구성이면 services.sh restart(전체 재시작)는 쓰지 않음 · 영향: 재시작 동안 해당 호스트 관리 불가(실행 중 VM 영향 없음), 재연결 중 HA 재구성 · 승인: 가상화 담당·변경 관리 · 백업/롤백: 설정 변경 없음 — 실패 시 원상태(연결 끊김) 유지 후 지원 의뢰 · 적용: ESXi 6.7~8.0"
    - do: 장애 호스트 유지보수 모드 전환과 HA 재구성
      cmd: |
        # PowerCLI
        Set-VMHost -VMHost <esxi> -State Maintenance -Evacuate
        # 복구 후: Set-VMHost -VMHost <esxi> -State Connected  · vCenter › 호스트 › vSphere HA 재구성(Reconfigure for vSphere HA)
      check: "성공: 남은 VM 이 다른 호스트로 이동하고 호스트 Maintenance, 복구 후 HA 상태 정상(Connected (Slave)/Primary) · 실패: VM 이동이 멈추면 DRS 규칙·자원 부족 → OSC-PROC-R6-VMW-VMOTION 절차로"
      note: "사전조건: 남은 호스트 자원이 VM 을 받을 여유(n+1) 확인, 1차 원인 자료 보존 · 영향: 이동 중 VM 성능 일시 저하, 유지보수 동안 클러스터 여유 감소 · 승인: 가상화 담당·업무 담당·변경 관리 · 백업/롤백: 이동 전 VM 위치 기록(Get-VM | Select Name,VMHost | Export-Csv) — 복구 후 기록대로 재배치 · 적용: vCenter 6.7~8.0, PowerCLI 12+"
  - stage: 3
    steps:
    - do: VMware·서버 제조사 의뢰 자료
      cmd: |
        # ESXi 셸
        vm-support
        # vCenter 지원 번들: vCenter › 로그 내보내기 · PSOD 화면은 관리 콘솔에서 캡처
      check: "vm-support·vCenter 번들·PSOD 캡처·HA 이벤트 목록·SEL·발생 시각"
      note: "민감정보 마스킹: 번들의 호스트명·IP·계정·VM 이름(업무명 노출 시)·인증서 정보를 가림 · 전달 승인: 보안 담당 승인 후 반출"

# ───────────────────────── VMware: vMotion 실패·DRS 불균형 ─────────────────────────
- id: OSC-PROC-R6-VMW-VMOTION
  scope: id
  products: [os-common-match]
  category: hardware
  match: [LEG-VMW-MIGRATION-FAIL, LEG-VMW-DRS-WARN]
  title: vMotion 실패·DRS 불균형 경고
  source: "VMware vSphere ESXi vmkping·esxcli network ip interface(list·tag get) / VMware PowerCLI Get-DrsRecommendation·Invoke-DrsRecommendation·Get-DrsRule·Move-VM·Get-Cluster(EVCMode)"
  stages:
  - stage: 1
    steps:
    - do: 실패 사유와 클러스터 설정 확인 (읽기 전용)
      cmd: |
        # PowerCLI (vCenter 연결 후)
        Get-VIEvent -Start (Get-Date).AddHours(-2) -MaxSamples 2000 | Where-Object { $_.FullFormattedMessage -match 'migrat|vMotion|DRS' } | Select-Object CreatedTime,FullFormattedMessage
        Get-Cluster <cluster> | Select-Object Name,DrsEnabled,DrsAutomationLevel,EVCMode
        Get-DrsRule -Cluster <cluster>
      check: "사유가 CPU 호환이면 EVC 미설정·서로 다른 CPU 세대 · 네트워크·시간 초과면 vMotion 망 · 'not enough resources' 면 대상 호스트 자원 · DRS 규칙(선호도·반선호도)이 이동을 막는지 확인"
      note: "적용: vCenter 6.7~8.0, PowerCLI 12+ · 권한: vCenter 읽기 전용 역할 이상"
    - do: vMotion 망 도달·MTU 확인
      cmd: |
        # ESXi 셸 (원본 호스트)
        esxcli network ip interface list
        esxcli network ip interface tag get -i <vmk>
        vmkping -I <vmk> <대상_vMotion_IP>
        vmkping -I <vmk> -d -s 8972 <대상_vMotion_IP>     # MTU 9000(점보) 구성일 때
        vmkping -I <vmk> -S vmotion <대상_vMotion_IP>      # vMotion 전용 TCP/IP 스택일 때
      check: "기본 vmkping 실패면 VLAN·라우팅·스위치 · 기본은 되고 -d -s 8972 만 실패면 경로 중 MTU 9000 미설정 · tag 에 VMotion 이 없으면 vMotion 용 vmk 지정 누락"
      note: "적용: ESXi 6.7~8.0 · 권한: ESXi root · vmkping 은 조회 성격(설정 변경 없음)"
    - do: 호스트별 자원 사용률과 DRS 권장 확인
      cmd: |
        # PowerCLI
        Get-VMHost -Location <cluster> | Select-Object Name,CpuUsageMhz,CpuTotalMhz,MemoryUsageGB,MemoryTotalGB
        Get-DrsRecommendation -Cluster <cluster>
      check: "특정 호스트만 CPU·메모리 80% 이상이고 권장이 쌓여 있으면 불균형 확정 · 자동화 수준이 Manual 이면 권장이 적용되지 않은 채 남음"
      note: "적용: vCenter 6.7~8.0, PowerCLI 12+ · 권한: vCenter 읽기 전용 역할 이상"
  - stage: 2
    steps:
    - do: DRS 권장 적용 또는 VM 수동 이동
      cmd: |
        # 이동 전 위치 기록
        Get-VM -Location <cluster> | Select-Object Name,VMHost | Export-Csv vm_location_<날짜>.csv
        Get-DrsRecommendation -Cluster <cluster> | Invoke-DrsRecommendation
        # 또는 개별 이동
        Move-VM -VM <vm> -Destination (Get-VMHost <대상_esxi>)
      check: "성공: 이동 완료·호스트 사용률 편차 감소·권장 목록 비워짐 · 실패: 같은 사유로 vMotion 실패면 1차 원인(망·EVC·자원) 해소가 먼저"
      note: "사전조건: 1차에서 실패 원인 해소, 대상 호스트 여유 확인, 업무 중요 VM 은 담당과 시간 합의 · 영향: 이동 중 VM 짧은 멈춤(stun)·vMotion 망 대역 사용 · 승인: 가상화 담당·업무 담당 · 백업/롤백: 이동 전 위치 CSV 기록 — 이상 시 Move-VM 으로 원래 호스트로 되돌림 · 적용: vCenter 6.7~8.0, PowerCLI 12+"
    - do: vMotion 망 MTU 정렬 (점보 프레임 구성 시)
      cmd: |
        # ESXi 셸 — 표준 스위치 예
        esxcli network vswitch standard set -v <vSwitch> -m 9000
        esxcli network ip interface set -i <vmk> -m 9000
        vmkping -I <vmk> -d -s 8972 <대상_vMotion_IP>
      check: "성공: -d -s 8972 vmkping 성공, vMotion 재시도 성공 · 실패: 물리 스위치 경로 MTU 가 9000 이 아니면 vmk·vSwitch 를 1500 으로 원복하고 네트워크 담당에 경로 MTU 요청"
      note: "사전조건: 물리 스위치 전 구간 MTU 9000 확인(네트워크 담당), 분산 스위치(vDS)면 vCenter 에서 설정 · 영향: MTU 변경 순간 해당 vmk 통신 순간 끊김 · 승인: 가상화 담당·네트워크 담당·변경 관리 · 백업/롤백: 변경 전 esxcli network ip interface list 출력 보관, 이상 시 -m 1500(이전 값)으로 원복 · 적용: ESXi 6.7~8.0 표준 스위치 · EVC 설정은 클러스터 › 구성 › VMware EVC(상위 기능을 쓰는 실행 중 VM 은 전원 재시작 후 적용)"
  - stage: 3
    steps:
    - do: VMware 지원 의뢰 자료
      cmd: |
        # ESXi 셸 (원본·대상 호스트 모두)
        vm-support
        # vCenter 작업 오류 전문·VM 의 vmware.log
      check: "양쪽 호스트 vm-support·vCenter 오류 전문·vmware.log·클러스터 EVC·DRS 설정"
      note: "민감정보 마스킹: 호스트명·IP·계정·VM 이름(업무명 노출 시)을 가림 · 전달 승인: 보안 담당 승인 후 반출"

# ───────────────────────── VMware: 가상 네트워크 ─────────────────────────
- id: OSC-PROC-R6-VMW-VNET
  scope: id
  products: [os-common-match]
  category: hardware
  match: [LEG-VMW-NW-ERROR]
  title: VMware 가상 네트워크 오류 (vmnic 다운·dvSwitch/포트 그룹 오류)
  source: "VMware vSphere ESXi esxcli network nic(list·get·stats get)·esxcli network vswitch(standard·dvs vmware)·vim-cmd hostsvc/net/query_networkhint / VMware PowerCLI Export-VDSwitch·Get-VDPortgroup·Set-VDVlanConfiguration / vCenter vDS Health Check"
  stages:
  - stage: 1
    steps:
    - do: 물리 NIC(업링크) 상태·오류 확인 (읽기 전용)
      cmd: |
        # ESXi 셸
        esxcli network nic list
        esxcli network nic stats get -n <vmnic>
        esxcli network nic get -n <vmnic>
      check: "Link Status Down 인 vmnic 이 있으면 케이블·스위치 포트 · 수신 오류(Receive errors·CRC)·드롭이 계속 늘면 물리 구간·드라이버 · 드라이버·펌웨어 판을 VMware 호환 목록과 대조"
      note: "적용: ESXi 6.7~8.0 · 권한: ESXi root"
    - do: 업링크가 어느 스위치·포트 그룹에 묶였는지와 상대 스위치 포트 확인
      cmd: |
        # ESXi 셸
        esxcli network vswitch dvs vmware list
        esxcli network vswitch standard list
        esxcli network vswitch standard portgroup list
        vim-cmd hostsvc/net/query_networkhint --pnic-name=<vmnic>
      check: "다운된 vmnic 이 팀의 유일한 활성 업링크면 그 포트 그룹 VM 통신 단절 · CDP/LLDP 정보로 상대 스위치·포트를 특정해 네트워크 담당에 전달 · 포트 그룹 VLAN ID 가 스위치 트렁크 허용 VLAN 에 없으면 설정 불일치"
      note: "적용: ESXi 6.7~8.0 (CDP/LLDP 정보는 스위치에서 송신할 때만) · 권한: ESXi root · vCenter › 네트워킹 › dvSwitch › 모니터 › 상태(Health Check)로 VLAN·MTU·팀 구성 불일치 확인"
  - stage: 2
    steps:
    - do: dvSwitch 설정 백업 후 포트 그룹 VLAN·팀 구성 수정
      cmd: |
        # PowerCLI — 변경 전 백업
        Export-VDSwitch -VDSwitch <dvs> -Destination <path>\dvs_<날짜>.zip
        # VLAN 수정 예
        Get-VDPortgroup -Name <portgroup> | Set-VDVlanConfiguration -VlanId <vlan>
      check: "성공: Health Check 의 VLAN·MTU·팀 구성 경고 소멸, VM 통신 복구 · 실패: VM 통신이 더 나빠지면 즉시 이전 설정으로 원복"
      note: "사전조건: 스위치 트렁크 허용 VLAN·업링크 구성을 네트워크 담당과 대조, 영향 VM 목록 확인 · 영향: 포트 그룹 변경 순간 해당 포트 그룹 VM 통신 끊김 가능 · 승인: 가상화 담당·네트워크 담당·변경 관리 · 백업/롤백: Export-VDSwitch 로 내보낸 zip 을 vCenter › dvSwitch › 설정 › 구성 복원(Restore Configuration)으로 되돌림 · 적용: vDS 6.x~8.x, PowerCLI 12+(VDS 모듈)"
    - do: 다운 업링크 물리 복구 (케이블·스위치 포트)
      cmd: |
        # 네트워크 담당이 스위치 포트·케이블·SFP 복구 (OSC-PROC-R6-NET-LINK 절차)
        esxcli network nic list      # 복구 확인
      check: "성공: vmnic Link Status Up, 팀에 다시 활성 업링크로 표시 · 실패: 계속 Down 이면 NIC 하드웨어·드라이버 → 서버 제조사"
      note: "사전조건: 다른 업링크가 통신을 받치고 있는지 확인 · 영향: 스위치 포트 작업 순간 링크 재협상 · 승인: 네트워크 담당·가상화 담당 · 백업/롤백: 스위치 측 변경 전 running-config 기록, 이상 시 원복 · 적용: ESXi 6.7~8.0"
  - stage: 3
    steps:
    - do: VMware·NIC 제조사 의뢰 자료
      cmd: |
        # ESXi 셸
        vm-support
        esxcli network nic get -n <vmnic> > nic_<vmnic>.txt
      check: "vm-support·NIC 드라이버/펌웨어 판·dvSwitch 내보내기·Health Check 결과·발생 시각"
      note: "민감정보 마스킹: 호스트명·IP·VLAN 번호·MAC 중 내부 구조가 드러나는 값·계정을 가림 · 전달 승인: 보안 담당 승인 후 반출"

# ───────────────────────── VMware: 라이선스 ─────────────────────────
- id: OSC-PROC-R6-VMW-LICENSE
  scope: id
  products: [os-common-match]
  category: hardware
  match: [LEG-VMW-LICENSE-WARN]
  title: VMware 라이선스 만료·용량 초과·평가판 호스트
  source: "VMware vCenter 라이선스 관리 화면(관리 › 라이선싱) / ESXi vim-cmd vimsvc/license --show / VMware PowerCLI Get-VMHost(LicenseKey)"
  stages:
  - stage: 1
    steps:
    - do: 만료일·사용량·평가판 호스트 확인 (읽기 전용)
      cmd: |
        # vCenter › 관리 › 라이선싱 › 라이선스·자산 화면에서 만료일·사용량(CPU·코어) 대 보유량 확인
        # PowerCLI
        Get-VMHost | Select-Object Name,LicenseKey
        # ESXi 셸
        vim-cmd vimsvc/license --show
      check: "만료 60일 이내면 갱신 착수 · 사용량이 보유량 초과면 초과 자산 확인 · 키가 00000-00000-00000-00000-00000 이면 평가판(평가 기간 끝나면 vCenter 연결·VM 전원 켜기 제한)"
      note: "적용: vCenter·ESXi 6.7~8.0, PowerCLI 12+ · 권한: vCenter 라이선스 읽기 권한·ESXi root · 라이선스 키 전체는 화면·보고서에 남기지 않고 끝 5자리만 기록"
  - stage: 2
    steps:
    - do: 라이선스 할당·갱신 적용 (vCenter 화면)
      cmd: |
        # vCenter › 관리 › 라이선싱 › 자산 › 대상 호스트·vCenter 선택 › 라이선스 할당
        # 적용 후 확인
        Get-VMHost | Select-Object Name,LicenseKey
      check: "성공: 대상 자산이 유효 라이선스로 표시, 경고 소멸 · 실패: 용량 부족 오류면 할당 가능한 키 부족 → 구매·계약 담당"
      note: "사전조건: 구매·갱신 완료된 키 확보(계약 담당), 할당 전 현재 자산별 키 끝 5자리 기록 · 영향: 다른 에디션 키를 할당하면 그 에디션에 없는 기능(DRS 등) 비활성 · 승인: 가상화 담당·구매/계약 담당 · 백업/롤백: 할당 전 자산-키 기록표 보관, 이상 시 이전 키로 재할당 · 적용: vCenter 6.7~8.0 (키는 명령행이 아닌 화면에서 입력)"
  - stage: 3
    steps:
    - do: 공급사·VMware 의뢰 자료
      cmd: |
        # vCenter › 관리 › 라이선싱 › 보고서 내보내기(사용량)
      check: "라이선스 사용량 보고서·계약 번호·만료 경고 화면"
      note: "민감정보 마스킹: 라이선스 키는 끝 5자리만 남기고 가림, 호스트명·IP 가림 · 전달 승인: 보안 담당·계약 담당 승인 후 반출"

# ───────────────────────── VMware: 패치(Update Manager·Lifecycle Manager) ─────────────────────────
- id: OSC-PROC-R6-VMW-PATCH
  scope: id
  products: [os-common-match]
  category: hardware
  match: [LEG-VMW-VUM-WARN]
  title: VMware Update Manager·Lifecycle Manager 패치 적용 실패·준수 미달
  source: "VMware vSphere ESXi esxcli system version get·esxcli software profile get·esxcli software vib list·esxcli system maintenanceMode get·/var/log/esxupdate.log·vim-cmd hostsvc/firmware / VMware PowerCLI Get-VMHostFirmware·Set-VMHost"
  stages:
  - stage: 1
    steps:
    - do: 실패 호스트·오류 문구·현재 판 확인 (읽기 전용)
      cmd: |
        # vCenter › 호스트 › 업데이트(Lifecycle Manager/Update Manager) 화면에서 실패 작업·오류 문구 확인
        # ESXi 셸
        esxcli system version get
        esxcli software profile get
        esxcli software vib list | head -30
        tail -100 /var/log/esxupdate.log
      check: "오류가 'VIB 의존성·충돌'이면 타사 드라이버 VIB 문제 · '유지보수 모드 진입 실패'면 VM 이동 실패(DRS·자원) · 'HCL/호환성'이면 하드웨어·펌웨어 미지원 · 준수 미달만이면 아직 적용 안 된 패치 목록 확인"
      note: "적용: ESXi 6.7~8.0 · 권한: vCenter 읽기 역할·ESXi root"
    - do: 유지보수 모드 상태와 VM 배치 확인
      cmd: |
        # ESXi 셸
        esxcli system maintenanceMode get
        # PowerCLI
        Get-VM -Location (Get-VMHost <esxi>) | Select-Object Name,PowerState
      check: "Enabled 인데 작업 실패면 호스트가 유지보수 모드에 남은 상태(클러스터 여유 감소) · 남은 VM 이 있으면 이동 실패 원인 확인"
      note: "적용: ESXi 6.7~8.0, PowerCLI 12+ · 권한: ESXi root·vCenter 읽기 역할"
  - stage: 2
    steps:
    - do: 호스트 구성 백업 후 유지보수 모드에서 패치 재적용
      cmd: |
        # PowerCLI — 구성 백업
        Get-VMHostFirmware -VMHost <esxi> -BackupConfiguration -DestinationPath <path>
        # 유지보수 모드 진입(VM 이동)
        Set-VMHost -VMHost <esxi> -State Maintenance -Evacuate
        # vCenter › 업데이트 › 수정(Remediate) — 실패 원인(VIB 충돌·호환성) 해소 후
      check: "성공: 재부팅 후 esxcli system version get 의 빌드가 목표 판, 준수(Compliant) 표시, 유지보수 모드 해제 후 HA 정상 · 실패: 부팅 실패·드라이버 미인식이면 이전 이미지로 원복"
      note: "사전조건: 대상 판의 하드웨어 호환(HCL)·타사 VIB 호환 확인, 남은 호스트 자원 여유(n+1), 구성 백업 완료 · 영향: 패치 중 호스트 재부팅(해당 호스트 VM 은 사전 이동), 클러스터 여유 감소 · 승인: 가상화 담당·변경 관리 · 백업/롤백: Get-VMHostFirmware 구성 백업 보관, 부팅 실패 시 부팅 화면에서 Shift+R 로 이전 이미지(altbootbank) 복구 · 적용: ESXi 6.7~8.0, PowerCLI 12+"
  - stage: 3
    steps:
    - do: VMware 지원 의뢰 자료
      cmd: |
        # ESXi 셸
        vm-support
        # vCenter 지원 번들(Update Manager/Lifecycle Manager 로그 포함): vCenter › 로그 내보내기
      check: "vm-support·vCenter 번들·실패 작업 오류 전문·대상 기준선/이미지 이름·하드웨어 모델·펌웨어 판"
      note: "민감정보 마스킹: 호스트명·IP·계정·인증서 정보를 가림 · 전달 승인: 보안 담당 승인 후 반출"

# ───────────────────────── KVM: VM 비정상 종료 ─────────────────────────
- id: OSC-PROC-R6-KVM-CRASH
  scope: id
  products: [os-common-match]
  category: hardware
  match: [LEG-KVM-VM-CRASH]
  title: KVM 가상머신 비정상 종료 (QEMU 오류·게스트 패닉·호스트 OOM)
  source: "RHEL 9 'Configuring and managing virtualization'(virsh domstate·dominfo·dumpxml·start·setmem, /var/log/libvirt/qemu) / man7.org virsh(1)·qemu-img(1)·journalctl(1)·coredumpctl(1) / sos report"
  stages:
  - stage: 1
    steps:
    - do: VM 상태·종료 사유 확인 (읽기 전용)
      cmd: |
        virsh list --all
        virsh domstate <vm> --reason
        virsh dominfo <vm>
      check: "'shut off (crashed)'·'crashed (panicked)' 면 비정상 종료 — panicked 는 게스트 OS 커널 패닉(pvpanic 장치가 있을 때) · 'shut off (destroyed)' 면 누군가 강제 종료 · running 이면 이미 재기동됨(시각 확인)"
      note: "적용: libvirt(RHEL 7~9) · 권한: root 또는 libvirt 그룹"
    - do: QEMU·libvirt 로그와 호스트 메모리 고갈 확인
      cmd: |
        tail -50 /var/log/libvirt/qemu/<vm>.log
        journalctl -u libvirtd --since '-1 hour' | tail -50        # RHEL 7·8
        journalctl -u virtqemud --since '-1 hour' | tail -50       # RHEL 9 (모듈형 데몬)
        journalctl -k --since '-1 hour' | grep -iE 'out of memory|oom-kill|qemu' | tail -20
        free -m ; virsh nodememstats
      check: "커널 로그에 qemu 프로세스 oom-kill 이 있으면 호스트 메모리 고갈(과할당) · QEMU 로그에 'terminating on signal' 이면 외부에서 종료 · 'Assertion'·'core dumped' 면 QEMU 자체 결함(3차)"
      note: "적용: RHEL 7~9 (RHEL 9 기본은 virtqemud, 이전 판은 libvirtd) · 권한: root"
    - do: QEMU 코어 덤프 존재 확인
      cmd: |
        coredumpctl list qemu-kvm 2>/dev/null | tail -5
      check: "해당 시각 qemu-kvm 코어가 있으면 QEMU 충돌 확정 — 3차 자료로 보존(삭제 금지)"
      note: "적용: systemd-coredump 사용 RHEL 8·9 · 권한: root"
  - stage: 2
    steps:
    - do: 디스크 이미지 확인 후 VM 기동
      cmd: |
        virsh dumpxml <vm> > /var/tmp/<vm>_$(date +%Y%m%d%H%M).xml
        qemu-img check <image_path>          # VM 이 꺼진 상태에서만, -r 없이(읽기 검사)
        virsh start <vm>
        virsh domstate <vm> --reason
      check: "성공: running (booted), 게스트 업무 헬스체크 정상 · 실패: qemu-img check 가 손상(corruptions)을 보고하면 기동하지 말고 백업 복구 검토, 기동 직후 다시 crashed 면 원인(메모리·QEMU) 해소 전 중단"
      note: "사전조건: 1차 로그·코어 보존, 호스트 메모리 여유가 VM 할당량 이상, 이미지 백업 존재 확인 · 영향: 기동 중 해당 VM 업무 미복구, 원인 미해소 시 재충돌 · 승인: 가상화 담당·업무 담당 · 백업/롤백: 기동 전 dumpxml 보관, 이미지 손상 시 백업본으로 복구(qemu-img check -r 수리는 사본에서만) · 적용: libvirt·QEMU(RHEL 7~9)"
    - do: 호스트 메모리 과할당 해소 (OOM 원인일 때)
      cmd: |
        virsh dommemstat <다른_vm>                        # 실제 사용량 확인
        virsh setmem <다른_vm> <크기>KiB --live           # balloon 지원 VM 만
      check: "성공: 호스트 free·available 여유 확보, 이후 oom-kill 재발 없음 · 실패: 축소 VM 내부 메모리 부족(스왑·OOM)이 생기면 이전 값으로 원복"
      note: "사전조건: 축소 대상 VM 의 실제 사용량·업무 담당 확인, balloon 드라이버 동작 확인 · 영향: 축소 VM 의 메모리 압박·성능 저하 가능 · 승인: 가상화 담당·업무 담당 · 백업/롤백: 변경 전 virsh dumpxml 의 currentMemory 값 기록 — virsh setmem 으로 원래 값 복원 · 적용: virtio-balloon 장치가 있는 VM"
  - stage: 3
    steps:
    - do: Red Hat·가상화 지원 의뢰 자료
      cmd: |
        sos report --batch
        cp -p /var/log/libvirt/qemu/<vm>.log /var/tmp/
        virsh dumpxml <vm> > /var/tmp/<vm>_dump.xml
      check: "sos report·QEMU 로그·도메인 XML·qemu-kvm 코어(있을 때)·libvirt/QEMU 판·발생 시각"
      note: "sos report 는 수 분간 CPU·디스크 사용(RHEL 7 은 sosreport) · 민감정보 마스킹: 호스트명·IP·계정·도메인 XML 의 VNC/SPICE 비밀번호·디스크 경로의 업무명을 가림(sos 4.x 는 --clean), 코어 파일은 게스트 메모리 내용 포함 — 원본 반출은 보안 담당 별도 협의 · 전달 승인: 보안 담당 승인 후 반출"

# ───────────────────────── WAS 공통: OS 네이티브 메모리 부족으로 JVM 종료 ─────────────────────────
- id: WASC-PROC-R6-NATIVE-MEM
  scope: id
  products: [was-common-match]
  category: memory
  match: [WAS-JVM-012]
  title: OS 메모리 부족으로 JVM 종료 (Native memory allocation failed — 힙 OOM 아님)
  source: "Oracle Java SE Troubleshooting Guide 'Fatal Error Log'(hs_err_pid — Native memory allocation (malloc/mmap) failed, Possible solutions)·'Native Memory Tracking'(jcmd VM.native_memory) / man7.org proc(5)(/proc/meminfo CommitLimit·Committed_AS) / IBM AIX 7.2 svmon·lsps·chps / Microsoft Learn Get-Counter·Win32_PageFileUsage"
  stages:
  - stage: 1
    steps:
    - do: hs_err 의 할당 실패 문구·메모리 요약 확인 (읽기 전용)
      cmd: |
        ls -lt <path>/hs_err_pid*.log | head -3
        grep -nE 'Native memory allocation|Out of Memory Error|Possible reasons|CompressedOops|^Memory:|JRE version' <path>/hs_err_pid<PID>.log | head -20
      check: "'Native memory allocation (malloc) failed'·'(mmap) failed to map' 면 OS 가 메모리를 못 준 것 — 힙 증설로는 해결되지 않음(오히려 악화) · 'Memory:' 줄의 physical free·swap free 가 바닥이면 OS 메모리·스왑 부족 · 'Zero based Compressed Oops' 언급이면 힙 배치가 네이티브 영역 성장을 막는 경우"
      note: "적용: HotSpot JDK 6~21 · 권한: JVM 실행 계정 · hs_err 의 Command Line·Environment 절에는 비밀번호(-D...password)가 있을 수 있어 전체를 화면 공유·복사하지 않음"
    - do: 같은 시각 OS 메모리·스왑·커밋 한도 확인
      cmd: |
        # Linux
        free -m
        grep -E 'MemAvailable|SwapFree|CommitLimit|Committed_AS' /proc/meminfo
        cat /proc/sys/vm/overcommit_memory
        dmesg -T | grep -iE 'out of memory|oom-killer' | tail -20
        # AIX
        svmon -G ; lsps -a
        # Windows (PowerShell)
        Get-Counter '\Memory\Available MBytes','\Memory\% Committed Bytes In Use'
        Get-CimInstance Win32_PageFileUsage | Select-Object Name,AllocatedBaseSize,CurrentUsage
      check: "MemAvailable·SwapFree 가 거의 0 이면 물리 메모리·스왑 부족 · overcommit_memory=2 이고 Committed_AS 가 CommitLimit 에 닿으면 커밋 한도 초과(여유 메모리가 있어도 실패) · AIX lsps %Used 높음·Windows 커밋 90% 이상이면 페이징 공간 부족"
      note: "적용: RHEL 7~9 / AIX 7.1~7.3 / Windows Server 2012+ · 권한: 일반 사용자(dmesg 는 RHEL 8+ 에서 root 필요할 수 있음)"
    - do: 메모리 많이 쓰는 프로세스와 같은 서버 JVM 들의 최대 힙 합계 확인
      cmd: |
        # Linux
        ps -eo pid,user,rss,comm --sort=-rss | head -10
        jcmd <살아있는_PID> VM.flags | tr ' ' '\n' | grep -E 'MaxHeapSize|MaxMetaspaceSize|ThreadStackSize|ReservedCodeCacheSize'
        ulimit -v ; grep -E 'Max address space' /proc/<살아있는_PID>/limits
        # AIX
        svmon -Pt 10
        # Windows (PowerShell)
        Get-Process | Sort-Object WorkingSet64 -Descending | Select-Object -First 10 Name,Id,WorkingSet64
      check: "같은 서버 JVM 들의 MaxHeapSize 합 + 스레드 스택·Metaspace·코드 캐시가 물리 메모리를 넘으면 배치 과다(구조적 원인) · 다른 프로세스가 급증했으면 그 프로세스가 원인 · Max address space 가 unlimited 가 아니면 주소 공간 한도"
      note: "적용: JDK 8/11/17/21(jcmd), RHEL 7~9 / AIX 7.x / Windows Server 2012+ · 권한: JVM 실행 계정 · ps 는 args 대신 comm 만 출력(명령행 비밀번호 노출 방지)"
  - stage: 2
    steps:
    - do: JVM 메모리 요구 줄이기 (힙·스레드 스택·코드 캐시 조정, 원인 추적용 NMT)
      config:
        file: WAS 기동 스크립트 / JVM 옵션(제품별 — JEUS domain.xml·WebLogic setDomainEnv·Tomcat setenv.sh·JBoss standalone.conf)
        snippet: |
          # hs_err 'Possible solutions' 기준: 힙을 실제 필요량으로 줄이고(-Xmx), 스레드 수·-Xss 를 줄여 네이티브 여유 확보
          -Xmx<줄인 값> -Xss512k -XX:MaxMetaspaceSize=<값> -XX:MaxDirectMemorySize=<값> -XX:ReservedCodeCacheSize=<값>
          # 원인 추적(성능 5~10% 저하 — 조사 기간만): -XX:NativeMemoryTracking=summary  → jcmd <PID> VM.native_memory summary
        note: "사전조건: 1차에서 OS 메모리·같은 서버 JVM 힙 합계 확인, GC 로그로 힙 실제 사용량 확인(줄여도 힙 OOM 이 나지 않는 값) · 영향: 적용에 JVM 재기동 필요, 힙을 너무 줄이면 GC 증가·힙 OOM · 승인: WAS 담당·애플리케이션 담당·변경 관리 · 백업/롤백: 기동 스크립트·설정 파일을 날짜 붙여 복사, 이상 시 복원 후 재기동"
      cmd: |
        # 설정 반영 후 재기동 (제품 절차) — 예: systemctl restart <service>
        jcmd <PID> VM.flags | tr ' ' '\n' | grep -E 'MaxHeapSize|ThreadStackSize'
      check: "성공: 새 옵션이 VM.flags 에 반영, 같은 부하에서 MemAvailable 여유 유지, hs_err 재발 없음 · 실패: 힙 OOM(Java heap space)·GC 과다면 -Xmx 를 이전 값 쪽으로 되돌리고 서버 메모리 증설·JVM 배치 분산으로"
      note: "사전조건: 위 config 사전조건과 같음, 다른 인스턴스로 업무 우회 가능 시간 · 영향: 재기동 동안 해당 인스턴스 서비스 중단 · 승인: WAS 담당·변경 관리 · 백업/롤백: 설정 사본으로 복원 후 재기동 · 적용: -Xss·ReservedCodeCacheSize·MaxDirectMemorySize·NMT 는 JDK 8+(HotSpot)"
    - do: OS 스왑·페이징 공간 증설 또는 커밋 한도 조정
      cmd: |
        # Linux — 스왑 파일 추가 예
        dd if=/dev/zero of=/<swap_path>/swapfile2 bs=1M count=<MB> ; chmod 600 /<swap_path>/swapfile2
        mkswap /<swap_path>/swapfile2 ; swapon /<swap_path>/swapfile2 ; swapon --show
        # Linux — overcommit_memory=2 환경에서 커밋 한도가 원인일 때
        sysctl -w vm.overcommit_ratio=<값>
        # AIX — 페이징 공간 확장 (LP 수 단위)
        chps -s <LP수> hd6 ; lsps -a
        # Windows — 시스템 속성 › 고급 › 성능 › 가상 메모리에서 페이지 파일 크기 조정
      check: "성공: swapon --show·lsps -a 에 늘어난 공간, CommitLimit 증가, 같은 부하에서 할당 실패 재발 없음 · 실패: dd·mkswap 중 공간 부족 오류면 다른 파일시스템 사용, 스왑 사용이 계속 늘어 성능이 떨어지면 근본 대책은 메모리 증설·JVM 배치 분산"
      note: "사전조건: 대상 파일시스템 여유 확인(스왑 크기 이상), 스왑 증설은 응급 대책임을 업무 담당과 합의 · 영향: dd 작성 중 디스크 I/O 증가, 스왑 사용 시 성능 저하, overcommit_ratio 상향은 OOM-killer 위험 증가 · 승인: 시스템 담당·변경 관리 · 백업/롤백: 추가 스왑은 swapoff 후 파일 제거로 되돌림(/etc/fstab 등록 전 검증), sysctl 은 변경 전 sysctl vm.overcommit_ratio 값 기록 후 원복, AIX 확장은 축소(chps -d)가 가능하나 사용 중이면 실패하므로 계획 반영 · 적용: RHEL 7~9(XFS 는 fallocate 대신 dd 권장) / AIX 7.x / Windows Server 2012+"
  - stage: 3
    steps:
    - do: JDK·WAS 제조사 의뢰 자료
      cmd: |
        mkdir -p /var/tmp/nativeoom_$(date +%Y%m%d)
        cp -p <path>/hs_err_pid<PID>.log /var/tmp/nativeoom_$(date +%Y%m%d)/
        cat /proc/meminfo > /var/tmp/nativeoom_$(date +%Y%m%d)/meminfo.txt
        sar -r -f /var/log/sa/sa$(date +%d) > /var/tmp/nativeoom_$(date +%Y%m%d)/sar_r.txt 2>/dev/null
      check: "hs_err 전체·발생 시각 메모리 추이(sar -r)·/proc/meminfo·JVM 옵션·JDK 판·같은 서버 프로세스 목록"
      note: "민감정보 마스킹: hs_err 의 Command Line·Environment 절(비밀번호·토큰·DB 접속 문자열)·호스트명·IP·사용자명을 가림 · 전달 승인: 보안 담당 승인 후 반출"
