# ── (b) 더 맞는 기존 절차 ──
- procedure: MS-PROC-R6-RECOVERY
  match: [MSSQL-9001]
  primary: true
  fit_reviewed: true
  reviewed: "2026-10-16 r7 — 9001(DB 로그 사용 불가)은 다른 문제(I/O·경로 단절·파일 없음)가 로그 파일을 못 쓰게 만든 결과라, 붙어 있던 MS-PROC-STORAGE(로그 가득참·log_reuse_wait) 1차로는 원인을 못 찾음. R6-RECOVERY 1차의 ONLINE 아닌 DB 확인·'첫 원인 오류'(9001 앞의 823/824·OS error 2/3/5)·파일 존재·볼륨 확인이 그대로 맞음"
- procedure: PG-PROC-R6-CONNREJECT
  match: ["08001"]
  primary: true
  fit_reviewed: true
  reviewed: "2026-10-16 r7 — 08001(클라이언트가 연결을 수립하지 못함)은 미기동·listen_addresses·pg_hba 거부가 주 원인인데 붙어 있던 PG-PROC-CONNECTION 은 슬롯 고갈(53300)만 봄. CONNREJECT 1차의 FATAL(no pg_hba.conf entry·SSL) 로그 확인, pg_hba_file_rules, pg_isready, nc -zvw3 가 08001 진단과 맞음"
- procedure: PG-PROC-R6-DISCONNECT
  match: ["08006"]
  primary: true
  fit_reviewed: true
  reviewed: "2026-10-16 r7 — 08006(기존 연결 실패)은 서버 종료·네트워크 reset·keepalive 문제인데 PG-PROC-CONNECTION(슬롯 고갈)과 맞지 않음. DISCONNECT 1차의 'terminating connection·could not receive data from client' 로그, pg_postmaster_start_time, tcp_keepalives_* 확인이 코드 즉시 조치와 같은 진단"

