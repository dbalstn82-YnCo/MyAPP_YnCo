# WebSphere traditional 조치 절차 카탈로그 — IBM WAS 8.5.5/9.0 Knowledge Center (wsadmin, Administrative console, Troubleshooting) 기준 (2026-09-11)
# 강화(2026-10-16, GPT 45차 관문): 1차 = 읽기 전용(stopServer/startServer·purge·설정 변경·명령줄 비밀번호 없음), 2차 = 사전조건·영향·승인·백업/롤백 + 성공/실패 기준, 3차 = 민감정보 마스킹·전달 승인
# 적용 범위 표기: WAS traditional 8.5.5 / 9.0 (Liberty 아님). 관리 보안이 켜져 있으면 wsadmin 은 사용자·비밀번호를 묻거나 properties/soap.client.props 를 쓴다 — 1차에서 -password 를 명령줄에 쓰지 않는다.
# ND(셀) 구성은 설정 변경 후 노드 동기화(syncNode 또는 콘솔 Synchronize)가 필요하다.
products: [websphere]
procedures:
- id: WAS-PROC-THREAD
  category: thread
  match: [WSVR0605W, WSVR0606W]
  title: Hung thread (WSVR0605W) · 웹 컨테이너 스레드 풀 고갈
  source: "IBM WAS 9.0 'Troubleshooting › Hung threads (com.ibm.websphere.threadmonitor.*)'·'Tuning thread pools (WebContainer pool)' — ibm.com/docs/en/was/9.0.5?topic=performance-tuning-thread-pools"
  stages:
  - stage: 1
    steps:
    - do: 행 스레드·풀 사용률 확인 (읽기 전용)
      cmd: |
        grep -n "WSVR0605W\|WSVR0606W" <PROFILE_ROOT>/logs/<server>/SystemOut.log | tail -20
        <PROFILE_ROOT>/bin/wsadmin.sh -lang jython -c "print AdminControl.getAttribute(AdminControl.queryNames('type=ThreadPool,name=WebContainer,process=<server>,*'), 'activeCount')"
      check: "이상: activeCount 가 maximumSize 에 근접·WSVR0605W 가 반복(WSVR0606W 해소 없이 누적)이면 행 스레드 누적. 정상: WSVR0605W 뒤 같은 스레드의 WSVR0606W(해소) 기록·activeCount 여유"
      note: "적용: WAS 8.5.5/9.0 traditional · 권한: 관리 보안 사용 시 monitor 역할 이상 계정(wsadmin 이 묻거나 soap.client.props), SystemOut.log 읽기 · activeCount 속성을 읽지 못하면 AdminControl.getAttributes(<위 queryNames 결과>) 로 제공 속성을 확인하거나 다음 단계 javacore 의 WebContainer 스레드 수로 판단"
      verify_note: "미검증 — 전통형 WAS ThreadPool MBean 의 activeCount 속성 존재를 IBM 공식 문서에서 확인하지 못함(PMI ActiveCount 는 존재)"
    - do: javacore(스레드 덤프) 3회 채취
      cmd: |
        <PROFILE_ROOT>/bin/wsadmin.sh -lang jython -c "AdminControl.invoke(AdminControl.completeObjectName('type=JVM,process=<server>,*'), 'dumpThreads')"
        # 또는 kill -3 <PID> (스레드 덤프, 프로세스는 유지 — IBM JDK: <PROFILE_ROOT>/javacore.*.txt 생성)  — 10초 간격 3회
        ls -lt <PROFILE_ROOT>/javacore.*.txt | head -3 ; grep -c '"WebContainer : ' $(ls -t <PROFILE_ROOT>/javacore.*.txt | head -1)
      check: "javacore 파일 생성·WebContainer 스레드 수 기록. IBM Thread and Monitor Dump Analyzer(TMDA)로 대기 지점 확인 — 3회 모두 같은 스택이면 행 지점. 파일이 안 생기면 javacore 경로(-Xdump 설정)·디스크 여유 확인"
      note: "적용: WAS 8.5.5/9.0 (IBM J9 JDK 의 javacore — 힙 덤프 아님, 프로세스 유지) · 권한: operator 역할 이상(dumpThreads) 또는 WAS 실행 OS 계정(kill -3) · 파일당 수 MB, 디스크 여유 확인"
  - stage: 2
    steps:
    - do: 스레드 풀·행 스레드 감지 설정 조정
      config:
        file: 관리 콘솔 › Servers › Application servers › <server> › Thread pools › WebContainer / Custom properties(com.ibm.websphere.threadmonitor.threshold)
        snippet: |
          WebContainer: Minimum size 50, Maximum size 200, Thread inactivity timeout 60000 ms, Allow thread allocation beyond maximum thread size = false
          Custom properties (server › Administration › Custom properties):
            com.ibm.websphere.threadmonitor.interval=180   com.ibm.websphere.threadmonitor.threshold=600   com.ibm.websphere.threadmonitor.dump.java=true
        note: "dump.java=true 로 행 스레드 감지 시 javacore 자동 생성. 변경 후 서버 재기동"
      cmd: |
        <PROFILE_ROOT>/bin/backupConfig.sh /tmp/wasconfig_$(date +%Y%m%d%H%M).zip -nostop
        <PROFILE_ROOT>/bin/wsadmin.sh -lang jython <<'EOF'
        tp=AdminConfig.list('ThreadPool', AdminConfig.getid('/Server:<server>/')).splitlines()
        for t in tp:
            if AdminConfig.showAttribute(t,'name')=='WebContainer': AdminConfig.modify(t,[['maximumSize','200'],['minimumSize','50']])
        AdminConfig.save()
        EOF
        <PROFILE_ROOT>/bin/stopServer.sh <server> ; <PROFILE_ROOT>/bin/startServer.sh <server>
      check: "성공: startServer 후 SystemOut.log 에 WSVR0001I 'open for e-business', 콘솔 WebContainer 최대값 200 반영, WSVR0605W 미발생·activeCount 안정. 실패: 기동 실패·메모리 부족(스레드 증가) 또는 행 지속 → 백업 zip 으로 restoreConfig 후 재기동, 병목(DB·외부 호출) 해소로 전환"
      note: "사전조건: 1차 javacore 3회 확보, 힙·CPU 여유와 DB 풀 Maximum connections 확인(스레드만 늘리면 DB 풀 고갈로 옮겨감) · 영향: stopServer~startServer 동안 서비스 중단·세션 소실, ND 면 syncNode 필요 · 승인: 서비스 담당·WAS 운영 담당 · 백업/롤백: backupConfig.sh -nostop 으로 구성 zip 보관(cmd 1번째 줄), 롤백은 같은 wsadmin 으로 원래 값 modify+save 또는 restoreConfig.sh <zip> 후 재기동 · 주의: 보안 사용 시 stopServer.sh 는 -username 을 주면 비밀번호를 묻게 하거나 soap.client.props 사용 · 적용: WAS 8.5.5/9.0"
  - stage: 3
    steps:
    - do: IBM Support 케이스 자료 (collector 또는 수동)
      cmd: |
        <PROFILE_ROOT>/bin/collector.sh   # 또는 수동:
        tar czf was_$(hostname)_$(date +%Y%m%d).tgz <PROFILE_ROOT>/logs/<server>/ <PROFILE_ROOT>/javacore.*.txt <PROFILE_ROOT>/config/cells/<cell>/nodes/<node>/servers/<server>/server.xml
        <WAS_HOME>/bin/versionInfo.sh | head -20
      check: SystemOut/SystemErr/ffdc·javacore 3회·server.xml·versionInfo (IBM MustGather 'Hang or performance degradation' 기준)
      note: "민감정보 마스킹: 묶음 이름의 hostname, 로그의 호스트명·IP·사용자 ID·세션 ID·JDBC URL, javacore 의 명령줄 인자(-D 비밀번호) 가림. collector.sh 결과에는 config 전체(security.xml 의 {xor} 비밀번호 — 쉽게 복호됨)가 들어가므로 전달 전 확인, collector 는 WAS 설치 경로 밖 빈 작업 폴더에서 실행 · 전달 승인: 보안 담당 승인 후 IBM 케이스(ECuRep)에만"

- id: WAS-PROC-CONNECTION
  category: connection
  match: [J2CA0045E, J2CA0056I, J2CA0206W, J2CA0075W, DSRA0010E, DSRA0080E, DSRA8040I, WAS-POOL-002]
  title: J2C/JDBC 커넥션 풀 고갈·연결 오류 (J2CA0045E)
  source: "IBM WAS 9.0 'Connection pool settings (Maximum connections, Connection timeout, Unused timeout, Purge policy)'·'Tuning connection pools' — ibm.com/docs/en/was/9.0.5?topic=connections-connection-pool-settings"
  stages:
  - stage: 1
    steps:
    - do: 풀 상태·DB 접속 확인 (읽기 전용)
      cmd: |
        grep -n "J2CA0045E\|J2CA0056I\|DSRA0010E\|DSRA8040I" <PROFILE_ROOT>/logs/<server>/SystemOut.log | tail -20
        <PROFILE_ROOT>/bin/wsadmin.sh -lang jython -c "print AdminControl.invoke(AdminControl.queryNames('type=J2CConnectionPool,process=<server>,*').splitlines()[0], 'showPoolContents')"
        nc -zvw3 <DB_HOST> <DB_PORT>
      check: "이상: showPoolContents 의 free 0·waiting>0 이면 풀 고갈, DB 포트 실패면 DB/네트워크. 정상: free>0·waiting 0"
      note: "적용: WAS 8.5.5/9.0 · 권한: monitor 역할 이상(wsadmin), SystemOut.log 읽기 · 풀이 여러 개면 [0] 이 원하는 데이터소스가 아닐 수 있음 — 먼저 queryNames 결과 목록에서 <DS> 이름이 든 항목을 골라 실행 · nc 는 TCP 연결만 열고 닫는다(DB 로그인 없음)"
  - stage: 2
    steps:
    - do: 풀 크기·타임아웃·purge 정책 조정
      config:
        file: 관리 콘솔 › Resources › JDBC › Data sources › <DS> › Connection pool properties
        snippet: |
          Maximum connections 60 / Minimum connections 10 / Connection timeout 10 s / Unused timeout 600 s / Aged timeout 0 / Reap time 60 s / Purge policy EntirePool
          Data source › WebSphere Application Server data source properties: Statement cache size 50, Pretest connections = true (Pretest interval 30)
        note: "Maximum 합계 ≤ DB processes. 변경 후 서버 재기동 또는 데이터소스 테스트(Test connection)"
      cmd: |
        <PROFILE_ROOT>/bin/backupConfig.sh /tmp/wasconfig_$(date +%Y%m%d%H%M).zip -nostop
        <PROFILE_ROOT>/bin/wsadmin.sh -lang jython <<'EOF'
        ds=AdminConfig.getid('/DataSource:<DS>/'); pool=AdminConfig.showAttribute(ds,'connectionPool')
        AdminConfig.modify(pool,[['maxConnections','60'],['minConnections','10'],['connectionTimeout','10'],['purgePolicy','EntirePool']]); AdminConfig.save()
        EOF
      check: "성공: 재기동(또는 노드 동기화) 후 J2CA0045E 미발생, showPoolContents free>0. 실패: AdminConfig.getid 가 여러 개/빈 값(같은 이름이 여러 범위)이라 modify 오류, 또는 DB 세션 한도 초과 → 원래 값으로 modify+save 또는 restoreConfig"
      note: "사전조건: DBA 와 DB processes/sessions 한도 확인(모든 서버 Maximum 합계), 1차 showPoolContents 기록 · 영향: 설정은 서버 재기동 후 반영(서비스 중단), purgePolicy EntirePool 은 오류 1건에 풀 전체를 비움 · 승인: WAS 운영 담당·DBA·서비스 담당 · 백업/롤백: backupConfig.sh -nostop 으로 구성 zip(cmd 1번째 줄), 롤백은 원래 값 modify+save 또는 restoreConfig.sh <zip> · 적용: WAS 8.5.5/9.0 (ND 는 저장 후 노드 동기화)"
    - do: 풀 정리(DB 장애 복구 후 불량 커넥션 제거)
      cmd: |
        <PROFILE_ROOT>/bin/wsadmin.sh -lang jython -c "AdminControl.invoke(AdminControl.queryNames('type=J2CConnectionPool,process=<server>,*').splitlines()[0], 'purgePoolContents', 'normal')"
        # immediate 는 사용 중 핸들에 StaleConnectionException 유발 — normal 을 우선(GPT 교차 B)
      check: "성공: 정리 후 새 연결 정상(showPoolContents 에 새 연결·DSRA/J2CA 오류 없음). 실패: 정리 직후에도 DSRA0010E/StaleConnection 반복 → DB 상태 재확인, DB 정상인데 반복이면 3차"
      note: "사전조건: DBA 가 DB 복구 완료 확인, 대상 풀이 [0] 이 맞는지 1차 목록으로 확인 · 영향: 유휴 연결을 닫고 다시 만들어 순간 DB 로그인 증가, 사용 중 연결은 반환 시 폐기 · 승인: WAS 운영 담당·DBA · 백업/롤백: 설정 변경 없음 — 되돌릴 것 없음(풀은 필요 시 자동 재생성) · 적용: WAS 8.5.5/9.0"
  - stage: 3
    steps:
    - do: IBM Support 자료
      cmd: |
        tar czf was_ds_$(date +%Y%m%d).tgz <PROFILE_ROOT>/logs/<server>/ <PROFILE_ROOT>/config/cells/<cell>/resources.xml <PROFILE_ROOT>/logs/ffdc/
      check: 로그·ffdc·resources.xml(데이터소스 설정)·JDBC 드라이버 버전 (MustGather 'Connection pooling problems')
      note: "민감정보 마스킹: resources.xml 의 URL·serverName·portNumber·databaseName·user 속성, 로그·ffdc 의 호스트명·IP·DB 계정·SQL 바인드 값 가림(인증 별칭 비밀번호는 security.xml — 묶지 않음) · 전달 승인: 보안 담당·DBA 승인 후 IBM 케이스(ECuRep)에만"

- id: WAS-PROC-INTERNAL
  category: internal
  match: [WSVR0009E, WSVR0194E, WSVR0208E, WSVR0100W, ADMU3011E, SRVE0068E, SRVE0100E, SRVE0232E, SRVE0777E, CNTR0019E]
  title: 서버 기동 실패·애플리케이션 기동 실패·서블릿/EJB 예외
  source: "IBM WAS 9.0 'startServer/stopServer commands'·'Troubleshooting application startup problems'·'Deploying applications (wsadmin AdminApp)' — ibm.com/docs/en/was/9.0.5?topic=deployment-application-startup-problems"
  stages:
  - stage: 1
    steps:
    - do: 실패 원인 줄·ffdc 확인
      cmd: |
        grep -n "WSVR0009E\|WSVR0194E\|WSVR0208E\|ADMU3011E\|SRVE0068E" <PROFILE_ROOT>/logs/<server>/SystemOut.log | tail -30
        ls -lt <PROFILE_ROOT>/logs/ffdc/ | head -5 ; tail -n 60 <PROFILE_ROOT>/logs/<server>/startServer.log
        <PROFILE_ROOT>/bin/serverStatus.sh -all
      check: "예외 클래스·모듈명 기록. 포트 충돌(TCPC0003E)·앱 초기화 예외·구성 파일 오류 구분. 정상: serverStatus 가 STARTED 이고 SystemOut 에 WSVR0001I 이후 E 등급 메시지 없음"
      note: "적용: WAS 8.5.5/9.0 · 권한: 로그 읽기(WAS 실행 계정), 보안 사용 시 serverStatus.sh 는 사용자·비밀번호를 묻는다(-password 를 명령줄에 쓰지 않음)"
  - stage: 2
    steps:
    - do: 서버 재기동
      cmd: |
        <PROFILE_ROOT>/bin/stopServer.sh <server> ; <PROFILE_ROOT>/bin/startServer.sh <server>   # 관리 보안 사용 시 자격 증명은 soap.client.props 에서 읽음(아래 주의)
      check: "성공: SystemOut.log 에 WSVR0001I 'Server <server> open for e-business', serverStatus STARTED. 실패: ADMU3011E/ADMU3027E 등 기동 실패 또는 같은 예외 반복 → 구성 복원 단계 또는 3차"
      note: "사전조건: 1차 로그·javacore 확보, 클러스터면 다른 멤버가 부하를 받을 수 있는지 확인 · 영향: 재기동 동안 서비스 중단·세션 소실(세션 지속성 없을 때) · 승인: 서비스 담당·WAS 운영 담당 · 백업/롤백: 재기동 전 backupConfig.sh <zip> -nostop, 기동 실패 시 구성 복원 단계로 · 주의: -username/-password 를 명령줄에 쓰지 않는다(UNIX 는 ps -ef 에 그대로 보임) — 사전에 <PROFILE_ROOT>/properties/soap.client.props 에 com.ibm.SOAP.securityEnabled=true·com.ibm.SOAP.loginUserid=<admin>·com.ibm.SOAP.loginPassword 를 넣고 <PROFILE_ROOT>/bin/PropFilePasswordEncoder.sh <PROFILE_ROOT>/properties/soap.client.props com.ibm.SOAP.loginPassword 로 {xor} 인코딩(인코딩은 암호화가 아님 — 파일 권한 600·실행 계정만), props 를 쓰지 않으면 실행 시 사용자·비밀번호 입력을 받는 방식으로 · 적용: WAS 8.5.5/9.0"
      verify_note: "미검증 — soap.client.props 에 자격 증명이 없을 때 stopServer.sh 가 사용자·비밀번호를 대화형으로 묻는지(com.ibm.SOAP.loginSource=prompt 동작)를 IBM 문서로 확인하지 못함. soap.client.props 방식은 IBM 지원 문서 'Stopping WebSphere Application Server without entering a user name and password' 로 확인"
    - do: 애플리케이션 재시작·재배포·롤백
      cmd: |
        <PROFILE_ROOT>/bin/wsadmin.sh -lang jython -c "AdminApplication.stopApplicationOnSingleServer('<app>','<node>','<server>')"
        <PROFILE_ROOT>/bin/wsadmin.sh -lang jython -c "AdminApplication.startApplicationOnSingleServer('<app>','<node>','<server>')"
        <PROFILE_ROOT>/bin/wsadmin.sh -lang jython -c "AdminApp.update('<app>','app',['-operation','update','-contents','/path/<app>.ear']); AdminConfig.save()"
      check: "성공: AdminApplication.checkIfAppExists / 앱 상태 Started, SystemOut 에 WSVR0221I(애플리케이션 시작). 실패: WSVR0101W/0100W·SRVE 초기화 예외 → 직전 ear 로 같은 AdminApp.update 재실행(롤백)"
      note: "사전조건: 직전 정상 ear 확보(콘솔 Export 또는 installedApps 사본), 업무 담당과 작업 시간 합의 · 영향: stop~start 및 update 동안 앱 중단·세션 소실, update 는 저장 후 앱 재시작 · 승인: 서비스 담당·WAS 운영 담당 · 백업/롤백: 현재 ear 사본과 backupConfig.sh -nostop zip 보관, 실패 시 직전 ear 로 update · 적용: WAS 8.5.5/9.0 (ND 는 저장 후 노드 동기화)"
    - do: 구성 파일 손상 시 백업 복원 (restoreConfig)
      cmd: |
        <PROFILE_ROOT>/bin/backupConfig.sh /tmp/wasconfig_$(date +%Y%m%d).zip -nostop
        <PROFILE_ROOT>/bin/restoreConfig.sh /path/last_good_config.zip
      check: "성공: 복원 후 startServer 로 서버 기동 성공(WSVR0001I). 실패: restoreConfig 오류 또는 기동 실패 지속 → 방금 만든 /tmp/wasconfig_<날짜>.zip 으로 원복 후 3차"
      note: "사전조건: last_good_config.zip 이 마지막 정상 시점 백업인지 날짜 확인, 해당 노드 서버 중지 가능 시간 · 영향: restoreConfig 는 -nostop 이 없으면 노드의 서버들을 중지하고, 백업 이후 설정 변경이 사라짐 · 승인: WAS 운영 담당·서비스 담당 · 백업/롤백: 복원 전 현재 구성을 backupConfig.sh -nostop 으로 zip(cmd 1번째 줄), 되돌릴 때 그 zip 으로 restoreConfig · 적용: WAS 8.5.5/9.0 (ND 는 dmgr 프로파일 기준 복원 후 노드 동기화)"
  - stage: 3
    steps:
    - do: IBM Support 자료
      cmd: |
        <PROFILE_ROOT>/bin/collector.sh ; <WAS_HOME>/bin/versionInfo.sh -maintenancePackages | head -30
      check: collector jar(로그·config·ffdc·버전 포함)
      note: "민감정보 마스킹: collector jar 에는 config 전체(security.xml 의 {xor} 비밀번호·키스토어 파일)와 로그의 호스트명·IP·사용자 ID·세션 ID·JDBC URL 이 들어가므로 전달 전 내용 확인·가림, collector 는 WAS 설치 경로 밖 빈 작업 폴더에서 실행 · 전달 승인: 보안 담당 승인 후 IBM 케이스(ECuRep)에만"

- id: WAS-PROC-SECURITY
  category: security
  match: [SECJ0118E, SECJ0369E, SECJ0053E, SECJ0270E, CWPKI0033E, CWPKI0017E, CWPKI0019E, CWPKI0022E, CWPKI0315E, CWPKI0040I]
  title: 인증 실패(SECJ)·SSL 인증서 오류(CWPKI)
  source: "IBM WAS 9.0 'Securing communications › SSL configurations (Key stores and certificates, retrieveSigners, Certificate expiration monitor)'·'Troubleshooting security configurations' — ibm.com/docs/en/was/9.0.5?topic=security-ssl-configurations"
  stages:
  - stage: 1
    steps:
    - do: 실패 계정·인증서 만료 확인 (읽기 전용)
      cmd: |
        grep -n "SECJ0118E\|SECJ0369E\|CWPKI00" <PROFILE_ROOT>/logs/<server>/SystemOut.log | tail -20
        <PROFILE_ROOT>/bin/wsadmin.sh -lang jython -c "print AdminTask.listPersonalCertificates('[-keyStoreName NodeDefaultKeyStore -keyStoreScope (cell):<cell>:(node):<node>]')"
      check: "이상: 인증서 validity 종료가 임박(30일 이내)/경과면 교체, 같은 외부 IP 반복 실패는 보안 담당 통보. 정상: 유효 기간 내·실패 일회성"
      note: "적용: WAS 8.5.5/9.0 · 권한: 관리 보안 사용 시 monitor 역할 이상(인증서 목록 조회), 로그 읽기 · 비밀번호·키 내용은 출력되지 않음(목록·유효 기간만)"
  - stage: 2
    steps:
    - do: 만료 인증서 갱신 (자체 서명) 또는 신규 인증서 반입 + signer 교환
      cmd: |
        <PROFILE_ROOT>/bin/backupConfig.sh /tmp/wasconfig_$(date +%Y%m%d%H%M).zip -nostop
        <PROFILE_ROOT>/bin/wsadmin.sh -lang jython -c "AdminTask.renewCertificate('[-keyStoreName NodeDefaultKeyStore -keyStoreScope (cell):<cell>:(node):<node> -certificateAlias default]'); AdminConfig.save()"
        <PROFILE_ROOT>/bin/retrieveSigners.sh NodeDefaultTrustStore ClientDefaultTrustStore -autoAcceptBootstrapSigner
        <PROFILE_ROOT>/bin/syncNode.sh <dmgr-host> 8879   # 관리 보안 사용 시 자격 증명은 노드 프로파일의 soap.client.props 에서 읽음(아래 주의)
      check: "성공: listPersonalCertificates 의 새 만료일 확인, 노드 동기화 후 CWPKI0017E/0022E 미발생·노드 통신 정상. 실패: syncNode 오류(ADMU0xxx)·SSL 핸드셰이크 오류 지속 → 백업 zip 으로 restoreConfig 후 signer 교환 재시도"
      note: "사전조건: 갱신 대상 별칭 확인, 외부 연동 상대(웹서버 플러그인 키 저장소·클라이언트)가 쓰는 signer 목록 파악, syncNode.sh 는 노드 에이전트를 중지한 상태에서 실행(8879 는 dmgr SOAP 기본 포트) · 영향: 인증서 교체 순간부터 이전 signer 만 가진 클라이언트·플러그인 SSL 실패, 노드 에이전트 중지 동안 해당 노드 관리 불가 · 승인: 보안 담당·WAS 운영 담당 · 백업/롤백: backupConfig.sh -nostop zip(cmd 1번째 줄) 과 키스토어(*.p12) 사본 보관, 롤백은 restoreConfig 후 노드 동기화 · 주의: -username/-password 를 명령줄에 쓰지 않는다(ps·history 노출) — 노드 프로파일의 properties/soap.client.props 에 loginUserid·loginPassword(PropFilePasswordEncoder.sh 로 {xor} 인코딩, 파일 권한 600)를 두거나 실행 시 입력받는 방식으로 · 적용: WAS 8.5.5/9.0 ND (단독 서버는 syncNode 불필요)"
      verify_note: "미검증 — soap.client.props 에 자격 증명이 없을 때 syncNode.sh 가 사용자·비밀번호를 대화형으로 묻는지 IBM 문서로 확인하지 못함(soap.client.props 로 명령 도구 인증을 대신하는 방식만 확인)"
    - do: LTPA 키·인증 실패 대응 (SECJ0369E)
      config:
        file: 관리 콘솔 › Security › Global security › LTPA (키 세트 그룹, 자동 생성 주기) / Authentication cache
        snippet: |
          LTPA timeout 120 min · Key set group NodeLTPAKeySetGroup(자동 생성 On) · 셀 간 SSO 시 LTPA 키 export/import 로 동일 키 사용
      check: "성공: 저장·동기화 후 SSO 대상 셀 간 로그인 정상, SystemOut 에 SECJ0369E 미발생. 실패: 키 교환 후 전 사용자 SSO 실패(토큰 검증 오류) → 이전 키 파일 다시 import"
      note: "사전조건: SSO 대상 셀·제품 목록과 키 파일 비밀번호 확보, 이전 LTPA 키 export 보관 · 영향: 키 재생성·교체 순간 기존 LTPA 토큰 무효 — 전체 사용자 재로그인 필요 · 승인: 보안 담당·서비스 담당 · 백업/롤백: 변경 전 콘솔 LTPA Export keys 로 키 파일 보관 + backupConfig.sh -nostop, 롤백은 보관 키 import 후 동기화 · 적용: WAS 8.5.5/9.0"
  - stage: 3
    steps:
    - do: IBM Support 자료
      cmd: |
        tar czf was_sec_$(date +%Y%m%d).tgz <PROFILE_ROOT>/logs/<server>/ <PROFILE_ROOT>/config/cells/<cell>/security.xml 2>/dev/null
        # 키스토어(<PROFILE_ROOT>/config/cells/<cell>/nodes/<node>/*.p12)는 개인키 포함 — IBM 이 명시 요청하고 보안 담당이 승인한 경우에만 별도 전달
      check: security.xml·키스토어(비밀번호 별도)·로그 (MustGather 'SSL problems')
      note: "민감정보 마스킹: security.xml 의 {xor} 인코딩 비밀번호(쉽게 복호됨)·사용자 ID·LDAP bind DN·호스트명 가림, 로그의 사용자 ID·출처 IP 가림, 인증서 정보는 listPersonalCertificates 출력으로 대체 · 전달 승인: 보안 담당 승인 후 IBM 케이스(ECuRep)에만"
