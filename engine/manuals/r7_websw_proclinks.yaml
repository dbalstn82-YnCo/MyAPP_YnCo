# 판정 기준: 그 절차의 1차(읽기 전용) 확인이 이 판정의 원인을 실제로 가려내는가(낱말 겹침이 아니라 진단 내용으로 판단).
#  - fit_reviewed: true  = 기존 연결이 맞음(사유는 reviewed) — 연결 감사 '적합성 낮음' 대기열에서 뺀다
#  - primary: true       = 더 맞는 기존 절차를 1순위로 지정(같은 ID 를 가진 다른 절차보다 앞선다)
#  - 맞는 기존 절차가 없는 것은 r7_websw_procedures.yaml 의 전용 절차(scope: id)로 옮겼다(NGX/WTB/JAVA/IIS/MESIM-PROC-R7-*).
