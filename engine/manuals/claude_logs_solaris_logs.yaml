- heading: '로그: ZFS 이력'
  body: 경로 zpool history · zpool status -v · zpool events / 형식 텍스트 / 확인 풀 저하·resilver·체크섬 오류·디스크 교체 이력 / 샘플 2026-09-09.14:02:11 zpool replace tank c1t2d0 c1t3d0
- heading: '로그: sar 성능 이력'
  body: 경로 /var/adm/sa/saDD / 형식 바이너리(sar -f) / 확인 CPU·메모리·I/O 추세 / 샘플 14:00:01 %usr %sys %wio %idle
