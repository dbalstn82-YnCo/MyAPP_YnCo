product: tibero
layer: db
title: tibero 로그 종류 카탈로그 (GPT 수집 — 벤더 문서 대조 필요)
source: GPT 수집(벤더 문서 대조 필요)
sources: []
logtypes:
- name: 시스템 로그
  path: $TB_HOME/instance/$TB_SID/log/slog/sys.log 계열
  format: 텍스트·YYYY/MM/DD HH:mm:ss.SSS 계열
  check: ec=·TBR 오류·기동·redo·I/O·메모리·내부 오류
  sample: ec=<error-number> 포함 메시지 형식
- name: DBMS 중요 로그
  path: $TB_HOME/instance/$TB_SID/log/dlog/
  format: 텍스트·타임스탬프
  check: 서버 기동/종료·DDL·시스템 주요 상태
  sample: timestamp+module/message 형식
- name: Internal 로그
  path: $TB_HOME/instance/$TB_SID/log/ilog/
  format: 내부 로그·스레드별 이벤트, tbiv로 조회
  check: thread event·내부 엔진 상태·재현 어려운 장애
  sample: tbiv 해석형 내부 event record
- name: Listener 로그
  path: $TB_HOME/instance/$TB_SID/log/lsnr/trace_list.log
  format: 텍스트·YYYY/MM/DD HH:mm:ss.SSS
  check: listener start/stop·accepted connection·client IP·SSL·WTHR 전달
  sample: 2023/03/21 23:26:57.933 [5] listener:948 a client connection from [...]
- name: Activity 로그
  path: $TB_HOME/instance/$TB_SID/log/act/
  format: 텍스트·타임스탬프
  check: Activity Monitor가 장시간 멈춘 thread 감지·hang·stuck thread
  sample: thread 상태/감지시간 중심 record 형식
- name: Audit 로그
  path: 기본 $TB_HOME/instance/$TB_SID/audit, AUDIT_FILE_DEST; audit.log 계열
  format: 텍스트·YYYY/MM/DD HH:mm:ss.SSS
  check: SESS_ID·USER_NAME·ACTION·OBJ_NAME·SQLTEXT·권한 사용
  sample: SESS_ID:[21] ... USER_NAME:[TEST] ... ACTION:[S] ... SQLTEXT:[...]
- name: Diagnostic 로그
  path: $TB_HOME/instance/$TB_SID/log/diag/
  format: 텍스트/덤프·장애시각
  check: critical internal error·callstack·진단자료
  sample: 버전별 진단 dump/trace 형식
- name: Memory 로그
  path: 기본 $TB_HOME/instance/$TB_SID/log/memlog/ 또는 MEM_LOG_DEST
  format: 텍스트·타임스탬프
  check: 메모리 사용·할당 문제·메모리 진단
  sample: memory diagnostic record 형식
sections:
- heading: 로그 종류 카탈로그 (전수)
  body: '시스템 로그: $TB_HOME/instance/$TB_SID/log/slog/sys.log 계열 · DBMS 중요 로그: $TB_HOME/instance/$TB_SID/log/dlog/ · Internal 로그: $TB_HOME/instance/$TB_SID/log/ilog/ · Listener 로그: $TB_HOME/instance/$TB_SID/log/lsnr/trace_list.log
    · Activity 로그: $TB_HOME/instance/$TB_SID/log/act/ · Audit 로그: 기본 $TB_HOME/instance/$TB_SID/audit, AUDIT_FILE_DEST; audit.log 계열 · Diagnostic 로그: $TB_HOME/instance/$TB_SID/log/diag/ · Memory 로그: 기본 $TB_HOME/instance/$TB_SID/log/memlog/
    또는 MEM_LOG_DEST'
