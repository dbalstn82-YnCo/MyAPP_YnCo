# WAS 계층 제품 버전 카탈로그 — 코드 조회 › 제품 › [버전] 탭 (검증 2026-09-11, Claude 웹 대조 + GPT 교차 수집 A28/B5 반영)
products:
  jeus:
    title: TmaxSoft JEUS 버전별 수명주기·로그 코드 체계
    updated: '2026-09-11'
    note: '모듈명-4자리 코드([Network-0708] 등)는 JEUS 6 컨테이너 실로그와 7+ 문서에서 동일하게 확인되어 Network-/WEB-/JMX-/TM-/JNSS- 코드는 6~9 공통으로 수집한다. 7 에서 도메인(DAS/MS)·Launcher 구조가 도입되어 SERVER-/LAUNCHER-/DOMAIN-/DEPLOY- 코드는 7+ 전용(8.5 부터 DAS→MASTER 명칭). 기존 도구 룰의 NET-/D_SESSION- 접두는
      도입 버전 미확인이라 전 버전 수집. EOL/EOS 는 tmaxsoft 공지(6: 2016-12-31/2018-12-31/ES 2021-12-31, 7: 2021-06-30/2022-06-30/ES 2025-06-30). GPT 교차(A 28/B 5) 반영.'
    columns:
    - version
    - released
    - support_end
    - jdk
    - config
    - log_format
    - code_scheme
    - source
    labels:
      version: 버전
      released: 출시
      support_end: 지원 종료
      jdk: JDK
      config: 설정 파일
      log_format: 로그 형식
      code_scheme: 코드 체계
      source: 출처
    versions:
    - version: 6.0 (Fix#1~#10)
      released: 2007-06
      support_end: EOL 2016-12-31 / EOS 2018-12-31 / Extended 2021-12-31
      jdk: 5 / 6
      config: JEUSMain.xml + 컨테이너별 xml
      log_format: '[YYYY.MM.DD HH:MM:SS][level][pid] [container1-tid] [Network-0708] msg (실로그)'
      code_scheme: Network-/WEB-(WJP 33xx)/JMX-/TM-/JNSS- (6 실로그·GPT 확인) — 도메인 코드(SERVER-/LAUNCHER-/DOMAIN-)는 없음
      source: collect/gpt_bizmaster_2026-09-10.md ; collect/verify/resp_was_versions_2026-09-11.txt
    - version: 7.0 (Fix#0~#5)
      released: 2012-06
      support_end: EOL 2021-06-30 / EOS 2022-06-30 / Extended 2025-06-30 (GPT A, tmaxsoft 공지)
      jdk: 6 / 7 / 8
      config: domain.xml (DAS 관리)
      log_format: '[YYYY.MM.DD HH:MM:SS][level][pid] [server-tid] [CODE-nnnn] msg (JEUS 6 형식 옵션 제공)'
      code_scheme: SERVER-/LAUNCHER-/Network-/SESSION-/JNDI.CONTEXT-/DEPLOY-/DOMAIN-/CPOOL-/JDBC-/TM-/JMX-/WEB-
      source: JEUS 7 Release Note(technet) ; Server Guide Logging
    - version: 8 (Fix#1~#4)
      released: 2017-02 (Java EE 7 인증 2013)
      support_end: 미공개(지원 중)
      jdk: 7 / 8
      config: domain.xml
      log_format: 7 과 동일
      code_scheme: 7 과 동일
      source: https://en.wikipedia.org/wiki/JEUS
    - version: 8.5 (8 Fix#5)
      released: 2020-02
      support_end: 미공개(지원 중)
      jdk: 8 / 11
      config: domain.xml (MASTER/MS 명칭)
      log_format: formatter-pattern [%d{yyyy.MM.dd HH:mm:ss}][%l] [%J-%T] [%M-%N] %m 지원, JeusLoggerStatus.log 추가
      code_scheme: 7 과 동일 — 메시지 문구 DAS→MASTER
      source: https://en.wikipedia.org/wiki/JEUS
    - version: 9 / 9.1
      released: 2024-09-27 / 2025-09-30 (9.1.1 2026-06-08, 내장 WebtoB 제거)
      support_end: 미공개(지원 중)
      jdk: 11 / 17 (Jakarta EE 9.1/10)
      config: domain.xml
      log_format: '[%d] [%l] [%J-%T] [%M-%N] %m, 레벨 0=SEVERE 1=WARNING 2=INFO'
      code_scheme: SERVER/WEB/JNSS/JMX/Network/TM/Launcher/SESSION 모듈(공식 목록)
      source: docs.tmaxsoft.com/ko/jeus/9
  tomcat:
    title: Apache Tomcat 버전별 수명주기·로그 형식
    updated: '2026-09-11'
    note: 'Tomcat 은 고유 코드가 없어 문구 별칭(TOMCAT-*)으로 판정한다(GPT A: 6~11 모두 통일 코드 없음 확인, 11 은 JsonFormatter 선택 가능). catalina.out/catalina.YYYY-MM-DD.log 의 JULI 형식(7 이하 2줄, 8.5+ 1줄 ''DD-MMM-YYYY HH:MM:SS.mmm LEVEL [thread] class.method msg'')을 파서가 모두 읽는다. EOS 된
      5.5/6/7/8.0/8.5/10.0 도 문구가 같아 수집 대상.'
    columns:
    - version
    - released
    - support_end
    - latest
    - servlet
    - log_format
    - note
    - source
    labels:
      version: 버전
      released: 출시
      support_end: 지원 종료
      latest: 최종 릴리스
      servlet: Servlet/JSP
      log_format: 로그 형식
      note: 비고
      source: 출처
    versions:
    - version: '5.5'
      released: '2003-09 (5.5: 2004-08)'
      support_end: '2012-09-30'
      latest: 5.5.36
      servlet: 2.4 / 2.0
      log_format: 'JULI 2줄 (날짜 클래스 메서드 / LEVEL: msg)'
      note: JDK 1.4/5
      source: https://endoflife.date/tomcat
    - version: '6.0'
      released: '2006-10-21'
      support_end: '2016-12-31'
      latest: 6.0.53
      servlet: 2.5 / 2.1
      log_format: JULI 2줄
      note: NIO 커넥터 도입, 6.0.24+ 메모리 누수 감지
      source: https://endoflife.date/tomcat
    - version: '7.0'
