# 근거 매뉴얼·작성 기준 (7차 연결 감사 — '이 판정 전용'인데 판정 핵심어가 절차에 없던 WAS 묶음 C 의 실제 오연결 정정, 2026-10-16 · knowledge_spec 5차 GPT 45차 관문)
# 확인한 제조사 문서(이번 작업에서 직접 대조):
# - Red Hat JBoss EAP 8.0 / 7.3 Log Message Reference (access.redhat.com/webassets/avalon/d/red_hat_jboss_enterprise_application_platform/{8.0,7.3}/mgmt_model/log-message-reference.html)
#   · WFLYSRV0210 'Server is already paused'·0211/0212/0236/0260 · WFLYSRV0232 'Could not get module info for module name'·0257 'Required system property not set'
#   · WFLYCTL0348 'Timeout … waiting for service container stability. Operation will roll back'·0349·0027 · WFLYUT0080 'Valves are no longer supported'·WFLYUT0001
#   · WFLYJCA0003·0027·0030·0031·0034·0041 · WFLYSEC0011 'Argument %s is null'(7.3 — 8.0 목록에는 없음, 레거시 security 하위시스템) · IJ000100
# - Red Hat EAP 7.3/7.4 Configuration Guide '2.4 Graceful Suspend and Shutdown'(suspend-state·:suspend·:resume·--start-mode=suspend)
# - Red Hat KB 1190323 'Configuring jboss.as.management.blocking.timeout in JBoss EAP 6/7'(기본 300초, /system-property 로 지정) · KB 3455811(IJ031040 — 해결 원문은 구독 필요, 미검증 표시)
# - Oracle FMW 12.2.1.4 Error Messages (docs.oracle.com/en/middleware/fusion-middleware/12.2.1.4/fmerr/bea-000001-bea-2194843.html) BEA-101083·BEA-101220·BEA-160197·BEA-101019
# - IBM WebSphere 8.5.5 메시지 참조 DSRA(DSRA0010E·DSRA0080E)·J2CA(J2CA0075W)·SECJ(SECJ0053E) · 'Assigning users and groups to roles'(Security role to user/group mapping)
# - TmaxSoft JEUS Deployment Guide '도메인 환경에서 애플리케이션 관리'(애플리케이션 ID 는 도메인 안에서 유일·미지정 시 파일 이름의 '.'→'_'·install-application -id/-f) — 검색 요약으로만 확인(사이트 접속 불가), 옵션 철자는 verify_note
# 작성 기준: 1차=읽기 전용(재기동·정리·설정 변경 없음), 2차=사전조건·영향·승인·백업/롤백 + 성공/실패 판단, 3차=민감정보 마스킹·전달 승인.
#           비밀번호는 명령줄에 쓰지 않는다(jboss-cli 는 로컬 인증·프롬프트, jeusadmin 은 -p 생략 프롬프트, WLST·Deployer 는 userConfigFile, wsadmin 은 soap.client.props·프롬프트). nc 는 nc -zvw3 만.
procedures:
- id: EAP-PROC-R7-SUSPEND
  scope: id
  products: [jboss]
  category: internal
  match: [WFLYSRV0210]
  title: 서버가 이미 일시중지(suspend)됨 — 중복 suspend 호출·일시중지 상태 확인 (JBoss EAP/WildFly)
  source: "Red Hat JBoss EAP 8.0 Log Message Reference(WFLYSRV0210 'Server is already paused'·WFLYSRV0211·0212·0236·0260) / EAP 7.4 Configuration Guide '2.4 Graceful Suspend and Shutdown'(suspend-state·:suspend·:resume·--start-mode=suspend)"
  stages:
  - stage: 1
    steps:
    - do: 지금 서버가 이미 일시중지 상태인지 확인 (읽기 전용)
      cmd: |
        $JBOSS_HOME/bin/jboss-cli.sh -c ":read-attribute(name=suspend-state)"
        $JBOSS_HOME/bin/jboss-cli.sh -c ":read-attribute(name=server-state)"
      check: "RUNNING 이면 요청을 받는 정상 상태 — WFLYSRV0210 은 이미 일시중지된 서버에 suspend 를 또 부른 호출만 거부된 것. SUSPENDED·SUSPENDING·PRE_SUSPEND 면 새 요청을 받지 않는 상태(사용자 오류 응답) → 의도된 작업인지 다음 단계로 확인"
      note: "적용: EAP 7.x/8.0·WildFly 10+ (suspend-state 는 EAP 7 부터, 관리 인터페이스는 일시중지 중에도 동작) · 도메인 모드는 /host=<host>/server=<server>:read-attribute(name=suspend-state) · 권한: jboss-cli 관리 사용자(Monitor 이상)"
    - do: 누가·언제 일시중지했는지 흐름 확인
      cmd: |
        grep -n -E 'WFLYSRV0210|WFLYSRV0211|WFLYSRV0212|WFLYSRV0236|WFLYSRV0260' $JBOSS_HOME/standalone/log/server.log | tail -20
        ps -ef | grep '[j]boss-modules' | grep -o -E -- '--start-mode[= ][a-z-]+'
        ls -l $JBOSS_HOME/standalone/data/audit-log.log 2>/dev/null && grep -n -i -E 'suspend|resume' $JBOSS_HOME/standalone/data/audit-log.log | tail -10
      check: "WFLYSRV0211/0236(일시중지 시작) 뒤 WFLYSRV0212(재개)가 없으면 아직 일시중지 중. WFLYSRV0260 또는 --start-mode=suspend 면 일시중지 상태로 기동한 것. 감사 로그에 suspend 작업이 있으면 운영 스크립트·작업자 확인 — 정상: 계획 작업(배포·graceful shutdown) 중의 중복 호출"
      note: "적용: EAP 7.x/8.0 · 감사 로그는 활성화한 경우만 · 권한: 로그 읽기"
  - stage: 2
    steps:
    - do: 의도치 않은 일시중지면 요청 수신 재개, 중복 호출 스크립트 수정
      cmd: |
        $JBOSS_HOME/bin/jboss-cli.sh -c ":resume"
        $JBOSS_HOME/bin/jboss-cli.sh -c ":read-attribute(name=suspend-state)"
      check: "성공: suspend-state RUNNING, server.log 에 WFLYSRV0212(Resuming server), 업무 요청 정상 응답 · 실패: 재개 오류(WFLYSRV0215 Failed to resume activity — 메시지가 재기동을 권고) → 서버 재기동 절차(EAP-PROC-INTERNAL 2차)로"
      note: "사전조건: 1차에서 계획 작업(배포·점검·graceful shutdown)이 아님을 작업 담당에게 확인 — 진행 중 작업을 끊지 않는다 · 영향: 재개 즉시 새 요청 유입 · 승인: WAS 운영 담당·서비스 담당 · 백업/롤백: 설정 변경 없음, 되돌리려면 :suspend(suspend-timeout=<초>) 로 다시 일시중지(EAP 7.0 문서는 timeout=<초>) · 적용: EAP 7.x/8.0·WildFly 10+, 도메인 모드는 /host=<host>/server=<server>:resume"
  - stage: 3
    steps:
    - do: Red Hat 케이스 자료
      cmd: |
        $JBOSS_HOME/bin/jdr.sh
        grep -n -E 'WFLYSRV02(10|11|12|15|36|60)' $JBOSS_HOME/standalone/log/server.log > suspend_$(date +%Y%m%d).txt
      check: "JDR + 일시중지·재개 흐름 발췌 + 일시중지를 부른 운영 스크립트(내용 확인 후)"
      note: "민감정보 마스킹: 로그·스크립트의 호스트명·IP·관리 계정·스크립트 안 자격 증명 가림 · 전달 승인: 보안 담당 승인 후 Red Hat 케이스에만"

- id: EAP-PROC-R7-BOOTCFG
  scope: id
  products: [jboss]
  category: internal
  match: [WFLYSRV0257, WFLYSRV0232]
  title: 기동 구성 누락 — 필수 시스템 속성 미설정·모듈 정보 조회 실패 (JBoss EAP/WildFly)
  source: "Red Hat JBoss EAP 8.0 Log Message Reference(WFLYSRV0257 'Required system property %s not set'·WFLYSRV0232 'Could not get module info for module name') / EAP 7.4 Configuration Guide 'System Properties'(/system-property)·'JBoss EAP Modules'(module.xml resource-root)"
  stages:
  - stage: 1
    steps:
    - do: 미설정 시스템 속성 이름·조회 실패 모듈 이름 확인 (읽기 전용)
      cmd: |
        grep -n -B2 -A8 -E 'WFLYSRV0257|WFLYSRV0232' $JBOSS_HOME/standalone/log/server.log | tail -40
      check: "WFLYSRV0257 은 따옴표 안이 필수 시스템 속성 이름, WFLYSRV0232 는 'module name:' 뒤가 모듈 정보 조회 실패 모듈 이름 — 둘 다 기록"
      note: "적용: EAP 7.x/8.0·WildFly · 권한: 로그 읽기"
    - do: 필수 시스템 속성이 어디에도 설정되지 않았는지 확인
      cmd: |
        ps -ef | grep '[j]boss-modules' | grep -o -- '-D<속성이름>[^ ]*'
        grep -n '<속성이름>' $JBOSS_HOME/bin/standalone.conf $JBOSS_HOME/standalone/configuration/standalone*.xml
        $JBOSS_HOME/bin/jboss-cli.sh -c "/system-property=<속성이름>:read-resource"
      check: "기동 인자(-D)·standalone.conf·system-properties 어디에도 없으면 미설정 확정. 다른 노드에는 있으면 이 노드의 기동 스크립트·설정 누락 — 값은 다른 노드 설정과 대조"
      note: "적용: EAP 7.x/8.0 · /system-property 조회는 없으면 'not found' 로 실패하는 조회일 뿐 변경 없음 · 권한: jboss-cli 관리 사용자·설정 파일 읽기 · 값에 비밀번호가 있으면 화면 기록 금지"
    - do: 모듈 파일(module.xml·JAR) 존재·권한 확인 (WFLYSRV0232)
      cmd: |
        ls -l $JBOSS_HOME/modules/system/layers/base/<모듈경로>/main/ $JBOSS_HOME/modules/<모듈경로>/main/ 2>/dev/null
        grep -n -E 'module xmlns|name=|resource-root' $JBOSS_HOME/modules/<모듈경로>/main/module.xml
      check: "디렉터리·module.xml 이 없거나 module.xml 의 name 이 로그의 모듈 이름과 다르면 누락·오타 확정, resource-root 의 JAR 이 없거나 실행 계정이 읽을 수 없으면 손상·권한 원인"
      note: "적용: EAP 7.x/8.0(<모듈경로> 는 모듈 이름의 '.' 을 '/' 로 바꾼 경로) · 권한: 일반 사용자"
  - stage: 2
    steps:
    - do: 누락 시스템 속성 추가 (관리 모델 또는 기동 인자)
      cmd: |
        $JBOSS_HOME/bin/jboss-cli.sh -c ":take-snapshot"
        $JBOSS_HOME/bin/jboss-cli.sh -c "/system-property=<속성이름>:add(value=<값>)"
        $JBOSS_HOME/bin/jboss-cli.sh -c ":reload"
      check: "성공: reload 후 WFLYSRV0257 미발생·server-state running·관련 배포 STATUS OK · 실패: 기동 단계에서 읽는 속성이라 여전히 실패하면 standalone.conf 의 JAVA_OPTS 에 -D<속성이름>=<값> 을 넣고 재기동, 그래도 실패면 스냅샷 복원"
      note: "사전조건: 속성 이름·값을 다른 노드·기동 표준과 대조, 값이 비밀번호면 평문 대신 자격 증명 저장소 사용 검토 · 영향: :reload 동안 전체 배포 중단(수 초~수십 초) · 승인: WAS 운영 담당·서비스 담당 · 백업/롤백: 변경 전 :take-snapshot, 롤백은 /system-property=<속성이름>:remove 후 :reload 또는 스냅샷 복원 · 적용: EAP 7.x/8.0"
    - do: 누락·손상 모듈 복구
      cmd: |
        cp -rp $JBOSS_HOME/modules/<모듈경로>/main $JBOSS_HOME/modules/<모듈경로>/main.bak.$(date +%Y%m%d%H%M) 2>/dev/null
        cp -rp <백업 또는 정상 노드에서 받은 모듈>/main $JBOSS_HOME/modules/<모듈경로>/
        ls -l $JBOSS_HOME/modules/<모듈경로>/main/
      check: "성공: 관리 작업·기동 재실행 시 WFLYSRV0232 미발생 · 실패: 같은 오류면 module.xml 의 name·resource-root 와 로그 모듈 이름 재대조, 복구 전 main.bak 으로 원복"
      note: "사전조건: 정상 노드·설치 원본·패치 기록에서 같은 판의 모듈 확보(EAP 패치가 덮어쓰는 system/layers/base 는 직접 수정하지 않고 사용자 모듈은 modules/ 아래 별도 경로) · 영향: 모듈은 다음 기동·reload 때 읽힘 · 승인: WAS 운영 담당 · 백업/롤백: 첫 줄에서 main.bak.<시각> 보관, 되돌릴 때 그 디렉터리를 다시 복사"
  - stage: 3
    steps:
    - do: Red Hat 케이스 자료
      cmd: |
        $JBOSS_HOME/bin/jdr.sh
        ls -lR $JBOSS_HOME/modules/<모듈경로>/ > module_ls_$(date +%Y%m%d).txt
      check: "JDR + 모듈 디렉터리 목록 + 기동 스크립트(standalone.conf)"
      note: "민감정보 마스킹: standalone.conf·system-property 값의 비밀번호·호스트명·IP·계정 가림 · 전달 승인: 보안 담당 승인 후 Red Hat 케이스에만"

- id: EAP-PROC-R7-DSDEPLOY
  scope: id
  products: [jboss]
  category: internal
  match: [WFLYJCA0003, WFLYJCA0041, WFLYJCA0030, WFLYJCA0031, WFLYJCA0027]
  title: 데이터소스·JDBC 드라이버·리소스 어댑터(JCA) 배포 실패 — 드라이버 생성·드라이버 모듈 로드 실패·DS/XA DS 검증 실패·IronJacamar 보안설정 없음 (JBoss EAP/WildFly)
  source: "Red Hat JBoss EAP 8.0 Log Message Reference(WFLYJCA0003 'Unable to instantiate driver class'·0041 'Failed to load module for driver'·0030 'unable to deploy'·0031 'unable to validate and deploy ds or xads'·0027 'No ironjacamar.security defined') / EAP 7.4 Configuration Guide '12. Datasource Management'(JDBC 드라이버 모듈·jdbc-driver add·test-connection-in-pool)"
  stages:
  - stage: 1
    steps:
    - do: 실패한 드라이버·데이터소스·리소스 어댑터 이름과 원인 예외 확인 (읽기 전용)
      cmd: |
        grep -n -A15 -E 'WFLYJCA0003|WFLYJCA0041|WFLYJCA0030|WFLYJCA0031|WFLYJCA0027|WFLYJCA0034' $JBOSS_HOME/standalone/log/server.log | grep -E 'WFLYJCA|IJ0|Caused by|ClassNotFound|NoClassDefFound|ModuleNotFound' | head -40
      check: "JDBC 드라이버 생성 실패(WFLYJCA0003)는 드라이버 클래스 이름·Caused by(ClassNotFound·UnsupportedClassVersion), 드라이버 모듈 로드 실패(WFLYJCA0041)는 모듈 이름, DS/XA DS 검증·배포 실패(WFLYJCA0031)·JCA 리소스 배포 불가(WFLYJCA0030)는 IJ 코드·누락 항목, IronJacamar 보안설정 없음(WFLYJCA0027)은 리소스 이름 — 경고만이고 의도된 무인증 구성이면 조치 없음"
      note: "적용: EAP 7.x/8.0·WildFly 10+ · 권한: 로그 읽기"
    - do: 등록된 드라이버·데이터소스·배포 상태 확인
      cmd: |
        $JBOSS_HOME/bin/jboss-cli.sh -c "/subsystem=datasources:read-children-resources(child-type=jdbc-driver)"
        $JBOSS_HOME/bin/jboss-cli.sh -c "/subsystem=datasources:read-children-names(child-type=data-source)"
        $JBOSS_HOME/bin/jboss-cli.sh -c "deployment-info"
      check: "데이터소스의 driver-name 이 jdbc-driver 목록에 없으면 드라이버 참조 오류, 드라이버의 driver-module-name·driver-class-name 이 실제 JAR 과 다르면 생성 실패 원인. RAR·*-ds.xml 배포가 FAILED 면 배포 단위 오류"
      note: "적용: EAP 7.x/8.0 · 권한: jboss-cli 관리 사용자(Monitor 이상) · 출력의 connection-url·user-name 은 기록 시 가림"
    - do: 드라이버 모듈 파일·의존성 확인
      cmd: |
        ls -l $JBOSS_HOME/modules/<드라이버모듈경로>/main/
        grep -n -E 'module xmlns|name=|resource-root|<module ' $JBOSS_HOME/modules/<드라이버모듈경로>/main/module.xml
      check: "resource-root path 의 JAR 이름이 실제 파일과 다르거나 파일이 없으면 드라이버 모듈 로드 실패 확정, dependencies 에 javax.api·javax.transaction.api(EAP 8 은 jakarta.transaction.api)가 없으면 드라이버 생성 실패 원인"
      note: "적용: EAP 7.x/8.0 · 권한: 일반 사용자"
  - stage: 2
    steps:
    - do: 드라이버 모듈·등록 정보 바로잡기 후 reload
      cmd: |
        $JBOSS_HOME/bin/jboss-cli.sh -c ":take-snapshot"
        cp -p $JBOSS_HOME/modules/<드라이버모듈경로>/main/module.xml $JBOSS_HOME/modules/<드라이버모듈경로>/main/module.xml.bak.$(date +%Y%m%d%H%M)
        $JBOSS_HOME/bin/jboss-cli.sh -c "/subsystem=datasources/jdbc-driver=<driver>:add(driver-name=<driver>,driver-module-name=<모듈이름>,driver-class-name=<드라이버클래스>)"
        $JBOSS_HOME/bin/jboss-cli.sh -c ":reload"
        $JBOSS_HOME/bin/jboss-cli.sh -c "/subsystem=datasources/data-source=<DS>:test-connection-in-pool"
      config:
        file: $JBOSS_HOME/modules/<드라이버모듈경로>/main/module.xml
        snippet: |
          <module xmlns="urn:jboss:module:1.9" name="<모듈이름>">
            <resources><resource-root path="<실제 드라이버 JAR 파일명>"/></resources>
            <dependencies><module name="javax.api"/><module name="javax.transaction.api"/></dependencies>
          </module>
        note: "EAP 8 은 jakarta.transaction.api · 사전조건/승인/백업은 아래 note 와 같음"
      check: "성공: reload 후 WFLYJCA0004(드라이버 배포) 기록, 데이터소스 test-connection-in-pool true, WFLYJCA0003/0041/0031 미발생 · 실패: 같은 오류면 module.xml.bak 과 스냅샷으로 원복하고 드라이버 판(JDK 호환)을 DBA·개발 담당과 재확인"
      note: "사전조건: DB 판에 맞는 드라이버 JAR(JDK 지원 판) 확보, 같은 이름 드라이버가 이미 있으면 add 대신 기존 등록을 고친다 · 영향: :reload 동안 모든 배포 재시작(수 초~수십 초 서비스 중단) · 승인: WAS 운영 담당·DBA·서비스 담당 · 백업/롤백: :take-snapshot + module.xml.bak, 롤백은 /subsystem=datasources/jdbc-driver=<driver>:remove·module.xml.bak 복사 후 :reload · 적용: EAP 7.x/8.0"
    - do: 데이터소스·리소스 어댑터 정의 수정 후 재배포 (WFLYJCA0031·0030·0027)
      cmd: |
        $JBOSS_HOME/bin/jboss-cli.sh -c ":take-snapshot"
        $JBOSS_HOME/bin/jboss-cli.sh -c "/subsystem=datasources/data-source=<DS>:read-resource"
        $JBOSS_HOME/bin/jboss-cli.sh -c "deploy /path/<수정본>.rar --force"
      check: "성공: deployment-info 에서 RAR·DS 배포 OK, WFLYJCA0030/0031 미발생, 인증이 필요한 자원이면 WFLYJCA0027 경고 사라짐 · 실패: 배포 실패면 직전 정상 RAR 로 deploy --force(롤백), 설정 변경분은 스냅샷 복원"
      note: "WFLYJCA0027 은 자원이 인증을 요구할 때만 조치 — ironjacamar.xml·resource-adapters 의 security 요소(보안 도메인 또는 Elytron 인증 컨텍스트)를 추가하며 요소 이름은 해당 판 스키마로 확인 · 사전조건: 직전 정상 RAR·*-ds.xml 확보, JNDI 이름 중복 여부 확인 · 영향: 재배포 중 해당 자원을 쓰는 앱 오류 · 승인: WAS 운영 담당·서비스 담당 · 백업/롤백: 스냅샷·직전 배포본 보관, 실패 시 직전본 deploy --force"
      verify_note: "미검증 — WFLYJCA0027 해소용 ironjacamar.xml security 하위 요소 이름(판별 IronJacamar 스키마)을 원문으로 확인 못 함"
  - stage: 3
    steps:
    - do: Red Hat 케이스 자료
      cmd: |
        $JBOSS_HOME/bin/jdr.sh
        $JBOSS_HOME/bin/jboss-cli.sh -c "/subsystem=datasources:read-resource(recursive=true)" > ds_cfg_$(date +%Y%m%d).txt
      check: "JDR + 데이터소스·드라이버 설정 덤프 + 드라이버 JAR 이름·판 + module.xml"
      note: "민감정보 마스킹: ds_cfg 의 password·user-name·connection-url(호스트·포트·서비스명)·security-domain 값 가림(credential-reference 미사용 시 평문 비밀번호가 나옴) · 전달 승인: 보안 담당·DBA 승인 후 Red Hat 케이스에만"

- id: EAP-PROC-R7-WEBDEPLOY
  scope: id
  products: [jboss]
  category: internal
  match: [WFLYUT0080, WFLYUT0001]
  title: 웹 배포 구성 문제 — Valve 미지원으로 미활성화·JSP 초기화 실패 (JBoss EAP 7+/Undertow)
  source: "Red Hat JBoss EAP 8.0 Log Message Reference(WFLYUT0080 'Valves are no longer supported, %s is not activated'·WFLYUT0001 'Could not initialize Jakarta Server Pages') / EAP 7.4 Configuration Guide '17. Configuring the Web Server (Undertow)'(filters·handlers)·'Deploying Applications'"
  stages:
  - stage: 1
    steps:
    - do: 무시된 Valve·JSP 초기화 실패 원인 확인 (읽기 전용)
      cmd: |
        grep -n -A15 -E 'WFLYUT0080|WFLYUT0001' $JBOSS_HOME/standalone/log/server.log | grep -E 'WFLYUT|Caused by|Exception' | head -30
        $JBOSS_HOME/bin/jboss-cli.sh -c "deployment-info"
      check: "WFLYUT0080 은 Valve 미지원으로 미활성화된 Valve 클래스 이름 — 그 Valve 가 맡던 인증·접근 제어·로그 기능이 지금 동작하지 않는다는 뜻(보안 기능이면 우선 처리). WFLYUT0001 JSP 초기화 실패는 Caused by 의 클래스 충돌(ClassCastException·NoSuchMethodError·LinkageError) 기록"
      note: "적용: EAP 7.x/8.0·WildFly 10+(EAP 6 의 JBoss Web Valve 는 EAP 7 부터 미지원) · 권한: 로그 읽기·jboss-cli 관리 사용자"
    - do: 배포본 안의 Valve 선언·JSP/EL 라이브러리 포함 여부 확인
      cmd: |
        unzip -p <path>/<app>.war WEB-INF/jboss-web.xml | grep -n -i -A3 valve
        unzip -l <path>/<app>.war | grep -i -E 'jasper|jsp-api|el-api|servlet-api|jakarta.servlet'
      check: "jboss-web.xml 에 valve 선언이 있으면 EAP 6 시절 구성을 그대로 옮긴 것. WEB-INF/lib 에 Jasper·JSP/EL/Servlet API JAR 이 들어 있으면 서버 모듈과 충돌해 JSP 초기화 실패 원인"
      note: "적용: WAR 배포 · ear 면 unzip -l 로 안의 war 를 먼저 찾는다 · 권한: 배포 파일 읽기"
  - stage: 2
    steps:
    - do: Valve 기능 이전·충돌 라이브러리 제거한 수정본 재배포
      cmd: |
        cp -p /path/<app>.war /path/<app>.war.bak.$(date +%Y%m%d%H%M)
        $JBOSS_HOME/bin/jboss-cli.sh -c "deploy /path/<수정본 app>.war --force"
        $JBOSS_HOME/bin/jboss-cli.sh -c "deployment-info --name=<app>.war"
      check: "성공: STATUS OK, WFLYUT0080·WFLYUT0001 미발생, Valve 가 하던 기능(인증·접근 제어)이 Undertow 필터·서블릿 Filter 로 동작함을 시험 · 실패: STATUS FAILED 또는 기능 누락 → 보관본(.bak)으로 deploy --force 롤백 후 개발 담당 이관"
      note: "사전조건: 개발 담당이 Valve 기능을 Undertow 필터·핸들러 또는 서블릿 Filter 로 옮기고 WEB-INF/lib 의 JSP/EL/Servlet API JAR 을 뺀 수정본을 시험 환경에서 검증 · 영향: 재배포 중 해당 앱 중단·세션 소실 · 승인: 서비스 담당·WAS 운영 담당·보안 담당(보안 Valve 일 때) · 백업/롤백: 현재 war 를 .bak 으로 보관, 실패 시 그 파일로 deploy --force · 적용: EAP 7.x/8.0"
  - stage: 3
    steps:
    - do: Red Hat 케이스 자료
      cmd: |
        $JBOSS_HOME/bin/jdr.sh
        unzip -l <path>/<app>.war > war_list_$(date +%Y%m%d).txt
      check: "JDR + 배포본 파일 목록 + jboss-web.xml(내용 확인 후)"
      note: "민감정보 마스킹: 디스크립터의 자격 증명·호스트명·IP, 로그의 사용자 ID·세션 ID 가림, 배포본 자체는 보내지 않음 · 전달 승인: 보안 담당 승인 후 Red Hat 케이스에만"

- id: EAP-PROC-R7-CONNREUSE
  scope: id
  products: [jboss]
  category: connection
  match: [IJ031040]
  title: 관리 연결과 연관되지 않음 — 누수로 닫힌 DB 연결을 트랜잭션에서 다시 사용 (IJ031040, JBoss EAP)
  source: "Red Hat KB 3455811 'Connection unexpectedly closed by Cached Connection Manager Debug at the end of EJB call via remote interface'(IJ031040 · EAP 7.1) / EAP 7.3 Log Message Reference(IJ000100 'Closing a connection for you. Please close them yourself') / EAP 7.4 Configuration Guide 'Datasource Management'(cached-connection-manager)"
  stages:
  - stage: 1
    steps:
    - do: 같은 연결이 앞서 누수로 닫혔는지와 재사용 위치 확인 (읽기 전용)
      cmd: |
        grep -n -B5 -A20 'IJ031040' $JBOSS_HOME/standalone/log/server.log | head -80
        grep -n 'IJ000100' $JBOSS_HOME/standalone/log/server.log | tail -20
      check: "IJ031040(관리 연결과 연관되지 않음) 직전에 IJ000100(대신 닫음 — 누수 판정)이 같은 호출 흐름에 있으면 '원격 EJB 호출이 끝날 때 닫힌 연결을 바깥 트랜잭션이 다시 사용' 확정. 스택의 첫 업무 클래스 = 연결을 필드·세션에 보관하는 코드"
      note: "적용: EAP 7.x/8.0(IronJacamar 1.4+) · 권한: 로그 읽기 · 스택은 문맥째 본다"
    - do: 캐시 연결 관리자(CCM) 설정 확인
      cmd: |
        $JBOSS_HOME/bin/jboss-cli.sh -c "/subsystem=jca/cached-connection-manager=cached-connection-manager:read-resource"
      check: "debug=true 면 호출 종료 때 닫히지 않은 연결을 CCM 이 닫는다(IJ000100) — 그 연결을 다시 쓰면 IJ031040. debug=false 인데도 나오면 다른 경로(연결 핸들 직렬화·스레드 간 전달) 의심"
      note: "적용: EAP 7.x/8.0 · 권한: jboss-cli 관리 사용자(Monitor 이상) · 조회만"
  - stage: 2
    steps:
    - do: 연결 사용 범위 수정본 배포 (개발 담당)
      cmd: |
        cp -p /path/<app>.ear /path/<app>.ear.bak.$(date +%Y%m%d%H%M)
        $JBOSS_HOME/bin/jboss-cli.sh -c "deploy /path/<수정본 app>.ear --force"
      check: "성공: STATUS OK, 같은 업무 호출에서 IJ000100·IJ031040 미발생 · 실패: 오류 지속이면 보관본으로 deploy --force 롤백, 스택 위치를 다시 개발 담당에 전달"
      note: "사전조건: 개발 담당이 연결을 메서드 범위에서 얻고 finally 에서 닫도록(필드·세션·원격 호출 너머로 보관 금지) 고친 수정본을 시험 환경에서 검증 · 영향: 재배포 중 해당 앱 중단 · 승인: 서비스 담당·WAS 운영 담당 · 백업/롤백: 현재 배포본 .bak 보관, 실패 시 그 파일로 deploy --force · CCM debug 를 끄는 것은 누수 탐지를 끄는 것이므로 Red Hat 확인 없이 임시 우회로 쓰지 않는다"
      verify_note: "미검증 — KB 3455811 의 해결 원문(구독 필요)을 확인 못 함: CCM debug 해제가 공식 권고인지 미확인"
  - stage: 3
    steps:
    - do: Red Hat 케이스 자료
      cmd: |
        $JBOSS_HOME/bin/jdr.sh
        grep -n -B5 -A30 -E 'IJ031040|IJ000100' $JBOSS_HOME/standalone/log/server.log | tail -400 > ij031040_$(date +%Y%m%d).txt
      check: "JDR + IJ031040·IJ000100 문맥 + 호출 구조(원격 EJB 경계) 설명"
      note: "민감정보 마스킹: 스택·로그의 호스트명·IP·DB 계정·SQL 바인드 값·업무 데이터 가림 · 전달 승인: 보안 담당 승인 후 Red Hat 케이스에만"

- id: EAP-PROC-R7-SECNULL
  scope: id
  products: [jboss]
  category: internal
  match: [WFLYSEC0011]
  title: 보안 하위시스템 필수 인자 값이 null — security-domain 설정 누락·잘못된 참조 (WFLYSEC0011, JBoss EAP 7 레거시 보안)
  source: "Red Hat JBoss EAP 7.3 Log Message Reference(WFLYSEC0011 java.lang.IllegalArgumentException 'Argument %s is null' — 8.0 목록에는 없음) / EAP 7.4 'How to Configure Server Security'(legacy security subsystem security-domain)·Configuration Guide 'Configuration File History'(standalone_xml_history)"
  stages:
  - stage: 1
    steps:
    - do: null 인 필수 인자 이름과 호출한 보안 구성 요소 확인 (읽기 전용)
      cmd: |
        grep -n -B3 -A15 'WFLYSEC0011' $JBOSS_HOME/standalone/log/server.log | head -60
      check: "'Argument <이름> is null' 의 인자 이름과 스택의 org.jboss.as.security·login-module 클래스 기록 — 필수 인자 값이 null 인 설정 오류이며 사용자 로그인 실패(자격 증명 오류)가 아니다. 계정 재등록으로 해결되지 않는다"
      note: "적용: EAP 6/7 레거시 security 하위시스템(EAP 8 은 Elytron 만 — 이 메시지 없음) · 권한: 로그 읽기"
    - do: 앱이 참조하는 security-domain 이 정의돼 있는지 확인
      cmd: |
        $JBOSS_HOME/bin/jboss-cli.sh -c "/subsystem=security:read-children-names(child-type=security-domain)"
        unzip -p <path>/<app>.war WEB-INF/jboss-web.xml | grep -n -i 'security-domain'
        ls -lt $JBOSS_HOME/standalone/configuration/standalone_xml_history/ | head -5
      check: "jboss-web.xml(또는 jboss-ejb3.xml)의 security-domain 이 목록에 없거나 이름이 다르면 참조 오류 확정. 최근 설정 이력 파일 시각이 오류 시작과 맞으면 그 변경이 원인 후보"
      note: "적용: EAP 7.x · 권한: jboss-cli 관리 사용자(Monitor 이상)·배포 파일 읽기 · 설정 안 자격 증명은 기록하지 않음"
  - stage: 2
    steps:
    - do: 누락 security-domain 보완 또는 직전 정상 설정 복원 후 reload
      cmd: |
        $JBOSS_HOME/bin/jboss-cli.sh -c ":take-snapshot"
        $JBOSS_HOME/bin/jboss-cli.sh -c "/subsystem=security/security-domain=<도메인>:read-resource(recursive=true)"
        $JBOSS_HOME/bin/jboss-cli.sh -c ":reload"
      check: "성공: reload 후 WFLYSEC0011 미발생·해당 앱 로그인 정상 · 실패: 같은 null 인자 오류면 스냅샷으로 원복하고 정상 노드의 security-domain 정의와 항목별 대조"
      note: "사전조건: 정상 노드·설정 이력(standalone_xml_history)에서 빠진 도메인·login-module 옵션을 확인하고 보완 내용을 변경 기록에 남김(복원 방식은 서버 중지 상태에서 standalone.xml 교체 — EAP-PROC-INTERNAL 2차 3단계) · 영향: :reload 동안 전체 배포 중단, 보안 설정 변경은 모든 앱 인증에 영향 · 승인: 보안 담당·WAS 운영 담당 · 백업/롤백: :take-snapshot, 롤백은 스냅샷 파일로 복원 후 기동"
  - stage: 3
    steps:
    - do: Red Hat 케이스 자료
      cmd: |
        $JBOSS_HOME/bin/jdr.sh
      check: "JDR + WFLYSEC0011 스택 + 앱의 security-domain 참조"
      note: "민감정보 마스킹: JDR·설정의 login-module 옵션 비밀번호·LDAP bind 자격 증명·호스트명·IP·사용자 ID 가림 · 전달 승인: 보안 담당 승인 후 Red Hat 케이스에만"

- id: EAP-PROC-R7-STABILITY
  scope: id
  products: [jboss]
  category: performance
  match: [WFLYCTL0348, WFLYCTL0027]
  title: 서비스 컨테이너 안정화 대기 시간초과·안정화 전 작업 중단(재시작 필요) (JBoss EAP/WildFly)
  source: "Red Hat JBoss EAP 8.0 Log Message Reference(WFLYCTL0348 'Timeout after [%d] seconds waiting for service container stability. Operation will roll back'·WFLYCTL0349·WFLYCTL0027 'Process should be restarted') / Red Hat KB 1190323 'Configuring jboss.as.management.blocking.timeout in JBoss EAP 6/7'"
  stages:
  - stage: 1
    steps:
    - do: 대기 시간·처음 컨테이너를 바꾼 단계·주소 확인 (읽기 전용)
      cmd: |
        grep -n -E 'WFLYCTL0348|WFLYCTL0349|WFLYCTL0027' $JBOSS_HOME/standalone/log/server.log | tail -10
        $JBOSS_HOME/bin/jboss-cli.sh -c ":read-attribute(name=server-state)"
        $JBOSS_HOME/bin/jboss-cli.sh -c "deployment-info"
      check: "WFLYCTL0348(서비스 안정화 대기 시간초과)은 해당 관리 작업이 자동 롤백된 상태 — 서버는 계속 동작. WFLYCTL0349·WFLYCTL0027(안정화 전 작업 중단)은 메시지가 프로세스 재시작을 요구 — server-state 가 restart-required·reload-required 면 2차 재시작 대상"
      note: "적용: EAP 7.x/8.0·WildFly 10+ · 권한: 로그 읽기·jboss-cli 관리 사용자"
    - do: 어떤 서비스가 무엇을 기다리는지 스레드 덤프로 확인 (프로세스 유지)
      cmd: |
        for i in 1 2 3; do jcmd <PID> Thread.print > $JBOSS_HOME/standalone/log/td_ctl_$(date +%H%M%S)_$i.txt; sleep 10; done
        grep -l 'MSC service thread' $JBOSS_HOME/standalone/log/td_ctl_*.txt
        ps -ef | grep '[j]boss-modules' | grep -o -E 'jboss.as.management.blocking.timeout=[0-9]+'
      check: "MSC service thread 가 세 덤프 모두 JDBC 연결·소켓 읽기·외부 호출에서 멈춰 있으면 그 자원(DB·원격 서버) 지연이 원인. 시간 초과 값 표시가 없으면 기본 300초"
      note: "적용: JDK 8+ (jcmd 없으면 kill -3 <PID> — 스레드 덤프, 프로세스는 유지) · EAP 7.4.8+ 는 시간 초과 때 server.log 에 스레드 덤프를 자동 기록(KB 1190323) · 권한: EAP 실행 OS 계정"
  - stage: 2
    steps:
    - do: 막힌 자원 해소 후 작업 재실행, 정상적으로 긴 초기화면 대기 시간 상향
      cmd: |
        $JBOSS_HOME/bin/jboss-cli.sh -c ":take-snapshot"
        $JBOSS_HOME/bin/jboss-cli.sh -c "/system-property=jboss.as.management.blocking.timeout:add(value=600)"
      check: "성공: 같은 관리 작업(배포·설정 변경) 재실행 시 WFLYCTL0348 미발생·배포 STATUS OK · 실패: 600초 안에도 끝나지 않으면 대기 시간이 아니라 막힌 자원이 원인 — 값 원복 후 1차 스레드 덤프의 대기 지점(DB·원격) 담당에게 이관"
      note: "사전조건: 1차 스레드 덤프로 '느리지만 진행 중'임을 확인(교착·무한 대기면 시간만 늘리면 안 됨), DB·원격 자원 지연은 그 담당과 먼저 해소 · 영향: 시간 초과가 늘면 실패 판정도 늦어진다 · 승인: WAS 운영 담당 · 백업/롤백: :take-snapshot, 롤백은 /system-property=jboss.as.management.blocking.timeout:remove · 적용: EAP 6/7 standalone(도메인 모드는 서버별 지정 — KB 1190323), 기동 중 시간 초과면 standalone.conf JAVA_OPTS 의 -D 로 지정"
    - do: 재시작이 필요하다고 기록된 경우(WFLYCTL0027·WFLYCTL0349) 프로세스 재시작
      cmd: |
        $JBOSS_HOME/bin/jboss-cli.sh -c ":shutdown(restart=true)"
        $JBOSS_HOME/bin/jboss-cli.sh -c ":read-attribute(name=server-state)"
      check: "성공: WFLYSRV0025 기동 완료·server-state running·배포 STATUS OK · 실패: 기동 중 같은 서비스에서 다시 멈추면 1차 스레드 덤프의 자원부터 해소하고 3차 의뢰"
      note: "사전조건: 1차 스레드 덤프·로그 확보, 클러스터면 한 노드씩·다른 노드가 부하를 받을 수 있는지 확인, 업무 영향 적은 시간 · 영향: 재시작 동안 해당 노드 서비스 중단·세션 소실 · 승인: 서비스 담당·WAS 운영 담당 · 백업/롤백: 재시작 전 :take-snapshot, 기동 실패 시 EAP-PROC-INTERNAL 2차 '설정 이력 복원' · 적용: EAP 7.x/8.0"
  - stage: 3
    steps:
    - do: Red Hat 케이스 자료
      cmd: |
        $JBOSS_HOME/bin/jdr.sh
        tar czf ctl_td_$(date +%Y%m%d).tgz $JBOSS_HOME/standalone/log/td_ctl_*.txt
      check: "JDR + 스레드 덤프 3회 + 시간 초과 시각의 관리 작업 내용"
      note: "민감정보 마스킹: 스레드 덤프 안 SQL 문자열·호스트명·IP·계정·업무 데이터 가림 · 전달 승인: 보안 담당 승인 후 Red Hat 케이스에만"

- id: JEUS-PROC-R7-APPID
  scope: id
  products: [jeus]
  category: internal
  match: [DEPLOY-0005]
  title: 애플리케이션 ID 중복 — 저장소 파일명과 도메인 등록 ID 충돌 (DEPLOY-0005, JEUS)
  source: "TmaxSoft JEUS 8.6/9/21 Deployment Guide '도메인 환경에서 애플리케이션 관리'(애플리케이션 ID 는 도메인에서 유일·미지정 시 파일 이름의 '.' 을 '_' 로 바꿔 사용, install-application -id·-f) / JEUS 7 Fix#4 Release Note(상위 1단계 디렉터리 이름으로 중복 회피) / JEUS Reference 'jeusadmin application-info'"
  stages:
  - stage: 1
    steps:
    - do: 중복된 애플리케이션 ID 와 저장소 파일명 확인 (읽기 전용)
      cmd: |
        grep -n -B2 -A3 'DEPLOY-0005' <SERVER_HOME>/logs/JeusServer.log | tail -20
        $JEUS_HOME/bin/jeusadmin -host <host>:<base_port> -u <user> 'application-info'
      check: "로그의 ID 가 application-info 의 등록 ID 목록에 이미 있으면 애플리케이션 ID 중복 확정. 같은 ID 로 앱 정보 요청·MASTER 기동 때도 같은 로그가 남으므로 처음 발생 시각과 직전 설치 작업을 대조"
      note: "적용: JEUS 7/8/9/21 도메인 구조(SERVER_HOME=$JEUS_HOME/domains/<domain>/servers/<server>, MASTER 쪽 로그도 확인) · 권한: JEUS 실행 계정·JEUS 관리자(조회) · 비밀번호는 -p 생략 후 프롬프트"
    - do: 저장소 파일명과 기본 ID 규칙 대조
      cmd: |
        ls -l <repository경로>/
      check: "ID 를 지정하지 않으면 파일 이름의 '.' 을 '_' 로 바꾼 값이 ID(myApp.ear → myApp_ear) — 다른 경로의 같은 이름 파일이나 이미 등록된 앱과 같은 파일명이면 충돌. 같은 앱의 새 판을 올리려던 것인지, 다른 앱이 같은 이름인지 구분해 2차에 전달(추가 설치 시도는 보류)"
      note: "적용: JEUS 7+(JEUS 7 Fix#4 이후는 상위 1단계 디렉터리 이름을 붙여 회피 — 그 디렉터리까지 같으면 여전히 중복) · 권한: JEUS 실행 계정"
  - stage: 2
    steps:
    - do: 다른 앱이면 고유 ID 로 설치, 같은 앱의 새 판이면 기존 ID 를 덮어쓰기
      cmd: |
        $JEUS_HOME/bin/jeusadmin -host <host>:<base_port> -u <user> 'install-application -id <고유ID> <path>/<app>.war'
        $JEUS_HOME/bin/jeusadmin -host <host>:<base_port> -u <user> 'application-info'
      check: "성공: application-info 에 새 ID 가 등록되고 DEPLOY-0005 미발생, 배포 후 상태 RUNNING · 실패: 같은 오류면 저장소의 동명 파일·디렉터리 이름 재확인, 덮어쓰기(-f)로 잘못된 앱을 바꿨다면 보관한 직전 판으로 다시 설치"
      note: "같은 앱의 새 판이면 -f(같은 ID 덮어쓰기) 를 쓰되 직전 판 파일을 먼저 보관 · 사전조건: 업무 담당과 '새 앱인지·기존 앱 교체인지' 확정, 배포본 파일명·ID 규칙 합의 · 영향: 덮어쓰기는 기존 앱 교체(재배포 동안 서비스 중단·세션 유실) · 승인: WAS 담당·애플리케이션 담당·변경 관리 · 백업/롤백: 기존 등록 앱의 배포 파일을 날짜 붙여 보관, 실패 시 그 파일로 다시 설치·배포"
      verify_note: "미검증 — install-application 의 -id·-f 옵션 위치와 철자를 JEUS 판별(7/8/9/21) 원문 페이지로 확인 못 함(TmaxSoft 문서 사이트 접속 불가 — 검색 요약으로만 확인)"
  - stage: 3
    steps:
    - do: TmaxSoft 기술지원 의뢰 자료
      cmd: |
        grep -n -B5 -A10 'DEPLOY-0005' <SERVER_HOME>/logs/JeusServer.log > deploy0005_$(date +%Y%m%d).txt
        ls -lR <repository경로>/ > repo_ls_$(date +%Y%m%d).txt ; cat $JEUS_HOME/version.txt 2>/dev/null
      check: "DEPLOY-0005 문맥·저장소 목록·application-info 결과·JEUS 판(Fix)"
      note: "민감정보 마스킹: 호스트명·IP·관리 계정·저장소 경로 안 고객사 이름 가림 · 전달 승인: 보안 담당 승인 후 TmaxSoft 에 반출"

- id: WLS-PROC-R7-RESPWRITE
  scope: id
  products: [weblogic]
  category: connection
  match: [BEA-101083]
  title: HTTP 응답 스트림 쓰기 실패 — 응답을 쓰는 중 연결이 끊김 (BEA-101083, WebLogic)
  source: "Oracle FMW 12.2.1.4 Error Messages(BEA-101083 'Connection failure' — Cause: The connection failed while writing data into the stream·BEA-101019) / Oracle WebLogic Server Proxy Plug-In 12.2.1 'Parameters for Web Server Plug-Ins'(WLIOTimeoutSecs·WLSocketTimeoutSecs)"
  stages:
  - stage: 1
    steps:
    - do: 예외 문구·시각·빈도 확인 (읽기 전용)
      cmd: |
        grep -n -A15 'BEA-101083' $DOMAIN_HOME/servers/<server>/logs/<server>.log | head -60
        grep -E 'BEA-101083|BEA-101019' $DOMAIN_HOME/servers/<server>/logs/<server>.log | cut -c1-30 | sort | uniq -c | tail -24
      check: "HTTP 응답 스트림 쓰기 실패의 Caused by 가 Broken pipe·Connection reset 이면 받는 쪽(브라우저·웹서버 플러그인·LB)이 먼저 연결을 닫은 것. 산발이면 사용자 취소(장애 아님), 특정 시간대·URI 에 몰리면 응답 지연이나 앞단 시간 초과"
      note: "적용: WebLogic 10.3.6/12c/14c · 권한: 도메인 로그 읽기"
    - do: 같은 시각 처리 시간과 앞단 시간 초과 값 비교
      cmd: |
        grep '<요청 URI>' $DOMAIN_HOME/servers/<server>/logs/access.log | tail -20
        grep -n -i -E 'WLIOTimeoutSecs|WLSocketTimeoutSecs' <웹서버 플러그인 설정 파일>
      check: "접근 로그에 time-taken 칸이 있으면(확장 형식) 처리 시간이 앞단 WLIOTimeoutSecs(지정 없으면 기본값 — 판별 문서 확인)·LB 유휴 시간에 닿는 요청이 원인. 처리 시간이 짧은데 끊기면 클라이언트 쪽 중단"
      note: "적용: WebLogic 10.3.6/12c/14c, 앞단 OHS·Apache·iPlanet 플러그인(<웹서버 플러그인 설정 파일> 은 mod_wl_ohs.conf·httpd.conf 등 실제 경로) · 기본 접근 로그(common)에는 처리 시간이 없음 · 권한: 로그·설정 읽기"
  - stage: 2
    steps:
    - do: 앞단 시간 초과를 업무 최장 처리 시간에 맞춤 (정상적으로 긴 업무만)
      cmd: |
        cp -p <웹서버 플러그인 설정 파일> <웹서버 플러그인 설정 파일>.bak.$(date +%Y%m%d%H%M)
      config:
        file: 웹서버 플러그인 설정(<Location>·<IfModule mod_weblogic.c> 블록) · LB 유휴 시간 초과
        snippet: |
          WLIOTimeoutSecs <업무 최장 처리 시간보다 긴 초>
        note: "사전조건/승인/백업은 아래 note 와 같음"
      check: "성공: 웹서버 반영 후 같은 URI 의 BEA-101083 이 평소 수준으로 감소·응답 정상 · 실패: 오류 지속이거나 연결 점유 증가 → .bak 복원 후 느린 URI 처리 개선(개발 담당)으로 전환"
      note: "사전조건: 느린 URI·업무 최장 정상 처리 시간을 업무 담당과 확인, 느린 원인이 DB·연동이면 그 해소가 우선 · 영향: 웹서버 재기동(또는 graceful 반영) 필요, 시간 초과를 늘리면 연결 점유 증가 · 승인: 웹서버 담당·WAS 담당·변경관리 · 백업/롤백: 첫 줄의 .bak 으로 복원 후 웹서버 재반영"
  - stage: 3
    steps:
    - do: Oracle SR 자료
      cmd: |
        grep -n -A20 -E 'BEA-101083|BEA-101019' $DOMAIN_HOME/servers/<server>/logs/<server>.log | tail -400 > wls_respwrite_$(date +%Y%m%d).txt
        java weblogic.version 2>/dev/null | head -3
      check: "오류 문맥·접근 로그 발췌·플러그인 설정·WLS 판"
      note: "민감정보 마스킹: 접근 로그의 클라이언트 IP·URL 쿼리 문자열(토큰·세션 ID)·사용자 ID, 호스트명 가림 · 전달 승인: 보안 담당 승인 후 Oracle SR 에만"

- id: WLS-PROC-R7-DEPLOY
  scope: id
  products: [weblogic]
  category: internal
  match: [BEA-101220, BEA-160197]
  title: 웹앱 배포 실패 — 모듈 디스크립터 로드 실패·웹앱 문서루트 설정 실패 (WebLogic)
  source: "Oracle FMW 12.2.1.4 Error Messages(BEA-160197 'Unable to load descriptor {1} of module {0}' — Action: Correct the descriptor·BEA-101220 'An error occurred while setting the document root' — Check the IOException message) / 'Deploying Applications to Oracle WebLogic Server'(weblogic.Deployer -userconfigfile)·'appc Reference'"
  stages:
  - stage: 1
    steps:
    - do: 모듈·디스크립터 이름과 파싱 오류 위치, 문서루트 경로·IOException 확인 (읽기 전용)
      cmd: |
        grep -n -A20 -E 'BEA-160197|BEA-101220' $DOMAIN_HOME/servers/<server>/logs/<server>.log | head -60
      check: "모듈 디스크립터 로드 실패(BEA-160197)는 디스크립터 파일 이름과 오류(줄·요소·스키마) 기록, 웹앱 문서루트 설정 실패(BEA-101220)는 웹앱 이름·경로·IOException(없음·권한 거부·공간 부족) 기록 — 두 경우 모두 해당 웹앱은 배포되지 않은 상태"
      note: "적용: WebLogic 10.3.6/12c/14c · 권한: 도메인 로그 읽기"
    - do: 디스크립터 문법 확인 (배포본은 읽기만)
      cmd: |
        unzip -p <path>/<app>.war WEB-INF/weblogic.xml | xmllint --noout -
        unzip -p <path>/<app>.war WEB-INF/web.xml | xmllint --noout -
      check: "xmllint 가 오류 줄을 내면 디스크립터 문법 오류 확정. 문법이 맞는데 BEA-160197 이면 스키마 버전·요소 이름이 서버 판과 맞지 않는 것(로그의 요소 이름 기준)"
      note: "적용: Linux(libxml2 xmllint) — 문법(well-formed)만 검사하고 스키마 검사는 하지 않음 · ear 면 unzip -l 로 안쪽 모듈 경로 확인 · 권한: 배포 파일 읽기"
    - do: 문서루트·임시 경로의 존재·권한·공간 확인 (BEA-101220)
      cmd: |
        ls -ld <path> <path>/<app>.war
        df -h $DOMAIN_HOME/servers/<server>/tmp $DOMAIN_HOME/servers/<server>/stage 2>/dev/null
        ps -o user= -p <PID>
      check: "경로가 없거나 WebLogic 실행 계정이 읽을 수 없거나 tmp·stage 사용률 95% 이상이면 원인 확정"
      note: "적용: Linux · 권한: 일반 사용자 · 정리·권한 변경은 2차"
  - stage: 2
    steps:
    - do: 디스크립터 수정본 검증 후 재배포 (직전 정상본 보관)
      cmd: |
        java weblogic.appc -output /tmp/<app>_appc_check.war <path>/<수정본 app>.war
        java weblogic.Deployer -adminurl t3://<admin_host>:<admin_port> -userconfigfile <UCF> -userkeyfile <UKF> -deploy -name <app> -source <path>/<수정본 app>.war -targets <server>
      check: "성공: appc 가 오류 없이 끝나고 배포 후 BEA-160197 미발생·-listapps 에 <app> 활성 · 실패: appc 오류면 배포하지 않고 개발 담당에 반환, 배포 실패면 보관한 직전 정상본으로 같은 -deploy(롤백)"
      note: "appc 는 -output 으로 별도 파일에 써서 원본 배포본을 바꾸지 않는다 · 사전조건: 직전 정상 배포본 보관, '. setDomainEnv.sh' 를 읽은 셸 · 영향: 재배포 동안 해당 앱 중단·세션 소실 · 승인: 서비스 담당·WAS 운영 담당 · 백업/롤백: 직전 정상본으로 -deploy 재실행 · 주의: -username/-password 는 쓰지 않는다(userconfigfile/userkeyfile 은 WLST storeUserConfig 로 만든 권한 600 파일) · 적용: 10.3.6/12c/14c"
    - do: 문서루트 경로·권한·공간 바로잡은 뒤 재배포 (BEA-101220)
      cmd: |
        ls -ld <path> > /tmp/<app>_perm_before_$(date +%Y%m%d%H%M).txt
        chown -R <weblogic_user>:<weblogic_group> <path>
        java weblogic.Deployer -adminurl t3://<admin_host>:<admin_port> -userconfigfile <UCF> -userkeyfile <UKF> -redeploy -name <app>
      check: "성공: BEA-101220 미발생·앱 활성 · 실패: IOException 지속이면 상위 디렉터리 권한·SELinux·공간(tmp·stage) 재확인, 권한은 기록본대로 원복"
      note: "사전조건: 경로가 다른 시스템과 공유되는지 확인(공유면 소유자 변경 대신 그룹 권한), 공간 부족이면 오래된 tmp 정리는 서버 중지 상태에서만 · 영향: 재배포 동안 앱 중단 · 승인: WAS 운영 담당·시스템 담당 · 백업/롤백: 변경 전 ls -ld 결과를 파일로 보관(첫 줄), 원복은 기록된 소유자로 chown · 적용: Linux, 10.3.6/12c/14c"
  - stage: 3
    steps:
    - do: Oracle SR 자료
      cmd: |
        grep -n -A30 -E 'BEA-160197|BEA-101220' $DOMAIN_HOME/servers/<server>/logs/<server>.log | tail -300 > wls_deploy_$(date +%Y%m%d).txt
        java weblogic.version 2>/dev/null | head -3
      check: "오류 문맥 + 해당 디스크립터(weblogic.xml·web.xml, 내용 확인 후) + WLS 판·PSU"
      note: "민감정보 마스킹: 디스크립터의 자격 증명·JNDI 이름 안 고객사 정보·호스트명·IP 가림, 배포본 자체는 보내지 않음 · 전달 승인: 보안 담당 승인 후 Oracle SR 에만"

- id: WSP-PROC-R7-DSRA
  scope: id
  products: [websphere]
  category: upstream
  match: [DSRA0010E, DSRA0080E]
  title: DB 오류 보고 — SQL상태·오류코드·Data Store Adapter 예외로 원인 계열 분기 (DSRA0010E·DSRA0080E, WebSphere)
  source: "IBM WebSphere Application Server 8.5.5 메시지 참조 DSRA(DSRA0010E 'SQL State = {0}, Error Code = {1}' — Use the information associated with the error code·DSRA0080E 'An exception was received by the Data Store Adapter' — Refer to the error text reported by the database software) / 'Configuring J2C authentication data'·'Test connection service'"
  stages:
  - stage: 1
    steps:
    - do: SQL상태·DB 오류코드·원본 DB 예외 확인 (읽기 전용)
      cmd: |
        grep -n -B2 -A8 -E 'DSRA0010E|DSRA0080E' <PROFILE_ROOT>/logs/<server>/SystemOut.log | tail -60
        grep -E 'DSRA0010E|DSRA0080E' <PROFILE_ROOT>/logs/<server>/SystemOut.log | cut -c1-25 | sort | uniq -c | tail -24
      check: "DB SQL상태·오류코드 보고(DSRA0010E)와 Data Store Adapter 예외 수신(DSRA0080E)의 원본 메시지로 분기 — SQLState 08xxx=연결, 28xxx=인증(ORA-01017·계정 잠김), 40xxx=트랜잭션 롤백(교착), 22xxx·23xxx·42xxx=데이터·제약·SQL 오류(개발 담당). 특정 시각 집중이면 DB 측 사건과 대조"
      note: "적용: WAS 8.5.5/9.0 · 권한: 로그 읽기 · SQL 바인드 값·업무 데이터는 기록 시 가림"
    - do: 연결 계열이면 DB 도달성·풀 단절 동반 여부 확인
      cmd: |
        nc -zvw3 <DB_HOST> <DB_PORT>
        grep -n -E 'J2CA0045E|StaleConnectionException' <PROFILE_ROOT>/logs/<server>/SystemOut.log | tail -20
      check: "nc 실패면 DB·네트워크 원인(DB·네트워크 담당), StaleConnection 동반이면 DB 재기동·방화벽 유휴 끊김 후 남은 불량 연결 — 풀 정리는 2차(WAS-PROC-CONNECTION). 연결 정상이면 SQL·데이터 계열"
      note: "적용: Linux · nc 는 TCP 연결만 열고 닫음(DB 로그인 없음) · 권한: 일반 사용자"
  - stage: 2
    steps:
    - do: 인증 계열(SQLState 28xxx)이면 J2C 인증 별칭 비밀번호를 DB 계정과 맞추고 연결 시험
      config:
        file: 관리 콘솔 › Security › Global security › Java Authentication and Authorization Service › J2C authentication data › <별칭>
        snippet: |
          비밀번호 칸만 DB 담당이 바꾼 값으로 갱신(화면 입력 — 명령줄·스크립트에 쓰지 않음) → Save
          Resources › JDBC › Data sources › <DS> › Test connection 으로 확인
        note: "사전조건/승인/백업은 아래 note 와 같음"
      cmd: |
        <PROFILE_ROOT>/bin/backupConfig.sh /tmp/wasconfig_$(date +%Y%m%d).zip -nostop
      check: "성공: Test connection 성공 메시지, 이후 DSRA0010E(28xxx) 미발생 · 실패: 여전히 인증 오류면 DB 계정 잠김·만료(DB 담당), 저장 내용이 잘못됐으면 backupConfig zip 으로 restoreConfig"
      note: "사전조건: DB 담당이 계정 상태(잠김·만료·비밀번호 변경)를 확인하고 새 비밀번호를 안전한 경로로 전달 · 영향: 저장 후 새 연결부터 적용, 기존 풀 연결은 정리 전까지 유지 · 승인: WAS 운영 담당·DBA·보안 담당 · 백업/롤백: backupConfig.sh -nostop zip(cmd), 롤백은 restoreConfig.sh <zip> · 적용: WAS 8.5.5/9.0 (ND 는 저장 후 노드 동기화)"
    - do: 데이터·제약·SQL 계열(22·23·42xxx)이면 개발 담당 이관 — 인프라 조치 없음
      check: "판단: 같은 SQL·같은 오류 코드가 반복되고 DB·연결은 정상 → 업무 클래스·SQL 문장(바인드 값 가림)을 개발 담당에 전달. 연결 계열(08xxx)은 DB 복구 확인 후 WAS-PROC-CONNECTION 2차 풀 정리"
      note: "설정 변경 없음 · 전달 자료는 3차와 같은 마스킹 기준"
  - stage: 3
    steps:
    - do: IBM Support·DB 담당 전달 자료
      cmd: |
        grep -n -B2 -A20 -E 'DSRA0010E|DSRA0080E' <PROFILE_ROOT>/logs/<server>/SystemOut.log | tail -400 > was_dsra_$(date +%Y%m%d).txt
        ls -lt <PROFILE_ROOT>/logs/ffdc/ | head -10 ; <WAS_HOME>/bin/versionInfo.sh | head -20
      check: "오류 문맥(SQLState·오류 코드)·같은 시각 ffdc·WAS 판·JDBC 드라이버 판·DB 판"
      note: "민감정보 마스킹: SQL 문장의 바인드 값·업무 데이터·DB 계정·호스트명·IP·JDBC URL 가림 · 전달 승인: 보안 담당·DBA 승인 후 IBM 케이스(ECuRep)·DB 담당에게만"

- id: WSP-PROC-R7-NOTX
  scope: id
  products: [websphere]
  category: undo
  match: [J2CA0075W]
  title: 활성 트랜잭션 필요 경고 — 트랜잭션 없이 연결 사용(비관리 스레드·트랜잭션 속성) (J2CA0075W, WebSphere)
  source: "IBM WebSphere Application Server 8.5.5 메시지 참조 J2CA(J2CA0075W 'An active transaction should be present while processing method {0}' — Action: Start any transactions that are required to successfully use the connection) / 'Concurrency utilities — managed executors·work managers'"
  stages:
  - stage: 1
    steps:
    - do: 연결을 요청한 메서드·호출 스택 확인 (읽기 전용)
      cmd: |
        grep -n -B5 -A20 'J2CA0075W' <PROFILE_ROOT>/logs/<server>/SystemOut.log | head -80
        grep -c 'J2CA0075W' <PROFILE_ROOT>/logs/<server>/SystemOut.log
      check: "활성 트랜잭션 필요 경고의 {0} 메서드와 스택 첫 업무 클래스 기록. 스택에 웹 컨테이너(com.ibm.ws.webcontainer)·EJB 컨테이너(com.ibm.ejs.container) 프레임 없이 java.lang.Thread.run·java.util.TimerThread 에서 시작하면 앱이 직접 만든 비관리 스레드 — 원인 확정"
      note: "적용: WAS 8.5.5/9.0 · 권한: 로그 읽기 · 스택은 문맥째 본다"
    - do: 같은 시각 연결·트랜잭션 오류 동반 여부 확인
      cmd: |
        grep -n -E 'J2CA0075W|J2CA0045E|WTRN0|DSRA' <PROFILE_ROOT>/logs/<server>/SystemOut.log | tail -30
      check: "경고만 반복되고 업무 오류·풀 고갈이 없으면 코드 수정 대상(긴급 아님). 같은 스레드에서 J2CA0045E·WTRN 오류가 이어지면 연결 미반환·트랜잭션 오류로 번진 것 → WAS-PROC-CONNECTION·WSP-PROC-R5-UNDO 함께 확인"
      note: "적용: WAS 8.5.5/9.0 · 권한: 로그 읽기"
  - stage: 2
    steps:
    - do: 트랜잭션 경계·관리 스레드 사용으로 고친 수정본 배포 (개발 담당)
      cmd: |
        <PROFILE_ROOT>/bin/backupConfig.sh /tmp/wasconfig_$(date +%Y%m%d).zip -nostop
        <PROFILE_ROOT>/bin/wsadmin.sh -lang jython -c "AdminApp.update('<app>','app',['-operation','update','-contents','/path/<수정본 app>.ear']); AdminConfig.save()"
      check: "성공: 앱 Started·J2CA0075W 미발생·업무 정상 · 실패: 시작 오류·업무 오류면 직전 ear 로 같은 AdminApp.update(롤백)"
      note: "사전조건: 개발 담당이 비관리 스레드 대신 관리 스레드(WorkManager·ManagedExecutorService)를 쓰거나 UserTransaction·컨테이너 트랜잭션 안에서 연결을 쓰도록 고친 수정본을 시험 환경에서 검증, 직전 정상 ear 보관 · 영향: update 동안 앱 재시작·세션 소실 · 승인: 서비스 담당·WAS 운영 담당 · 백업/롤백: backupConfig zip·직전 ear, 실패 시 직전 ear 로 update · 자격 증명은 soap.client.props 또는 프롬프트(명령줄 금지) · 적용: WAS 8.5.5/9.0 (ND 는 저장 후 노드 동기화)"
  - stage: 3
    steps:
    - do: IBM Support·개발 담당 전달 자료
      cmd: |
        grep -n -B5 -A30 'J2CA0075W' <PROFILE_ROOT>/logs/<server>/SystemOut.log | tail -300 > was_j2ca0075w_$(date +%Y%m%d).txt
      check: "경고 문맥(메서드·스택)·발생 빈도·앱 판"
      note: "민감정보 마스킹: 스택·로그의 호스트명·IP·사용자 ID·업무 데이터 가림 · 전달 승인: 보안 담당 승인 후 IBM 케이스(ECuRep)·개발 담당에게만"

- id: WSP-PROC-R7-AUTHZ
  scope: id
  products: [websphere]
  category: security
  match: [SECJ0053E]
  title: 권한 부족 — 보안 역할 미매핑·그룹 미소속·LDAP 필터 불일치로 인가 실패 (SECJ0053E, WebSphere)
  source: "IBM WebSphere Application Server 8.5.5 메시지 참조 SECJ(SECJ0053E 'Authorization failed for {0} while invoking ({1}){2} {3} {4}' — 역할 미매핑·그룹 미소속·LDAP user/group filter 불일치) / 'Assigning users and groups to roles'(Security role to user/group mapping — 저장 후 앱 중지·시작)"
  stages:
  - stage: 1
    steps:
    - do: 인가 실패 사용자·대상 메서드 확인 (읽기 전용)
      cmd: |
        grep -n 'SECJ0053E' <PROFILE_ROOT>/logs/<server>/SystemOut.log <PROFILE_ROOT>/logs/<server>/SystemErr.log | tail -20
      check: "권한 부족의 {0} 이 /UNAUTHENTICATED 면 인증 정보가 전달되지 않은 것(LTPA 만료·SSO·보안 미적용 호출) → WSP-PROC-R6-AUTH·WAS-PROC-SECURITY. 특정 사용자면 역할 매핑·그룹 소속 문제. 원래 접근하면 안 되는 사용자면 정상 거부"
      note: "적용: WAS 8.5.5/9.0(애플리케이션 보안 사용 시) · 권한: 로그 읽기 · 사용자 ID 는 기록 시 가림"
    - do: 앱의 역할 매핑과 LDAP 필터 확인
      cmd: |
        grep -n -i -A4 'security-role' <PROFILE_ROOT>/config/cells/<cell>/applications/<app>.ear/deployments/<app>/META-INF/ibm-application-bnd.xm*
        grep -n -i -E 'userFilter|groupFilter' <PROFILE_ROOT>/config/cells/<cell>/security.xml | head -5
      check: "보호 역할에 그 사용자·그 사용자가 속한 그룹이 매핑돼 있지 않으면 미매핑 확정. 매핑된 그룹에 속하는데 실패하면 LDAP user/group 필터가 디렉터리 구조와 맞지 않을 가능성 — LDAP 담당과 소속 확인"
      note: "적용: WAS 8.5.5/9.0 구성 저장소 구조(바인딩 파일은 판·패키징에 따라 .xmi 또는 .xml) · 권한: WAS 실행 계정(config 읽기) · security.xml 의 비밀번호 칸은 보지 않는다"
  - stage: 2
    steps:
    - do: 필요한 역할 매핑 추가 후 앱 재시작
      cmd: |
        <PROFILE_ROOT>/bin/backupConfig.sh /tmp/wasconfig_$(date +%Y%m%d).zip -nostop
      config:
        file: 관리 콘솔 › Applications › Application Types › WebSphere enterprise applications › <app> › Security role to user/group mapping
        snippet: |
          역할 선택 → Map users / Map groups 로 레지스트리에서 대상 그룹(개인보다 그룹 권장) 추가 → OK → Save
          저장 후 해당 앱 중지·시작(IBM 문서: 매핑 변경은 앱 재시작 후 적용)
        note: "사전조건/승인/백업은 아래 note 와 같음"
      check: "성공: 앱 재시작 후 같은 사용자 요청에 SECJ0053E 미발생·업무 정상 · 실패: 여전히 실패면 LDAP 필터·그룹 소속(LDAP 담당) 재확인, 잘못 매핑했으면 backupConfig zip 으로 restoreConfig 또는 매핑 제거 후 저장"
      note: "사전조건: 업무 담당·보안 담당이 '그 사용자에게 이 역할 권한이 필요함'을 승인(권한 부여는 보안 변경), 1차 결과(사용자·역할·메서드) 기록 · 영향: 앱 중지~시작 동안 서비스 중단·세션 소실, 그룹 매핑은 그룹 전원에게 권한 부여 · 승인: 보안 담당·서비스 담당·WAS 운영 담당 · 백업/롤백: backupConfig.sh -nostop zip(cmd), 롤백은 매핑 제거 후 저장·앱 재시작 또는 restoreConfig.sh <zip> · 적용: WAS 8.5.5/9.0 (ND 는 저장 후 노드 동기화)"
  - stage: 3
    steps:
    - do: IBM Support 자료
      cmd: |
        grep -n -B2 -A10 'SECJ0053E' <PROFILE_ROOT>/logs/<server>/SystemOut.log <PROFILE_ROOT>/logs/<server>/SystemErr.log | tail -200 > was_secj0053e_$(date +%Y%m%d).txt
      check: "SECJ0053E 문맥·앱 역할 매핑(바인딩 파일 내용 확인 후)·사용자 레지스트리 종류·WAS 판"
      note: "민감정보 마스킹: 사용자 ID·그룹 DN·LDAP 호스트·bind DN·호스트명·IP 가림, security.xml 원본은 보내지 않음 · 전달 승인: 보안 담당 승인 후 IBM 케이스(ECuRep)에만"
