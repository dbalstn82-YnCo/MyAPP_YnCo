# WEB 계층 제품 버전 카탈로그 — 코드 조회 › 제품 › [버전] 탭 (검증 2026-09-11, Claude 웹 대조 + GPT 교차 수집)
products:
  apache:
    title: Apache HTTP Server 버전별 수명주기·로그 형식
    updated: '2026-09-11'
    note: 'AH##### 오류 코드는 2.4 에서 도입. 1.3/2.0/2.2 는 ''[날짜] [level] [client ip] 문구'' 형식이며 파서가 두 형식을 모두 읽고 2.2 문구는 별칭으로 AH 코드에 대응한다. 2.2 이하 EOS 이지만 현장 잔존. GPT 교차(collect/verify/resp_web_versions_2026-09-11.txt): 2.4 에서 404 ''File does not exist'' 가 error→info
      로 하향.'
    columns:
    - version
    - released
    - support_end
    - latest
    - errorlog_format
    - code_scheme
    - access_log
    - source
    labels:
      version: 버전
      released: 출시
      support_end: 지원 종료
      latest: 최종 릴리스
      errorlog_format: 오류 로그 형식
      code_scheme: 코드 체계
      access_log: 접근 로그
      source: 출처
    versions:
    - version: '1.3'
      released: '1998-06-01'
      support_end: '2010-02-03'
      latest: 1.3.42
      errorlog_format: '[Wed Oct 11 14:32:52 2000] [error] [client ip] msg'
      code_scheme: 없음(문구)
      access_log: CLF/combined
      source: https://endoflife.date/apache-http-server
    - version: '2.0'
      released: '2002-04-05'
      support_end: '2013-07-10'
      latest: 2.0.65
      errorlog_format: '[날짜] [level] [client ip] msg'
      code_scheme: 없음(문구)
      access_log: CLF/combined
      source: https://endoflife.date/apache-http-server
    - version: '2.2'
      released: '2005-12-01'
      support_end: 2017-07-11 (2.2.34 최종) — 보안 패치 2017-12 종료
      latest: 2.2.34
      errorlog_format: '[Wed Oct 11 14:32:52 2000] [error] [client 127.0.0.1] client denied by server configuration: …'
      code_scheme: 없음(문구) → 별칭으로 AH 코드 대응
      access_log: CLF/combined
      source: https://endoflife.date/apache-http-server ; https://httpd.apache.org/docs/2.2/logs.html
    - version: '2.4'
      released: '2012-02-21'
      support_end: 지원 중 (2.4.68, 2026-06-08)
      latest: 2.4.68
      errorlog_format: '[Fri Sep 09 10:42:29.902022 2011] [core:error] [pid 35708:tid 4328636416] [client 72.15.99.187] AH00124: Request exceeded …'
      code_scheme: AH##### (모듈별 고유 코드)
      access_log: CLF/combined (+ %{ms}T 등 2.4 확장)
      source: https://endoflife.date/apache-http-server ; https://httpd.apache.org/docs/2.4/logs.html
  nginx:
    title: nginx 버전별 수명주기·로그 형식
    updated: '2026-09-11'
    note: '매년 4월 mainline 에서 stable 을 분기하고 이전 stable 은 종료(약 1년 지원). 오류 로그 형식과 주요 메시지 문구는 0.7 이후 변하지 않아 코드 사전은 전 버전 공통. 배포판 동봉 버전(RHEL 8: 1.14, RHEL 9: 1.20, Ubuntu 22.04: 1.18, 24.04: 1.24)은 배포판 EOS 를 따른다.'
    columns:
