product: iis
layer: web
title: iis 로그 종류 카탈로그 (GPT 수집 — 벤더 문서 대조 필요)
source: GPT 수집(벤더 문서 대조 필요)
sources: []
logtypes:
- name: 사이트 W3C 로그
  path: '%SystemDrive%\inetpub\logs\LogFiles\W3SVC<SiteID>\'
  format: W3C 텍스트·UTC YYYY-MM-DD HH:mm:ss
  check: sc-status·sc-substatus·sc-win32-status·time-taken·URI
  sample: 2026-09-09 03:00:00 10.0.0.1 GET / - 443 - 10.0.0.2 HTTP/1.1 200 0 0 15
- name: Central W3C 로그
  path: '%SystemDrive%\inetpub\logs\LogFiles'
  format: W3C 텍스트·UTC YYYY-MM-DD HH:mm:ss
  check: 다중 사이트 SiteName·HTTP 상태·Win32Status·TimeTaken
  sample: 2026-09-09 03:00:00 W3SVC1 10.0.0.1 GET / 200 ...
- name: Central Binary 로그
  path: '%SystemDrive%\inetpub\logs\LogFiles'
  format: Microsoft binary log·시간 레코드
  check: 대규모 중앙 로깅·LogParser 분석·site/request 오류
  sample: Microsoft central binary record
- name: HTTPERR 로그
  path: '%SystemRoot%\System32\LogFiles\HTTPERR\httperr<seq>.log'
  format: W3C 계열 텍스트·UTC timestamp
  check: HTTP.sys 거부·Connection_Dropped·Timer_*·RequestLength·503 queue
  sample: HTTP/1.1 GET /time/ - 1 Connection_Dropped DefaultAppPool
- name: FREB 실패요청 추적
  path: '%SystemDrive%\inetpub\logs\FailedReqLogFiles\W3SVC<SiteID>\fr*.xml'
  format: XML·trace event timestamp
  check: 401·404·500·지연 요청·MODULE_SET_RESPONSE_ERROR_STATUS·모듈별 단계
  sample: <failedRequest url="http://..." siteId="1" appPoolId="DefaultAppPool" ...>
- name: URL Rewrite Trace
  path: '%SystemDrive%\inetpub\logs\FailedReqLogFiles\...'
  format: FREB XML·event timestamp
  check: URL_REWRITE_START·rule evaluation·rewrite 결과·loop
  sample: <EventData><Data Name="ContextId">...</Data>...URL_REWRITE_START...</EventData>
- name: ARR Proxy 진단
  path: 사이트 W3C 로그와 FREB
  format: W3C/XML·UTC/event timestamp
  check: 502.3·502.4·sc-win32-status=12002·upstream timeout/connection abort
  sample: 502 3 12002 29889
- name: Windows System 이벤트
  path: '%SystemRoot%\System32\winevt\Logs\System.evtx'
  format: EVTX·ISO/Windows event timestamp
  check: WAS·W3SVC·HTTP Service·AppPool start/stop·Rapid-Fail Protection
  sample: Provider=WAS Level=Error <application pool event message>
- name: Windows Application 이벤트
  path: '%SystemRoot%\System32\winevt\Logs\Application.evtx'
  format: EVTX·Windows event timestamp
  check: w3wp.exe crash·.NET Runtime·Application Error·IIS module 오류
  sample: 'Faulting application name: w3wp.exe ...'
- name: IIS 구성 이력
  path: '%SystemDrive%\inetpub\history\CFGHISTORY_*'
  format: XML 구성 snapshot·폴더 생성시각
  check: 500.19·503 직전 applicationHost.config 변경·설정 롤백
  sample: CFGHISTORY_0000000001\applicationHost.config
- name: 사용자 정의 W3C 필드
  path: 사이트 W3C 로그와 동일
  format: W3C 텍스트·UTC
  check: Request/Response Header·Server Variable·추가 장애 상관필드
  sample: '#Fields: date time c-ip cs-method cs-uri-stem sc-status <custom-field>'
- name: FTP Access 로그
  path: '%SystemDrive%\inetpub\logs\LogFiles 기본 FTP 설정'
  format: W3C·UTC timestamp
  check: FTP 인증·명령·상태·접속 실패·전송 결과
  sample: 2026-09-09 03:00:00 10.0.0.2 USER user ...
sections:
- heading: 로그 종류 카탈로그 (전수)
  body: '사이트 W3C 로그: %SystemDrive%\inetpub\logs\LogFiles\W3SVC<SiteID>\ · Central W3C 로그: %SystemDrive%\inetpub\logs\LogFiles · Central Binary 로그: %SystemDrive%\inetpub\logs\LogFiles · HTTPERR 로그: %SystemRoot%\System32\LogFiles\HTTPERR\httperr<seq>.log
    · FREB 실패요청 추적: %SystemDrive%\inetpub\logs\FailedReqLogFiles\W3SVC<SiteID>\fr*.xml · URL Rewrite Trace: %SystemDrive%\inetpub\logs\FailedReqLogFiles\... · ARR Proxy 진단: 사이트 W3C 로그와 FREB · Windows System
    이벤트: %SystemRoot%\System32\winevt\Logs\System.evtx · Windows Application 이벤트: %SystemRoot%\System32\winevt\Logs\Application.evtx · IIS 구성 이력: %SystemDrive%\inetpub\history\CFGHISTORY_* · 사용자 정의 W3C
    필드: 사이트 W3C 로그와 동일 · FTP Access 로그: %SystemDrive%\inetpub\logs\LogFiles 기본 FTP 설정'
