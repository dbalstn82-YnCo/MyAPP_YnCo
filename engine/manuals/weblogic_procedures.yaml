# WebLogic 조치 절차 카탈로그 — Oracle WebLogic Server 12.2.1/14.1 Administering·Tuning Performance·WLST 기준 (2026-09-11)
# 강화(2026-10-16, GPT 45차 관문): 1차 = 읽기 전용(재기동·nmKill·설정 변경·명령줄 비밀번호 없음), 2차 = 사전조건·영향·승인·백업/롤백 + 성공/실패 기준, 3차 = 민감정보 마스킹·전달 승인
# 적용 범위 표기: WebLogic 10.3.6 / 12c(12.1.3·12.2.1) / 14c(14.1.1). WLST 실행: 먼저 '. $DOMAIN_HOME/bin/setDomainEnv.sh' 로 환경을 읽은 셸에서 java weblogic.WLST
#   (또는 10.3.6: $WL_HOME/common/bin/wlst.sh, 12c/14c: $ORACLE_HOME/oracle_common/common/bin/wlst.sh). REST 관리 API 는 12.2.1+.
# 1차 WLST 접속은 userConfigFile 로(비밀번호를 명령·history 에 남기지 않음). 키 파일은 2차 담당이 한 번 storeUserConfig() 로 만들어 둔다.
products: [weblogic]
procedures:
- id: WLS-PROC-THREAD
  category: thread
  match: [BEA-000337, BEA-000339, BEA-000362, BEA-000365]
  title: Stuck Thread · 실행 큐 과부하 (BEA-000337)
  source: "WebLogic 14.1.1 'Tuning Performance › Tuning WebLogic Server › Thread Management (Stuck Thread Max Time, Work Manager)' / 'Administering Server Environments › Server Failure Recovery(Overload)' — docs.oracle.com/en/middleware/standalone/weblogic-server/14.1.1.0/perfm/wls_tuning.html"
  stages:
  - stage: 1
    steps:
    - do: 서버 상태·Stuck 스레드 수 확인 (WLST 읽기 전용)
      cmd: |
        . $DOMAIN_HOME/bin/setDomainEnv.sh ; java weblogic.WLST <<'EOF'
        connect(userConfigFile='<path>/wls.ucf', userKeyFile='<path>/wls.key', url='t3://localhost:7001')
        domainRuntime(); cd('ServerRuntimes/<server>/ThreadPoolRuntime/ThreadPoolRuntime')
        print 'HealthState',get('HealthState'),'Stuck',get('StuckThreadCount'),'Hogging',get('HoggingThreadCount'),'Idle',get('ExecuteThreadIdleCount'),'Queue',get('QueueLength')
        exit()
        EOF
        grep -n "BEA-000337" $DOMAIN_HOME/servers/<server>/logs/<server>.log | tail -20
        # REST 대안(12.2.1+): curl -sS -u <admin> "https://<host>:<adminport>/management/weblogic/latest/domainRuntime/serverRuntimes/<server>/threadPoolRuntime?fields=stuckThreadCount,hoggingThreadCount,executeThreadIdleCount,queueLength"
      check: "이상: StuckThreadCount>0 이 지속되거나 HealthState 가 HEALTH_WARN/HEALTH_CRITICAL, QueueLength 증가·Idle 0 이면 과부하. BEA-000337 메시지의 스택에서 대기 지점(DB·외부 호출·락) 기록. 정상: Stuck 0·HEALTH_OK·Idle>0"
      note: "적용: 10.3.6/12c/14c (REST 는 12.2.1+, curl 은 -u <admin> 만 주면 비밀번호를 묻는다) · 권한: WebLogic Monitor 역할 이상 계정(userConfigFile), 로그 읽기 · setDomainEnv.sh 는 반드시 '. ' 로 읽어야 현재 셸에 CLASSPATH 가 잡힘"
    - do: 스레드 덤프 3회 채취
      cmd: |
        for i in 1 2 3; do jcmd <PID> Thread.print > $DOMAIN_HOME/servers/<server>/logs/td_$(date +%H%M%S)_$i.txt; sleep 10; done
        # 또는 WLST: threadDump(writeToFile='true', fileName='td.txt', serverName='<server>')
        # JDK 6(10.3.6): kill -3 <PID> (스레드 덤프, 프로세스는 유지 — <server>.out 에 기록)
      check: "같은 스택 반복 지점 → 2차 전달. td 파일이 비어 있으면 실행 계정 불일치 — WebLogic 실행 OS 계정으로 재시도"
      note: "적용: jcmd 는 JDK 7+ (10.3.6 + JDK 6 이면 kill -3), 12c/14c 공통 · 권한: WebLogic 실행 OS 계정 · 10초 간격 3회"
  - stage: 2
    steps:
    - do: Stuck Thread 판정 시간·자가 복구(Overload) 설정 조정
      config:
        file: 관리 콘솔 › Servers › <server> › Configuration › Tuning / config.xml (server › server-diagnostic-config, overload-protection)
        snippet: |
          <!-- config.xml -->
          <server><name><server></name>
            <stuck-thread-max-time>600</stuck-thread-max-time><stuck-thread-timer-interval>60</stuck-thread-timer-interval>
            <overload-protection><failure-action>force-shutdown</failure-action><panic-action>system-exit</panic-action>
              <server-failure-trigger><max-stuck-thread-time>600</max-stuck-thread-time><stuck-thread-count>20</stuck-thread-count></server-failure-trigger></overload-protection>
          </server>
        note: "Stuck 시간 조정은 증상 완화일 뿐 — 병목(SQL·외부 연동 타임아웃) 해소가 우선. 변경은 콘솔 Lock & Edit → Activate, 서버 재기동 필요 항목 확인. force-shutdown/system-exit 는 Stuck 누적 시 서버를 스스로 내리므로 Node Manager 자동 재기동과 함께 쓸 때만"
      cmd: |
        java weblogic.WLST <<'EOF'
        connect(userConfigFile='<UCF>', userKeyFile='<UKF>', url='t3://localhost:7001'); edit(); startEdit()
        cd('Servers/<server>'); set('StuckThreadMaxTime',600); set('StuckThreadTimerInterval',60)
        save(); activate(); exit()
        EOF
      check: "성공: activate() 가 'Activation completed' 출력, 재기동 필요 표시가 있으면 재기동 후 서버 로그에 BEA-000337 미발생·HealthState OK. 실패: activate 오류(검증 실패)·다른 사용자 편집 잠금 → cancelEdit('y') 후 원인 확인"
      note: "사전조건: 1차 Stuck 수·스레드 덤프 기록, 관리 콘솔 편집 잠금 없음 확인 · 영향: StuckThreadMaxTime 은 재기동 후 반영(서비스 중단), 판정 시간을 늘리면 실제 행 감지가 늦어짐 · 승인: WAS 운영 담당·서비스 담당 · 백업/롤백: 변경 전 config.xml 사본(cp $DOMAIN_HOME/config/config.xml config.xml.bak.<시각>), 롤백은 같은 WLST 로 원래 값(기본 600/60) set 후 activate · 주의: 비밀번호를 명령줄·heredoc 에 쓰지 않는다(ps·셸 history 노출) — 사전에 대화형 WLST 에서 한 번 connect() 후 storeUserConfig('<UCF>','<UKF>') 로 만든 사용자 설정·키 파일(권한 600, WebLogic 실행 계정만 읽기)을 connect(userConfigFile=…, userKeyFile=…, url=…) 로 쓴다. heredoc 없이 java weblogic.WLST 를 대화형으로 띄워 connect(url='t3://localhost:7001') 만 치면 사용자·비밀번호를 묻는다(스크립트 모드에서는 묻지 않고 오류) · 적용: 10.3.6/12c/14c"
    - do: Work Manager 로 애플리케이션별 스레드 제약 (과도 요청 격리)
      config:
        file: 애플리케이션 WEB-INF/weblogic.xml + config.xml (self-tuning › work-manager)
        snippet: |
          <!-- config.xml -->
          <self-tuning><work-manager><name>wm/critical</name><target><server></target>
            <max-threads-constraint>mtc-critical</max-threads-constraint><capacity>cap-critical</capacity></work-manager>
            <max-threads-constraint><name>mtc-critical</name><target><server></target><count>50</count></max-threads-constraint>
            <capacity><name>cap-critical</name><target><server></target><count>200</count></capacity></self-tuning>
          <!-- weblogic.xml --> <wl-dispatch-policy>wm/critical</wl-dispatch-policy>
      check: "성공: 앱 재배포 후 콘솔 Monitoring › Work Managers 에 wm/critical 표시, 특정 앱 과부하가 다른 앱 스레드로 전이되지 않음. 실패: 배포 시 Work Manager 미존재 오류·Capacity 초과로 503 급증 → weblogic.xml 의 dispatch-policy 제거 후 재배포"
      note: "사전조건: 앱별 평균·최대 동시 요청 수 파악, config.xml 직접 편집 대신 콘솔(Environment › Work Managers)로 생성 권장(스키마 순서 오류 방지) · 영향: max-threads 한도 초과 요청은 대기, capacity 초과 요청은 거부(503) · 승인: 서비스 담당·WAS 운영 담당·개발팀(weblogic.xml) · 백업/롤백: config.xml·weblogic.xml 사본 보관, 롤백은 dispatch-policy 제거 후 재배포 + Work Manager 삭제 · 적용: 9.x 이후 self-tuning 공통(10.3.6/12c/14c)"
  - stage: 3
    steps:
    - do: Oracle SR 자료 (WLSDM/RDA 또는 수동)
      cmd: |
        tar czf wls_$(hostname)_$(date +%Y%m%d).tgz $DOMAIN_HOME/config/config.xml $DOMAIN_HOME/servers/<server>/logs/ $DOMAIN_HOME/servers/<server>/logs/td_*.txt
        java weblogic.version 2>/dev/null | head -3 ; java -version 2>&1
      check: 서버 로그·스레드 덤프·config.xml·WLS 버전/PSU·JDK 버전 (Oracle Support Doc 1093548.1 스레드 덤프 가이드 기준)
      note: "민감정보 마스킹: 묶음 이름의 hostname, config.xml 의 암호화 비밀번호({AES}…)·호스트명·IP·포트, 로그의 계정·출처 IP·JDBC URL·세션 ID 가림(서버 logs/ 전체 대신 장애 시간대 파일만) · 전달 승인: 보안 담당 승인 후 Oracle SR 에만"

- id: WLS-PROC-CONNECTION
  category: connection
  match: [BEA-001112, BEA-001129, BEA-001131, BEA-001151, BEA-001153, BEA-001156, BEA-001177, BEA-001234, WAS-POOL-002]
  title: JDBC 데이터소스 풀 고갈·연결 실패 (BEA-0011xx)
  source: "WebLogic 14.1.1 'Administering JDBC Data Sources › Tuning Data Source Connection Pools (Maximum Capacity, Connection Reserve Timeout, Inactive Connection Timeout, Test Connections on Reserve)' — docs.oracle.com/en/middleware/standalone/weblogic-server/14.1.1.0/jdbca/ds_tuning.html"
  stages:
  - stage: 1
    steps:
    - do: 데이터소스 런타임 상태 확인 (WLST 읽기 전용)
      cmd: |
        java weblogic.WLST <<'EOF'
        connect(userConfigFile='<path>/wls.ucf', userKeyFile='<path>/wls.key', url='t3://localhost:7001'); domainRuntime()
        cd('ServerRuntimes/<server>/JDBCServiceRuntime/<server>/JDBCDataSourceRuntimeMBeans/<DS>')
        print 'State',get('State'),'Active',get('ActiveConnectionsCurrentCount'),'Max',get('ActiveConnectionsHighCount'),'Waiting',get('WaitingForConnectionCurrentCount'),'Failed',get('FailuresToReconnectCount'),'Leaked',get('LeakedConnectionCount')
        exit()
        EOF
        nc -zvw3 <DB_HOST> <DB_PORT>
      check: "이상: State 가 Running 이 아니거나(Suspended·Overloaded) Waiting>0 지속·Leaked>0 이면 풀 문제. DB 포트 실패면 DB/네트워크. 정상: Running·Waiting 0 ('Max' 는 최고 사용량 ActiveConnectionsHighCount)"
      note: "적용: 10.3.6/12c/14c · 권한: Monitor 역할 이상(userConfigFile), '. setDomainEnv.sh' 를 읽은 셸 · nc 는 TCP 연결만 열고 닫는다(DB 로그인 없음)"
  - stage: 2
    steps:
    - do: 풀 용량·대기·검사·누수 회수 설정 (데이터소스 모듈)
      config:
        file: $DOMAIN_HOME/config/jdbc/<DS>-jdbc.xml (jdbc-connection-pool-params)
        snippet: |
          <jdbc-connection-pool-params>
            <initial-capacity>10</initial-capacity><max-capacity>60</max-capacity><capacity-increment>5</capacity-increment>
            <test-connections-on-reserve>true</test-connections-on-reserve><test-table-name>SQL SELECT 1 FROM DUAL</test-table-name><test-frequency-seconds>120</test-frequency-seconds>
            <connection-reserve-timeout-seconds>10</connection-reserve-timeout-seconds><inactive-connection-timeout-seconds>120</inactive-connection-timeout-seconds>
            <statement-cache-size>20</statement-cache-size><connection-creation-retry-frequency-seconds>30</connection-creation-retry-frequency-seconds>
          </jdbc-connection-pool-params>
        note: "inactive-connection-timeout 은 누수 커넥션 강제 회수(BEA-001153 경고와 스택 기록). max-capacity 합계 ≤ DB processes. 파일 직접 편집보다 콘솔/WLST 변경 권장"
      cmd: |
        java weblogic.WLST <<'EOF'
        connect(userConfigFile='<UCF>', userKeyFile='<UKF>', url='t3://localhost:7001'); edit(); startEdit()
        cd('JDBCSystemResources/<DS>/JDBCResource/<DS>/JDBCConnectionPoolParams/<DS>'); set('MaxCapacity',60); set('ConnectionReserveTimeoutSeconds',10)
        save(); activate(); exit()
        EOF
      check: "성공: activate 완료, 런타임 Waiting 0·오류 로그 BEA-001156(풀 소진) 미발생. 실패: activate 오류 또는 DB 세션 한도 초과(ORA-00020 등)·Waiting 지속 → 원래 값으로 되돌리고 누수(Leaked) 추적으로 전환"
      note: "사전조건: DBA 와 DB processes/sessions 여유 확인(모든 서버 max-capacity 합계), 1차 런타임 값 기록 · 영향: MaxCapacity·ReserveTimeout 은 동적 반영(재기동 불필요), 용량 증가는 DB 부하 증가 · 승인: WAS 운영 담당·DBA · 백업/롤백: 변경 전 $DOMAIN_HOME/config/jdbc/<DS>-jdbc.xml 사본, 롤백은 같은 WLST 로 원래 값 set 후 activate · 주의: 비밀번호를 명령줄에 쓰지 않음 — userConfigFile/userKeyFile(storeUserConfig 로 1회 생성) 또는 대화형 connect(url=…) 프롬프트 · 적용: 10.3.6/12c/14c"
    - do: 풀 리셋·재개 (DB 장애 복구 직후 남은 불량 커넥션 정리)
      cmd: |
        java weblogic.WLST <<'EOF'
        connect(userConfigFile='<UCF>', userKeyFile='<UKF>', url='t3://localhost:7001'); domainRuntime()
        cd('ServerRuntimes/<server>/JDBCServiceRuntime/<server>/JDBCDataSourceRuntimeMBeans/<DS>'); cmo.reset()
        exit()
        EOF
      check: "성공: reset 후 State Running, ActiveConnectionsCurrentCount 정상·FailuresToReconnectCount 증가 없음. 실패: State Suspended/Unhealthy 유지 또는 reset 예외 → DB 접속(1차 nc) 재확인, DB 정상인데 실패하면 3차"
      note: "사전조건: DB 가 정상 복구되었음을 DBA 가 확인, 업무 한가한 시점 · 영향: 풀의 연결을 닫고 다시 만들므로 진행 중 요청 일부 실패·순간 DB 로그인 폭증 · 승인: WAS 운영 담당·DBA · 백업/롤백: 설정 변경 없음 — 되돌릴 것 없음(실패 시 데이터소스 suspend/resume 또는 서버 재기동은 별도 승인) · 주의: 비밀번호를 명령줄에 쓰지 않음 — userConfigFile/userKeyFile(storeUserConfig 로 1회 생성) 또는 대화형 connect(url=…) 프롬프트 · 적용: 10.3.6/12c/14c"
  - stage: 3
    steps:
    - do: Oracle SR 자료
      cmd: |
        tar czf wls_ds_$(date +%Y%m%d).tgz $DOMAIN_HOME/config/jdbc/*.xml $DOMAIN_HOME/servers/<server>/logs/<server>.log* $DOMAIN_HOME/servers/<server>/logs/td_*.txt
        ls $WL_HOME/../oracle_common/modules/oracle.jdbc*/ 2>/dev/null
      check: 데이터소스 XML·서버 로그·스레드 덤프·JDBC 드라이버 버전·DB 버전
      note: "민감정보 마스킹: *-jdbc.xml 의 password-encrypted·user·url(DB 호스트·포트·서비스명), 로그의 호스트명·IP·계정·SQL 바인드 값 가림 · 전달 승인: 보안 담당·DBA 승인 후 Oracle SR 에만"

- id: WLS-PROC-INTERNAL
  category: internal
  match: [BEA-000386, BEA-000415, BEA-000438, BEA-141021, BEA-141151, BEA-141297, BEA-149205, BEA-149265, BEA-101017, BEA-101020, BEA-101083, BEA-101216, BEA-101220]
  title: 서버 기동 실패·배포 실패·서블릿 내부 오류
  source: "WebLogic 14.1.1 'Administering Server Startup and Shutdown (startWebLogic.sh, boot.properties, nodemanager)'·'Deploying Applications (weblogic.Deployer)'·'Node Manager Administrator's Guide'"
  stages:
  - stage: 1
    steps:
    - do: 기동·배포 실패 원인 줄 확인
      cmd: |
        grep -n "<Critical>\|<Error>\|BEA-000386\|BEA-149205\|BEA-141" $DOMAIN_HOME/servers/<server>/logs/<server>.log | tail -30
        tail -n 100 $DOMAIN_HOME/servers/<server>/logs/<server>.out
        ls -l $DOMAIN_HOME/servers/<server>/security/boot.properties ; ss -ltnp | grep -E ":(7001|<port>)\b"
      check: "포트 점유·boot.properties 손상·config.xml 파싱·배포 예외(BEA-149205 의 원인 예외) 중 어느 것인지 기록. 정상: <Critical>/<Error> 없음·포트가 해당 서버 PID 하나에만 묶임"
      note: "적용: 10.3.6/12c/14c · 권한: 도메인 디렉터리 읽기(WebLogic 실행 계정), ss -p 의 PID 표시는 root 필요 · boot.properties 는 내용을 열지 않고 존재·크기·시각만 확인"
  - stage: 2
    steps:
    - do: 서버 재기동 (Node Manager 또는 스크립트)
      cmd: |
        java weblogic.WLST <<'EOF'
        nmConnect(userConfigFile='<NM_UCF>', userKeyFile='<NM_UKF>', host='localhost', port='5556', domainName='<domain>', domainDir='<DOMAIN_HOME>', nmType='ssl'); nmKill('<server>'); nmStart('<server>'); exit()
        EOF
        # 또는: nohup $DOMAIN_HOME/bin/startManagedWebLogic.sh <server> t3://localhost:7001 > $DOMAIN_HOME/servers/<server>/logs/<server>.out 2>&1 &
      check: "성공: 로그에 BEA-000360 'Server started in RUNNING mode', nmServerStatus('<server>') RUNNING. 실패: FAILED_NOT_RESTARTABLE·ADMIN 모드 또는 같은 BEA-000386 반복 → config.xml 복원 단계 또는 3차"
      note: "사전조건: 1차 로그·스레드 덤프 확보, 클러스터면 다른 멤버가 부하를 받을 수 있는지 확인, 노드매니저 유형(ssl/plain) 확인 · 영향: nmKill 은 강제 종료(진행 중 트랜잭션 롤백·세션 소실), 기동 시간 동안 서비스 중단 — 가능하면 콘솔 Graceful shutdown 우선 · 승인: 서비스 담당·WAS 운영 담당 · 백업/롤백: 재기동 전 config.xml 사본 보관, 기동 실패 시 config 복원 단계로 · 주의: 노드매니저 비밀번호를 명령줄·heredoc 에 쓰지 않는다 — 사전에 대화형 WLST 에서 nmConnect 후 storeUserConfig('<NM_UCF>','<NM_UKF>', nm 인자 true) 로 노드매니저용 사용자 설정·키 파일(권한 600)을 한 번 만들어 둔다(관리 서버용 UCF 와 별개) · 적용: 10.3.6/12c/14c (12c 이상 노드매니저는 도메인별 $DOMAIN_HOME/nodemanager)"
    - do: 배포 롤백·재배포 (weblogic.Deployer)
      cmd: |
        java weblogic.Deployer -adminurl t3://localhost:7001 -userconfigfile <UCF> -userkeyfile <UKF> -listapps
        java weblogic.Deployer -adminurl t3://localhost:7001 -userconfigfile <UCF> -userkeyfile <UKF> -undeploy -name <app>
        java weblogic.Deployer -adminurl t3://localhost:7001 -userconfigfile <UCF> -userkeyfile <UKF> -deploy -name <app> -source /path/<app>.war -targets <server>
      check: "성공: -listapps 에서 <app> 활성, 서버 로그 BEA-149265(배포 실패) 없음. 실패: deploy 가 BEA-149265/149205 로 실패 → 보관한 직전 정상본으로 같은 -deploy 재실행(롤백)"
      note: "사전조건: 직전 정상 배포본(war/ear) 경로 확보, 대상 서버·클러스터 확인 · 영향: undeploy~deploy 사이 앱 서비스 중단·세션 소실 · 승인: 서비스 담당·WAS 운영 담당 · 백업/롤백: 현재 배포본을 날짜 붙여 보관, 실패 시 그 파일로 -deploy · 주의: -username/-password 는 ps·history 에 노출되므로 쓰지 않는다 — -userconfigfile/-userkeyfile 은 WLST storeUserConfig 로 미리 만든 파일(권한 600) · 적용: 10.3.6/12c/14c"
    - do: config.xml 손상 시 백업본 복원
      cmd: |
        ls -lt $DOMAIN_HOME/config.xml.booted $DOMAIN_HOME/config-booted.jar $DOMAIN_HOME/configArchive/ 2>/dev/null | head -10
        cp $DOMAIN_HOME/config/config.xml $DOMAIN_HOME/config/config.xml.bad.$(date +%Y%m%d%H%M) ; cp $DOMAIN_HOME/config.xml.booted $DOMAIN_HOME/config/config.xml
        # config.xml.booted 가 없고 config-booted.jar 만 있는 판은: unzip 으로 별도 폴더에 풀어 config/config.xml 을 확인 후 복사
      check: "성공: 관리 서버 기동 성공(BEA-000360). 실패: 같은 파싱 오류 반복 → configArchive 의 이전 jar 로 재시도, 그래도 실패면 config.xml.bad 원복 후 3차"
      note: "사전조건: 관리 서버 중지 상태, 복원본의 시각이 마지막 정상 기동 시점인지 확인 · 영향: 마지막 정상 기동 이후 설정 변경이 사라짐 · 승인: WAS 운영 담당 · 백업/롤백: 덮어쓰기 전 config.xml.bad.<시각> 보관(cmd 2번째 줄 앞부분), 되돌릴 때 그 파일 복사 · 적용: 성공 기동 시 백업은 도메인 디렉터리(DOMAIN_HOME)에 생성 — 14.1.1 문서는 config.xml.booted, 12.2.1 계열은 config-booted.jar, 변경 이력은 configArchive(ConfigBackupEnabled 일 때). 판별 파일 이름은 설치본에서 ls 로 확인"
      verify_note: "미검증 — 10.3.6·12.1.3 의 성공 기동 백업 파일 이름(config.xml.booted / config-booted.jar)을 판별로 확인하지 못함"
  - stage: 3
    steps:
    - do: Oracle SR 자료
      cmd: |
        tar czf wls_boot_$(date +%Y%m%d).tgz $DOMAIN_HOME/config/ $DOMAIN_HOME/servers/<server>/logs/ $DOMAIN_HOME/nodemanager/*.log 2>/dev/null
        java weblogic.version | head -3 ; $ORACLE_HOME/OPatch/opatch lsinventory | head -20
      check: 서버/노드매니저 로그·config·PSU(opatch lsinventory)
      note: "민감정보 마스킹: config/ 안 암호화 비밀번호({AES}…)·jdbc/*.xml 의 user·url, 로그의 호스트명·IP·계정·JDBC URL 가림, security/ (SerializedSystemIni.dat·boot.properties) 는 절대 포함하지 않음(config/ 만 묶는지 확인) · 전달 승인: 보안 담당 승인 후 Oracle SR 에만"

- id: WLS-PROC-UNDO
  category: undo
  match: [BEA-110412, BEA-110413, BEA-110486]
  title: JTA 트랜잭션 타임아웃·롤백 (BEA-1104xx)
  source: "WebLogic 14.1.1 'Developing JTA Applications › Configuring Transactions (Timeout Seconds, Abandon Timeout Seconds)'·'Transaction Recovery Service'"
  stages:
  - stage: 1
    steps:
    - do: 타임아웃 트랜잭션 확인
      cmd: |
        grep -n "BEA-110412\|BEA-110413\|BEA-110486" $DOMAIN_HOME/servers/<server>/logs/<server>.log | tail -20
        java weblogic.WLST <<'EOF'
        connect(userConfigFile='<path>/wls.ucf', userKeyFile='<path>/wls.key', url='t3://localhost:7001'); domainRuntime(); cd('ServerRuntimes/<server>/JTARuntime/JTARuntime')
        print 'Active',get('ActiveTransactionsTotalCount'),'RolledBackTimeout',get('TransactionRolledBackTimeoutTotalCount'),'Heuristics',get('TransactionHeuristicsTotalCount'); exit()
        EOF
      check: "이상: RolledBackTimeout 이 계속 늘거나 Heuristics>0 이면 느린 자원(DB·JMS) 확인. 정상: 두 값이 증가하지 않음"
      note: "적용: 10.3.6/12c/14c · 권한: Monitor 역할 이상(userConfigFile), 로그 읽기"
  - stage: 2
    steps:
    - do: JTA 타임아웃 조정
      config:
        file: config.xml (jta) / 콘솔 › <domain> › Configuration › JTA
        snippet: |
          <jta><timeout-seconds>300</timeout-seconds><abandon-timeout-seconds>86400</abandon-timeout-seconds><max-transactions>10000</max-transactions></jta>
        note: "애플리케이션 EJB 의 trans-timeout-seconds 가 우선 적용됨"
      check: "성공: 콘솔 Activate 완료 후 BEA-110412 미발생, 힙·DB 락 대기 정상. 실패: 타임아웃을 늘렸는데 DB 잠금 대기·스레드 Stuck 증가 → 원래 값으로 되돌리고 느린 SQL 해소로 전환"
      note: "사전조건: 느린 자원(SQL·JMS) 원인 파악·DBA 협의, 현재 값 기록 · 영향: 타임아웃 증가는 잠금 보유·스레드 점유 시간 증가(Stuck 위험), 도메인 전체 서버에 적용 · 승인: WAS 운영 담당·DBA·서비스 담당 · 백업/롤백: 변경 전 config.xml 사본, 롤백은 콘솔에서 원래 값(기본 30초) 입력 후 Activate · 적용: 10.3.6/12c/14c"
  - stage: 3
    steps:
    - do: Oracle SR 자료
      cmd: |
        tar czf wls_jta_$(date +%Y%m%d).tgz $DOMAIN_HOME/config/config.xml $DOMAIN_HOME/servers/<server>/logs/ $DOMAIN_HOME/servers/<server>/data/store/default/ 2>/dev/null
      check: 로그·config·트랜잭션 로그 스토어(TLOG)
      note: "민감정보 마스킹: config.xml 암호화 비밀번호·호스트명·IP, 로그의 계정·JDBC URL·업무 데이터 가림, TLOG(store/default) 는 Xid·자원 이름이 들어 있어 Oracle 이 요청할 때만 · 전달 승인: 보안 담당·DBA 승인 후 Oracle SR 에만"

- id: WLS-PROC-SECURITY
  category: security
  match: [BEA-090076, BEA-090482, BEA-090504, BEA-090898]
  title: 인증 실패·SSL 인증서 오류 (BEA-090xxx)
  source: "WebLogic 14.1.1 'Administering Security › Configuring SSL (Identity/Trust keystores, Hostname Verification)'·'Securing Resources (User Lockout)'"
  stages:
  - stage: 1
    steps:
    - do: 실패 계정·인증서 상태 확인
      cmd: |
        grep -n "BEA-090\|Authentication\|Certificate" $DOMAIN_HOME/servers/<server>/logs/<server>.log | tail -20
        keytool -list -v -keystore <identity.jks> 2>/dev/null | grep -i "valid\|alias"   # 운영 키스토어 경로(콘솔 Keystores 탭), 비밀번호는 keytool 이 묻는다
      check: "이상: 반복 실패 출처가 외부면 보안 담당 통보, 인증서 만료(Valid until 경과)·별칭 불일치면 교체. 정상: 유효 기간 내·실패가 일회성"
      note: "적용: 10.3.6/12c/14c · 권한: 로그·키스토어 읽기(WebLogic 실행 계정) · -storepass 를 명령줄에 쓰지 않음(JKS 는 Enter 로 건너뛰어도 목록 조회 가능)"
  - stage: 2
    steps:
    - do: 계정 잠금 해제 (콘솔 또는 WLST)
      cmd: |
        java weblogic.WLST <<'EOF'
        connect(userConfigFile='<UCF>', userKeyFile='<UKF>', url='t3://localhost:7001'); domainRuntime()
        ulm=cmo.lookupServerRuntime('<server>').getServerSecurityRuntime().getDefaultRealmRuntime().getUserLockoutManagerRuntime()
        if ulm != None: ulm.clearLockout('<user>')
        exit()
        EOF
      check: "성공: 해당 사용자 로그인 정상, ulm.isLockedOut('<user>') 가 false. 실패: ulm 이 None(잠금 기능 꺼짐)이거나 곧 다시 잠김 → 출처 IP 확인 후 보안 담당 판단"
      note: "사전조건: 잠금 원인이 본인 실수인지 공격인지 보안 담당 확인(외부 반복 실패면 해제 금지), 사용자 본인 확인 · 영향: 잠금 해제로 무차별 대입 공격이 다시 가능해짐 · 승인: 보안 담당 · 백업/롤백: 설정 변경 없음 — 다시 잠그려면 잠금 정책이 자동 적용(되돌릴 설정 없음) · 주의: 비밀번호를 명령줄에 쓰지 않음 — userConfigFile/userKeyFile(storeUserConfig 로 1회 생성) 또는 대화형 connect(url=…) 프롬프트 · 적용: 10.3.6/12c/14c (기본 realm 만, 서버마다 잠금 상태가 따로 — 필요한 서버마다 실행)"
    - do: SSL 키스토어 교체·프로토콜 설정
      config:
        file: config.xml (server › ssl, key-stores) / setDomainEnv.sh
        snippet: |
          <key-stores>CustomIdentityAndCustomTrust</key-stores>
          <custom-identity-key-store-file-name>/path/identity.jks</custom-identity-key-store-file-name>
          <ssl><enabled>true</enabled><listen-port>7002</listen-port><server-private-key-alias>server</server-private-key-alias><hostname-verifier>weblogic.security.utils.SSLWLSHostnameVerifier</hostname-verifier></ssl>
          # JAVA_OPTIONS="$JAVA_OPTIONS -Dweblogic.security.SSL.minimumProtocolVersion=TLSv1.2"
      check: "성공: 재기동 후 openssl s_client -connect <host>:7002 -tls1_2 </dev/null 핸드셰이크 성공·새 인증서 만료일 표시, BEA-090482 미발생. 실패: 기동 시 BEA-090xxx 키스토어 로드 오류 → 이전 키스토어·config.xml 복원"
      note: "사전조건: 새 인증서 체인·개인키·별칭 확인, 이전 키스토어 보관, 콘솔(Keystores·SSL 탭)로 변경 권장 · 영향: 재기동 필요(서비스 중단), 최소 TLS 1.2 지정 시 구형 클라이언트 접속 실패 · 승인: 보안 담당·서비스 담당 · 백업/롤백: config.xml·setDomainEnv.sh·이전 키스토어 사본, 롤백은 복사 후 재기동 · 적용: 10.3.6/12c/14c (minimumProtocolVersion 의 10.3.6 지원 PSU 는 미검증 — 12c/14c 기준)"
  - stage: 3
    steps:
    - do: Oracle SR 자료
      cmd: |
        tar czf wls_sec_$(date +%Y%m%d).tgz $DOMAIN_HOME/config/config.xml $DOMAIN_HOME/servers/<server>/logs/<server>.log*
      check: 로그·config(비밀번호 암호화 상태)·인증서 체인 정보
      note: "민감정보 마스킹: config.xml 의 암호화 비밀번호({AES}…·keystore passphrase)·호스트명·IP, 로그의 사용자 ID·출처 IP 가림, 키스토어 파일·SerializedSystemIni.dat 는 보내지 않음(인증서 정보는 keytool 출력으로) · 전달 승인: 보안 담당 승인 후 Oracle SR 에만"
