# 아이디어 3(2026-10-16) SW 묶음 — '같은 제품·유형'·'계층 공통'으로만 붙던 판정 가운데 기존 절차가 실제로 맞는 것만 '이 판정 전용'으로 잇는다.
# 맞지 않는 판정은 r6_sw_procedures.yaml 에 전용 절차를 따로 만들었다(여기에 넣지 않음). 절차 파일 자체는 고치지 않는다.
# 참고: sw_procedures.yaml 의 match 에 소문자 클래스명(java.lang.OutOfMemoryError 등)으로 적힌 항목은 코드 ID(대문자)와 글자가 달라 ID 매칭이 되지 않았다 — 여기서 대문자 ID 로 잇는다.
