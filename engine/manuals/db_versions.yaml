    note: 선재소프트 인메모리 DBMS(구 SunDB, 2010 첫 출시). 현행 제품 버전은 달력형(20c.1·22c.1·26c.1), 3.1 은 '3.1 이후 미지원' 참조로만 확인(3.2 는 DB 버전으로 확인 안 됨 — GPT). 오류 표기는 ERR-<SQLSTATE>(내부번호) 예 ERR-42000(14006)·ERR-HY000(13011) — 사전 코드는 내부번호이며 파서가 괄호 안 번호로 대응. 출시·EOS 일자는 공개 자료 없음.
