    <profile_root>/logs/<SERVER>/activity.log · Native stdout: <profile_root>/logs/<SERVER>/native_stdout.log 설정값 기준 · Native stderr: <profile_root>/logs/<SERVER>/native_stderr.log · FFDC 로그: <profile_root>/logs/ffdc/
