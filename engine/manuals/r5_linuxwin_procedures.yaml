# 근거 매뉴얼·작성 기준 (r5 · 2026-10-16 · G2 묶음: linux / windows / auditd)
# - Linux: RHEL 6/7 Storage Administration Guide·Deployment Guide, RHEL 8/9 'Configuring device mapper multipath'·'Managing storage devices'
#   ·'Configuring and managing logical volumes'·'Managing file systems'·'Configuring basic system settings(chrony)'·'Managing, monitoring and updating the kernel(kdump)',
#   man7.org (journalctl(1), systemd.service(5), proc(5), nfs(5), mdadm(8), ss(8)), Ubuntu Server 문서(AppArmor·systemd-resolved)
# - Windows: Microsoft Learn — Windows Server 2012 R2~2022 (Get-WinEvent, chkdsk·Repair-Volume, Get-ClusterLog·Get-ClusterSharedVolumeState,
#   w32tm, nltest·Test-ComputerSecureChannel, Schannel/TLS, Group Policy 문제 해결, Event 7000/7011 ServicesPipeTimeout)
# - auditd: auditd(8)·ausearch(8)·aureport(8)·auditctl(8) man 페이지, RHEL 'Security hardening › Auditing the system'
# - 작성 기준: 검증도구\knowledge_spec.md 5차(GPT 45차 관문) — 1차 읽기 전용, 2차 사전조건·영향·승인·백업/롤백 + 성공/실패, 3차 민감정보 마스킹·전달 승인
# - 명령의 적용 버전은 note 에 표시(RHEL 6 = service·/var/log/messages·sosreport·ifconfig, RHEL 7+ = systemctl·journalctl, RHEL 8+ = sos report)
procedures:
# ── Linux ──
- id: LNX-PROC-R5-STORAGE
  products: [linux]
  category: storage
  match: [LNX-JOURNAL-CORRUPT, LNX-MULTIPATH-FAIL, LNX-MD-RAID-DEGRADED, LNX-LVM-FAIL, LNX-XFS-CORRUPTION, LNX-READONLY-FS]
  title: 스토리지 경로·소프트웨어 RAID·LVM·파일시스템 손상 (Linux)
  source: "RHEL 8/9 'Configuring device mapper multipath'·'Managing storage devices (mdadm)'·'Configuring and managing logical volumes'·'Managing file systems (xfs_repair, e2fsck)', RHEL 6/7 Storage Administration Guide, journalctl(1)"
  stages:
  - stage: 1
    steps:
    - do: 읽기 전용 전환·커널 저장 오류 확인 (읽기 전용)
      cmd: |
        grep -E ' ro[ ,]' /proc/mounts
        journalctl -k --since "-2 hours" | grep -iE "I/O error|XFS|EXT4-fs|read-only|multipath|md/raid" | tail -40
        grep -iE "I/O error|XFS|EXT4-fs|read-only|multipath|raid" /var/log/messages | tail -40
      check: "원래 rw 였던 마운트가 ro 로 보이거나 I/O error·'Shutting down filesystem' 이 있으면 이상 확정, 없으면 다음 단계로 원인 계층 확인"
      note: "적용: journalctl 은 RHEL 7+, /var/log/messages 는 RHEL 6 (Ubuntu 는 /var/log/syslog) · 권한: root"
    - do: 경로·RAID·LVM 상태 확인
      cmd: |
        multipath -ll 2>/dev/null | head -60
        cat /proc/mdstat
        pvs ; vgs ; lvs -a -o +devices
        lsblk -o NAME,HCTL,SIZE,TYPE,MOUNTPOINT
      check: "multipath 의 failed/faulty 경로, mdstat 의 '_'(degraded), pvs 의 missing 표시가 있으면 그 계층이 원인 — 모두 정상이면 파일시스템 자체 손상"
      note: "적용: multipath 는 device-mapper-multipath 설치 시, lsblk HCTL 열은 RHEL 7+ (RHEL 6 은 cat /proc/scsi/scsi) · 권한: root"
    - do: 저널 무결성 확인
      cmd: |
        journalctl --verify 2>&1 | grep -i fail | head
        journalctl --disk-usage ; df -h /var/log/journal
      check: "FAIL 표시 파일이 있으면 저널 손상, 없으면 정상"
      note: "적용: systemd-journald (RHEL 7+·Ubuntu 16.04+) · 권한: root"
  - stage: 2
    steps:
    - do: 실패 경로·RAID 멤버 복구와 LVM 재활성화
      cmd: |
        multipathd show paths
        mdadm /dev/<md> --fail /dev/<old> --remove /dev/<old>
        mdadm /dev/<md> --add /dev/<new>
        pvscan --cache ; vgchange -ay <vg>
      check: "성공: multipath -ll 전 경로 active·/proc/mdstat [UU] 복귀(재동기화 완료)·lvs 정상 · 실패: 경로 복귀 안 됨·재동기화 오류 → 스토리지 담당·3차"
      note: "사전조건: 스토리지·SAN 담당과 원인 경로 확인, 데이터 백업 확인 · 영향: 재동기화 중 I/O 성능 저하 · 승인: 시스템·스토리지 담당 · 백업/롤백: /etc/lvm/archive 메타데이터 보관(vgcfgrestore 로 복원), 교체한 디스크 보관 · 적용: RHEL 6~9 (pvscan --cache 는 RHEL 7+)"
    - do: 파일시스템 점검·수리 (언마운트 가능 시)
      cmd: |
        umount /<mount>
        xfs_repair -n /dev/<vg>/<lv>
        e2fsck -fn /dev/<vg>/<lv>
      check: "성공: 점검 결과 확인 후 수리(xfs_repair 의 -n 제거 / e2fsck -fy)·재마운트, 커널 오류 재발 없음 · 실패: xfs_repair 가 로그 재생 요구 → 마운트/언마운트로 로그 재생 후 재시도, xfs_repair -L 은 로그 손실 위험으로 벤더 확인 후만"
      note: "사전조건: 하위 I/O 오류 해소·업무 중단 시간 확보 · 영향: 해당 파일시스템 서비스 중단 · 승인: 시스템 담당·업무 담당 · 백업/롤백: 수리 전 백업(가능하면 블록 이미지), 실패 시 백업 복원 · 루트 FS 는 rescue 모드"
    - do: 손상 저널 파일 회전
      cmd: |
        journalctl --rotate
      check: "성공: journalctl --verify 에 FAIL 없음 · 실패: 계속 손상 → 디스크 진단(smartctl)"
      note: "사전조건: 손상 파일(*.journal~) 사본 보관 · 영향: 없음(새 파일 시작) · 승인: 시스템 담당 · 백업/롤백: 원본 사본 보관 · 적용: --rotate 는 RHEL 8+ (RHEL 7 은 journald 에 SIGUSR2 전달)"
  - stage: 3
    steps:
    - do: 벤더(Red Hat·스토리지) 의뢰 자료
      cmd: |
        sos report --batch --tmp-dir /var/tmp
        multipath -ll > multipath_$(date +%Y%m%d).txt ; cat /proc/mdstat > mdstat_$(date +%Y%m%d).txt ; lvs -a -o +devices > lvs_$(date +%Y%m%d).txt
      check: "sosreport·multipath·mdstat·lvs·커널 로그 확보"
      note: "적용: sos report 는 RHEL 8+, RHEL 6/7 은 sosreport --batch · 민감정보 마스킹: 호스트명·IP·WWN·사용자명 가림 후 전달 · 전달 승인: 보안 담당"

- id: LNX-PROC-R5-THREAD
  products: [linux]
  category: thread
  match: [LNX-SYSTEMD-WATCHDOG, LNX-CPU-STALL]
  title: systemd 워치독 타임아웃·RCU CPU 스톨 (Linux)
  source: "systemd.service(5) WatchdogSec=·systemctl(1)·coredumpctl(1), 커널 문서 RCU CPU stall warnings, RHEL 8/9 'Managing, monitoring and updating the kernel'"
  stages:
  - stage: 1
    steps:
    - do: 워치독·스톨 메시지와 스택 확보 (읽기 전용)
      cmd: |
        journalctl -k --since "-2 hours" | grep -iE -A 20 "rcu.*stall|detected stall" | tail -60
        journalctl --since "-2 hours" | grep -i "watchdog timeout" | tail -20
        grep -i -A 20 "stall" /var/log/messages | tail -60
      check: "같은 CPU·같은 함수/모듈이 반복되면 드라이버·커널 원인, 서비스명만 반복되면 해당 서비스 행"
      note: "적용: journalctl 은 RHEL 7+, /var/log/messages 는 RHEL 6 · 권한: root"
    - do: CPU 지연·가상화 steal·서비스 재기동 이력 확인
      cmd: |
        mpstat -P ALL 1 3
        systemctl show <service> -p WatchdogUSec -p NRestarts -p ActiveState
        coredumpctl list | tail -5
      check: "%steal 지속 10% 이상이면 호스트 과할당, NRestarts 증가면 워치독에 의한 반복 재기동"
      note: "적용: mpstat 은 sysstat 설치 시, NRestarts·coredumpctl 은 RHEL 8+ · 권한: root"
  - stage: 2
    steps:
    - do: 서비스 워치독 시간 임시 조정과 원인 분석
      cmd: |
        coredumpctl info <PID>
        systemctl edit <service>
        systemctl restart <service>
      check: "성공: 워치독 타임아웃 재발 없음·systemctl is-active = active · 실패: 계속 발생 → 애플리케이션 공급업체 분석(3차)"
      note: "사전조건: 코어·로그 확보, drop-in 에 [Service] WatchdogSec=<초> 작성 · 영향: 서비스 재기동 동안 중단 · 승인: 서비스 담당 · 백업/롤백: drop-in(/etc/systemd/system/<service>.service.d/override.conf) 삭제 후 systemctl daemon-reload"
    - do: 스톨 원인 드라이버·커널 조치
      cmd: |
        modinfo <module> | head
        rpm -q kernel ; uname -r
        grubby --default-kernel
      check: "성공: 커널/드라이버 갱신 후 스톨 메시지 없음 · 실패: 재발 → kdump vmcore 확보 후 3차"
      note: "사전조건: 벤더 지식베이스로 해당 모듈 결함 확인, VM 이면 호스트 담당과 vCPU 과할당 협의 · 영향: 커널 갱신은 재부팅 필요 · 승인: 시스템 담당·변경 위원회 · 백업/롤백: 이전 커널을 grubby --set-default 로 기본 지정"
  - stage: 3
    steps:
    - do: 벤더 의뢰 자료
      cmd: |
        sos report --batch
        journalctl -k --since "-1 day" > kernel_$(date +%Y%m%d).log
      check: "sosreport·커널 로그(스톨 스택)·vmcore(있으면)"
      note: "적용: RHEL 6/7 은 sosreport --batch · 민감정보 마스킹: 호스트명·IP·계정 가림 후 전달 · 전달 승인: 보안 담당"

- id: LNX-PROC-R5-INTERNAL
  products: [linux]
  category: internal
  match: [LNX-SEGFAULT, LNX-GENERAL-PROTECTION, LNX-CLOCK-SKEW, LNX-SYSTEMD-UNIT-FAILED, LNX-CRON-FAIL, LNX-KDUMP-FAIL, LNX-UPSTART-FAIL, LNX-KERNEL-PANIC, LEG-RHEL-SELINUX, LEG-RHEL-NETDOWN, LEG-RHEL-EXT4-FS-ERROR-699F, LEG-RHEL-WARN-LOAD, LEG-RHEL-WARN-ZOMBIE]
  title: 프로세스 크래시·서비스/배치 실패·시간 동기·kdump·커널 패닉 등 내부 오류 (Linux)
  source: "RHEL 7/8/9 'Configuring basic system settings (systemd, chrony)'·'Managing, monitoring and updating the kernel (kdump)'·'Using SELinux', RHEL 6 Deployment Guide (upstart·ntpd), systemctl(1)·journalctl(1)·crontab(5)"
  stages:
  - stage: 1
    steps:
    - do: 실패 유닛·크래시·패닉 흔적 확인 (읽기 전용)
      cmd: |
        systemctl --failed
        journalctl -p err --since "-2 hours" --no-pager | tail -50
        journalctl -k --since "-2 hours" | grep -iE "segfault|general protection|traps:" | tail -20
        ls -lt /var/crash 2>/dev/null | head
      check: "failed 유닛·segfault 프로세스·vmcore 존재 여부로 하위 유형을 구분하고 해당 코드의 즉시 조치를 이어서 수행"
      note: "적용: RHEL 7+ (RHEL 6 은 /var/log/messages 의 segfault·init: 문구와 initctl list) · 권한: root"
    - do: 시간 동기·kdump·배치 상태 확인
      cmd: |
        chronyc tracking 2>/dev/null || ntpq -p
        cat /sys/kernel/kexec_crash_loaded ; grep -o "crashkernel=[^ ]*" /proc/cmdline
        grep -E "CROND|CRON" /var/log/cron 2>/dev/null | tail -20
      check: "offset 수백 ms 이상·동기 소스 없음이면 시간 이상, kexec_crash_loaded=0 이면 kdump 미동작, cron 오류 반복 작업 확인"
      note: "적용: chronyc 는 RHEL 7+, ntpq 는 RHEL 6 · Ubuntu cron 로그는 /var/log/syslog · 권한: root"
    - do: 부하·좀비·SELinux·링크 상태(룰 판정) 확인
      cmd: |
        uptime ; nproc
        ps -eo stat,ppid,pid,comm | awk '$1 ~ /^Z/' | head
        ausearch -m AVC -ts recent -i 2>/dev/null | tail -20
        ip link show
      check: "load 가 CPU 수(nproc)의 2배 이상 지속, 좀비 다수(부모 PID 기록), AVC denied, DOWN 인터페이스가 있으면 해당 항목 이상"
      note: "적용: RHEL 6~9 (RHEL 6 은 ifconfig -a 도 가능) · 권한: root"
  - stage: 2
    steps:
    - do: 실패 서비스 복구
      cmd: |
        systemctl reset-failed <unit>
        systemctl start <unit>
        initctl start <job>
      check: "성공: systemctl is-active <unit> = active, 10분 내 재실패 없음 · 실패: 같은 오류 반복 → 설정·의존성 수정 후 재시도 또는 3차"
      note: "사전조건: 실패 원인(설정·권한·의존 서비스) 확인·수정 · 영향: 서비스 기동 중 일시 지연 · 승인: 서비스 담당 · 백업/롤백: 수정한 설정 파일 사전 백업(cp -p), 문제 시 원복 후 재기동 · 적용: initctl 은 RHEL 6 upstart"
    - do: 시간 보정·kdump 재설정
      cmd: |
        chronyc makestep
        grubby --update-kernel=ALL --args="crashkernel=<크기>"
        kdumpctl restart
      check: "성공: chronyc tracking offset 수 ms 이내, 재부팅 후 kexec_crash_loaded=1 · 실패: 시간원 무응답 → 연결 절차(LNX-PROC-R5-CONNECTION), crashkernel 예약 실패 → 메모리·커널 버전 확인"
      note: "사전조건: 시간 점프가 DB·클러스터·인증에 주는 영향 확인, crashkernel 변경은 재부팅 일정 확보 · 영향: 시간 급변·재부팅 · 승인: 시스템 담당·업무 담당 · 백업/롤백: /etc/chrony.conf 백업, grubby --remove-args 로 원복 · 적용: RHEL 7+"
    - do: SELinux 레이블·링크 조치
      cmd: |
        restorecon -Rv <경로>
        ip link set <iface> up
      check: "성공: AVC 재발 없음·링크 UP · 실패: 계속 차단/다운 → 정책 모듈 검토·네트워크 담당"
      note: "사전조건: 좀비는 부모 프로세스 담당과 재기동 협의, 링크 up 은 네트워크 담당 합의 · 영향: 레이블이 바뀐 파일의 접근 허용 범위 변화 · 승인: 시스템·보안 담당 · 백업/롤백: 변경 전 ls -Z 결과 보관 후 chcon 으로 원복, 링크는 ip link set <iface> down"
  - stage: 3
    steps:
    - do: 벤더 의뢰 자료
      cmd: |
        sos report --batch
        ls -l /var/crash/*/ ; journalctl -b -1 --no-pager > prevboot_$(date +%Y%m%d).log
      check: "sosreport·vmcore-dmesg.txt(패닉)·직전 부팅 로그·코어 덤프 목록"
      note: "적용: RHEL 6/7 은 sosreport --batch · vmcore 는 메모리 내용(개인정보 포함 가능) · 민감정보 마스킹: 호스트명·IP·계정 가림, vmcore 전달은 별도 승인 · 전달 승인: 보안 담당"

- id: LNX-PROC-R5-CONNECTION
  products: [linux]
  category: connection
  match: [LNX-BOND-FAILOVER, LNX-NTP-UNREACHABLE, LNX-DNS-FAIL, LNX-NETDEV-WATCHDOG]
  title: 본딩 전환·NIC 송신 타임아웃·NTP·DNS 연결 실패 (Linux)
  source: "RHEL 8/9 'Configuring and managing networking (bonding, NetworkManager)'·'Configuring basic system settings (chrony)', RHEL 6/7 Networking Guide, ip(8)·ethtool(8)·resolv.conf(5)"
  stages:
  - stage: 1
    steps:
    - do: 인터페이스·본딩·NIC 오류 확인 (읽기 전용)
      cmd: |
        ip -s link show
        cat /proc/net/bonding/<bond> 2>/dev/null
        ethtool <iface> ; ethtool -S <iface> | grep -iE "err|drop|timeout" | head -20
      check: "슬레이브 MII Status down·Link Failure Count 증가, Link detected: no, 오류·timeout 카운터 증가면 링크·NIC 원인"
      note: "적용: RHEL 7+ (RHEL 6 은 ifconfig -a) · 권한: root"
    - do: DNS·NTP 도달성 확인
      cmd: |
        cat /etc/resolv.conf ; getent hosts <이름>
        dig @<DNS서버> <이름> +time=2 +tries=1
        chronyc sources -v 2>/dev/null || ntpq -pn
      check: "getent 결과 없음·dig timed out 이면 DNS 서버 도달 불가, Reach 0 이면 NTP 응답 없음"
      note: "적용: dig 는 bind-utils, chronyc 는 RHEL 7+, ntpq 는 RHEL 6 · 권한: 일반 사용자 가능(chronyc sources 는 root 권장)"
    - do: 커널 기록 확인
      cmd: |
        journalctl -k --since "-2 hours" | grep -iE "bond|NETDEV WATCHDOG|Link is Down|tx timeout" | tail -30
        grep -iE "bond|NETDEV WATCHDOG|Link is Down" /var/log/messages | tail -30
      check: "전환·타임아웃 반복 시각이 장애 시각과 일치하면 원인 확정"
      note: "적용: journalctl 은 RHEL 7+, /var/log/messages 는 RHEL 6 · 권한: root"
  - stage: 2
    steps:
    - do: 링크·본딩 슬레이브 복구
      cmd: |
        nmcli con show
        nmcli con up <slave-connection>
        ethtool -i <iface>
      check: "성공: /proc/net/bonding 의 모든 슬레이브 MII Status up · 실패: 다시 down → 케이블·스위치 포트 교체 또는 NIC 펌웨어 갱신"
      note: "사전조건: 네트워크 담당과 스위치 포트·LACP 상태 확인 · 영향: 활성 경로 전환 시 순간 패킷 손실 · 승인: 시스템·네트워크 담당 · 백업/롤백: /etc/sysconfig/network-scripts 또는 NetworkManager 연결 파일 백업 후 원복 · 적용: nmcli 는 RHEL 7+, RHEL 6 은 ifup <iface>"
    - do: DNS·NTP 설정 정정
      cmd: |
        nmcli con mod <con> ipv4.dns "<주DNS> <보조DNS>"
        nmcli con up <con>
        systemctl restart chronyd
      check: "성공: getent hosts 정상 응답, chronyc sources 에 '*' 동기 소스 표시 · 실패: 계속 실패 → 방화벽(UDP 53/123) 정책 확인"
      note: "사전조건: 정상 DNS·시간원 주소 확인, chrony.conf 의 server 항목 수정 · 영향: 연결 재적용 시 순간 끊김 · 승인: 시스템 담당 · 백업/롤백: /etc/resolv.conf·/etc/chrony.conf·연결 설정 백업 후 원복 · 적용: RHEL 7+ (RHEL 6 은 service ntpd restart)"
  - stage: 3
    steps:
    - do: 벤더(Red Hat·NIC 제조사) 의뢰 자료
      cmd: |
        sos report --batch
        ethtool -i <iface> > ethtool_$(date +%Y%m%d).txt ; ethtool -S <iface> >> ethtool_$(date +%Y%m%d).txt
      check: "sosreport·ethtool 드라이버/펌웨어·통계·커널 로그"
      note: "적용: RHEL 6/7 은 sosreport --batch · 민감정보 마스킹: 호스트명·IP·MAC·DNS 서버 주소 가림 후 전달 · 전달 승인: 보안 담당"

- id: LNX-PROC-R5-UPSTREAM
  products: [linux]
  category: upstream
  match: [LNX-NFS-NOT-RESPONDING]
  title: NFS 서버 응답 없음 (Linux NFS 클라이언트)
  source: "nfs(5)·nfsstat(8)·rpcinfo(8), RHEL 8/9 'Managing file systems › Mounting NFS shares', RHEL 6/7 Storage Administration Guide (NFS)"
  stages:
  - stage: 1
    steps:
    - do: 마운트 옵션·서버 응답 확인 (읽기 전용)
      cmd: |
        grep nfs /proc/mounts
        rpcinfo -t <server> nfs
        ping -c 3 <server>
      check: "rpcinfo 가 'ready and waiting' 이면 서버 응답 정상(네트워크 간헐 손실 의심), 실패면 서버·방화벽(2049/111) 문제"
      note: "적용: RHEL 6~9 · 마운트 경로에 ls·df 금지(hard 마운트면 멈춤) · NFSv4 전용 서버는 rpcbind 가 없을 수 있음 · 권한: 일반 사용자 가능"
    - do: 재전송·대기 프로세스 확인
      cmd: |
        nfsstat -rc
        ps -eo pid,stat,wchan:32,comm | awk '$2 ~ /^D/' | head -20
      check: "retrans 증가·D 상태 프로세스 다수면 NFS 대기로 서비스 정지 중 — 서버 담당 즉시 통보"
      note: "적용: RHEL 6~9 · 권한: root"
  - stage: 2
    steps:
    - do: 서버 복구 후 재연결 또는 지연 언마운트
      cmd: |
        umount -l /<mount>
        mount /<mount>
      check: "성공: grep nfs /proc/mounts 에 재등록·파일 접근 정상·D 상태 해소 · 실패: 서버 미복구 → 서버 담당·3차"
      note: "사전조건: NFS 서버 복구 확인, 사용 중 프로세스·업무 영향 확인 · 영향: 지연 언마운트 동안 해당 경로 사용 프로세스 오류 · 승인: 시스템·업무 담당 · 백업/롤백: /etc/fstab 사전 백업, 원래 옵션으로 재마운트"
  - stage: 3
    steps:
    - do: 의뢰 자료
      cmd: |
        nfsstat -c > nfsstat_$(date +%Y%m%d).txt ; grep nfs /proc/mounts > nfsmounts.txt
        sos report --batch
      check: "nfsstat·마운트 옵션·sosreport·서버 측 로그(서버 담당)"
      note: "민감정보 마스킹: 서버명·IP·export 경로 가림 후 전달 · 전달 승인: 보안 담당"

- id: LNX-PROC-R5-LOCK
  products: [linux]
  category: lock
  match: [LEG-RHEL-SOFTLOCKUP]
  title: CPU 소프트 락업 (Linux, 기존 도구 룰)
  source: "커널 문서 'Softlockup detector and hardlockup detector (watchdog)', RHEL 8/9 'Managing, monitoring and updating the kernel (kdump)'"
  stages:
  - stage: 1
    steps:
    - do: 락업 CPU·스택 확보 (읽기 전용)
      cmd: |
        journalctl -k --since "-2 hours" | grep -iE -A 25 "soft lockup" | tail -60
        grep -A 25 "soft lockup" /var/log/messages | tail -60
      check: "같은 모듈·함수가 반복되면 드라이버 원인, 여러 CPU·여러 함수면 가상화 지연·자원 경합 의심"
      note: "적용: journalctl 은 RHEL 7+, /var/log/messages 는 RHEL 6 · 권한: root"
    - do: CPU 지연·워치독 설정 확인
      cmd: |
        mpstat -P ALL 1 3
        sysctl kernel.watchdog_thresh kernel.softlockup_panic
        systemctl status kdump
      check: "%steal 지속 상승이면 호스트 과할당, kdump active 가 아니면 다음 락업 시 분석 자료 없음"
      note: "적용: mpstat 은 sysstat, systemctl 은 RHEL 7+ (RHEL 6 은 service kdump status) · 권한: root"
  - stage: 2
    steps:
    - do: 커널·드라이버 갱신 또는 분석용 패닉 설정
      cmd: |
        sysctl -w kernel.softlockup_panic=1
        grubby --default-kernel
      check: "성공: 갱신 후 락업 미발생, 또는 다음 락업 시 vmcore 확보 · 실패: 재발·vmcore 미생성 → kdump 점검 후 3차"
      note: "사전조건: kdump 정상 동작 확인, 벤더 지식베이스로 모듈 결함 확인 · 영향: softlockup_panic=1 이면 락업 시 즉시 재부팅(서비스 중단) · 승인: 시스템 담당·업무 담당 · 백업/롤백: sysctl -w kernel.softlockup_panic=0 으로 원복, 커널은 grubby --set-default 로 이전 커널"
  - stage: 3
    steps:
    - do: 벤더 의뢰 자료
      cmd: |
        sos report --batch
        journalctl -k --since "-1 day" > kernel_$(date +%Y%m%d).log
      check: "sosreport·락업 스택이 담긴 커널 로그·vmcore(있으면)"
      note: "적용: RHEL 6/7 은 sosreport --batch · 민감정보 마스킹: 호스트명·IP 가림, vmcore 는 별도 전달 승인 · 전달 승인: 보안 담당"

- id: LNX-PROC-R5-PERFORMANCE
  products: [linux]
  category: performance
  match: [LEG-RHEL-NFS]
  title: NFS 마운트 오류·응답 지연·Stale file handle (Linux, 기존 도구 룰)
  source: "nfs(5)·nfsstat(8)·mount(8), RHEL 8/9 'Managing file systems › Mounting NFS shares'"
  stages:
  - stage: 1
    steps:
    - do: 오류 종류·마운트 옵션 확인 (읽기 전용)
      cmd: |
        journalctl -k --since "-2 hours" | grep -iE "nfs|rpc|Stale" | tail -30
        grep nfs /proc/mounts
      check: "'not responding' 이면 서버/네트워크, 'Stale file handle' 이면 서버 측 export·파일 재생성, 'mount failed' 면 권한·export·방화벽"
      note: "적용: journalctl 은 RHEL 7+ (RHEL 6 은 /var/log/messages) · 권한: root"
    - do: 서버 export·응답 확인
      cmd: |
        showmount -e <server>
        rpcinfo -t <server> nfs
        nfsstat -rc
      check: "export 목록에 대상 경로·클라이언트가 있고 rpcinfo 응답 정상이면 클라이언트 측 원인, retrans 증가면 네트워크 손실"
      note: "적용: NFSv3 서버(showmount·rpcinfo), NFSv4 전용은 서버 담당 확인 · 권한: 일반 사용자 가능"
  - stage: 2
    steps:
    - do: Stale 핸들·실패 마운트 복구
      cmd: |
        umount -l /<mount>
        mount /<mount>
      check: "성공: 파일 접근 정상·Stale 오류 소멸 · 실패: mount 오류(access denied·timed out) → 서버 export·방화벽 담당"
      note: "사전조건: 서버 측 export·서비스 정상 확인, 사용 프로세스 영향 확인 · 영향: 재마운트 동안 해당 경로 접근 실패 · 승인: 시스템·업무 담당 · 백업/롤백: /etc/fstab 백업, 원래 옵션으로 재마운트"
  - stage: 3
    steps:
    - do: 의뢰 자료
      cmd: |
        nfsstat -c > nfsstat_$(date +%Y%m%d).txt ; grep nfs /proc/mounts > nfsmounts.txt
      check: "nfsstat·마운트 옵션·커널 로그"
      note: "민감정보 마스킹: 서버명·IP·export 경로 가림 후 전달 · 전달 승인: 보안 담당"

# ── auditd ──
- id: AUD-PROC-R5-INTERNAL
  products: [auditd]
  category: internal
  match: [OS-AUD-002, OS-AUD-005]
  title: 프로세스 비정상 종료(ANOM_ABEND)·시스템 종료/서비스 중지 감사 기록 (auditd)
  source: "ausearch(8)·aureport(8)·auditctl(8)·auditd.conf(5) man 페이지, RHEL 8/9 'Security hardening › Auditing the system'"
  stages:
  - stage: 1
    steps:
    - do: 감사 기록에서 종료 프로세스·중지 주체 확인 (읽기 전용)
      cmd: |
        ausearch -m ANOM_ABEND -ts today -i | tail -40
        ausearch -m SYSTEM_SHUTDOWN,SERVICE_STOP -ts today -i | tail -40
        aureport --summary -i -ts today
      check: "ANOM_ABEND 의 comm/exe 가 업무 서비스면 서비스 기동 상태 확인 필요, SERVICE_STOP 의 auid 가 계획 작업자가 아니면 비인가 중지 의심"
      note: "적용: auditd 2.x~3.x (RHEL 6~9, Ubuntu 는 auditd 설치 시) · 권한: root"
    - do: 서비스 상태·코어 확보 여부 확인
      cmd: |
        systemctl status <service> --no-pager
        coredumpctl list | tail -5
        auditctl -s
      check: "서비스 inactive/failed 면 2차 복구 필요, auditctl -s 의 lost 증가면 감사 기록 일부 유실"
      note: "적용: systemctl 은 RHEL 7+ (RHEL 6 은 service <svc> status), coredumpctl 은 RHEL 8+ · 권한: root"
  - stage: 2
    steps:
    - do: 서비스 복구와 코어 수집 설정
      cmd: |
        systemctl start <service>
        systemctl edit <service>
      check: "성공: systemctl is-active = active, 같은 ANOM_ABEND 재발 없음 · 실패: 반복 종료 → 코어 분석 후 공급업체 의뢰"
      note: "사전조건: 비인가 중지면 보안 담당 확인 후 기동, 코어 수집은 drop-in 에 LimitCORE=infinity · 영향: 기동 중 일시 지연, 코어 파일 디스크 사용 · 승인: 서비스 담당(비인가 건은 보안 담당) · 백업/롤백: drop-in 삭제 후 systemctl daemon-reload"
  - stage: 3
    steps:
    - do: 감사 기록 전달 자료
      cmd: |
        ausearch -m ANOM_ABEND,SYSTEM_SHUTDOWN,SERVICE_STOP -ts today --raw > audit_$(date +%Y%m%d).log
      check: "원시 감사 기록(raw)·aureport 요약"
      note: "감사 로그는 계정·명령 기록 포함 — 민감정보 마스킹: 계정명·호스트명·IP 가림 후 전달 · 전달 승인: 보안 담당"

# ── Windows ──
- id: WIN-PROC-R5-STORAGE
  products: [windows]
  category: storage
  match: ['57', '5120', '98', '129', '157', '55', '153', OS-WIN-007]
  title: NTFS 손상·플러시 실패·저장 경로 지연·CSV 접근 실패 (Windows Server)
  source: "Microsoft Learn — chkdsk·Repair-Volume·Get-Volume·Get-PhysicalDisk, 'Troubleshoot data corruption and disk errors', 'Windows Server MPIO troubleshooting', 'Event 5120/5142 access ClusterStorage folder'"
  stages:
  - stage: 1
    steps:
    - do: 디스크·NTFS·스토리지 이벤트 시간순 확인 (읽기 전용)
      cmd: |
        Get-WinEvent -FilterHashtable @{LogName="System"; Id=7,11,51,55,57,98,129,140,153,157; StartTime=(Get-Date).AddHours(-24)} -ErrorAction SilentlyContinue | Sort-Object TimeCreated | Format-Table TimeCreated,Id,ProviderName -AutoSize
        Get-WinEvent -FilterHashtable @{LogName="System"; Id=5120,5142; StartTime=(Get-Date).AddHours(-24)} -ErrorAction SilentlyContinue | Format-List TimeCreated,Id,Message
      check: "Storport 129·Disk 153 이 먼저 반복되고 Ntfs 57/140/55 가 뒤따르면 저장 경로 지연이 원인, Disk 7/11 이면 디스크·컨트롤러 결함, 157 이면 디스크 제거"
      note: "적용: Windows Server 2008 R2+ (Get-WinEvent), 2003 은 이벤트 뷰어 · 권한: 관리자"
    - do: 볼륨·디스크·경로 상태 확인
      cmd: |
        fsutil dirty query <드라이브>:
        Get-Volume | Format-Table DriveLetter,FileSystem,HealthStatus,OperationalStatus,SizeRemaining
        Get-PhysicalDisk | Format-Table FriendlyName,BusType,HealthStatus,OperationalStatus
        mpclaim -s -d
      check: "dirty 설정·HealthStatus Warning/Unhealthy 면 손상·장애 확정, mpclaim 경로 수가 설계보다 적으면 경로 장애"
      note: "적용: Get-Volume/Get-PhysicalDisk 는 2012+, mpclaim 은 MPIO 기능 설치 시 · 권한: 관리자"
    - do: 클러스터 공유 볼륨(CSV) 상태 확인
      cmd: |
        Get-ClusterSharedVolume | Format-Table Name,State,OwnerNode
        Get-ClusterSharedVolumeState | Format-Table Name,Node,StateInfo,FileSystemRedirectedIOReason,BlockRedirectedIOReason
      check: "StateInfo 가 Direct 가 아니고 FileSystemRedirected·BlockRedirected·Unavailable 이면 CSV 경로 이상"
      note: "적용: 장애 조치 클러스터 2012+ · 권한: 클러스터 관리자"
  - stage: 2
    steps:
    - do: 파일시스템 검사·복구
      cmd: |
        chkdsk <드라이브>: /scan
        chkdsk <드라이브>: /spotfix
        chkdsk <드라이브>: /f
      check: "성공: chkdsk 종료 코드 0·fsutil dirty query 결과 NOT Dirty · 실패: 종료 코드 3 또는 오류 반복 → 하드웨어 진단·백업 복원"
      note: "사전조건: 하위 디스크·경로 오류 해소, 최신 백업 확인 · 영향: /scan 은 I/O 부하, /spotfix·/f 는 볼륨 잠금(시스템 볼륨은 재부팅 시 실행) · 승인: 시스템 담당·업무 담당 · 백업/롤백: 수리 전 백업, 실패 시 백업 복원 · 적용: /scan·/spotfix 는 2012+ NTFS"
    - do: CSV 어댑터 바인딩·저장 경로 복구
      cmd: |
        Get-NetAdapterBinding -ComponentID ms_msclient,ms_server | Format-Table Name,ComponentID,Enabled
        Enable-NetAdapterBinding -Name "<클러스터 NIC>" -ComponentID ms_server
        Get-CimInstance Win32_SCSIController | Format-Table Name,DriverName,Status
      check: "성공: Get-ClusterSharedVolumeState 의 StateInfo = Direct, 5120 재발 없음 · 실패: 계속 Redirected → 스토리지 경로·HBA 드라이버 점검 후 3차"
      note: "사전조건: 클러스터 네트워크 역할 확인, 스토리지 담당과 경로 복구 · 영향: 바인딩 변경 시 해당 NIC 순간 재구성 · 승인: 시스템·스토리지 담당 · 백업/롤백: 변경 전 Get-NetAdapterBinding 결과 저장, Disable-NetAdapterBinding 으로 원복 · 적용: 2012+"
  - stage: 3
    steps:
    - do: Microsoft·스토리지 벤더 의뢰 자료
      cmd: |
        wevtutil epl System C:\temp\System_<날짜>.evtx
        Get-ClusterLog -Destination C:\temp -TimeSpan 120
        msinfo32 /report C:\temp\msinfo_<날짜>.txt
      check: "System 이벤트(evtx)·클러스터 로그·시스템 정보·스토리지 벤더 진단 결과"
      note: "민감정보 마스킹: 서버명·IP·계정·공유 경로 가림 후 전달 · 전달 승인: 보안 담당"

- id: WIN-PROC-R5-CONNECTION
  products: [windows]
  category: connection
  match: ['134', '1014', '1135', '2012', '10028', '5719', '4199', '1129']
  title: 시간 서버·DNS·DC 연결·클러스터 하트비트·IP 충돌 등 연결 실패 (Windows Server)
  source: "Microsoft Learn — w32tm, Resolve-DnsName·Test-NetConnection, 'Troubleshoot cluster event ID 1135', 'Event 4199', Group Policy 문제 해결 지침, nltest"
  stages:
  - stage: 1
    steps:
    - do: 연결 관련 이벤트 확인 (읽기 전용)
      cmd: |
        Get-WinEvent -FilterHashtable @{LogName="System"; Id=134,1014,1135,2012,10028,5719,4199; StartTime=(Get-Date).AddHours(-24)} -ErrorAction SilentlyContinue | Sort-Object TimeCreated | Format-Table TimeCreated,Id,ProviderName -AutoSize
        Get-WinEvent -LogName "Microsoft-Windows-GroupPolicy/Operational" -MaxEvents 30 | Where-Object Level -le 3 | Format-List TimeCreated,Id,Message
      check: "같은 시각 여러 ID 가 몰리면 NIC·스위치·DNS 공통 원인, 단일 ID 반복이면 해당 대상(시간원·DNS·DC·노드) 문제"
      note: "적용: 2008 R2+ · 권한: 관리자"
    - do: NIC·IP·DNS 설정 확인
      cmd: |
        Get-NetAdapter | Format-Table Name,Status,LinkSpeed
        Get-NetIPAddress -AddressFamily IPv4 | Format-Table InterfaceAlias,IPAddress,AddressState
        Get-DnsClientServerAddress -AddressFamily IPv4 | Format-Table InterfaceAlias,ServerAddresses
      check: "Status Disconnected, AddressState Duplicate, DNS 서버 목록 오류가 있으면 해당 항목이 원인"
      note: "적용: 2012+ (2008 R2 는 ipconfig /all) · 권한: 일반 사용자 가능"
    - do: 시간원·DNS·DC 도달성 확인
      cmd: |
        w32tm /query /status
        Resolve-DnsName <이름> -Server <DNS서버> -DnsOnly
        nltest /dsgetdc:<도메인>
        Test-NetConnection <대상> -Port 389
      check: "w32tm Source 가 Local CMOS Clock 이면 시간원 미동기, Resolve-DnsName 시간 초과면 DNS, nltest 실패·389 불통이면 DC 연결 문제"
      note: "적용: Resolve-DnsName 2012+, Test-NetConnection 2012 R2+ · 권한: 일반 사용자 가능"
  - stage: 2
    steps:
    - do: DNS·시간원 설정 정정
      cmd: |
        Set-DnsClientServerAddress -InterfaceAlias "<NIC>" -ServerAddresses <주DNS>,<보조DNS>
        w32tm /config /manualpeerlist:"<NTP서버>,0x8" /syncfromflags:manual /update
        w32tm /resync
      check: "성공: Resolve-DnsName 정상·w32tm /query /status 의 Source 가 지정 서버, 1014/134 재발 없음 · 실패: 계속 실패 → 방화벽(UDP 53/123) 담당"
      note: "사전조건: 정상 DNS·시간원 확인, 도메인 구성원은 manualpeerlist 대신 도메인 계층 유지(PDC 에뮬레이터만 외부 시간원) · 영향: 이름 해석·시간 변경 · 승인: 시스템 담당·AD 담당 · 백업/롤백: 변경 전 Get-DnsClientServerAddress·w32tm /query /configuration 결과 저장 후 원복"
    - do: IP 충돌·하트비트 조치
      cmd: |
        Get-NetNeighbor -IPAddress <IP>
        (Get-Cluster).SameSubnetThreshold
      check: "성공: 4199/1135 재발 없음 · 실패: 충돌 지속 → 네트워크 담당과 상대 장비 차단, 1135 지속 → NIC·스위치 교체 검토"
      note: "사전조건: 충돌 상대 장비 소유 확인, 하트비트 임계 조정은 Microsoft 1135 문서 권장 범위 · 영향: IP 재할당 시 서비스 주소 변경, 임계 상향 시 장애 감지 지연 · 승인: 시스템·네트워크 담당 · 백업/롤백: 변경 전 값 기록 후 원복"
  - stage: 3
    steps:
    - do: Microsoft 의뢰 자료
      cmd: |
        ipconfig /all > C:\temp\ipconfig_<날짜>.txt
        Get-ClusterLog -Destination C:\temp -TimeSpan 120
        wevtutil epl System C:\temp\System_<날짜>.evtx
      check: "ipconfig·클러스터 로그·System 이벤트"
      note: "민감정보 마스킹: 서버명·IP·MAC·도메인명 가림 후 전달 · 전달 승인: 보안 담당"

- id: WIN-PROC-R5-MEMORY
  products: [windows]
  category: memory
  match: ['2004', '2019', '2020']
  title: 가상 메모리 부족·비페이징/페이징 풀 고갈 (Windows Server)
  source: "Microsoft Learn — 'Insufficient virtual memory (0x8007000E)', Resource-Exhaustion-Detector 2004, 성능 카운터(Memory\\Pool Nonpaged Bytes·Committed Bytes)"
  stages:
  - stage: 1
    steps:
    - do: 메모리 고갈 이벤트·커밋·풀 사용량 확인 (읽기 전용)
      cmd: |
        Get-WinEvent -FilterHashtable @{LogName="System"; Id=2004,2019,2020} -MaxEvents 10 -ErrorAction SilentlyContinue | Format-List TimeCreated,Id,Message
        Get-Counter "\Memory\Committed Bytes","\Memory\Commit Limit","\Memory\Pool Nonpaged Bytes","\Memory\Pool Paged Bytes","\Memory\Available MBytes"
      check: "Committed/Commit Limit 90% 이상이면 커밋 고갈(2004), Pool Nonpaged/Paged 가 평소 대비 급증이면 커널 풀 누수(2019/2020)"
      note: "적용: 2008 R2+ · 권한: 관리자"
    - do: 상위 프로세스 확인
      cmd: |
        Get-Process | Sort-Object PagedMemorySize64 -Descending | Select-Object -First 10 Name,Id,PagedMemorySize64,WorkingSet64,HandleCount
        Get-Process | Sort-Object NonpagedSystemMemorySize64 -Descending | Select-Object -First 10 Name,Id,NonpagedSystemMemorySize64,HandleCount
        Get-CimInstance Win32_PageFileUsage | Format-Table Name,AllocatedBaseSize,CurrentUsage,PeakUsage
      check: "특정 프로세스의 Private(PagedMemorySize64)·HandleCount 가 계속 증가하면 누수, 프로세스 합계로 설명 안 되는 풀 증가는 드라이버 누수"
      note: "적용: 2008 R2+ · 권한: 관리자"
  - stage: 2
    steps:
    - do: 누수 프로세스 정리·페이지 파일 조정
      cmd: |
        Restart-Service <서비스>
        Get-CimInstance Win32_ComputerSystem | Format-List AutomaticManagedPagefile
      check: "성공: 커밋 사용률 80% 이하·2004/2019/2020 재발 없음 · 실패: 재발 → 드라이버 풀 태그 분석(3차)"
      note: "사전조건: 누수 프로세스 담당과 재기동 일정 협의 · 영향: 서비스 재기동 중단, 페이지 파일 변경은 재부팅 필요 · 승인: 서비스 담당·시스템 담당 · 백업/롤백: 변경 전 페이지 파일 설정 기록 후 원복"
  - stage: 3
    steps:
    - do: Microsoft 의뢰 자료
      cmd: |
        Get-Counter "\Memory\*","\Process(*)\Private Bytes" -SampleInterval 15 -MaxSamples 240 | Export-Counter -Path C:\temp\mem_<날짜>.blg
        wevtutil epl System C:\temp\System_<날짜>.evtx
      check: "성능 카운터(blg 1시간)·System 이벤트·(필요 시) 메모리 덤프"
      note: "메모리 덤프는 업무 데이터 포함 가능 — 민감정보 마스킹: 서버명·계정 가림, 덤프 전달은 별도 승인 · 전달 승인: 보안 담당"

- id: WIN-PROC-R5-CAPACITY
  products: [windows]
  category: capacity
  match: ['2011', '4227', '4231']
  title: Server 서비스 IRPStackSize 부족·TCP 동적 포트 고갈 (Windows Server)
  source: "Microsoft Learn — IRPStackSize(LanmanServer\\Parameters), netsh int ipv4 dynamicport, Get-NetTCPConnection"
  stages:
  - stage: 1
    steps:
    - do: 포트 사용 현황 확인 (읽기 전용)
      cmd: |
        Get-NetTCPConnection | Group-Object State | Sort-Object Count -Descending | Format-Table Name,Count
        Get-NetTCPConnection | Group-Object OwningProcess | Sort-Object Count -Descending | Select-Object -First 10 Name,Count
        netsh int ipv4 show dynamicport tcp
      check: "동적 포트 범위(기본 49152 부터 16384개) 대비 연결 수가 근접하고 특정 PID 가 대부분이면 그 프로세스의 연결 누수"
      note: "적용: Get-NetTCPConnection 은 2012+ (2008 R2 는 netstat -ano) · 권한: 관리자"
    - do: IRPStackSize·필터 드라이버 확인
      cmd: |
        Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters" -Name IRPStackSize -ErrorAction SilentlyContinue
        fltmc filters
      check: "IRPStackSize 미설정이고 필터 드라이버가 많으면 2011 원인 후보"
      note: "적용: 2008 R2+ · 권한: 관리자"
  - stage: 2
    steps:
    - do: 동적 포트 범위 확대 또는 IRPStackSize 상향
      cmd: |
        netsh int ipv4 set dynamicport tcp start=<시작> num=<개수>
        Set-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters" -Name IRPStackSize -Value <값> -Type DWord
      check: "성공: 4227/4231/2011 재발 없음 · 실패: 재발 → 연결 누수 프로세스 수정(공급업체)"
      note: "사전조건: 확대할 포트 범위가 다른 서비스 리슨 포트와 겹치지 않는지 확인, 연결 누수 원인 병행 조사 · 영향: IRPStackSize 는 Server 서비스 재시작 또는 재부팅 필요 · 승인: 시스템 담당 · 백업/롤백: 변경 전 show dynamicport 결과·레지스트리 값 기록 후 원복(값 삭제)"
  - stage: 3
    steps:
    - do: 의뢰 자료
      cmd: |
        netstat -ano > C:\temp\netstat_<날짜>.txt
        wevtutil epl System C:\temp\System_<날짜>.evtx
      check: "연결 목록·System 이벤트"
      note: "민감정보 마스킹: 원격 IP·서버명 가림 후 전달 · 전달 승인: 보안 담당"

- id: WIN-PROC-R5-UPSTREAM
  products: [windows]
  category: upstream
  match: ['4013', '1058', '1030']
  title: AD DS 복제 대기(DNS 4013)·그룹 정책 SYSVOL/GPO 조회 실패 (Windows Server)
  source: "Microsoft Learn — 'Troubleshoot DNS event ID 4013', 'Userenv errors occur and events are logged', Group Policy 문제 해결 지침, repadmin·dcdiag"
  stages:
  - stage: 1
    steps:
    - do: AD 복제·DNS 상태 확인 (읽기 전용)
      cmd: |
        repadmin /replsummary
        repadmin /showrepl <DC>
        dcdiag /test:dns
      check: "복제 실패·마지막 성공 시각이 오래됐거나 dcdiag DNS 실패면 AD/DNS 원인"
      note: "적용: DC 또는 RSAT AD DS 도구 설치 서버, 2008 R2+ · 권한: 도메인 관리자(조회)"
    - do: 그룹 정책 처리 상태 확인
      cmd: |
        Get-WinEvent -LogName "Microsoft-Windows-GroupPolicy/Operational" -MaxEvents 30 | Where-Object Level -le 3 | Format-List TimeCreated,Id,Message
        gpresult /r
        nltest /dsgetdc:<도메인>
      check: "SYSVOL 경로 접근 실패·DC 탐색 실패가 보이면 해당 원인, gpresult 의 마지막 적용 시각이 오래됐으면 정책 미적용 상태"
      note: "적용: 2008 R2+ · 권한: 관리자"
  - stage: 2
    steps:
    - do: DC DNS 구성 정정·그룹 정책 재적용
      cmd: |
        Set-DnsClientServerAddress -InterfaceAlias "<NIC>" -ServerAddresses <다른 DC>,127.0.0.1
        gpupdate /force
      check: "성공: 4013 미발생·gpresult 적용 시각 갱신·1058/1030 재발 없음 · 실패: 복제 실패 지속 → AD 담당·3차"
      note: "사전조건: 정상 복제 파트너 DC 확인, 오래된 DC 메타데이터 정리는 AD 담당 별도 승인 · 영향: DC 이름 해석 경로 변경 · 승인: AD 담당 · 백업/롤백: 변경 전 DNS 서버 목록·gpresult /h 보고서 보관 후 원복"
  - stage: 3
    steps:
    - do: Microsoft 의뢰 자료
      cmd: |
        dcdiag /v > C:\temp\dcdiag_<날짜>.txt
        repadmin /showrepl * /csv > C:\temp\showrepl_<날짜>.csv
        gpresult /h C:\temp\gpresult_<날짜>.html
      check: "dcdiag·복제 상태·gpresult 보고서·DNS Server 이벤트"
      note: "민감정보 마스킹: 도메인명·DC 이름·계정·IP 가림 후 전달 · 전달 승인: 보안 담당"

- id: WIN-PROC-R5-SECURITY
  products: [windows]
  category: security
  match: ['4625', '4740', '10016', '12294', '36871', '36887', '36888', '4771', '5722', '40960', '40961', '7038', '7045', '36874', '36870', '1053', OS-WIN-SEC-001, OS-WIN-SEC-002, OS-WIN-SEC-003]
  title: 인증 실패·계정 잠금·감사 로그 삭제·TLS(Schannel)·서비스 설치/계정·보안 채널 (Windows Server)
  source: "Microsoft Learn — 보안 감사 이벤트 4625·4740·4771 문서, 'Event ID 5722', Schannel/TLS 문제 해결, 'Event 10016 logged when accessing DCOM', Test-ComputerSecureChannel"
  stages:
  - stage: 1
    steps:
    - do: 인증 실패·잠금·감사 로그 삭제 확인 (읽기 전용)
      cmd: |
        Get-WinEvent -FilterHashtable @{LogName="Security"; Id=4625,4740,4771,1102; StartTime=(Get-Date).AddHours(-2)} -ErrorAction SilentlyContinue | Group-Object Id | Format-Table Name,Count
        Get-WinEvent -FilterHashtable @{LogName="Security"; Id=4740,1102} -MaxEvents 10 -ErrorAction SilentlyContinue | Format-List TimeCreated,Id,Message
      check: "4625 다수가 한 출처면 대입 공격 의심, 4740 은 Caller Computer 확인, 1102 는 승인된 작업이 아니면 보안 사고로 즉시 보고"
      note: "적용: 2008 R2+ (4740·4771 은 DC/PDC 에서) · 권한: 관리자(보안 로그 읽기)"
    - do: TLS·인증서 상태 확인
      cmd: |
        Get-WinEvent -FilterHashtable @{LogName="System"; ProviderName="Schannel"; StartTime=(Get-Date).AddHours(-24)} -ErrorAction SilentlyContinue | Group-Object Id | Format-Table Name,Count
        Get-ChildItem Cert:\LocalMachine\My | Format-Table Subject,NotAfter,HasPrivateKey,Thumbprint
      check: "36870 은 개인 키 권한, 36871/36874 는 프로토콜·암호군, 36887/36888 은 경고 코드로 원인 구분 — 인증서 만료·HasPrivateKey False 면 확정"
      note: "적용: 2008 R2+ · 권한: 관리자"
    - do: 서비스 설치·서비스 계정·보안 채널 확인
      cmd: |
        Get-WinEvent -FilterHashtable @{LogName="System"; Id=7045,7038,5722,40960,40961; StartTime=(Get-Date).AddHours(-24)} -ErrorAction SilentlyContinue | Format-List TimeCreated,Id,Message
        Test-ComputerSecureChannel -Verbose
      check: "7045 의 경로가 서명 없음·임시 폴더면 침해 의심, 7038 은 계정 비밀번호·잠김, Test-ComputerSecureChannel False 면 보안 채널 손상"
      note: "적용: 2012+ (Test-ComputerSecureChannel 은 PowerShell 3.0+) · -Repair 는 2차 · 권한: 관리자"
  - stage: 2
    steps:
    - do: 공격 출처 차단·계정 잠금 해제
      cmd: |
        New-NetFirewallRule -DisplayName "Block-<출처>" -Direction Inbound -RemoteAddress <IP> -Action Block
        Unlock-ADAccount <user>
      check: "성공: 해당 출처 4625 중단·정당 사용자 로그온 정상 · 실패: 다른 출처로 계속 → 경계 장비 차단·계정 비밀번호 변경"
      note: "사전조건: 보안 담당이 공격 여부 판정, 잠금 원천(저장 자격 증명) 제거 후 해제 · 영향: 차단 IP 의 정상 사용 불가 · 승인: 보안 담당 · 백업/롤백: Remove-NetFirewallRule -DisplayName \"Block-<출처>\" 로 원복"
    - do: TLS 설정·인증서 키 권한·보안 채널 복구
      cmd: |
        reg export "HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL" C:\temp\schannel_backup.reg
        Test-ComputerSecureChannel -Repair -Credential <도메인관리자>
      check: "성공: Schannel 오류 재발 없음·Test-ComputerSecureChannel True · 실패: 계속 오류 → 상대 시스템 TLS 설정 대조 또는 도메인 재가입"
      note: "사전조건: 통신 상대의 지원 TLS 버전·암호군 확인 · 영향: SCHANNEL 변경은 재부팅 필요, 보안 채널 재설정 중 도메인 인증 일시 실패 · 승인: 보안 담당·시스템 담당 · 백업/롤백: 내보낸 .reg 파일 가져오기로 원복"
    - do: 비인가 서비스 정리
      cmd: |
        sc.exe qc <서비스>
        sc.exe stop <서비스>
        sc.exe delete <서비스>
      check: "성공: 서비스 제거·재생성 없음 · 실패: 다시 생성됨 → 침해 대응(3차·보안 담당)"
      note: "사전조건: 보안 담당이 비인가 판정, 파일·레지스트리·이벤트 증거 보존 · 영향: 해당 서비스 기능 중단 · 승인: 보안 담당 · 백업/롤백: sc.exe qc 결과와 서비스 파일 사본 보관(필요 시 sc.exe create 로 재등록)"
  - stage: 3
    steps:
    - do: 보안 사고·Microsoft 의뢰 자료
      cmd: |
        wevtutil epl Security C:\temp\Security_<날짜>.evtx
        wevtutil epl System C:\temp\System_<날짜>.evtx
      check: "Security·System 이벤트(evtx)·의심 파일 해시·인증서 정보"
      note: "Security 로그는 계정·IP 등 개인정보 포함 — 민감정보 마스킹: 계정·IP·컴퓨터명 가림, 원본 반출은 보안 담당 결정 · 전달 승인: 보안 담당"

- id: WIN-PROC-R5-THREAD
  products: [windows]
  category: thread
  match: ['7011']
  title: 서비스 응답 시간 초과 (SCM 7011, Windows Server)
  source: "Microsoft Learn — 'A service does not start, and events 7000 and 7011 are logged' (ServicesPipeTimeout)"
  stages:
  - stage: 1
    steps:
    - do: 시간 초과 서비스·부하 확인 (읽기 전용)
      cmd: |
        Get-WinEvent -FilterHashtable @{LogName="System"; Id=7011,7009,7000} -MaxEvents 20 -ErrorAction SilentlyContinue | Format-List TimeCreated,Id,Message
        Get-Counter "\Processor(_Total)\% Processor Time","\PhysicalDisk(_Total)\Avg. Disk sec/Transfer" -SampleInterval 2 -MaxSamples 5
      check: "같은 서비스 반복이면 해당 서비스 행, 여러 서비스 동시면 CPU·디스크 지연 등 시스템 원인"
      note: "적용: 2008 R2+ · 권한: 관리자"
    - do: 서비스 프로세스·설정 확인
      cmd: |
        sc.exe queryex <서비스>
        Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control -Name ServicesPipeTimeout -ErrorAction SilentlyContinue
      check: "STATE 가 STOP_PENDING/START_PENDING 으로 머물면 행, ServicesPipeTimeout 값 없으면 기본값"
      note: "적용: 2008 R2+ · 권한: 관리자"
  - stage: 2
    steps:
    - do: 덤프 확보 후 서비스 재기동·타임아웃 조정
      cmd: |
        Restart-Service <서비스>
        Set-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control -Name ServicesPipeTimeout -Value 60000 -Type DWord
      check: "성공: 7011 재발 없음·서비스 Running · 실패: 재발 → 덤프 분석(공급업체)"
      note: "사전조건: 작업 관리자 '덤프 파일 만들기'로 행 덤프 확보, 근본 원인 조사 병행(Microsoft 권고) · 영향: 서비스 중단, ServicesPipeTimeout 은 재부팅 후 적용 · 승인: 서비스 담당·시스템 담당 · 백업/롤백: Remove-ItemProperty 로 값 삭제(기본값 복귀)"
  - stage: 3
    steps:
    - do: 공급업체 의뢰 자료
      cmd: |
        wevtutil epl System C:\temp\System_<날짜>.evtx
      check: "System 이벤트·서비스 행 덤프·서비스 자체 로그"
      note: "덤프는 메모리 내용(업무 데이터) 포함 — 민감정보 마스킹: 서버명·계정 가림, 덤프 전달은 별도 승인 · 전달 승인: 보안 담당"

- id: WIN-PROC-R5-PERFORMANCE
  products: [windows]
  category: performance
  match: [OS-WIN-005, OS-WIN-006]
  title: CPU 속도 제한(펌웨어 전원 관리)·ESE 데이터베이스 디스크 지연 (Windows Server)
  source: "Microsoft Learn — powercfg, 성능 카운터(Processor Information·PhysicalDisk), ESENT 이벤트(507~510·533) 설명"
  stages:
  - stage: 1
    steps:
    - do: CPU 성능 제한·전원 계획 확인 (읽기 전용)
      cmd: |
        Get-WinEvent -FilterHashtable @{LogName="System"; Id=37; ProviderName="Microsoft-Windows-Kernel-Processor-Power"} -MaxEvents 10 -ErrorAction SilentlyContinue | Format-List TimeCreated,Message
        powercfg /getactivescheme
        Get-Counter "\Processor Information(_Total)\% Processor Performance" -SampleInterval 2 -MaxSamples 5
      check: "% Processor Performance 가 100 미만으로 지속되고 37 이 반복되면 펌웨어·전원 제한, 활성 계획이 균형 조정이면 OS 쪽 절전 영향"
      note: "적용: 2012+ · 권한: 관리자"
    - do: ESE 디스크 지연 확인
      cmd: |
        Get-WinEvent -FilterHashtable @{LogName="Application"; ProviderName="ESENT"; Id=507,508,509,510,533} -MaxEvents 20 -ErrorAction SilentlyContinue | Format-List TimeCreated,Id,Message
        Get-Counter "\PhysicalDisk(*)\Avg. Disk sec/Transfer","\PhysicalDisk(*)\Current Disk Queue Length" -SampleInterval 2 -MaxSamples 5
      check: "Avg. Disk sec/Transfer 가 0.025(25ms) 이상 지속이면 디스크 지연 확정, 해당 볼륨의 Disk 153·Storport 129 동반 여부 확인"
      note: "적용: 2008 R2+ · 권한: 관리자"
  - stage: 2
    steps:
    - do: 전원 계획 고성능 전환·저장소 지연 해소
      cmd: |
        powercfg /setactive SCHEME_MIN
      check: "성공: % Processor Performance 100 근처·37 재발 없음, ESE 지연 이벤트 감소 · 실패: 지속 → BIOS 전원 프로필(벤더)·스토리지 경로 점검"
      note: "사전조건: BMC 의 전원·온도 경고가 없는지 확인 · 영향: 전력 사용 증가 · 승인: 시스템 담당 · 백업/롤백: 변경 전 powercfg /getactivescheme 의 GUID 기록 후 powercfg /setactive <GUID> 로 원복"
  - stage: 3
    steps:
    - do: Microsoft·하드웨어 벤더 의뢰 자료
      cmd: |
        Get-Counter "\Processor Information(*)\% Processor Performance","\PhysicalDisk(*)\Avg. Disk sec/Transfer" -SampleInterval 15 -MaxSamples 240 | Export-Counter -Path C:\temp\perf_<날짜>.blg
        msinfo32 /report C:\temp\msinfo_<날짜>.txt
      check: "성능 카운터(blg)·시스템 정보·BMC 이벤트 로그"
      note: "민감정보 마스킹: 서버명·IP 가림 후 전달 · 전달 승인: 보안 담당"
