# 아이디어 3(2026-10-16) — WEB 묶음: '같은 제품·유형'으로만 붙던 판정 중 기존 절차가 실제로 맞는 것만 '이 판정 전용'으로 잇는다.
# 판정 기준: 그 절차의 1차(읽기 전용) 확인이 이 판정의 원인을 가려내고, 2차 조치가 이 판정의 해결책과 같은 방향일 것.
# 맞지 않는 판정은 r6_web_procedures.yaml 의 전용 절차로 옮겼다(절차 파일은 고치지 않는다).
