# SW 계층 조치 절차 카탈로그 — Java(JDK Troubleshooting Guide) · MESIM(메타빌드) · BizMaster(Tmax) · Indigo ESB · 공통 (2026-09-11)
# 2026-10-16 안전 강화(GPT 45차 관문): 1차 = 읽기 전용·적용 버전·권한 명시 / 2차 = 사전조건·영향·승인·백업/롤백 + 성공/실패 판단 / 3차 = 민감정보 마스킹·전달 승인
procedures:
# ── Java / JVM ──
- id: JAVA-PROC-MEMORY
  products: [java, sw-common, was-common]
  category: memory
  match: [SW-JAVA-001, APP-MEM-019, LEG-COM-JAVA-OOM, java.lang.OutOfMemoryError, java.lang.StackOverflowError, APP-RECURSION-004]
  title: JVM OutOfMemoryError (힙·Metaspace·native thread·Direct buffer) · StackOverflowError
  source: "Oracle JDK 17 Troubleshooting Guide '3 Troubleshoot Memory Leaks (jcmd GC.heap_dump, -XX:+HeapDumpOnOutOfMemoryError)'·'2 Diagnostic Tools (jcmd, jstat, jmap)' — docs.oracle.com/en/java/javase/17/troubleshoot"
  stages:
  - stage: 1
    steps:
    - do: OOM 종류·PID·힙 상태 확인 (읽기 전용)
      cmd: |
        grep -n "OutOfMemoryError\|StackOverflowError" <app_log> | tail -10
        jps -l | grep -i <app>
        jcmd <PID> GC.heap_info ; jstat -gcutil <PID> 5000 6 ; jcmd <PID> VM.flags
      check: 문구별 원인 — 'Java heap space'(힙), 'Metaspace'(클래스), 'unable to create native thread'(스레드/ulimit), 'Direct buffer memory'(NIO), 'GC overhead limit'(힙 근접)
      note: "적용: JDK 8/11/17 (GC.heap_info 는 JDK 9+ — JDK 8 은 jstat -gcutil 로 판단, jmap -heap 은 프로세스를 멈추므로 1차 금지) · jps -lv 는 JVM 인자의 비밀번호(-D...password)가 보일 수 있어 -l 만 사용 · 권한: JVM 실행 계정과 같은 사용자(sudo -u <user>)"
    - do: 스레드 덤프 채취·스레드 수 확인 (재기동 전) — 힙 덤프는 2차
      cmd: |
        jcmd <PID> Thread.print > /var/tmp/td_$(date +%Y%m%d_%H%M%S).txt
        ulimit -u ; cat /proc/sys/kernel/threads-max ; ps -o nlwp -p <PID>   # native thread OOM 시
        grep "Max processes" /proc/<PID>/limits   # 실행 중 프로세스에 실제 적용된 한도
      check: td 파일 생성. nlwp 가 프로세스의 Max processes(또는 ulimit -u) 에 근접이면 스레드 한도
      note: "적용: JDK 8/11/17, Linux · 스레드 덤프는 프로세스를 유지(kill -3 <PID> 도 동일 — 스레드 덤프, 프로세스는 유지) · 셸의 ulimit -u 는 현재 셸 한도라 서비스(systemd) 한도와 다를 수 있음 · 권한: JVM 실행 계정"
  - stage: 2
    steps:
    - do: 힙 덤프 채취 (디스크 여유·부하 승인 후 — stop-the-world)
      cmd: |
        df -h /var/tmp ; jcmd <PID> GC.heap_dump /var/tmp/heap_$(date +%Y%m%d_%H%M%S).hprof
      check: "성공: hprof 파일이 힙 사용량 크기로 생성되고 jcmd 가 'Heap dump file created' 출력 · 실패: 디스크 부족·권한 오류 메시지면 경로 변경, 덤프 중 서비스 응답 중단이 길어지면 L4 에서 제외된 상태인지 재확인"
      note: "사전조건: 대상 인스턴스를 L4/로드밸런서에서 제외했거나 이미 서비스 불능, 디스크 여유가 힙 최대(-Xmx) 이상 · 영향: 덤프 중 수 초~수십 초 전체 정지(stop-the-world)·디스크 대량 사용, hprof 에 세션·개인정보 포함 · 승인: WAS/애플리케이션 담당·보안 담당 · 백업/롤백: 설정 변경 없음 — 분석 후 hprof 는 보안 규정에 따라 삭제·암호화 보관 · 적용: JDK 8/11/17 jcmd(JDK 8 도 GC.heap_dump 지원)"
    - do: JVM 옵션 조정 (힙·Metaspace·덤프 자동화·GC 로그)
      config:
        file: 애플리케이션 기동 스크립트 / JAVA_OPTS
        snippet: |
          -Xms4g -Xmx4g -XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=512m -XX:MaxDirectMemorySize=1g
          -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/var/log/<app>/ -XX:+ExitOnOutOfMemoryError
          -Xlog:gc*:file=/var/log/<app>/gc_%t.log:time,uptime:filecount=5,filesize=50m        # JDK 9+
          # JDK 8: -XX:+PrintGCDetails -XX:+PrintGCDateStamps -Xloggc:/var/log/<app>/gc.log -XX:+UseGCLogFileRotation -XX:NumberOfGCLogFiles=5 -XX:GCLogFileSize=50M
          # StackOverflow: -Xss1m (기본) → 재귀 깊이 필요 시 -Xss2m, 근본은 소스 수정
        note: "-Xmx 는 컨테이너/서버 메모리 60% 이내(컨테이너: -XX:MaxRAMPercentage=60). native thread OOM 은 ulimit -u·스레드 풀 상한 조정"
      cmd: |
        # 스레드 한도: systemd 서비스면 systemctl edit <app> → [Service] LimitNPROC=65535 · 셸 기동이면 /etc/security/limits.conf: <user> soft nproc 65535 (셸에서 ulimit -u 만 바꾸면 서비스에 반영되지 않음)
        systemctl restart <app>
      check: "성공: 재기동 후 jstat Old/Metaspace 안정, OOM 미발생, /proc/<PID>/limits 의 Max processes 가 새 값 · 실패: 기동 실패(잘못된 JVM 옵션 'Unrecognized VM option')·OOM 재발이면 백업 기동 스크립트로 원복 후 힙 덤프 분석으로"
      note: "사전조건: 1차 스레드 덤프·로그 보존 완료, 서버 물리 메모리 여유 확인(-Xmx + Metaspace + 스레드 스택 합) · 영향: 재기동 동안 서비스 중단, -XX:+ExitOnOutOfMemoryError 는 OOM 시 즉시 종료(자동 재기동 구성 필요) · 승인: 애플리케이션·시스템 담당·변경 관리 · 백업/롤백: 기동 스크립트·limits 설정을 날짜 붙여 복사, 이상 시 복원 후 재기동 · 적용: -Xlog 는 JDK 9+(11/17), JDK 8 은 주석의 Print 계열, -XX:+ExitOnOutOfMemoryError 는 8u92+"
    - do: 힙 덤프 분석(Eclipse MAT Leak Suspects) 후 누수 클래스 개발팀 이관
      cmd: |
        jcmd <PID> GC.class_histogram | head -25
      check: "성공: 상위 점유 클래스가 애플리케이션 객체면 소스 결함으로 개발팀 이관 · 실패(판단 불가): 상위가 byte[]·char[]·String 뿐이면 MAT dominator tree 로 보유 객체 추적"
      note: "사전조건: 서비스 영향이 적은 시점 또는 L4 제외 상태 · 영향: GC.class_histogram 은 Full GC 를 일으켜 잠시 정지 · 승인: 애플리케이션 담당 · 백업/롤백: 설정 변경 없음(조회) — 되돌릴 것 없음 · 적용: JDK 8/11/17"
  - stage: 3
    steps:
    - do: 벤더/개발팀 의뢰 자료
      cmd: |
        tar czf jvm_$(hostname)_$(date +%Y%m%d).tgz /var/tmp/td_*.txt /var/log/<app>/gc*.log <app_log> ; java -version 2>&1 ; jcmd <PID> VM.flags > vmflags.txt
      check: hprof(별도)·GC 로그·스레드 덤프·VM 옵션·JDK 버전
      note: "민감정보 마스킹: 애플리케이션 로그·스레드 덤프의 호스트명·IP·계정·세션/쿠키·요청 파라미터·SQL 바인드 값을 가림 — hprof 는 메모리 전체(개인정보·비밀번호)를 담으므로 원본 반출 금지, 분석 결과(MAT 보고서)만 전달 · 전달 승인: 보안 담당 승인 후 반출"

- id: JAVA-PROC-THREAD
  products: [java, sw-common, was-common]
  category: thread
  match: [APP-THREAD-015, java.util.concurrent.RejectedExecutionException, java.util.concurrent.TimeoutException]
  title: 스레드 풀 고갈·작업 거부·응답 정지
  source: "Oracle JDK 17 Troubleshooting Guide '4 Troubleshoot Performance Issues·jcmd Thread.print'·'jstack'"
  stages:
  - stage: 1
    steps:
    - do: 스레드 덤프 3회(10초 간격) 채취·스레드 수 확인
      cmd: |
        for i in 1 2 3; do jcmd <PID> Thread.print -l > /var/tmp/td_$(date +%H%M%S)_$i.txt; sleep 10; done
        ps -o nlwp -p <PID> ; grep -c "java.lang.Thread.State: BLOCKED" /var/tmp/td_*_1.txt ; grep -c "WAITING" /var/tmp/td_*_1.txt
      check: BLOCKED 다수가 같은 락(- waiting to lock <0x…>)이면 락 경합, 같은 외부 호출 스택이면 백엔드 지연
      note: "적용: JDK 8/11/17 (jcmd 가 없으면 jstack -l <PID> 또는 kill -3 <PID> — 스레드 덤프, 프로세스는 유지) · 덤프 파일은 /var/tmp 여유 확인 후 · 권한: JVM 실행 계정과 같은 사용자"
  - stage: 2
    steps:
    - do: 스레드 풀 크기·큐·타임아웃 조정 (애플리케이션 설정)
      config:
        file: "애플리케이션 설정(Spring: application.yml 등)"
        snippet: |
          # Spring Boot 예: server.tomcat.threads.max=400  server.tomcat.accept-count=200
          # spring.task.execution.pool.max-size=64  spring.task.execution.pool.queue-capacity=1000
          # 외부 호출 타임아웃: RestTemplate/HttpClient connectTimeout=3s readTimeout=30s
      cmd: |
        systemctl restart <app>
      check: "성공: RejectedExecutionException 미발생, 스레드 덤프에서 BLOCKED 감소, 응답 시간 정상 · 실패: 스레드만 늘려 DB 세션·메모리 고갈(OOM·풀 획득 실패)이 생기면 즉시 원복"
      note: "사전조건: 1차 스레드 덤프로 병목(락·외부 연동) 확인 — 병목 해소 없이 풀만 키우지 않음, DB 커넥션 풀·메모리 여유 확인 · 영향: 재기동 동안 서비스 중단, 스레드 증가는 메모리·DB 세션 증가 · 승인: 애플리케이션 담당·변경 관리 · 백업/롤백: 설정 파일을 날짜 붙여 복사, 이상 시 복원 후 재기동 · 적용: server.tomcat.threads.max 는 Spring Boot 2.3+(이전은 server.tomcat.max-threads), 내장 Tomcat 8.5/9/10 공통, JDK 8/11/17"
  - stage: 3
    steps:
    - do: 의뢰 자료
      cmd: |
        tar czf threads_$(date +%Y%m%d).tgz /var/tmp/td_*.txt <app_log>
      check: 스레드 덤프 3회·애플리케이션 로그·설정
      note: "민감정보 마스킹: 스레드 덤프·로그의 호스트명·IP·계정·세션/쿠키·요청 파라미터·SQL 바인드 값, 설정 파일의 비밀번호·연결 문자열을 가림 · 전달 승인: 보안 담당 승인 후 반출"

- id: JAVA-PROC-CONNECTION
  products: [java, sw-common]
  category: connection
  match: [SW-JAVA-002, APP-POOL-010, APP-CLIENT-016, java.net.ConnectException, java.net.SocketTimeoutException, java.net.UnknownHostException, java.sql.SQLRecoverableException, org.springframework.jdbc.CannotGetJdbcConnectionException, com.zaxxer.hikari.pool.HikariPool$PoolInitializationException]
  title: 연결 실패·소켓 타임아웃·JDBC 풀 획득 실패
  source: "HikariCP 'Configuration (maximumPoolSize, connectionTimeout, leakDetectionThreshold)'·Oracle JDBC 'Connection properties (oracle.net.CONNECT_TIMEOUT, READ_TIMEOUT)'·JDK 'Networking Properties'"
  stages:
  - stage: 1
    steps:
    - do: 대상 호스트·포트·DNS 확인 (읽기 전용)
      cmd: |
        getent hosts <host> ; nc -zvw3 <host> <port> ; curl -sv --max-time 5 http://<host>:<port>/ -o /dev/null 2>&1 | tail -3
        grep -n "ConnectException\|SocketTimeoutException\|UnknownHostException\|Connection is not available" <app_log> | tail -20
      check: DNS 실패면 /etc/hosts·resolv.conf, 포트 실패면 대상 서비스/방화벽, 타임아웃이면 대상 지연
      note: "적용: Linux(getent·nc), JDK 8/11/17 애플리케이션 공통 · 접속 시도만 함(데이터 변경 없음) · 권한: 일반 사용자(로그 읽기 권한)"
    - do: JDBC 풀 상태 확인 (JMX 또는 로그)
      cmd: |
        jcmd <PID> Thread.print | grep -A8 "HikariPool\|getConnection" | head -60
        grep -n "HikariPool-1 - \|leak" <app_log> | tail -10
      check: "'Connection is not available, request timed out after' 반복이면 풀 고갈/누수"
      note: "적용: HikariCP 2.x/3.x/4.x/5.x(Spring Boot 2+ 기본 풀), JDK 8/11/17 · 다른 풀(DBCP·Tomcat JDBC)은 로그 문구가 다름 · 권한: JVM 실행 계정"
  - stage: 2
    steps:
    - do: 풀·타임아웃 설정 조정
      config:
        file: application.yml / datasource 설정
        snippet: |
          spring.datasource.hikari.maximum-pool-size=50
          spring.datasource.hikari.minimum-idle=10
          spring.datasource.hikari.connection-timeout=10000
          spring.datasource.hikari.max-lifetime=1800000
          spring.datasource.hikari.leak-detection-threshold=60000      # 누수 스택 로그
          # Oracle JDBC URL 속성: oracle.net.CONNECT_TIMEOUT=5000  oracle.jdbc.ReadTimeout=60000
      cmd: |
        systemctl restart <app>
      check: "성공: 풀 획득 타임아웃 미발생, leak-detection 로그의 스택 → 개발팀 close() 수정 · 실패: DB 측 세션 한도 초과(ORA-00018·too many connections)나 기동 실패면 원복"
      note: "사전조건: DB processes/sessions 한도가 (풀 최대 × 인스턴스 수)를 감당하는지 DBA 확인, 1차에서 DB·네트워크 장애가 아님을 확인 · 영향: 재기동 동안 서비스 중단, 풀 확대는 DB 부하 증가 · 승인: 애플리케이션 담당·DBA·변경 관리 · 백업/롤백: 설정 파일 백업, 이상 시 복원 후 재기동 · 적용: Spring Boot 2.x/3.x + HikariCP (properties 형식 예 — yml 이면 들여쓰기 형식), max-lifetime 은 DB/방화벽 유휴 끊김 시간보다 짧게"
  - stage: 3
    steps:
    - do: 의뢰 자료
      cmd: |
        tar czf conn_$(date +%Y%m%d).tgz <app_log> /var/tmp/td_*.txt ; ss -tan | grep <port> | awk '{print $1}' | sort | uniq -c
      check: 로그·스레드 덤프·소켓 상태 분포·대상 서비스 로그
      note: "민감정보 마스킹: 로그·설정의 DB 접속 계정·비밀번호·JDBC URL 의 호스트명/IP·SQL 바인드 값·요청 파라미터·세션 ID 를 가림 · 전달 승인: 보안 담당 승인 후 반출"

- id: JAVA-PROC-SECURITY
  products: [java, sw-common]
  category: security
  match: [APP-SSL-018, APP-AUTH-012, APP-LDAP-011, javax.net.ssl.SSLHandshakeException, javax.naming.AuthenticationException, javax.naming.CommunicationException, LEG-COM-SSL-EXPIRED]
  title: TLS 핸드셰이크 실패·인증서·LDAP 인증 오류
  source: "Oracle JDK 'JSSE Reference Guide (Debugging Utilities -Djavax.net.debug, keytool)'·'8u291/11.0.11 Release Notes (TLS 1.0/1.1 disabled)'"
  stages:
  - stage: 1
    steps:
    - do: 대상 인증서·프로토콜 확인 (읽기 전용)
      cmd: |
        openssl s_client -connect <host>:<port> -servername <host> </dev/null 2>/dev/null | openssl x509 -noout -dates -subject -issuer
        openssl s_client -connect <host>:<port> -tls1_2 </dev/null 2>&1 | grep -i "Protocol\|Cipher\|Verify return"
        keytool -list -v -keystore $JAVA_HOME/lib/security/cacerts | grep -c "trustedCertEntry"
        grep -n "SSLHandshakeException\|PKIX path building failed\|handshake_failure\|AuthenticationException" <app_log> | tail -10
      check: 만료·체인 불완전이면 서버 인증서 문제, PKIX 면 클라이언트 truststore 에 CA 없음, handshake_failure+TLS1.0 이면 프로토콜 비활성(8u291+)
      note: "적용: cacerts 경로 JDK 9+ 는 $JAVA_HOME/lib/security/cacerts, JDK 8 은 $JAVA_HOME/jre/lib/security/cacerts · changeit 은 JDK 기본값(바뀌었으면 -storepass 를 빼고 프롬프트 입력, 실제 비밀번호를 명령줄에 쓰지 않음) · 조회만 함 · 권한: 일반 사용자(JDK 읽기 권한)"
  - stage: 2
    steps:
    - do: 신뢰 저장소에 CA 반입 / 프로토콜·알고리즘 설정
      cmd: |
        keytool -importcert -alias <ca-alias> -file <ca.crt> -keystore $JAVA_HOME/lib/security/cacerts -noprompt
        # 애플리케이션 전용: -Djavax.net.ssl.trustStore=/path/truststore.jks (trustStorePassword 를 -D 옵션으로 주면 ps 에 보임 — 운영 설정 파일·환경으로)
      config:
        file: $JAVA_HOME/conf/security/java.security (jdk.tls.disabledAlgorithms) — 상대가 TLS1.0/1.1 만 지원할 때 임시(보안 위험)
        snippet: |
          # TLSv1, TLSv1.1 을 목록에서 뺀 값 = 임시 허용 (java.security 는 줄 중간의 # 를 주석으로 보지 않으므로 주석은 반드시 별도 줄)
          jdk.tls.disabledAlgorithms=SSLv3, RC4, DES, MD5withRSA, DH keySize < 1024, EC keySize < 224, 3DES_EDE_CBC, anon, NULL
      check: "성공: -Djavax.net.debug=ssl:handshake 로 핸드셰이크 성공 확인 후 디버그 제거, 오류 로그 미발생 · 실패: PKIX 오류가 계속되면 반입한 CA 가 실제 발급 체인(중간 CA 포함)인지 재확인, 다른 연동이 깨지면 cacerts·java.security 원복"
      note: "사전조건: 반입할 CA 인증서의 지문(fingerprint)을 발급처와 대조, JDK 업데이트 시 cacerts 가 덮어써지는지 확인 · 영향: cacerts 는 같은 JDK 를 쓰는 모든 애플리케이션에 적용, TLS1.0/1.1 허용은 보안 등급 하락 — 애플리케이션 재기동 필요 · 승인: 보안 담당·애플리케이션 담당·변경 관리 · 백업/롤백: cp cacerts cacerts.bak.<날짜>·cp java.security java.security.bak.<날짜>, 이상 시 복원 후 재기동(반입만 되돌릴 때 keytool -delete -alias <ca-alias>) · 적용: java.security 경로 JDK 9+ conf/security, JDK 8 jre/lib/security · 비밀번호(-storepass·trustStorePassword)는 화면·이력에 남지 않게"
  - stage: 3
    steps:
    - do: 의뢰 자료
      cmd: |
        java -version 2>&1 ; openssl s_client -connect <host>:<port> -showcerts </dev/null > certs_$(date +%Y%m%d).txt 2>&1
      check: JDK 버전·인증서 체인·핸드셰이크 디버그 로그
      note: "민감정보 마스킹: 대상 호스트명·IP, 핸드셰이크 디버그 로그의 세션 키·쿠키·요청 본문, LDAP 바인드 계정(DN)·비밀번호를 가림 — 개인키·keystore 파일은 포함하지 않음 · 전달 승인: 보안 담당 승인 후 반출"

# ── MESIM (메타빌드 ESB/APIG/EAI) ──
- id: MESIM-PROC-UPSTREAM
  products: [mesim-esb, mesim-apig, mesim-eai]
  category: upstream
  match: [SW-ESB-001, SW-APIG-001, LEG-MESIM-APIG-PROVIDER-TIMEOUT, LEG-MESIM-APIG-CIRCUIT-OPEN, LEG-MESIM-APIG-HTTP-CALL-500, APIG-BACKEND-DOWN, APIG-BACKEND-TIMEOUT, APIG-CIRCUIT-OPEN, ESB-ENDPOINT-DOWN, ESB-HTTP-CONNECT-FAIL, ESB-WAS-CONNECT-FAIL]
  title: 연계 대상(Provider) 응답 없음·서킷 브레이커 개방
  source: "메타빌드 MESIM ESB/APIG 운영 매뉴얼(납품본) '엔드포인트·서비스 상태(관리 콘솔)'·Apache Camel 2.x 'HTTP4 component (connectTimeout, socketTimeout)'·Netflix Hystrix 1.5 wiki 'Configuration (circuitBreaker.sleepWindowInMilliseconds, execution.isolation.thread.timeoutInMilliseconds)'"
  stages:
  - stage: 1
    steps:
    - do: 연계 대상 도달 여부·오류 빈도 확인 (읽기 전용)
      cmd: |
        grep -n "PROVIDER CALL ERROR\|HTTP CALL ERROR\|CIRCUIT BREAK RESULT\|Connection refused\|Read timed out" <MESIM_HOME>/logs/*.log | tail -30
        nc -zvw3 <provider_host> <port> ; curl -sv --max-time 5 http://<provider_host>:<port>/<health> -o /dev/null 2>&1 | tail -3
      check: "대상 접속 실패·타임아웃이면 제공자 시스템 장애(담당 통보). 'CIRCUIT BREAK RESULT: false' 는 차단 상태 — 제공자 복구 후 sleepWindow 경과 시 자동 반개방"
      note: "적용: MESIM ESB/APIG/EAI 납품본(Camel 2.x·Hystrix 1.5 기반) — 로그 경로·문구는 납품 버전 기준으로 확인 · 제공자 health URL 은 GET 조회만(업무 전문 재전송 금지) · 권한: MESIM 실행 계정(로그 읽기)"
    - do: 관리 콘솔에서 해당 API/서비스 상태 캡처
      cmd: |
        # MESIM 관리 콘솔 › 모니터링 › 서비스/엔드포인트 상태 화면 캡처 (실패율·응답시간)
      check: 특정 제공자만 실패인지 전체인지 구분
      note: "적용: MESIM 관리 콘솔(납품 버전) · 조회 화면만 — 재시작·배포·정책 변경 버튼 누르지 않음 · 권한: 콘솔 조회 계정"
  - stage: 2
    steps:
    - do: 제공자 복구 후 서킷 리셋·타임아웃/재시도 조정 (납품 매뉴얼 항목명 기준)
      config:
        file: <MESIM_HOME>/conf/ (Hystrix/Camel 설정 — 납품본의 파일명·항목명으로 대체)
        snippet: |
          hystrix.command.default.execution.isolation.thread.timeoutInMilliseconds=10000
          hystrix.command.default.circuitBreaker.sleepWindowInMilliseconds=30000
          hystrix.command.default.circuitBreaker.errorThresholdPercentage=50
          # Camel http4: ?connectTimeout=3000&socketTimeout=10000   · 재시도: redeliveryPolicy maximumRedeliveries=2
        note: "값 변경은 메타빌드 기술지원 또는 유지보수사 확인 후. 제공자 복구 전 타임아웃 확대는 스레드 고갈을 유발"
      cmd: |
        # 관리 콘솔 › 서비스 재시작(해당 라우트/API) 또는 <MESIM_HOME>/bin/stop.sh ; start.sh
      check: "성공: 로그에 HTTP CALL ERROR 미발생, 콘솔 성공률 회복 · 실패: 재시작 후에도 제공자 호출 실패면 제공자 측 미복구 — 타임아웃 값 원복, 기동 실패면 백업 conf 복원"
      note: "사전조건: 제공자 복구를 제공자 담당에게 확인, 재시도 시 중복 처리돼도 되는 전문(멱등)인지 확인 · 영향: 라우트/서버 재시작 중 해당 연계 중단·처리 중 메시지 실패 가능, 재시도 확대는 중복 전송 위험 · 승인: 연계 담당·메타빌드 기술지원 또는 유지보수사·변경 관리 · 백업/롤백: <MESIM_HOME>/conf 를 날짜 붙여 tar 보관, 이상 시 복원 후 재시작 · 적용: MESIM 납품 버전(Hystrix·Camel 2.x 항목명은 납품본 기준)"
  - stage: 3
    steps:
    - do: 메타빌드 기술지원 자료
      cmd: |
        tar czf mesim_$(hostname)_$(date +%Y%m%d).tgz <MESIM_HOME>/logs/ <MESIM_HOME>/conf/ ; java -version 2>&1
      check: 서버/라우트 로그·설정·제공자 응답 샘플·발생 시각
      note: "민감정보 마스킹: 로그·전문 샘플의 개인정보(이름·주민번호·전화)·API 키/토큰·인증 헤더, conf 의 계정·비밀번호·내부 호스트명/IP 를 가림 · 전달 승인: 보안 담당·연계 기관 승인 후 반출"

- id: MESIM-PROC-CAPACITY
  products: [mesim-esb, mesim-apig, mesim-eai]
  category: capacity
  match: [SW-ESB-003, SW-APIG-003, LEG-MESIM-APIG-RATE-LIMIT-EXCEED-E245, APIG-TRAFFIC-LIMIT, APIG-TRAFFIC-SPIKE, ESB-LARGE-DATA-OVERLOAD]
  title: 큐 포화·유량 제한 초과·대용량 처리 지연
  source: "메타빌드 MESIM APIG 운영 매뉴얼(납품본) '유량 제어(Rate Limit) 정책'·Apache Camel 'SEDA/Threads (concurrentConsumers, queueSize)'·Jetty 'QueuedThreadPool'"
  stages:
  - stage: 1
    steps:
    - do: 큐·스레드·유량 초과 현황 확인
      cmd: |
        grep -c "rate limit\|Too Many Requests\|RejectedExecutionException\|queue.*full" <MESIM_HOME>/logs/*.log
        jcmd <PID> Thread.print | grep -c "qtp\|CamelThread" ; ss -tan state established '( sport = :<port> )' | wc -l
      check: 429 다수면 정책 한도 초과(정상 동작), 큐 포화/RejectedExecution 이면 처리 용량 부족
      note: "적용: MESIM 납품본(Jetty·Camel 기반), JDK 8/11 · 개수만 셈(대량 출력 없음) · 권한: MESIM 실행 계정(jcmd 는 같은 사용자)"
  - stage: 2
    steps:
    - do: 유량 정책·스레드/큐 조정 (관리 콘솔·설정)
      config:
        file: 관리 콘솔 › API 정책 › 유량 제어 / <MESIM_HOME>/conf/ (Jetty·Camel 스레드)
        snippet: |
          # Jetty: maxThreads=400 minThreads=20 acceptQueueSize=200
          # Camel seda: ?concurrentConsumers=16&queueSize=5000&blockWhenFull=true
          # 유량 제어: 소비자별 TPS 한도 상향은 제공자 처리 능력 확인 후
      cmd: |
        <MESIM_HOME>/bin/stop.sh ; <MESIM_HOME>/bin/start.sh
      check: "성공: 큐 포화 로그 미발생, 응답시간 정상 · 실패: 스레드·큐 확대 후 메모리 사용 급증·OOM 이나 제공자 과부하가 생기면 원복"
      note: "사전조건: 제공자 처리 용량·서버 메모리 여유 확인, SEDA 큐에 남은 메시지 처리 완료 확인(재기동 시 메모리 큐 유실) · 영향: stop~start 동안 연계 전면 중단, 유량 한도 상향은 제공자 과부하 위험 · 승인: 연계 담당·메타빌드 기술지원 또는 유지보수사·변경 관리 · 백업/롤백: conf 폴더 tar 백업·콘솔 정책 화면 캡처, 이상 시 복원 후 재기동 · 적용: MESIM 납품 버전(설정 항목명은 납품본 기준)"
  - stage: 3
    steps:
    - do: 메타빌드 기술지원 자료
      cmd: |
        tar czf mesim_cap_$(date +%Y%m%d).tgz <MESIM_HOME>/logs/ ; jcmd <PID> Thread.print > td.txt
      check: 로그·스레드 덤프·트래픽 통계(콘솔 캡처)
      note: "민감정보 마스킹: 로그의 소비자 ID·API 키·클라이언트 IP·전문 내 개인정보, 스레드 덤프의 호스트명·요청 파라미터를 가림 · 전달 승인: 보안 담당 승인 후 반출"

- id: MESIM-PROC-INTERNAL
  products: [mesim-esb, mesim-apig, mesim-eai]
  category: internal
  match: [SW-ESB-002, LEG-MESIM-ESB-CAMELJETTYSERVER-ERROR-CB61, LEG-MESIM-APIG-CAMELJETTYSERVER-ERROR-0B51, LEG-MESIM-ESB-WIRETAP-FAIL-D23F, LEG-MESIM-APIG-HTTP-INVOKE-ERROR, ESB-TRANSFORM-FAIL, ESB-MESSAGE-VERIFY-FAIL, APIG-FORMAT-CONVERT-FAIL, ESB-ADAPTER-DOWN, APIG-GATEWAY-DOWN]
  title: 서버/어댑터 다운·변환(매핑) 실패·내부 예외
  source: "메타빌드 MESIM 운영 매뉴얼(납품본) '기동/종료·어댑터 관리·매핑 검증'·Apache Camel 'Error Handler (DeadLetterChannel)'"
  stages:
  - stage: 1
    steps:
    - do: 프로세스·어댑터 상태·예외 확인 (읽기 전용)
      cmd: |
        ps -ef | grep -i "[m]esim" ; ss -ltnp | grep -E ":(<port>)\b"
        grep -n "CamelJettyServer.*error\|WireTap.*fail\|TransformException\|SAXParseException\|JsonParseException\|Adapter.*down" <MESIM_HOME>/logs/*.log | tail -30
      check: 프로세스 없음이면 다운. 변환 예외는 특정 인터페이스·전문 샘플 기록(원문에서 PII 제거)
      note: "적용: MESIM 납품본(Camel·Jetty 기반) · 조회만 함 · 권한: MESIM 실행 계정(ss -p 의 PID 표시는 root)"
  - stage: 2
    steps:
    - do: 서버·어댑터 재기동 및 실패 메시지 재처리
      cmd: |
        <MESIM_HOME>/bin/stop.sh ; <MESIM_HOME>/bin/start.sh
        # 관리 콘솔 › 어댑터 › 재시작 / 실패 메시지(Dead Letter) 재전송
      check: "성공: 기동 로그 정상, 실패 메시지 재처리 완료(재처리 건수 = 실패 건수) · 실패: 기동 실패면 로그 원인 확인 후 백업 conf 복원, 재전송이 다시 실패하면 중단하고 원인(전문·대상) 해결 후 재시도"
      note: "사전조건: 실패 메시지 목록·건수 기록, 재전송해도 중복 처리되지 않는 업무인지 연계 기관과 확인 · 영향: 재기동 중 연계 중단, 재전송은 상대 시스템에 실제 거래를 발생시킴(중복 위험) · 승인: 연계 담당·업무 담당·변경 관리 · 백업/롤백: conf tar 백업, 재전송은 되돌릴 수 없으므로 대상 목록 승인 후 실행 · 적용: MESIM 납품 버전"
    - do: 매핑/스키마 수정 후 배포 (변환 실패)
      cmd: |
        # 관리 콘솔 › 인터페이스 › 매핑 편집 › 검증 › 배포
      check: "성공: 동일 전문 재전송 성공, 다른 인터페이스 변환 오류 없음 · 실패: 배포 후 변환 오류가 다른 전문에서 생기면 이전 매핑 버전으로 재배포"
      note: "사전조건: 개발 환경에서 실패 전문(개인정보 제거본)으로 매핑 검증 · 영향: 배포 즉시 해당 인터페이스 전체 전문에 적용 · 승인: 연계 담당·개발 담당·변경 관리 · 백업/롤백: 배포 전 현재 매핑 내보내기(또는 버전 기록), 이상 시 이전 버전 재배포 · 적용: MESIM 납품 버전 관리 콘솔"
  - stage: 3
    steps:
    - do: 메타빌드 기술지원 자료
      cmd: |
        tar czf mesim_int_$(date +%Y%m%d).tgz <MESIM_HOME>/logs/ <MESIM_HOME>/conf/
      check: 로그·설정·실패 전문 샘플·버전
      note: "민감정보 마스킹: 실패 전문 샘플의 개인정보·계좌·인증 토큰, conf 의 계정·비밀번호·내부 호스트명/IP, 로그의 클라이언트 IP 를 가림 · 전달 승인: 보안 담당·연계 기관 승인 후 반출"

# ── BizMaster (Tmax EAI) ──
- id: BM-PROC-UPSTREAM
  products: [bizmaster-app, bizmaster-adapter]
  category: upstream
  match: [SW-BM-006, SW-BM-007, SW-BM-008, SW-BM-002, SW-BM-003, BM-407, BM-402]
  title: 연계 기관 응답 지연·연결 오류·미전송 메시지 (-407 · -402)
  source: "Tmax BizMaster 운영 매뉴얼(납품본) '어댑터 관리·재전송(unsent/sending 큐)'·허브 JEUS 6 로그 / manuals/bizmaster.yaml"
  stages:
  - stage: 1
    steps:
    - do: 연계 기관 도달 여부·미전송 큐 확인 (읽기 전용)
      cmd: |
        grep -n "Remote host timed out\|Connection reset\|\[-407\]\|\[-402\]\|Enqueued request .* is expired\|Failed to re-send" <BM_HOME>/log/eai.log <BM_HOME>/log/adt_$(date +%Y%m%d).log | tail -30
        nc -zvw3 <기관_host> <port> ; ls -l <BM_HOME>/unsent/ <BM_HOME>/sending/ 2>/dev/null | wc -l
      check: 기관 접속 실패·타임아웃이면 상대 기관 장애(담당 통보). unsent/sending 파일 누적이면 재전송 대기
      note: "적용: Tmax BizMaster 납품본(허브 JEUS 6) · unsent/sending 은 개수만 셈 — 파일 이동·삭제·열람 금지(전문에 개인정보) · 권한: BizMaster 실행 계정"
  - stage: 2
    steps:
    - do: 어댑터 재기동·미전송 메시지 재전송
      cmd: |
        # 어댑터 관리 콘솔 › 어댑터 재시작 / 재전송(unsent → 재처리)  — 납품 매뉴얼 절차
        # 허브(JEUS 6): $JEUS_HOME/bin/jeusadmin <node> "down <container>" / "boot <container>"  (JEUS 6 문법)
      check: "성공: adt 로그에 'Adapter Shell … initialized', unsent 감소 · 실패: 재시작 후 -407/-402 지속이면 상대 기관 미복구 — 재전송 중지 후 기관 복구 대기, 어댑터 기동 실패면 로그 원인 확인"
      note: "사전조건: 상대 기관 복구 확인, unsent 건수·목록 기록, 재전송 시 중복 거래가 되지 않는지 기관과 확인 · 영향: 어댑터·컨테이너 재기동 중 해당 연계 중단, 재전송은 실제 거래 발생 · 승인: 연계 담당·업무 담당·변경 관리 · 백업/롤백: 재전송 전 unsent 폴더를 tar 로 보관, 재전송은 되돌릴 수 없으므로 승인된 목록만 · 적용: BizMaster 납품 버전, 허브 JEUS 6 문법(JEUS 7+ 는 jeusadmin -u/-p 문법)"
  - stage: 3
    steps:
    - do: 유지보수 계약사/Tmax 자료
      cmd: |
        tar czf bizmaster_$(date +%Y%m%d).tgz <BM_HOME>/log/ <JEUS_HOME>/logs/ 2>/dev/null
      check: eai.log·adt 로그·JeusServer.log·기관별 실패 시각/전문 ID (EOS 제품 — 유상 지원 여부 확인)
      note: "민감정보 마스킹: 로그의 전문 본문(개인정보·계좌)·기관 호스트명/IP·계정을 가리고 전문 ID·시각만 남김 · 전달 승인: 보안 담당·연계 기관 승인 후 반출"

# ── Indigo ESB ──
- id: IND-PROC-UPSTREAM
  products: [indigo-esb]
  category: upstream
  match: [LEG-IND-004, LEG-IND-005, LEG-IND-006, LEG-IND-007, LEG-IND-008]
  title: 서비스 호출 실패·인터셉터 예외·Response-Code 500
  source: "Indigo ESB 운영 매뉴얼(납품본)·Apache CXF 3.x 'Interceptors / Logging (Fault interceptor chain)'·Apache ServiceMix/Camel 'Error processing exchange'"
  stages:
  - stage: 1
    steps:
    - do: 실패 서비스·대상 엔드포인트 확인 (읽기 전용)
      cmd: |
        grep -n "has thrown exception, unwinding now\|Error processing exchange\|Response-Code: 500\|Target service" <ESB_HOME>/logs/*.log | tail -30
        nc -zvw3 <target_host> <port> ; curl -sv --max-time 5 http://<target_host>:<port>/<service>?wsdl -o /dev/null 2>&1 | tail -3
      check: 대상 WSDL 응답 실패면 상대 시스템 장애. 인터셉터 예외 스택의 원인(Caused by) 기록
      note: "적용: Indigo ESB 납품본(CXF 3.x·ServiceMix/Karaf·Camel 기반) · WSDL GET 조회만(업무 호출 재전송 금지) · 권한: ESB 실행 계정"
  - stage: 2
    steps:
    - do: 서비스/컨테이너 재기동 및 엔드포인트 설정 확인
      cmd: |
        <ESB_HOME>/bin/stop ; <ESB_HOME>/bin/start      # ServiceMix/Karaf: bin/stop, bin/start
        # Karaf 콘솔: bundle:list | grep -i <svc> ; bundle:restart <id>
      config:
        file: <ESB_HOME>/etc/ (CXF/Camel 엔드포인트 설정, 납품본 경로)
        snippet: |
          # http-conduit: ConnectionTimeout=5000 ReceiveTimeout=60000
      check: "성공: 호출 성공, 로그에 500 미발생, bundle:list 에서 해당 번들 Active · 실패: 번들이 Failure/GracePeriod 로 남으면 의존 번들·설정 오류 — 백업 etc 복원 후 재기동"
      note: "사전조건: 상대 시스템 정상 확인(1차 WSDL 응답), 가능하면 전체 재기동 대신 해당 번들만 재시작 · 영향: 컨테이너 stop~start 동안 모든 서비스 중단, 번들 재시작은 해당 서비스만 중단 · 승인: 연계 담당·유지보수사·변경 관리 · 백업/롤백: <ESB_HOME>/etc 를 날짜 붙여 tar 보관, 이상 시 복원 후 재기동 · 적용: Karaf 3.x/4.x(bundle:restart), 납품 버전 경로 기준"
  - stage: 3
    steps:
    - do: 유지보수사 의뢰 자료
      cmd: |
        tar czf indigo_$(date +%Y%m%d).tgz <ESB_HOME>/logs/ <ESB_HOME>/etc/
      check: 로그·설정·실패 전문 샘플
      note: "민감정보 마스킹: etc 의 계정·비밀번호·keystore 비밀번호·내부 호스트명/IP, 로그의 SOAP 본문 개인정보·WS-Security 토큰·클라이언트 IP 를 가림 · 전달 승인: 보안 담당 승인 후 반출"

# ── 공통(제품 무관) ──
- id: COMMON-PROC-HARDWARE
  products: [os-common]
  category: hardware
  match: [LEG-GEN-CRIT-HW, LEG-GEN-HW-FAILURE, LEG-HW-MEM-ECC, LEG-HW-FAN-FAIL, LEG-HW-PSU-FAIL, LEG-HW-RAID-DEGRADE, LEG-HW-MCE, LEG-HW-DISK-SMART, LEG-HW-BMC, LEG-STOR-DISK-FAIL, LEG-STOR-CONTROLLER-FAIL, LEG-STOR-MULTIPATH]
  title: 서버·스토리지 하드웨어 결함 신호 (공통)
  source: "서버 관리 콘솔(iLO/iDRAC/BMC·HMC/ASMI·ILOM) 제조사 가이드 · Linux ipmitool/smartctl/megacli·storcli"
  stages:
  - stage: 1
    steps:
    - do: 관리 콘솔·OS 에서 결함 부품 확인 (읽기 전용)
      cmd: |
        ipmitool sel elist 2>/dev/null | tail -20 ; ipmitool sdr 2>/dev/null | awk -F'|' '$3 !~ /ok|ns/' | head
        lsblk -d -o NAME,TYPE,SIZE,MODEL ; smartctl -H /dev/<sdX> 2>/dev/null ; storcli /c0 show 2>/dev/null | head -40 ; megacli -LDInfo -Lall -aALL 2>/dev/null | head -40
        journalctl -k --since "-1 day" | grep -i "MCE\|EDAC\|I/O error\|degraded" | tail -20
      check: SEL/SDR 경고·RAID Degraded·SMART FAILED·EDAC 오류가 있으면 하드웨어 결함(3차 제조사). SDR 은 셋째 칸(상태)이 ok·ns 가 아닌 줄만 남기므로 출력이 비어 있으면 센서 이상 없음
      note: "적용: Linux(systemd journalctl) + IPMI 지원 서버, LSI/Broadcom MegaRAID(storcli 또는 MegaCli64 — 설치된 것만 응답) · <sdX> 는 lsblk 로 확인한 실제 디스크 이름(sda 고정 아님), RAID 컨트롤러 뒤 디스크는 smartctl -d megaraid,<N> 처럼 장치 종류 지정이 필요할 수 있음 · 조회만 함(sel clear·set 계열 금지) · 권한: root(IPMI·디스크 장치 접근)"
  - stage: 2
    steps:
    - do: 이중화 우회·결함 부품 격리 (승인된 절차)
      cmd: |
        # L4/로드밸런서에서 해당 서버 제외 요청 → 서비스 우회 후 정비 시간 확보
        storcli /c0/e<E>/s<S> set offline 2>/dev/null   # 실패 디스크 격리(RAID 보호 하에)
      check: "성공: 서비스 정상 유지, 해당 슬롯 Offline·RAID 는 Degraded 로 동작, 결함 부품 교체 일정 확정 · 실패: 다른 디스크도 오류이거나 RAID 가 Offline 이 되면 즉시 중단하고 제조사 긴급 지원(데이터 손실 위험)"
      note: "사전조건: RAID 가 해당 디스크 없이도 유지되는 레벨·상태(다른 멤버 정상)인지 확인, 최신 백업 확인, 슬롯 번호(e/s)를 제조사와 대조 · 영향: 격리 후 RAID 이중화 상실(재구성 전까지 추가 장애 시 데이터 손실), 서버 제외 시 남은 서버 부하 증가 · 승인: 시스템 담당·제조사 엔지니어·변경 관리 · 백업/롤백: 작업 전 데이터 백업 확인, 잘못 격리하면 storcli /c0/e<E>/s<S> set online 으로 되돌림(제조사 확인 후) · 적용: Broadcom/LSI MegaRAID storcli — 다른 컨트롤러(HPE Smart Array ssacli·Dell perccli)는 해당 도구 사용"
  - stage: 3
    steps:
    - do: 제조사 케이스 자료
      cmd: |
        ipmitool sel elist > sel.txt ; smartctl -a /dev/<sdX> > smart_<sdX>.txt 2>/dev/null
        sos report --batch      # RHEL 8 이상(sos 4.x)
        sosreport --batch       # RHEL 7(sos 3.x) — 둘 중 설치된 판의 명령 하나만 실행
      check: SEL·sosreport·SMART·RAID 로그·펌웨어 버전·장비 모델/시리얼
      note: "민감정보 마스킹: sosreport 는 설정·로그 전반(계정·호스트명·IP·설정 내 비밀번호)을 담으므로 sos 4.x 의 --clean(난독화) 사용 또는 전달 전 검토해 호스트명·IP·계정을 가림 · sosreport 는 수 분간 CPU·디스크 사용 — 업무 부하 낮은 시간에 · 전달 승인: 보안 담당 승인 후 제조사 반출"
