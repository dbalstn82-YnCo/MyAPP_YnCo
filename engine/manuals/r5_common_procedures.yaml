# 근거 매뉴얼·작성 기준 (5차 G8, 2026-10-16) — 계층 공통(os-common · was-common · sw-common) 수행 절차
# 근거: RHEL 8/9 문서(Managing storage devices · Configuring device mapper multipath · Monitoring and managing system status and performance ·
#       Configuring and managing networking · Security hardening(faillock)·Using SELinux), man7.org(ss(8)·journalctl(1)·iscsiadm(8)·smartctl(8)·ipmitool(1)·virsh(1)),
#       IBM AIX 7.2 문서(errpt·lspath·lssrc·entstat·fcstat·lsuser), Microsoft Learn(Test-NetConnection·Get-NetTCPConnection·Get-WinEvent·Get-IscsiSession·
#       Get-PhysicalDisk·Get-StorageReliabilityCounter·mpclaim), Cisco IOS 운용 명령(show interfaces·show etherchannel·show ip bgp·show processes cpu),
#       VMware vSphere ESXi esxcli/vim-cmd/esxtop 운용 명령, Broadcom StorCLI·HPE SSACLI 조회 명령, OpenJDK 도구(jcmd·jstat).
# 작성 기준: knowledge_spec.md(GPT 45차 관문) — 1차는 읽기 전용(재기동·삭제·설정 변경·카운터 초기화 금지), 여러 플랫폼 명령은 '# Linux:' '# AIX:' '# Windows:' 등으로 나란히 표기,
#           2차는 note 에 사전조건·영향·승인·백업/롤백, check 에 성공/실패, 3차는 민감정보 마스킹·전달 승인. 자리표시자만 사용(<server> <port> <PID> 등).
# 계층 공통 절차는 제품 전용 절차가 없을 때 연결된다(logtriage/procedures.py: ID 지정 > 제품+유형 > 계층 공통+유형).
procedures:
# ───────────────────────── OS 계층 공통 ─────────────────────────
- id: OSC-PROC-R5-CONNECTION
  products: [os-common]
  category: connection
  match: [LEG-COM-DBCONN, LEG-KW-CONN-FAIL, LEG-STOR-ISCSI-FAIL]
  title: 서비스·DB·iSCSI 연결 실패 (계층 공통)
  source: "RHEL 9 'Configuring and managing networking'·man7.org ss(8)·iscsiadm(8) / IBM AIX 7.2 netstat / Microsoft Learn Test-NetConnection·Get-NetTCPConnection·Get-IscsiSession"
  stages:
  - stage: 1
    steps:
    - do: 대상 포트 도달 시험 (읽기 전용)
      cmd: |
        # Linux / AIX
        nc -zvw3 <server> <port>          # nc 가 없으면: telnet <server> <port>
        # Windows (PowerShell)
        Test-NetConnection <server> -Port <port>
      check: "성공(succeeded·TcpTestSucceeded True)이면 경로 정상 → 인증·애플리케이션 원인으로 분기 · refused 면 대상 서비스 미기동 · 시간 초과면 방화벽·경로 차단"
      note: "적용: RHEL 7~9 / AIX 7.1~7.3(nc 는 별도 설치일 수 있음) / Windows Server 2012 R2+ · 권한: 일반 사용자"
    - do: 대상 서버의 리슨·소켓 상태 확인
      cmd: |
        # Linux
        ss -ltnp | grep ':<port>' ; ss -tan state syn-sent | head
        # AIX
        netstat -an | grep LISTEN | grep <port>
        # Windows (PowerShell)
        Get-NetTCPConnection -LocalPort <port> | Group-Object State | Select-Object Name,Count
      check: "LISTEN 없음이면 서비스 미기동·바인드 실패 · 클라이언트 측 SYN_SENT 누적이면 중간 차단 · 정상 LISTEN 인데 실패면 접속 한도·인증 문제"
      note: "적용: Linux(iproute2 ss) / AIX 7.x / Windows Server 2012+ · 권한: 일반 사용자(ss -p 의 프로세스 이름은 root)"
    - do: 애플리케이션·커널 로그의 원인 문구 확인
      cmd: |
        grep -nE 'ORA-|TBR-|SQLState|Connection refused|timed out' <앱 로그> | tail -20
        # iSCSI 일 때 (Linux)
        iscsiadm -m session -P 1 ; dmesg -T | grep -i iscsi | tail -20
        # iSCSI 일 때 (Windows PowerShell)
        Get-IscsiSession | Select-Object TargetNodeAddress,IsConnected
      check: "DB 코드(ORA-12541 리스너 없음·풀 고갈·인증 실패)로 담당 분기 · iSCSI 세션 없음/IsConnected False 면 세션 끊김"
      note: "적용: open-iscsi(RHEL 7+) / Windows Server 2012+ · 권한: iscsiadm 은 root"
  - stage: 2
    steps:
    - do: 미기동 서비스 기동 또는 방화벽 정책 요청
      cmd: |
        # Linux
        systemctl start <service> ; systemctl status <service>
        # AIX
        startsrc -s <subsystem> ; lssrc -s <subsystem>
        # Windows (PowerShell)
        Start-Service <name> ; Get-Service <name>
      check: "성공: 대상 포트 LISTEN·1차 도달 시험 성공 · 실패: 기동 로그 오류 → 해당 제품 절차로 이관"
      note: "사전조건: 미기동 원인 로그 확보·의존 서비스(DB·네트워크) 정상 확인 · 영향: 기동 중 접속 일시 실패 · 승인: 서비스 담당 · 백업/롤백: 설정 변경 없음(기동 실패 시 원상태 유지 후 담당 이관), 방화벽 정책은 변경 전 규칙 번호 기록 · 적용: systemd(RHEL 7+)·AIX SRC·Windows 서비스"
    - do: iSCSI 세션 재로그인 (스토리지 연결)
      cmd: |
        # Linux
        iscsiadm -m node -T <target_iqn> -p <target_ip>:3260 --login
        multipath -ll
        # Windows (PowerShell)
        Connect-IscsiTarget -NodeAddress <target_iqn>
      check: "성공: 세션 목록에 대상 표시·multipath 경로 active ready · 실패: 로그인 오류(CHAP 인증·포털 무응답) → 스토리지 담당"
      note: "사전조건: 네트워크(전용 VLAN·MTU) 복구 확인 · 영향: 재로그인 순간 해당 LUN I/O 지연 · 승인: 스토리지·서버 담당 · 백업/롤백: 재로그인 전 `iscsiadm -m session -P 1` 출력 보관, 문제 시 `--logout` 후 원인 재조사 · 적용: open-iscsi / Windows Server 2012+"
    - do: 커넥션 풀 고갈이면 풀 설정 조정
      config:
        file: WAS 데이터소스 설정(제품별 — JEUS domain.xml · WebLogic config · Tomcat context.xml · JBoss standalone.xml)
        snippet: |
          # 최대 연결 수는 DB 세션 한도(processes/sessions·max_connections) 이내로
          # 유휴 연결 검사(validation)·유휴 타임아웃은 방화벽 세션 유휴 시간보다 짧게
        note: "사전조건: 미반환 연결(누수) 여부 확인 · 영향: 적용 시 WAS 재기동 필요할 수 있음 · 승인: WAS·DB 담당 · 백업/롤백: 변경 전 설정 파일 사본 보관 후 원복"
      check: "성공: 풀 대기·연결 실패 로그 소멸 · 실패: 풀 사용률이 계속 최대 → 누수 원인 코드 개발팀 이관"
  - stage: 3
    steps:
    - do: 제조사·유지보수사 의뢰 자료
      cmd: |
        # Linux
        ss -tanp > ss_$(date +%Y%m%d%H%M).txt ; journalctl --since '-2 hours' > journal_$(date +%Y%m%d%H%M).txt
        # Windows (PowerShell)
        Get-NetTCPConnection | Export-Csv tcp_$(Get-Date -Format yyyyMMddHHmm).csv
      check: "도달 시험 결과·소켓 상태·애플리케이션 오류 로그·발생 시각"
      note: "민감정보 마스킹: 호스트명·IP·계정·접속 문자열의 비밀번호를 가린 뒤 전달 · 전달 승인: 보안 담당"

- id: OSC-PROC-R5-INTERNAL
  products: [os-common]
  category: internal
  match: [LEG-COM-HIGH-CPU, LEG-GEN-SENSOR-WARN, LEG-GEN-SYSLOG-ERR, LEG-KW-SERVICE-DOWN, LEG-KW-CPU-WARN, LEG-KW-PROCESS-ERROR, LEG-KW-CONFIG-ERROR, LEG-KW-REPLICATION-FAIL, LEG-NET-IF-ERR, LEG-NET-DDOS, LEG-HW-WARN-LINK-ERR, LEG-STOR-NFS-SERVER]
  title: 시스템 내부 오류 신호 1차 분류 (CPU·서비스 다운·프로세스·설정·복제·인터페이스 오류·NFS)
  source: "RHEL 9 'Monitoring and managing system status and performance'·'Configuring and using NFS' / man7.org journalctl(1)·ss(8)·ethtool(8) / IBM AIX 7.2 errpt·lssrc·entstat / Microsoft Learn Get-WinEvent·Get-NetAdapterStatistics / Cisco IOS show interfaces"
  stages:
  - stage: 1
    steps:
    - do: 최근 시스템 오류와 서비스 상태 확인 (읽기 전용)
      cmd: |
        # Linux
        journalctl -p err -n 100 --no-pager ; systemctl --failed
        systemctl status <service> ; journalctl -u <service> -n 100 --no-pager
        # AIX
        errpt | head -30 ; lssrc -a | grep -v active | head -30
        # Windows (PowerShell)
        Get-WinEvent -FilterHashtable @{LogName='System';Level=1,2} -MaxEvents 50
        Get-Service | Where-Object Status -ne 'Running' | Where-Object StartType -eq 'Automatic'
      check: "failed 유닛·inoperative 서브시스템·자동 시작인데 멈춘 서비스가 있으면 서비스 다운 확정 · 같은 메시지 반복이면 그 발생 주체가 원인 후보"
      note: "적용: RHEL 7~9 / AIX 7.1~7.3 / Windows Server 2012+ · 권한: 일반 사용자(일부 로그는 root·관리자)"
    - do: CPU 점유·비정상 종료 프로세스 확인
      cmd: |
        # Linux
        top -bn1 | head -20 ; vmstat 1 5
        journalctl -k --since '-1 hour' | grep -iE 'segfault|out of memory' | tail -20
        # AIX
        vmstat 1 5 ; ps aux | sort -rn -k3 | head -10 ; errpt -J CORE_DUMP | head
        # Windows (PowerShell)
        Get-Process | Sort-Object CPU -Descending | Select-Object -First 10
      check: "us 높고 특정 프로세스 편중이면 응용 원인 · r 이 CPU 수 초과 지속이면 과부하 · segfault·CORE_DUMP 있으면 프로세스 결함(코어 보존 필요)"
      note: "적용: RHEL 7~9 / AIX 7.x / Windows · 권한: 일반 사용자"
    - do: 설정 문법·인터페이스 오류·NFS 확인 (해당 시)
      cmd: |
        # 설정 오류: 제품별 문법 검사만 (적용 없음)
        apachectl -t ; nginx -t ; sshd -t ; systemd-analyze verify <unit>
        # 서버 NIC 오류
        ethtool -S <nic> | grep -iE 'err|crc|drop'      # Linux
        entstat -d ent<N> | grep -iE 'error|crc'         # AIX
        # 네트워크 장비 (Cisco IOS 기준)
        show interfaces <if> | include errors|CRC|runts|giants
        # NFS 서버 (Linux)
        exportfs -v ; rpcinfo -p | grep -E 'nfs|mountd'
      check: "문법 검사 오류 줄 기록 · CRC·input errors 가 5분 사이 증가하면 물리 계층 문제 · nfs·mountd 미등록이면 NFS 서비스 이상"
      note: "적용: 각 제품 설치 시 · 권한: 문법 검사·ethtool·exportfs 는 root · 장비 명령은 읽기 권한 계정"
    - do: 센서·복제·트래픽 이상 확인 (해당 시)
      cmd: |
        ipmitool sensor list | grep -v '| ok'
        # 복제 상태 예: MySQL 'SHOW REPLICA STATUS\G' / PostgreSQL 'SELECT * FROM pg_stat_replication;'
        # 트래픽 급증 (Cisco IOS): show interfaces | include line protocol|input rate
      check: "경고 센서 값·임계 기록 · 복제 지연·오류 메시지 기록 · 평시 대비 수 배 유입이면 DDoS 의심으로 보안 담당 통보"
      note: "적용: IPMI 지원 서버·각 DB 판 · 권한: ipmitool 은 root"
  - stage: 2
    steps:
    - do: 원인 확인 후 서비스 재기동
      cmd: |
        # Linux
        systemctl restart <service> ; systemctl status <service>
        # AIX
        stopsrc -s <subsystem> ; startsrc -s <subsystem>
        # Windows (PowerShell)
        Restart-Service <name>
      check: "성공: 서비스 active/running·포트 LISTEN·오류 미재발 · 실패: 기동 오류 반복 → 코어·로그 보존 후 제품 담당 이관"
      note: "사전조건: 중단 원인 로그·코어 파일을 다른 파일시스템에 보존 · 영향: 재기동 동안 서비스 중단 · 승인: 서비스 담당·운영 책임자 · 백업/롤백: 설정 변경 없음 확인, 변경이 동반되면 변경 전 사본으로 원복 · 적용: systemd·AIX SRC·Windows 서비스"
    - do: 설정 오류면 직전 정상본 복원
      cmd: |
        cp -p <설정파일> <설정파일>.bad.$(date +%Y%m%d%H%M)
        cp -p <직전 백업본> <설정파일>
        apachectl -t      # 또는 nginx -t / sshd -t 등 제품별 문법 검사
      check: "성공: 문법 검사 통과 후 적용·서비스 정상 · 실패: 검사 오류 지속 → 변경 이력 담당 확인"
      note: "사전조건: 직전 정상 백업본 존재 확인 · 영향: 적용(reload) 시 순간 연결 재설정 가능 · 승인: 서비스 담당 · 백업/롤백: 현재 파일을 .bad 로 보관해 언제든 되돌림"
    - do: 인터페이스 오류 카운터 초기화 후 재측정 (네트워크 장비)
      cmd: |
        show interfaces <if>          # 초기화 전 출력 보관
        clear counters <if>
      check: "성공: 15분 뒤 오류 증가 없음 · 실패: 계속 증가 → 케이블·SFP·포트 교체"
      note: "사전조건: 현재 카운터 값 보관(증거) · 영향: 감시 도구의 누적 값 단절 · 승인: 네트워크 담당 · 백업/롤백: 초기화는 되돌릴 수 없으므로 출력 보관으로 대체"
  - stage: 3
    steps:
    - do: 제조사 의뢰 자료
      cmd: |
        # Linux (RHEL 8+)
        sos report --batch --tmp-dir /var/tmp
        # AIX
        snap -gc
        # Windows (PowerShell)
        Get-WinEvent -LogName System -MaxEvents 2000 | Export-Csv system_events.csv
      check: "sosreport·snap·이벤트 로그·발생 시각·코어 파일 위치"
      note: "민감정보 마스킹: sosreport·snap 안의 호스트명·IP·계정·설정 비밀값을 가린 뒤 전달 · 전달 승인: 보안 담당"

- id: OSC-PROC-R5-UPSTREAM
  products: [os-common]
  category: upstream
  match: [LEG-COM-NETWORK-TIMEOUT, LEG-GEN-WATCHDOG, LEG-NET-CPU, LEG-NET-LACP]
  title: 상위 구간 지연·차단 (네트워크 타임아웃·장비 CPU·LACP·워치독 재부팅)
  source: "man7.org traceroute(8)·ss(8)·journalctl(1) / RHEL 9 'Configuring kdump' / IBM AIX 7.2 traceroute·entstat / Microsoft Learn Test-NetConnection / Cisco IOS show processes cpu·show etherchannel·show lacp"
  stages:
  - stage: 1
    steps:
    - do: 구간 도달·지연 확인 (읽기 전용)
      cmd: |
        # Linux / AIX
        nc -zvw3 <server> <port> ; traceroute -n <server>
        # Windows (PowerShell)
        Test-NetConnection <server> -Port <port> -TraceRoute
      check: "특정 홉 이후 무응답이면 그 구간 · 포트만 실패면 방화벽 · 전 구간 지연 증가면 회선·장비 부하"
      note: "적용: RHEL 7~9 / AIX 7.x / Windows Server 2012 R2+ · 권한: 일반 사용자"
    - do: 네트워크 장비 CPU·포트채널 확인 (Cisco IOS 기준, 타 제조사는 동등 조회 명령)
      cmd: |
        show processes cpu sorted | exclude 0.00%
        show processes cpu history
        show etherchannel summary
        show lacp neighbor
      check: "5분 평균 CPU 70% 이상이면 장비 과부하 · 포트채널 멤버 플래그가 P(번들) 아님이면 LACP 이탈"
      note: "적용: Cisco IOS/IOS-XE · 권한: 읽기 전용 장비 계정"
    - do: 서버 측 본딩·워치독 재부팅 흔적 확인
      cmd: |
        # Linux
        cat /proc/net/bonding/bond0
        journalctl -k -b -1 | grep -iE 'watchdog|lockup|panic' | tail -30
        ls -lt /var/crash/ | head
        # AIX
        entstat -d ent<N> | head -60 ; errpt | head -20
      check: "본딩 슬레이브 MII Status down 이면 링크 이탈 · 직전 부팅에 lockup·panic 이 있으면 워치독 재부팅 원인 · vmcore 있으면 3차 자료"
      note: "적용: Linux bonding 드라이버·persistent journal 설정 시(-b -1) / AIX EtherChannel · 권한: root"
  - stage: 2
    steps:
    - do: 장비 비정상 트래픽 차단 또는 LACP 설정 일치
      cmd: |
        configure terminal
        interface <if>
         channel-group <N> mode active
        end
        # 비정상 트래픽: ACL·CoPP 정책은 보안 담당 승인 규칙만 적용
      check: "성공: show etherchannel summary 에 모든 멤버 P · 장비 CPU 정상화 · 실패: 번들 안 됨 → 양단 속도·듀플렉스·모드 재확인"
      note: "사전조건: show running-config 백업·상대 장비 설정 확인 · 영향: 멤버 재협상 중 순간 대역 감소 · 승인: 네트워크 담당 · 백업/롤백: 변경 전 running-config 로 복원 · 적용: Cisco IOS(타 제조사 동등 설정)"
    - do: 워치독 재부팅 재발 대비 kdump 활성화
      cmd: |
        systemctl enable --now kdump ; kdumpctl status
      check: "성공: kdump 'Kdump is operational' · 실패: crashkernel 예약 없음 → 부트 파라미터 추가 후 재부팅 일정"
      note: "사전조건: crashkernel 메모리 예약·/var/crash 공간 확보 · 영향: 예약 메모리만큼 가용 메모리 감소, 부트 파라미터 변경 시 재부팅 필요 · 승인: 서버 담당 · 백업/롤백: 변경 전 grub 설정 사본 보관 · 적용: RHEL 7~9"
    - do: 애플리케이션 타임아웃 값 조정 (원인 해소 후)
      config:
        file: 애플리케이션·WAS 연결 설정(connect/read timeout)
        snippet: |
          # 연결 3초 · 응답은 업무 기준 · 재시도는 백오프(예: 1s→2s→4s, 최대 3회)
        note: "사전조건: 상위 구간 원인 해소 · 영향: 값 증가 시 스레드 점유 시간 증가 · 승인: 서비스 담당 · 백업/롤백: 변경 전 설정 사본으로 원복"
      check: "성공: 타임아웃 로그 감소·응답시간 정상 · 실패: 지속 → 상위 구간 재조사"
  - stage: 3
    steps:
    - do: 통신사·장비 제조사·OS 제조사 의뢰 자료
      cmd: |
        traceroute -n <server> > trace_$(date +%Y%m%d%H%M).txt
        # 장비: show tech-support 를 파일로 저장(장비 운영 절차에 따름)
        # Linux: /var/crash/<날짜>/vmcore-dmesg.txt
      check: "경로 추적·장비 진단 출력·vmcore·발생 시각"
      note: "민감정보 마스킹: 장비 설정의 비밀번호·SNMP 커뮤니티·IP 를 가린 뒤 전달 · 전달 승인: 보안 담당"

- id: OSC-PROC-R5-DISK
  products: [os-common]
  category: disk
  match: [LEG-COM-BACKUP-FAIL, LEG-KW-DISK-WARN, LEG-STOR-LUN-OFFLINE, LEG-VMW-DATASTORE-FULL, LEG-KVM-STORAGE-ERROR]
  title: 디스크·LUN·데이터스토어 장애와 백업 실패 (계층 공통)
  source: "RHEL 9 'Configuring device mapper multipath'·'Managing storage devices' / man7.org smartctl(8)·virsh(1) / IBM AIX 7.2 lspath·errpt·df / Microsoft Learn Get-PhysicalDisk·mpclaim / VMware ESXi esxcli storage"
  stages:
  - stage: 1
    steps:
    - do: 공간·백업 실패 원인 확인 (읽기 전용)
      cmd: |
        # Linux
        df -h <경로> ; df -i <경로> ; tail -100 <백업로그경로> | grep -iE 'error|fail|denied|no space'
        # AIX
        df -g <경로>
        # Windows (PowerShell)
        Get-Volume | Select-Object DriveLetter,SizeRemaining,Size
      check: "사용률 95% 이상·inode 고갈이면 공간 원인 · 'denied' 면 권한 · 원격 대상 접속 오류면 네트워크"
      note: "적용: RHEL 7~9 / AIX 7.x / Windows Server 2012+ · 권한: 일반 사용자"
    - do: 디스크 건강·경로 상태 확인
      cmd: |
        # Linux
        smartctl -H /dev/<sdX> ; multipath -ll ; dmesg -T | grep -iE 'I/O error|offline' | tail -20
        # AIX
        lspath | grep -v Enabled ; errpt -d H | head -20
        # Windows
        Get-PhysicalDisk | Select-Object FriendlyName,HealthStatus,OperationalStatus
        mpclaim -s -d
      check: "SMART FAILED·failed faulty 경로·Missing/Failed lspath·HealthStatus Unhealthy 면 장치·경로 장애 확정"
      note: "적용: smartmontools·device-mapper-multipath(RHEL) / AIX MPIO / Windows MPIO · 권한: root·관리자"
    - do: 가상화 저장소 확인 (해당 시)
      cmd: |
        # VMware ESXi
        esxcli storage filesystem list
        # KVM
        virsh domblkerror <vm> ; virsh domblklist <vm> ; qemu-img info -U <image_path>
      check: "데이터스토어 Free 5% 이하면 VM 정지 위험 · domblkerror 에 'no space' 면 이미지 저장소 공간 부족"
      note: "적용: ESXi 6.x~8.x / libvirt·QEMU 2.10+(-U) · 권한: ESXi root(SSH)·libvirt 관리 권한"
  - stage: 2
    steps:
    - do: 공간 확보(정리·증설) 후 실패 작업 재실행
      cmd: |
        # 정리 대상 목록만 먼저 출력해 검토
        find <백업경로> -xdev -type f -mtime +<보존일> -ls | head -50
        # 승인 후 해당 파일 정리, 또는 볼륨 증설(LVM 예) lvextend -r -L +<크기>G /dev/<vg>/<lv>
      check: "성공: 사용률 85% 이하·백업 작업 성공 · 실패: VG 여유 없음 → 디스크 추가 요청"
      note: "사전조건: 보존 기간·업무 담당 확인, 정리 대상 목록 검토 · 영향: 증설 중 I/O 지연 · 승인: 시스템·백업 담당 · 백업/롤백: 정리 전 대상 목록·필요 시 tar 보관, 증설은 되돌릴 수 없어 용량 계획에 반영 · 적용: LVM(RHEL 7+ lvextend -r)"
    - do: 디스크 교체·경로 재스캔
      cmd: |
        # Linux
        rescan-scsi-bus.sh ; multipath -ll
        # AIX
        cfgmgr ; lspath
      check: "성공: 모든 경로 Enabled/active ready · 실패: 경로 미복구 → 스토리지·스위치 담당"
      note: "사전조건: 스토리지 측 LUN·매핑 복구 확인, 교체 디스크 RAID 상태 확인 · 영향: 재스캔 중 순간 I/O 지연 · 승인: 스토리지·서버 담당 · 백업/롤백: 재스캔 전 multipath -ll·lspath 출력 보관"
    - do: 데이터스토어 여유 확보 (VMware)
      cmd: |
        # vCenter › VM › 스냅샷 › 모두 삭제(통합) 또는 Storage vMotion 으로 VM 이동
      check: "성공: 데이터스토어 Free 15% 이상 · 실패: 통합 오류 → VMware 지원"
      note: "사전조건: 스냅샷 용도(백업 진행 중 여부)·업무 담당 확인 · 영향: 통합 중 VM I/O 지연 · 승인: 가상화 담당 · 백업/롤백: 통합은 되돌릴 수 없으므로 사전 VM 백업 확인"
  - stage: 3
    steps:
    - do: 스토리지·서버 제조사 의뢰 자료
      cmd: |
        smartctl -a /dev/<sdX> > smart_$(date +%Y%m%d).txt ; multipath -ll > mpath_$(date +%Y%m%d).txt
        # AIX: snap -gc   · ESXi: vm-support
      check: "SMART 전체·경로 상태·errpt/dmesg·장치 모델·펌웨어"
      note: "민감정보 마스킹: 호스트명·WWN 외 IP·계정 가림 · 전달 승인: 보안 담당"

- id: OSC-PROC-R5-CAPACITY
  products: [os-common]
  category: capacity
  match: [LEG-GEN-SENSOR-CRIT, LEG-KW-TIMEOUT]
  title: 센서 임계 초과·처리 시간 초과 (자원 포화 1차 분류)
  source: "man7.org ipmitool(1)·vmstat(8) / IBM AIX 7.2 vmstat / Microsoft Learn Get-Counter"
  stages:
  - stage: 1
    steps:
    - do: CRITICAL 센서 식별 (읽기 전용)
      cmd: |
        ipmitool sdr list | grep -v '| ok' | grep -v '| ns'
        ipmitool sel elist | tail -20
      check: "cr·nr 상태 센서가 온도·전압·팬 중 무엇인지 기록 — 하드웨어 위험이면 즉시 2차 통보"
      note: "적용: IPMI 지원 서버(iLO·iDRAC·IMM/XCC BMC) · 권한: root"
    - do: 자원 포화·타임아웃 구간 확인
      cmd: |
        # Linux / AIX
        vmstat 1 5
        grep -niE 'timed out|timeout' <앱 로그> | tail -30
        # Windows (PowerShell)
        Get-Counter '\Processor(_Total)\% Processor Time' -SampleInterval 2 -MaxSamples 5
      check: "r 이 CPU 수 초과·wa 높음이면 CPU·I/O 포화 · 타임아웃 대상이 특정 호스트에 몰리면 그 대상 문제"
      note: "적용: RHEL 7~9 / AIX 7.x / Windows · 권한: 일반 사용자"
  - stage: 2
    steps:
    - do: 하드웨어 위험이면 서비스 우회 후 계획 정지
      cmd: |
        # L4·로드밸런서에서 해당 서버 제외 요청 → 업무 이전 확인
        # 그 다음 제조사 지침에 따라 정지·부품 교체
      check: "성공: 서비스가 다른 서버에서 정상·센서 정상화 · 실패: 우회 불가 → 운영 책임자 판단"
      note: "사전조건: 이중화 서버 정상 확인 · 영향: 정지 동안 해당 서버 서비스 불가 · 승인: 운영 책임자 · 백업/롤백: 우회는 L4 설정 원복으로 되돌림"
    - do: 타임아웃 값 조정 (원인 해소 후)
      config:
        file: 애플리케이션·WAS 타임아웃 설정
        snippet: |
          # 연결·응답 타임아웃을 구간별로 분리, 원인 해소 없이 값만 늘리지 않는다
        note: "사전조건: 포화 원인 해소 · 영향: 스레드 점유 증가 가능 · 승인: 서비스 담당 · 백업/롤백: 변경 전 값 기록 후 원복"
      check: "성공: 타임아웃 건수 감소 · 실패: 지속 → 자원 증설 검토"
  - stage: 3
    steps:
    - do: 제조사 의뢰 자료
      cmd: |
        ipmitool sel elist > sel_$(date +%Y%m%d).txt ; ipmitool sdr list > sdr_$(date +%Y%m%d).txt
      check: "SEL·SDR·장비 모델·시리얼·발생 시각"
      note: "민감정보 마스킹: BMC IP·계정 가림 · 전달 승인: 보안 담당"

- id: OSC-PROC-R5-MEMORY
  products: [os-common]
  category: memory
  match: [LEG-KW-HW-CRITICAL, LEG-KW-MEM-WARN, LEG-VMW-WARN-RESOURCE, LEG-VMW-RESOURCE-CONTENTION, LEG-KVM-OVERCOMMIT]
  title: 메모리 결함(ECC·HW CRITICAL)과 가상화 메모리 경합 (계층 공통)
  source: "RHEL 9 'Monitoring and managing system status and performance'(rasdaemon) / man7.org ipmitool(1)·virsh(1) / IBM AIX 7.2 errpt / Microsoft Learn Get-WinEvent(WHEA) / VMware esxtop"
  stages:
  - stage: 1
    steps:
    - do: 메모리 하드웨어 이벤트 확인 (읽기 전용)
      cmd: |
        ipmitool sel elist | grep -iE 'memory|ecc|dimm|critical' | tail -20
        # Linux
        ras-mc-ctl --errors
        # AIX
        errpt -d H | head -20
        # Windows (PowerShell)
        Get-WinEvent -ProviderName Microsoft-Windows-WHEA-Logger -MaxEvents 20
      check: "Uncorrectable 이면 즉시 2차 통보(서비스 우회 준비) · 같은 DIMM 의 Correctable 다발이면 교체 예정"
      note: "적용: IPMI 서버·rasdaemon(RHEL 7.x 후기~9) / AIX 7.x / Windows Server 2012+ · 권한: root·관리자"
    - do: 가상화 메모리 경합 확인 (해당 시)
      cmd: |
        # VMware ESXi (대화형 esxtop 의 m 화면: MCTLSZ·SWCUR)
        esxtop -b -n 1 > /tmp/esxtop_$(date +%H%M).csv
        # KVM 호스트
        free -m ; virsh nodememstats ; cat /sys/kernel/mm/ksm/pages_sharing ; vmstat 1 5
      check: "Balloon(MCTLSZ)·Swap(SWCUR)>0 이면 호스트 메모리 경합 · KVM 호스트 si/so 지속이면 오버커밋 과다"
      note: "적용: ESXi 6.x~8.x / libvirt(RHEL 7~9) · 권한: ESXi root·libvirt 관리 권한"
  - stage: 2
    steps:
    - do: 결함 DIMM 교체 (제조사)
      cmd: |
        # L4 에서 서버 제외 → 업무 이전 확인 → 제조사 엔지니어 교체 → 제조사 진단 도구로 검사
      check: "성공: 교체 후 SEL 에 새 메모리 오류 없음 · 실패: 오류 지속 → 메인보드·CPU 진단"
      note: "사전조건: 최신 백업 성공·이중화 확인 · 영향: 교체 동안 서버 정지 · 승인: 운영 책임자 · 백업/롤백: 교체 전 BIOS 설정 내보내기 보관"
    - do: VM 이동·메모리 할당 조정
      cmd: |
        # VMware: vCenter 에서 경합 VM 을 여유 호스트로 vMotion
        # KVM: virsh setmem <vm> <크기>KiB --live   (balloon 지원 VM)
      check: "성공: Balloon·Swap 0·VM 응답 정상 · 실패: 경합 지속 → 호스트 증설"
      note: "사전조건: 대상 호스트 여유 확인, 축소 대상 VM 의 실제 사용량 확인 · 영향: 축소 시 VM 내부 메모리 압박 가능 · 승인: 가상화 담당·업무 담당 · 백업/롤백: 변경 전 `virsh dumpxml <vm>`·이동 전 위치 기록"
  - stage: 3
    steps:
    - do: 제조사 의뢰 자료
      cmd: |
        ipmitool sel elist > sel_$(date +%Y%m%d).txt
        # Linux: sos report --batch · ESXi: vm-support
      check: "SEL·rasdaemon 기록·DIMM 위치·시리얼"
      note: "민감정보 마스킹: 호스트명·IP·계정 가림 · 전달 승인: 보안 담당"

- id: OSC-PROC-R5-STORAGE
  products: [os-common]
  category: storage
  match: [LEG-KW-RAID-WARN, LEG-KW-VM-WARN, LEG-HW-WARN-BATTERY, LEG-STOR-CACHE-FAIL, LEG-STOR-POOL-FULL, LEG-STOR-REPL-FAIL, LEG-STOR-SNAPSHOT-FAIL, LEG-STOR-DEDUP-FAIL, LEG-STOR-COMPRESS-WARN, LEG-STOR-FIRMWARE, LEG-VMW-VSAN-ERROR]
  title: RAID·캐시 배터리·스토리지 풀/복제/스냅샷·vSAN 이상 (계층 공통)
  source: "Broadcom StorCLI 조회 명령(show) · HPE Smart Storage Administrator CLI(ssacli show) · Linux md(mdadm(8)) · VMware vSAN esxcli vsan · 각 스토리지 제조사 관리 콘솔"
  verify_note: "미검증 — 외장 스토리지 어레이(EMC·NetApp·HPE 등)별 CLI 는 제조사 문서를 확인하지 못해 관리 콘솔 화면 경로만 적었다. Dell perccli 는 storcli 와 같은 문법으로 가정"
  stages:
  - stage: 1
    steps:
    - do: 서버 RAID 컨트롤러·배터리 상태 (읽기 전용)
      cmd: |
        # Broadcom/LSI
        storcli /c0 show ; storcli /c0/vall show ; storcli /c0/eall/sall show
        storcli /c0/bbu show all ; storcli /c0/cv show all
        # HPE
        ssacli ctrl all show status ; ssacli ctrl all show config
        # Linux 소프트웨어 RAID
        cat /proc/mdstat
      check: "Dgrd·Failed·Rbld·[U_] 면 RAID 저하 · 배터리 이상·캐시 WT 전환이면 쓰기 성능 저하 원인"
      note: "적용: 제조사 도구 설치 서버 · 권한: root"
    - do: 외장 스토리지·가상화 저장소 상태 (관리 콘솔·조회 명령)
      cmd: |
        # 스토리지 관리 콘솔: 풀 사용률·Thin 초과 할당·캐시·복제(마지막 성공 시각·지연)·스냅샷 예약 공간·계층화·펌웨어 판 화면 캡처
        # vSAN (ESXi)
        esxcli vsan cluster get ; esxcli vsan network list
      check: "풀 90% 이상·복제 지연이 RPO 초과·스냅샷 예약 100%·컨트롤러 간 펌웨어 판 불일치·vSAN 멤버 수 부족이면 해당 항목 2차"
      note: "적용: 각 제조사 콘솔 / vSAN 6.x~8.x · 권한: 콘솔 조회 계정·ESXi root"
  - stage: 2
    steps:
    - do: RAID 디스크·배터리 교체 (제조사)
      cmd: |
        # 교체 후 재구성 진행 확인
        storcli /c0/eall/sall show rebuild
      check: "성공: 재구성 완료·논리 드라이브 Optl · 실패: 재구성 중 추가 오류 → 제조사 긴급"
      note: "사전조건: 최신 백업 성공·교체 부품 호환 확인 · 영향: 재구성 동안 I/O 성능 저하 · 승인: 서버 담당 · 백업/롤백: 교체 전 storcli/ssacli 출력 보관(교체는 되돌리지 않음)"
    - do: 스토리지 풀 여유 확보·복제 재동기화
      cmd: |
        # 관리 콘솔: 만료 스냅샷 정리 또는 풀 확장 / 복제 링크 복구 후 재동기화(Resync)
      check: "성공: 풀 80% 이하·복제 지연 정상 · 실패: 재동기화 오류 → 제조사 지원"
      note: "사전조건: 스냅샷 보존 정책·업무 담당 확인, 재동기화 전 대상 측 스냅샷 확보 · 영향: 재동기화 중 링크·스토리지 부하 · 승인: 스토리지 담당 · 백업/롤백: 삭제는 되돌릴 수 없으므로 대상 목록 검토·승인 기록"
  - stage: 3
    steps:
    - do: 제조사 의뢰 자료
      cmd: |
        storcli /c0 show all > storcli_$(date +%Y%m%d).txt
        # 외장 스토리지: 관리 콘솔의 진단 번들(support bundle) 생성 · ESXi: vm-support
      check: "컨트롤러 전체 상태·이벤트 로그·펌웨어 판·장비 시리얼"
      note: "민감정보 마스킹: 관리 IP·계정·호스트명 가림 · 전달 승인: 보안 담당"

- id: OSC-PROC-R5-LOCK
  products: [os-common]
  category: lock
  match: [LEG-KW-AUTH-FAIL, LEG-KW-FILE-ERROR]
  title: 인증 실패·계정 잠금과 파일 접근 거부 (계층 공통)
  source: "RHEL 9 'Security hardening'(faillock)·'Using SELinux'(ausearch, restorecon) / IBM AIX 7.2 lsuser·/etc/security/failedlogin / Microsoft Learn Get-WinEvent(4625)·Get-Acl"
  stages:
  - stage: 1
    steps:
    - do: 인증 실패 계정·출발지 확인 (읽기 전용)
      cmd: |
        # Linux (Debian 계열은 /var/log/auth.log)
        grep -iE 'authentication failure|Failed password' /var/log/secure | tail -30
        faillock --user <user>            # RHEL 8+ (RHEL 7: pam_tally2 -u <user>)
        # AIX
        who /etc/security/failedlogin | tail -20
        lsuser -a unsuccessful_login_count account_locked <user>
        # Windows (PowerShell)
        Get-WinEvent -FilterHashtable @{LogName='Security';Id=4625} -MaxEvents 20
      check: "한 IP 에서 여러 계정·짧은 간격 반복이면 무차별 대입 의심(보안 담당 통보) · 단일 서비스 계정 반복이면 자격 증명 변경 미반영"
      note: "적용: RHEL 7~9 / AIX 7.x / Windows Server 2012+ · 권한: root·관리자(보안 로그)"
    - do: 파일 경로·권한·SELinux 확인
      cmd: |
        # Linux / AIX
        ls -ld <path> <상위디렉터리> ; id <실행계정>
        getenforce ; ausearch -m avc -ts recent | tail -20      # Linux SELinux
        # Windows (PowerShell)
        Get-Acl <path> | Format-List
      check: "경로 없음·소유자 불일치·쓰기 권한 없음이면 권한 원인 · AVC denied 가 있으면 SELinux 원인"
      note: "적용: RHEL 7~9(SELinux) / AIX / Windows · 권한: ausearch 는 root"
  - stage: 2
    steps:
    - do: 정당 사용자 확인 후 잠금 해제·자격 증명 갱신
      cmd: |
        # Linux
        faillock --user <user> --reset
        # AIX
        chsec -f /etc/security/lastlog -a unsuccessful_login_count=0 -s <user>
      check: "성공: 로그인 성공·실패 로그 소멸 · 실패: 다시 잠김 → 자동 재시도 주체(서비스 설정) 찾기"
      note: "사전조건: 본인 확인·보안 담당 확인(공격 의심 아님) · 영향: 잠금 해제된 계정 접근 가능 · 승인: 보안 담당 · 백업/롤백: 변경 전 잠금 상태 출력 보관, 의심 시 다시 잠금"
    - do: 권한·SELinux 컨텍스트 복원
      cmd: |
        getfacl -R <path> > acl_backup_$(date +%Y%m%d).txt
        chown <user>:<group> <path> ; chmod <mode> <path>
        restorecon -v <path>
      check: "성공: 애플리케이션 파일 접근 성공·AVC 미발생 · 실패: 여전히 거부 → 정책(semanage fcontext) 검토"
      note: "사전조건: 올바른 소유자·권한 기준 확인 · 영향: 권한 변경이 다른 프로세스 접근에 영향 · 승인: 시스템 담당 · 백업/롤백: getfacl 백업으로 `setfacl --restore=acl_backup_<날짜>.txt` 원복"
  - stage: 3
    steps:
    - do: 보안 담당·제조사 의뢰 자료
      cmd: |
        grep -iE 'authentication failure|Failed password' /var/log/secure > auth_fail_$(date +%Y%m%d).txt
        ausearch -m avc -ts today > avc_$(date +%Y%m%d).txt
      check: "실패 시각·출발지·계정·AVC 기록"
      note: "민감정보 마스킹: 계정명·출발 IP 는 보안 담당 외 전달 시 가림 · 전달 승인: 보안 담당"

- id: OSC-PROC-R5-SECURITY
  products: [os-common]
  category: security
  match: [LEG-KW-SECURITY-WARN, LEG-NET-BGP, LEG-VMW-CERT-EXPIRE]
  title: 보안 위협 탐지·BGP 세션 다운·인증서 만료 (계층 공통)
  source: "OpenSSL x509/s_client 매뉴얼 / Cisco IOS show ip bgp summary·neighbors / VMware vCenter 인증서 관리 / RHEL 9 'Security hardening'"
  stages:
  - stage: 1
    steps:
    - do: 공격 흔적 확인 (읽기 전용, 증거 보존)
      cmd: |
        grep -iE 'intrusion|brute|injection|xss|csrf|suspicious' <보안로그·웹로그> | tail -30
        awk '{print $1}' <access_log> | sort | uniq -c | sort -rn | head -10
      check: "같은 IP 다수 요청·공격 패턴이면 보안 담당 즉시 통보 — 원본 로그는 수정·이동하지 않고 사본으로만 분석"
      note: "적용: 웹 로그 공통 형식(combined) · 권한: 로그 읽기 권한"
    - do: BGP 세션 상태 (Cisco IOS 기준)
      cmd: |
        show ip bgp summary
        show ip bgp neighbors <peer_ip> | include BGP state|Last reset
      check: "State 가 Idle·Active 면 세션 다운 · Last reset 사유(Hold timer expired·인증)로 원인 분기"
      note: "적용: Cisco IOS/IOS-XE · 권한: 읽기 전용 장비 계정"
    - do: 인증서 만료일 확인
      cmd: |
        openssl s_client -connect <server>:443 -servername <host> </dev/null 2>/dev/null | openssl x509 -noout -subject -enddate
        openssl x509 -enddate -noout -in <인증서경로>
      check: "notAfter 가 현재 이전이면 만료 · 30일 이내면 갱신 착수"
      note: "적용: OpenSSL 1.0.2+ · 권한: 일반 사용자"
  - stage: 2
    steps:
    - do: 공격 출발지 차단 (보안 담당 승인 규칙)
      cmd: |
        # Linux firewalld
        firewall-cmd --add-rich-rule='rule family=ipv4 source address=<attacker_ip> drop'
      check: "성공: 해당 IP 요청 소멸·정상 사용자 영향 없음 · 실패: 출발지 분산 → WAF·ISP 필터링 요청"
      note: "사전조건: 오탐(정상 사용자·내부 점검) 아님 확인 · 영향: 차단 IP 전체 접근 불가 · 승인: 보안 담당 · 백업/롤백: `firewall-cmd --remove-rich-rule='…'` 로 해제(런타임 규칙은 재시작 시 소멸) · 적용: RHEL 7~9"
    - do: 인증서 갱신·BGP 설정 수정
      cmd: |
        # 인증서: 새 인증서·체인 설치 후 제품별 문법 검사(apachectl -t 등) → graceful 적용
        # vCenter: 관리 › 인증서 관리 또는 vSphere Certificate Manager
        # BGP: 피어와 합의한 타이머·인증 값으로 router bgp 설정 수정
      check: "성공: 새 만료일 확인·BGP Established · 실패: 체인 오류·세션 미수립 → 설정 원복 후 제조사·ISP 문의"
      note: "사전조건: 기존 인증서·키·running-config 백업, vCenter 는 파일 기반 백업 선행 · 영향: 적용 순간 연결 재설정 · 승인: 서비스·네트워크 담당 · 백업/롤백: 보관한 기존 인증서·설정으로 원복"
  - stage: 3
    steps:
    - do: 보안·제조사 의뢰 자료
      cmd: |
        cp <보안로그> /var/tmp/evidence_$(date +%Y%m%d%H%M).log
        sha256sum /var/tmp/evidence_*.log
      check: "증거 로그 사본·해시·발생 시각·차단 이력"
      note: "민감정보 마스킹: 사용자 개인정보·내부 IP 는 외부 전달 시 가림 · 전달 승인: 보안 담당(침해 사고는 보고 체계 따름)"

- id: OSC-PROC-R5-PERFORMANCE
  products: [os-common]
  category: performance
  match: [LEG-KW-HEALTH-FAIL, LEG-HW-CPU-THROTTLE]
  title: 헬스체크 실패·CPU 스로틀링 (계층 공통)
  source: "curl 매뉴얼 / man7.org ipmitool(1)·journalctl(1) / RHEL 9 'Monitoring and managing system status and performance'(cpupower)"
  stages:
  - stage: 1
    steps:
    - do: 헬스체크 재현·의존 서비스 확인 (읽기 전용)
      cmd: |
        curl -s -o /dev/null -w '%{http_code} %{time_total}\n' --max-time 5 http://<server>:<port>/<health>
        nc -zvw3 <db_host> <port>
        # Windows (PowerShell)
        Invoke-WebRequest -UseBasicParsing http://<server>:<port>/<health>
      check: "200 이 아니거나 수 초 이상이면 실패 재현 · 의존 서비스 도달 실패면 그쪽이 원인"
      note: "적용: curl 7.x / Windows PowerShell 5.1 · 권한: 일반 사용자"
    - do: CPU 온도·주파수 확인
      cmd: |
        ipmitool sdr type Temperature
        journalctl -k | grep -iE 'throttl|thermal' | tail -20
        grep MHz /proc/cpuinfo | sort | uniq -c
      check: "온도 경고·throttled 메시지·정격 대비 낮은 주파수면 스로틀링 확정 — 냉각·전원 정책 원인"
      note: "적용: IPMI 서버·Linux(RHEL 7~9) · 권한: ipmitool 은 root"
  - stage: 2
    steps:
    - do: 원인 서비스 복구 후 헬스체크 재통과 확인
      cmd: |
        systemctl restart <service> ; curl -s -o /dev/null -w '%{http_code}\n' http://<server>:<port>/<health>
      check: "성공: 200 응답·L4 에서 서버 재투입 · 실패: 계속 실패 → 제품 절차로 이관"
      note: "사전조건: 원인 로그 보존·의존 서비스 정상 · 영향: 재기동 동안 해당 서버 서비스 중단 · 승인: 서비스 담당 · 백업/롤백: 설정 변경 없음, 변경 시 사본으로 원복"
    - do: 스로틀링이면 냉각 복구·전원 정책 조정
      cmd: |
        # 냉각: 시설 담당 항온항습 점검 / 팬 교체는 제조사
        # 전원 정책: 계획 정지 시 BIOS 전원 프로필 변경(제조사 권고 범위)
      check: "성공: 주파수 정격 복귀·throttle 메시지 소멸 · 실패: 지속 → 제조사 하드웨어 진단"
      note: "사전조건: BIOS 설정 내보내기 · 영향: BIOS 변경은 재부팅 필요 · 승인: 운영 책임자 · 백업/롤백: 내보낸 BIOS 설정으로 원복"
  - stage: 3
    steps:
    - do: 제조사 의뢰 자료
      cmd: |
        ipmitool sel elist > sel_$(date +%Y%m%d).txt ; journalctl -k --since '-1 day' > kernel_$(date +%Y%m%d).log
      check: "SEL·커널 로그·헬스체크 실패 시각"
      note: "민감정보 마스킹: 호스트명·IP 가림 · 전달 승인: 보안 담당"

# ───────────────────────── SW 계층 공통 (애플리케이션) ─────────────────────────
- id: SWC-PROC-R5-APP
  products: [sw-common]
  category: app
  match: [APP-NPE-001, APP-CODE-002, APP-STATE-003, APP-DEPLOY-005, APP-SQL-006, APP-DATA-007]
  title: 애플리케이션 소스·배포·SQL 매핑·데이터 형식 결함 (인프라 조치 대상 아님)
  source: "Java SE API 문서(java.lang 예외) · Spring Framework·MyBatis·Jackson 예외 문서 · OpenJDK jar 도구"
  stages:
  - stage: 1
    steps:
    - do: 예외의 첫 업무 패키지 줄·빈도 확보 (읽기 전용)
      cmd: |
        grep -n -A30 '<예외 클래스>' <앱 로그> | grep -m5 'at <업무 패키지 접두어>'
        grep -c '<예외 클래스>' <앱 로그>
      check: "같은 클래스:줄 반복·특정 화면/입력에서만 발생이면 소스·데이터 결함 — WAS/DB 재기동으로 해결되지 않음"
      note: "적용: Java 애플리케이션 공통 · 권한: 로그 읽기 권한"
    - do: 배포·라이브러리 문제 확인 (NoClassDefFound·NoSuchMethod 계열)
      cmd: |
        ls -lt <배포 디렉터리> | head
        ls <애플리케이션>/WEB-INF/lib | sort
        unzip -l <애플리케이션>.war | grep '<클래스 경로>'
      check: "최근 배포 직후 시작이면 배포 산출물 누락·버전 충돌 · 같은 라이브러리의 두 판이 함께 있으면 충돌"
      note: "적용: WAR/JAR 배포 · 권한: 배포 디렉터리 읽기"
    - do: SQL·데이터 형식 오류의 근거 확보
      cmd: |
        grep -n -B2 -A10 'BadSqlGrammarException\|PersistenceException\|JsonParseException' <앱 로그> | tail -40
      check: "예외 속 SQL·매퍼 ID·DB 오류 코드 또는 필드명·위치 기록 — DB 가 다른 화면에 정상 응답하면 DB 장애 아님"
      note: "적용: Spring·MyBatis·Jackson 사용 시 · 권한: 로그 읽기 권한"
  - stage: 2
    steps:
    - do: 직전 정상 배포본으로 롤백 (배포 결함 확인 시)
      cmd: |
        # WAS 별 배포 도구로 직전 정상 아카이브 재배포 (JEUS jeusadmin · WebLogic · JBoss jboss-cli · Tomcat manager)
      check: "성공: 해당 예외 소멸·업무 화면 정상 · 실패: 예외 지속 → 데이터·설정 원인으로 개발팀 분석"
      note: "사전조건: 직전 정상 아카이브 보관 확인·DB 스키마 변경 동반 여부 확인 · 영향: 재배포 동안 해당 애플리케이션 중단 · 승인: 개발 책임자·운영 책임자 · 백업/롤백: 현재 아카이브 보관 후 롤백, 필요 시 재롤백"
    - do: 개발팀 수정본 배포
      cmd: |
        # 변경 승인된 수정본을 검증계에서 확인 후 운영 배포
      check: "성공: 동일 입력 재처리 성공 · 실패: 재현 → 수정 범위 재검토"
      note: "사전조건: 검증계 시험 통과 · 영향: 배포 동안 중단 · 승인: 변경관리 승인 · 백업/롤백: 이전 배포본 보관 후 원복"
  - stage: 3
    steps:
    - do: 개발팀·솔루션 공급사 전달 자료
      cmd: |
        grep -n -A40 '<예외 클래스>' <앱 로그> > exception_$(date +%Y%m%d%H%M).txt
      check: "스택트레이스·발생 시각·빈도·배포 이력·라이브러리 목록"
      note: "민감정보 마스킹: 로그 속 주민번호·전화번호·계정·요청 본문 개인정보 가림 · 전달 승인: 개인정보 보호 담당"

- id: SWC-PROC-R5-PERFORMANCE
  products: [sw-common]
  category: performance
  match: [APP-TX-008]
  title: 트랜잭션 타임아웃·예기치 않은 롤백 (애플리케이션)
  source: "Spring Framework 'Transaction Management'(TransactionTimedOutException·UnexpectedRollbackException) · Oracle Database Reference(V$SESSION) · PostgreSQL 문서(pg_stat_activity) · OpenJDK jcmd"
  stages:
  - stage: 1
    steps:
    - do: 타임아웃 발생 업무·값 확인 (읽기 전용)
      cmd: |
        grep -n -B5 'TransactionTimedOutException\|UnexpectedRollbackException' <앱 로그> | tail -40
      check: "특정 배치·대량 조회에서만 나면 처리량 문제 · 예외 전 다른 예외가 있으면 잘못된 롤백 처리(코드)"
      note: "적용: Spring 기반 애플리케이션 · 권한: 로그 읽기"
    - do: 같은 시각 DB 대기 확인 (DB 담당 요청)
      cmd: |
        # Oracle
        SELECT sid,event,seconds_in_wait,blocking_session,sql_id FROM v$session WHERE status='ACTIVE' AND type='USER';
        # PostgreSQL
        SELECT pid,state,wait_event_type,wait_event,now()-query_start AS dur FROM pg_stat_activity WHERE state<>'idle' ORDER BY dur DESC LIMIT 20;
      check: "잠금 대기·장시간 SQL 이 있으면 DB 측 원인 · DB 정상이면 트랜잭션 범위(코드) 원인"
      note: "적용: Oracle 10g+·PostgreSQL 10+ · 권한: DB 조회 권한(DBA 실행)"
    - do: WAS 스레드 덤프 (프로세스 유지)
      cmd: |
        jcmd <PID> Thread.print > td_$(date +%H%M%S).txt
      check: "다수 스레드가 같은 JDBC 호출에서 대기하면 DB 지연 · 같은 업무 메서드에 몰리면 처리 로직"
      note: "적용: JDK 7+ · 권한: WAS 실행 계정"
  - stage: 2
    steps:
    - do: 트랜잭션 타임아웃·범위 조정
      config:
        file: 애플리케이션 트랜잭션 설정(@Transactional(timeout) 또는 트랜잭션 매니저 기본값)
        snippet: |
          # 대량 처리는 분할 커밋·비동기화, 온라인 업무 timeout 은 응답 목표 기준
        note: "사전조건: DB 원인 배제 · 영향: 값 증가 시 잠금 보유 시간 증가 · 승인: 개발 책임자 · 백업/롤백: 변경 전 설정·배포본 보관 후 원복"
      check: "성공: 타임아웃·롤백 예외 소멸 · 실패: 지속 → SQL 튜닝"
    - do: DB 차단 세션 정리 (DB 담당)
      cmd: |
        ALTER SYSTEM KILL SESSION '<sid>,<serial#>' IMMEDIATE;      -- Oracle
        SELECT pg_terminate_backend(<pid>);                           -- PostgreSQL
      check: "성공: 대기 해소·업무 재처리 성공 · 실패: 재발 → 잠금 순서 설계 검토"
      note: "사전조건: 차단 세션의 업무 확인 · 영향: 미커밋 작업 롤백 · 승인: DBA·업무 담당 · 백업/롤백: 종료는 되돌릴 수 없음 — 대상 세션 정보 기록 후 수행"
  - stage: 3
    steps:
    - do: 개발팀·DB 제조사 자료
      cmd: |
        jcmd <PID> Thread.print > td_final_$(date +%H%M%S).txt
      check: "스레드 덤프 3회·예외 로그·DB 대기 이벤트·SQL ID"
      note: "민감정보 마스킹: SQL 바인드 값·요청 데이터의 개인정보 가림 · 전달 승인: 개인정보 보호 담당"

- id: SWC-PROC-R5-LOCK
  products: [sw-common]
  category: lock
  match: [APP-CONC-009]
  title: 동시 갱신 충돌·데드락 (애플리케이션)
  source: "JPA/Hibernate OptimisticLockException · Spring DeadlockLoserDataAccessException · Oracle Database Error Messages(ORA-00060) · PostgreSQL 'Explicit Locking' · MySQL 'Deadlocks in InnoDB'"
  stages:
  - stage: 1
    steps:
    - do: 충돌 엔터티·업무 확인 (읽기 전용)
      cmd: |
        grep -n -B3 -A10 'OptimisticLockException\|DeadlockLoserDataAccessException\|CannotAcquireLockException' <앱 로그> | tail -40
      check: "같은 엔터티·화면 반복이면 동시 수정 설계 문제 · 배치와 온라인 시간이 겹치면 일정 문제"
      note: "적용: JPA·Spring 기반 · 권한: 로그 읽기"
    - do: DB 데드락 기록 대조
      cmd: |
        # Oracle
        grep -n 'ORA-00060' $ORACLE_BASE/diag/rdbms/<db>/<SID>/trace/alert_<SID>.log | tail -5
        # PostgreSQL
        grep -n 'deadlock detected' <PGDATA>/log/*.log | tail -10
        # MySQL (읽기 조회)
        SHOW ENGINE INNODB STATUS\G
      check: "DB 데드락 기록이 있으면 DB 판정과 함께 잠금 순서 분석 · 없으면 낙관적 잠금 충돌(재시도 설계)"
      note: "적용: Oracle 11g+(ADR)·PostgreSQL 10+·MySQL 5.7+ · 권한: DB 로그·조회 권한"
  - stage: 2
    steps:
    - do: 재시도·잠금 순서 수정 배포
      cmd: |
        # 개발팀: 충돌 시 제한 횟수 재시도, 테이블 접근 순서 통일, 배치 시간 분리 → 검증계 시험 후 배포
      check: "성공: 충돌 예외 감소·업무 정상 · 실패: 지속 → 데이터 모델 검토"
      note: "사전조건: 검증계 동시성 시험 통과 · 영향: 배포 동안 중단 · 승인: 변경관리 승인 · 백업/롤백: 이전 배포본 보관 후 원복"
  - stage: 3
    steps:
    - do: 개발팀·DB 제조사 자료
      cmd: |
        grep -n -A40 'DeadlockLoserDataAccessException' <앱 로그> > deadlock_app_$(date +%Y%m%d).txt
      check: "애플리케이션 예외·DB 데드락 trace·발생 시각"
      note: "민감정보 마스킹: SQL 바인드 값 속 개인정보 가림 · 전달 승인: 개인정보 보호 담당"

- id: SWC-PROC-R5-UPSTREAM
  products: [sw-common]
  category: upstream
  match: [APP-HTTP-013, APP-REDIS-014]
  title: 외부·내부 API 호출 실패와 Redis 연결 실패 (애플리케이션)
  source: "Spring RestTemplate/WebClient 예외 · OpenFeign · Redis 문서 'INFO'·'redis-cli' · curl 매뉴얼"
  stages:
  - stage: 1
    steps:
    - do: 실패 대상·상태 코드 확인 (읽기 전용)
      cmd: |
        grep -n 'ResourceAccessException\|HttpServerErrorException\|HttpClientErrorException\|FeignException' <앱 로그> | tail -30
        curl -s -o /dev/null -w '%{http_code} %{time_total}\n' --max-time 5 http://<target_host>:<port>/<health>
      check: "5xx·시간 초과면 상대 시스템(상대 담당 통보) · 4xx 반복이면 우리 요청(코드·설정·인증)"
      note: "적용: Spring·Feign 사용 애플리케이션 · 권한: 일반 사용자"
    - do: Redis 도달·상태 확인
      cmd: |
        nc -zvw3 <redis_host> <port>
        # 캐시 담당이 실행(인증 사용 시 비밀번호를 명령행에 쓰지 않음)
        redis-cli -h <redis_host> -p <port> INFO clients
        redis-cli -h <redis_host> -p <port> INFO memory
      check: "포트 실패면 Redis 다운·네트워크 · connected_clients 가 maxclients 근접이면 연결 한도 · used_memory 가 maxmemory 근접이면 메모리 포화"
      note: "적용: Redis 5+ · 권한: 캐시 담당(조회 명령만) — 애플리케이션 재기동 금지"
  - stage: 2
    steps:
    - do: 타임아웃·재시도·서킷 브레이커 조정
      config:
        file: 애플리케이션 HTTP 클라이언트·Redis 클라이언트 설정
        snippet: |
          # 연결 3초·응답 업무 기준·재시도 백오프 최대 3회·서킷 브레이커 실패율 임계
        note: "사전조건: 상대 시스템 상태 확인 · 영향: 재시도 증가 시 상대 부하 증가 · 승인: 개발 책임자 · 백업/롤백: 변경 전 설정 사본으로 원복"
      check: "성공: 실패율 감소·응답 정상 · 실패: 상대 장애 지속 → 상대 담당 대응 대기"
    - do: Redis 장애 조치 (캐시 담당)
      cmd: |
        # Sentinel/Cluster 구성이면 페일오버 상태 확인 후 담당 절차에 따라 전환
      check: "성공: 애플리케이션 Redis 예외 소멸 · 실패: 전환 실패 → 캐시 우회(fallback) 결정"
      note: "사전조건: 복제 상태 확인 · 영향: 전환 순간 캐시·세션 일부 손실 가능 · 승인: 캐시 담당·운영 책임자 · 백업/롤백: 전환 전 RDB/AOF 백업 확인"
  - stage: 3
    steps:
    - do: 상대 기관·공급사 전달 자료
      cmd: |
        grep -n 'HttpServerErrorException\|ResourceAccessException' <앱 로그> > upstream_$(date +%Y%m%d%H%M).txt
      check: "대상 URL·상태 코드·발생 시각·건수"
      note: "민감정보 마스킹: 요청 본문·토큰·API 키 가림 · 전달 승인: 보안 담당"

- id: SWC-PROC-R5-STORAGE
  products: [sw-common]
  category: storage
  match: [APP-FILE-017]
  title: 애플리케이션 파일 접근 실패 (경로·권한·공간)
  source: "Java SE API(java.nio.file.NoSuchFileException·AccessDeniedException) · man7.org df(1) · Microsoft Learn Get-Acl·Get-Volume · IBM AIX 7.2 df"
  stages:
  - stage: 1
    steps:
    - do: 경로·권한·공간 확인 (읽기 전용)
      cmd: |
        # Linux / AIX
        ls -ld <path> <상위디렉터리> ; id <실행계정>
        df -h <path> ; df -i <path>        # AIX: df -g <path>
        # Windows (PowerShell)
        Get-Acl <path> | Format-List ; Get-Volume
      check: "경로 없음이면 설정·배포 누락 · 권한 불일치면 소유자·모드 · 'No space left' 와 사용률 95% 이상이면 공간"
      note: "적용: Linux·AIX·Windows · 권한: 일반 사용자"
  - stage: 2
    steps:
    - do: 경로 생성·권한 수정 또는 공간 확보
      cmd: |
        mkdir -p <path> ; chown <user>:<group> <path>
        # 공간: 정리 대상 목록 먼저 검토
        find <path> -xdev -type f -mtime +<보존일> -ls | head -50
      check: "성공: 애플리케이션 파일 쓰기·읽기 성공 · 실패: 거부 지속 → SELinux·마운트 옵션 확인"
      note: "사전조건: 올바른 경로·소유자 기준 확인, 정리 대상 보존 기간 확인 · 영향: 권한 변경이 다른 프로세스에 영향 가능 · 승인: 시스템·업무 담당 · 백업/롤백: 변경 전 `ls -l` 출력 보관 후 원복, 정리 대상은 tar 보관"
  - stage: 3
    steps:
    - do: 개발팀 전달 자료
      cmd: |
        grep -n 'NoSuchFileException\|AccessDeniedException\|No space left' <앱 로그> > file_err_$(date +%Y%m%d).txt
      check: "예외 경로·발생 시각·df 결과"
      note: "민감정보 마스킹: 경로 속 사용자명·파일명 개인정보 가림 · 전달 승인: 개인정보 보호 담당"

# ───────────────────────── WAS 계층 공통 (JVM) ─────────────────────────
- id: WASC-PROC-R5-INTERNAL
  products: [was-common]
  category: internal
  match: [WAS-JVM-010, APP-JEUS-SESSION-020]
  title: JVM 비정상 종료(hs_err_pid)·세션 리스너 예외 (WAS 공통)
  source: "Oracle Java SE Troubleshooting Guide 'Fatal Error Log'(hs_err_pid) · OpenJDK jcmd · JEUS Web Engine 안내서(세션 관리)"
  stages:
  - stage: 1
    steps:
    - do: 크래시 파일 확인 (읽기 전용)
      cmd: |
        ls -lt <WAS 작업 디렉터리>/hs_err_pid*.log | head
        grep -nE 'Problematic frame|^# C  \[|SIGSEGV|EXCEPTION_ACCESS_VIOLATION|JRE version' <hs_err_pid파일> | head -20
      check: "Problematic frame 이 libjvm 이면 JDK 결함 · 업무·외부 네이티브 라이브러리(.so·.dll)면 그 라이브러리 · 메모리 부족 문구면 자원 원인"
      note: "적용: HotSpot JDK 6~21 · 권한: WAS 실행 계정"
    - do: 프로세스 상태·세션 리스너 예외 확인
      cmd: |
        # Linux / AIX
        ps -ef | grep [j]ava
        # Windows (PowerShell)
        Get-Process java
        # JEUS 세션 리스너 예외
        grep -n -A5 'SESSION-2512' $DOMAIN_HOME/servers/<server>/logs/JeusServer.log | tail -30
      check: "WAS 프로세스 없음이면 크래시로 중단 · SESSION-2512 는 로그인 정상이면 기능(중복 로그인 방지) 미지원 설정 문제"
      note: "적용: JEUS 7+(SESSION-2512) · 권한: WAS 실행 계정"
  - stage: 2
    steps:
    - do: 크래시 자료 보존 후 WAS 재기동
      cmd: |
        mkdir -p /var/tmp/jvmcrash_$(date +%Y%m%d) ; cp -p <hs_err_pid파일> /var/tmp/jvmcrash_$(date +%Y%m%d)/
        # 제품별 기동: JEUS startManagedServer · WebLogic startManagedWebLogic.sh · Tomcat startup.sh · JBoss standalone.sh
      check: "성공: 서버 RUNNING·업무 정상 · 실패: 기동 직후 재크래시 → 원인 라이브러리 제외·JDK 교체 검토"
      note: "사전조건: hs_err·코어 파일 보존 · 영향: 기동 동안 서비스 중단 · 승인: WAS 담당·운영 책임자 · 백업/롤백: 설정 변경 없음, JDK 교체 시 이전 JDK 경로 유지 후 원복 가능"
    - do: JDK 패치 또는 세션 매니저 설정 정합
      config:
        file: WAS 기동 스크립트의 JAVA_HOME · JEUS domain.xml 세션 설정
        snippet: |
          # JAVA_HOME=<패치된 JDK 경로>  (제조사 지원 판)
          # JEUS 분산 세션·중복 로그인 방지 지원 여부를 애플리케이션 리스너 요구사항과 일치
        note: "사전조건: 검증계 시험 · 영향: 적용 시 재기동 필요 · 승인: 변경관리 승인 · 백업/롤백: 이전 JAVA_HOME·domain.xml 사본으로 원복"
      check: "성공: 크래시·SESSION-2512 미재발 · 실패: 재발 → 제조사 의뢰"
  - stage: 3
    steps:
    - do: JDK·WAS 제조사 의뢰 자료
      cmd: |
        tar czf jvmcrash_$(date +%Y%m%d).tgz /var/tmp/jvmcrash_$(date +%Y%m%d)/ ; java -version 2>&1
      check: "hs_err_pid·코어 파일·JVM 옵션·JDK 판·발생 시각"
      note: "민감정보 마스킹: hs_err 의 환경 변수·명령행에 든 비밀번호·호스트명 가림 · 전달 승인: 보안 담당"

- id: WASC-PROC-R5-CAPACITY
  products: [was-common]
  category: capacity
  match: [WAS-JVM-011]
  title: 열린 파일(소켓) 수 한도 초과 — Too many open files (WAS 공통)
  source: "man7.org proc(5)(/proc/<pid>/limits·fd)·ss(8)·lsof(8) / RHEL 9 systemd LimitNOFILE·limits.conf / IBM AIX 7.2 procfiles / Microsoft Learn Get-Process(Handles)"
  stages:
  - stage: 1
    steps:
    - do: 열린 파일 수와 한도 비교 (읽기 전용)
      cmd: |
        # Linux
        ls /proc/<PID>/fd | wc -l ; grep 'Max open files' /proc/<PID>/limits
        # AIX
        procfiles <PID> | head -5
        # Windows (PowerShell)
        Get-Process -Id <PID> | Select-Object Handles
      check: "열린 수가 Max open files 의 90% 이상이면 한도 도달 확정"
      note: "적용: Linux(proc) / AIX 7.x / Windows · 권한: WAS 실행 계정 또는 root"
    - do: 무엇이 열려 있는지 분류
      cmd: |
        ss -tanp | grep 'pid=<PID>,' | awk '{print $1}' | sort | uniq -c
        lsof -p <PID> | awk '{print $5}' | sort | uniq -c | sort -rn | head
      check: "CLOSE_WAIT 급증이면 연결 미반환(코드·연결 풀) · REG(파일) 급증이면 파일 핸들 누수"
      note: "적용: Linux(iproute2·lsof) · 권한: root"
  - stage: 2
    steps:
    - do: nofile 한도 상향 후 재기동
      config:
        file: /etc/security/limits.d/<wasuser>.conf 또는 systemd 유닛 override(LimitNOFILE)
        snippet: |
          <wasuser>  soft  nofile  65536
          <wasuser>  hard  nofile  65536
          # systemd 서비스면: [Service] LimitNOFILE=65536
        note: "사전조건: 미반환 원인 확인(한도 상향만으로 누수는 해결되지 않음) · 영향: 적용에 WAS 재기동 필요 · 승인: 시스템·WAS 담당 · 백업/롤백: 변경 전 파일 사본 보관 후 원복"
      cmd: |
        # 제품별 WAS 재기동 후 확인
        grep 'Max open files' /proc/<PID>/limits
      check: "성공: 새 한도 반영·Too many open files 미재발 · 실패: 다시 한도 도달 → 누수 코드 개발팀 이관"
  - stage: 3
    steps:
    - do: 개발팀·제조사 자료
      cmd: |
        lsof -p <PID> > lsof_$(date +%Y%m%d%H%M).txt ; ss -tanp > ss_$(date +%Y%m%d%H%M).txt
      check: "열린 파일 목록·소켓 상태·한도 설정·발생 시각"
      note: "민감정보 마스킹: 상대 IP·파일 경로 속 개인정보 가림 · 전달 승인: 보안 담당"
