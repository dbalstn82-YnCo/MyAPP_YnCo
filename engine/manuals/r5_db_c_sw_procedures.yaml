# ── BizMaster 어댑터 ──
- id: BM-PROC-R5-INTERNAL
  products: [bizmaster-adapter]
  category: internal
  match: [SW-BM-001, SW-BM-009]
  title: 어댑터 처리 중 미처리 예외·어댑터 기동 기록 (BizMaster)
  source: "BizMaster 어댑터 로그 문구('Uncaught exception while processing request'·'Adapter Shell … initialized'·'DeployService started') 의미 기준 — 공개 매뉴얼 없음, JVM 점검은 JDK Troubleshooting Guide(jstat·jstack·jcmd)"
  verify_note: "미검증 — BizMaster 어댑터가 쓰는 JDK 버전을 납품 문서로 확인하지 못함. jcmd 는 JDK 7+, GC.heap_info 는 JDK 9+ 에만 있으므로 먼저 어댑터 프로세스의 java -version 으로 버전을 보고, JDK 6 이하이면 jstat·jstack(또는 kill -3) 만 쓴다"
  stages:
  - stage: 1
    steps:
    - do: 예외 원인 클래스·bxId·기동 전후 비교 (읽기 전용)
      cmd: |
        grep -n -A20 "Uncaught exception while processing request" <adapter_log> | head -60
        grep -n -E "Adapter Shell .* initialized|AdapterShell.*initialized|DeployService started" <adapter_log> | tail -5
        grep -n "MEMORY USAGE" <adapter_log> | tail -5
      check: "같은 원인 클래스가 반복되면 결함·연계 데이터 문제 · 기동 기록 직전에 메모리 증가·예외가 있으면 비정상 종료 후 재기동"
      note: "적용: BizMaster 4.x 어댑터 로그 · 권한: 로그 읽기"
    - do: 같은 bxId 재처리 여부·JVM 상태 확인 (읽기 전용)
      cmd: |
        grep -n "<bxId>" <adapter_log> | head -20
        $(dirname $(readlink -f /proc/<PID>/exe))/java -version     # 어댑터가 실제로 쓰는 JDK 버전 (Linux)
        jstat -gcutil <PID> 5000 3      # JDK 5+ 공통(어댑터와 같은 JDK 의 jstat 사용)
        jcmd <PID> GC.heap_info         # JDK 9+ 에서만
        jstack <PID> > bm_jstack_$(date +%H%M%S).txt     # JDK 5+ (스레드 덤프, 프로세스는 유지), 또는 kill -3 <PID>
      check: "같은 bxId 가 재요청·재처리됐으면 업무 영향 없음, 아니면 누락 후보 목록 작성 · jstat 의 O(Old) 가 95% 이상에서 FGC 가 계속 늘면 메모리 고갈로 예외 발생 후보"
      note: "적용: jstat·jstack 은 JDK 5+, jcmd 는 JDK 7+, GC.heap_info 는 JDK 9+ — 버전에 맞는 줄만 실행 · /proc/<PID>/exe 는 Linux, AIX·HP-UX 는 ps -ef 의 java 경로 사용 · 권한: JVM 실행 계정(같은 사용자로 실행해야 attach 가능)"
  - stage: 2
    steps:
    - do: 누락 거래 재처리(업무 확인 후)
      cmd: |
        grep -n "<bxId>" <adapter_log>
      check: "성공: 재처리 후 상대 기관 수신 확인 · 실패: 재처리 오류 → 3차"
      note: "사전조건: 업무 담당이 중복 여부 확인 · 영향: 중복 전송 시 상대 기관 중복 처리 · 승인: 업무 담당·연계 담당 · 백업/롤백: 재처리 대상 목록·원문 보관(중복 시 상대 기관 취소 절차)"
      verify_note: "미검증 — BizMaster 어댑터의 재처리(재전송) 조작 명령·화면을 납품 매뉴얼로 확인하지 못함"
  - stage: 3
    steps:
    - do: 제조사(Tmax)·유지보수사 의뢰 자료
      cmd: |
        tar czf bm_adapter_$(date +%Y%m%d).tgz <adapter_log> bm_jstack_*.txt
        <어댑터 JDK 경로>/bin/java -version 2> jvm.txt     # JDK 7+ 이면 jcmd <PID> VM.version >> jvm.txt 도 가능
      check: "어댑터 로그(예외·기동 전후)·JVM 버전"
      note: "민감정보 마스킹: 전문 내용의 개인정보·기관 계정·IP 가림 · 전달 승인: 보안 담당·연계 담당"

- id: BM-PROC-R5-STORAGE
  products: [bizmaster-adapter]
  category: storage
  match: [SW-BM-005]
  title: 어댑터 메시지 파일 상태 전이 실패 — 이동 실패·기존 파일 존재 (BizMaster)
  source: "BizMaster 어댑터 로그 문구('Cannot move (sending) message file'·'message file … already exists'·'Resending … message failed') 의미 기준 — 공개 매뉴얼 없음"
  stages:
  - stage: 1
    steps:
    - do: 메시지 디렉터리·권한·공간 확인 (읽기 전용)
      cmd: |
        grep -n -E "Cannot move (sending )?message file|already exists|Resending .* message failed" <adapter_log> | tail -20
        ls -ld <msg_dir>/unsent <msg_dir>/sending ; ls <msg_dir>/unsent | wc -l ; ls <msg_dir>/sending | wc -l
        df -h <msg_dir> ; df -i <msg_dir>
      check: "공간·inode 부족, 권한 오류, 같은 이름 파일 존재(중복) 중 무엇인지 확인 — 파일은 옮기거나 지우지 않음"
      note: "적용: BizMaster 4.x · 권한: 어댑터 실행 계정"
      verify_note: "미검증 — 메시지 저장 디렉터리 이름(unsent/sending)과 위치는 실로그 문구 기준이며 납품 매뉴얼로 확인하지 못함"
  - stage: 2
    steps:
    - do: 공간·권한 확보 후 중복 파일 판정
      cmd: |
        ls -l <msg_dir>/sending/<file> <msg_dir>/unsent/<file>
        cmp <msg_dir>/sending/<file> <msg_dir>/unsent/<file>
      check: "성공: 원인 해소 후 '이동 실패' 기록 중단·미전송 건수 감소 · 실패: 같은 파일 반복 → 3차"
      note: "사전조건: 업무 담당과 전송 여부(상대 기관 수신) 확인 · 영향: 잘못 정리하면 누락·중복 전송 · 승인: 연계 담당·업무 담당 · 백업/롤백: 정리 전 두 디렉터리 전체를 tar 로 보관"
  - stage: 3
    steps:
    - do: 의뢰 자료
      cmd: |
        tar czf bm_msgfile_$(date +%Y%m%d).tgz <adapter_log> ; ls -lR <msg_dir> > msgdir.txt
      check: "어댑터 로그·디렉터리 목록"
      note: "민감정보 마스킹: 메시지 파일 본문은 제외(목록만), 기관 정보·IP 가림 · 전달 승인: 보안 담당·연계 담당"

# ── Indigo ESB ──
- id: IND-PROC-R5-INTERNAL
  products: [indigo-esb]
  category: internal
  match: [LEG-IND-010]
  title: GPKI 서명 검증·복호화 단계 — START 뒤 END 없음 확인 (Indigo ESB)
  source: "Indigo ESB 로그 문구('==[inHandle] SingDecryptProcessor START/END!==') 의미 기준 — 공개 매뉴얼 없음, 인증서 점검은 OpenSSL x509 일반 명령"
  stages:
  - stage: 1
    steps:
    - do: START/END 짝 확인 (읽기 전용)
      cmd: |
        grep -c "SingDecryptProcessor START" <esb_log> ; grep -c "SingDecryptProcessor END" <esb_log>
        grep -n -A10 "SingDecryptProcessor START" <esb_log> | grep -i -E "exception|error" | head -20
      check: "START 수와 END 수가 같으면 정상 흐름(조치 불필요) · 차이가 나면 그 사이 예외(인증서·LDAP 조회 실패)를 확인"
      note: "적용: Indigo ESB 납품판 · 권한: 로그 읽기"
    - do: 인증서 만료·LDAP 도달 확인 (읽기 전용)
      cmd: |
        openssl x509 -in <cert.pem> -noout -enddate      # DER 이면 -inform DER 추가
        nc -zvw3 <ldap_host> <ldap_port>
      check: "만료일 경과 또는 LDAP 포트 도달 실패면 복호화 실패 원인"
      note: "적용: OpenSSL 1.0+ · 권한: 인증서 파일 읽기"
      verify_note: "미검증 — Indigo ESB 의 GPKI 인증서 파일 위치·형식은 납품 매뉴얼로 확인하지 못함"
  - stage: 2
    steps:
    - do: 인증서 갱신본 적용
      cmd: |
        cp -p <cert 경로> <백업경로>/ ; cp -p <갱신 인증서> <cert 경로>
      check: "성공: START/END 짝 회복·복호화 오류 없음 · 실패: 오류 지속 → 원본 복원 후 3차"
      note: "사전조건: GPKI 갱신 인증서 수령·상대 기관 통보 · 영향: 적용 중 서명 검증 실패 가능, 반영에 ESB 재기동이 필요할 수 있음 · 승인: 보안 담당·연계 담당 · 백업/롤백: 기존 인증서 사본 보관 후 원복"
  - stage: 3
    steps:
    - do: 유지보수사 의뢰 자료
      cmd: |
        grep -n -B5 -A20 "SingDecryptProcessor START" <esb_log> | tail -200 > gpki.txt
      check: "START/END 불일치 구간 로그·인증서 만료일"
      note: "민감정보 마스킹: 인증서·키 파일 자체는 전달 금지, 전문 본문·기관 식별자·IP 가림 · 전달 승인: 보안 담당"

- id: IND-PROC-R5-PERFORMANCE
  products: [indigo-esb]
  category: performance
  match: [LEG-IND-011]
  title: EUC-KR 응답 복호화 — 한글 필드 깨짐 확인 (Indigo ESB)
  source: "Indigo ESB 로그 문구('===== Decrypte encoding: <인코딩>=====') 의미 기준 — 공개 매뉴얼 없음, 인코딩 점검은 iconv 일반 명령"
  stages:
  - stage: 1
    steps:
    - do: 인코딩 분포·깨짐 여부 확인 (읽기 전용)
      cmd: |
        grep -o "Decrypte encoding: *[A-Za-z0-9_-]*" <esb_log> | sort | uniq -c
        grep -n -A5 "Decrypte encoding: *EUC-KR" <esb_log> | tail -20
      check: "EUC-KR 응답 뒤 userName 등 한글 필드가 '?'·깨진 문자로 찍히면 변환 누락 — 정상 흐름 로그 자체는 장애 아님"
      note: "적용: Indigo ESB 납품판 · 권한: 로그 읽기"
    - do: 샘플 변환 시험 (읽기 전용)
      cmd: |
        iconv -f EUC-KR -t UTF-8 <샘플파일> > /dev/null && echo OK
      check: "OK 가 아니면 원문이 EUC-KR 이 아님(선언과 실제 불일치)"
      note: "적용: glibc iconv · 권한: 일반 사용자 · 샘플은 개인정보 가린 사본 사용"
  - stage: 2
    steps:
    - do: 응답 인코딩 변환 로직 수정 배포
      cmd: |
        cp -p <배포본> <백업경로>/ ; <배포 스크립트> <수정본>
      check: "성공: 한글 필드 정상 표시 · 실패: 깨짐 지속 → 원복 후 상대 기관 인코딩 선언 확인"
      note: "사전조건: 개발 담당이 EUC-KR→UTF-8 변환 수정·시험 완료 · 영향: 배포 중 연계 일시 중단 · 승인: 연계 담당·개발 담당 · 백업/롤백: 기존 배포본 보관 후 원복"
      verify_note: "미검증 — Indigo ESB 의 서비스 배포 절차·명령은 납품 매뉴얼로 확인하지 못함"
  - stage: 3
    steps:
    - do: 유지보수사 의뢰 자료
      cmd: |
        grep -n -A5 "Decrypte encoding" <esb_log> | tail -100 > encoding.txt
      check: "인코딩 로그·깨짐 사례(가린 사본)"
      note: "민감정보 마스킹: 한글 이름 등 개인정보 필드 가림 · 전달 승인: 보안 담당"
