# 근거 매뉴얼·작성 기준 (6차 표본 57 교차 검토 반영, 2026-10-16) — 붙어 있던 절차가 그 판정의 원인·조치와 맞지 않던 7건에 '이 판정 전용' 절차를 준다
# - Tibero 6/7 관리자 안내서 '세션 관리'·참조 안내서 '동적 뷰(V$LOCK·GV$LOCK·V$SESSION·V$SQL)'·에러 참조 안내서(TBR-12033) — 컬럼 이름은 공식 문서로 확인하지 못해 select * 결과 머리글로 읽게 했다
# - Red Hat JBoss EAP 7.4 Configuration Guide 'Datasource Management(test-connection-in-pool)'·Management CLI Guide(deploy --force·deployment-info(EAP 7)/deployment info(EAP 8))·Log Message Reference(IJ·WFLYTX·ARJUNA)
# - IBM WebSphere Application Server traditional 8.5.5/9.0 메시지 참조(CNTR0020E·DSRA·J2CA·SECJ)·'First Failure Data Capture(FFDC)'·'LogViewer command'(HPEL: -startDate·-stopDate·-thread)·backupConfig/restoreConfig
# - Spring Framework 참조(BeanCreationException 중첩 cause — spring.io 는 허용 도메인 밖이라 미검증 표시)·man7.org lsof(8)·proc(5)(/proc/<PID>/fd·limits)
# - NetApp ONTAP 9 CLI 참조(volume show -fields tiering-policy·storage aggregate object-store show / show-space·volume object-store tiering show(advanced)) — 명령 이름 넷은 공식 CLI 문서로 확인(2차 교차 검토), 판별 매개변수·출력 필드는 미검증
# - TmaxSoft WebtoB 5 관리자 안내서 3.17 'SSL 절'(CertificateFile·CertificateKeyFile 필수·CertificateChainFile, NODE/VHOST 의 SSLFlag·SSLName)·'wscfl' / WebtoB 6 Administrator Guide 'SSL Section'(ssl_configs·certificate_file·certificate_key_file) / OpenSSL s_client(-CAfile)·x509 -pubkey·pkey -pubout(키 종류 무관 짝 비교)
# - AppArmor: Ubuntu Server 문서 'AppArmor'(aa-status·aa-complain·aa-enforce·apparmor_parser -r)·man7.org proc(5)(/proc/<PID>/attr/current)
# 작성 기준: knowledge_spec.md(GPT 45차 관문) — 1차 읽기 전용(재기동·종료·설정 변경 없음), 2차 note 에 사전조건·영향·승인·백업/롤백 + check 성공/실패,
#           3차 민감정보 마스킹·전달 승인. 비밀번호는 명령줄에 쓰지 않는다(tbsql·jboss-cli 는 프롬프트). 포트 시험은 nc -zvw3 만, '선택적 능동 확인'으로만.
#           스택은 grep -A 숫자로 자르면 깊은 Caused by 를 놓친다. 2차 교차 검토(10-16) 반영: ① 시각·스레드로 대상 머리 줄 번호를 고르고
#           ② 그 줄부터 다음 '시각으로 시작하는 줄' 직전까지만 읽는다(빈 줄·들여쓰기 없는 중간 예외 줄에서 멈추지 않음, 다른 요청을 섞지 않음)
#           ③ 묶음 안 'Caused by:' 의 마지막 줄 = 맨 안쪽 원인. 시험: 검증도구\kw7\fixtures\RESULT.md (3형식 × 6경우, 틀린 답 0).
procedures:
# ───────────────────────── Tibero NOWAIT 잠금 실패 ─────────────────────────
- id: TBR-PROC-R6C-NOWAIT
  scope: id
  products: [tibero]
  category: lock
  match: [TBR-12033]
  title: NOWAIT 잠금 획득 실패 — 실패한 DDL·대상 객체와 그 객체를 쓰는 보유 세션·SQL 식별 (TBR-12033)
  source: "Tibero 6/7 참조 안내서 '동적 뷰(V$LOCK, GV$LOCK, V$SESSION, V$SQL)'·'정적 뷰(DBA_OBJECTS)'·관리자 안내서 '세션 관리'·에러 참조 안내서 12000번대(TBR-12033)·TmaxTibero GTS 기술지원 사례(DDL 객체 잠금 실패 — 2차 교차 검토에서 전달)"
  verify_note: "미검증 — GTS 사례 'ERROR 12033_LOCKFAIL_IN_NOWAIT 해결방안 (TMOTS014, 6FS07)'(2차 교차 검토 전달) 기준, 원문 직접 대조 못 함(docs.tmaxsoft.com/GTS 접속 불가): slog 의 ec=-12033·ERROR_LOCKFAIL_IN_NOWAIT 표기, DDL 객체 잠금 TYPE 'WLOCK_DD_OBJ'·ID1 = 소유자 ID·ID2 = 객체 ID(또는 이름 해시), LMODE·REQUESTED·SESS_ID 의미(교차 검토자는 그 문서에 정의돼 있다고 전함 — 보유/요청은 결과 머리글로 확인하고 단정하지 않는다). V$SESSION 의 세션 번호 컬럼(SID 로 가정)·GV$ 뷰의 INST_ID 칸·DBA_OBJECTS 의 OBJECT_ID 컬럼·ALTER SYSTEM KILL SESSION 구문도 Tibero 공식 참조 안내서로 확인하지 못함"
  stages:
  - stage: 1
    steps:
    - do: 실패한 문장(대개 DDL)과 대상 객체·시각 찾기 — sys.log·slog (읽기 전용)
      cmd: |
        grep -n -B5 -A2 -E 'TBR-12033|ec=-12033|LOCKFAIL_IN_NOWAIT' $(ls -tr $TB_HOME/instance/$TB_SID/log/slog/* | tail -5) | tail -80
      check: "GTS 사례상 sys.log·slog 에는 TBR-12033 대신 ec=-12033 또는 ERROR_LOCKFAIL_IN_NOWAIT 로 찍힐 수 있어 셋을 함께 찾는다 · 대부분은 다른 트랜잭션이 쓰고 있는 객체에 DDL(ALTER TABLE·테이블 제거·CREATE INDEX 등)이 객체 잠금을 얻지 못한 경우 — 명시적 SELECT … FOR UPDATE NOWAIT 도 후보이나 사례 문서로 직접 입증되지 않은 미검증 후보 · 같은 시각 줄에서 실패한 문장 종류·소유자.객체 이름·세션을 기록(DDL 이면 배포·배치 작업 기록과 대조) · slog 에 문장이 없으면 애플리케이션·배포 도구 로그의 실패 SQL 원문으로"
      note: "적용: Tibero 6/7(slog 디렉터리에 sys.log 포함, 회전된 최근 5개 파일을 오래된 것→최신 순으로 읽음) · 권한: Tibero OS 계정"
    - do: 그 객체의 DDL 객체 잠금(WLOCK_DD_OBJ)만 조회 — 객체 ID 로 (읽기 전용)
      cmd: |
        tbsql <user>          # 비밀번호는 접속 프롬프트에서 입력
        SQL> select object_id, owner, object_name, object_type from dba_objects where owner = '<OWNER>' and object_name = '<OBJECT>';
        SQL> select * from v$lock where type = 'WLOCK_DD_OBJ' and id2 = <object_id>;
        SQL> select * from gv$lock where type = 'WLOCK_DD_OBJ' and id2 = <object_id>;     -- TAC 일 때만(INST_ID·SESS_ID 를 짝으로 기록)
        SQL> select * from v$lock where type = 'WLOCK_DD_OBJ';     -- 위 결과가 0행일 때만(ID2 가 이름 해시일 수 있음) — 나온 행은 보유자가 아니라 대조 대상
        SQL> select * from gv$lock where type = 'WLOCK_DD_OBJ';    -- TAC 일 때 넓힌 조회도 gv$lock 으로(다른 노드 잠금 누락 방지)
        SQL> quit
      check: "GTS 사례상 DDL 객체 잠금은 TYPE 'WLOCK_DD_OBJ', ID1 = 소유자 ID, ID2 = 객체 ID(또는 이름 해시) — 그 행들의 SESS_ID(TAC 는 INST_ID 와 짝)를 모두 기록, 이 행들이 DDL 이 기다리지 못한 상대 트랜잭션 후보 · 'id1 = X or id2 = X' 꼴로 찾지 않는다(다른 유형 잠금의 같은 숫자가 섞인다) · 보유/요청 구분(LMODE·REQUESTED)은 교차 검토자가 GTS 문서에 정의돼 있다고 전했으나 원문을 직접 대조하지 못했으므로 결과 머리글로 확인하고 단정하지 않으며 다음 단계의 세션 정보로 가른다 · 0행이면 상대 트랜잭션이 이미 끝났거나(NOWAIT 은 기다리지 않고 즉시 실패) ID2 가 이름 해시인 경우 — 셋째 줄로 넓히되 넓힌 결과는 보유자가 아니다 — 그 행의 ID1(소유자)·ID2 와 세션의 SQL·접속 시각이 실패한 DDL 의 객체·발생 시각과 맞는 것만 후보로 적고, 맞는 것이 없으면 '보유자 미확인'으로 남긴다. 권한 관련 DDL(GRANT·REVOKE 등)은 다른 WLOCK 유형일 수 있어 이 조회 0행이 잠금 없음을 뜻하지 않는다(GTS 사례·교차 검토 전달, 원문 직접 대조 못 함), 그래도 없으면 발생 시각의 배치·DML 기록으로 판단 · 임의 100행 조회로 대신하지 않는다"
      note: "적용: Tibero 6/7(gv$lock 은 TAC — 다른 노드의 세션이 상대일 수 있어 INST_ID 를 SESS_ID 와 함께 기록해 gv$session 과 맞춘다) · 권한: DBA 조회 권한 · TYPE 'WLOCK_DD_OBJ'·ID1/ID2 의미는 GTS 사례(교차 검토 전달) 기준, 원문 직접 대조 못 함 — 머리글로 확인"
    - do: 상대 세션의 업무·SQL 식별 (읽기 전용)
      cmd: |
        tbsql <user>          # 비밀번호는 접속 프롬프트에서 입력
        SQL> select * from v$session where sid = <sess_id>;
        SQL> select * from gv$session where inst_id = <inst_id> and sid = <sess_id>;     -- TAC 일 때만(앞 단계의 INST_ID·SESS_ID)
        SQL> select * from v$sql where sql_id = '<sql_id>';
        SQL> quit
      check: "상대 세션의 사용자·프로그램·접속 시각·현재 SQL 로 어느 업무인지 식별 → COMMIT/ROLLBACK 은 그 업무 담당이 결정 · 세션이 조회되지 않으면 '보유자 미확인'(트랜잭션 종료·조회 권한/범위·TAC 인스턴스 불일치·DB 내부 작업(internal task) 잠금 가능성 — 마지막은 교차 검토 전달·미검증 — 을 구분해 적고 종료로 단정하지 않음) · DDL 쪽은 업무 트랜잭션이 없는 시간대로 재일정하는 것이 우선 · 통계 잠금(DBA_TAB_STATISTICS)은 TBR-20018 용이며 이 오류와 무관"
      note: "적용: Tibero 6/7(TAC 는 gv$session·gv$sql — 상대 세션이 있는 노드 기준) · 권한: DBA 조회 권한 · 세션 번호 컬럼 이름(sid) 미검증 — 오류면 select * … where rownum <= 100 머리글로 확인 · SQL 본문에 업무 데이터가 있으면 화면 밖으로 복사하지 않는다"
  - stage: 2
    steps:
    - do: (2차·승인 후) 업무 확인 후 보유 세션 정리
      cmd: |
        tbsql <user>          # 비밀번호는 접속 프롬프트에서 입력
        SQL> alter system kill session (<sid>, <serial#>);
        SQL> quit
      check: "성공: 그 객체 ID 의 v$lock(gv$lock) 행 소멸, 재시도한 DDL·NOWAIT 작업 성공 · 실패: 세션이 남으면 롤백 진행 중인지 v$transaction 으로 확인, 같은 상대가 반복되면 DDL 작업 시간대 조정 또는 애플리케이션 트랜잭션 범위 수정(개발 담당)"
      note: "사전조건: 1차에서 상대 세션의 업무·트랜잭션을 업무 담당이 확인, 종료 대신 COMMIT/ROLLBACK 요청이나 DDL 재일정이 가능한지 먼저 확인 · 영향: 종료 세션의 미커밋 작업 롤백 · 승인: DBA·업무 담당 · 백업/롤백: 되돌릴 수 없음 — 종료 전 v$session·v$lock 출력 보관 · 적용: Tibero 6/7(구문 미검증)"
  - stage: 3
    steps:
    - do: TmaxTibero 기술지원 자료
      cmd: |
        tbsql <user>          # 비밀번호는 접속 프롬프트에서 입력
        SQL> spool tibero_nowait_<YYYYMMDD>.txt
        SQL> select * from v$lock where type = 'WLOCK_DD_OBJ' and id2 = <object_id>;
        SQL> spool off
        SQL> quit
      check: "그 객체의 잠금 조회 결과·발생 시각 slog(실패 DDL·객체)·실패 SQL 원문·DDL 작업 일정 또는 애플리케이션의 NOWAIT 사용 위치"
      note: "민감정보 마스킹: 계정명·호스트명·SQL 안 업무 데이터 값 가림 · 전달 승인: DBA 확인 후 보안 담당 승인"

# ───────────────────────── JBoss/WildFly Spring 예외 전체 계열 ─────────────────────────
- id: EAP-PROC-R6C-SPRING
  scope: id
  products: [jboss]
  category: internal
  match: [LEG-WFLY-SPRING-ALL]
  title: Spring 예외(WildFly) — 요청 시각의 Caused by 사슬을 끝까지 따라 맨 안쪽 원인 유형으로 분기
  source: "Red Hat JBoss EAP 7.4 Configuration Guide 'Datasource Management(test-connection-in-pool)'·Management CLI Guide(deployment-info·deploy --force)·EAP 7.4 Log Message Reference(IJ·WFLYTX·ARJUNA 접두어)"
  stages:
  - stage: 1
    steps:
    - do: 대상 요청 하나의 예외 묶음을 시각·스레드로 찾아 Caused by 사슬 끝까지 (읽기 전용)
      cmd: |
        # ① 대상 요청의 머리 줄 번호 — Spring 예외가 든 묶음의 머리 줄(시각·레벨·스레드)을 줄 번호와 함께, 사용자가 아는 시각으로 거른다
        awk '/^[[:space:]]*[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9][ T][0-9][0-9]:[0-9][0-9]/ {h=NR; hl=$0} /springframework/ && /Exception/ && h {print h, substr(hl,1,200)}' $JBOSS_HOME/standalone/log/server.log | uniq | grep '<HH:MM>' | tail -20
        # ② 고른 머리 줄부터 다음 '날짜 시각' 줄 직전까지 — 그 요청의 묶음 전체(빈 줄·들여쓰기 없는 중간 예외 줄에서 멈추지 않음)
        awk -v s=<머리줄번호> 'NR<s {next} NR>s && /^[[:space:]]*[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9][ T][0-9][0-9]:[0-9][0-9]/ {exit} {print NR, $0}' $JBOSS_HOME/standalone/log/server.log | head -400
        # ③ 그 묶음 안의 Caused by 목록 — 마지막 줄이 맨 안쪽 원인
        awk -v s=<머리줄번호> 'NR<s {next} NR>s && /^[[:space:]]*[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9][ T][0-9][0-9]:[0-9][0-9]/ {exit} {print NR, $0}' $JBOSS_HOME/standalone/log/server.log | grep 'Caused by:'
        # (지원 로그 형식이 아닐 때만) ①~③ 대신 원문 직접 — 줄 번호를 찾아 그 앞뒤를 그대로 읽는다
        grep -n 'springframework' $JBOSS_HOME/standalone/log/server.log | grep '<HH:MM>' | tail -20
        sed -n '<시작줄>,<끝줄>p' $JBOSS_HOME/standalone/log/server.log
      check: "① 출력 첫 칸 = 머리 줄 번호, 괄호 안 (default task-N) = 스레드 — 사용자 신고·access log 의 시각과 스레드·URL 이 맞는 줄 하나를 고른다(같은 초에 여러 요청이 있으면 마지막 줄을 기계적으로 고르지 않는다) · ③ 출력의 마지막 줄이 보통의 사슬에서 맨 안쪽 원인(단 Suppressed:·함께 찍힌 다른 원인이 있을 수 있어 유일한 근본 원인이라 보장되지 않는다 — ② 묶음에 'Suppressed:' 가 있으면 그것도 원인 후보로 기록), Caused by 가 하나도 없으면 머리 줄 끝의 마지막 'nested exception is' 뒤 예외가 원인 · ② 가 400줄에서 잘려도 ③ 은 묶음 끝까지 본다 · 'grep -A 숫자'·빈 줄이나 들여쓰기 없는 줄에서 멈추는 awk·전체 묶음 tail 은 맨 안쪽 원인이나 대상 요청을 놓친다(검증도구 kw7 고정 로그 6경우 시험, 틀린 답 0)"
      note: "지원 로그 형식: 각 항목이 'YYYY-MM-DD HH:MM'(또는 ISO 'YYYY-MM-DDTHH:MM') 머리로 시작하는 로그만 — EAP 6/7/8·WildFly 기본 server.log('YYYY-MM-DD HH:MM:SS,mmm')가 해당. 다른 패턴(시각만으로 시작하는 콘솔 출력·형식을 바꾼 로그)이면 세 awk 결과를 믿지 말고 넷째 줄처럼 grep -n 으로 찾은 예외 줄 앞뒤를 sed -n 으로 원문 그대로 읽는다 · 권한: 로그 읽기 · 회전된 로그면 server.log.<날짜> 로 바꿔 실행 · 여러 스레드가 printStackTrace 로 한 파일에 줄 단위로 섞어 쓴 경우는 줄 도구로 가를 수 없음(스레드별 로그·APM 기록으로)"
    - do: 맨 안쪽 예외 유형으로 분기 (읽기 전용)
      cmd: |
        # DB 계열(SQLException·DataAccessException·SQLState·ORA- 등 벤더 코드): 같은 시각 연결 풀(IronJacamar) 오류
        grep -n -E 'IJ0[0-9]{5}' $JBOSS_HOME/standalone/log/server.log | tail -10
        # 트랜잭션 계열(TransactionTimedOut·CannotCreateTransaction·UnexpectedRollback): 트랜잭션 관리자 경고
        grep -n -E 'ARJUNA0[0-9]{5}|WFLYTX' $JBOSS_HOME/standalone/log/server.log | tail -10
        # 빈 생성 계열(BeanCreationException·UnsatisfiedDependencyException): 기동 시점의 첫 빈 생성 실패
        grep -n -m5 'Error creating bean with name' $JBOSS_HOME/standalone/log/server.log
      check: "DB: 맨 안쪽 SQLException 의 SQLState·벤더 코드와 같은 시각 IJ0 풀 오류가 함께 있을 때 DB·데이터소스 원인으로 본다(로그 전체의 ORA-·SQLException 건수만으로 단정하지 않는다) · 트랜잭션: ARJUNA·WFLYTX 경고 시각이 맞으면 트랜잭션 시간 초과·롤백 · 빈 생성: 기동 시점 실패 → 설정값·의존 빈 · 그 밖의 업무 예외(NullPointer·IllegalArgument 등)는 개발 담당"
      note: "적용: EAP 7.x/8.0(EAP 6 은 트랜잭션 메시지 접두어가 다를 수 있음) · 권한: 로그 읽기"
    - do: (조건부 보조) 맨 안쪽 원인이 ClassNotFoundException·NoClassDefFoundError·NoSuchMethodError 일 때만 WAR 라이브러리 확인
      cmd: |
        $JBOSS_HOME/bin/jboss-cli.sh -c "deployment-info"          # EAP 7.x
        $JBOSS_HOME/bin/jboss-cli.sh -c "deployment info"          # EAP 8.x
        unzip -l <원본경로>/<app>.war | grep -E 'WEB-INF/lib/.*\.jar' | head -60
      check: "배포 목록에서 대상 앱의 상태(OK 여부)와 이름 확인 · 같은 라이브러리(spring-*.jar 등)가 서로 다른 판으로 둘 이상이거나 서버 모듈과 겹치면 클래스 로딩 원인 · DB·트랜잭션·빈 생성 원인이면 이 단계는 건너뛴다"
      note: "적용: EAP 7.x 는 deployment-info, EAP 8.x 는 deployment info(둘 중 그 판에 맞는 한 줄만) · 권한: 원본 아카이브 읽기, jboss-cli 는 관리 사용자(프롬프트 인증)"
  - stage: 2
    steps:
    - do: (2차·승인 후) DB 원인 — 데이터소스 연결 시험 후 DB·네트워크 담당 이관
      cmd: |
        $JBOSS_HOME/bin/jboss-cli.sh -c "/subsystem=datasources/data-source=<ds>:test-connection-in-pool"
      check: "성공: true 이고 같은 Caused by 가 멈췄으면 일시 장애로 기록 · 실패: 연결 시험 실패면 DB·네트워크 담당 이관(EAP-PROC-R6-ORA 등 연결 절차)"
      note: "사전조건: 1차에서 맨 안쪽 원인이 DB 연결 계열로 확인됨 · 영향: 풀에 연결 1개를 새로 만들어 시험(설정 변경 없음) · 승인: WAS 담당·DBA · 백업/롤백: 설정 변경 없음 — 되돌릴 것 없음 · 적용: EAP 7.x/8.0"
    - do: (2차·승인 후) 설정·빈 생성·클래스 로딩 원인 — 수정본 배포 또는 직전 정상본 롤백
      cmd: |
        cp -p <원본경로>/<app>.war <보관경로>/<app>.war.bak.$(date +%Y%m%d%H%M)
        $JBOSS_HOME/bin/jboss-cli.sh -c "deploy <수정본경로>/<app>.war --force"
        $JBOSS_HOME/bin/jboss-cli.sh -c "deployment-info --name=<app>.war"          # EAP 7.x
        $JBOSS_HOME/bin/jboss-cli.sh -c "deployment info --name=<app>.war"          # EAP 8.x
      check: "성공: STATUS OK, 같은 Caused by 미발생 · 실패: 오류 반복 → 보관한 직전 war 로 deploy --force(롤백) 후 개발 담당 이관"
      note: "사전조건: 개발 담당 수정본·검증계 확인, 직전 정상 war 보관 · 영향: 재배포 중 앱 중단·세션 소실 · 승인: 애플리케이션 담당·WAS 담당·변경관리 · 백업/롤백: 첫 줄 보관본으로 deploy --force · 적용: EAP 7.x(deployment-info)/8.x(deployment info)"
  - stage: 3
    steps:
    - do: 개발 담당·Red Hat 전달 자료
      cmd: |
        awk -v s=<머리줄번호> 'NR<s {next} NR>s && /^[[:space:]]*[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9][ T][0-9][0-9]:[0-9][0-9]/ {exit} {print NR, $0}' $JBOSS_HOME/standalone/log/server.log > spring_chain_$(date +%Y%m%d).txt
      check: "요청 시각 예외 묶음 전체(맨 안쪽 Caused by 포함)·같은 시각 IJ0/ARJUNA 줄·배포 판"
      note: "민감정보 마스킹: SQL 바인드 값·요청 파라미터·세션 ID·사용자 ID·업무 데이터·호스트명·IP 가림 · 전달 승인: 보안 담당 승인 후 개발 담당·Red Hat 케이스에만"

# ───────────────────────── WebSphere CNTR0020E (EJB 미선언 예외) ─────────────────────────
- id: WAS-PROC-R6C-CNTR0020E
  scope: id
  products: [websphere]
  category: internal
  match: [CNTR0020E]
  title: EJB 호출 중 미선언 예외 (CNTR0020E) — 예외 데이터·중첩 원인·같은 시각 FFDC 로 원인 유형 분기
  source: "IBM WebSphere Application Server traditional 8.5.5/9.0 메시지 참조(CNTR0020E·DSRA·J2CA·SECJ)·'First Failure Data Capture(FFDC)'·'LogViewer command'(HPEL, ND 8.5.5)·backupConfig/restoreConfig 명령"
  verify_note: "미검증 — HPEL 사용 여부를 파일로 가르는 기준(HPEL 저장소 하위 디렉터리 이름)과 FFDC 인시던트 파일 이름 규칙은 IBM 공식 문서로 확인하지 못함(logViewer 의 -startDate·-stopDate·-thread·날짜 형식은 확인)"
  stages:
  - stage: 1
    steps:
    - do: 기록 방식 확인 — 기본(SystemOut.log) 인지 HPEL 인지 (읽기 전용)
      cmd: |
        ls -lt <PROFILE_ROOT>/logs/<server>/ | head -15
      check: "SystemOut.log·SystemErr.log 가 장애 시각까지 갱신돼 있으면 기본 로그 → 다음 단계의 '기본 로그' 줄 · SystemOut.log 가 없거나 장애 시각 전에 멈췄고 HPEL 저장소(이진 파일 하위 디렉터리)가 있으면 HPEL → logViewer 로 꺼낸 파일에 같은 명령"
      note: "적용: WAS traditional 8.5.5/9.0 · 권한: 로그 읽기(WAS 실행 계정) · HPEL 저장소 하위 디렉터리 이름은 미검증"
    - do: CNTR0020E 대상 묶음 찾기 — 시각·스레드 ID (읽기 전용)
      cmd: |
        # 기본 로그
        grep -n 'CNTR0020E' <PROFILE_ROOT>/logs/<server>/SystemOut.log | grep '<HH:MM>'
        # HPEL — 장애 시각 앞뒤 범위를 basic 형식 텍스트로 꺼낸 뒤 같은 grep(스레드 ID 를 알면 끝에 -thread <스레드ID> 를 붙여 좁힌다)
        <PROFILE_ROOT>/bin/logViewer.sh -startDate "<MM/dd/yy H:m:s:S z>" -stopDate "<MM/dd/yy H:m:s:S z>" > ~/cntr0020e_hpel_$(date +%Y%m%d).txt
        grep -n 'CNTR0020E' ~/cntr0020e_hpel_$(date +%Y%m%d).txt | grep '<HH:MM>'
      check: "출력 첫 칸 = 머리 줄 번호, '[시각]' 바로 뒤 8자리 16진 = 스레드 ID — 장애 시각과 맞는 줄 하나를 고르고 EJB 이름·메서드·예외 데이터(exception data)·스레드 ID 를 기록(같은 분에 여러 건이면 마지막 줄을 기계적으로 고르지 않는다)"
      note: "적용: WAS traditional 8.5.5/9.0 · logViewer 의 -startDate·-stopDate(날짜 형식 MM/dd/yy 또는 MM/dd/yy H:m:s:S z)·-thread(16진 스레드 ID)는 'LogViewer command' 문서 기준, 기본 출력 형식 basic · 권한: 로그 읽기(WAS 실행 계정) · 꺼낸 파일은 운영 데이터 — 확인 뒤 보관 위치를 담당과 정한다"
    - do: 그 묶음만 통째로 보고 Caused by 사슬 끝까지 (읽기 전용)
      cmd: |
        # <로그> = SystemOut.log 또는 위에서 꺼낸 HPEL 텍스트 파일, <머리줄번호> = 앞 단계 첫 칸
        awk -v s=<머리줄번호> 'NR<s {next} NR>s && /^[[:space:]]*\[[0-9]/ {exit} {print NR, $0}' <로그> | head -400
        awk -v s=<머리줄번호> 'NR<s {next} NR>s && /^[[:space:]]*\[[0-9]/ {exit} {print NR, $0}' <로그> | grep 'Caused by:'
      check: "다음 '[시각]' 줄 직전까지만 읽으므로 빈 줄·들여쓰기 없는 중간 예외 줄에서 멈추지 않고 다른 요청 묶음을 섞지 않는다 · 둘째 줄 출력의 마지막 줄이 맨 안쪽 원인, Caused by 가 없으면 예외 데이터의 마지막 'nested exception is' 뒤 예외 · 스택이 SystemErr.log 에 따로 찍히는 구성이면 SystemErr.log 에서 같은 시각·같은 스레드 ID 줄 번호를 grep -n 으로 찾아 같은 awk 로 본다(검증도구 kw7 고정 로그 6경우 시험, 틀린 답 0)"
      note: "적용: WAS traditional 8.5.5/9.0(줄 머리 '[시각]' — 로캘에 따라 날짜 표기가 달라도 '[' 다음 숫자로 시작) · 권한: 로그 읽기 · 여러 스레드가 printStackTrace 로 줄 단위로 섞어 쓴 경우는 줄 도구로 가를 수 없음(FFDC 로)"
    - do: 그 묶음 안의 FFDC 안내와 같은 시각·같은 스레드의 FFDC 확인 (읽기 전용)
      cmd: |
        # ② 단계와 같은 awk 로 뽑은 묶음 전체에서 FFDC 안내 찾기 — 안내가 시각 줄과 다른 줄에 있을 수 있다
        awk -v s=<머리줄번호> 'NR<s {next} NR>s && /^[[:space:]]*\[[0-9]/ {exit} {print NR, $0}' <로그> | grep 'FFDC'
        grep -n 'FFDC' <로그> | grep '<HH:MM>' | grep '<스레드ID>'          # 같은 시각·같은 스레드로 따로 찍힌 FFDC 기록 줄
        ls -lt <PROFILE_ROOT>/logs/ffdc/ | head -20
        grep -l '<맨안쪽예외클래스>' $(ls -t <PROFILE_ROOT>/logs/ffdc/* | head -20) 2>/dev/null
        # 위에서 못 찾으면: ls -lt <PROFILE_ROOT>/logs/ffdc/ 에서 장애 시각 앞뒤 파일을 골라 그 파일들에 같은 grep -l
      check: "첫째 줄은 시각 줄 하나가 아니라 CNTR0020E 묶음 전체에서 FFDC 안내를 찾는다(인시던트 파일 이름이 시각 줄과 다른 줄에 찍힐 수 있음), 둘째 줄은 같은 시각·같은 스레드 ID 로 따로 찍힌 FFDC 기록 · 확장자를 *.txt 로만 가정하지 않는다 — 시각 순 목록에서 장애 시각 전후 파일을 고르고 위 안내가 가리키는 인시던트 파일 이름과 맞춘다 · 그 파일의 시각·스레드·예외·probe 가 맨 안쪽 원인과 같으면 근거로 보관 · 예외 클래스만 같고 시각·스레드가 다른 파일은 다른 사건 · 최근 20개만 본 것은 부분 확인 — 없으면 장애 시각 범위 파일까지 넓힌다, 그래도 같은 시각 FFDC 가 없으면 로그 스택만으로 판단"
      note: "적용: WAS traditional 8.5.5/9.0(HPEL 이어도 FFDC 는 logs/ffdc) · 권한: 로그 읽기"
    - do: 맨 안쪽 원인 유형으로 분기 — DB·클래스 로딩·보안·자원·애플리케이션 (읽기 전용)
      cmd: |
        grep -n -E 'DSRA[0-9]{4}E|J2CA[0-9]{4}E' <PROFILE_ROOT>/logs/<server>/SystemOut.log | tail -10     # DB·연결 자원
        grep -n -E 'SECJ[0-9]{4}E' <PROFILE_ROOT>/logs/<server>/SystemOut.log | tail -10                   # 보안
        grep -n -E 'ClassNotFoundException|NoClassDefFoundError|ClassCastException' <PROFILE_ROOT>/logs/<server>/SystemOut.log | tail -10   # 클래스 로딩
      check: "DB(SQLException·DSRA) = DBA·데이터소스 담당 · 자원(J2CA 연결 풀 고갈·대기 시간 초과) = 풀 크기·Connection timeout · 보안(SECJ·AccessException·권한 거부) = 보안 설정·역할 매핑 · 클래스 로딩(ClassNotFound·NoClassDefFound·같은 이름 클래스의 ClassCastException) = 배포 묶음·클래스 로더 순서 · 위에 해당 없고 업무 클래스의 예외(NullPointer·IllegalArgument 등)면 애플리케이션 — 개발 담당. 같은 시각 줄만 근거로 쓴다"
      note: "적용: WAS traditional 8.5.5/9.0 · 권한: 로그 읽기"
  - stage: 2
    steps:
    - do: (2차·승인 후) 자원·클래스 로딩 원인일 때 설정 조정 — 연결 풀 또는 클래스 로더 순서
      cmd: |
        <PROFILE_ROOT>/bin/backupConfig.sh /tmp/wasconfig_$(date +%Y%m%d%H%M).zip -nostop
        # 자원(J2CA 풀 고갈): 관리 콘솔 데이터 소스 <ds> 의 연결 풀 특성 Maximum connections·Connection timeout 조정 후 저장
        # 클래스 로딩: 관리 콘솔 애플리케이션 <app> 의 Class loader order(부모 우선/로컬 우선) 조정 후 저장·노드 동기화
      check: "성공: 저장·동기화·앱 재시작 후 같은 CNTR0020E·원인 예외 미발생 · 실패: 반복되거나 다른 오류 → 첫 줄 zip 으로 restoreConfig(롤백) 후 3차"
      note: "사전조건: 1차에서 원인 유형 확정(DB·보안 원인이면 해당 담당 조치가 먼저), 업무 담당과 작업 시간 합의 · 영향: 풀·클래스 로더 변경은 앱 또는 서버 재시작 후 적용, 재시작 동안 서비스 중단 · 승인: WAS 운영 담당·애플리케이션 담당 · 백업/롤백: 첫 줄 backupConfig zip, 되돌릴 때 restoreConfig · 적용: WAS 8.5.5/9.0(ND 는 저장 후 노드 동기화)"
  - stage: 3
    steps:
    - do: IBM Support·개발 담당 전달 자료
      cmd: |
        tar czf was_cntr0020e_$(date +%Y%m%d).tgz <PROFILE_ROOT>/logs/<server>/SystemOut.log <PROFILE_ROOT>/logs/<server>/SystemErr.log <PROFILE_ROOT>/logs/ffdc/
        # HPEL 이면 SystemOut/SystemErr 대신 1차에서 logViewer 로 꺼낸 텍스트 파일(~/cntr0020e_hpel_<날짜>.txt)을 넣는다
        <WAS_HOME>/bin/versionInfo.sh -maintenancePackages | head -30
      check: "CNTR0020E 묶음(머리 줄 번호·스레드 ID)·같은 시각·같은 스레드 FFDC·SystemErr(또는 HPEL 출력)·WAS 판·수정 팩"
      note: "민감정보 마스킹: 로그·FFDC 의 호스트명·IP·사용자 ID·세션 ID·JDBC URL·SQL 바인드 값 가림 · 전달 승인: 보안 담당 승인 후 IBM 케이스(ECuRep)·개발 담당에만"

# ───────────────────────── Spring BeanCreationException (자바 공통) ─────────────────────────
- id: JAVA-PROC-R6C-BEANCREATION
  scope: id
  products: [java]
  category: internal
  match: [ORG.SPRINGFRAMEWORK.BEANS.FACTORY.BEANCREATIONEXCEPTION]
  title: Spring 빈 생성 실패 — 실패 빈과 맨 안쪽 원인을 같은 예외 묶음에서 (연결·FD 확인은 조건부)
  source: "Spring Framework 참조 'BeanCreationException(중첩 cause)'·man7.org lsof(8)·proc(5)(/proc/<PID>/fd·/proc/<PID>/limits)"
  verify_note: "미검증 — Spring Framework 공식 문서(docs.spring.io)는 허용 도메인 목록 밖이라 우리가 직접 대조하지 못함 — BeanCreationException 클래스 정의(빈 생성 실패 예외, 중첩 cause 보유)는 2차 교차 검토자가 Spring Framework 5.3 API 문서로 대조했다고 전함, 메시지 문구('Error creating bean with name')와 다른 판(6.x) 문서는 직접 대조 못 함"
  stages:
  - stage: 1
    steps:
    - do: 장애 시각의 기동 실패 묶음 하나를 찾아 실패 빈과 맨 안쪽 원인 확인 (읽기 전용)
      cmd: |
        # ① 'Error creating bean' 이 든 묶음의 머리 줄(시각·레벨·스레드)을 줄 번호와 함께, 장애 시각으로 거른다
        awk '/^[[:space:]]*[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9][ T][0-9][0-9]:[0-9][0-9]/ {h=NR; hl=$0} /Error creating bean with name/ && h {print h, substr(hl,1,200)}' <app_log> | uniq | grep '<HH:MM>' | tail -20
        # ② 고른 머리 줄부터 다음 '날짜 시각' 줄 직전까지 — 묶음 전체(실패 빈 이름 포함)
        awk -v s=<머리줄번호> 'NR<s {next} NR>s && /^[[:space:]]*[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9][ T][0-9][0-9]:[0-9][0-9]/ {exit} {print NR, $0}' <app_log> | head -400
        # ③ 그 묶음 안의 Caused by 목록 — 마지막 줄이 맨 안쪽 원인
        awk -v s=<머리줄번호> 'NR<s {next} NR>s && /^[[:space:]]*[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9][ T][0-9][0-9]:[0-9][0-9]/ {exit} {print NR, $0}' <app_log> | grep 'Caused by:'
        # (지원 로그 형식이 아닐 때만) ①~③ 대신 원문 직접 — 줄 번호를 찾아 그 앞뒤를 그대로 읽는다
        grep -n 'Error creating bean' <app_log> | grep '<HH:MM>' | tail -20
        sed -n '<시작줄>,<끝줄>p' <app_log>
      check: "① 출력 첫 칸 = 머리 줄 번호, '[ … ]' 안 = 스레드 — 장애 시각·스레드가 맞는 줄 하나를 고른다(기동을 여러 번 했거나 같은 초에 여러 스레드가 실패했으면 마지막 줄을 기계적으로 고르지 않는다) · ② 의 'Error creating bean with name' 줄의 빈 이름과 ③ 의 마지막 Caused by 가 한 짝(따로 grep 한 줄끼리 짝짓지 않는다) — 마지막 Caused by 는 보통의 사슬에서 맨 안쪽 원인이지만 Suppressed:·함께 찍힌 다른 원인이 있을 수 있어 유일한 근본 원인이라 보장되지 않는다(② 묶음의 'Suppressed:' 도 원인 후보로 기록) · 맨 안쪽 유형: 설정값 누락(Could not resolve placeholder)·의존 빈 없음(NoSuchBeanDefinitionException)·클래스 없음(ClassNotFoundException)·연결 실패(Connection refused·timed out·UnknownHostException)·자원 한계(Too many open files) · 빈 줄·들여쓰기 없는 중간 예외 줄에서 멈추지 않는다(검증도구 kw7 고정 로그 6경우 시험, 틀린 답 0)"
      note: "적용: Spring 3.x~6.x · 지원 로그 형식: 각 항목이 'YYYY-MM-DD HH:MM'(또는 ISO 'YYYY-MM-DDTHH:MM', Spring Boot 기본) 머리로 시작하는 로그만 — 다른 패턴이면 세 awk 결과를 믿지 말고 넷째 줄처럼 grep -n 으로 찾은 줄 앞뒤를 sed -n 으로 원문 그대로 읽는다 · 권한: 로그 읽기 · 여러 스레드가 printStackTrace 로 줄 단위로 섞어 쓴 경우는 줄 도구로 가를 수 없음"
    - do: (조건부) 맨 안쪽 원인이 연결 실패일 때만 — 선택적 능동 확인
      cmd: |
        nc -zvw3 <host> <port>
      check: "succeeded/open 이면 네트워크 도달 가능 → URL·계정·드라이버 설정 쪽, refused/timed out 이면 대상 서비스·방화벽 담당 이관 · 맨 안쪽 원인이 연결 실패가 아니면 이 단계는 건너뛴다"
      note: "선택적 능동 확인(대상에 TCP 연결 1회 시도) — 포트 시험이 금지된 구간이면 생략 · 적용: nc(nmap-ncat·OpenBSD netcat) · 권한: 일반 사용자"
    - do: (조건부) 맨 안쪽 원인이 'Too many open files' 일 때만 — 파일 기술자 확인 (읽기 전용)
      cmd: |
        ls /proc/<PID>/fd | wc -l ; echo "ls 종료 코드=${PIPESTATUS[0]}"
        grep "Max open files" /proc/<PID>/limits
        lsof -p <PID> | awk '{print $5}' | sort | uniq -c | sort -rn | head
      check: "ls 종료 코드가 0 이고 'Permission denied' 가 없을 때만 개수가 유효 — 권한 오류면 wc 가 0 을 내지만 '열린 파일 0' 이 아니라 읽기 실패이므로 JVM 실행 계정(sudo -u <appuser>) 또는 root 로 다시 실행 · lsof 도 권한 경고가 나면 결과가 빠진 것 · 열린 파일 수가 한도의 90% 이상이면 FD 고갈 확정 — 소켓(IPv4/IPv6)·파일(REG) 중 무엇이 늘었는지 기록 · 맨 안쪽 원인이 이것이 아니면 건너뛴다"
      note: "적용: Linux, bash(PIPESTATUS) · 권한: JVM 실행 계정 또는 root(다른 계정 프로세스의 /proc/<PID>/fd 는 읽기 거부)"
  - stage: 2
    steps:
    - do: (2차·승인 후) 맨 안쪽 원인 정정 후 애플리케이션 기동
      cmd: |
        cp -p <설정파일> <설정파일>.bak.$(date +%Y%m%d%H%M)
        # 설정값 누락·의존 빈·클래스 없음: 개발 담당 수정 설정·배포본 반영 / 연결 실패: 대상 서비스 복구 확인 뒤 기동
        systemctl restart <app>
      check: "성공: 기동 로그에 같은 'Error creating bean' 없음, 헬스체크 정상 · 실패: 같은 빈이 다시 실패 → 보관한 설정·직전 배포본으로 원복 후 개발 담당 이관"
      note: "사전조건: 1차에서 실패 빈·맨 안쪽 원인 확정, 직전 설정·배포본 보관 · 영향: 기동 동안 서비스 중단 · 승인: 애플리케이션 담당·운영 담당 · 백업/롤백: 첫 줄 보관 설정·직전 배포본으로 원복 · 적용: systemd 서비스(WAS 위 배포면 그 WAS 의 배포 명령으로)"
    - do: (2차·승인 후, 'Too many open files' 일 때만) nofile 한도 조정
      config:
        file: /etc/security/limits.conf 또는 systemd 유닛(LimitNOFILE)
        snippet: |
          <appuser> soft nofile <값>
          <appuser> hard nofile <값>
      cmd: |
        systemctl restart <app>
      check: "성공: /proc/<PID>/limits 에 새 한도, 빈 생성 성공 · 실패: fd 가 계속 늘면 미반환 누수 — 개발 담당 수정"
      note: "사전조건: lsof 결과로 늘어난 유형 기록, 업무 영향 적은 시간 · 영향: 재기동 동안 서비스 중단 · 승인: 운영 담당·서비스 담당 · 백업/롤백: 변경 전 limits.conf·유닛 파일 사본 보관 후 원복"
  - stage: 3
    steps:
    - do: 개발 담당 전달 자료
      cmd: |
        awk -v s=<머리줄번호> 'NR<s {next} NR>s && /^[[:space:]]*[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9][ T][0-9][0-9]:[0-9][0-9]/ {exit} {print NR, $0}' <app_log> > beancreation_$(date +%Y%m%d).txt
      check: "실패 빈 예외 묶음 전체(맨 안쪽 Caused by 포함)·직전 설정 변경 이력·배포 판"
      note: "민감정보 마스킹: 설정값 안의 계정·URL·IP·토큰, 업무 데이터 가림 · 전달 승인: 보안 담당·개발 담당"

# ───────────────────────── 스토리지 자동 계층화 ─────────────────────────
- id: OSC-PROC-R6C-TIERING
  scope: id
  products: [os-common-match]
  category: storage
  match: [LEG-STOR-TIERING]
  title: 스토리지 자동 계층화(Auto-tiering·FabricPool) 작업 실패 — 정책·계층 연결·스캐너 상태
  source: "NetApp ONTAP 9 CLI 참조(volume show -fields tiering-policy·storage aggregate object-store show / show-space·volume object-store tiering show·volume modify -tiering-policy) / 각 스토리지 제조사 관리 콘솔의 계층화 작업 화면"
  verify_note: "미검증 — 명령 이름 넷(volume show -fields tiering-policy·storage aggregate object-store show·storage aggregate object-store show-space·volume object-store tiering show)은 NetApp ONTAP 공식 CLI 문서에서 확인(2차 교차 검토), 남은 것: ONTAP 판별 매개변수(-volume·-vserver)·출력 필드 이름·aborted 사유 문구, volume modify -tiering-policy 형식은 판별 CLI 참조로 확인 필요. 다른 제조사 어레이는 콘솔 화면 기준"
  stages:
  - stage: 1
    steps:
    - do: NetApp ONTAP(FabricPool) 정책·클라우드 계층 연결·object-store 사용량 (읽기 전용, 클러스터 CLI admin 권한)
      cmd: |
        volume show -volume <vol> -fields tiering-policy
        storage aggregate object-store show
        storage aggregate object-store show-space
      check: "tiering-policy 가 의도(none·snapshot-only·auto·all)와 다르면 정책 설정 확인 · object-store show 에서 클라우드 계층이 사용 가능 상태가 아니면 연결(네트워크·인증서·자격 증명) 문제 · show-space 는 object-store(클라우드 계층)에 올라간 사용량만 보여 준다 — 계약·한도에 가까우면 용량 문제지만, 성능 계층(로컬 aggregate)을 포함한 전체 계층 사용률은 아니므로 이것만으로 '계층 여유 있음'을 판단하지 않는다(로컬 계층은 storage aggregate show 의 사용률로 따로 본다)"
      note: "적용: ONTAP 9.x FabricPool · 권한: 클러스터 조회 계정(admin 권한 수준) · 1차는 정책·일정 변경 없음"
    - do: (조건부) 스캐너 상태·마지막 실행 결과 — advanced 권한 (읽기 전용)
      cmd: |
        set -privilege advanced
        volume object-store tiering show -volume <vol>
        set -privilege admin
      check: "tiering show 의 마지막 결과가 aborted 계열이면 그 사유를 그대로 기록 · 셋째 줄 뒤 프롬프트가 일반(admin) 표시로 돌아왔는지 확인 — 둘째 줄이 오류로 끝나도 셋째 줄은 반드시 실행 · 계정 역할 때문에 advanced 로 못 올라가거나 명령이 거부되면 이 단계는 하지 않고 스토리지 담당(클러스터 관리자)에게 같은 명령 결과를 요청"
      note: "적용: ONTAP 9.x · 권한: volume object-store tiering show 는 advanced 권한 수준 명령 — 클러스터 관리자 역할이 필요하며 읽기 전용(readonly) 계정은 실행하지 못할 수 있다 · set -privilege advanced 는 계속할지 확인(y/n)을 묻는다 — 확인 후 조회만 하고, 실패하든 성공하든 set -privilege admin 으로 되돌린다(advanced 상태로 세션을 두지 않는다)"
    - do: 다른 제조사 어레이 — 관리 콘솔의 계층화 작업 상태 (읽기 전용)
      cmd: |
        # 스토리지 관리 콘솔(조회 계정): 계층화(Auto-tiering·FAST 등) 작업 목록 → 실패 작업의 대상 볼륨/풀·시작·종료 시각·실패 사유 화면 캡처
        # 같은 화면에서 계층별(성능/용량 계층) 사용률·이동 예정량 확인
      check: "실패 사유가 대상 계층 공간 부족이면 용량, 작업 시간대(window) 초과면 일정, 대상 계층 장치 오류면 하드웨어 — 사유 문구 그대로 기록(원인을 추정해 적지 않는다)"
      note: "적용: 각 제조사 관리 콘솔(메뉴 이름은 제조사·판마다 다름) · 권한: 콘솔 조회 계정"
  - stage: 2
    steps:
    - do: (2차·승인 후) 계층화 정책 조정 또는 계층 여유 확보
      cmd: |
        volume show -volume <vol> -fields tiering-policy                       # 변경 전 값 기록
        volume modify -vserver <svm> -volume <vol> -tiering-policy <정책>
        # 다른 제조사: 관리 콘솔에서 계층화 정책(이동 시간대·우선순위·계층 비율) 조정, 변경 전 화면 캡처
      check: "성공: 다음 스캔 뒤 tiering show 결과 completed, 계층별 사용률 목표 이내 · 실패: 같은 사유 반복 → 기록한 이전 정책으로 되돌리고 제조사 지원 케이스"
      note: "사전조건: 변경 전 정책 기록, 업무 담당과 성능 영향 합의 · 영향: 정책 변경 뒤 데이터 이동량 증가, 클라우드 계층에서 읽히는 데이터의 지연 증가 가능 · 승인: 스토리지 담당·서비스 담당 · 백업/롤백: 기록한 이전 정책으로 volume modify 재실행(콘솔은 캡처대로 원복) · 적용: ONTAP 9.x(형식 미검증)"
  - stage: 3
    steps:
    - do: 제조사 의뢰 자료
      cmd: |
        # ONTAP: 위 1차 명령 출력을 파일로 저장(SSH 세션 기록) · 다른 제조사: 관리 콘솔의 진단 번들(support bundle) 생성
      check: "계층화 정책·object-store 상태·사용량·스캐너 결과·실패 작업 목록·발생 시각"
      note: "민감정보 마스킹: 관리 IP·클라우드 계층 버킷 이름·접근 키 식별자·계정·호스트명 가림 · 전달 승인: 보안 담당 승인 후 제조사 케이스에만"

# ───────────────────────── WebtoB SSL/TLS ─────────────────────────
- id: WTB-PROC-R6C-TLS
  scope: id
  products: [webtob]
  category: security
  match: [LEG-WEBTOB-SSL]
  title: WebtoB SSL 인증서·TLS 핸드셰이크 오류 — 설정 경로·만료·체인·호스트 이름·키 짝
  source: "TmaxSoft WebtoB 5 관리자 안내서 3.17 'SSL 절'(CertificateFile·CertificateKeyFile 필수·CertificateChainFile·CACertificateFile)·NODE/VHOST 절 SSLFlag·SSLName·'wscfl' / WebtoB 6 Administrator Guide 'SSL Section'(ssl_configs·certificate_file·certificate_key_file) / OpenSSL s_client(-verify_hostname·-verify_return_error, 1.1.0+·-CAfile)·x509 -pubkey·pkey -pubout·sha256"
  verify_note: "미검증 — WebtoB 6 은 ssl_configs 절의 certificate_file·certificate_key_file 까지 Administrator Guide 'SSL Section' 으로 확인(2차 교차 검토), 체인·CA 인증서 항목 이름과 WebtoB 6 의 설정 적용(컴파일·재적재) 방법은 본문 확인 못 함(docs.tmaxsoft.com 접속 불가)"
  stages:
  - stage: 1
    steps:
    - do: 설정에서 인증서·키·체인 경로 확인 — 판 구분 (읽기 전용)
      cmd: |
        # WebtoB 5 (http.m)
        grep -n -i -E 'SSLFlag|SSLName|CertificateFile|CertificateKeyFile|CertificateChainFile|CACertificateFile|Protocols' $WEBTOBDIR/config/http.m
        # WebtoB 6 (ssl_configs 절)
        grep -rn -i -E 'ssl_configs|certificate_file|certificate_key_file' $WEBTOBDIR/config/ 2>/dev/null | head -20
      check: "WebtoB 5: NODE/VHOST 의 SSLFlag=Y·SSLName 이 가리키는 *SSL 항목의 CertificateFile·CertificateKeyFile·CertificateChainFile 경로가 실제 파일과 같아야 함(`ls -l <경로>`) · WebtoB 6: ssl_configs 절의 certificate_file·certificate_key_file 경로가 실제 파일과 같아야 함(체인 항목 이름은 미검증 — 그 판 안내서로)"
      note: "적용: WebtoB 5(관리자 안내서 3.17) / WebtoB 6(Administrator Guide 'SSL Section') · 권한: 설정 읽기"
    - do: 만료·체인·호스트 이름 검증 — 전체 출력을 남기고 Verify return code 를 읽는다 (읽기 전용)
      cmd: |
        openssl x509 -in <인증서> -noout -subject -issuer -enddate
        f=~/s_client_$(date +%Y%m%d%H%M%S).txt
        openssl s_client -connect <host>:<port> -servername <host> -verify_hostname <host> -verify_return_error </dev/null > "$f" 2>&1 ; echo "s_client 종료 코드=$?"
        grep -n -E 'Verify return code|verify error|depth=|errno|connect:' "$f" | head -20
        # 사내 CA 로 발급한 인증서면 그 CA 를 신뢰 기준으로 주고 다시 실행
        openssl s_client -connect <host>:<port> -servername <host> -verify_hostname <host> -verify_return_error -CAfile <ca.pem> </dev/null > "$f.ca" 2>&1 ; echo "s_client 종료 코드=$?"
        grep -n -E 'Verify return code|verify error|errno|connect:' "$f.ca" | head -10
      check: "'Verify return code: 0 (ok)' 이고 종료 코드 0 이면 정상 · 10 = 인증서 만료, 62 = 호스트 이름 불일치 · 18/19 = 자체 서명(신뢰 기준 없음) · 20/21 = 중간 인증서 누락(체인) 또는 신뢰 기준(루트·사내 CA)이 이 시험 PC 에 없음 — 사내 CA 면 -CAfile <ca.pem> 결과가 0 (ok) 이면 서버 체인은 정상이고 클라이언트 쪽 신뢰 저장소 문제 · Verify return code 줄이 없고 connect·errno 줄만 있으면 검증 결과가 아니라 연결 실패(포트·방화벽·NODE/VHOST 의 SSLFlag) — 'grep 결과 없음'을 정상으로 읽지 않는다, 저장한 전체 출력($f)을 연다"
      note: "적용: OpenSSL 1.1.0+/3.x(-verify_hostname·-verify_return_error), 1.0.x 는 두 옵션 없이 실행하고 subject 의 CN/SAN 을 눈으로 대조 · -verify_return_error 가 있으면 검증 실패 때 핸드셰이크를 끊고 종료 코드가 0 이 아니다 · 권한: 일반 사용자 · 저장 파일에는 서버 인증서(공개 정보)만 있고 개인 키는 없다"
    - do: 인증서·개인 키 짝 확인 — 키 종류(RSA·EC) 무관 공개 키 비교 (읽기 전용, 키 내용은 출력하지 않음)
      cmd: |
        set -o pipefail
        openssl x509 -in <인증서> -noout -pubkey | openssl sha256 ; echo "인증서 쪽 종료 코드=$?"
        openssl pkey -in <키> -pubout | openssl sha256 ; echo "키 쪽 종료 코드=$?"
      check: "두 종료 코드가 모두 0 이고 두 sha256 값이 같으면 짝이 맞음 · 다르면 키 불일치(교체 때 다른 CSR 의 키를 씀) · 어느 쪽이든 종료 코드가 0 이 아니거나 오류(권한 거부·형식 오류·암호 입력 실패)가 나오면 비교 무효 — 빈 입력의 해시끼리 같아 보일 수 있으므로 '같다'로 읽지 않는다"
      note: "적용: OpenSSL 1.0.x~3.x, RSA·EC 키 공통(pkey -pubout 은 공개 키만 출력, 개인 키는 출력하지 않음 — -modulus 비교는 RSA 전용이라 쓰지 않음) · 권한: 키 파일 읽기 권한(WebtoB 실행 계정·root) — 키 내용은 출력·복사·전달하지 않음, 암호 걸린 키는 프롬프트에서 입력하고 명령줄(-passin)에 쓰지 않음 · set -o pipefail 은 bash/ksh"
  - stage: 2
    steps:
    - do: (2차·승인 후) 인증서·체인 교체 후 설정 적용
      cmd: |
        cp -p <인증서> <인증서>.bak.$(date +%Y%m%d) ; cp -p <키> <키>.bak.$(date +%Y%m%d) ; cp -p $WEBTOBDIR/config/http.m $WEBTOBDIR/config/http.m.bak.$(date +%Y%m%d)
        wscfl -i $WEBTOBDIR/config/http.m
        $WEBTOBDIR/bin/wsdown ; $WEBTOBDIR/bin/wsboot
      check: "성공: wscfl 오류 없음, 기동 뒤 s_client 'Verify return code: 0 (ok)'·새 만료일 · 실패: 컴파일·기동 오류 또는 검증 실패 → 보관본(인증서·키·http.m) 복원 후 wscfl·재기동(롤백)"
      note: "사전조건: 새 인증서·중간 체인·키 짝(1차 3단계 해시 일치) 확인, 작업 시간 합의 · 영향: 재기동 동안 HTTPS 서비스 중단 · 승인: 웹 운영 담당·보안 담당 · 백업/롤백: 첫 줄 보관본으로 복원 · 적용: WebtoB 5(wscfl -i http.m) — WebtoB 6 은 그 판의 설정 적용 방법 확인(미검증)"
  - stage: 3
    steps:
    - do: TmaxSoft 의뢰 자료
      cmd: |
        openssl s_client -connect <host>:<port> -servername <host> </dev/null 2>&1 | grep -v -E 'BEGIN|END|^[A-Za-z0-9+/=]{40,}$' > tls_check_$(date +%Y%m%d).txt
        grep -n -i -E 'SSL|Certificate' $WEBTOBDIR/config/http.m > webtob_ssl_conf_$(date +%Y%m%d).txt
      check: "s_client 결과(인증서 본문 제외)·SSL 설정 발췌·WebtoB 로그의 오류 줄·WebtoB 판"
      note: "민감정보 마스킹: 내부 호스트명·IP 가림, 개인 키·키 암호(PassPhraseDialog 스크립트 내용)는 절대 포함하지 않음 · 전달 승인: 보안 담당 승인 후 TmaxSoft 케이스에만"

# ───────────────────────── Linux AppArmor 차단 ─────────────────────────
- id: LNX-PROC-R6C-APPARMOR
  scope: id
  products: [linux, ubuntu, sles]
  category: security
  match: [LNX-APPARMOR-DENIED]
  title: AppArmor 접근 차단(DENIED) — 프로파일·동작·대상·권한과 프로세스 모드 확인
  source: "Ubuntu Server 문서 'AppArmor'(aa-status·aa-complain·aa-enforce·apparmor_parser -r·/etc/apparmor.d/local) / man7.org proc(5)(/proc/<PID>/attr/current) / 커널 감사 문구 apparmor=\"DENIED\" operation= profile= name= requested_mask= denied_mask="
  verify_note: "미검증 — 커널 5.x 이후 LSM 을 여럿 쌓은 구성에서는 AppArmor 표지가 /proc/<PID>/attr/apparmor/current 에 있을 수 있음(판별 문서 미확인), capability·network 이벤트의 대체 필드 이름(capname=·family=·sock_type=)은 커널 판별 문서로 대조하지 못함 · apparmor_parser -p(include 를 펼친 전처리 출력)를 지원하는 판(AppArmor 2.13+/3 로 봄)도 공식 문서로 확인하지 못함 — 옵션 오류가 나면 프로파일·local 의 include 줄이 가리키는 /etc/apparmor.d/abstractions/ 파일을 직접 grep"
  stages:
  - stage: 1
    steps:
    - do: 차단 기록에서 profile·operation·name·requested_mask·denied_mask 추출 (읽기 전용)
      cmd: |
        journalctl -k --since '-2 hours' | grep -i 'apparmor="DENIED"' | tail -30
        journalctl -k --since '-2 hours' | grep -i 'apparmor="DENIED"' | grep -o -E '(profile|operation|name|requested_mask|denied_mask)="[^"]*"' | sort | uniq -c | sort -rn | head -30
        grep -i 'apparmor="DENIED"' /var/log/kern.log | tail -30          # journald 기록이 없을 때(Ubuntu)
        systemctl is-active auditd && grep -i 'apparmor="DENIED"' /var/log/audit/audit.log | tail -30     # auditd 가 돌면 감사 기록이 audit.log 로 간다(SLES 등)
        grep -n 'deny' /etc/apparmor.d/<profile> /etc/apparmor.d/local/<profile>          # 프로파일 본문·local 의 명시적 deny 규칙
        apparmor_parser -p /etc/apparmor.d/<profile> | grep -n 'deny'          # include 된 abstraction 까지 펼친 전처리 출력(적재 안 함, AppArmor 2.13+/3 — 지원 판 미검증)
      check: "profile= 막은 프로파일, operation= 동작(open·exec·connect 등), name= 대상 경로, requested_mask/denied_mask= 요청·거부된 권한(r·w·x 등), comm= 프로그램 이름 — 같은 profile·name 이 장애 시각에 몰리면 그 접근이 원인 · capability·network 등 일부 이벤트에는 requested_mask/denied_mask 가 없다(capname=·family=·sock_type= 등이 대신 나옴) — 파싱 오류가 아님 · DENIED 가 0줄이어도 '막힌 것 없음'이 아니다: 프로파일의 명시적 deny 규칙에 걸린 접근은 기본적으로 기록되지 않으므로 마지막 두 줄(프로파일·local 의 deny, include 된 abstraction 까지 펼친 apparmor_parser -p 전처리 출력의 deny)로 장애 대상 경로를 막는 deny 규칙이 있는지 본다 — deny 는 include 된 abstraction 파일에 있을 수 있어 프로파일·local 만 보면 놓친다, deny 규칙이 안 보여도 차단이 없었다고 단정하지 않는다 · auditd 가 돌면 kern.log·journal 에 없고 audit.log 에만 있을 수 있다 · 처음 보는 경로·실행 파일이면 보안 담당에 침해 여부 확인 요청"
      note: "적용: Ubuntu 16.04~24.04·SLES 12~15(apparmor_parser -p 는 AppArmor 2.13+/3 로 봄 — 지원 판 미검증) · 권한: root 또는 systemd-journal/adm 그룹(audit.log·apparmor_parser 는 root)"
    - do: 프로파일 모드와 대상 프로세스의 현재 표지 — PID 재사용 주의 (읽기 전용)
      cmd: |
        aa-status
        cat /proc/<PID>/attr/current
        ps -o pid,lstart,comm,args -p <PID>          # <PID> = DENIED 기록의 pid=
      check: "aa-status 에서 그 profile 이 enforce 목록이면 차단 동작 중, complain 이면 기록만(차단 아님 — 다른 원인 찾기) · PID 는 재사용되므로 과거 기록의 pid= 만으로 지금 프로세스를 그 사건과 짝짓지 않는다 — 기록의 comm=·profile= 이 ps 의 명령 이름·/proc/<PID>/attr/current 의 프로파일과 같고, 프로세스 시작 시각(lstart)이 기록 시각보다 앞일 때만 같은 프로세스 · 짝이 맞으면 /proc/<PID>/attr/current 가 '<profile> (enforce)' 면 그 프로파일로 차단 중, 'unconfined' 면 AppArmor 대상 아님 · 서비스 프로세스인지와 장애 시각을 대조"
      note: "적용: Ubuntu·SLES(apparmor-utils, procps ps) · 권한: aa-status 는 root"
  - stage: 2
    steps:
    - do: (2차·승인 후) 원인 확인 기간 동안 complain 모드로 전환
      cmd: |
        cp -p /etc/apparmor.d/<profile> /root/<profile>.bak.$(date +%Y%m%d%H%M)
        aa-complain /etc/apparmor.d/<profile>
        aa-status | grep -A3 -i complain
      check: "성공: aa-status 에서 그 profile 이 complain 으로 옮겨지고 서비스 동작 회복, 로그에 ALLOWED 로 남음 · 실패: 계속 차단되면 다른 profile 이거나 AppArmor 밖의 원인(파일 권한 등) → aa-enforce 로 원복"
      note: "사전조건: 보안 담당과 기록 전환 기간·종료 시점 합의 · 영향: 그 프로그램의 AppArmor 보호가 기록만 하는 상태로 약해짐 · 승인: 보안 담당·시스템 담당 · 백업/롤백: aa-enforce /etc/apparmor.d/<profile> 로 원복, 프로파일 사본 보관 · 적용: Ubuntu·SLES(apparmor-utils)"
    - do: (2차·승인 후) 필요한 규칙만 local 프로파일에 추가하고 enforce 유지
      cmd: |
        cp -p /etc/apparmor.d/local/<profile> /root/local_<profile>.bak.$(date +%Y%m%d%H%M)
        vi /etc/apparmor.d/local/<profile>          # 1차의 name·requested_mask 만큼만 규칙 추가(aa-logprof 제안은 검토 후)
        apparmor_parser -r /etc/apparmor.d/<profile>
        aa-enforce /etc/apparmor.d/<profile>
      check: "성공: apparmor_parser 오류 없음, enforce 상태에서 같은 DENIED 미발생 · 실패: 구문 오류나 다른 차단 → 보관본 복원 후 apparmor_parser -r(롤백)"
      note: "사전조건: 추가할 경로·권한을 보안 담당이 검토(넓은 와일드카드 금지) · 영향: 재적재 순간 해당 프로파일 정책 교체 · 승인: 보안 담당·시스템 담당 · 백업/롤백: 첫 줄 보관본으로 복원 후 apparmor_parser -r · 적용: Ubuntu·SLES"
  - stage: 3
    steps:
    - do: 배포판 제조사·보안 담당 전달 자료
      cmd: |
        journalctl -k --since '-24 hours' | grep -i 'apparmor="DENIED"' > apparmor_denied_$(date +%Y%m%d).txt
        grep -i 'apparmor="DENIED"' /var/log/audit/audit.log >> apparmor_denied_$(date +%Y%m%d).txt      # auditd 가 돌 때
        aa-status > aa_status_$(date +%Y%m%d).txt
      check: "DENIED 기록·aa-status·해당 프로파일과 local 추가 규칙·패키지 판(dpkg -l / rpm -q 로 해당 프로그램)"
      note: "민감정보 마스킹: 경로 안 사용자 이름·업무 파일명·호스트명 가림 · 전달 승인: 보안 담당 승인 후 전달"
