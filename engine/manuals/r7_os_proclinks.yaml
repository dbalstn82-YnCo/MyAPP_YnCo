# 7차 연결 감사(2026-10-16) — OS 판정 31건(검증도구\kw7\E_os.json): '이 판정 전용'으로 이어져 있으나 판정 제목 핵심어가 절차에 하나도 없던 연결을 사람이 검토했다.
#  (a) fit_reviewed: true — 절차의 1차 명령·2차 조치가 실제로 그 판정에 맞음(낱말만 다름). reviewed 에 근거.
#  (b) primary: true      — 더 맞는 기존 절차를 1순위로(원래 절차는 2순위로 함께 보임). 제목 핵심어가 절차에 없는 것은 fit_reviewed 도 함께.
#  (c) 맞는 절차가 없던 6건은 r7_os_procedures.yaml 의 전용 절차(scope: id)로 만들었다 — 여기에는 없다.
