  reviewed: "2026-10-16 판정 적합성 확인 — 교착은 잠금 보유·대기 관계 문제라 v$lock·v$transaction 확인과 업무 확인 후 보유 트랜잭션 정리가 맞음(교착은 자동 해소되므로 2차 정리는 반복 시에만)"
- procedure: TBR-PROC-R5-CONNECTION
