    서버 콘솔 출력: DOMAIN_HOME/servers/<SERVER>/logs/<SERVER>.out Node Manager 기동 시 · Node Manager 로그: DOMAIN_HOME/nodemanager/nodemanager.log 기본 · HTTP Access 로그: DOMAIN_HOME/servers/<SERVER>/logs/access.log
    기본 설정 계열 · 보안 Audit 로그: <server>/logs/DefaultAuditRecorder.log 기본 · JMS 메시지 로그: DOMAIN_HOME/servers/<SERVER>/logs/jmsservers/<JMSServer>/<JMSServer>-jms.messages.log · JDBC 서브시스템 로그: DOMAIN_HOME/servers/<SERVER>/logs/<SERVER>.log
