    설정 경로, 예 /var/log/postgresql · Windows Event 로그: Windows Event Viewer Application, log_destination=eventlog · SQL Statement 로그: Server 로그와 동일 경로, log_statement · Slow Query 로그: Server 로그와 동일, log_min_duration_statement
    · 접속·종료 로그: Server 로그와 동일, log_connections,log_disconnections · Checkpoint 로그: Server 로그와 동일, log_checkpoints · Replication 명령 로그: Server 로그와 동일, log_replication_commands=on · Archive 오류 로그: Server
