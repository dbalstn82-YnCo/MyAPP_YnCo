<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LogTriage · 자원 문서 보기</title>
<link rel="stylesheet" href="/static/_srv_common.css">
<style>
body.full .side{display:none}
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.tb .grow{flex:1;min-width:120px}
.tb input[type=search]{width:260px}
.tb select{width:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:12px;color:var(--muted);background:var(--surface)}
.seg button.on{background:var(--accent);color:#fff;font-weight:700}
.sheetwrap{overflow:auto;max-height:calc(100vh - 210px)}
body.full .sheetwrap{max-height:calc(100vh - 150px)}
table.xl{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;min-width:100%;font-size:12.5px}
table.xl.auto{table-layout:auto;width:auto}
table.xl th,table.xl td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;background:var(--surface)}
table.xl.wrap th,table.xl.wrap td{white-space:normal;word-break:break-all}
table.xl th{background:#EEF5F8;color:var(--ink);font-size:12px;font-weight:700;text-align:center;letter-spacing:0;text-transform:none;position:sticky;z-index:2;white-space:normal;word-break:keep-all;line-height:1.3}
table.xl td.rn,table.xl th.rn{position:sticky;left:0;z-index:3;background:#FAFBFC;color:var(--muted);font-family:Consolas,monospace;font-size:11px;text-align:right;width:52px;min-width:52px;max-width:52px}
table.xl th.rn{z-index:4}
table.xl td.num{text-align:right;font-variant-numeric:tabular-nums}
table.xl td.m{background:#FBFDFE;vertical-align:middle}
table.xl tr:hover td{background:#F4FAFB}
table.xl td mark{background:#FFF3B0;padding:0 1px}
table.xl td.hid,table.xl th.hid{background:#FFF8E6}
table.xl tr.nonum td{background:#FFFBEA}table.xl tr.nonum td.rn{color:#8A5A00;font-weight:700}
.cntbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0;padding:8px 12px;background:#F2F7FF;border:1px solid #D6E4FB;border-radius:10px;font-size:13px;color:#2A303A}
.cntbar #count{flex:1;min-width:240px}.cntbar #count b{color:#1A5FD0}.cntbar #count b.warn{color:#B42318}.cntbar .btn{margin-left:auto}
table.xl td .nonumtag{display:inline-block;font-size:11px;font-weight:700;color:#8A5A00;background:#FDEBB8;border-radius:6px;padding:0 6px}
.docmeta{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
/* 편집 모드 */
.etb{background:#FFF8EF;border-bottom:1px solid #F3D9BE}
.etb .hint{font-size:11.5px;color:#7A5A3A}
.etb input[type=number]{width:58px;padding:4px 6px}
.seg button.dz{color:#B3261E}
#edit.on{background:#B3261E;color:#fff;border-color:#B3261E}
body.edit table.xl td[data-c],body.edit table.xl th[data-c]{cursor:cell}
body.edit table.xl td.rn{cursor:pointer}
body.edit table.xl td.rn:hover{background:#FFE7D6}
table.xl th.cl{background:#E6EEF3;cursor:pointer;font-family:Consolas,monospace;font-size:11px;color:var(--muted);padding:3px 6px}
table.xl th.cl:hover{background:#D5E3EC}
table.xl th.selc,table.xl td.selc{background:#EAF3FF!important}
table.xl tr.sel td{background:#FFF1E6!important}
table.xl tr.sel td.rn{background:#FFD9BF!important;color:#7A3A10}
table.xl td.rn.nw,table.xl th.rn.nw{color:var(--accent-ink);font-style:italic;font-family:inherit}
table.xl td.editing,table.xl th.editing{padding:2px;overflow:visible}
table.xl .ce{width:100%;box-sizing:border-box;font:inherit;font-size:12.5px;padding:3px 6px;border:2px solid var(--accent);border-radius:4px;outline:0;background:#fff;color:var(--ink)}
body.busy .etb button,body.busy .etb input{opacity:.5;pointer-events:none}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1F2A33;color:#fff;font-size:12.5px;padding:8px 16px;border-radius:99px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
#histtbl th,#histtbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:12.5px;vertical-align:top}
#histtbl th{background:#EEF5F8;font-size:12px}
</style>
</head>

let qt; $('q').oninput=()=>{clearTimeout(qt);qt=setTimeout(()=>{q=$('q').value.trim();LIMIT=300;SELR.clear();render()},200)};   // 검색이 바뀌면 행 선택 해제(보이지 않는 행 삭제 방지)
$('hdr').onchange=async()=>{const n=+$('hdr').value; try{await call('doc/header',{id:ID,sheet:DOC.sheets[SI].name,header_rows:n});DOC.sheets[SI].header_rows=n;DOC.sheets[SI].header_set=true;tabs();render()}catch(e){alert(e.message)}};
$('wseg').onclick=e=>{const b=e.target.closest('[data-w]');if(!b)return;W=(b.dataset.w==='auto'||b.dataset.w==='orig')?b.dataset.w:+b.dataset.w;[...$('wseg').children].forEach(x=>x.classList.toggle('on',x===b));render()};
$('wrap').onchange=()=>$('xl').classList.toggle('wrap',$('wrap').checked);
$('showhid').onchange=()=>{SHOWHID=$('showhid').checked;SELR.clear();SELC.clear();tabs();render()};
$('nonumbtn').onclick=()=>{NONUM=!NONUM;LIMIT=300;SELR.clear();render()};
$('more').onclick=()=>{LIMIT+=300;render()};
$('full').onclick=()=>{document.body.classList.toggle('full')};
load().catch(e=>{$('xb').innerHTML=`<tr><td class="empty">${esc(e.message)}</td></tr>`});
</script>
<script>/* 링크는 href 대신 data-href 로 이동(마우스 오버 시 브라우저 상태 표시줄에 주소가 뜨지 않게). Ctrl/가운데 클릭은 새 탭 */
(function(){function tgt(e){return e.target&&e.target.closest?e.target.closest("a[data-href]"):null}
function go(a,e){if(a.hasAttribute("href"))return;var h=a.getAttribute("data-href");if(!h||h==="#"||!(h=(window.LT_OKHREF||function(){return''})(h))||e.defaultPrevented||e.repeat)return;e.preventDefault();if(e.ctrlKey||e.metaKey||e.shiftKey||e.button===1||a.getAttribute("target")==="_blank"){window.open(h,"_blank","noopener");return}location.href=h}
document.addEventListener("click",function(e){var a=tgt(e);if(a)go(a,e)});
document.addEventListener("auxclick",function(e){var a=tgt(e);if(a&&e.button===1)go(a,e)});
document.addEventListener("keydown",function(e){if(e.key!=="Enter"&&e.key!==" ")return;var a=tgt(e);if(a)go(a,e)});
new MutationObserver(function(){document.querySelectorAll("a[data-href]:not([tabindex])").forEach(function(a){a.tabIndex=0;a.setAttribute("role","link")})}).observe(document.documentElement,{childList:true,subtree:true});
document.querySelectorAll("a[data-href]:not([tabindex])").forEach(function(a){a.tabIndex=0;a.setAttribute("role","link")});})();</script>
</body>
</html>
