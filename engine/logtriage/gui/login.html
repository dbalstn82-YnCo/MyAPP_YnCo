<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#C12554">
<title>LogTriage 로그인 — (주)솔리데오</title>
<style>
*{box-sizing:border-box}
:root{--ink:#1B1E25;--sub:#5A6472;--muted:#8A93A0;--brand:#C12554;--brand-d:#9C1442;--brand-l:#E0446E;
  --line:#E7E9EE;--field:#C9D0DA;--bg:#F6F7F9;--bad:#B42318;--good:#0E7C54}
html,body{height:100%}
body{margin:0;font:15px/1.65 "Malgun Gothic","Segoe UI",system-ui,sans-serif;color:var(--ink);background:#fff;overflow:hidden}
.stage{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(432px,.98fr);height:100vh;position:relative}
/* 왼쪽 - 브랜드/비주얼 */
.visual{position:relative;overflow:hidden;background:#fff;display:flex;flex-direction:column;
  padding:clamp(30px,4.2vw,58px) clamp(28px,4.4vw,62px) clamp(26px,3.4vh,40px)}
/* 그림은 흰 스튜디오 배경이라 곱하기 합성 + 가장자리 흐림으로 화면에 그대로 녹인다(네모 경계가 보이지 않게) */
.art{flex:0 1 auto;min-height:0;width:100%;height:auto;align-self:center;object-fit:contain;object-position:center;
  margin:auto 0;
  mix-blend-mode:multiply;
  -webkit-mask-image:radial-gradient(closest-side,#000 72%,rgba(0,0,0,0) 100%);
  mask-image:radial-gradient(closest-side,#000 72%,rgba(0,0,0,0) 100%)}   /* 넓은 흐름 그림: 네 변에서 정확히 0 → 네모 경계 없음 */
body.key .art2{flex:1 1 auto;height:auto;object-position:center bottom;margin:clamp(10px,2.4vh,26px) 0 clamp(10px,2vh,24px);   /* 열쇠 그림(비밀번호 화면)은 17차 배치 그대로 */
  -webkit-mask-image:radial-gradient(52% 49% at 50% 46%,#000 40%,rgba(0,0,0,0) 90%);
  mask-image:radial-gradient(52% 49% at 50% 46%,#000 40%,rgba(0,0,0,0) 90%)}
.art2{display:none}
body.key .art{display:none}
body.key .art2{display:block}
.wash{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(42% 34% at 50% 44%,rgba(193,37,84,.09),transparent 70%),
  linear-gradient(180deg,#fff 0%,rgba(255,255,255,0) 18%,rgba(255,255,255,0) 66%,#fff 92%)}
.brand{position:relative;z-index:3;flex:none;display:flex;align-items:flex-end;gap:12px}
.wm{width:136px;height:34px;display:block}
.brand span{font-size:12.5px;color:var(--muted);letter-spacing:.02em;padding-bottom:3px;
  border-left:1px solid var(--line);padding-left:12px}
/* 18차(현장 혹평: '글이 너무 많고 그림으로 기능이 연상되지 않는다', GPT 시안 115): 제목 한 줄 → 아이콘 4 → 제품 흐름 그림. 설명 문단 없음 */
.pitch{position:relative;z-index:3;flex:none;margin-top:clamp(22px,4.2vh,46px)}
.pitch h1{margin:0;font-size:clamp(26px,2.5vw,40px);line-height:1.3;font-weight:800;letter-spacing:-.8px}
.pitch h1 em{font-style:normal;color:var(--brand)}
.keys{position:relative;z-index:3;flex:none;list-style:none;margin:clamp(16px,2.6vh,26px) 0 0;padding:0;display:flex;flex-wrap:wrap;gap:10px clamp(18px,2.2vw,34px)}
.keys li{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:700;color:#2A303A}
.keys i{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;flex:none}
.keys i svg{width:21px;height:21px}
.keys .k1{background:#FCE8EE;color:#C12554}.keys .k2{background:#E2F3F6;color:#0E7490}.keys .k3{background:#EEEAFB;color:#5B3FB8}.keys .k4{background:#E5F4EC;color:#15803D}
/* 오른쪽 - 로그인 */
.panel{display:flex;align-items:center;justify-content:center;padding:34px 34px 62px;position:relative;background:var(--bg);
  border-left:1px solid var(--line)}
.panel::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(46% 38% at 92% 96%,rgba(193,37,84,.07),transparent 70%)}
.stack{position:relative;z-index:2;width:min(444px,100%);display:flex;flex-direction:column}
.card{position:relative;width:100%;padding:32px 34px 26px;border-radius:20px;background:#fff;border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(16,24,40,.04),0 34px 76px -30px rgba(16,24,40,.20);overflow:hidden}
/* 화면이 움직이는 대신 빛만 흐른다 - 위쪽 띠의 광택, 표시의 옅은 발광, 단추의 스침(2026-09-22) */
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,var(--brand-d) 0%,var(--brand) 26%,#FF89AC 46%,var(--brand) 66%,var(--brand-d) 100%);
  background-size:280% 100%;animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%{background-position:125% 0}58%,100%{background-position:-65% 0}}
@keyframes glow{0%,100%{filter:none}50%{filter:drop-shadow(0 0 7px rgba(193,37,84,.42))}}
@keyframes glint{0%,64%{left:-46%}86%,100%{left:128%}}
.card .head{display:flex;align-items:center;gap:13px;margin-bottom:22px}
.mark{width:44px;height:44px;flex:none;animation:glow 6s ease-in-out infinite}
.card .head img{width:42px;height:42px;border-radius:12px}
.card .head h2{margin:0;font-size:19.5px;letter-spacing:-.3px;font-weight:700}
.card .head small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:2px}
.who{display:flex;align-items:center;gap:10px;line-height:1.55;padding:11px 13px;border-radius:12px;background:#FDF3F6;border:1px solid #F3D9E1;
  font-size:13px;color:#7A2540;margin-bottom:4px}
.who b{font-weight:700}
label{display:block;font-size:12.5px;color:#4B5563;font-weight:600;margin:16px 0 6px;letter-spacing:.01em}
.field{position:relative;display:flex;align-items:center}
.field svg{position:absolute;left:13px;width:17px;height:17px;pointer-events:none}
.field input[type=email],.field input[type=password],.field input[type=text]{padding-left:40px}   /* 아이콘이 있는 칸만 안쪽 여백(뒤에 오는 기본 규칙에 지지 않도록 선택자를 더 좁게) */
input[type=email],input[type=password],input[type=text]{width:100%;padding:12.5px 14px;border-radius:11px;font:inherit;font-size:14.5px;
  color:var(--ink);background:#fff;border:1px solid var(--field);transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#A8B0BC}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3.5px rgba(193,37,84,.20)}
input:-webkit-autofill{-webkit-text-fill-color:var(--ink);-webkit-box-shadow:0 0 0 40px #fff inset}
.eye{position:absolute;right:7px;background:none;border:0;color:#7A8493;font-size:12px;cursor:pointer;padding:7px 9px;border-radius:8px}
.eye:hover{background:#F1F3F6;color:var(--ink)}
.btn{margin-top:22px;width:100%;padding:13.5px;border:0;border-radius:11px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;color:#fff;
  background:linear-gradient(97deg,var(--brand-d),var(--brand) 52%,var(--brand-l));
  box-shadow:0 10px 24px -8px rgba(193,37,84,.55);transition:filter .15s,box-shadow .2s,transform .1s;
  display:block;text-align:center;text-decoration:none;position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:-60%;bottom:-60%;left:-46%;width:34%;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.45),rgba(255,255,255,0));
  transform:skewX(-18deg);animation:glint 6s ease-in-out infinite}
.btn:hover{filter:brightness(1.07);box-shadow:0 14px 30px -8px rgba(193,37,84,.6)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.62;cursor:progress}
.note{color:var(--muted);font-size:12.5px;line-height:1.7;margin:13px 0 0}
.note code{font-family:Consolas,monospace;background:#F3F4F7;border:1px solid #E7E9EE;padding:1px 6px;border-radius:5px;color:#7A2540}
.hint{display:block;margin:0 0 4px;padding:11px 13px;border-radius:11px;font-size:12.8px;line-height:1.6;color:#7A2540;
  background:#FDF3F6;border:1px solid #F3D9E1;border-left:3px solid var(--brand)}
.err{margin:0 0 4px;padding:11px 13px;border-radius:11px;background:#FEF3F2;border:1px solid #FCC9C4;border-left:3px solid var(--bad);
  color:#912018;font-size:13px;line-height:1.6}
.ok{margin:0 0 4px;padding:11px 13px;border-radius:11px;background:#ECFDF3;border:1px solid #BBE7CE;color:#08573A;font-size:13px}
.alt{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
  gap:12px;font-size:12px;color:var(--muted)}
.alt a{color:var(--brand);text-decoration:none;font-weight:600;white-space:nowrap}
.alt a:hover{text-decoration:underline}
.caps{display:none;color:#8A5A00;background:#FFFAEB;border:1px solid #F5E1A4;border-radius:9px;padding:7px 10px;font-size:12px;margin-top:9px}
.caps.on{display:block}
.seal{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;font-size:12.5px;color:#5A6472;cursor:help}
.seal svg{width:15px;height:15px;color:#8A93A0}
.foot{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:12px;color:#7C8593;z-index:2}
@media (max-width:1040px){
  .stage{grid-template-columns:minmax(0,1fr);height:auto;min-height:100vh;overflow:auto}   /* 18차: 1fr 은 글 최소 폭(400px)까지 늘어 375 화면 오른쪽이 잘렸다 */
  body{overflow:auto}
  .visual{padding:26px 20px 20px}
  .art{flex:none;width:100%;max-width:260px;margin:6px auto 0;display:block}   /* GPT 117 P2-02: 그림이 로그인 칸을 화면 밖으로 밀지 않게 */
  .art2{display:none}body.key .art{display:none}   /* 18차: 위 .art{display:block} 이 열쇠 그림까지 켜던 것 — 좁은 화면에서 그림 두 장이 겹쳐 떴다 */
  body.key .art2{display:block;flex:none;width:58%;max-width:250px;margin:6px auto 2px}
  .wash{background:radial-gradient(58% 30% at 50% 40%,rgba(193,37,84,.09),transparent 72%)}
  .pitch h1{font-size:23px}
  .keys{gap:8px 16px;margin-top:12px}.keys li{font-size:13px}.keys i{width:32px;height:32px}
  .panel{border-left:0;border-top:1px solid var(--line);padding:24px 18px 46px}
}
@media (prefers-reduced-motion:reduce){.card::before,.btn::after,.mark{animation:none}
  .card::before{background:var(--brand)}}
@media (forced-colors:active){   /* 윈도우 고대비: 그림자·그라데이션이 지워져도 경계와 포커스가 남는다 */
  .card{border:1px solid CanvasText}
  .btn{border:2px solid ButtonText;forced-color-adjust:none;background:ButtonFace;color:ButtonText}
  .btn::after,.card::before{display:none}
  input:focus{outline:3px solid Highlight;outline-offset:1px}
  .art{display:none}
}
</style></head>
