- code: MSSQL-823
  severity: critical
  category: hardware
  title: OS 반환 물리 I/O 오류
  immediate:
  - "손상 의심 페이지 확인: `SELECT * FROM msdb.dbo.suspect_pages;` 와 ERRORLOG 823 줄의 파일·오프셋·Operating system error 번호 기록 (읽기 전용)"
  - "같은 시각 디스크 오류 확인: `Get-WinEvent -FilterHashtable @{LogName='System'; Level=2} -MaxEvents 50` 에서 disk·storport·Ntfs 이벤트"
  - "마지막 정상 백업 시각(msdb.dbo.backupset) 확인 후 인프라팀에 스토리지 점검 요청"
  short:
  - "(2차·승인 후) 업무 외 시간 `DBCC CHECKDB(<db>) WITH NO_INFOMSGS, ALL_ERRORMSGS`(대량 I/O)로 손상 범위 확인, 손상 시 페이지/전체 복원 — 롤백: 복원 전 현재 파일·로그 백업 보관"
  mid:
  - "디스크·컨트롤러·드라이버 교체 후 SQLIOSim 으로 I/O 경로 검증"
  long:
  - "스토리지 이중화와 suspect_pages·823/824 경보, PAGE_VERIFY CHECKSUM 유지"
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/ko-kr/sql/relational-databases/errors-events/mssqlserver-823-database-engine-error?view=sql-server-ver17)
  note: 저장장치·하드웨어·드라이버·파일시스템 등 원인 가능
  vendor_cause: 스토리지/I/O 경로의 하드웨어·드라이버 문제, 파일시스템 불일치 또는 DB 파일 손상으로 OS I/O가 실패함
  vendor_action: suspect_pages와 Windows 로그를 확인하고 DBCC CHECKDB·SQLIOSim을 수행하며 하드웨어·드라이버 상태를 점검
  vendor_url: https://learn.microsoft.com/ko-kr/sql/relational-databases/errors-events/mssqlserver-823-database-engine-error?view=sql-server-ver17
  versions:
  - SQL Server 2005
  - SQL Server 2008/2008 R2
  - SQL Server 2012
  - SQL Server 2014
  - SQL Server 2016
  - SQL Server 2017
  - SQL Server 2019
  - SQL Server 2022
  - SQL Server 2025
  version_note: 'Msg 번호·Severity·State 체계는 2005~2025 동일 — ERRORLOG ''YYYY-MM-DD hh:mm:ss.nn spidNN Error: n, Severity: n, State: n.'' 형식 공통'
- code: MSSQL-824
  severity: critical
  category: storage
  title: 일관성 기반 논리 I/O 오류
  immediate:
  - "손상 페이지 확인: `SELECT * FROM msdb.dbo.suspect_pages;` 와 ERRORLOG 824 줄의 DB·파일·페이지 ID·기대/실제 checksum 기록 (읽기 전용)"
  - "같은 시각 디스크·드라이버 오류: `Get-WinEvent -FilterHashtable @{LogName='System'; Level=2} -MaxEvents 50`, 마지막 정상 백업 시각(msdb.dbo.backupset) 확인"
  short:
  - "(2차·승인 후) 업무 외 시간 `DBCC CHECKDB(<db>) WITH NO_INFOMSGS, ALL_ERRORMSGS`(대량 I/O)로 손상 범위 확인 후 페이지 복원(`RESTORE DATABASE … PAGE=`) 또는 전체 복원 — 롤백: 작업 전 꼬리 로그 백업 보관"
  mid:
  - "스토리지 진단·교체와 SQLIOSim 으로 I/O 경로 검증"
  long:
  - 페이지 검증(CHECKSUM) 표준화
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/ko-kr/sql/relational-databases/errors-events/mssqlserver-824-database-engine-error?view=sql-server-ver17)
  note: 논리 I/O 무결성 오류이므로 hardware로 한정 불가
  vendor_cause: 디스크·펌웨어·드라이버 등 I/O 하위시스템 문제나 파일시스템 불일치·DB 파일 손상으로 논리 검증에 실패함
  vendor_action: DBCC CHECKDB를 실행하고 PAGE_VERIFY CHECKSUM을 활성화하며 OS·스토리지 로그와 하드웨어·드라이버를 점검
  vendor_url: https://learn.microsoft.com/ko-kr/sql/relational-databases/errors-events/mssqlserver-824-database-engine-error?view=sql-server-ver17
  versions:
  - SQL Server 2005
  - SQL Server 2008/2008 R2
  - SQL Server 2012
  - SQL Server 2014
  - SQL Server 2016
  - SQL Server 2017
  - SQL Server 2019
  - SQL Server 2022
  - SQL Server 2025
  version_note: 'Msg 번호·Severity·State 체계는 2005~2025 동일 — ERRORLOG ''YYYY-MM-DD hh:mm:ss.nn spidNN Error: n, Severity: n, State: n.'' 형식 공통'
