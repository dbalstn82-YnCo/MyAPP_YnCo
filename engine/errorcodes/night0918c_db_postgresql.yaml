codes:
- code: 08004
  severity: error
  category: connection
  title: 서버가 연결 거부
  immediate:
  - "서버 로그의 같은 시각 FATAL 줄과 클라이언트 주소 기록: `grep FATAL <로그 파일> | tail -30` (로그 위치는 `SHOW log_directory;`, 10+ `SELECT pg_current_logfile();`) (읽기 전용)"
  - "접속 규칙 확인: `SELECT line_number, type, database, user_name, address, auth_method FROM pg_hba_file_rules;` (10+, superuser) — 출처 IP 와 대조"
  short:
  - "(2차·승인 후) 필요한 출처만 pg_hba.conf 규칙 추가 후 `SELECT pg_reload_conf();` — 롤백: 수정 전 pg_hba.conf 백업, 성공: 접속 재개·pg_hba_file_rules 의 error 컬럼 NULL"
  mid:
  - "pg_hba.conf 규칙 표준(출처 대역·인증 방식) 정비"
  long:
  - "접속 거부 출처 감시와 pg_hba.conf 형상 관리"
  vendor_cause: 서버가 연결 수립을 거부했음을 뜻하는 연결 예외 분류(sqlserver_rejected_establishment_of_sqlconnection). 접속 허용 규칙·서버 상태·프로토콜 문제로 연결이 거부된 경우에 보고된다.
  verify_note: "미검증 — PostgreSQL 부록 A 의 조건명은 확인했으나 서버가 08004 를 내는 구체 상황(서버 자체 보고인지 드라이버 보고인지)은 확인 못 함"
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://www.postgresql.org/docs/current/errcodes-appendix.html)
  versions:
