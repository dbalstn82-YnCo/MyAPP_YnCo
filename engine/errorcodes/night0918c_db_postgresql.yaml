- code: 25P03
  severity: warn
  category: connection
  title: idle-in-transaction 세션 타임아웃 종료
  immediate:
  - "서버 로그의 terminating connection due to idle-in-transaction timeout 줄과 사용자·애플리케이션 기록 (읽기 전용)"
  - "현재 유휴 트랜잭션: `SELECT pid, usename, application_name, now()-state_change AS idle, LEFT(query,80) FROM pg_stat_activity WHERE state='idle in transaction' ORDER BY idle DESC;` 와 `SHOW idle_in_transaction_session_timeout;` (9.6+)"
  short:
  - "(2차) 애플리케이션의 커밋·롤백 누락 경로 수정, 커넥션 풀 반환 전 트랜잭션 종료 확인 — 운영 반영은 승인 후"
  mid:
