- code: '23502'
  severity: warn
  category: internal
  title: NOT NULL 위반
  immediate:
  - "서버 로그의 null value in column … violates not-null constraint 줄의 컬럼·테이블과 DETAIL 의 실패 행 기록 (읽기 전용)"
  - "컬럼 기본값 확인: `SELECT column_name, is_nullable, column_default FROM information_schema.columns WHERE table_name='<table>';`"
  short:
  - "(2차·승인 후) 애플리케이션 입력값 보강 또는 컬럼 기본값 설정(`ALTER TABLE <table> ALTER COLUMN <col> SET DEFAULT <값>`) — 롤백: DROP DEFAULT 문 준비"
  mid:
  - "스키마 변경과 애플리케이션 배포 순서 표준"
  long:
  - "데이터 품질 검증과 23502 발생 감시"
  vendor_cause: NOT NULL 컬럼에 NULL 을 넣거나 NULL 로 갱신하려 해 거부된 경우(not_null_violation). 애플리케이션의 값 누락·기본값 미정의·스키마 변경 후 앱 미반영이 흔한 원인이다.
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://www.postgresql.org/docs/current/errcodes-appendix.html)
