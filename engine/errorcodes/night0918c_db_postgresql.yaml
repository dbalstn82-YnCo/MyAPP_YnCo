- code: '42883'
  severity: error
  category: internal
  title: 함수가 존재하지 않음
  immediate:
  - "서버 로그의 function …(인자형) does not exist 줄과 HINT 기록 (읽기 전용)"
  - "후보 함수 확인: `SELECT n.nspname, p.proname, pg_get_function_identity_arguments(p.oid) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE p.proname='<func>';` 와 `SHOW search_path;`"
  short:
  - "(2차·승인 후) SQL 에 명시적 형 변환(::형식) 추가 또는 누락 함수·확장 배포(`CREATE EXTENSION <ext>`) — 롤백: 배포 전 스키마 덤프(`pg_dump -s`)"
  mid:
  - "배포 순서(함수·확장 → 애플리케이션) 정립"
  long:
  - "스키마 변경 관리와 환경 간 함수 목록 비교"
  vendor_cause: 호출한 이름·인자 형식에 맞는 함수(또는 연산자)가 없는 경우(undefined_function). 인자 형식 불일치(암묵 형 변환 없음), 확장 미설치, search_path 밖 스키마의 함수 호출이 흔한 원인이다.
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://www.postgresql.org/docs/current/errcodes-appendix.html)
  versions:
