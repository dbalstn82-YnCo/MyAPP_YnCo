  - "기존 객체 확인: `SELECT n.nspname, c.relname, c.relkind FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE c.relname='<name>';` — 인덱스·뷰 등 같은 이름 관계 포함"
