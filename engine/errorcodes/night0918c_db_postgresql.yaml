- code: '23503'
  severity: warn
  category: internal
  title: 외래 키 위반
  immediate:
  - "서버 로그의 violates foreign key constraint 줄의 제약 이름과 DETAIL(Key … is not present / is still referenced) 기록 (읽기 전용)"
  - "제약 정의 확인: `SELECT conname, conrelid::regclass, confrelid::regclass FROM pg_constraint WHERE conname='<제약명>';`"
  short:
  - "(2차·승인 후) 입력·삭제 순서 수정, 데이터 보정은 대상 행을 백업 테이블로 복사한 뒤 실행 — 롤백: 백업 테이블에서 원복"
  mid:
  - "애플리케이션 입력 검증과 ON DELETE 정책(RESTRICT·CASCADE) 검토"
  long:
  - "외래 키 위반 건수 감시와 데이터 정합성 점검"
  vendor_cause: 참조 테이블에 없는 키를 넣거나 아직 참조되는 부모 행을 삭제·변경하려 해 외래 키 제약을 위반한 경우(foreign_key_violation). 입력 순서 오류·부모 행 선삭제가 흔한 원인이다.
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://www.postgresql.org/docs/current/errcodes-appendix.html)
  versions:
