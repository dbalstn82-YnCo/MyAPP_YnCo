- code: '25006'
  severity: error
  category: internal
  title: 읽기 전용 트랜잭션에서 쓰기
  immediate:
  - "접속한 서버가 대기 서버인지 확인: `SELECT pg_is_in_recovery();` — true 면 standby 로 쓰기가 라우팅된 것 (읽기 전용)"
  - "`SHOW default_transaction_read_only;` · `SHOW transaction_read_only;` 와 접속 문자열(target_session_attrs 등) 확인"
  short:
  - "(2차·승인 후) 쓰기 요청을 primary 로 라우팅하도록 접속 설정 수정(libpq target_session_attrs=read-write, 10+) — 롤백: 이전 접속 설정 보관"
  mid:
  - "읽기/쓰기 분리 라우팅(프록시·데이터소스) 구성 정비"
  long:
  - "HA 전환 후 접속 대상 검증 절차와 25006 감시"
  vendor_cause: 읽기 전용 트랜잭션에서 쓰기 문장을 실행해 거부된 경우(read_only_sql_transaction). 대기 서버(hot standby)로 쓰기 요청이 간 경우, default_transaction_read_only 설정, 앱의 읽기 전용 트랜잭션 지정이 흔한 원인이다.
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://www.postgresql.org/docs/current/errcodes-appendix.html)
  versions:
