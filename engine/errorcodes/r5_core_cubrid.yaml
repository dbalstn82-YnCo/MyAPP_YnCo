  vendor_cause: "ER_NET_CANT_CONNECT_SERVER — 지정한 호스트의 DB 서버에 접속할 수 없음. DB 서버(cub_server) 미기동, cub_master 포트(cubrid_port_id) 차단, 호스트 이름 해석 실패가 흔한 원인."
  vendor_url: https://github.com/CUBRID/cubrid/blob/develop/src/base/error_code.h
  immediate:
  - "DB 서버에서 `cubrid server status` 와 `ps -ef | grep -E \"[c]ub_master|[c]ub_server\"` 로 대상 DB 서버 기동 여부 확인"
  - "`grep -E \"^cubrid_port_id\" $CUBRID/conf/cubrid.conf` 로 포트를 확인하고 접속 측에서 `nc -zvw3 <server> <port>` 와 `getent hosts <server>` 로 도달·이름 해석 확인"
  short:
  - "(2차·승인 후, 롤백: 기동 전 상태·로그 보관) 서버가 내려가 있으면 원인(.err 로그) 확인 후 `cubrid server start <db>`, 방화벽이면 포트 허용 요청"
  mid:
  - "접속 실패 시각과 서버 기동·중지 이력을 대조하고 HA 구성이면 절체 이력 확인"
  long:
  - "cub_server 프로세스·포트 생존 감시를 등록하고 접속 실패 건수 임계 경보 운영"
  versions:
  - CUBRID 10.2
  - CUBRID 11.0
  - CUBRID 11.2
  - CUBRID 11.3
  - CUBRID 11.4
  version_note: error_code.h 의 번호·ER_ 이름이 v10.2.16~v11.4·develop 에서 동일, cubrid_port_id 는 11.4 매뉴얼 control 기준. 10.1 이하는 미대조
  source: "공식 문서 대조(2026-10-16 5차 보강)"
- code: '-195'
  severity: error
  category: connection
  title: 서버 통신 오류
  vendor_cause: "ER_NET_SERVER_COMM_ERROR — 클라이언트(CAS 등)와 DB 서버 사이 통신 중 오류가 발생함(메시지에 세부 사유). 서버 프로세스 비정상 종료·재기동, 네트워크 순단, 장시간 유휴 연결의 방화벽 끊김이 흔한 원인."
  vendor_url: https://github.com/CUBRID/cubrid/blob/develop/src/base/error_code.h
  immediate:
  - "`cubrid server status` 와 `ps -ef | grep -E \"[c]ub_server\"` 로 서버 생존·기동 시각 확인, `ls -lt $CUBRID/log/server/ | head` 로 같은 시각 서버 오류 로그 확인"
  - "`cubrid broker status -f` 로 CAS 상태·대기 확인(읽기 전용) — 여러 CAS 에서 동시 발생이면 서버 측, 일부면 네트워크·방화벽 측"
  short:
  - "(2차·승인 후, 롤백: 재시작 전 broker 상태 출력 보관) 서버가 정상이면 영향 받은 브로커만 `cubrid broker reset <broker>` 로 연결 재설정(`cubrid broker restart` 는 전체 브로커 재시작이라 일정 협의 필요), 서버 비정상 종료면 core·.err 확보 후 재기동"
  mid:
  - "통신 오류 시각을 서버 재기동·네트워크 장비 로그와 대조하고 방화벽 세션 유지 시간과 연결 유휴 시간 정합"
  long:
  - "CAS·서버 통신 오류 건수 감시 임계 등록, 서버 비정상 종료 시 core 자동 수집 설정"
  versions:
