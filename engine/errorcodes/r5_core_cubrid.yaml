  - "SQL 로그가 켜져 있으면 `grep -n \"<SQL 일부>\" $CUBRID/log/broker/sql_log/<broker>_<n>.sql.log | tail -10` 으로 실제 전달된 문장 확인 — 배포 직후 급증이면 배포 담당에 즉시 공유"
