  - CUBRID 11.0
  - CUBRID 11.2
  - CUBRID 11.3
  - CUBRID 11.4
  version_note: error_code.h 의 번호·ER_ 이름이 v10.2.16~v11.4·develop 에서 동일. 10.1 이하는 미대조
  source: "공식 문서 대조(2026-10-16 5차 보강)"
