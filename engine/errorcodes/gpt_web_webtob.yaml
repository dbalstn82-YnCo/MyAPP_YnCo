  - '`grep -n -B5 "COM_0" <오류로그> | tail -40` 로 바로 앞 줄의 선행 오류 코드(CONN_·DST_·RSC_) 확인 — 선행 코드가 실제 원인, 없으면 응답 코드별로 판단 (WebtoB 5/6)'
  short:
