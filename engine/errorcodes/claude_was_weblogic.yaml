  severity: info
  category: internal
  title: 서버 상태 변경
  immediate:
  - '`grep -n "BEA-000365" <DOMAIN_HOME>/servers/<server>/logs/<server>.log | tail -20` 으로 상태 전이 순서(STARTING→STANDBY→ADMIN→RESUMING→RUNNING, SUSPENDING→SHUTTING_DOWN→SHUTDOWN, FAILED) 확인 — RUNNING 으로 끝나면 정상'
  - FAILED·FORCE_SHUTTING_DOWN 이 보이면 같은 시각 `grep -nE "<(Critical|Emergency)>" <DOMAIN_HOME>/servers/<server>/logs/<server>.log | tail -20` 으로 원인 메시지 확인, 계획 작업(배포·정기 점검) 이력과 대조
  short:
  - 계획되지 않은 SHUTDOWN/FAILED 전이면 원인 메시지(BEA-000362·000383·000386) 항목 조치로 넘기고 Node Manager 로그(`<DOMAIN_HOME>/nodemanager/nodemanager.log`, 10.3.6 은 `<WL_HOME>/common/nodemanager/nodemanager.log`)의 자동 기동 이력 확인
  mid:
