  - '기동 환경의 `echo $LD_LIBRARY_PATH`(AIX: `echo $LIBPATH`)와 `ls <WL_HOME>/server/native/` 하위 플랫폼 디렉터리 확인 — 서버는 Java I/O 로 계속 동작하므로 영향은 처리량 저하 여부로 판단'
  short:
