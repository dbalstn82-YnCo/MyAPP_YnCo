  severity: info
  category: thread
  title: 정지 스레드 정상 복귀
  immediate:
  - '`grep -nE "BEA-000337|BEA-000339" <DOMAIN_HOME>/servers/<server>/logs/<server>.log | tail -20` 로 같은 스레드(ExecuteThread 번호)의 STUCK(BEA-000337) 시각과 복귀(BEA-000339) 시각을 짝지어 정지 시간 확인 — 짝이 맞고 재발이 없으면 일시 지연으로 판단'
  - WLST(`java weblogic.WLST` → `connect(url='t3://<admin_host>:<port>')`, 자격증명은 프롬프트 입력) 에서 `domainRuntime()` → `cd('ServerRuntimes/<server>/ThreadPoolRuntime/ThreadPoolRuntime')` → `ls()` 로 HoggingThreadCount·StuckThreadCount(버전에 따라 없을 수 있음)·QueueLength 확인 — 0·평소 수준이면 정상 복귀
  short:
  - 같은 스레드가 STUCK→unstuck 을 반복하면 BEA-000337 직후 스택의 정지 지점(JDBC·소켓 read·synchronized 대기)을 모아 DB·연동 담당에 전달
  mid:
  - 반복 지연 구간에 JDBC Statement Timeout·외부 호출 read timeout 설정, 지연 업무를 별도 Work Manager(max-threads-constraint)로 격리
  long:
  - StuckThreadCount·HoggingThreadCount 를 WLDF Watch 또는 감시 도구로 임계(Stuck>0 5분 지속) 경보 등록
  source: GPT 수집·벤더 문서 대조 완료(https://docs.oracle.com/en/middleware/fusion-middleware/12.2.1.4/fmerr/bea-000001-bea-2194843.html)
  note: 공식 메시지는 stuck 상태였던 스레드가 다시 사용 가능해졌다는 알림이므로 info가 타당함
  vendor_cause: 이전에 stuck 상태였던 스레드가 다시 사용 가능한 상태로 복귀함
