- code: BEA-000362
  severity: critical
  category: internal
  title: 서버 시작 실패
  immediate:
  - '`grep -nE "<(Critical|Error|Emergency)>" <DOMAIN_HOME>/servers/<server>/logs/<server>.log | tail -30` 으로 BEA-000362 직전의 첫 오류(근본 원인)와 Reason 문구 확인'
  - WLST(`java weblogic.WLST` → `connect(url='t3://<admin_host>:<port>')`, 자격증명은 프롬프트 입력) 에서 `state('<server>')` 또는 `ps -ef | grep "weblogic.Name=<server>" | grep -v grep` 으로 상태·프로세스 확인 — FAILED·프로세스 없음이면 서버 장애로 즉시 보고
  short:
  - '(2차·승인 후, 롤백: 변경 전 config.xml 사본) 근본 원인(설정·포트·boot.properties·라이브러리) 수정 뒤 Node Manager 또는 `startManagedWebLogic.sh <server> t3://<admin_host>:<port>` 로 기동, BEA-000365 RUNNING 확인'
  mid:
  - 기동 전 점검표(포트 점유 `ss -ltn`, 디스크 여유, config.xml 변경 이력)와 Node Manager CrashRecoveryEnabled·RestartMax 정책 정비
  long:
  - ServerRuntime State≠RUNNING 감시 경보와 config.xml 형상 관리(변경 승인·백업) 체계화
  source: GPT 수집·벤더 문서 대조 완료(https://docs.oracle.com/en/middleware/fusion-middleware/12.2.1.4/fmerr/bea-000001-bea-2194843.html)
  vendor_cause: 서버가 FAILED 로 전이해 서비스를 멈췄음을 알리는 Critical 메시지 — Reason 문구와 직전 오류가 근본 원인이며 설정(config.xml) 오류·포트 충돌·보안 초기화 실패·필수 하위시스템 실패가 흔한 원인이다.
