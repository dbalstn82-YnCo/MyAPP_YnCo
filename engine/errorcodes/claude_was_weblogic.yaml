  vendor_cause: 네이티브 Performance Pack(muxer 라이브러리)을 로드하지 못해 Java I/O 로 대체 동작함 — 라이브러리 경로(LD_LIBRARY_PATH·LIBPATH) 누락이나 OS·아키텍처·JDK 비트 수 불일치가 흔한 원인이다.
