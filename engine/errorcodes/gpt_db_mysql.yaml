  - "대상 테이블: `SELECT TABLE_SCHEMA, TABLE_NAME, ENGINE, ROUND((DATA_LENGTH+INDEX_LENGTH)/1024/1024) AS mb, DATA_FREE FROM information_schema.TABLES WHERE TABLE_NAME = '<table>';` — MEMORY 엔진이면 max_heap_table_size, 내부 임시 테이블이면 tmp_table_size(8.0 TempTable 은 temptable_max_ram) 한도"
