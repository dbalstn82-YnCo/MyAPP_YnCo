- code: MY-1158
  severity: error
  category: connection
  title: 통신 패킷 읽기 오류
  immediate:
  - "발생 분포: `SHOW GLOBAL STATUS LIKE 'Aborted_%';` 와 `grep -n 'Got an error reading communication packets' <오류 로그 경로> | tail -30` — 특정 user·host 에 몰리면 그 클라이언트 원인 (읽기 전용)"
