- code: MY-1159
  severity: error
  category: connection
  title: 통신 패킷 읽기 시간초과
  immediate:
  - "읽기 한도 — 서버 기본값과 실패 세션 값은 다를 수 있다: `SHOW GLOBAL VARIABLES LIKE 'net_read_timeout';` 는 새 연결의 기본값일 뿐이고 클라이언트·커넥터가 세션 값을 바꿨을 수 있으므로 커넥터 설정(JDBC URL·풀 초기화 SQL 의 SET SESSION 등)을 확인하고, 가능하면 같은 애플리케이션 풀의 연결에서 `SHOW SESSION VARIABLES LIKE 'net_read_timeout';`, DBA 쪽에서는 `SELECT * FROM performance_schema.variables_by_thread WHERE VARIABLE_NAME = 'net_read_timeout';`(5.7+, 지금 붙어 있는 연결만) — 대용량 전송(LOAD DATA·대량 INSERT·BLOB) 중 클라이언트가 그 세션 값(초) 넘게 다음 데이터를 보내지 못하면 이 오류 (읽기 전용)"
  - "추세·출처: `SHOW GLOBAL STATUS LIKE 'Aborted_%';` 를 1~5분 간격 2회 읽은 차이는 '끊김이 늘고 있는가'의 추세일 뿐 1159 건수가 아니다(기동 이후 누적값이며 다른 사유의 끊김도 함께 센다) · 건수와 출처는 `grep -n 'Got timeout reading communication packets' <오류 로그 경로> | tail -30` 의 user·host 분포로 — 특정 클라이언트에 몰리면 그 클라이언트·구간 지연 (8.0+ 는 log_error_verbosity=3 일 때만 기록, 끊긴 연결은 PROCESSLIST 에 남지 않음)"
  - "가르기: 같은 'Got timeout reading communication packets' 문구는 유휴 연결이 wait_timeout(대화형은 interactive_timeout) 만료로 끊길 때도 남는다(MySQL 작업 기록 WL#12999 — 이때 클라이언트는 다음 사용에서 2013/2006 을 받음) → 끊긴 연결이 전송 중이었는지 유휴였는지를 클라이언트 로그로 가른다 · max_allowed_packet 초과는 다른 오류(1153 ER_NET_PACKET_TOO_LARGE, 'Got a packet bigger than max_allowed_packet')이므로 1159 의 원인으로 보지 않는다"
