  - '`Select-String -Path "$env:SystemRoot\System32\LogFiles\HTTPERR\httperr*.log" -Pattern "Timer_ConnectionIdle" | Measure-Object` 로 건수 확인 — 평소 수준이면 정상 정리(장애 아님)'
  - '건수가 급증하면 c-ip 상위 목록을 뽑아 LB·내부 장비인지 외부 다수인지 구분'
  short:
  - '(2차) LB 의 백엔드 Keep-Alive 유휴 시간을 IIS connectionTimeout 보다 짧게 맞추도록 네트워크 담당과 협의(변경은 승인 후)'
  mid:
  - '사이트 limits connectionTimeout 과 LB 유휴 타임아웃 정렬 기준 수립'
  long:
  - 'Timer_ConnectionIdle 건수 기준선 감시'
  vendor_cause: 'HTTP.sys(HTTPERR) 사유 Timer_ConnectionIdle — 연결이 유휴 상태로 ConnectionTimeout(기본 2분)을 넘겨 HTTP.sys 가 닫았다. Keep-Alive 연결을 열어 두고 요청을 보내지 않는 클라이언트·LB 의 정상 동작인 경우가 많고, 대량이면 연결 고갈형 공격을 의심한다.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - IIS 6.0 (2003)
  - IIS 7.0/7.5 (2008/R2)
  - IIS 8.0/8.5 (2012/R2)
  - IIS 10.0 (2016~2025)
  version_note: HTTP.sys 오류 로그(HTTPERR) 사유 문구 — 2003(IIS 6.0)부터 동일
- code: IIS-HTTPERR-CONNECTION-ABANDONED
  severity: error
  category: thread
  title: 워커 프로세스 요청 포기
  immediate:
  - '`Select-String -Path "$env:SystemRoot\System32\LogFiles\HTTPERR\httperr*.log" -Pattern "Connection_Abandoned" | Select-Object -Last 20` 로 발생 시각·앱 풀(s-queuename) 확인'
  - '같은 시각 WAS 5009·5011·5002 와 Application 1000 이벤트 확인 — 동반이면 워커 충돌'
  short:
  - '(2차) 워커 충돌이면 DebugDiag 덤프 수집 후 분석 의뢰, 재활용 시각과 겹치면 재활용 설정(overlap·야간 예약) 조정을 승인 후 적용'
  mid:
  - '충돌 원인 코드 수정과 재활용 정책 표준화'
  long:
  - 'Connection_Abandoned 건수 경보'
  vendor_cause: 'HTTP.sys(HTTPERR) 사유 Connection_Abandoned_By_AppPool·Connection_Abandoned_By_ReqQueue — 대기 중인 요청을 처리하던 앱 풀 워커 프로세스가 충돌했거나 핸들을 닫아 요청이 버려졌다. w3wp 충돌·재활용·앱 풀 중지가 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - IIS 6.0 (2003)
  - IIS 7.0/7.5 (2008/R2)
  - IIS 8.0/8.5 (2012/R2)
  - IIS 10.0 (2016~2025)
  version_note: HTTP.sys 오류 로그(HTTPERR) 사유 문구 — 2003(IIS 6.0)부터 동일
- code: IIS-HTTPERR-QUEUEFULL
  severity: critical
  category: capacity
  title: 커널 요청 큐 가득참
  immediate:
  - '`Get-Counter "\HTTP Service Request Queues(*)\CurrentQueueSize" -SampleInterval 5 -MaxSamples 3` 로 큐 적체 앱 풀 확인'
  - '`%windir%\system32\inetsrv\appcmd list requests /elapsed:10000` 로 10초 이상 걸리는 요청 URL 확인 — 다수면 처리 지연이 원인'
  short:
  - '(2차) 지연 원인(DB 잠금·외부 API) 담당에 통보, 폭주면 출처 제한을 승인 후 적용 — queueLength 상향은 지연 해소 뒤 판단(롤백: 이전 값)'
  mid:
  - '앱 풀 분리와 queueLength·워커 수 재산정'
  long:
  - 'CurrentQueueSize 가 queueLength 50% 넘으면 경보'
  vendor_cause: 'HTTP.sys(HTTPERR) 사유 QueueFull — 앱 풀 요청 큐가 가득 차(queueLength 기본 1000) HTTP.sys 가 503 으로 거부했다. 워커 처리 지연(백엔드 DB·외부 호출 대기)이나 요청 폭주가 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - IIS 6.0 (2003)
  - IIS 7.0/7.5 (2008/R2)
  - IIS 8.0/8.5 (2012/R2)
  - IIS 10.0 (2016~2025)
  version_note: HTTP.sys 오류 로그(HTTPERR) 사유 문구 — 2003(IIS 6.0)부터 동일
- code: IIS-HTTPERR-APPOFFLINE
  severity: critical
  category: capacity
  title: 앱 풀 오프라인
  immediate:
  - '`%windir%\system32\inetsrv\appcmd list apppool` 로 Stopped 앱 풀 확인, PowerShell `Get-WebAppPoolState -Name <AppPool>` 로도 확인'
  - '`Get-WinEvent -FilterHashtable @{LogName="System"; ProviderName="Microsoft-Windows-WAS"} -MaxEvents 30 | Format-List TimeCreated,Id,Message` 로 5002·5059 등 Stopped 원인 이벤트 확인'
  short:
  - '(2차·승인 후) 원인 이벤트를 조치한 뒤 `%windir%\system32\inetsrv\appcmd start apppool /apppool.name:<AppPool>` 로 시작 — 원인 미해결 재시작 금지'
  mid:
  - '앱 풀 크래시 원인 제거와 Rapid-Fail Protection 설정 검토'
  long:
  - '앱 풀 Stopped 감시와 503 비율 경보'
  vendor_cause: 'HTTP.sys(HTTPERR) 사유 AppOffline·AppPoolTimer·AppShutdown — 503 서비스 불가: 애플리케이션 오류로 앱 풀이 오프라인(빠른 실패 보호로 중지)됐거나, 앱 풀 프로세스가 너무 바빴거나, 관리 정책으로 자동 종료됐다.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - IIS 6.0 (2003)
  - IIS 7.0/7.5 (2008/R2)
  - IIS 8.0/8.5 (2012/R2)
  - IIS 10.0 (2016~2025)
  version_note: HTTP.sys 오류 로그(HTTPERR) 사유 문구 — 2003(IIS 6.0)부터 동일
- code: IIS-HTTPERR-BADREQUEST
  severity: warn
  category: security
  title: 잘못된 요청(커널)
  immediate:
  - '`Select-String -Path "$env:SystemRoot\System32\LogFiles\HTTPERR\httperr*.log" -Pattern "BadRequest" | Select-Object -Last 30` 로 출처 IP·URL 확인'
  - '출처 IP 상위 목록으로 내부 연계 시스템인지 외부 스캔인지 구분 — 외부 다수 시도면 보안 담당 통보'
  short:
  - '(2차) 내부 시스템이면 요청 재현(curl -v)으로 잘못된 형식을 찾아 수정 요청, 공격이면 IP 차단을 승인 후 적용'
  mid:
  - 'WAF 비정상 요청 차단 규칙 정비'
  long:
  - 'BadRequest 건수 추세 감시'
  vendor_cause: 'HTTP.sys(HTTPERR) 사유 BadRequest — 요청을 해석하다 구문 오류가 나 HTTP.sys 가 400 으로 거부하고 연결을 닫았다. 규격에 맞지 않는 클라이언트·잘못된 프록시, 퍼징·스캐너 요청이 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - IIS 6.0 (2003)
  - IIS 7.0/7.5 (2008/R2)
  - IIS 8.0/8.5 (2012/R2)
  - IIS 10.0 (2016~2025)
  version_note: HTTP.sys 오류 로그(HTTPERR) 사유 문구 — 2003(IIS 6.0)부터 동일
- code: IIS-HTTPERR-REQUEST-LENGTH
  severity: warn
  category: capacity
  title: 요청 길이 초과
  immediate:
  - '`Select-String -Path "$env:SystemRoot\System32\LogFiles\HTTPERR\httperr*.log" -Pattern "RequestLength|EntityTooLarge|FieldLength" | Select-Object -Last 20` 로 사유·출처 확인'
  - '`reg query HKLM\System\CurrentControlSet\Services\HTTP\Parameters` 로 MaxRequestBytes·MaxFieldLength 설정 여부 확인(없으면 기본값)'
  short:
  - '(2차·승인 후, 롤백: 레지스트리 내보내기 후 복원) Kerberos 토큰이 원인이면 MaxFieldLength·MaxRequestBytes 를 필요한 만큼 상향 — HTTP 서비스 재시작이 필요해 중단 일정 확보, 상향은 메모리·공격 노출 증가'
  mid:
  - '사용자 그룹 수 정리·쿠키 크기 축소를 담당 부서와 협의'
  long:
  - 'RequestLength 거부 건수 감시'
  vendor_cause: 'HTTP.sys(HTTPERR) 사유 RequestLength·EntityTooLarge·FieldLength — 요청 줄+헤더 합계(MaxRequestBytes 기본 16384바이트)나 헤더 하나(MaxFieldLength 기본 16384바이트), 본문 크기 한도를 넘어 거부했다. 큰 쿠키·Kerberos 토큰(그룹 다수 사용자)이 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - IIS 6.0 (2003)
  - IIS 7.0/7.5 (2008/R2)
  - IIS 8.0/8.5 (2012/R2)
  - IIS 10.0 (2016~2025)
  version_note: HTTP.sys 오류 로그(HTTPERR) 사유 문구 — 2003(IIS 6.0)부터 동일
- code: IIS-HTTPERR-VERB
  severity: warn
  category: security
  title: 허용되지 않은 동사
  immediate:
  - '`Select-String -Path "$env:SystemRoot\System32\LogFiles\HTTPERR\httperr*.log" -Pattern " Verb" | Select-Object -Last 30` 로 cs-method·출처 IP 확인'
  - '알 수 없는 메서드를 여러 IP 가 보내면 스캔으로 분류해 보안 담당에 전달'
  short:
  - '(2차) 공격이면 방화벽·ipSecurity 차단을 승인 후 적용, 정상 연계면 해당 시스템에 메서드 수정 요청'
  mid:
  - '요청 필터링 verbs 허용 목록(GET·POST 등) 정책 수립'
  long:
  - 'Verb 거부 건수 보안 관제 연동'
  vendor_cause: 'HTTP.sys(HTTPERR) 사유 Verb — 요청 메서드(verb)를 해석하다 구문 오류가 나 거부했다. 표준이 아닌 메서드를 보내는 스캐너·공격 도구나 잘못된 클라이언트가 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - IIS 6.0 (2003)
  - IIS 7.0/7.5 (2008/R2)
  - IIS 8.0/8.5 (2012/R2)
  - IIS 10.0 (2016~2025)
  version_note: HTTP.sys 오류 로그(HTTPERR) 사유 문구 — 2003(IIS 6.0)부터 동일
- code: IIS-HTTPERR-HOSTNAME
  severity: warn
  category: internal
  title: 호스트 이름 미매칭
  immediate:
  - '`Select-String -Path "$env:SystemRoot\System32\LogFiles\HTTPERR\httperr*.log" -Pattern "Hostname" | Select-Object -Last 30` 로 출처 IP·URL 확인'
  - '`Get-WebBinding` (WebAdministration) 또는 `%windir%\system32\inetsrv\appcmd list site` 로 사이트 호스트 헤더 바인딩 확인'
  short:
  - '(2차) 정상 업무 장비면 접속 주소(호스트명)를 바인딩에 맞추도록 요청, 바인딩 추가가 필요하면 승인 후(롤백: 바인딩 제거)'
  mid:
  - '호스트 헤더 바인딩 대장 관리와 기본(빈 호스트) 바인딩 정책 정비'
  long:
  - 'Hostname 거부 건수 감시'
  vendor_cause: 'HTTP.sys(HTTPERR) 사유 Hostname — Host 헤더(호스트명)를 해석하다 오류가 나 거부했다. 잘못된 Host 값을 보내는 클라이언트·스캐너가 흔하며, 바인딩과 맞지 않는 호스트로 접속하는 업무 장비도 원인이 될 수 있다.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - IIS 6.0 (2003)
  - IIS 7.0/7.5 (2008/R2)
  - IIS 8.0/8.5 (2012/R2)
  - IIS 10.0 (2016~2025)
  version_note: HTTP.sys 오류 로그(HTTPERR) 사유 문구 — 2003(IIS 6.0)부터 동일
