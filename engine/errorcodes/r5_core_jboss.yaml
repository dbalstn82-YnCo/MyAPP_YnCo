- code: WFLYSRV0021
  severity: error
  category: internal
  title: 배포(deploy) 롤백
  vendor_cause: 배포 "<이름>" 의 배포 작업이 실패해 롤백되었다는 ERROR(Deploy of deployment … was rolled back with the following failure message). 실패 메시지의 WFLYCTL0412(필요 서비스 미설치)·Caused by 예외가 실제 원인이다.
