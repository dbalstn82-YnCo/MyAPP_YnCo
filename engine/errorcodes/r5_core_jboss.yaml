  immediate:
  - "`$JBOSS_HOME/bin/jboss-cli.sh -c '/core-service=management/management-interface=http-interface:read-resource'` 로 http-authentication-factory·security-realm 값이 비었는지 확인(읽기 전용)"
  - "`netstat -an | grep LISTEN | grep ':9990'` 로 관리 포트 바인딩 주소 확인 — 업무망에 열려 있으면 보안 담당에 즉시 통보"
  short:
  - "(2차·승인 후, 롤백: 변경 전 standalone.xml 백업 복원) http-interface 에 http-authentication-factory=management-http-authentication(EAP 7.1+) 또는 security-realm=ManagementRealm(EAP 7.0) 지정 후 reload, 관리 사용자 add-user.sh 로 생성"
  mid:
  - "관리 인터페이스를 관리 전용 주소로 바인딩하고 관리 콘솔 접근을 운영 단말 IP 로 제한"
  long:
  - "구성 점검 스크립트로 관리 인터페이스 인증 설정 유무를 정기 확인"
  versions:
  - JBoss EAP 7.0~7.4 (WildFly 10~23)
  - JBoss EAP 8.0/8.1 (WildFly 28+)
  version_note: EAP 7.3·8.0·WildFly 34 참조에서 같은 문구 확인 — EAP 8.0/WildFly 25+ 는 Elytron 만
  source: 공식 문서 대조(2026-10-16 5차 보강)
