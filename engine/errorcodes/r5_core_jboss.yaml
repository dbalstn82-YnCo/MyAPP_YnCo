  severity: error
  category: security
  title: 감사 로그 연속 실패로 감사 기록 중단
  vendor_cause: 관리 작업 감사 로그 기록이 [N] 회 연속 실패해 감사 로깅을 끈다는 ERROR. 이후 관리 작업이 감사 기록 없이 수행되므로 보안 통제(변경 추적)에 공백이 생긴다.
  vendor_action: ''
  vendor_url: https://access.redhat.com/webassets/avalon/d/red_hat_jboss_enterprise_application_platform/8.0/mgmt_model/log-message-reference.html
  immediate:
  - "`grep -n -E 'WFLYCTL0035|WFLYCTL0036' $JBOSS_HOME/standalone/log/server.log | tail -20` 로 첫 실패 시각과 중단 시각을 기록(기록 공백 구간)"
  - "`$JBOSS_HOME/bin/jboss-cli.sh -c '/core-service=management/access=audit:read-resource(recursive=true,include-runtime=true)'` 로 logger·핸들러 enabled·실패 수 확인, 보안 담당에 공백 구간 통보"
  short:
  - "(2차·승인 후, 롤백: 이전 설정 값) 실패 원인(공간·권한·syslog 수신지)을 고친 뒤 핸들러를 다시 살림 — 핸들러가 지원하는 작업은 `:read-operation-names` 로 확인(recycle 등), 공백 구간의 관리 작업은 server.log·변경 대장으로 보완"
  mid:
  - "감사 로그 핸들러를 파일+원격 syslog 이중화하고 max-failure-count 값을 운영 기준으로 정함"
  long:
  - "감사 로그 중단을 즉시 경보하고 월간 보안 점검에 감사 기록 연속성 확인 포함"
  versions:
  - JBoss EAP 7.0~7.4 (WildFly 10~23)
  - JBoss EAP 8.0/8.1 (WildFly 28+)
  version_note: WFLY* 접두 코드는 WildFly 9/EAP 7.0 이후 — EAP 7.3·8.0·WildFly 34 원문 확인
  source: 공식 문서 대조(2026-10-16 5차 보강)
