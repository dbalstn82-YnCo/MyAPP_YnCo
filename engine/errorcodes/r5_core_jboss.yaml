- code: WFLYSRV0022
  severity: error
  category: internal
  title: 배포 롤백(실패 메시지 없음)
  vendor_cause: 배포 "<이름>" 이 롤백되었지만 실패 메시지가 남지 않았다는 ERROR(Deploy of deployment … was rolled back with no failure message). 같은 작업(배치·복합 작업)의 다른 단계 실패로 함께 롤백된 경우가 많아 앞뒤 로그에서 원인 단계를 찾아야 한다.
  vendor_action: ''
  vendor_url: https://access.redhat.com/webassets/avalon/d/red_hat_jboss_enterprise_application_platform/8.0/mgmt_model/log-message-reference.html
  immediate:
  - "`grep -n -B30 'WFLYSRV0022' $JBOSS_HOME/standalone/log/server.log | grep -E 'ERROR|WFLYCTL|Caused by' | tail -30` 로 같은 작업의 다른 실패 단계 확인"
  - "`$JBOSS_HOME/bin/jboss-cli.sh -c 'deployment-info'` 로 배포 상태 확인, 배포 스캐너 사용 시 `ls -l $JBOSS_HOME/standalone/deployments/ | grep -E 'failed|deployed'` 로 표식 파일 확인"
  short:
