  vendor_url: https://access.redhat.com/webassets/avalon/d/red_hat_jboss_enterprise_application_platform/7.3/mgmt_model/log-message-reference.html
  immediate:
  - "`grep -n -E 'WFLYSRV0026|WFLYCTL0412|WFLYCTL0180|WFLYCTL0186' $JBOSS_HOME/standalone/log/server.log | tail -30` 로 실패·의존성 누락 서비스 수와 이름 기록"
  - "`$JBOSS_HOME/bin/jboss-cli.sh -c '/core-service=management:read-boot-errors'` 로 기동 오류 목록 확인, `$JBOSS_HOME/bin/jboss-cli.sh -c 'deployment-info'` 로 FAILED 배포 확인"
  short:
  - "(2차·승인 후, 롤백: 직전 standalone.xml 백업) 실패 서비스의 원인(데이터소스·포트·모듈)을 고친 뒤 재기동 작업 창에서 정상 기동(WFLYSRV0025) 확인"
  mid:
  - "기동 후 점검에 read-boot-errors 결과 0건 확인을 넣고 구성 변경 시 standalone.xml 백업을 필수화"
  long:
  - "기동 로그에서 WFLYSRV0026 이 나오면 즉시 경보하도록 감시 등록(정상은 WFLYSRV0025)"
  versions:
  - JBoss EAP 7.0~7.4 (WildFly 10~23)
  - JBoss EAP 8.0/8.1 (WildFly 28+)
  version_note: EAP 7.3 참조에 전체 문구, EAP 8.0·WildFly 34 참조는 '%s'(문구를 호출부에서 조립) — 같은 ID
  source: 공식 문서 대조(2026-10-16 5차 보강)
- code: WFLYSRV0034
  severity: warn
  category: security
  title: native 관리 인터페이스 무인증
  vendor_cause: native 관리 서비스에 보안 영역(security realm)이나 SASL 서버 인증이 정의되지 않아 모든 접근이 제한 없이 허용된다는 WARN. native 관리 포트(구성했을 때 보통 9999)로 누구나 서버 구성을 바꿀 수 있는 상태다.
  vendor_action: ''
  vendor_url: https://access.redhat.com/webassets/avalon/d/red_hat_jboss_enterprise_application_platform/8.0/mgmt_model/log-message-reference.html
  immediate:
  - "`$JBOSS_HOME/bin/jboss-cli.sh -c '/core-service=management/management-interface=native-interface:read-resource'` 로 sasl-authentication-factory·security-realm 값이 비었는지 확인(읽기 전용)"
  - "`netstat -an | grep LISTEN | grep -E ':9999|:9990'` 로 관리 포트가 어느 주소에 열려 있는지 확인 — 0.0.0.0·업무 IP 면 보안 담당에 즉시 통보"
  short:
  - "(2차·승인 후, 롤백: 변경 전 standalone.xml 백업 복원) native-interface 에 Elytron sasl-authentication-factory(management-sasl-authentication, EAP 7.1+) 또는 레거시 security-realm=ManagementRealm(EAP 7.0) 지정 후 reload"
  mid:
  - "관리 인터페이스를 관리 전용 네트워크 주소(management interface 바인딩)로 한정하고 방화벽으로 관리 포트 접근 출처 제한"
  long:
  - "기동 로그의 WFLYSRV0034·0035 를 보안 점검 항목으로 등록해 무인증 구성이 운영에 반입되지 않게 함"
  versions:
  - JBoss EAP 7.0~7.4 (WildFly 10~23)
  - JBoss EAP 8.0/8.1 (WildFly 28+)
  version_note: EAP 7.3·8.0·WildFly 34 참조에서 같은 문구 확인 — EAP 8.0/WildFly 25+ 는 레거시 security-realm 제거(Elytron 만)
  source: 공식 문서 대조(2026-10-16 5차 보강)
- code: WFLYSRV0035
  severity: warn
  category: security
  title: HTTP 관리 인터페이스 무인증
  vendor_cause: HTTP 관리 서비스(관리 콘솔·HTTP 관리 API)에 보안 영역이나 HTTP 서버 인증이 정의되지 않아 모든 접근이 제한 없이 허용된다는 WARN. 관리 포트(기본 9990)에 접속하는 누구나 배포·구성 변경을 할 수 있다.
