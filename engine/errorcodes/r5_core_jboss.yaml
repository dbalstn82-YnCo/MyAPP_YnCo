product: jboss
layer: was
note: 5차 핵심 코드 보강(2026-10-16) — Red Hat JBoss EAP 7.3·8.0 Log Message Reference, WildFly 34 Log Message Reference, wildfly-core ServerLogger/ControllerLogger 소스 원문 대조. 로그=$JBOSS_HOME/standalone/log/server.log(도메인 모드 $JBOSS_HOME/domain/servers/<server>/log/server.log), CLI=$JBOSS_HOME/bin/jboss-cli.sh -c (읽기 전용 조회만 1차)
codes:
- code: WFLYSRV0007
  severity: error
  category: internal
  title: 배포 해제(undeploy) 롤백
  vendor_cause: 배포 "<이름>" 의 해제(undeploy) 작업이 실패해 롤백되었다는 ERROR(Undeploy of deployment … was rolled back with the following failure message). 해제가 취소되었으므로 애플리케이션은 이전 상태로 남아 있으며, 뒤에 붙은 실패 메시지가 원인이다.
  vendor_action: ''
  vendor_url: https://access.redhat.com/webassets/avalon/d/red_hat_jboss_enterprise_application_platform/8.0/mgmt_model/log-message-reference.html
  immediate:
  - "`grep -n -A10 'WFLYSRV0007' $JBOSS_HOME/standalone/log/server.log | tail -40` 로 배포 이름과 실패 메시지(failure message 뒤 JSON) 기록"
  - "`$JBOSS_HOME/bin/jboss-cli.sh -c 'deployment-info'` 로 해당 배포가 아직 OK(enabled) 인지 확인 — rolled back 이므로 서비스는 이전 상태 유지가 정상"
  short:
  - "(2차·승인 후, 롤백: 해당 없음 — 이미 이전 상태) 실패 메시지의 원인(서비스 의존·잠금 대기)을 해소한 뒤 작업 창에서 undeploy 를 다시 수행"
  mid:
  - "배포·해제 작업을 CLI 배치 스크립트로 표준화하고 작업 전후 deployment-info 결과를 남기는 절차 수립"
  long:
  - "배포 작업 로그의 WFLYSRV0007·0011·0014·0021 롤백 건수를 변경 관리 대장과 함께 추적"
  versions:
  - JBoss EAP 7.0~7.4 (WildFly 10~23)
  - JBoss EAP 8.0/8.1 (WildFly 28+)
  version_note: WFLY* 접두 코드는 WildFly 9/EAP 7.0 이후 — EAP 7.3·8.0·WildFly 34 Log Message Reference 원문 확인, EAP 6.x 는 JBAS0xxxxx
  source: 공식 문서 대조(2026-10-16 5차 보강)
- code: WFLYSRV0011
  severity: error
  category: internal
  title: 재배포(redeploy) 롤백
  vendor_cause: 배포 "<이름>" 의 재배포가 실패해 롤백되었다는 ERROR(Redeploy of deployment … was rolled back). 새 내용의 기동 실패(클래스 오류·의존 서비스 누락)가 흔하며, 롤백 후 애플리케이션 상태는 실패 메시지와 deployment-info 로 확인해야 한다.
  vendor_action: ''
  vendor_url: https://access.redhat.com/webassets/avalon/d/red_hat_jboss_enterprise_application_platform/8.0/mgmt_model/log-message-reference.html
  immediate:
  - "`grep -n -A10 'WFLYSRV0011' $JBOSS_HOME/standalone/log/server.log | tail -40` 로 실패 메시지(missing dependencies·Caused by) 기록"
  - "`$JBOSS_HOME/bin/jboss-cli.sh -c 'deployment-info'` 와 `$JBOSS_HOME/bin/jboss-cli.sh -c '/deployment=<name>:read-attribute(name=status)'` 로 현재 배포 상태(OK·FAILED·STOPPED) 확인"
  short:
  - "(2차·승인 후, 롤백: 직전 배포 파일로 재배포) 실패 원인을 고친 아티팩트로 다시 재배포, 서비스가 내려가 있으면 직전 정상 버전을 먼저 배포"
  mid:
  - "재배포 전 스테이징에서 같은 아티팩트로 기동 시험을 거치고 배포 파일 체크섬을 기록하는 절차 수립"
  long:
  - "배포 이력(버전·체크섬·결과)을 대장으로 관리해 롤백 시 직전 정상본을 바로 찾도록 함"
  versions:
  - JBoss EAP 7.0~7.4 (WildFly 10~23)
  - JBoss EAP 8.0/8.1 (WildFly 28+)
  version_note: WFLY* 접두 코드는 WildFly 9/EAP 7.0 이후 — EAP 7.3·8.0·WildFly 34 원문 확인
  source: 공식 문서 대조(2026-10-16 5차 보강)
- code: WFLYSRV0014
