  mid:
  - "여러 배포를 한 배치로 묶는 스크립트를 배포 단위로 나눠 실패 범위를 줄이는 방식으로 변경"
  long:
  - "배포 스크립트 실행 결과(성공·롤백 단계)를 저장해 무메시지 롤백의 원인 추적 자료로 활용"
  versions:
  - JBoss EAP 7.0~7.4 (WildFly 10~23)
  - JBoss EAP 8.0/8.1 (WildFly 28+)
  version_note: WFLY* 접두 코드는 WildFly 9/EAP 7.0 이후 — EAP 7.3·8.0·WildFly 34 원문 확인
  source: 공식 문서 대조(2026-10-16 5차 보강)
- code: WFLYSRV0026
  severity: error
  category: internal
  title: 서버 기동 완료(오류 동반)
  vendor_cause: 서버가 기동은 끝났지만 오류를 동반했다는 ERROR(… started (with errors) in N ms — Started x of y services (z services failed or missing dependencies …)). 일부 서비스·배포가 실패하거나 의존성이 빠진 채 떠 있으므로 실패한 서비스의 업무가 동작하지 않을 수 있다.
