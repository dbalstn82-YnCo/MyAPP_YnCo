- code: AH00484
  severity: critical
  category: capacity
  title: 최대 워커 도달
  immediate:
  - '`curl -s "http://127.0.0.1/server-status?auto" | grep -E "BusyWorkers|IdleWorkers"` 로 사용 중 워커 확인 — IdleWorkers 0 이 지속되면 포화 확정 (mod_status 활성·로컬 허용 필요)'
  - '`grep -rnE "MaxRequestWorkers|ServerLimit" <설정 디렉터리>` 로 한도 확인, `tail -50000 <access_log> | awk ''{print $1}'' | sort | uniq -c | sort -rn | head` 로 출처 쏠림(폭주·공격) 구분'
  short:
