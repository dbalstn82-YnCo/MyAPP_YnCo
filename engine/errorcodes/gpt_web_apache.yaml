product: apache
layer: web
note: GPT 협업 수집분 — 벤더 공식 문서와 대조 후 확정
codes:
- code: AH00015
  severity: critical
  category: disk
  title: 로그 파일 열기 실패
  immediate:
  - '`apachectl -S` 의 Main ErrorLog 와 `grep -rnE "ErrorLog|CustomLog" <설정 디렉터리>` 로 열지 못한 로그 경로 확인 (Apache 2.4, Debian 계열은 apache2ctl)'
  - '`df -h <로그 디렉터리>` 와 `df -i <로그 디렉터리>` 로 공간·inode 확인 — 100% 면 공간 부족 확정, 여유가 있으면 `namei -l <로그 파일 경로>` 로 디렉터리 존재·권한 확인'
  short:
  - '(2차·승인 후, 롤백: 옮긴 로그를 원래 경로로 복원) 오래된 로그 압축·이동으로 공간 확보 또는 권한 정정 후 `apachectl -t` 로 확인하고 기동'
  - ErrorLog와 CustomLog 경로 및 소유권과 로그 로테이션 상태를 점검
  mid:
  - 로그 저장 영역을 분리하고 용량과 권한 구성을 표준화
  long:
  - 로그 볼륨 사용률과 inode 임계치 및 로테이션 실패를 상시 감시
  source: GPT 수집·벤더 문서 대조 완료(https://cwiki.apache.org/confluence/spaces/HTTPD/pages/115522360/ListOfErrors)
  vendor_cause: 서버 시작 중 설정된 로그 파일 또는 로그 대상 열기에 실패함
  vendor_action: ''
  vendor_url: https://cwiki.apache.org/confluence/spaces/HTTPD/pages/115522360/ListOfErrors
  versions:
  - Apache 2.4
  version_note: AH 코드는 Apache 2.4 에서 도입 — 2.2 이하 로그에는 나타나지 않음(문구 기반 룰로 보완)
- code: AH00072
  severity: critical
  category: connection
  title: 리스닝 주소 바인드 실패
  immediate:
  - '`ss -ltnp | grep ":<port> "` 로 Listen 포트를 이미 점유한 프로세스 확인 — httpd 가 아닌 프로세스나 남은 이전 httpd 면 충돌 확정 (root, 구형은 `netstat -tlnp`)'
  - '`apachectl -S` 와 `grep -rn "^Listen" <설정 디렉터리>` 로 중복 Listen·바인드 IP 확인, `ip -4 addr | grep <바인드 IP>` 로 그 IP 가 서버에 실제로 있는지 확인'
  short:
  - '(2차·승인 후, 롤백: 설정 파일 원복) 점유 프로세스 정리 또는 Listen 포트·IP 수정 뒤 `apachectl -t` Syntax OK 확인 후 기동'
  - Listen과 VirtualHost 설정 및 중복 프로세스 기동 여부를 점검
  mid:
  - 포트 할당과 서비스 기동 순서를 표준화
  long:
  - 기동 전 포트 충돌과 인터페이스 상태 검증을 자동화
  source: GPT 수집·벤더 문서 대조 완료(https://cwiki.apache.org/confluence/spaces/HTTPD/pages/115522360/ListOfErrors)
  vendor_cause: 리스닝 소켓을 지정된 주소에 bind하는 호출이 실패함
  vendor_action: ''
  vendor_url: https://cwiki.apache.org/confluence/spaces/HTTPD/pages/115522360/ListOfErrors
  versions:
  - Apache 2.0~2.2 (메시지 별칭)
  - Apache 2.4
  version_note: AH 코드는 2.4 도입(2.2 이하는 코드 없음) — 2.2 형식 로그의 같은 의미 문구를 별칭으로 이 코드에 대응
- code: AH00159
  severity: critical
  category: capacity
  title: 프로세스 생성 실패
  immediate:
  - '`ps -eLf | wc -l` 을 `cat /proc/sys/kernel/pid_max`·`cat /proc/sys/kernel/threads-max` 와 비교하고 `ps -u <실행 계정> | wc -l` 로 계정 프로세스 수 확인'
  - '`grep -E "processes|open files" /proc/<httpd 부모 PID>/limits` 와 `free -m` 로 한도·메모리 확인 — Max processes 에 근접하거나 available 이 바닥이면 fork 실패 원인 확정 (prefork)'
  short:
  - '(2차·승인 후, 롤백: LB 가중치·설정 원복) 신규 부하 완화가 필요하면 LB 가중치 하향, MaxRequestWorkers 조정은 `apachectl -t` 후 graceful 적용'
  - ulimit과 PID 한도 및 메모리 압박 상태를 점검
  mid:
  - 프로세스 한도와 MPM 설정을 워크로드 기준으로 재산정
  long:
  - 프로세스 사용률과 시스템 자원 포화 임계치를 상시 감시
  source: GPT 수집·벤더 문서 대조 완료(https://cwiki.apache.org/confluence/spaces/HTTPD/pages/115522360/ListOfErrors)
  vendor_cause: prefork MPM이 새 자식 프로세스를 fork하지 못함
  vendor_action: ''
  vendor_url: https://cwiki.apache.org/confluence/spaces/HTTPD/pages/115522360/ListOfErrors
  versions:
  - Apache 2.4
  version_note: AH 코드는 Apache 2.4 에서 도입 — 2.2 이하 로그에는 나타나지 않음(문구 기반 룰로 보완)
- code: AH00480
  severity: critical
  category: thread
  title: 워커 스레드 생성 실패
  immediate:
  - '`ps -o nlwp= -p <httpd 자식 PID>` 와 `ps -eLf | wc -l` 로 프로세스당·전체 스레드 수 확인, `cat /proc/sys/kernel/threads-max` 와 비교'
  - '`apachectl -V | grep -i mpm` 으로 MPM 확인 후 `grep -rnE "ThreadsPerChild|ServerLimit|MaxRequestWorkers|ThreadStackSize" <설정 디렉터리>` 와 `free -m` 로 스레드 설정·메모리 여유 확인 (Apache 2.4 event/worker)'
  short:
  - '(2차·승인 후, 롤백: LB 가중치·설정 원복) 요청 분산이 필요하면 LB 가중치 하향, ThreadsPerChild·ServerLimit 조정은 `apachectl -t` 후 graceful 적용'
  - ThreadsPerChild와 프로세스 제한 및 메모리 사용량을 점검
  mid:
  - MPM 스레드 구성과 서버 용량을 재산정
  long:
  - 스레드 생성 실패와 자원 사용률을 사전 모니터링
  source: GPT 수집·벤더 문서 대조 완료(https://cwiki.apache.org/confluence/spaces/HTTPD/pages/115522360/ListOfErrors)
  vendor_cause: event MPM이 새 worker 스레드를 생성하는 APR 호출에 실패함
  vendor_action: ''
  vendor_url: https://cwiki.apache.org/confluence/spaces/HTTPD/pages/115522360/ListOfErrors
  versions:
  - Apache 2.4
  version_note: AH 코드는 Apache 2.4 에서 도입 — 2.2 이하 로그에는 나타나지 않음(문구 기반 룰로 보완)
- code: AH00483
  severity: critical
  category: capacity
  title: 활성 워커 없음
  immediate:
  - '`ps -ef | grep -c "[h]ttpd"` 와 `systemctl status <service> --no-pager` 로 Apache 생존 여부 확인 — 0 이면 종료 확정 (Debian 계열 프로세스명 apache2)'
  - '`grep -B20 "AH00483" <error_log> | tail -40` 와 `dmesg -T | grep -iE "oom|segfault" | tail -20` 로 직전 워커 종료 원인(OOM·segfault·AH00052 child exit) 확인 (Apache 2.4 event)'
  short:
  - '(2차·승인 후, 롤백: LB 가중치 원복) 서비스 영향 시 LB 에서 해당 노드 제외로 트래픽 우회, 원인 확인 뒤 `systemctl start <service>` 로 기동하고 `apachectl -S` 확인'
  - error_log와 OS 로그에서 워커 비정상 종료와 자원 부족을 분석
  mid:
  - MPM 구성과 장애 원인을 수정하고 안정성 패치를 검토
  long:
  - 워커 생존 상태와 자동복구 및 헬스체크를 운영
  source: GPT 수집·벤더 문서 대조 완료(https://cwiki.apache.org/confluence/spaces/HTTPD/pages/115522360/ListOfErrors)
  vendor_cause: event MPM에서 활성 worker를 찾지 못해 Apache가 종료됨
  vendor_action: ''
  vendor_url: https://cwiki.apache.org/confluence/spaces/HTTPD/pages/115522360/ListOfErrors
  versions:
