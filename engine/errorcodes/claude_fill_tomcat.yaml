product: tomcat
layer: was
note: GPT 협업 수집분 — 벤더 공식 문서와 대조 후 확정 · 2026-10-16 G7a 4단 보강(Tomcat 9 Configuration Reference·Manager How-To 대조)
codes:
- code: TOMCAT-SESSION-EXPIRE-FAIL
  severity: warn
  category: internal
  title: 세션 만료 처리 실패
  immediate:
  - "`grep -n -i -E 'expire|sessionDestroyed|SessionListener' $CATALINA_BASE/logs/localhost.$(date +%Y-%m-%d).log | tail -20` 로 예외 스택·리스너 클래스 확인 — 같은 클래스가 반복되면 앱 리스너 결함으로 확정"
  - "Manager 앱 `curl -s -u <user> 'http://localhost:<port>/manager/text/sessions?path=/<app>'` 로 활성 세션 수 확인(읽기, manager-script 역할) — 시간이 지나도 계속 늘면 만료 정리 실패로 힙 영향"
  short:
  - "(2차·승인 후, 롤백: 이전 WAR 재배포) sessionDestroyed·valueUnbound 리스너에 예외 처리를 넣은 패치 배포 — 배포 전후 세션 수 기록"
  mid:
  - "context.xml `<Manager maxActiveSessions=…>` 상한과 web.xml `<session-timeout>` 을 업무 기준으로 재산정, 리스너 단위 시험 추가"
  long:
  - "활성 세션 수(Manager activeSessions·JMX)와 만료 예외 건수를 감시 임계로 등록"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: Tomcat 세션 매니저가 만료 세션을 정리(processExpires)하는 중 애플리케이션의 HttpSessionListener·HttpSessionBindingListener 가 예외를 던져 정리가 끝나지 못한 상태. 리스너 코드 결함·세션 속성 정리 로직 오류가 흔한 원인.
  vendor_url: https://tomcat.apache.org/tomcat-9.0-doc/config/manager.html
  versions:
  - Tomcat 5.5
  - Tomcat 6.0
  - Tomcat 7.0
  - Tomcat 8.0/8.5
  - Tomcat 9.0
  - Tomcat 10.0/10.1
  - Tomcat 11.0
  version_note: 문구 기반 별칭 — Tomcat 5.5~11.0 공통(JVM·커넥터·JDBC 풀 공통 문구)
- code: TOMCAT-MANAGER-AUTH-FAIL
  severity: error
  category: security
  title: 관리자 앱 인증 실패
  immediate:
  - "`grep -E ' /(manager|host-manager)/' $CATALINA_BASE/logs/localhost_access_log.$(date +%Y-%m-%d).txt | awk '$9==401||$9==403{print $1}' | sort | uniq -c | sort -rn | head` 로 실패 출처 IP·횟수 확인 — 한 IP 에서 수십 회 이상이면 대입 시도 의심"
  - "`grep -n -i -E 'LockOutRealm|locked|authenticat' $CATALINA_BASE/logs/catalina.out | tail -20` 로 계정 잠금 발생 확인, conf/tomcat-users.xml 은 역할(manager-gui/manager-script)만 열람(비밀번호 화면 노출 주의)"
  short:
  - "(2차·승인 후, 롤백: 수정 전 context.xml 백업 복원) Manager 앱 META-INF/context.xml 의 RemoteAddrValve allow 를 관리망 대역으로 제한, 침해 의심이면 출처 IP 를 보안 담당에 전달"
  mid:
  - "LockOutRealm(failureCount·lockOutTime) 적용, manager-gui·manager-script 계정 분리와 강한 비밀번호 정책"
  long:
  - "운영 서버 Manager 앱 미배포 또는 관리망 전용 접근, 401/403 급증 감시 규칙 등록"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: Manager·Host Manager 웹앱(/manager, /host-manager) 접근 시 Realm(tomcat-users.xml 등) 인증에 실패했거나 manager-gui·manager-script 등 필요한 역할이 없어 401/403 이 반환된 상태. 계정 오입력·역할 누락·외부 대입 시도가 흔한 원인.
  vendor_url: https://tomcat.apache.org/tomcat-9.0-doc/manager-howto.html
  versions:
  - Tomcat 5.5
  - Tomcat 6.0
  - Tomcat 7.0
  - Tomcat 8.0/8.5
  - Tomcat 9.0
  - Tomcat 10.0/10.1
  - Tomcat 11.0
  version_note: '''Access to the requested resource has been denied'' 는 7.0 이후 오류 페이지 문구, 401/403 은 전 버전'
- code: TOMCAT-VALVE-ERROR
  severity: error
  category: internal
  title: 밸브 처리 오류
  immediate:
  - "`grep -n -A15 -i 'valve' $CATALINA_BASE/logs/catalina.out | grep -E 'Exception|Caused by|Valve' | tail -30` 로 문제 Valve 클래스와 예외 확인"
  - "`grep -n '<Valve' $CATALINA_BASE/conf/server.xml $CATALINA_BASE/conf/context.xml` 와 `ls -l --time-style=long-iso $CATALINA_BASE/conf/` 로 설정 Valve·최근 변경 시각 대조 — 변경 직후 발생이면 설정 원인"
  short:
  - "(2차·승인 후, 롤백: server.xml 백업 복원 후 Tomcat 재기동) 오류 Valve 의 className·속성(allow/deny 정규식, pattern) 수정 또는 해당 Valve 비활성화"
  mid:
  - "사용자 정의 Valve 는 대상 Tomcat 판(8.5/9/10.1)으로 재빌드·시험, Valve 구성 표준(Access Log·RemoteAddr·ErrorReport)만 운영에 허용"
  long:
  - "server.xml·context.xml 형상 관리(변경 전 백업·diff 기록)와 5xx 비율 감시"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: server.xml·context.xml 에 설정된 Valve(AccessLogValve·RemoteAddrValve·ErrorReportValve·사용자 정의 Valve 등) 처리 중 예외가 발생한 상태. 잘못된 className·속성값(정규식 등), 사용자 Valve 결함, 판 업그레이드 후 미지원 속성이 흔한 원인.
  vendor_url: https://tomcat.apache.org/tomcat-9.0-doc/config/valve.html
  versions:
  - Tomcat 5.5
  - Tomcat 6.0
  - Tomcat 7.0
  - Tomcat 8.0/8.5
  - Tomcat 9.0
  - Tomcat 10.0/10.1
  - Tomcat 11.0
  version_note: 문구 기반 별칭 — Tomcat 5.5~11.0 공통(JVM·커넥터·JDBC 풀 공통 문구)
- code: TOMCAT-REALM-FAIL
  severity: error
  category: security
  title: Realm 인증 저장소 연결 실패
  immediate:
  - "`grep -n -i -E 'Realm|JNDIRealm|DataSourceRealm|NamingException' $CATALINA_BASE/logs/catalina.out | tail -20` 로 실패 Realm 종류·대상 주소 확인"
  - "`grep -n -A3 '<Realm' $CATALINA_BASE/conf/server.xml` 로 connectionURL·dataSourceName 확인 후 `nc -zvw3 <ldap_or_db_host> <port>` 로 도달성 확인 — 접속 실패면 인증 저장소/네트워크 장애로 확정(설정 값 중 비밀번호는 화면에 띄우지 않는다)"
  short:
  - "(2차·승인 후, 롤백: server.xml 백업 복원) LDAP/DB 측 장애 해소 확인 후 Realm 의 connectionURL·alternateURL·connectionTimeout 수정, 반영은 Tomcat 재기동 일정으로"
  mid:
  - "JNDIRealm alternateURL(보조 LDAP) 또는 DataSourceRealm 풀 검증(validationQuery) 구성으로 단일 장애점 제거"
  long:
  - "인증 저장소 가용성(포트 감시)과 인증 실패율을 함께 감시, 서비스 계정 비밀번호 만료 일정 관리"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: JNDIRealm(LDAP)·DataSourceRealm(DB) 등 Realm 이 인증 저장소에 연결하지 못해 사용자 인증을 처리할 수 없는 상태. LDAP/DB 서버 장애·네트워크 차단·서비스 계정 비밀번호 만료·잘못된 connectionURL 이 흔한 원인.
  vendor_url: https://tomcat.apache.org/tomcat-9.0-doc/realm-howto.html
  versions:
  - Tomcat 5.5
  - Tomcat 6.0
  - Tomcat 7.0
  - Tomcat 8.0/8.5
  - Tomcat 9.0
  - Tomcat 10.0/10.1
  - Tomcat 11.0
  version_note: 문구 기반 별칭 — Tomcat 5.5~11.0 공통(JVM·커넥터·JDBC 풀 공통 문구)
- code: TOMCAT-ASYNC-TIMEOUT
  severity: warn
  category: thread
  title: 비동기 요청 시간 초과
  immediate:
  - "`grep -n -i -E 'async|timeout' $CATALINA_BASE/logs/localhost.$(date +%Y-%m-%d).log | tail -20` 로 시간 초과 URI·서블릿 확인, 같은 시각 접근 로그의 응답 시간(%D/%T 설정 시) 대조"
  - "`jcmd <PID> Thread.print | grep -A12 -E 'AsyncContext|CompletableFuture' | head -60` 로 비동기 작업 스레드가 어디서 대기하는지 확인(읽기 전용)"
  short:
  - "(2차·승인 후, 롤백: 이전 설정값 복원) 후단(DB·외부 API) 지연 해소 후 AsyncContext.setTimeout 또는 Connector asyncTimeout(기본 30000ms) 을 업무 최대 처리 시간 기준으로 조정"
  mid:
  - "비동기 작업 전용 스레드 풀 상한·큐 길이 설정, 후단 호출 타임아웃을 asyncTimeout 보다 짧게 정렬"
  long:
  - "비동기 시간 초과 건수와 후단 응답 시간 SLO 를 함께 감시"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: Servlet 3.0+ 비동기 요청(AsyncContext)이 asyncTimeout(Connector 기본 30초) 또는 앱이 지정한 시간 안에 complete/dispatch 되지 않아 시간 초과 처리된 상태. 후단 호출 지연·비동기 작업 스레드 고갈·complete() 누락이 흔한 원인.
  vendor_url: https://tomcat.apache.org/tomcat-9.0-doc/config/http.html
  versions:
  - Tomcat 7.0
  - Tomcat 8.0/8.5
  - Tomcat 9.0
  - Tomcat 10.0/10.1
  - Tomcat 11.0
  version_note: Servlet 3.0 비동기(AsyncContext)는 7.0 이후
- code: TOMCAT-NIO-SELECTOR-FAIL
  severity: error
  category: internal
  title: NIO 셀렉터 오류
  immediate:
  - "`grep -n -B2 -A10 -i 'selector' $CATALINA_BASE/logs/catalina.out | tail -40` 로 예외 종류(IOException·CancelledKeyException·Too many open files) 확인"
  - "`ls /proc/<PID>/fd | wc -l` 와 `grep 'open files' /proc/<PID>/limits` 로 FD 사용량·한도 확인, `java -version 2>&1` 로 JDK 판 기록 — FD 가 한도 근처면 FD 고갈이 원인"
  short:
  - "(2차·승인 후, 롤백: 이전 JDK·설정 복원) FD 고갈이면 ulimit -n 상향(서비스 단위 LimitNOFILE), JDK 결함이면 해당 JDK 업데이트 적용 — 반영은 Tomcat 재기동 일정으로"
  mid:
  - "Connector maxConnections·keepAliveTimeout 을 FD 한도 안에서 재산정, JDK 를 Tomcat 판 지원 범위의 최신 업데이트로 유지"
  long:
  - "프로세스 FD 사용률 80% 감시 임계 등록과 JDK 정기 업데이트 일정"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: NIO/NIO2 커넥터의 Poller(Selector)가 소켓 이벤트 처리 중 예외를 만나 연결 처리가 중단·지연된 상태. 파일 디스크립터 고갈, JDK NIO 결함, OS 네트워크 오류가 흔한 원인.
  vendor_url: https://tomcat.apache.org/tomcat-9.0-doc/config/http.html
  versions:
  - Tomcat 6.0
  - Tomcat 7.0
  - Tomcat 8.0/8.5
  - Tomcat 9.0
  - Tomcat 10.0/10.1
  - Tomcat 11.0
  version_note: NIO 커넥터는 6.0 도입(8.0 부터 기본), NioEndpoint 문구
- code: TOMCAT-RESPONSE-COMMITTED
  severity: warn
  category: internal
  title: 응답 커밋 후 헤더 변경
  immediate:
  - "`grep -n -B3 -A12 'response has been committed' $CATALINA_BASE/logs/localhost.$(date +%Y-%m-%d).log | tail -40` 로 발생 서블릿·필터·호출 스택 확인"
  - "같은 시각 접근 로그에서 해당 URI 의 상태 코드·건수 확인 — 단발이고 사용자 오류 신고가 없으면 앱 결함으로 2차 이관(긴급 아님)"
  short:
  - "(2차·승인 후, 롤백: 이전 WAR 재배포) 응답 출력(flush·getWriter) 이후 sendRedirect·sendError·setHeader 를 호출하는 코드 수정 배포"
  mid:
  - "필터·서블릿에서 응답 기록 후 forward/redirect 금지 코딩 규칙, 출력 버퍼(bufferSize) 의존 로직 제거"
  long:
  - "IllegalStateException 발생 건수를 URI 별로 집계해 배포 품질 지표로 관리"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: 응답이 이미 클라이언트로 커밋(헤더 전송)된 뒤 애플리케이션이 sendRedirect·sendError·forward·헤더 변경을 시도해 IllegalStateException 이 발생한 상태. 출력 후 리다이렉트하는 앱 코드, 필터 체인 중복 처리가 흔한 원인.
  versions:
  - Tomcat 5.5
  - Tomcat 6.0
  - Tomcat 7.0
  - Tomcat 8.0/8.5
  - Tomcat 9.0
  - Tomcat 10.0/10.1
  - Tomcat 11.0
  version_note: IllegalStateException 문구 — 전 버전
- code: TOMCAT-JAR-SCAN-FAIL
  severity: warn
  category: internal
  title: JAR 스캔 실패
  immediate:
  - "`grep -n -A5 'Failed to scan' $CATALINA_BASE/logs/catalina.out | tail -30` 로 대상 JAR 경로·예외(FileNotFoundException·ZipException) 확인"
  - "대상 JAR 에 `ls -l <jar경로>` 와 `unzip -tq <jar경로>` 로 존재·권한·손상 여부 확인 — Class-Path 매니페스트가 가리키는 없는 JAR 이면 경고성(기능 영향 없음)"
  short:
  - "(2차·승인 후, 롤백: catalina.properties 백업 복원) 손상 JAR 교체, 또는 불필요 JAR 를 catalina.properties `tomcat.util.scan.StandardJarScanFilter.jarsToSkip` 에 추가하고 재기동 일정 반영"
  mid:
  - "context.xml `<JarScanner scanManifest=\"false\">` 로 매니페스트 Class-Path 추적 해제 검토, 라이브러리 목록 정비"
  long:
  - "배포 패키지 빌드 단계에서 JAR 무결성 검사(unzip -t)와 중복 라이브러리 검출"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: 기동 시 StandardJarScanner 가 TLD·web-fragment·어노테이션을 찾으려 JAR 를 스캔하다 실패한 상태. 매니페스트 Class-Path 가 가리키는 JAR 부재, 손상된 JAR, 읽기 권한 문제가 흔한 원인이며 대개 경고에 그친다.
  vendor_url: https://tomcat.apache.org/tomcat-9.0-doc/config/jar-scanner.html
  versions:
  - Tomcat 8.0/8.5
  - Tomcat 9.0
  - Tomcat 10.0/10.1
  - Tomcat 11.0
  version_note: '''Failed to scan [..] from classloader hierarchy'' 문구는 8.0 이후 StandardJarScanner(7.0 은 ''Failed to scan JAR'' 문구)'
- code: TOMCAT-STARTUP-SLOW
  severity: warn
  category: capacity
  title: 기동 지연(엔트로피 부족)
  immediate:
  - "`grep -n 'Creation of SecureRandom instance' $CATALINA_BASE/logs/catalina.out | tail -5` 로 SecureRandom 생성 소요 시간(밀리초) 확인 — 수 초 이상이면 엔트로피 부족 확정"
  - "`cat /proc/sys/kernel/random/entropy_avail` 와 `ps -ef | grep -o 'java.security.egd=[^ ]*'` 로 엔트로피 잔량·egd 옵션 확인(Linux, 읽기 전용)"
  short:
  - "(2차·승인 후, 롤백: setenv.sh 백업 복원) setenv.sh CATALINA_OPTS 에 `-Djava.security.egd=file:/dev/./urandom` 추가 또는 rng-tools/haveged 도입 — 반영은 Tomcat 재기동 일정으로, 보안 담당 확인"
  mid:
  - "JDK 8+ 의 securerandom.source 설정(java.security) 표준화, 가상화 서버는 virtio-rng 등 엔트로피 공급 구성"
  long:
  - "기동 소요 시간(catalina.out 'Server startup in') 기준값 기록과 증가 감시"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: 세션 ID 생성용 SecureRandom 초기화가 OS 엔트로피(/dev/random) 부족으로 블록되어 기동이 수십 초~수 분 지연된 상태. 엔트로피가 적은 가상 서버·헤드리스 서버가 흔한 원인.
  vendor_url: https://tomcat.apache.org/tomcat-9.0-doc/config/manager.html
  versions:
  - Tomcat 7.0
  - Tomcat 8.0/8.5
