  - "관리 콘솔(리소스 › 리소스 어댑터 › <RA>)에서 아카이브 경로·클래스 경로·네이티브 경로 값을 확인하고 `ls -l <경로>` 로 실제 파일 존재 확인(읽기 전용)"
