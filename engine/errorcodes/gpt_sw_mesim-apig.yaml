product: mesim-apig
layer: sw
note: GPT 협업 수집분 — 벤더 공식 문서와 대조 후 확정
codes:
- code: APIG-AUTH-FAIL
  severity: error
  category: security
  title: API 인증 실패(추정)
  immediate:
  - "`grep -n -E \"Authentication|Unauthorized| 401 \" <apig_log> | tail -30` 으로 실패 API·호출처(IP·클라이언트 ID)·시각 확인(자격증명 값은 기록하지 않음)"
  - "`grep -c -E \"Unauthorized| 401 \" <apig_log>` 로 건수를 집계해 한 호출처 다발(오설정·공격)인지 다수 호출처(인증 서버·정책 변경)인지 구분"
  short:
  - 인증정책과 사용자 정보 및 요청 헤더를 점검
  mid:
  - 인증 설정과 클라이언트 인증 절차를 정상화
  long:
  - API 인증 실패율과 반복 실패 사용자를 상시 감시
  vendor_cause: "자체 정의 의사코드 — 로그 문구(authentication fail·401·Unauthorized)가 API 게이트웨이의 호출자 인증 실패를 가리킨다. 잘못되거나 만료된 자격증명, 클라이언트 설정 변경 누락, 무차별 대입 시도가 흔한 원인."
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - MESIM ESB/APIG/EAI (메타빌드, 납품 버전 기준)
  version_note: 메타빌드 MESIM 의사코드(문구 추정) — 제품 버전별 문구 차이 미확인(공개 레퍼런스 없음), 납품 구성(Apache Camel·Jetty·Hystrix 기반 레거시 룰) 기준 전 버전 수집
- code: APIG-AUTHZ-DENY
  severity: warn
  category: security
  title: API 권한 거부(추정)
  immediate:
  - "`grep -n -E \"Forbidden| 403 |permission\" <apig_log> | tail -30` 으로 거부된 API·호출처·시각 확인"
  - "같은 호출처의 다른 API 성공 여부와 최근 권한 정책 변경 이력을 대조(정책 변경 없이 조회만)"
  short:
  - 사용자 역할과 API 권한 설정 및 최근 변경을 점검
  mid:
  - 최소권한 원칙으로 권한 정책을 정비
  long:
  - 권한 거부 이력과 비정상 접근 패턴을 상시 감시
  vendor_cause: "자체 정의 의사코드 — 로그 문구(permission denied·403·Forbidden)가 인증은 됐지만 해당 API 호출 권한이 없음을 가리킨다. 권한 정책 변경·역할 미부여·잘못된 API 경로 호출이 흔한 원인."
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - MESIM ESB/APIG/EAI (메타빌드, 납품 버전 기준)
  version_note: 메타빌드 MESIM 의사코드(문구 추정) — 제품 버전별 문구 차이 미확인(공개 레퍼런스 없음), 납품 구성(Apache Camel·Jetty·Hystrix 기반 레거시 룰) 기준 전 버전 수집
- code: APIG-APIKEY-INVALID
  severity: error
  category: security
  title: 인증키 오류(추정)
  immediate:
  - "`grep -n -i -E \"api[ -]?key\" <apig_log> | tail -30` 으로 실패 호출처·시각과 사유(invalid·expired·missing) 확인 — 키 값은 앞 몇 자리만 남기고 가림"
  - "같은 키를 쓰는 다른 호출의 성공 여부와 키 만료일·상태를 APIG 관리 화면에서 조회(변경 없이)"
  short:
  - 인증키 발급과 활성 상태 및 클라이언트 설정을 점검
  mid:
  - 키 발급과 갱신 및 폐기 절차를 표준화
  long:
  - 인증키 실패와 만료 및 비정상 사용을 상시 감시
  vendor_cause: "자체 정의 의사코드 — 로그 문구(api key invalid/expired/not found)가 요청에 담긴 API 키가 등록되지 않았거나 만료·비활성 상태임을 가리킨다. 키 갱신 미반영·잘못된 키 배포가 흔한 원인."
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - MESIM ESB/APIG/EAI (메타빌드, 납품 버전 기준)
  version_note: 메타빌드 MESIM 의사코드(문구 추정) — 제품 버전별 문구 차이 미확인(공개 레퍼런스 없음), 납품 구성(Apache Camel·Jetty·Hystrix 기반 레거시 룰) 기준 전 버전 수집
- code: APIG-ROUTE-FAIL
  severity: error
  category: internal
  title: API 라우팅 실패(추정)
  immediate:
  - "`grep -n -E \"[Rr]out(e|ing).*(fail|error|not found)|No route| 404 \" <apig_log> | tail -30` 으로 실패 URL·시각 확인"
  - "실패 URL 이 최근 배포·API 등록 변경 대상인지 변경 이력과 대조, 같은 URL 의 이전 성공 기록 확인"
  short:
  - 라우팅 정책과 Endpoint 등록정보 및 최근 변경을 점검
  mid:
  - URL 매핑과 장애전환 경로를 정상화
  long:
  - 라우팅 실패율과 Backend 상태를 통합 모니터링
  vendor_cause: "자체 정의 의사코드 — 로그 문구(route/routing fail·No route·404)가 요청 URL 에 맞는 라우팅 규칙·백엔드를 찾지 못했음을 가리킨다. API 등록·URL 매핑 변경 누락, 호출 경로 오타가 흔한 원인."
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - MESIM ESB/APIG/EAI (메타빌드, 납품 버전 기준)
  version_note: 메타빌드 MESIM 의사코드(문구 추정) — 제품 버전별 문구 차이 미확인(공개 레퍼런스 없음), 납품 구성(Apache Camel·Jetty·Hystrix 기반 레거시 룰) 기준 전 버전 수집
- code: APIG-BACKEND-DOWN
  severity: critical
  category: upstream
  title: 백엔드 서비스 장애(추정)
  immediate:
  - "`grep -n -E \"Bad Gateway| 502 |[Bb]ackend\" <apig_log> | tail -30` 으로 대상 백엔드·시작 시각 확인"
  - "대상 백엔드 host:port 로 `nc -zvw3 <host> <port>` 와 `curl -s -o /dev/null -w '%{http_code} %{time_total}\\n' --max-time 10 http://<host>:<port>/<health>` 로 응답 확인"
  short:
  - 네트워크와 애플리케이션 상태 및 장애 발생 시점을 분석
  mid:
  - Backend 이중화와 서비스 복구 및 장애전환 구성을 개선
  long:
  - Backend 가용성과 API 오류율을 실시간 감시
  vendor_cause: "자체 정의 의사코드 — 로그 문구(backend unavailable·502·Bad Gateway)가 게이트웨이 뒤의 백엔드(Provider) 서비스가 응답 불가 상태임을 가리킨다. 백엔드 프로세스 정지·과부하·배포 중 중단이 흔한 원인."
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - MESIM ESB/APIG/EAI (메타빌드, 납품 버전 기준)
  version_note: 메타빌드 MESIM 의사코드(문구 추정) — 제품 버전별 문구 차이 미확인(공개 레퍼런스 없음), 납품 구성(Apache Camel·Jetty·Hystrix 기반 레거시 룰) 기준 전 버전 수집
- code: APIG-BACKEND-CONNECT-FAIL
  severity: critical
  category: connection
  title: 백엔드 연결 실패(추정)
  immediate:
