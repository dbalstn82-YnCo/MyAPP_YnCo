  long:
  - 노드별 트래픽과 가용상태 및 편중을 상시 감시
  vendor_cause: "자체 정의 의사코드 — 로그 문구(load balance fail·no available node)가 분산 대상 노드 중 사용할 수 있는 노드가 없음을 가리킨다. 백엔드 노드 다수 장애·헬스체크 실패가 흔한 원인."
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
