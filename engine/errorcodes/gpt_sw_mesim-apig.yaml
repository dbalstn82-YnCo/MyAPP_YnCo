  - "게이트웨이 서버에서 `nc -zvw3 <host> <port>` 와 `getent hosts <host>` 로 도달·이름 해석 확인"
  short:
  - 라우팅 설정과 방화벽 및 Backend 프로세스 상태를 점검
  mid:
  - 연결 재시도와 Backend 다중화 정책을 개선
  long:
  - Backend 연결 성공률과 네트워크 장애를 상시 감시
  vendor_cause: "자체 정의 의사코드 — 로그 문구(Connection refused·ConnectException·HttpHostConnectException)가 게이트웨이가 백엔드에 TCP 연결을 맺지 못했음을 가리킨다. 백엔드 미기동·포트 변경·방화벽 차단이 흔한 원인."
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - MESIM ESB/APIG/EAI (메타빌드, 납품 버전 기준)
  version_note: 메타빌드 MESIM 의사코드(문구 추정) — 제품 버전별 문구 차이 미확인(공개 레퍼런스 없음), 납품 구성(Apache Camel·Jetty·Hystrix 기반 레거시 룰) 기준 전 버전 수집
- code: APIG-BACKEND-TIMEOUT
  severity: error
  category: upstream
  title: 백엔드 응답 지연(추정)
  immediate:
  - "`grep -n -E \"Read timed out|SocketTimeoutException| 504 \" <apig_log> | tail -30` 으로 지연 API·대상 백엔드·시각 확인"
  - "`curl -s -o /dev/null -w '%{time_total}\\n' --max-time 30 http://<host>:<port>/<path>` 로 백엔드 직접 응답시간 측정(조회성 API 만)"
  short:
  - Backend 처리시간과 네트워크 및 연계 DB 병목을 분석
  mid:
  - 백엔드 성능과 API 타임아웃 및 자원 용량을 조정
  long:
  - API 응답시간과 시간초과 비율을 지속 감시
  vendor_cause: "자체 정의 의사코드 — 로그 문구(backend timeout·504·Read timed out)가 백엔드가 제한 시간 안에 응답하지 않았음을 가리킨다. 백엔드 처리 지연(DB·외부 호출)·과부하·네트워크 지연이 흔한 원인."
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - MESIM ESB/APIG/EAI (메타빌드, 납품 버전 기준)
  version_note: 메타빌드 MESIM 의사코드(문구 추정) — 제품 버전별 문구 차이 미확인(공개 레퍼런스 없음), 납품 구성(Apache Camel·Jetty·Hystrix 기반 레거시 룰) 기준 전 버전 수집
- code: APIG-TRAFFIC-LIMIT
  severity: warn
  category: capacity
  title: API 유량 제한(추정)
  immediate:
  - "`grep -n -E \"Too Many Requests| 429 |rate.*limit\" <apig_log> | tail -30` 으로 대상 API·호출처 확인"
  - "`grep -c -E \" 429 \" <apig_log>` 로 시간대별 건수를 집계해 정상 업무 급증인지 특정 호출처 폭주인지 구분"
  short:
  - 호출 주체와 시간대별 트래픽 및 정책값을 분석
  mid:
  - API 중요도와 용량에 맞게 유량정책을 조정
  long:
  - API별 TPS와 제한 발생률을 상시 모니터링
  vendor_cause: "자체 정의 의사코드 — 로그 문구(rate limit exceed·429·Too Many Requests)가 API 별 유량 제한 정책이 발동해 초과 요청을 거절했음을 가리킨다. 호출처의 급증·재시도 폭주·정책값 과소가 흔한 원인."
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - MESIM ESB/APIG/EAI (메타빌드, 납품 버전 기준)
  version_note: 메타빌드 MESIM 의사코드(문구 추정) — 제품 버전별 문구 차이 미확인(공개 레퍼런스 없음), 납품 구성(Apache Camel·Jetty·Hystrix 기반 레거시 룰) 기준 전 버전 수집
- code: APIG-CIRCUIT-OPEN
  severity: error
  category: upstream
  title: 서비스 차단 동작(추정)
  immediate:
  - "`grep -n -i \"circuit\" <apig_log> | tail -30` 으로 OPEN 된 백엔드·OPEN 시작 시각 확인, 직전의 timeout·5xx 기록 확인 — 같은 백엔드에 timeout·5xx 가 몰린 직후 OPEN 이면 백엔드 원인 확정"
  - "대상 백엔드에 `nc -zvw3 <host> <port>` 로 도달 확인 — 백엔드 정상화가 먼저이며 차단 수동 해제는 2차"
  short:
  - "`grep -n -i -E 'timeout|RES CODE:? *5[0-9]{2}' <apig_log> | grep '<백엔드>' | tail -50` 과 백엔드 응답시간(`curl -s -o /dev/null -w '%{http_code} %{time_total}' <backend_url>`)을 대조해 OPEN 조건(오류율·timeout) 충족 경위를 확정하고 백엔드 담당에 전달"
  - "(2차·승인 후, 롤백: 다시 OPEN 되면 백엔드 원인 재조사) 백엔드 정상화 확인 뒤 반개방(Half-Open) 자동 복구를 기다리고, 복구되지 않을 때만 관리 화면에서 수동 해제"
  verify_note: "미검증 — MESIM APIG 의 서킷 반개방 대기 시간과 관리 화면 수동 해제 메뉴는 납품 매뉴얼로 확인하지 못함(공개 문서 없음)"
  mid:
  - Backend 원인을 제거하고 서비스 차단 정책을 검증
  long:
  - 차단 발생과 Backend 장애 및 복구 상태를 통합 감시
  vendor_cause: "자체 정의 의사코드 — 로그 문구(circuit open·CircuitBreaker)가 백엔드 오류율이 임계를 넘어 게이트웨이가 해당 백엔드 호출을 일시 차단했음을 가리킨다. 백엔드 장애·지연이 근본 원인."
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - MESIM ESB/APIG/EAI (메타빌드, 납품 버전 기준)
  version_note: 메타빌드 MESIM 의사코드(문구 추정) — 제품 버전별 문구 차이 미확인(공개 레퍼런스 없음), 납품 구성(Apache Camel·Jetty·Hystrix 기반 레거시 룰) 기준 전 버전 수집
- code: APIG-LOADBALANCE-FAIL
  severity: critical
  category: capacity
  title: 게이트웨이 분산 실패(추정)
  immediate:
  - "`grep -n -i -E \"load ?balanc|no available\" <apig_log> | tail -30` 으로 대상 그룹·시각 확인"
  - "분산 대상 노드마다 `nc -zvw3 <node> <port>` 로 도달 확인해 정상 노드 수 집계"
  short:
  - 노드 장애와 부하분산 정책 및 자원 포화를 분석
  mid:
