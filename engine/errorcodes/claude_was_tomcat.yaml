product: tomcat
layer: was
note: GPT 협업 수집분 — 벤더 공식 문서와 대조 후 확정 · 2026-10-16 G7a 4단 보강(Tomcat 9 Configuration Reference·Manager How-To·Logging 대조)
codes:
- code: TOMCAT-OOM-THREAD
  severity: critical
  category: thread
  title: 네이티브 스레드 생성 불가
  immediate:
  - "`ls /proc/<PID>/task | wc -l` 와 `grep -E 'Max processes|Max open files' /proc/<PID>/limits` 로 프로세스 스레드 수·nproc 한도 확인 — 한도에 근접하면 확정"
  - "`jcmd <PID> Thread.print > $CATALINA_BASE/logs/td_$(date +%H%M%S).txt` 로 스레드 덤프 보존(프로세스 유지) 후 `grep -c '^\"' td_*.txt` 로 스레드 수·이름 접두 집계(재기동 판단은 2차)"
  - "`free -m` 와 `ulimit -u` 로 메모리·사용자 프로세스 한도 확인 — 메모리 부족이면 -Xss·힙 축소 검토 대상"
  short:
  - "(2차·승인 후, 롤백: 변경 전 limits.conf·setenv.sh 백업 복원) 스레드 폭증 원인(스레드 누수·Executor 상한 부재)을 덤프로 확인 후 Tomcat 재기동으로 서비스 복구, nproc(LimitNPROC) 상향"
  mid:
  - "server.xml Connector/Executor maxThreads 와 앱 자체 스레드 풀 상한을 명시, -Xss(스레드 스택) 크기 재산정"
  long:
  - "JVM 스레드 수(jcmd Thread.print 집계·JMX ThreadCount)를 nproc 한도의 70% 에서 경보"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: 'JVM 이 OS 스레드를 더 만들지 못해 java.lang.OutOfMemoryError: unable to create new native thread 가 발생한 상태. 사용자 프로세스 한도(nproc) 도달, 앱의 스레드 누수, 스레드 스택용 네이티브 메모리 부족이 흔한 원인.'
  vendor_url: https://tomcat.apache.org/tomcat-9.0-doc/config/executor.html
  versions:
  - Tomcat 5.5
  - Tomcat 6.0
  - Tomcat 7.0
  - Tomcat 8.0/8.5
  - Tomcat 9.0
  - Tomcat 10.0/10.1
  - Tomcat 11.0
  version_note: 문구 기반 별칭 — Tomcat 5.5~11.0 공통(JVM·커넥터·JDBC 풀 공통 문구)
- code: TOMCAT-THREADPOOL-FULL
  severity: critical
  category: thread
  title: 요청 스레드 풀 고갈
  immediate:
  - "`curl -s -u <user> 'http://localhost:<port>/manager/status?XML=true' | grep -o '<threadInfo[^>]*>'` 로 currentThreadsBusy·maxThreads 확인(manager-status 역할, 7.0+) — busy 가 maxThreads 와 같으면 고갈 확정"
  - "`for i in 1 2 3; do jcmd <PID> Thread.print > $CATALINA_BASE/logs/td_$(date +%H%M%S)_$i.txt; sleep 10; done` 로 10초 간격 덤프 3회 — exec 스레드 다수가 같은 스택(DB·외부 HTTP·락)이면 그 지점이 병목"
  - "`ss -tan state established '( sport = :<port> )' | wc -l` 로 접속 수 확인 — maxConnections·acceptCount 와 대조"
  short:
  - "(2차·승인 후, 롤백: server.xml 백업 복원) 병목 후단(DB 풀·외부 API) 해소가 우선, 필요 시 Connector maxThreads·acceptCount 조정 후 재기동 일정 반영"
  mid:
  - "maxThreads 를 CPU 코어·DB 풀 크기와 함께 산정, 후단 호출 타임아웃(connect/read)을 요청 타임아웃보다 짧게 정렬"
  long:
  - "currentThreadsBusy/maxThreads 70% 경보, StuckThreadDetectionValve 로 장시간 요청 기록"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: Connector 의 요청 처리 스레드가 모두 사용 중(maxThreads 도달)이라 새 요청이 acceptCount 큐에서 대기하거나 거절되는 상태. 후단(DB·외부 API) 응답 지연, 락 경합, 트래픽 급증이 흔한 원인.
  vendor_url: https://tomcat.apache.org/tomcat-9.0-doc/config/http.html
  versions:
  - Tomcat 5.5
  - Tomcat 6.0
  - Tomcat 7.0
  - Tomcat 8.0/8.5
  - Tomcat 9.0
  - Tomcat 10.0/10.1
  - Tomcat 11.0
  version_note: 문구 기반 별칭 — Tomcat 5.5~11.0 공통(JVM·커넥터·JDBC 풀 공통 문구)
- code: TOMCAT-CONNECTOR-FAIL
  severity: critical
  category: connection
  title: 커넥터 초기화 실패
  immediate:
  - "`grep -n -A10 -E 'Failed to initialize|Failed to start connector|ProtocolHandler' $CATALINA_BASE/logs/catalina.out | tail -30` 로 실패 커넥터 포트·원인 예외(BindException·인증서·APR) 확인"
  - "`grep -n '<Connector' $CATALINA_BASE/conf/server.xml` 로 포트·protocol 확인 후 `ss -ltnp | grep ':<port> '` 로 포트 선점 프로세스 확인 — 다른 PID 가 점유하면 포트 충돌 확정"
  short:
  - "(2차·승인 후, 롤백: server.xml 백업 복원) 포트 충돌이면 선점 프로세스 정리 또는 포트 변경, 인증서·APR 오류면 keystore/tcnative 경로 수정 후 Tomcat 재기동"
  mid:
  - "Connector 구성(protocol·port·SSLHostConfig) 표준 틀과 서버별 포트 대장 운영"
  long:
  - "기동 후 Connector 포트 LISTEN 자동 점검과 server.xml 형상 관리"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: server.xml 의 Connector(HTTP/AJP) 가 초기화·기동 단계에서 실패해 해당 포트로 요청을 받지 못하는 상태. 포트 선점(BindException), 인증서·키스토어 오류, APR/tcnative 라이브러리 불일치, 잘못된 protocol 값이 흔한 원인.
  vendor_url: https://tomcat.apache.org/tomcat-9.0-doc/config/http.html
  versions:
  - Tomcat 5.5
  - Tomcat 6.0
  - Tomcat 7.0
  - Tomcat 8.0/8.5
  - Tomcat 9.0
  - Tomcat 10.0/10.1
  - Tomcat 11.0
  version_note: 문구 기반 별칭 — Tomcat 5.5~11.0 공통(JVM·커넥터·JDBC 풀 공통 문구)
- code: TOMCAT-SSL-INIT-FAIL
  severity: critical
  category: security
  title: SSL 초기화 실패
  immediate:
  - "`grep -n -A8 -i -E 'keystore|SSLHostConfig|certificate' $CATALINA_BASE/logs/catalina.out | tail -30` 로 원인 문구(Keystore was tampered with·Alias name·FileNotFound) 확인"
  - "`keytool -list -v -keystore <keystore경로> | grep -E 'Alias name|Valid until|유효 기간'` 로 별칭·만료일 확인(키스토어 비밀번호는 입력만, 기록 금지) — 만료·별칭 불일치면 확정"
  short:
  - "(2차·승인 후, 롤백: 기존 키스토어·server.xml 백업 보관 후 교체) 갱신 인증서로 키스토어 교체 또는 certificateKeystoreFile·certificateKeyAlias·비밀번호 수정, 체인(중간 인증서) 포함 확인 후 Tomcat 재기동"
  mid:
  - "인증서 갱신 절차서(발급→체인 검증 `openssl s_client -connect <host>:<port> -showcerts`→교체) 표준화"
  long:
  - "인증서 만료 60/30/7일 전 경보 등록"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: HTTPS Connector 의 SSLHostConfig 초기화 중 키스토어를 열지 못하거나 키 항목을 찾지 못해 TLS 커넥터가 기동되지 않은 상태. 키스토어 비밀번호 불일치, 별칭 오류, 파일 경로·권한, 만료·체인 누락 인증서가 흔한 원인.
  vendor_url: https://tomcat.apache.org/tomcat-9.0-doc/ssl-howto.html
  versions:
  - Tomcat 5.5
  - Tomcat 6.0
  - Tomcat 7.0
  - Tomcat 8.0/8.5
  - Tomcat 9.0
  - Tomcat 10.0/10.1
  - Tomcat 11.0
  version_note: 문구 기반 별칭 — Tomcat 5.5~11.0 공통(JVM·커넥터·JDBC 풀 공통 문구)
- code: TOMCAT-LISTENER-FAIL
  severity: critical
  category: internal
  title: 리스너 초기화 실패
  immediate:
  - "`grep -n -B2 -A20 -E 'Exception sending context initialized event|listenerStart' $CATALINA_BASE/logs/localhost.$(date +%Y-%m-%d).log | grep -E 'Exception|Caused by' | head -20` 로 실패 리스너와 최초 원인(Caused by) 확인"
  - "Manager `curl -s -u <user> http://localhost:<port>/manager/text/list` 로 해당 앱이 stopped 인지 확인 — 원인이 DB 연결이면 `nc -zvw3 <db_host> <db_port>` 로 도달성 확인"
  short:
  - "(2차·승인 후, 롤백: 이전 WAR 재배포) 원인(설정 파일·DB 접속 정보·누락 클래스) 수정 후 Manager reload 또는 재배포, 실패 지속이면 Tomcat 재기동"
  mid:
  - "ServletContextListener 초기화에서 외부 의존(DB·원격 설정) 실패 시 재시도·명확한 오류 메시지 처리 보완"
  long:
  - "배포 전 검증 환경 기동 시험과 기동 후 헬스체크 URL 자동 점검"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: 웹앱 기동 시 ServletContextListener(예 Spring ContextLoaderListener)의 contextInitialized 에서 예외가 나 컨텍스트가 시작되지 못한 상태. 설정 파일 오류, DB 접속 실패, 클래스 누락이 흔한 원인.
  vendor_url: https://tomcat.apache.org/tomcat-9.0-doc/config/context.html
  versions:
  - Tomcat 5.5
  - Tomcat 6.0
  - Tomcat 7.0
  - Tomcat 8.0/8.5
  - Tomcat 9.0
  - Tomcat 10.0/10.1
  - Tomcat 11.0
  version_note: 문구 기반 별칭 — Tomcat 5.5~11.0 공통(JVM·커넥터·JDBC 풀 공통 문구)
- code: TOMCAT-SERVLET-INIT-FAIL
  severity: error
  category: internal
  title: 서블릿 초기화 실패
  immediate:
  - "`grep -n -A20 -E 'Servlet.init\\(\\)|Allocate exception for servlet|threw load\\(\\) exception' $CATALINA_BASE/logs/localhost.$(date +%Y-%m-%d).log | grep -E 'servlet|Exception|Caused by' | head -20` 로 실패 서블릿 이름과 원인 확인"
  - "같은 시각 접근 로그에서 해당 서블릿 URI 의 500/404 건수 확인 — 일부 기능만 영향인지, 앱 전체(DispatcherServlet)인지 구분"
  short:
  - "(2차·승인 후, 롤백: 이전 WAR 재배포) 원인 설정(init-param·Spring 설정 파일)·의존 라이브러리 수정 후 재배포"
  mid:
  - "load-on-startup 서블릿의 초기화 의존성(DB·파일 경로)을 기동 전 점검 항목에 추가"
  long:
  - "배포 파이프라인에서 기동 시험·핵심 URI 스모크 시험 자동화"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: 서블릿의 init() 또는 load-on-startup 로딩에서 예외가 발생해 해당 서블릿이 사용 불가가 된 상태(요청 시 500). 잘못된 init-param·설정 파일, 누락 클래스·라이브러리 충돌이 흔한 원인.
  versions:
  - Tomcat 5.5
  - Tomcat 6.0
  - Tomcat 7.0
  - Tomcat 8.0/8.5
  - Tomcat 9.0
  - Tomcat 10.0/10.1
  - Tomcat 11.0
  version_note: 문구 기반 별칭 — Tomcat 5.5~11.0 공통(JVM·커넥터·JDBC 풀 공통 문구)
- code: TOMCAT-FILTER-FAIL
  severity: error
  category: internal
  title: 필터 초기화 실패
  immediate:
  - "`grep -n -A20 -E 'Exception starting filter|filterStart' $CATALINA_BASE/logs/localhost.$(date +%Y-%m-%d).log | grep -E 'filter|Exception|Caused by' | head -20` 로 실패 필터 이름·원인 확인"
  - "`grep -n -A3 '<filter>' <앱경로>/WEB-INF/web.xml` 로 filter-class·init-param 확인 — 클래스 누락(ClassNotFoundException)이면 배포 패키지 문제"
  short:
  - "(2차·승인 후, 롤백: 이전 WAR 재배포) 필터 클래스·의존 JAR·init-param 수정 후 재배포 — 보안 필터(인증·XSS)면 우회 없이 수정본으로만 복구"
  mid:
  - "필터 init() 에서 외부 의존 실패 처리 보완, 공통 필터 라이브러리 판 고정"
  long:
  - "배포 전 기동 시험에 필터 초기화 로그 검사 포함"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: web.xml 에 선언된 Filter 의 init() 에서 예외가 발생해 필터 체인을 구성하지 못하고 웹앱 기동이 실패(Error filterStart)한 상태. 필터 클래스 누락, init-param 오류, 의존 라이브러리 충돌이 흔한 원인.
  versions:
  - Tomcat 5.5
  - Tomcat 6.0
  - Tomcat 7.0
  - Tomcat 8.0/8.5
  - Tomcat 9.0
  - Tomcat 10.0/10.1
  - Tomcat 11.0
  version_note: 문구 기반 별칭 — Tomcat 5.5~11.0 공통(JVM·커넥터·JDBC 풀 공통 문구)
- code: TOMCAT-DEPLOY-FAIL
  severity: error
  category: internal
  title: 배포 실패
  immediate:
  - "`grep -n -A10 -E 'Error deploying|Error during deployment|deployWAR' $CATALINA_BASE/logs/catalina.out | tail -30` 로 실패 앱·원인 확인"
  - "`ls -l $CATALINA_BASE/webapps/` 와 `unzip -tq $CATALINA_BASE/webapps/<app>.war` 로 WAR 무결성·소유자·권한 확인, `df -h $CATALINA_BASE` 로 공간 확인"
  short:
  - "(2차·승인 후, 롤백: 이전 WAR 보관본 재배포) 손상 WAR 재전송·권한 수정 후 Manager deploy 또는 webapps 재배치, 실패 앱만 영향이면 Tomcat 전체 재기동은 피한다"
  mid:
  - "배포 절차(복사 완료 후 원자적 이동, autoDeploy 운영 해제·Manager 배포 사용) 표준화"
  long:
  - "배포본 체크섬 검증과 배포 이력·롤백 보관본 관리"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: Host 의 HostConfig 가 WAR·디렉터리·컨텍스트 XML 배포를 처리하다 실패한 상태. 손상·불완전 복사된 WAR, 파일 권한·디스크 공간 부족, 잘못된 context.xml 이 흔한 원인.
  vendor_url: https://tomcat.apache.org/tomcat-9.0-doc/config/host.html
  versions:
  - Tomcat 5.5
  - Tomcat 6.0
  - Tomcat 7.0
  - Tomcat 8.0/8.5
  - Tomcat 9.0
  - Tomcat 10.0/10.1
  - Tomcat 11.0
  version_note: 문구 기반 별칭 — Tomcat 5.5~11.0 공통(JVM·커넥터·JDBC 풀 공통 문구)
- code: TOMCAT-CLASSLOADER-LEAK
  severity: warn
  category: memory
  title: 클래스로더 누수 경고
  immediate:
  - "`grep -n -E 'appears to have started a thread|ThreadLocal with key|failed to unregister' $CATALINA_BASE/logs/catalina.out | tail -20` 로 누수 스레드·ThreadLocal·드라이버 이름 확인(Tomcat 8.5/9/10.1, Windows 서비스는 catalina.<날짜>.log)"
  - "`jmap -histo <PID> | grep WebappClassLoader` 의 #instances 로 남은 웹앱 클래스로더 수 확인(live 옵션 없이 — Full GC 유발 안 함, 배포 앱 수보다 많으면 redeploy 누수 의심) — Manager findleaks 는 Full GC 를 일으키므로 1차에서 쓰지 않는다"
  short:
  - "(2차·승인 후, 롤백: 이전 WAR 재배포) contextDestroyed 에서 앱 스레드·타이머 종료, ThreadLocal remove 처리를 넣은 패치 배포, Metaspace 여유가 적으면 Tomcat 재기동 일정 수립"
  mid:
  - "운영 중 반복 재배포(hot redeploy) 대신 재기동 배포로 전환, JreMemoryLeakPreventionListener 유지 확인"
