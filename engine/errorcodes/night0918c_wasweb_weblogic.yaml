product: weblogic
layer: was
note: Claude 야간 수집 2026-09-18 — 벤더 공식 문서와 대조 후 확정
codes:
- code: BEA-000110
  severity: error
  category: connection
  title: 멀티캐스트 소켓 수신 오류
  immediate:
  - '`grep -n -A 10 "BEA-000110" <DOMAIN_HOME>/servers/<server>/logs/<server>.log | tail -30` 으로 예외 확인, `ip -s link show <nic>` 로 NIC 오류·드롭 카운터 확인'
  - 클러스터 멀티캐스트 주소·포트와 네트워크 장비 IGMP 설정 확인
  short:
  - 멀티캐스트 대신 유니캐스트 클러스터 메시징 전환 검토
  mid:
  - 클러스터 네트워크 구성 표준
  long:
  - 클러스터 통신 모니터링
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://docs.oracle.com/cd/E13222_01/wls/docs90/messages/Cluster.html)
  vendor_cause: 클러스터 멀티캐스트 소켓에서 메시지를 수신하는 중 오류가 발생함 — NIC 이상, 멀티캐스트 라우팅·IGMP 미설정, 같은 주소를 쓰는 다른 클러스터와의 충돌이 흔한 원인이다.
  versions:
  - WebLogic 10.3.6
  - WebLogic 12.1.3
  - WebLogic 12.2.1.x
  - WebLogic 14.1.1
  - WebLogic 14.1.2
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: '-'
- code: BEA-000115
  severity: warn
  category: connection
  title: 멀티캐스트 메시지 유실
  immediate:
  - '`grep -n "BEA-000115" <DOMAIN_HOME>/servers/<server>/logs/<server>.log | tail -20` 으로 발생 시각이 서버 기동(클러스터 합류) 직후인지 확인 — 합류 직후 일시 발생이면 정상'
  - 운영 중 반복이면 같은 시각 GC 로그의 긴 정지와 `netstat -su | grep -i error`(UDP 수신 오류) 확인
  short:
  - 반복 시 멀티캐스트 TTL·버퍼와 스위치 IGMP snooping 설정 점검, 유니캐스트 클러스터 메시징 전환 검토
  mid:
  - 클러스터 Messaging Mode(unicast 권장)·멀티캐스트 주소 중복 정비
  long:
  - 클러스터 멤버 수·멀티캐스트 유실 건수 감시 경보
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://docs.oracle.com/cd/E13222_01/wls/docs90/messages/Cluster.html)
  vendor_cause: 클러스터 멀티캐스트 메시지 일부를 받지 못했다는 정보 메시지 — 안정된 클러스터에 서버가 새로 합류할 때 흔히 나타나며, 운영 중 지속되면 네트워크 손실·GC 정지를 의심한다.
  versions:
  - WebLogic 10.3.6
  - WebLogic 12.1.3
  - WebLogic 12.2.1.x
  - WebLogic 14.1.1
  - WebLogic 14.1.2
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: 멤버 자체 유실이 아니라 multicast message 유실
- code: BEA-000141
  severity: error
  category: connection
  title: TCP/IP 소켓 실패
  immediate:
  - "`grep -n -A 10 \"BEA-000141\" <DOMAIN_HOME>/servers/<server>/logs/<server>.log | tail -30` 으로 상대 서버 주소와 IOException 확인"
  - "네트워크 오류·클라이언트 측 연결 단절 여부 확인 — 상대 서버 포트 `nc -zvw3 <host> <port>`"
  short:
  - 소켓 관련 OS 자원(ulimit·포트) 점검
  mid:
  - 클러스터 멤버 간 방화벽 경로·idle timeout 을 WebLogic 하트비트보다 길게 정비
  long:
  - 멤버 간 네트워크 오류율·지연 감시
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://docs.oracle.com/cd/E13222_01/wls/docs90/messages/Cluster.html)
  vendor_cause: HTTP 로 다른 클러스터 멤버의 상태 덤프(state dump)를 가져오는 중 OS 수준 IOException 으로 TCP/IP 소켓 실패가 발생함 — 상대 서버 정지·네트워크 단절·방화벽 차단이 흔한 원인이다.
  versions:
  - WebLogic 10.3.6
  - WebLogic 12.1.3
  - WebLogic 12.2.1.x
  - WebLogic 14.1.1
  - WebLogic 14.1.2
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: '-'
- code: BEA-000144
  severity: warn
  category: internal
  title: Managed Server 중지·정지
  immediate:
  - '`grep -n "BEA-000144" <DOMAIN_HOME>/servers/<server>/logs/<server>.log | tail -10` 으로 대상 서버 이름·시각 확인 후 운영 작업 이력(계획 정지)과 대조'
  - WLST(`java weblogic.WLST` → `connect(url='t3://<admin_host>:<port>')`, 자격증명은 프롬프트 입력) 에서 `state('<server>')` 로 현재 상태(SUSPENDED·SHUTDOWN·RUNNING) 확인 — 계획 외 SHUTDOWN 이면 그 서버 로그의 마지막 Critical·Error 확인
  short:
  - '(2차·승인 후, 롤백: 해당 없음) 원인 확인 뒤 서버 기동 또는 resume, 계획 외 종료면 해당 서버 로그 원인 항목 조치'
  mid:
  - 계획 정지 시 공지·변경 요청 연계, Node Manager 자동 재기동 정책 점검
  long:
  - 서버 상태 감시(SUSPENDED·SHUTDOWN 경보)
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://docs.oracle.com/cd/E13222_01/wls/docs90/messages/Cluster.html)
  vendor_cause: 관리 대상 서버가 일시정지(SUSPENDED) 또는 종료되었음을 알리는 정보 메시지 — 관리자 작업이면 정상이며 계획되지 않았다면 그 서버의 직전 오류를 확인해야 한다.
  versions:
  - WebLogic 10.3.6
  - WebLogic 12.1.3
  - WebLogic 12.2.1.x
  - WebLogic 14.1.1
  - WebLogic 14.1.2
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: 공식 메시지는 suspended or shut down 알림
- code: BEA-000205
  severity: warn
  category: connection
  title: 포트 리슨 복구 완료
  immediate:
  - '`grep -nE "BEA-002616|BEA-000205" <DOMAIN_HOME>/servers/<server>/logs/<server>.log | tail -20` 으로 accept 실패와 복구 시각 확인 — 복구 후 재발이 없으면 정상'
  - '`ls /proc/<PID>/fd | wc -l` 와 `grep "open files" /proc/<PID>/limits` 비교로 FD 부족 재발 위험 확인 (Linux)'
  short:
  - accept 실패 원인(FD 한도·accept backlog) 점검 — BEA-002616 항목 조치를 따름
  mid:
  - nofile 한도·accept backlog 기준값을 OS 표준에 반영
  long:
  - FD 사용률 80% 경보
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://docs.oracle.com/cd/E17904_01/apirefs.1111/e14397/T3Srvr.html)
  vendor_cause: 클라이언트 연결 accept 중 소켓 예외로 물러났던(back off) 서버가 다시 포트 리슨을 시작했다는 알림 — 직전에 BEA-002616 등 accept 실패가 있었음을 뜻한다(10.3.6 카탈로그에 retired 표시).
  versions:
  - WebLogic 10.3.6
  - WebLogic 12.1.3
  - WebLogic 12.2.1.x
  - WebLogic 14.1.1
  - WebLogic 14.1.2
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: 실패 후 다시 리슨에 성공한 알림
- code: BEA-000236
  severity: warn
  category: thread
  title: 실행 스레드 중지 중
  immediate:
  - '`grep -nE "BEA-000236|BEA-000365" <DOMAIN_HOME>/servers/<server>/logs/<server>.log | tail -20` 로 종료 진행 순서와 시각 확인'
  - 관리 서버 로그와 Node Manager 로그(`<DOMAIN_HOME>/nodemanager/nodemanager.log`, 10.3.6 은 `<WL_HOME>/common/nodemanager/nodemanager.log`)에서 같은 시각 종료 요청 주체 확인, 작업 이력과 대조
  short:
  - 계획 외 종료면 종료 요청 주체(콘솔 사용자·스크립트·cron)를 확인하고 (2차·승인 후) 서버 기동
  mid:
  - 종료·기동을 변경 요청과 연결하는 운영 절차, 관리 작업 감사(Auditing Provider) 활성 검토
  long:
  - 서버 상태 비계획 전이 경보
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://docs.oracle.com/cd/E17904_01/apirefs.1111/e14397/T3Srvr.html)
  vendor_cause: 관리자가 종료 명령을 내려 실행 스레드를 정지하는 중이라는 정보 메시지 — 계획된 종료면 정상이며 계획 외라면 종료 요청 주체(콘솔·WLST·Node Manager·스크립트)를 확인한다.
  versions:
  - WebLogic 10.3.6
  - WebLogic 12.1.3
  - WebLogic 12.2.1.x
  - WebLogic 14.1.1
  - WebLogic 14.1.2
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: 공식 Info 메시지
- code: BEA-000437
  severity: error
  category: internal
  title: NIO 사용 시 SSL 미지원
  immediate:
  - '`grep -n -B2 -A5 "BEA-000437" <DOMAIN_HOME>/servers/<server>/logs/<server>.log` 로 문구 확인 — ''SSL is not supported when using nio'' 이면 오류(10.3.6), ''MuxerClass was overridden'' 이면 정보(12.2.1.x)'
  - 기동 인수의 muxer 지정 `ps -ef | grep "weblogic.Name=<server>" | grep -io "muxerclass=[^ ]*"` 와 `grep -n "native-io-enabled" <DOMAIN_HOME>/config/config.xml` 확인
  short:
  - '(2차·승인 후, 롤백: 원래 기동 인수 사본) NIO muxer 지정 인수 제거 또는 네이티브 I/O 설정 조정 후 다음 기동 시 SSL 리슨 확인'
  mid:
  - SSL 채널을 쓰는 서버의 muxer 설정 표준(임의 MuxerClass 지정 금지)
  long:
  - 기동 인수 형상 관리와 기동 로그 점검 항목화
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://docs.oracle.com/cd/E13222_01/wls/docs81b/messages/Socket.html)
  vendor_cause: NIO 소켓 muxer 사용 시 SSL 을 지원하지 않는다는 오류 — 네이티브 I/O 비활성 또는 표준 performance pack 사용이 필요하다(10.3.6 카탈로그 기준, 12.2.1.4 카탈로그의 같은 ID 는 MuxerClass 대체 알림 정보 메시지로 의미가 다르다).
  versions:
  - WebLogic 10.3.6
  - WebLogic 12.1.3
  - WebLogic 12.2.1.x
  - WebLogic 14.1.1
  - WebLogic 14.1.2
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: '버전별 의미 다름 — 10.3.6: ''SSL is not supported when using nio''(Error), 12.2.1.4: ''MuxerClass was overridden''(정보). 소켓 최대치와 무관'
- code: BEA-000446
  severity: warn
  category: internal
  title: 네이티브 IO 활성화
  immediate:
  - '`grep -nE "BEA-000446|BEA-000438" <DOMAIN_HOME>/servers/<server>/logs/<server>.log | tail -5` 로 기동 시 네이티브 I/O 활성(BEA-000446) 여부 확인 — BEA-000446 만 있으면 정상'
  - BEA-000438(로드 실패)이 함께 있으면 해당 항목 조치로 넘기고, 없으면 추가 조치 불필요
  short:
  - 정상 정보 — 조치 없음, 기동 점검표에 네이티브 I/O 활성 여부만 기록
  mid:
  - Java I/O 대체 시와의 처리량 차이를 부하 시험으로 확인(필요 시)
  long:
  - 기동 로그 정상 메시지 목록에 BEA-000446 포함
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://docs.oracle.com/cd/E13222_01/wls/docs100/messages/Socket.html)
  vendor_cause: 네이티브 I/O(performance pack)가 활성화되었다는 정보 메시지 — 정상 기동 신호이며 별도 조치가 필요 없다.
  versions:
  - WebLogic 10.3.6
  - WebLogic 12.1.3
  - WebLogic 12.2.1.x
  - WebLogic 14.1.1
  - WebLogic 14.1.2
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: 입력 의미와 반대인 Info 메시지
- code: BEA-001155
  severity: warn
  category: internal
  title: JDBC 예외 스택 출력
  immediate:
  - '`grep -n -A 25 "BEA-001155" <DOMAIN_HOME>/servers/<server>/logs/<server>.log | head -50` 으로 뒤따르는 예외 클래스·ORA-·SQLState 확인'
  - 예외가 연결 획득 실패면 WLST(`java weblogic.WLST` → `connect(url='t3://<admin_host>:<port>')`, 자격증명은 프롬프트 입력) 에서 `domainRuntime()` → `cd('ServerRuntimes/<server>/JDBCServiceRuntime/<server>/JDBCDataSourceRuntimeMBeans/<ds>')` → `get('WaitingForConnectionCurrentCount')`·`get('ActiveConnectionsCurrentCount')` 확인
  short:
  - 예외 종류별로 DB 오류(ORA-)·풀 고갈·애플리케이션 SQL 오류 담당에 나누어 전달
  mid:
  - '(2차·승인 후, 롤백: 원래 값 기록) 풀 고갈이면 Maximum Capacity·Inactive Connection Timeout 조정'
  long:
  - JDBC 예외 건수·풀 대기 수 감시
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://docs.oracle.com/cd/E29542_01/apirefs.1111/e14397/JDBC.html)
  vendor_cause: JDBC 하위시스템이 예외 스택을 출력하기 직전에 남기는 정보 메시지 — 메시지 자체보다 뒤따르는 예외(SQLException·연결 오류)가 실제 원인이다.
  versions:
  - WebLogic 10.3.6
  - WebLogic 12.1.3
  - WebLogic 12.2.1.x
  - WebLogic 14.1.1
  - WebLogic 14.1.2
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: 풀 최대 용량 메시지가 아님
- code: BEA-101019
  severity: error
  category: internal
  title: 서블릿 IOException 발생
  immediate:
  - '`grep -n -A 15 "BEA-101019" <DOMAIN_HOME>/servers/<server>/logs/<server>.log | head -40` 으로 웹앱 컨텍스트와 IOException 문구(Broken pipe·Connection reset·timeout) 확인'
  - 액세스 로그 `<DOMAIN_HOME>/servers/<server>/logs/access.log` 에서 같은 시각 요청 처리 시간 확인, 앞단 LB·웹서버 타임아웃과 비교
  short:
  - 앞단 타임아웃보다 긴 요청 URI 를 식별해 처리 지연 원인(DB·외부 연동) 담당에 전달
  mid:
  - 앞단 LB·웹서버·WebLogic 타임아웃 계층 정합(앞단이 가장 길게)
  long:
  - URI 별 응답 시간 상위 목록 정기 점검
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://docs.oracle.com/cd/E13222_01/wls/docs90/messages/HTTP.html)
  vendor_cause: 요청 처리 중 서블릿이 예기치 않은 IOException 을 받음 — 클라이언트 연결 종료(Broken pipe)·앞단 타임아웃·업로드/다운로드 스트림 오류가 흔하나 그것만으로 단정하지 않는다.
  versions:
  - WebLogic 10.3.6
  - WebLogic 12.1.3
  - WebLogic 12.2.1.x
