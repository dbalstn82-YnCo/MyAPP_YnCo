product: linux
layer: os
note: GPT 협업 수집분 — 벤더 공식 문서와 대조 후 확정
codes:
- code: LNX-AUDIT-BACKLOG
  severity: warn
  category: capacity
  title: audit 백로그 초과
  vendor_cause: '커널 감사 큐가 audit_backlog_limit(auditctl -b 값, 커널 기본 64) 을 넘어 ''audit: backlog limit exceeded'' 를 남긴 상태 — auditd 가 이벤트를 늦게 소비(디스크 지연·auditd 정지)하거나 감시 규칙이 과도해 이벤트가 폭주하면 발생하며, failure 플래그(-f 1 기록·2 패닉)에 따라 이벤트 유실 또는 패닉으로 이어진다.'
  immediate:
  - '`auditctl -s` 로 enabled·failure·backlog_limit·lost·backlog 값 확인 — backlog 가 backlog_limit 에 근접하거나 lost 가 증가 중이면 확정 (failure 2 면 패닉 위험, 즉시 2차 통보)'
  - '`journalctl -k --since ''-2 hours'' | grep -i ''backlog limit'' | tail -20` (RHEL 7+) / `grep -i ''backlog limit'' /var/log/messages | tail -20` (RHEL 6) 로 발생 빈도·시각 확인'
  - '`systemctl status auditd` (RHEL 7+) / `service auditd status` (RHEL 6) 와 `auditctl -l | wc -l` 로 auditd 동작·규칙 수 확인'
  short:
  - (2차) `aureport --summary -i` 와 `aureport -k --summary` 로 이벤트를 많이 만드는 규칙 key·syscall 식별 후 불필요 규칙 제외안 작성
  - '(2차·승인 후, 롤백: 원래 -b 값 복원) /etc/audit/rules.d/*.rules 의 `-b` 값 상향(예: 8192→16384) 후 `augenrules --load` (RHEL 7+, auditd 재시작이 필요하면 `service auditd restart` — systemctl 로는 중지 거부)'
  mid:
  - auditd.conf 의 `flush`·`freq`·`log_format` 과 감사 로그 디스크 성능 점검, 감시 범위가 넓은 syscall 규칙을 경로·auid 조건으로 축소
  long:
  - '`auditctl -s` 의 lost·backlog 값을 주기 수집해 lost 증가 시 경보, 감사 규칙 변경은 보안 담당 승인·성능 시험 후 반영'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - RHEL 5~10
  - CentOS 6~Stream 9
  - Rocky/Alma 8~9
  - Ubuntu 16.04~24.04
  - SLES 12~15
  version_note: '''audit: backlog limit exceeded'' 2.6.18+'
- code: LNX-AUDIT-DISK-FULL
  severity: critical
  category: disk
  title: 감사 로그 디스크 부족
  vendor_cause: auditd 가 감사 로그 파일시스템(/var/log/audit) 여유가 space_left·admin_space_left 이하이거나 가득 찬 것을 감지한 상태 — auditd.conf 의 space_left_action·admin_space_left_action·disk_full_action(SUSPEND·SINGLE·HALT 등) 설정에 따라 감사 중단이나 시스템 정지까지 이어질 수 있다.
  immediate:
  - '`df -h /var/log/audit ; df -i /var/log/audit` 로 사용률 확인 — 95% 이상이면 확정'
  - '`grep -E ''^(max_log_file|num_logs|max_log_file_action|space_left|admin_space_left|disk_full_action)'' /etc/audit/auditd.conf` 로 동작 설정 확인 — HALT·SINGLE 이면 시스템 정지 위험, 즉시 2차 통보'
  - '`ls -lh /var/log/audit/ | tail -20` 으로 로그 파일 수·크기 확인 (이동·정리는 2차)'
  short:
  - '(2차·승인 후, 롤백: 보관본 복원) 오래된 audit.log.N 을 보관 서버로 복사·검증 후 정리 — 보안 감사 보존 기간 확인 필수, 이후 `service auditd rotate` 로 순환'
  mid:
  - /var/log/audit 를 별도 파일시스템(LV)으로 분리하고 auditd.conf `max_log_file`·`num_logs`·`max_log_file_action = ROTATE` 를 보존 정책에 맞춰 설정
  long:
  - /var/log/audit 사용률 80% 경고·90% 위험 감시와 감사 로그 원격 전송(audisp-remote 또는 rsyslog) 으로 로컬 누적 방지
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - RHEL 5~10
  - CentOS 6~Stream 9
  - Rocky/Alma 8~9
  - Ubuntu 16.04~24.04
  - SLES 12~15
  version_note: auditd 데몬 문구 전 버전
- code: LNX-JOURNAL-CORRUPT
  severity: warn
  category: storage
  title: journald 손상
  vendor_cause: systemd-journald 가 저널 파일(*.journal)이 손상되었거나 정상 종료되지 않은 것을 발견해 해당 파일을 '~' 접미사로 바꿔 두고 새 파일에 기록을 이어 가는 상태 — 비정상 종료·전원 차단·디스크 I/O 오류·공간 부족이 흔한 원인.
  immediate:
  - '`journalctl --verify 2>&1 | grep -i fail | head` 로 손상 파일 목록 확인 (RHEL 7+·Ubuntu 16.04+) — FAIL 이 있으면 해당 파일 손상 확정'
  - '`journalctl --disk-usage ; df -h /var/log/journal /run/log/journal` 로 저널 용량·파일시스템 여유 확인'
  - '`dmesg | grep -iE ''I/O error|EXT4-fs error|XFS'' | tail -20` 로 하위 디스크 오류 동반 여부 확인 — 동반 시 LNX-BUFFER-IO 절차 우선'
  short:
  - '(2차·승인 후, 롤백: 원본 사본 보관) 손상 파일(*.journal~)을 보관 경로로 복사한 뒤 `journalctl --rotate` (RHEL 8+) 로 새 파일 시작, 원본은 보존 기간 경과 후 정리'
  mid:
  - /etc/systemd/journald.conf 의 `Storage=persistent`·`SystemMaxUse`·`SystemKeepFree` 를 디스크 용량에 맞게 설정, 디스크 오류가 있었으면 smartctl 진단 결과로 교체 판단
  long:
  - '`journalctl --verify` 주 1회 정기 점검 결과 감시와 비정상 종료(전원·패닉) 재발 방지, 중요 로그는 rsyslog 원격 이중 기록'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - RHEL 7~10
  - CentOS 7~Stream 9
  - Rocky/Alma 8~9
  - Ubuntu 16.04~24.04
  - SLES 12~15
  version_note: journald 전용 — RHEL 7+·Ubuntu 16.04+·SLES 12+
- code: LNX-SYSTEMD-WATCHDOG
  severity: error
  category: thread
  title: systemd 워치독 타임아웃
  vendor_cause: WatchdogSec= 가 설정된 서비스가 정해진 시간 안에 sd_notify('WATCHDOG=1') 신호를 보내지 않아 systemd 가 워치독 타임아웃으로 판단한 상태 — systemd 는 해당 서비스를 실패 처리하고 SIGABRT(WatchdogSignal=)로 종료한 뒤 Restart= 설정대로 재기동한다. 서비스 내부 행(교착·무한 루프)·심한 CPU/I/O 지연이 흔한 원인.
  immediate:
  - '`journalctl -u <service> --since ''-1 hour'' | grep -iE ''watchdog|dumped core|Main process exited'' | tail -20` 로 타임아웃 시각·종료 신호 확인'
  - '`systemctl show <service> -p WatchdogUSec -p Restart -p NRestarts -p ActiveState` 로 워치독 시간·Restart 정책·자동 복구 횟수(NRestarts)·현재 상태 확인 (NRestarts 는 RHEL 8+)'
  - '`coredumpctl list | tail -5` 로 SIGABRT 코어 생성 여부 확인 (systemd-coredump 사용 시, RHEL 8+)'
  short:
  - '(2차) `coredumpctl info <PID>` 와 서비스 로그로 행 지점 분석, 반복되면 (승인 후, 롤백: drop-in 삭제 후 daemon-reload) `systemctl edit <service>` 로 WatchdogSec 임시 상향'
  mid:
  - 애플리케이션의 WATCHDOG=1 송신 주기를 WatchdogSec 의 절반 이하로 맞추고 행 원인(락·외부 호출 대기) 수정판 배포
  long:
  - 서비스별 NRestarts·워치독 이벤트 수 감시(일 1회 이상 경보), 워치독 설정값을 서비스 기준서에 기록
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - RHEL 7~10
  - CentOS 7~Stream 9
  - Rocky/Alma 8~9
  - Ubuntu 16.04~24.04
  - SLES 12~15
  version_note: systemd 전용 — RHEL 5/6(sysvinit/upstart) 없음
- code: LNX-DOCKER-OOM
  severity: error
  category: memory
  title: 컨테이너 OOM
  vendor_cause: 컨테이너에 지정된 메모리 한도(docker --memory → cgroup memory.limit_in_bytes / v2 memory.max) 를 넘어 커널 memcg OOM 이 컨테이너 안의 프로세스를 종료한 상태 — 한도 과소 설정, 애플리케이션 메모리 누수, JVM 힙이 컨테이너 한도보다 크게 잡힌 경우가 흔한 원인.
  immediate:
  - '`docker ps -a --format ''{{.Names}} {{.Status}}'' | head -20` 와 `docker inspect --format ''{{json .State}}'' <container>` 로 종료 상태·OOM 플래그(true 면 확정) 확인'
  - '`docker stats --no-stream | head -20` 으로 컨테이너별 현재 메모리 사용률(MEM %) 확인'
  - '`journalctl -k --since ''-2 hours'' | grep -iE ''memory cgroup out of memory|oom'' | tail -20` 로 커널 기록·cgroup 경로 확인'
  short:
  - '(2차·승인 후, 롤백: 이전 한도로 재생성) 컨테이너 메모리 한도(`--memory`) 상향 또는 JVM 은 `-XX:MaxRAMPercentage` 로 힙을 한도의 70~75% 로 맞춘 뒤 재배포'
  mid:
  - 부하 시험으로 컨테이너별 최대 메모리 사용량을 측정해 한도·요청량을 재산정하고 힙 덤프로 누수 여부 확인
  long:
  - 컨테이너 메모리 사용률 85% 경고와 OOM 이벤트(`docker events --filter event=oom`) 수집·경보 운영
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - RHEL 7~10
  - CentOS 7~Stream 9
  - Rocky/Alma 8~9
  - Ubuntu 16.04~24.04
  - SLES 12~15
  version_note: docker/containerd — RHEL 7+·Ubuntu 16.04+ 이상에서만 운영
