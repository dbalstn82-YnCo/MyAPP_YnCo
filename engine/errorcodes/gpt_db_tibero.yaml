- code: TBR-12033
  severity: error
  category: lock
  title: NOWAIT 잠금 실패
  immediate:
  - "실패한 문장·객체부터: `grep -n -B5 -A2 -E 'TBR-12033|ec=-12033|LOCKFAIL_IN_NOWAIT' $(ls -tr $TB_HOME/instance/$TB_SID/log/slog/* | tail -5) | tail -80` (sys.log 포함 회전 파일 — GTS 사례상 slog 에는 `ec=-12033` 또는 `ERROR_LOCKFAIL_IN_NOWAIT` 로 찍혀 TBR-12033 문자열만으로는 놓친다) — 장애 시각에 실패한 문장이 DDL(ALTER TABLE·테이블 제거·CREATE INDEX 등)인지 SELECT … FOR UPDATE NOWAIT 인지와 소유자.객체 이름 기록(GTS 사례상 대부분 DDL 이 사용 중인 객체의 잠금을 못 얻은 경우)"
  - "그 객체의 DDL 객체 잠금만: tbsql `select object_id, owner, object_name from dba_objects where owner = '<OWNER>' and object_name = '<OBJECT>';` 뒤 `select * from v$lock where type = 'WLOCK_DD_OBJ' and id2 = <object_id>;`(TAC 는 gv$lock — INST_ID·SESS_ID 를 짝으로 기록해 gv$session 과 맞춘다) — GTS 사례상 DDL 객체 잠금은 TYPE 'WLOCK_DD_OBJ', ID1 = 소유자 ID, ID2 = 객체 ID(또는 이름 해시)이며 `id1 = X or id2 = X` 꼴은 무관한 잠금까지 잡으므로 쓰지 않는다. 나온 SESS_ID 가 상대 트랜잭션 후보 — 보유/요청(LMODE·REQUESTED)은 결과 머리글로 확인하고 단정하지 않는다, 0행이면 이미 끝났거나 ID2 가 이름 해시인 경우라 `select * from v$lock where type = 'WLOCK_DD_OBJ';`(TAC 는 `select * from gv$lock where type = 'WLOCK_DD_OBJ';` — 다른 노드 잠금을 놓치지 않게) 로 넓히되 넓힌 결과는 보유자가 아니다 — 그 행의 ID1(소유자)·ID2 와 세션의 SQL·접속 시각이 실패한 DDL 의 객체·발생 시각과 맞는 것만 후보로 적고, 맞는 것이 없으면 '보유자 미확인'으로 남긴다. 권한 관련 DDL(GRANT·REVOKE 등)은 다른 WLOCK 유형일 수 있어 이 조회 0행이 잠금 없음을 뜻하지 않는다(GTS 사례·교차 검토 전달, 원문 직접 대조 못 함)"
  - "상대 세션 식별: `select * from v$session where sid = <sess_id>;`·`select * from v$sql where sql_id = '<sql_id>';`(TAC 는 `select * from gv$session where inst_id = <INST_ID> and sid = <SESS_ID>;`·gv$sql)로 업무 확인 — 행이 없으면 지금 조회로는 보유자를 확인할 수 없는 상태다(트랜잭션 종료일 수도, 조회 권한·범위나 TAC 인스턴스 불일치일 수도 있다 — 셋을 구분해 적고, 직접 보유 증거가 없으면 '보유자 미확인'으로 남긴다. NOWAIT 은 기다리지 않고 즉시 실패하므로 조회 시점에 이미 상황이 바뀌었을 수 있다). COMMIT/ROLLBACK 은 업무 담당이, DDL 은 업무 트랜잭션이 없는 시간대로 재일정"
  short:
  - "(2차·승인 후, 롤백: 해당 없음) 업무 확인 후 상대 트랜잭션 종료 요청 또는 DDL 재일정, NOWAIT 사용 로직은 재시도 간격 추가"
  mid:
  - DDL과 DML의 동시 수행정책과 잠금 순서를 조정
  long:
  - 온라인 변경 절차와 잠금 사전점검을 표준화
  source: GPT 수집·벤더 문서 대조 완료(https://docs.tibero.com/tibero-manuals)
  vendor_cause: NOWAIT 모드에서 락 획득에 실패함 — 기다리지 않는 잠금 요청이 다른 세션이 쓰고 있는 자원 때문에 바로 실패한 상태. Tibero GTS 사례상 대부분은 트랜잭션이 사용 중인 객체에 DDL(ALTER/DROP TABLE·CREATE INDEX 등)이 객체 잠금을 얻지 못한 경우이며, SELECT … FOR UPDATE NOWAIT 같은 명시적 NOWAIT 요청도 원인 후보이나 그 사례 문서로는 직접 입증되지 않았다(미검증 후보 — DDL 원인과 구별해 기록). 상대가 사용자 세션이 아니라 DB 내부 작업(internal task)의 잠금일 수도 있다(교차 검토 전달, 미검증 후보 — 세션 조회로 사용자 세션이 안 나오면 이 가능성도 적는다).
  verify_note: "미검증 — GTS 사례 'ERROR 12033_LOCKFAIL_IN_NOWAIT 해결방안 (TMOTS014, 6FS07)'(2차 교차 검토 전달) 기준, 원문 직접 대조 못 함(docs.tmaxsoft.com/GTS 접속 불가 — 3차 교차 검토자는 원문을 직접 확인했다고 전함, 우리는 대조 못 함·문서 적용 판 6FS07 과 설치 판 차이는 따로 확인): SELECT … FOR UPDATE NOWAIT 가 이 코드의 원인이라는 점(사례로 직접 입증 안 됨), 내부 작업(internal task)과의 잠금 경합 가능성, slog 의 ec=-12033·ERROR_LOCKFAIL_IN_NOWAIT 표기, DDL 객체 잠금 TYPE 'WLOCK_DD_OBJ'·ID1 = 소유자 ID·ID2 = 객체 ID(또는 이름 해시), DDL 위주라는 점, LMODE·REQUESTED·SESS_ID 의미(교차 검토자는 그 문서에 정의돼 있다고 전함 — 보유/요청은 결과 머리글로 확인하고 단정하지 않는다). V$SESSION 세션 번호 컬럼(SID 로 가정)·GV$ 뷰의 INST_ID 칸·DBA_OBJECTS.OBJECT_ID 도 Tibero 공식 참조 안내서로 확인하지 못함"
  vendor_action: 잠시 기다린 후 다시 시도하십시오.
  vendor_url: https://docs.tibero.com/tibero-manuals/tibero_7.2.5./7.2.5.manuals/tibero-error-reference-guide/chapter-12000.frame.error
  versions:
  - Tibero 4
  - Tibero 5/5 SP1
  - Tibero 6
  - Tibero 7
  version_note: TBR-nnnnn 코드 체계는 4~7 공통으로 수집(5→6→7 번호 재편 근거 없음 — GPT B). 6/7 sys.log 는 [ISO시각] [COM-nnn] [I/W/E] 형식(파서 대응), 6 EOS 2025-03-31·Extended 2028-03-31
- code: TBR-12034
  severity: error
  category: lock
  title: WAIT 잠금 시간초과
  immediate:
  - "tbsql 로 DBA 접속 후 `select sess_id, type, id1, id2, lmode, requested, ctime from v$lock order by ctime desc;` — 같은 ID1 에 LMODE 보유 세션과 REQUESTED 대기 세션이 함께 보이면 보유 세션이 원인 (Tibero V$LOCK 은 SESS_ID·REQUESTED 컬럼)"
  - "보유 세션: `select sid, serial#, username, status, sql_id, wait_event, logon_time, prog_name from v$session where sid=<보유 SESS_ID>;` — 유휴(미커밋) 세션이 오래 보유 중이면 확정"
  short:
  - "(2차·승인 후, 롤백: 해당 없음 — 종료 세션의 미커밋 변경은 취소됨) 업무 담당 확인 뒤 보유 세션에 커밋/롤백 요청, 응답이 없으면 SYS 가 해당 세션 종료(구문은 Tibero SQL Reference 의 ALTER SYSTEM KILL SESSION)"
  - 장기 트랜잭션과 lock wait 설정을 점검
  mid:
  - 트랜잭션 범위와 배치 동시성을 개선
  long:
  - 잠금 대기 모니터링과 타임아웃 기준을 운영
  source: GPT 수집·벤더 문서 대조 완료(https://docs.tibero.com/tibero-manuals)
