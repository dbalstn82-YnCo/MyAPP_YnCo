codes:
- code: ESB-ADAPTER-DOWN
  severity: critical
  category: upstream
  title: 어댑터 비정상(추정)
  immediate:
  - "`grep -n -i -E \"adapter.*(down|stopped|dead|not)|어댑터\" <esb_log> | tail -30` 으로 정지 어댑터 이름·시각과 직전 오류 확인"
  - "어댑터의 연계 대상 host:port 로 `nc -zvw3 <host> <port>` 실행, ESB 관리 화면에서 어댑터 상태를 조회(변경 없이) — 영향 인터페이스 목록 기록"
  short:
  - "(2차·승인 후) 장애 인터페이스 격리(수신 보류) 후 원인 해소 뒤 어댑터 기동, 실패 거래 재처리는 업무 담당 확인 후(롤백: 격리 해제·기동 전 설정 사본 보관)"
  - "어댑터 설정과 연결 대상 주소 및 최근 변경사항을 점검"
  mid:
  - 어댑터 재기동과 연결 설정을 정상화하고 실패 거래를 재처리
  long:
  - 어댑터 상태 모니터링과 자동복구 및 이중화 정책을 운영
  vendor_cause: "자체 정의 의사코드 — 로그 문구(adapter down/stopped/not running·어댑터 중지)가 특정 연계 어댑터가 정지했거나 기동되지 않은 상태임을 가리킨다. 연계 대상 장애로 인한 자동 정지·어댑터 설정 오류·JVM 자원 고갈이 흔한 원인."
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - MESIM ESB/APIG/EAI (메타빌드, 납품 버전 기준)
  version_note: 메타빌드 MESIM 의사코드(문구 추정) — 제품 버전별 문구 차이 미확인(공개 레퍼런스 없음), 납품 구성(Apache Camel·Jetty·Hystrix 기반 레거시 룰) 기준 전 버전 수집
- code: ESB-DB-CONNECT-FAIL
  severity: critical
  category: connection
  title: DB 연계 실패(추정)
