codes:
- code: java.lang.OutOfMemoryError
  severity: critical
  category: memory
  title: Java 힙 객체 할당 실패 / 클래스 메타데이터 공간 고갈 / 새 네이티브 스레드 생성 실패
  immediate:
  - "`grep -n 'OutOfMemoryError' <log> | head -20` 로 첫 발생 시각과 종류(Java heap space·GC overhead limit exceeded·Metaspace·unable to create native thread·Direct buffer memory) 구분 — 종류에 따라 아래 확인 대상이 다름"
  - "힙·Metaspace: `jstat -gcutil <PID> 1000 5` 로 O(Old)·M(Metaspace) 사용률과 FGC 증가 확인 — O 또는 M 이 95% 이상에서 FGC 가 계속 늘면 고갈 확정, 용량은 `jcmd <PID> GC.heap_info`(JDK 9+, JVM 실행 계정으로)"
  - "native thread: `ps -o nlwp= -p <PID>` 와 `grep -E 'Max processes|Max open files' /proc/<PID>/limits` 로 스레드 수·한도 비교 — 스레드 수가 한도에 근접하면 OS 자원 한도 원인 확정(Linux)"
  short:
  - '2차 이관 기준: 반복 OOM·서비스 응답불가·GC 과다 또는 메모리 지속 증가 시 JVM/애플리케이션 담당 이관'
  - '2차 이관 기준: 반복 발생·재배포 후 지속 증가·클래스로더 누수 의심 시 JVM/개발 담당 이관'
  - "(2차·승인 후, 롤백: 없음 — 덤프 파일은 디스크 여유 확인 후 별도 경로 보관) `jcmd <PID> GC.heap_dump <path>/heap.hprof` 로 힙 덤프 확보(전체 GC 동반·수 초~수십 초 응답 정지, JDK 7+) 뒤 인스턴스 재기동으로 서비스 우선 복구"
  mid:
  - "힙 덤프(MAT Leak Suspects)·GC 로그로 누수 객체를 특정해 소스 수정, 실사용량 기준으로 -Xmx·-XX:MaxMetaspaceSize 재산정(서버 메모리 60~70% 이내)"
  - "-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=<path> 와 GC 로그(JDK 9+: -Xlog:gc*, JDK 8: -Xloggc) 상시 설정"
  long:
  - "jstat -gcutil Old(O)·Metaspace(M) 사용률 85% 지속 시 경보, 배포 전 부하 시험에서 힙 증가 추이 확인을 표준화"
  source: GPT 수집·공식 문서 대조(등급 A) https://docs.oracle.com/javase/8/docs/technotes/guides/troubleshoot/memleaks002.html, https://docs.oracle.com/en/java/javase/17/troubleshoot/diagnostic-tools.html
  vendor_cause: '[Java heap space] 힙에 새 객체를 할당할 공간이 없고 GC로도 충분한 공간을 확보하지 못함; 메모리 누수 또는 힙 크기 부족 가능 / [Metaspace] 클래스 메타데이터용 Metaspace가 부족하거나 MaxMetaspaceSize 제한에 도달함 / [unable to create native thread] JVM이
    새 OS 스레드를 만들 자원을 확보하지 못한 상태; 실제 원인은 OS/JVM 자원 상태 추가 확인 필요'
  vendor_action: 예외 상세문구·발생시각·JVM -Xms/-Xmx·GC 로그·프로세스 메모리 추이를 확인하고 반복 빈도와 직전 부하를 기록
  vendor_url: https://docs.oracle.com/javase/8/docs/technotes/guides/troubleshoot/memleaks002.html
  versions:
  - JDK 6
  - JDK 7
  - JDK 8
  - JDK 11
  - JDK 17
  - JDK 21
  - JDK 25
  version_note: '문구가 버전에 따라 다름: ''PermGen space''(≤7) → ''Metaspace''·''Compressed class space''(8+), ''unable to create native thread: possibly out of memory or process/resource limits reached''(11+),
    ''GC overhead limit exceeded''(6+), ''Java heap space''·''Direct buffer memory'' 공통'
- code: java.lang.StackOverflowError
  severity: critical
  category: app
  title: 스레드 스택 공간 고갈 — 소스(애플리케이션) 결함 가능성, WAS/WEB 장애 아님
  immediate:
  - "`grep -n -A60 'java.lang.StackOverflowError' <log> | head -80` 로 반복 프레임 확인 — 같은 클래스.메서드가 수십 번 연속되면 재귀·순환 참조(toString/JSON 직렬화) 결함"
  - "`grep -c 'StackOverflowError' <log>` 로 건수 확인 후 같은 시각 액세스 로그의 요청 URI 대조 — 특정 요청·입력값에만 몰리면 입력 데이터 기인"
  - "`jinfo -flag ThreadStackSize <PID>` 로 현재 스레드 스택 크기(KB) 확인 — 운영 설정(-Xss)으로 기본값보다 작게 줄여 놓았는지 판단(읽기 전용)"
  short:
  - '2차 이관 기준: 동일 호출 반복·다수 요청 재현 또는 업무 중단이 확인되면 개발/WAS 담당 이관'
  mid:
  - "반복 프레임의 재귀 종료 조건을 수정(반복문 전환), 깊은 재귀가 정상 설계라면 -Xss(스레드 스택) 상향을 시험 후 적용"
  long:
  - "재귀·순환 참조(toString/JSON 직렬화) 점검을 코드 리뷰 항목에 넣고 StackOverflowError 건수를 감시"
  source: GPT 수집·공식 문서 대조(등급 A) https://docs.oracle.com/en/java/javase/26/docs/api/java.base/java/lang/StackOverflowError.html
