  regex: (authoriz|permission|권한).*(denied|fail|거부|없)|\b403\b|Forbidden
- product: mesim-apig
  code: APIG-API-NOT-PUBLISHED
  regex: (not published|unpublished|미공개|미배포)|API.*not (found|registered)
- product: mesim-apig
  code: APIG-API-DISABLED
  regex: (disabled|blocked|차단|비활성).*(API|api)|API.*(disabled|blocked|차단|비활성)
- product: mesim-apig
  code: APIG-ROUTE-FAIL
  regex: '[Rr]out(e|ing).*(fail|error|not found)|No route|라우팅.*(실패|오류)|\b404\b'
- product: mesim-apig
  code: APIG-BACKEND-CONNECT-FAIL
  regex: '[Bb]ackend.*(connect|Connection).*(fail|refused)|Connection refused|ConnectException|HttpHostConnectException'
- product: mesim-apig
  code: APIG-BACKEND-TIMEOUT
  regex: '[Bb]ackend.*(timeout|timed out)|\b504\b|Gateway Time-?out|SocketTimeoutException|Read timed out'
- product: mesim-apig
  code: APIG-BACKEND-DOWN
  regex: '[Bb]ackend.*(down|unavailable|not available)|\b502\b|Bad Gateway|백엔드.*(장애|다운)'
- product: mesim-apig
  code: APIG-TRAFFIC-LIMIT
  regex: (rate|traffic|throttl|유량|TPS).*(limit|exceed|제한|초과)|\b429\b|Too Many Requests
- product: mesim-apig
  code: APIG-TRAFFIC-SPIKE
  regex: (traffic|트래픽).*(spike|surge|급증|burst)|request.*(spike|surge)
- product: mesim-apig
  code: APIG-CIRCUIT-OPEN
  regex: '[Cc]ircuit.*(open|breaker)|서비스 차단|CircuitBreaker'
- product: mesim-apig
  code: APIG-LOADBALANCE-FAIL
  regex: (load ?balanc|LB).*(fail|error)|부하분산.*(실패|오류)|no available (node|instance)
- product: mesim-apig
  code: APIG-CACHE-FAIL
  regex: '[Cc]ache.*(fail|error)|캐시.*(실패|오류)'
- product: mesim-apig
  code: APIG-FORMAT-CONVERT-FAIL
  regex: (convert|transform|변환).*(fail|error|실패|오류)|JsonParseException|SAXParseException
- product: mesim-apig
  code: APIG-GATEWAY-DOWN
  regex: '[Gg]ateway.*(down|stopped|dead|fail)|게이트웨이.*(장애|다운|중지)'
- product: mesim-apig
  code: APIG-QOS-DEGRADE
  regex: (QoS|quality|품질).*(degrad|저하|낮)|SLA.*(violat|breach)
- product: mesim-apig
  code: APIG-EVENT-ALERT
  regex: (EVENT|ALERT|이벤트|경보).*(발생|raised|triggered)
- product: mesim-apig
  code: APIG-OPENAPI-PROCESS-FAIL
  regex: (OpenAPI|Open API|API).*(process|처리).*(fail|error|실패|오류)|\b500\b|Internal Server Error
- product: mesim-eai
  code: ESB-ADAPTER-DOWN
  regex: '[Aa]dapter.*(down|stopped|dead|not (running|available))|어댑터.*(중지|정지|다운)'
- product: mesim-eai
  code: ESB-DB-CONNECT-FAIL
  regex: '(JDBC|DB|Database).*(connect|Connection).*(fail|refused|timed? ?out)|SQLException.*(connect|Connection)|IO Error: The Network Adapter'
- product: mesim-eai
  code: ESB-FILE-TRANSFER-FAIL
  regex: '[Ff]ile.*(transfer|send|receive).*(fail|error)|파일.*(전송|수신).*(실패|오류)'
- product: mesim-eai
  code: ESB-WAS-CONNECT-FAIL
  regex: WAS.*(connect|Connection).*(fail|refused)
- product: mesim-eai
  code: ESB-MW-CONNECT-FAIL
  regex: (MQ|Tuxedo|Tmax|TP).*(connect|Connection).*(fail|refused)|MQRC_
- product: mesim-eai
  code: ESB-JMS-CONNECT-FAIL
  regex: JMS.*(connect|Connection).*(fail|refused)|JMSException
- product: mesim-eai
  code: ESB-FTP-CONNECT-FAIL
  regex: (FTP|SFTP).*(connect|login|Connection).*(fail|refused)|530 Login
- product: mesim-eai
  code: ESB-HTTP-CONNECT-FAIL
  regex: HTTP.*(connect|Connection).*(fail|refused|timed? ?out)|HttpHostConnectException|ConnectTimeoutException
- product: mesim-eai
  code: ESB-WEBSERVICE-FAIL
  regex: (SOAP|WebService|Web Service).*(fail|fault|error)|SOAPFaultException|WebServiceException
- product: mesim-eai
  code: ESB-ENDPOINT-DOWN
  regex: '[Ee]ndpoint.*(down|unavailable|not (available|found)|unreachable)|UnknownHostException|No route to host'
- product: mesim-eai
  code: ESB-TCP-CONNECT-FAIL
  regex: TCP.*(connect|Connection).*(fail|refused)|ConnectException|Connection refused
- product: mesim-eai
  code: ESB-ROUTING-FAIL
  regex: '[Rr]out(e|ing).*(fail|error|not found)|No route|라우팅.*(실패|오류)'
- product: mesim-eai
  code: ESB-TRANSFORM-FAIL
  regex: TransformException|SAXParseException|JsonParseException|UnmarshalException|(변환|매핑).*(오류|실패)
- product: mesim-eai
  code: ESB-MESSAGE-VERIFY-FAIL
  regex: (validat|verif).*(fail|error)|검증.*(실패|오류)|schema.*invalid
- product: mesim-eai
  code: ESB-XA-TRANSACTION-FAIL
  regex: XA.*(fail|error|exception)|XAException|Transaction.*(rolled back|rollback)|HeuristicMixedException
- product: mesim-eai
  code: ESB-DATA-QUALITY-FAIL
  regex: (품질|quality).*(오류|실패|fail|error)
- product: mesim-eai
  code: ESB-BROKER-FAIL
  regex: '[Bb]roker.*(down|fail|error|not available)|브로커.*(장애|오류)'
- product: mesim-eai
  code: ESB-LOAD-BALANCE-FAIL
  regex: (load ?balanc|LB).*(fail|error)|부하분산.*(실패|오류)
- product: mesim-eai
  code: ESB-TRANSACTION-DELAY
  regex: (slow|delay|지연).*(transaction|거래|interface|인터페이스)|(transaction|거래).*(slow|delay|지연)|elapsed.*\d{5,}ms
- product: mesim-eai
  code: ESB-LARGE-DATA-OVERLOAD
  regex: (large|대용량).*(overload|timeout|지연|fail)|message.*too (large|big)
- product: postgresql
  code: PG-WAL-FULL
  regex: could not write to file "pg_(wal|xlog)|No space left on device.*pg_(wal|xlog)|pg_(wal|xlog).*No space left
- product: postgresql
  code: PG-TXID-WRAPAROUND
  regex: database is not accepting commands to avoid wraparound|must be vacuumed within|transaction ID wraparound
