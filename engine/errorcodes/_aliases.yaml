  code: PG-CHECKPOINT-FREQ
  regex: checkpoints are occurring too frequently
- product: postgresql
  code: PG-IDLE-IN-TXN
  regex: idle-in-transaction timeout|terminating connection due to idle-in-transaction
- product: postgresql
  code: PG-PANIC
