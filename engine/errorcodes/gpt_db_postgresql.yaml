  title: 교착상태 감지
  immediate:
  - "서버 로그의 'deadlock detected' DETAIL(Process … waits for … blocked by process …)과 각 프로세스 SQL 기록: `grep -n -A12 'deadlock detected' <로그 경로> | tail -60` (10~16, 읽기 전용)"
  - "`SELECT name, setting FROM pg_settings WHERE name IN ('deadlock_timeout','log_lock_waits');` — log_lock_waits 가 off 면 잠금 대기 이력이 없으므로 2차에서 수집 여부 판단"
  - "현재 잠금 대기: `SELECT pid, pg_blocking_pids(pid) AS blocked_by, wait_event_type, LEFT(query,60) FROM pg_stat_activity WHERE cardinality(pg_blocking_pids(pid)) > 0;`"
  short:
  - "(2차) 애플리케이션이 40P01 수신 시 트랜잭션 전체 재시도, 반복되면 `ALTER SYSTEM SET log_lock_waits = on; SELECT pg_reload_conf();` 로 대기 이력 수집(승인 후, 롤백: `ALTER SYSTEM RESET log_lock_waits;`)"
  mid:
  - 트랜잭션 잠금 순서를 통일하고 범위를 축소
  long:
  - deadlock 자동수집과 재시도 표준을 운영
  source: GPT 수집·벤더 문서 대조 완료(https://www.postgresql.org/docs/current/errcodes-appendix.html)
  vendor_cause: 두 개 이상 트랜잭션이 서로 상대가 보유한 잠금을 기다려 진행할 수 없음
  vendor_action: 여러 객체 잠금은 모든 애플리케이션에서 일관된 순서로 획득하고, 교착으로 중단된 트랜잭션은 재시도
  vendor_url: https://www.postgresql.org/docs/current/explicit-locking.html
