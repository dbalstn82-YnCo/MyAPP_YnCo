# 5차 보강(2026-10-16) — GPT 핵심 코드 대조에서 빠진 SQL Server 오류. 공식 문서(learn.microsoft.com)로 의미 확인한 것만 넣었다.
product: mssql
layer: db
codes:
- code: MSSQL-17888
  severity: error
  category: thread
  title: 노드의 모든 스케줄러가 공통 자원 대기로 정체(작업자 스레드 다수 대기)
  vendor_cause: "Scheduler Monitor 가 노드의 작업자(worker)들이 진행하지 못하는 것을 감지했고 그 원인이 하나의 공통 자원 병목일 때 기록된다. 메시지의 'waiting on <자원>' 이 병목 대기 유형이며, 예로 ASYNC_NETWORK_IO(클라이언트가 결과를 받아 가지 않음 — 애플리케이션·라우터·네트워크 문제)나 LCK_M_*(잠금 대기)가 흔하다."
  vendor_action: "메시지에 나온 자원(<<RESOURCE>>) 병목을 해소한다. 전용 관리자 연결(DAC)로 접속해 병목에 대한 추가 정보를 수집하는 것이 좋다."
  vendor_url: https://learn.microsoft.com/en-us/archive/blogs/psssql/how-it-works-17888-all-schedulers-on-node-appear-deadlocked
  immediate:
  - "ERRORLOG 의 17888 줄에서 Node 번호와 'waiting on' 뒤 대기 유형·Process Utilization 기록: `EXEC xp_readerrorlog 0, 1, N'17888';` — 일반 접속이 안 되면 서버 로컬에서 DAC 로 접속 `sqlcmd -S <server> -A -E` (읽기 전용 조회만, DAC 는 1세션만 허용)"
  - "대기 유형별 요청 수와 스케줄러 상태: `SELECT wait_type, COUNT(*) AS cnt FROM sys.dm_exec_requests GROUP BY wait_type ORDER BY cnt DESC;` · `SELECT scheduler_id, current_workers_count, active_workers_count, work_queue_count, runnable_tasks_count FROM sys.dm_os_schedulers WHERE status = 'VISIBLE ONLINE';` — work_queue_count 가 계속 0 보다 크면 작업자 고갈 확정"
  - "대기 유형이 ASYNC_NETWORK_IO 면 결과를 안 받아 가는 클라이언트를, LCK_M_* 면 blocking 체인의 원점 세션을 식별: `SELECT r.session_id, r.blocking_session_id, r.wait_type, r.wait_time, s.host_name, s.program_name FROM sys.dm_exec_requests r JOIN sys.dm_exec_sessions s ON s.session_id = r.session_id WHERE r.wait_type = N'ASYNC_NETWORK_IO' OR r.blocking_session_id <> 0;` (2005+)"
  short:
  - "(2차·승인 후, 롤백: KILL 은 해당 트랜잭션을 롤백시켜 되돌릴 수 없으므로 세션·SQL·host_name 을 먼저 기록) 차단 원점 세션 또는 결과를 받지 않는 클라이언트 세션을 업무 담당 확인 후 `KILL <session_id>;` 로 정리"
  - "(2차) ASYNC_NETWORK_IO 이면 해당 host_name·program_name 의 애플리케이션 담당에게 결과 집합을 끝까지 읽는지(대량 SELECT 를 행 단위 처리하며 느리게 소비) 와 네트워크 구간 지연을 확인 요청"
  mid:
  - "대량 결과를 느리게 소비하는 애플리케이션 패턴(행마다 원격 호출) 수정과 잠금 장기 보유 트랜잭션 분리 — 'max worker threads' 상향은 병목 해소 전에는 증상만 늦추므로 근본 원인 해소 후 sys.dm_os_schedulers 추이를 보고 판단"
  long:
  - "Scheduler Monitor 경고(17883·17884·17887·17888) 발생 건수와 sys.dm_os_schedulers 의 work_queue_count > 0 지속 시간을 감시 임계로 등록"
  versions:
  - SQL Server 2005
  - SQL Server 2008/2008 R2
  - SQL Server 2012
  - SQL Server 2014
  - SQL Server 2016
  - SQL Server 2017
  - SQL Server 2019
  - SQL Server 2022
  - SQL Server 2025
  version_note: "ERRORLOG 'Error: 17888, Severity: 10' 형식 — 오류 목록(16000~17999, sql-server-ver17)에 'All schedulers on Node %d appear deadlocked due to a large number of worker threads waiting on %ls.' 로 등재. Scheduler Monitor 진단은 2005 이후. 전용 오류 페이지(mssqlserver-17888)는 없어 PSS 문서(archive) 와 오류 목록으로 대조"
  source: "공식 문서 대조(2026-10-16 5차 보강)"
