- code: LNX-KDUMP-FAIL
  severity: warn
  category: internal
  title: kdump 실패
  vendor_cause: kdump 서비스가 캡처 커널 적재에 실패했거나 패닉 시 vmcore 저장에 실패한 상태 — crashkernel= 예약 메모리 없음/부족, kdump initramfs 생성 실패, 저장 경로 공간 부족·대상 접근 불가가 흔한 원인이며 이 상태에서 패닉하면 분석 자료가 남지 않는다.
  immediate:
  - '`systemctl status kdump` (RHEL 7+) / `service kdump status` (RHEL 6) 와 `cat /sys/kernel/kexec_crash_loaded` 로 캡처 커널 적재 확인 — 1 이면 정상'
  - '`grep -o ''crashkernel=[^ ]*'' /proc/cmdline` 와 `grep -i crash /proc/iomem` 으로 예약 메모리 확인 — 예약 없음이면 원인'
  - '`grep -vE ''^#|^$'' /etc/kdump.conf` 와 `df -h /var/crash` 로 저장 경로·공간 확인'
  short:
  - '(2차·승인 후, 롤백: grubby 로 이전 crashkernel 값 복원) `grubby --update-kernel=ALL --args=''crashkernel=<크기>''` (RHEL 7+) 또는 `kdumpctl reset-crashkernel` (RHEL 9) 후 재부팅 일정 반영, `kdumpctl restart` 로 재적재'
  mid:
  - kdump 저장 경로를 충분한 별도 파일시스템 또는 원격(NFS·SSH)으로 지정, core_collector `makedumpfile -l --message-level 7 -d 31` 압축 적용
  long:
  - 시험 서버에서 분기 1회 kdump 동작 검증(운영 서버 강제 패닉 금지)과 커널 업데이트 후 kdump 상태 자동 점검
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - RHEL 5~10
  - CentOS 6~Stream 9
  - Rocky/Alma 8~9
  - Ubuntu 16.04~24.04
  - SLES 12~15
  version_note: kdump 서비스 문구(RHEL 5+)
- code: LNX-THERMAL
  severity: critical
  category: hardware
  title: 온도 임계 초과
  vendor_cause: CPU 패키지/코어 온도가 임계를 넘어 하드웨어가 클럭을 낮추는(thermal throttling) 상태 — 팬 고장·통풍 불량·전산실 온도 상승·방열판 문제가 원인이며 지속 시 성능 저하·보호 차단 위험.
  immediate:
  - '`journalctl -k | grep -iE ''temperature|throttl'' | tail -20` (RHEL 7+) / `grep -iE ''temperature|throttl'' /var/log/messages | tail -20` (RHEL 6) 로 CPU·발생 빈도 확인'
  - '`ipmitool sdr type Temperature` 와 `ipmitool sdr type Fan` (ipmitool·BMC 연동 시) 또는 iLO/iDRAC 콘솔로 센서 온도·팬 상태 확인'
  - '`grep -H . /sys/class/thermal/thermal_zone*/temp 2>/dev/null` (밀리도) 와 `grep MHz /proc/cpuinfo | sort | uniq -c` 로 온도·클럭 저하 확인'
  short:
  - '(2차·승인 후, 롤백: 이동한 부하 원복) 시설 담당에 랙·전산실 온도 확인 요청, 팬 고장이면 벤더 교체 요청, 필요 시 부하 분산'
  mid:
  - 서버 팬·방열판·필터 점검과 BMC/BIOS 팬 제어 펌웨어 갱신, 랙 배치·통풍 개선
  long:
  - BMC 온도 센서 SNMP/Redfish 수집·임계 경보와 전산실 온도 감시 연동
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - RHEL 5~10
  - CentOS 6~Stream 9
  - Rocky/Alma 8~9
  - Ubuntu 16.04~24.04
  - SLES 12~15
  version_note: '''CPUn: Core temperature above threshold'' / thermal throttling 전 버전'
- code: LNX-PSU-FAIL
  severity: critical
  category: hardware
  title: 전원 공급 장애
  vendor_cause: BMC/IPMI 가 전원 공급 장치(PSU) 고장·입력 전원 상실·이중화 상실(Redundancy Lost) 을 보고한 상태 — 남은 PSU 로 동작 중일 수 있으나 추가 장애 시 서버 정지 위험.
