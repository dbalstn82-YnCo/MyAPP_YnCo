  mid:
  - ext4 는 재생성 시 `mkfs.ext4 -i <bytes-per-inode>` 로 inode 비율 확대 또는 XFS 이전, 임시 파일 정리 주기(systemd-tmpfiles) 설정
  long:
  - inode 사용률 80% 경고 감시와 소파일 생성 디렉터리 정리 정책 운영
