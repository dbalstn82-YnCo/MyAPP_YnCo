  - '(2차·승인 후, 롤백: 교체 전 부품 보관) 벤더에 PSU 핫스왑 교체 요청 — 교체 전 나머지 PSU 정상 확인, 입력 전원 문제면 시설 담당 조치'
  mid:
  - PSU 이중 전원 계통(A/B 피드) 분리 점검과 BMC 펌웨어 갱신
  long:
  - BMC 이벤트(SEL) SNMP 트랩·Redfish 수집으로 PSU 상태 상시 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - RHEL 5~10
  - CentOS 6~Stream 9
  - Rocky/Alma 8~9
  - Ubuntu 16.04~24.04
  - SLES 12~15
  version_note: IPMI/BMC 전달 문구 — 커널 버전 무관
- code: LNX-EXT3-ERROR
  severity: critical
  category: storage
  title: EXT3 파일시스템 오류 (RHEL 5/6 기본 FS)
  vendor_cause: 'ext3 드라이버가 디렉터리·inode·블록 비트맵 등 메타데이터 불일치를 발견한 상태(''EXT3-fs error (device X): <함수>'') — 마운트 옵션 errors=(continue|remount-ro|panic) 에 따라 동작하며 하위 디스크 I/O 오류·비정상 종료가 흔한 원인.'
  immediate:
  - '`grep -iE ''EXT3-fs|I/O error'' /var/log/messages | tail -30` 과 `dmesg | grep -i ''EXT3-fs'' | tail -20` 으로 장치·함수·반복 여부와 하위 블록 I/O 오류 동반 확인'
  - '`grep ext3 /proc/mounts` 로 ro 마운트 여부(옵션에 ro 면 쓰기 불가), `tune2fs -l /dev/<dev> | grep -iE ''state|errors behavior|Last checked''` 로 오류 상태·동작 확인'
  - 쓰기 중단·fsck 는 2차(유지보수) 승인 후 수행
  short:
  - 디스크·컨트롤러 오류 로그(LNX-BUFFER-IO·LNX-SCSI-ERROR) 동반 시 하드웨어 점검 우선
  - '(2차·승인 후, 롤백: 백업 복원) 백업 확인·업무 중단 일정 확보 후 언마운트하고 `e2fsck -fn /dev/<dev>` 로 점검, 수리는 `e2fsck -fy` (루트 FS 는 rescue 모드)'
  mid:
  - 디스크·컨트롤러 진단으로 하드웨어 원인 제거, RHEL 7+ 이전 시 ext4/XFS 로 전환 계획
  long:
  - EXT3/4 오류 메시지 경보, 정기 백업·복구 훈련과 tune2fs 의 Filesystem state 점검 정례화
  source: '커널 fs/ext3 메시지 형식 ''EXT3-fs error (device X): func: …'' — RHEL 5·6 기본 ext3 (Claude 버전 검증 2026-09-11)'
  versions:
  - RHEL 5~6
  - CentOS 6
  version_note: ext3 는 RHEL 7 부터 기본 아님(ext4/xfs). RHEL 7+ 에서도 ext3 마운트 시 동일 문구
- code: LNX-IPCONNTRACK-FULL
  severity: critical
  category: capacity
  title: ip_conntrack 테이블 포화 (RHEL 5 커널 2.6.18)
  vendor_cause: RHEL 5(커널 2.6.18) 의 ip_conntrack 연결 추적 테이블이 ip_conntrack_max 에 도달해 새 연결 패킷을 버리는 상태 — 대량·짧은 연결 폭주와 긴 established 타임아웃(기본 5일)이 원인.
  immediate:
  - '`grep -c ''ip_conntrack: table full'' /var/log/messages` 와 마지막 발생 시각 확인, 신규 접속 실패 신고와 대조'
  - '`cat /proc/sys/net/ipv4/ip_conntrack_max` 와 `wc -l /proc/net/ip_conntrack` 로 사용량 기록 — max 에 근접하면 확정'
  - '`grep -o ''src=[0-9.]*'' /proc/net/ip_conntrack | sort | uniq -c | sort -rn | head` 로 상위 출발지 확인'
  short:
  - '(2차·승인 후, 롤백: 이전 값 복원) `sysctl -w net.ipv4.ip_conntrack_max=<값>` 및 /etc/sysctl.conf 반영 — 커널 메모리 증가 확인, 필요 시 `net.ipv4.netfilter.ip_conntrack_tcp_timeout_established` 단축'
  mid:
  - 연결 추적이 불필요한 트래픽은 raw 테이블 NOTRACK 적용 검토, conntrack 해시 크기(hashsize) 조정
  long:
  - RHEL 5 는 지원 종료 — RHEL 7+ 이전(LNX-CONNTRACK-FULL 대상) 계획과 conntrack 사용률 감시
  source: '커널 2.6.18 net/ipv4/netfilter/ip_conntrack_core.c ''ip_conntrack: table full, dropping packet'' (Claude 버전 검증 2026-09-11)'
  versions:
  - RHEL 5
  version_note: RHEL 6+ 는 nf_conntrack (LNX-CONNTRACK-FULL)
- code: LNX-APPARMOR-DENIED
  severity: error
  category: security
  title: AppArmor 접근 차단 (Ubuntu·SLES 기본 MAC)
  vendor_cause: AppArmor 프로파일이 enforce 모드에서 허용하지 않은 파일·네트워크·capability 접근을 거부한 상태 — 프로그램 업데이트·비표준 경로 사용 후 프로파일 미갱신 등이 원인 후보이며, 의도하지 않은 접근(침해 시도)일 수도 있어 대상 경로로 가른다.
  immediate:
  - '`journalctl -k --since ''-2 hours'' | grep -i ''apparmor="DENIED"'' | tail -30` (Ubuntu 16.04+) / `grep -i ''apparmor="DENIED"'' /var/log/kern.log | tail -30`, auditd 가 돌면(`systemctl is-active auditd`) `grep -i ''apparmor="DENIED"'' /var/log/audit/audit.log | tail -30` 로 profile=·operation=·name=·comm=·requested_mask=·denied_mask= 확인 — capability·network 등 일부 이벤트에는 requested_mask/denied_mask 가 없다(파싱 오류 아님)'
  - 'DENIED 0줄이 "막힌 것 없음"은 아니다 — 프로파일의 명시적 deny 규칙에 걸린 접근은 기본적으로 기록되지 않으므로 `grep -n deny /etc/apparmor.d/<profile> /etc/apparmor.d/local/<profile>` 와 include 된 abstraction 파일까지 펼친 `apparmor_parser -p /etc/apparmor.d/<profile> | grep -n deny`(전처리 출력만, 적재 안 함 — AppArmor 2.13+/3 기준, 지원 판 미검증)로 대상 경로를 막는 규칙을 본다(deny 규칙이 안 보여도 차단이 없었다고 단정하지 않는다), `aa-status`(root)로 그 profile 이 enforce/complain 중 어느 모드인지 확인'
  - 'PID 는 재사용되므로 기록의 pid= 만으로 지금 프로세스와 짝짓지 않는다 — `ps -o pid,lstart,comm,args -p <PID>` 와 `cat /proc/<PID>/attr/current` 가 기록의 comm=·profile= 과 같고 시작 시각(lstart)이 기록 시각보다 앞일 때만 같은 프로세스로 보고 장애 시각과 대조 (설정 변경은 2차)'
  short:
  - '(2차·승인 후, 롤백: `aa-enforce` 로 원복) 원인 확인 기간 동안 `aa-complain /etc/apparmor.d/<profile>` 로 기록만 하도록 전환 후 `aa-logprof` 로 필요한 규칙 검토'
  mid:
  - 검토된 규칙을 /etc/apparmor.d/local/<profile> 에 추가하고 `apparmor_parser -r /etc/apparmor.d/<profile>` 로 재적재 후 enforce 유지
  long:
  - AppArmor DENIED 건수 감시와 패키지 업데이트 후 프로파일 검증 절차 운영
  source: 'AppArmor 커널 감사 문구 ''audit: type=1400 audit(…): apparmor="DENIED" operation=… profile=… name=…'' (Ubuntu·SLES 문서, Claude 버전 검증 2026-09-11)'
  versions:
  - Ubuntu 16.04~24.04
  - SLES 12~15
  version_note: RHEL 계열은 SELinux(LNX-SELINUX-DENIAL)
  verify_note: "미검증 — apparmor_parser -p(include 를 펼친 전처리 출력)를 지원하는 판(AppArmor 2.13+/3 로 봄)을 공식 문서로 확인하지 못함 — 옵션 오류가 나면 프로파일·local 의 include 줄이 가리키는 /etc/apparmor.d/abstractions/ 파일을 직접 grep"
- code: LNX-UPSTART-FAIL
  severity: error
  category: internal
  title: upstart 서비스 비정상 종료·재기동 반복 (RHEL 6)
  vendor_cause: RHEL 6 의 upstart init 이 관리하는 작업(job)의 주 프로세스가 비정상 종료('terminated with status N')했거나, respawn 작업이 짧은 시간에 반복 종료되어 'respawning too fast, stopped' 로 재기동을 포기한 상태 — 설정 오류·의존 자원 부재·애플리케이션 크래시가 원인.
  immediate:
  - '`grep ''init:'' /var/log/messages | tail -30` 으로 작업명·종료 상태·respawn 중단 여부 확인'
  - '`initctl list | grep -v ''start/running''` 와 `initctl status <job>` 로 현재 상태 확인 (RHEL 6)'
  - '`cat /etc/init/<job>.conf` 와 해당 서비스 로그(/var/log/<svc>) 로 종료 직전 오류 확인'
  short:
  - 재기동 반복 서비스는 2차(유지보수) 에 원인 분석 이관
  - '(2차·승인 후, 롤백: conf 원복) 원인 수정 후 `initctl start <job>` 으로 기동, respawn 한도는 /etc/init/<job>.conf 의 `respawn limit <횟수> <초>` 로 조정'
  mid:
  - SysV init 스크립트와 upstart 작업 중복 여부 정리, 애플리케이션 크래시 원인 수정
  long:
  - RHEL 6 지원 종료 대비 RHEL 7+ systemd 전환 계획, 그 전까지 init 메시지 감시
  source: upstart 0.6 (RHEL 6) init 메시지 형식 (Claude 버전 검증 2026-09-11)
  versions:
  - RHEL 6
  - CentOS 6
  version_note: RHEL 7+ 는 systemd(LNX-SYSTEMD-UNIT-FAILED), RHEL 5 는 sysvinit(inittab 'respawning too fast')
- code: LNX-SYSTEMD-OOMD
  severity: critical
  category: memory
  title: systemd-oomd 가 cgroup 단위 프로세스 강제 종료 (RHEL 9+·Ubuntu 22.04+)
  vendor_cause: systemd-oomd 가 cgroup 의 메모리 압력(PSI) 또는 스왑 사용률이 설정 한도(ManagedOOMMemoryPressureLimit·SwapUsedLimit)를 넘자 커널 OOM 보다 먼저 해당 cgroup 의 프로세스를 종료한 상태 — 메모리 부족·누수 또는 과도하게 낮은 한도가 원인.
  immediate:
  - '`journalctl -u systemd-oomd --since ''-1 day'' | tail -30` 으로 종료된 cgroup·시각 확인'
  - '`oomctl` 로 감시 대상 cgroup·현재 압력·한도 확인, `systemctl is-enabled systemd-oomd` 로 활성 여부 확인'
  - '`cat /proc/pressure/memory` 와 `free -m` 로 현재 메모리 압력(PSI avg10/avg60)·가용량 기록'
  short:
  - oomd 임계(ManagedOOMMemoryPressureLimit) 조정은 2차 승인 후
