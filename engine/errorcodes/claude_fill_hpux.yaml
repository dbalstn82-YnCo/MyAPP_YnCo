- code: HPUX-SYSLOG-FULL
  severity: warn
  category: disk
  title: syslog 가득참
  vendor_cause: syslog.log 가 커져 /var 공간을 압박하는 상태. HP-UX 기본 구성은 syslog.log 를 부팅 때만
    OLDsyslog.log 로 돌리므로 장기 가동 시스템에서 계속 커지며, 반복 오류 메시지 폭주가 흔한 원인.
  immediate:
  - '`ls -l /var/adm/syslog/` 와 `bdf /var` 로 syslog.log 크기와 /var 사용률 확인'
  - '`tail -2000 /var/adm/syslog/syslog.log | awk ''{print $5}'' | sed ''s/[[].*//''
    | sort | uniq -c | sort -rn | head` 로 폭주 중인 메시지 발생원 식별'
  short:
  - '(2차·승인 후, 롤백: 복사본 보관) `cp -p syslog.log syslog.log.$(date +%Y%m%d)` 후 압축 보관하고
    `cat /dev/null > syslog.log` 로 비우기(파일 핸들 유지), 폭주 원인 조치'
  mid:
  - cron 으로 주기적 순환(복사·압축·비우기) 스크립트 운영, /etc/syslog.conf 의 과도한 레벨(debug) 정리
  long:
  - /var 사용률과 syslog.log 크기 감시 임계 등록
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - HP-UX 11i v1 (11.11)
  - HP-UX 11i v2 (11.23)
  - HP-UX 11i v3 (11.31)
  version_note: syslog.log 문구 기반 — 11i v1~v3 공통(형식 동일)
