codes:
- code: ORA-00001
  severity: warn
  category: internal
  title: 고유 제약조건 위반
  immediate:
  - "오류 메시지의 제약 이름으로 대상 테이블·컬럼 확인: `select c.owner, c.table_name, c.constraint_type, cc.column_name from dba_constraints c join dba_cons_columns cc on cc.owner=c.owner and cc.constraint_name=c.constraint_name where c.constraint_name='<CONSTRAINT>';` (P=기본키·U=고유키, 결과가 없으면 고유 인덱스 — `dba_ind_columns` 에서 index_name='<CONSTRAINT>')"
  - "키가 시퀀스 채번이면 `select sequence_owner, sequence_name, last_number, cache_size from dba_sequences where sequence_name='<SEQ>';` 와 `select max(<key_col>) from <owner>.<table>;` 비교 — last_number 가 max 보다 작으면 시퀀스 뒤처짐(이관·수동 입력 뒤 흔함)"
  - "같은 키 재유입 여부: `grep -c \"ORA-00001\" <app_log>` 와 오류 줄의 키 값 — 같은 건이 반복되면 재처리 루프(보관·멈춤은 2차)"
  short:
  - "(2차·승인 후, 롤백: 보관 테이블에서 원위치) 중복 유입 건을 보관 테이블로 분리하고 재처리 배치를 멈춤, 시퀀스 뒤처짐이면 DBA 가 시퀀스 값을 현재 최대 키 이상으로 맞춤"
  - 시퀀스·키 생성 로직과 중복 유입 원인을 분석
  mid:
  - 애플리케이션 키 생성 방식과 예외 처리를 개선
  long:
  - 데이터 정합성 검증과 중복 방지 설계를 표준화
  source: GPT 수집·벤더 문서 대조 완료(https://docs.oracle.com/en/error-help/db/ora-00001/)
  vendor_cause: UPDATE/INSERT/MERGE가 고유 제약이 제한한 값과 중복되는 레코드를 생성·변경하려 했다.
  vendor_action: 위반한 고유 제약과 대상 컬럼을 확인한 뒤 중복을 허용하도록 제약을 변경하거나 SQL을 수정하거나 제약/인덱스/기본키를 제거한다.
  vendor_url: https://docs.oracle.com/en/error-help/db/ora-00001/
  versions:
  - Oracle 10gR2
  - Oracle 11gR1/11gR2
  - Oracle 12cR1
  - Oracle 12cR2/18c
  - Oracle 19c
  - Oracle 21c
  - Oracle 23ai/26ai
  version_note: ORA 코드 번호·의미는 10gR2~26ai 동일 — alert log 형식만 12.2 부터 ISO8601 시각(파서가 고전·ISO 두 형식 처리)
- code: ORA-00018
  severity: critical
  category: capacity
  title: 최대 세션 수 초과
  immediate:
  - "세션·프로세스 한도 확인: `select resource_name, current_utilization, max_utilization, limit_value from v$resource_limit where resource_name in ('sessions','processes');` — current 가 limit 의 95% 이상이면 확정"
  - "접속 출처 편중 확인: `select machine, program, status, count(*) cnt from v$session where type='USER' group by machine, program, status order by cnt desc fetch first 10 rows only;` (12c+ · 11gR2 는 서브쿼리 후 `where rownum <= 10`)"
  short:
  - "(2차·승인 후, 롤백: 원래 값으로 SCOPE=SPFILE 재설정 후 재기동) 누수 WAS 풀을 먼저 회수하고 `alter system set sessions=<값> scope=spfile;` 뒤 계획 재기동"
  mid:
  - "WAS 연결풀 maxPoolSize 합계 + 배치·백그라운드 여유 20% 로 PROCESSES/SESSIONS 재산정, 풀 idle timeout·누수 감지(leak detection) 설정"
  long:
  - "v$resource_limit 의 sessions 사용률 80% 경고·90% 위험 감시 등록, 신규 연동 시스템의 커넥션 수 사전 협의 절차"
  source: GPT 수집·벤더 문서 대조 완료(https://docs.oracle.com/en/error-help/db/ora-00018/)
  vendor_cause: "SESSIONS 파라미터로 정한 세션 상태 객체가 모두 사용 중이라 새 세션(재귀 세션 포함)을 만들 수 없는 상태. WAS 연결풀 누수·접속 폭주·PROCESSES 대비 SESSIONS 과소 설정이 흔한 원인."
  vendor_action: SESSIONS 초기화 파라미터 값을 늘린다.
  vendor_url: https://docs.oracle.com/en/error-help/db/ora-00018/
  versions:
  - Oracle 10gR2
  - Oracle 11gR1/11gR2
  - Oracle 12cR1
  - Oracle 12cR2/18c
  - Oracle 19c
  - Oracle 21c
  - Oracle 23ai/26ai
  version_note: ORA 코드 번호·의미는 10gR2~26ai 동일 — alert log 형식만 12.2 부터 ISO8601 시각(파서가 고전·ISO 두 형식 처리)
- code: ORA-00028
  severity: warn
  category: connection
  title: 세션 종료됨
  immediate:
  - "종료 주체 확인(12c+ 통합 감사 사용 시): `select event_timestamp, dbusername, userhost, sql_text from unified_audit_trail where action_name='ALTER SYSTEM' and event_timestamp > systimestamp - interval '1' day order by event_timestamp desc;` · 11gR2 는 `dba_audit_trail`(감사 설정 시)"
  - "Resource Manager 자동 종료 여부: `select plan, group_or_subplan, switch_group, max_idle_time from dba_rsrc_plan_directives where switch_group is not null;` (11gR2+) — 세션 종료형 SWITCH_GROUP 지시자가 있으면 자동 종료 가능"
  - "애플리케이션 로그에서 ORA-00028 직후 재접속 성공 여부와 처리 누락 건(취소된 트랜잭션) 확인 — `grep -n -A3 \"ORA-00028\" <app_log> | tail -40`"
  short:
  - "(2차·승인 후, 롤백: 이전 계획으로 `alter system set resource_manager_plan='<이전계획>'`) Resource Manager 지시자가 원인이면 MAX_IDLE_TIME·SWITCH 조건 조정, 운영자 종료면 사유·승인 기록 확인"
  mid:
  - "세션 강제 종료 시 사전 승인·사유 기록(변경 관리 티켓) 의무화, 애플리케이션의 ORA-00028/ORA-03113 재접속·재처리 로직 점검"
  long:
  - "ALTER SYSTEM 감사 정책(12c+ `create audit policy … actions alter system`)으로 세션 종료 이력 상시 보존·월간 검토"
  source: GPT 수집·벤더 문서 대조 완료(https://docs.oracle.com/en/error-help/db/ora-00028/)
  note: 세션 종료 상태이므로 유형을 connection으로 수정
  vendor_cause: "권한 있는 사용자가 ALTER SYSTEM KILL/DISCONNECT SESSION 으로 세션을 종료해 해당 연결이 더 이상 로그인 상태가 아님. 운영자 조치·Resource Manager 지시자·모니터링 도구의 자동 종료가 흔한 원인."
  vendor_action: 작업을 계속하려면 다시 로그인한다.
  vendor_url: https://docs.oracle.com/en/error-help/db/ora-00028/
  versions:
  - Oracle 10gR2
  - Oracle 11gR1/11gR2
  - Oracle 12cR1
  - Oracle 12cR2/18c
  - Oracle 19c
  - Oracle 21c
  - Oracle 23ai/26ai
  version_note: ORA 코드 번호·의미는 10gR2~26ai 동일 — alert log 형식만 12.2 부터 ISO8601 시각(파서가 고전·ISO 두 형식 처리)
- code: ORA-00059
  severity: critical
  category: capacity
  title: 데이터파일 수 한도 초과
  immediate:
  - "한도와 현재 파일 수: `select value from v$parameter where name='db_files';` 와 `select count(*) from v$datafile;` — 같으면 확정(추가 작업은 2차 판단 전 보류)"
  - "남은 파일 수 `select (select to_number(value) from v$parameter where name='db_files') - (select count(*) from v$datafile) remain from dual;` 와 예정된 ADD DATAFILE·CREATE TABLESPACE 작업의 파일 수 비교 — 예정 수가 더 많으면 2차에서 DB_FILES 조정 필요"
  short:
  - "(2차·승인 후, 롤백: `alter system set db_files=<원래값> scope=spfile;` 후 재기동) `alter system set db_files=<값> scope=spfile;` 뒤 계획 재기동 — 당장은 기존 파일 크기 확장(resize·autoextend)으로 우회"
  mid:
  - DB_FILES 상향 후 재기동 계획을 수립
  long:
  - 데이터파일 증가 추세 관리
  source: GPT 수집·벤더 문서 대조 완료(https://docs.oracle.com/en/error-help/db/ora-00059/)
  vendor_cause: DB_FILES 초기화 파라미터 값을 초과했다.
  vendor_action: DB_FILES 값을 늘리고 warm start한다.
  vendor_url: https://docs.oracle.com/en/error-help/db/ora-00059/
  versions:
