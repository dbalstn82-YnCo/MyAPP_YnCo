  title: UNDO 세그먼트 확장 실패
  immediate:
  - "UNDO 사용 상태: `select tablespace_name, status, round(sum(bytes)/1024/1024) mb from dba_undo_extents group by tablespace_name, status;` — ACTIVE/UNEXPIRED 가 대부분이면 공간 부족"
  - "대량 트랜잭션: `select s.sid, s.username, s.sql_id, t.used_ublk from v$transaction t join v$session s on s.taddr=t.addr order by t.used_ublk desc;`"
  - "AUTOEXTEND 여부: `select file_name, round(bytes/1024/1024) mb, autoextensible, round(maxbytes/1024/1024) max_mb from dba_data_files where tablespace_name=(select value from v$parameter where name='undo_tablespace');` (12cR2+ 로컬 UNDO 면 해당 PDB 에서)"
  short:
  - "(2차·승인 후, 롤백: 추가 파일은 축소 불가 — 용량 계획 반영) `alter tablespace <undo_ts> add datafile '<path>' size 4G autoextend on maxsize 32G;`, 대량 DML 은 업무 담당 확인 후 분할 실행"
  mid:
  - "v$undostat 기반으로 UNDO 크기·UNDO_RETENTION 재산정, RETENTION GUARANTEE 사용 여부 재검토"
  long:
  - "UNDO 사용률 감시와 대량 배치 커밋 주기 표준"
  source: GPT 수집·벤더 문서 대조 완료(https://docs.oracle.com/en/error-help/db/ora-30036/)
  note: 트랜잭션 작업 실패 성격이며 단독 코드만으로 서비스 전체 중단을 뜻하지 않음
  vendor_cause: "자동 UNDO 테이블스페이스에 더 할당할 공간이 없음. 대량 DML·장시간 트랜잭션, 자동확장 미설정/MAXSIZE 도달, 과도한 UNDO_RETENTION(RETENTION GUARANTEE)이 흔한 원인."
  vendor_action: UNDO 테이블스페이스에 공간을 추가한 뒤 재시도하거나 활성 트랜잭션이 커밋될 때까지 기다린다.
  vendor_url: https://docs.oracle.com/en/error-help/db/ora-30036/
