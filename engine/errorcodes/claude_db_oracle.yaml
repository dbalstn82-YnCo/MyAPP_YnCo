- code: ORA-00312
  severity: info
  category: storage
  title: 온라인 로그 파일 정보
  immediate:
  - "`select l.group#, l.thread#, l.sequence#, l.status, f.member, f.status mstatus from v$log l join v$logfile f on f.group#=l.group# order by l.group#;` — 메시지의 멤버가 INVALID/STALE 이고 같은 그룹 다른 멤버가 정상이면 DB 는 계속 동작(멀티플렉싱)"
  - "멤버 파일 실재·I/O: `ls -l '<member 경로>'` (ASM 이면 `asmcmd ls -l +<DG>/<db>/ONLINELOG/`) 와 `dmesg | tail -50` — 파일 없음·I/O 오류면 스토리지 원인"
  - "주 오류 확인: `grep -n -B2 -A4 \"ORA-00312\" <alert_SID.log> | tail -40` — 바로 앞의 ORA-00313/00321/00333 등 주 오류 코드의 절차를 따른다"
  short:
  - "(2차·승인 후, 롤백: 새 멤버를 빼고 원래 구성) 손상 멤버는 그룹이 INACTIVE 일 때 `alter database drop logfile member '<path>';` 뒤 `alter database add logfile member '<path>' to group <n>;` 로 다시 만듦"
  - 멀티플렉싱 정상 멤버 존재 여부 점검
  mid:
  - 손상 멤버를 재생성
  long:
  - redo 다중화·스토리지 감시 강화
  source: GPT 수집·벤더 문서 대조 완료(https://docs.oracle.com/en/error-help/db/ora-00312/)
  note: 다른 오류의 로그 파일명을 알리는 보조 메시지임
  vendor_cause: 다른 오류의 상세 정보를 위해 온라인 로그 파일명을 알리는 메시지다.
  vendor_action: 함께 출력된 관련 오류 메시지를 확인하고 그 메시지의 조치를 따른다.
