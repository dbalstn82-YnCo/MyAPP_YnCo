- code: ORA-00210
  severity: critical
  category: storage
  title: 컨트롤파일 열기 실패
  immediate:
  - "alert log 에서 파일명·OS errno 확인: `grep -n -A3 \"ORA-00210\" $ORACLE_BASE/diag/rdbms/<db>/<SID>/trace/alert_<SID>.log | tail -30` (11g+ ADR · 10gR2 는 background_dump_dest)"
  - "지정 파일 실재 확인: init/spfile 의 CONTROL_FILES 경로마다 `ls -l <path>` — 소유자 oracle:oinstall·크기 동일 여부, ASM 이면 `asmcmd ls -l +<DG>/<db>/CONTROLFILE/`"
  - "`df -h <mount>` 와 `dmesg -T | tail -50` 로 미마운트·I/O 오류 확인(복사·재생성은 2차)"
  short:
  - "(2차·승인 후, 롤백: 손상본을 <path>.bak 으로 보존) 정상 다중화본을 손상 위치로 복사하거나 CONTROL_FILES 에서 손상본을 빼고 기동, 다중화본이 없으면 RMAN `restore controlfile from autobackup;`"
  mid:
  - "컨트롤파일을 서로 다른 디스크/디스크그룹에 3중화, RMAN `configure controlfile autobackup on;` 적용 확인"
  long:
  - "분기 1회 컨트롤파일 복구 리허설, 스토리지 경로·권한 변경을 DBA 승인 대상 변경으로 등록"
  source: GPT 수집·벤더 문서 대조 완료(https://docs.oracle.com/en/database/oracle/oracle-database/21/errmg/ORA-00000.html)
  vendor_cause: "CONTROL_FILES 에 지정된 컨트롤파일 중 하나 이상을 열 수 없음(동반 ORA-00202 에 파일명, ORA-27037/27041 에 OS 오류). 파일 삭제·경로 오타·권한 변경·스토리지 또는 ASM 디스크그룹 미마운트가 흔한 원인."
  vendor_action: 컨트롤파일이 존재하며 다른 프로그램에 의해 잠겨 있지 않은지 확인한다.
  vendor_url: https://docs.oracle.com/en/database/oracle/oracle-database/21/errmg/ORA-00000.html
