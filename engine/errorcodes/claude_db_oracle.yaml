- code: ORA-00333
  severity: critical
  category: storage
  title: 리두 로그 읽기 오류
  immediate:
  - "인스턴스 단계: `select status from v$instance;` 와 `select open_mode from v$database;` — MOUNTED 에 머물러 있으면 크래시 복구 중 로그 읽기 실패"
  - "읽지 못한 로그 그룹: `select l.group#, l.sequence#, l.status, l.archived, f.member from v$log l join v$logfile f on f.group#=l.group#;` — 대상이 CURRENT/ACTIVE 그룹이고 정상 멤버가 없으면 3차(복구) 사안"
