- code: ORA-01142
  severity: error
  category: internal
  title: 온라인 백업 종료 불가
  immediate:
  - "백업 모드 확인: `select file#, status, change#, time from v$backup;` — ACTIVE 가 없으면 이미 종료된 정상 상태"
  - "백업 스크립트 로그에서 BEGIN BACKUP 결과와 END BACKUP 중복 호출 여부 확인"
  short:
  - "백업 스크립트의 BEGIN/END 순서·오류 처리 수정, 백업 파일 완전성 확인 후 필요하면 백업을 다시 수행(2차)"
  mid:
  - "사용자 관리 hot backup 스크립트를 RMAN 백업으로 전환 검토"
  long:
  - "백업 스크립트 종료 코드와 v$backup ACTIVE 잔존 감시"
  source: GPT 수집·벤더 문서 대조 완료(https://docs.oracle.com/en/error-help/db/ora-01142/)
  note: 잠금 오류가 아니라 백업 중인 파일이 없어 백업 종료가 불가능한 상태임
  vendor_cause: "END BACKUP 을 실행했지만 온라인 백업 모드(ACTIVE)인 파일이 하나도 없음 — 이미 END BACKUP 이 수행되었거나 BEGIN BACKUP 이 실패한 상태에서 백업 스크립트가 END 를 다시 호출한 경우."
  vendor_action: 조치 불필요. 이 테이블스페이스는 온라인 백업을 종료할 필요가 없다.
