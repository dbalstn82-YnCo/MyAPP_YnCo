- code: ORA-00235
  severity: error
  category: lock
  title: 컨트롤파일 읽기 불일치
  immediate:
  - "같은 시각 RMAN 작업 확인: `select sid, operation, status, start_time from v$rman_status where start_time > sysdate-1/24 order by start_time;` (10gR2+)"
  - "로그 스위치 빈도 확인: `select to_char(first_time,'YYYY-MM-DD HH24') hr, count(*) from v$log_history where first_time > sysdate-1 group by to_char(first_time,'YYYY-MM-DD HH24') order by 1;` — 시간당 10회 이상이면 컨트롤파일 갱신 경합 가능"
  short:
  - "실패한 RMAN·조회 작업을 다른 시간대에 다시 실행해 재현 여부 확인, 반복되면 RMAN 백업 시각과 대량 배치(로그 스위치 폭주) 시간 분리"
  mid:
  - "리두 로그 크기를 스위치 간격 15~20분 수준으로 조정해 컨트롤파일 갱신 빈도 감소, RMAN 스케줄을 배치 창과 분리"
  long:
  - "RMAN·배치·모니터링 수집(v$ 조회) 일정표를 하나로 관리하고 반복 발생 시 Oracle SR 로 버그 여부 확인"
  source: GPT 수집·벤더 문서 대조 완료(https://docs.oracle.com/en/error-help/db/ora-00235/)
  note: 잠금 경합 자체가 아니라 동시 갱신 중 무잠금 읽기 불일치임
  vendor_cause: "컨트롤파일을 잠금 없이 읽는 동안 다른 프로세스가 갱신해 일관되지 않은 내용을 읽음(재실행하면 대부분 해소). RMAN 백업·v$ 조회가 로그 스위치·아카이브 등 컨트롤파일 갱신과 겹칠 때 흔함."
