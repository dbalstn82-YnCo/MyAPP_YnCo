product: nginx
layer: web
note: GPT 협업 수집분 — 벤더 공식 문서와 대조 후 확정
codes:
- code: NGX-UPSTREAM-HOST-NOT-FOUND
  severity: error
  category: connection
  title: 업스트림 호스트 미해석
  immediate:
  - '`grep -n "host not found in upstream" /var/log/nginx/error.log | tail -5` 로 해석 실패 호스트명·설정 파일 줄 확인'
  - '`getent hosts <upstream_host>` 와 `cat /etc/resolv.conf` 로 OS 수준 해석 가능 여부 확인 — 실패면 DNS 원인'
  - '`nginx -t` 로 현재 설정 시험(읽기 전용) — 같은 오류면 설정이 아직 적용되지 않은 상태'
  short:
  - '(2차·승인 후, 롤백: 이전 설정 파일 복원) DNS 담당이 레코드 복구하거나 /etc/hosts 에 임시 등록 후 `nginx -t` 성공 확인 뒤 `nginx -s reload`'
  mid:
  - '내부 업스트림은 IP 또는 이중화된 내부 DNS 로 지정하고 동적 해석이 필요하면 resolver + 변수 proxy_pass 방식 검토'
  long:
  - '설정 배포 전 `nginx -t` 자동 시험과 업스트림 호스트명 DNS 감시'
  vendor_cause: 'nginx 가 설정을 읽을 때(기동·reload) upstream·proxy_pass 에 적힌 호스트명을 DNS 로 해석하지 못해 [emerg] 로 설정 적용을 거부했다. DNS 서버 장애·/etc/hosts 누락·호스트명 오타가 흔한 원인이며, reload 중이면 이전 설정으로 계속 동작한다.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-PROXY-PROTOCOL-BROKEN
  severity: warn
  category: connection
  title: PROXY 프로토콜 헤더 오류
  immediate:
  - '`grep -n "broken header" /var/log/nginx/error.log | tail -20` 로 발생 시각·client IP 확인 — LB 헬스체크 IP 면 헬스체크 설정 문제'
  - '`nginx -T 2>/dev/null | grep -n "proxy_protocol"` 로 proxy_protocol 수신 포트 확인(읽기 전용)'
  short:
  - '(2차) LB 담당과 PROXY 프로토콜 송신(v1/v2) 설정을 대조하고, 헬스체크가 원인이면 LB 헬스체크도 PROXY 헤더를 보내도록 변경 요청(승인 후)'
  mid:
  - 'PROXY 프로토콜 수신 포트와 일반 포트를 분리하고 set_real_ip_from 신뢰 대역을 LB 대역으로 한정'
  long:
  - 'broken header 건수와 출처 IP 감시'
  vendor_cause: 'listen ... proxy_protocol 로 설정된 포트에 PROXY 프로토콜 헤더가 없거나 깨진 연결이 들어와 nginx 가 "broken header" 로 연결을 끊었다. 앞단 LB 의 PROXY 프로토콜 송신 설정 불일치나 LB 를 거치지 않은 직접 접속(헬스체크 포함)이 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-FASTCGI-FAIL
  severity: error
  category: upstream
  title: FastCGI 연결 실패
  immediate:
  - '`grep -n "fastcgi" /var/log/nginx/error.log | tail -20` 로 연결 대상(unix:/… 또는 IP:포트)·errno(2 없음·13 권한·111 거부·11 일시 불가) 확인'
  - '`systemctl status php-fpm` (서비스명은 환경에 따라 다름) 과 `ls -l <소켓경로>` 로 프로세스·소켓 소유자 확인'
  short:
  - '(2차·승인 후, 롤백: 설정 원복) 백엔드 기동·소켓 권한(listen.owner/listen.group) 정정, 풀 고갈이면 pm.max_children 조정 후 백엔드 재기동'
  mid:
  - '백엔드 풀 크기를 동시 요청량 기준으로 재산정하고 fastcgi_connect_timeout·헬스체크 정비'
  long:
  - 'FastCGI 502 비율과 백엔드 풀 사용률 감시'
  vendor_cause: 'nginx 가 FastCGI 백엔드(PHP-FPM 등)의 유닉스 소켓·TCP 포트에 연결하지 못했다. 백엔드 프로세스 중지, 소켓 파일 권한(nginx 실행 사용자 접근 불가), 백엔드 동시 처리 한도 초과가 흔한 원인이며 사용자에게 502 가 나간다.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-FASTCGI-STDERR
  severity: error
  category: upstream
  title: FastCGI 스크립트 오류
  immediate:
  - '`grep -n "FastCGI sent in stderr" /var/log/nginx/error.log | tail -20` 로 따옴표 안 백엔드 메시지(PHP Fatal error·Primary script unknown 등)와 요청 URL 확인'
  - 'Primary script unknown 이면 `nginx -T 2>/dev/null | grep -n "SCRIPT_FILENAME\|root "` 로 스크립트 경로 설정 확인'
  short:
  - '(2차) 애플리케이션 오류는 개발 담당에 메시지·URL 전달, 경로 설정 오류는 fastcgi_param SCRIPT_FILENAME 수정을 승인 후 적용(롤백: 설정 원복)'
  mid:
  - '백엔드 오류 로그를 별도 파일로 분리하고 오류 처리 코드 보강'
  long:
  - 'FastCGI stderr 건수·유형별 주간 집계'
  vendor_cause: 'FastCGI 백엔드(PHP 등)가 표준오류(stderr)로 메시지를 보내 nginx 가 그대로 error_log 에 남겼다("FastCGI sent in stderr"). 메시지 내용이 실제 원인이며 PHP 치명 오류·스크립트 미발견(Primary script unknown)이 흔하다.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-UPSTREAM-TEMP-FAIL
  severity: error
  category: disk
  title: 임시 파일 쓰기 실패
  immediate:
  - '`grep -n "temp" /var/log/nginx/error.log | tail -20` 로 실패 경로·errno(28 공간 부족·13 권한) 확인'
  - '`df -h <임시경로>` 와 `df -i <임시경로>` 로 공간·inode 확인, `namei -l <임시경로>` 로 워커 사용자 쓰기 권한 확인'
  short:
  - '(2차·승인 후, 롤백: 옮긴 파일 원위치) 같은 파일시스템의 오래된 로그·코어 파일을 다른 볼륨으로 이동해 공간 확보, 권한은 워커 사용자(user 지시어) 소유로 정정'
  mid:
  - '임시 경로를 전용 볼륨으로 분리하고 proxy_buffers·proxy_max_temp_file_size 로 임시 파일 사용량 조정'
  long:
  - '임시 경로 파일시스템 사용률 85%/95% 경보'
  vendor_cause: '업스트림 응답이나 요청 본문을 임시 파일(proxy_temp_path·client_body_temp_path)로 쓰지 못했다. 임시 경로 파일시스템 공간·inode 부족이나 nginx 워커 사용자의 디렉터리 쓰기 권한 부족이 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-SSL-STAPLING-FAIL
  severity: warn
  category: security
  title: OCSP 스테이플링 실패
  immediate:
  - '`grep -n -i "ocsp\|stapling" /var/log/nginx/error.log | tail -20` 로 실패 문구(resolver·timed out·verify) 확인'
  - '`openssl x509 -in <인증서> -noout -ocsp_uri` 로 OCSP URL 확인 후 `nginx -T 2>/dev/null | grep -n "resolver\|ssl_stapling\|ssl_trusted_certificate"` 로 설정 확인'
  short:
  - '(2차) 폐쇄망이면 OCSP 접근이 불가능하므로 ssl_stapling 비활성화를 승인 후 적용(롤백: 원복), 외부 가능 망이면 resolver·발급자 인증서 경로 정정'
  mid:
  - '망 구성에 맞는 OCSP stapling 사용 기준 수립'
  long:
  - 'OCSP stapling 오류 건수와 인증서 체인 정합성 정기 점검'
  vendor_cause: 'ssl_stapling on 설정에서 OCSP 응답자(인증서 발급 기관)로부터 응답을 받지 못했거나 응답 검증에 실패했다. 폐쇄망·방화벽으로 OCSP URL 접근 불가, resolver 미설정, 발급자 인증서(ssl_trusted_certificate) 누락이 흔한 원인이며 TLS 접속 자체는 대부분 계속된다.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-SSL-VERIFY-FAIL
  severity: error
  category: security
  title: 클라이언트 인증서 검증 실패
  immediate:
  - '`grep -n "certificate verify" /var/log/nginx/error.log | tail -20` 로 오류 번호(예 10 만료·20 발급자 없음)와 client IP 확인'
  - '`nginx -T 2>/dev/null | grep -n "ssl_verify_client\|ssl_client_certificate\|ssl_verify_depth"` 로 검증 설정 확인'
  short:
  - '(2차·승인 후, 롤백: CA 파일 원복) 발급 CA·중간 CA 를 ssl_client_certificate 파일에 추가하고 `nginx -t` 후 reload, 만료면 사용자 인증서 재발급 안내'
  mid:
  - '클라이언트 인증서 발급 체계·CA 묶음 파일 관리 표준화'
  long:
  - '클라이언트 인증서 만료 예정 목록 월간 점검'
  vendor_cause: 'ssl_verify_client 로 클라이언트 인증서를 검증하다 실패했다(client SSL certificate verify error). 클라이언트 인증서 만료, ssl_client_certificate 에 발급 CA 누락, 검증 깊이(ssl_verify_depth) 부족이 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-STREAM-UPSTREAM-FAIL
  severity: error
  category: upstream
  title: TCP 스트림 업스트림 실패
  immediate:
  - '`grep -n "while proxying\|while connecting to upstream" /var/log/nginx/error.log | tail -20` 로 업스트림 주소·errno 확인'
  - '`nc -zvw3 <upstream_ip> <port>` 로 nginx 서버에서 백엔드 포트 도달 여부 확인'
  short:
  - '(2차) 백엔드 담당에 장애 통보, 방화벽 차단이면 네트워크 담당에 해제 요청(승인 후)'
  mid:
  - 'stream upstream 에 다중 서버·max_fails/fail_timeout 구성'
  long:
  - 'stream 업스트림 연결 실패 건수 감시'
  vendor_cause: 'stream 모듈(TCP/UDP 프록시)에서 업스트림으로 연결·전달 중 오류가 났다("while proxying connection" 등). 백엔드 다운·방화벽 차단·proxy_timeout 초과가 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-CONN-RESET
  severity: warn
  category: connection
  title: 연결 리셋
  immediate:
  - '`grep -n "Connection reset by peer" /var/log/nginx/error.log | tail -20` 로 "while reading response header from upstream" 등 문맥 확인 — upstream 이면 백엔드 문제'
  - '업스트림 문맥이면 같은 시각 백엔드 로그·프로세스 기동 시각(`ps -o lstart`) 확인, 클라이언트 문맥이면 시간당 건수만 기록'
  short:
  - '(2차) 업스트림 리셋 반복이면 백엔드 keepalive 시간과 nginx keepalive_timeout(upstream keepalive) 정렬을 승인 후 적용'
  mid:
  - 'LB·방화벽 유휴 세션 타임아웃과 nginx·백엔드 keepalive 값 정렬'
  long:
  - '업스트림 리셋 건수 감시(클라이언트 리셋은 기준선 대비 급증만)'
  vendor_cause: '상대방(클라이언트 또는 업스트림)이 TCP RST 를 보내 연결이 강제로 끊겼다(104: Connection reset by peer). 메시지 끝의 "while … client/upstream" 문맥으로 상대를 구분하며, 클라이언트 쪽이면 대개 사용자 취소·중간 장비 세션 종료, 업스트림 쪽이면 백엔드 프로세스 비정상 종료가 흔하다.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-TOO-MANY-REDIRECTS
  severity: warn
  category: internal
  title: 리다이렉트 루프
  immediate:
  - '`grep -n "redirection cycle" /var/log/nginx/error.log | tail -10` 로 순환한 URI·server 확인'
  - '`nginx -T 2>/dev/null | grep -n "rewrite\|try_files\|error_page"` 로 해당 location 규칙 확인(읽기 전용)'
  short:
  - '(2차·승인 후, 롤백: 설정 원복) 순환 규칙 수정(last→break, try_files 마지막 인자를 =404 등으로) 후 `nginx -t` 성공 시 reload'
  mid:
  - 'rewrite 규칙 변경 시 시험 서버 재현 절차'
  long:
  - '500 응답 중 redirection cycle 건수 감시'
  vendor_cause: 'rewrite 또는 내부 리디렉션(try_files·error_page·index)이 10회 넘게 순환해 nginx 가 500 을 반환했다("rewrite or internal redirection cycle"). 서로를 가리키는 rewrite·try_files 마지막 인자가 자기 자신으로 돌아오는 설정이 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-REWRITE-CYCLE
  severity: error
  category: internal
  title: rewrite 순환
  immediate:
  - '`grep -n "rewrite or internal redirection cycle" /var/log/nginx/error.log | tail -10` 로 "while internally redirecting to" 뒤 URI 확인'
  - '`nginx -T 2>/dev/null | grep -n -B2 -A4 "location"` 로 해당 URI 가 거치는 location·rewrite 순서 확인'
  short:
  - '(2차·승인 후, 롤백: 설정 원복) 순환을 끊는 플래그(break)·조건 추가 후 `nginx -t` 와 시험 요청으로 확인한 뒤 reload'
  mid:
  - 'rewrite 규칙 단순화와 규칙별 시험 URL 목록 관리'
  long:
  - '설정 변경 시 자동 시험 요청 스크립트 운영'
  vendor_cause: 'rewrite 또는 내부 리디렉션(try_files·error_page·index)이 10회 넘게 순환해 nginx 가 요청을 중단하고 500 을 반환했다. 규칙끼리 서로를 가리키거나 대상 location 이 다시 같은 규칙을 타는 설정이 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
