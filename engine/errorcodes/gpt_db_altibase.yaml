- code: ERR-91015
  severity: error
  category: connection
  title: 통신 실패
  immediate:
  - "`tail -100 $ALTIBASE_HOME/trc/altibase_boot.log` — 오류 시각 전후 서버 시작·종료·timeout 기록 확인"
  - "버전 비교: isql 로 sys 접속 후 `SELECT PRODUCT_VERSION, PROTOCOL_VERSION FROM V$VERSION;` 와 클라이언트 드라이버(`ls -l <app_lib>/Altibase*.jar`) — 클라이언트가 서버보다 상위면 호환 원인"
  - "`SELECT STARTUP_PHASE, WORKING_TIME_SEC FROM V$INSTANCE;` — SERVICE 단계가 아니거나 가동 시간이 짧으면 서버 측 원인 (7.x 컬럼)"
  short:
  - 서버와 클라이언트 버전, 네트워크, 세션 종료 원인을 분석
  mid:
