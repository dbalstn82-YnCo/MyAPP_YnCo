- code: ERR-71016
  severity: critical
  category: capacity
  title: accept 시스템호출 실패
  immediate:
  - "`ps -ef | grep [a]ltibase` 로 PID 확인 뒤 `grep \"open files\" /proc/<PID>/limits` 와 `ls /proc/<PID>/fd | wc -l` (Linux, AIX 는 `procfiles <PID> | wc -l`) — 사용 수가 한도에 닿았으면 확정"
  - "altibase 계정 `ulimit -n` — 4096 미만이면 제조사 권고 미달(값 변경·재기동은 2차)"
  - "isql 로 sys 접속 후 `SELECT COUNT(*) FROM V$SESSION;` — 접속 수에 비해 FD 가 과다하면 파일·소켓 누수"
  short:
  - 열린 파일과 소켓 누수, OS 제한값을 점검
  mid:
  - 파일디스크립터 한도를 업무량에 맞게 조정
  long:
  - FD 사용률과 접속 폭주 조기경보를 운영
  source: GPT 수집·벤더 문서 대조 완료(https://docs.altibase.com/pages/viewpage.action?pageId=15138837)
  vendor_cause: 사용자 계정의 파일 디스크립터 수 한도를 초과한 상태에서 접속을 시도했다.
  vendor_action: ulimit -n 값을 확인해 늘리고 Altibase를 재시작한다. file descriptor는 unlimited, 최소 4096 이상을 권장한다.
  vendor_url: https://docs.altibase.com/pages/viewpage.action?pageId=15138837
  versions:
  - Altibase 5.x
  - Altibase 6.1.1
  - Altibase 6.3.1/6.5.1
