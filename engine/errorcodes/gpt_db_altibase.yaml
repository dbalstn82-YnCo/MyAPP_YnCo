- code: ERR-50032
  severity: error
  category: connection
  title: 클라이언트 접속 실패
  immediate:
  - "서버 측: `ps -ef | grep [a]ltibase` 와 `netstat -an | grep <PORT_NO> | grep LISTEN` — 리슨이 없으면 서버 미기동"
  - "클라이언트 측: `nc -zvw3 <server> <PORT_NO>` — 거부·시간초과면 IP·포트·방화벽 원인, 연결되면 계정 쪽 확인"
  - "계정 상태: isql 로 sys 접속 후 `SELECT USER_NAME, ACCOUNT_LOCK, FAILED_LOGIN_COUNT, DISABLE_TCP FROM SYSTEM_.DBA_USERS_ WHERE USER_NAME = '<USER>';` — 잠금·TCP 금지면 ERR-31370/410E3 절차로 (7.x 컬럼)"
  short:
  - 계정, IP, PORT_NO와 TCP 제한을 확인
  mid:
  - 접속 구성과 연결풀 정책을 표준화
  long:
  - 연결 헬스체크와 장애구간 모니터링을 운영
  source: GPT 수집·벤더 문서 대조 완료(https://docs.altibase.com/pages/viewpage.action?pageId=15138837)
  note: 클라이언트 연결 수립 실패로 단독 코드만으로 서비스 전체 중단을 뜻하지 않음
  vendor_cause: IP·포트·비밀번호 오입력, 계정 잠금 또는 TCP 접속 제한 등 접속 설정 문제가 있을 수 있다.
  vendor_action: 사용자 계정·비밀번호·접속 IP와 altibase.properties의 PORT_NO를 확인한다.
  vendor_url: https://docs.altibase.com/pages/viewpage.action?pageId=15138837
  versions:
