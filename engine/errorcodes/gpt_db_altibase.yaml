  vendor_cause: 상위 버전 클라이언트의 하위 서버 접속, timeout 세션 종료 또는 잘못된 서버 프로퍼티 등으로 발생할 수 있다.
  vendor_action: 서버·클라이언트 버전을 맞추고 timeout 종료 로그를 확인하며, 서버 기동 시 터미널·boot.log·properties를 점검한다.
