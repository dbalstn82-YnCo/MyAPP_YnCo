- code: ERR-01052
  severity: critical
  category: disk
  title: 파일 open/write 호출 실패
  immediate:
  - "`grep -rn \"ERR-01052\" $ALTIBASE_HOME/trc | tail -20` 로 errno·대상 파일 확인 — ENOSPC 면 공간, EMFILE 이면 FD 한도"
  - "`df -h <대상 디렉터리>` · `df -i <대상 디렉터리>` 와 `ls -l <대상 파일>` (소유자·권한) — 사용률 100%·권한 불일치면 확정"
  - "FD: `grep \"open files\" /proc/<PID>/limits` 와 `ls /proc/<PID>/fd | wc -l` (Linux) — 온라인 로그 파일은 지우지 말 것"
  short:
  - 데이터파일과 redo 로그 존재 여부, OS 로그를 점검
  mid:
  - 손상 또는 누락 파일을 백업으로 복구하고 스토리지 원인을 제거
  long:
  - 스토리지 이중화와 파일 무결성 검증을 정례화
  source: GPT 수집·벤더 문서 대조 완료(https://docs.altibase.com/pages/viewpage.action?pageId=15138837)
  note: 공식 예시는 open 또는 write 시스템 호출 실패이며 단순한 일반 I/O 코드로 한정되지 않음
  vendor_cause: 파일 디스크립터 수 한도 초과 또는 디스크 공간 부족으로 open/write 호출이 실패할 수 있다.
  vendor_action: ulimit -n을 늘려 재기동하거나 df/bdf로 공간을 확보한다. 온라인 로그 파일은 삭제하지 않는다.
  vendor_url: https://docs.altibase.com/pages/viewpage.action?pageId=15138837
