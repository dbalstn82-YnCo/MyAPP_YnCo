  - "UNDO 원인 여부: `SELECT * FROM V$DISK_UNDO_USAGE;` 와 `SELECT ID, SESSION_ID, FIRST_UPDATE_TIME FROM V$TRANSACTION WHERE FIRST_UPDATE_TIME > 0 ORDER BY FIRST_UPDATE_TIME LIMIT 10;` — 오래된 미완료 트랜잭션이 있으면 UNDO 원인"
  short:
