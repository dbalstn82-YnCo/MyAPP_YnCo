product: mysql
layer: db
note: GPT 협업 수집분 — 벤더 공식 문서와 대조 후 확정
codes:
- code: MY-SLOW-QUERY
  severity: warn
  category: performance
  title: 슬로우 쿼리 발생
  immediate:
  - "슬로우 로그 항목의 Query_time·Lock_time·Rows_sent·Rows_examined 와 SQL 기록 — Lock_time 이 크면 잠금 대기, Rows_examined 가 Rows_sent 보다 수백 배면 풀 스캔 의심"
  - "같은 쿼리가 지금도 실행 중인지 확인: `SELECT id, user, host, db, time, state, LEFT(info,100) FROM information_schema.PROCESSLIST WHERE command <> 'Sleep' ORDER BY time DESC LIMIT 20;` (읽기 전용)"
  - "잠금 대기면 `SELECT * FROM sys.innodb_lock_waits\\G` (5.7+, sys 스키마) 로 보유 세션 확인"
  short:
  - "(2차·승인 후) 서비스 영향이 큰 쿼리만 `KILL QUERY <id>` 로 중단(연결 유지) — 영향: 해당 트랜잭션 롤백, 롤백 불가이므로 업무 담당 확인 후. 실행계획은 `EXPLAIN <SQL>`(실행 안 함)로 확인"
  mid:
  - "인덱스 추가·쿼리 재작성과 배치 실행 시간대 분리"
  long:
  - "long_query_time 기준 슬로우 쿼리 건수 감시와 주간 상위 쿼리 튜닝 체계"
  vendor_cause: 실행 시간이 long_query_time 을 넘은 문장이 슬로우 쿼리 로그에 기록된 상태(파서 의사코드). 인덱스 미사용 풀 스캔, 잠금 대기, 대량 정렬·임시 테이블이 흔한 원인이다.
  source: 파서(mysql-slow)가 직접 부여하는 의사코드
  note: 의사코드
  versions:
  - MySQL 5.5
  - MySQL 5.6
  - MySQL 5.7
  - MySQL 8.0
  - MySQL 8.4
  - MySQL 9.x
  version_note: 슬로우 쿼리 로그 '# Query_time:' 형식 — 5.5~9.x 동일
