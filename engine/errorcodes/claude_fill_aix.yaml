  - AIX 7.2
  - AIX 7.3
  version_note: 일반 문구
- code: AIX-DNS-FAIL
  severity: error
  category: connection
  title: DNS 해석 실패
  vendor_cause: 이름 해석(resolver)이 DNS 서버로부터 응답을 받지 못했거나 이름이 없다는 응답을 받은 상태. DNS 서버 장애·방화벽
    차단, /etc/resolv.conf 오류, /etc/netsvc.conf 해석 순서 설정이 흔한 원인.
  immediate:
  - '`cat /etc/resolv.conf` 와 `cat /etc/netsvc.conf` 로 nameserver·해석 순서(hosts=local,bind
    등) 확인'
  - '`nslookup <host> <nameserver>` 로 서버별 응답 확인, `ping -c 3 <nameserver>` 로 도달성 확인'
  short:
  - '(2차·승인 후, 롤백: 원본 파일 백업 복원) 장애 서버를 resolv.conf 에서 뒤로 돌리거나, 업무 핵심 호스트는 /etc/hosts
    임시 등록'
  mid:
  - DNS 서버 2대 이상 지정·options timeout/attempts 조정, 핵심 호스트의 hosts 파일 관리 기준 수립
  long:
  - 주요 이름의 해석 시간·실패를 주기 점검하는 감시 등록
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
