  - AIX 7.1
  - AIX 7.2
  - AIX 7.3
  version_note: resolver 문구 전 버전
- code: AIX-NIM-FAIL
  severity: warn
  category: internal
  title: NIM 작업 실패
  vendor_cause: NIM(Network Installation Management) 작업(설치·mksysb 복원·업데이트)이 실패한 상태.
    NIM 마스터-클라이언트 간 네트워크·NFS export 문제, 리소스(lpp_source/SPOT) 불일치, 클라이언트 상태(Cstate)
    잔류가 흔한 원인.
  immediate:
  - NIM 마스터에서 `lsnim -l <client>` 로 Cstate·info·err_info 확인
  - '`nim -o showlog <client>` 로 설치 로그 확인, `showmount -e <NIM마스터>` 로 NFS export 상태
    확인'
  short:
  - '(2차·승인 후, 롤백: 이전 Cstate 기록) 원인 해결 후 `nim -Fo reset <client>` 와 `nim -o deallocate
    -a subclass=all <client>` 로 상태 정리 후 재수행'
  mid:
  - lpp_source/SPOT 레벨을 대상 TL/SP 와 일치하게 재구성(`nim -o check`), 클라이언트 /etc/niminfo 정합성
    점검
  long:
  - NIM 작업 결과와 리소스 레벨을 월별 점검 항목으로 관리
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - AIX 5.3
  - AIX 6.1
  - AIX 7.1
  - AIX 7.2
  - AIX 7.3
  version_note: NIM 전 버전
