- code: AIX-PROCESS-KILLED
  severity: error
  category: internal
  title: 프로세스 강제 종료
  vendor_cause: 프로세스가 신호로 비정상 종료된 상태. AIX 에서는 페이징 공간 부족 시 커널이 SIGDANGER 후 프로세스를 끝내는
    경우(PGSP_KILL)가 대표적이며, 운영자 kill 명령·애플리케이션 자체 abort 도 원인.
  immediate:
  - '`errpt | grep -i -E ''pgsp|core''` 로 같은 시각 페이징 부족·코어 항목 확인, `lsps -s` 로 현재 페이징
    사용률 확인'
  - 애플리케이션 로그와 `last | head -20`, `who` 로 그 시각 운영자 작업 여부를 대조
  short:
  - (2차·승인 후) 페이징 부족이 원인이면 메모리 상위 프로세스 정리·재시작 일정 수립, 운영자 작업이면 작업 절차 재확인
  mid:
  - 페이징 공간 증설(`chps -s`) 또는 메모리 증설, 애플리케이션 메모리 한도(ulimit data/rss) 정비
  long:
  - lsps 사용률 70% 감시와 프로세스 생존 감시(SRC/모니터링 도구) 등록
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - AIX 5.3
  - AIX 6.1
