  - "오류 로그 위치 `SELECT @@log_error;` 확인 후 같은 시각 InnoDB 메시지 `tail -200 <오류 로그 경로>` — 13 이면 `ls -ld <datadir>` 소유자가 mysql 인지 대조"
  short:
  - "(2차·승인 후, 롤백: 변경 전 my.cnf·systemd override 백업) 원인별 조치 — 디스크는 binlog 를 `PURGE BINARY LOGS BEFORE '<시각>';` 로만 정리(파일 직접 삭제 금지), 권한은 datadir 소유권 mysql:mysql 복구, 파일 수는 open_files_limit·LimitNOFILE 상향 후 서비스 재시작"
  mid:
