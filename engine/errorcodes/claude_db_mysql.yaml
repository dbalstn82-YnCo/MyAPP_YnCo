  severity: error
  category: internal
  title: 스토리지 엔진 반환 오류
  immediate:
  - "오류 원문의 errno 의미 조회: `perror <errno>` (MySQL 5.7·8.0 bin 포함) — 28 디스크 부족, 13 권한, 24 열린 파일 수 한도 (읽기 전용)"
