- code: '51'
  severity: warn
  category: disk
  title: 페이징 작업 중 오류
  immediate:
  - 'Disk 51 대상 장치 확인: `Get-WinEvent -FilterHashtable @{LogName="System"; Id=51} -MaxEvents 20 | fl TimeCreated,Message` — 이벤트 XML(세부 정보)의 NTSTATUS·SCSI Sense 값 기록 (2008 R2+)'
  - '`Get-CimInstance Win32_PageFileUsage | ft Name,AllocatedBaseSize,CurrentUsage` 로 페이지 파일이 해당 디스크에 있는지 확인'
  - 같은 시각 Disk 7·11·153 동반 여부와 `Get-PhysicalDisk | ft FriendlyName,HealthStatus` 확인 — 이동식/USB 미디어면 영향 낮음
  short:
  - (2차) Learn "Event ID 51" 문서 기준으로 이벤트 데이터의 NTSTATUS·SCSI Sense 를 해석해 매체/경로 원인 구분, (승인 후) 하드웨어 진단 의뢰
  mid:
  - 결함 디스크·경로 교체, 페이지 파일을 안정적인 디스크로 이전(재부팅 필요·승인 후)
  long:
  - Disk 51 반복 경보와 디스크 오류 누계 감시
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/troubleshoot/windows-server/backup-and-storage/event-id-51-information)
  note: Event Type Warning
  vendor_cause: 디스크와 메모리 사이의 페이징 또는 버퍼 I/O 중 일반적인 디스크 오류가 발생함
  vendor_action: 이벤트 데이터의 NTSTATUS·SCSI 상태와 대상 디스크를 해석해 원인을 식별; 무해한 특정 이동식 미디어 사례는 조치 불필요
  vendor_url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/backup-and-storage/event-id-51-information
