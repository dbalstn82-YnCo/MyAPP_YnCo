product: windows
layer: os
note: GPT 협업 수집분 — 벤더 공식 문서와 대조 후 확정
codes:
- code: '7'
  severity: error
  category: disk
  title: 디스크 불량 블록
  immediate:
  - 'Disk 7 발생 장치·빈도 확인: `Get-WinEvent -FilterHashtable @{LogName="System"; Id=7} -MaxEvents 20 | fl TimeCreated,ProviderName,Message` — 원본이 disk 이고 본문의 \Device\HarddiskN\DRn 으로 디스크 번호 식별 (2008 R2+)'
  - '`Get-PhysicalDisk | ft DeviceId,FriendlyName,MediaType,HealthStatus,OperationalStatus` 와 `Get-PhysicalDisk | Get-StorageReliabilityCounter | ft DeviceId,ReadErrorsTotal,ReadErrorsUncorrected,Wear` 로 디스크 상태·오류 누계 확인 (2012+, 하드웨어 RAID 뒤는 벤더 도구)'
  - 해당 볼륨의 최근 백업 성공 여부 확인(`wbadmin get versions` 또는 백업 솔루션 콘솔) — 검사·수리는 2차
  short:
  - '(2차·승인 후, 롤백: 백업에서 복원) 백업 확보 후 업무 중단 시간에 `chkdsk <드라이브>: /r` 로 불량 섹터 검사·복구, 하드웨어 RAID 면 벤더 진단(iLO/iDRAC·스토리지 관리 도구) 우선'
  mid:
  - 불량 블록이 반복되는 디스크 교체(RAID 재구성 완료 확인), 컨트롤러 펌웨어·드라이버를 벤더 호환표 기준으로 갱신
  long:
  - Disk 7/11/51/153 이벤트 경보와 Get-StorageReliabilityCounter 오류 누계 추세 감시, 디스크 예방 교체 기준 운영
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/troubleshoot/windows-server/backup-and-storage/iscsi-storage-connectivity-troubleshooting)
  note: 공식 Learn 확인
  vendor_cause: 'System 로그 원본 disk 이벤트 7 "The device, \Device\HarddiskN\DRn, has a bad block." — 디스크 드라이버가 해당 디스크의 블록을 읽거나 쓰다가 매체 오류(불량 블록)를 돌려받았다는 뜻으로, 그 블록의 데이터가 손상·유실됐을 수 있다. 흔한 원인은 HDD/SSD 매체 노화·불량 섹터이며 케이블·컨트롤러 이상에서도 나오고, 장치가 CdRom 이면 광학 매체 문제다.'
  verify_note: 미검증 — 이벤트 7 메시지 원문은 Microsoft Q&A 사례로만 확인, Microsoft Learn 공식 참조 문서(Q&A 제외)에서 disk 7 정의 본문을 찾지 못함. vendor_url(iSCSI 연결 문서)은 간접 근거
  vendor_action: 디스크·컨트롤러를 교체하고 제조사 진단 도구로 저장장치 상태를 검사
  vendor_url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/backup-and-storage/iscsi-storage-connectivity-troubleshooting
  versions:
  - Windows Server 2003
  - 2008/R2
  - 2012/R2
  - '2016'
  - '2019'
  - '2022'
  - '2025'
  version_note: 이벤트 ID 전 버전 공통(2003 포함). CSV 내보내기는 2008 R2+ Get-WinEvent, 2003/2008 은 wevtutil/Get-EventLog
- code: '11'
  severity: error
  category: disk
  title: 컨트롤러 오류
  immediate:
  - 'Disk 11 대상 장치·빈도 확인: `Get-WinEvent -FilterHashtable @{LogName="System"; Id=11} -MaxEvents 20 | fl TimeCreated,ProviderName,Message` (2008 R2+)'
  - '같은 시각 Storport 129(리셋)·Disk 153(재시도)·Disk 51 동반 확인: `Get-WinEvent -FilterHashtable @{LogName="System"; Id=129,153,51; StartTime=(Get-Date).AddHours(-6)} | fl TimeCreated,Id,ProviderName,Message`'
  - '`Get-PhysicalDisk | ft FriendlyName,BusType,HealthStatus,OperationalStatus` (2012+) 와 MPIO 환경은 `mpclaim -s -d` 로 경로 상태 확인'
  short:
  - '(2차) `Get-CimInstance Win32_SCSIController | ft Name,DriverName,Status` 로 컨트롤러 드라이버 확인 후 (승인 후, 롤백: 이전 드라이버로 롤백) 벤더 권장 드라이버·펌웨어 적용, 케이블·SFP 점검'
  mid:
  - 반복 컨트롤러·HBA 교체, 서드파티 DSM 이면 공급업체 지원 버전으로 정비
  long:
  - Disk 11·Storport 129 이벤트 감시와 스토리지 펌웨어·드라이버 버전 대장 관리
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/troubleshoot/windows-server/backup-and-storage/windows-server-mpio-troubleshooting)
  note: 공식 Learn 확인
  vendor_cause: 디스크 드라이버가 \Device\HarddiskN\DRn 또는 포트 장치에서 컨트롤러 오류를 감지했다고 보고한 상태 — HBA/RAID 컨트롤러·케이블·SAN 경로·디스크 펌웨어 문제나 스토리지 드라이버(서드파티 DSM 포함) 결함이 흔한 원인.
  vendor_action: 물리·논리 스토리지 경로를 확인하고 스토리지 펌웨어·드라이버를 갱신; 서드파티 DSM이면 해당 공급업체 확인
  vendor_url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/backup-and-storage/windows-server-mpio-troubleshooting
  versions:
  - Windows Server 2003
  - 2008/R2
  - 2012/R2
  - '2016'
  - '2019'
  - '2022'
  - '2025'
  version_note: 이벤트 ID 전 버전 공통(2003 포함). CSV 내보내기는 2008 R2+ Get-WinEvent, 2003/2008 은 wevtutil/Get-EventLog
- code: '15'
  severity: error
  category: disk
  title: 장치 준비 안됨
  immediate:
  - 'Disk 15 대상 장치·발생 시각 확인: `Get-WinEvent -FilterHashtable @{LogName="System"; Id=15} -MaxEvents 20 | fl TimeCreated,ProviderName,Message` (2008 R2+)'
  - '`Get-Disk | ft Number,FriendlyName,OperationalStatus,HealthStatus,IsOffline` 로 디스크 Online/Offline 상태 확인 (2012+)'
  - iSCSI 면 `Get-IscsiSession | ft TargetNodeAddress,IsConnected` (2012+), MPIO 면 `mpclaim -s -d` 로 경로 연결 확인
  short:
  - '(2차·승인 후, 롤백: 원래 경로 구성 유지) 스토리지·SAN 담당과 경로(케이블·스위치 존·타깃 포트) 복구 후 `Get-Disk` Online 확인 — 클러스터 디스크는 장애 조치 클러스터 관리자에서만 온라인 전환'
  mid:
  - 스토리지 경로 이중화(MPIO)와 iSCSI/FC 타임아웃 값을 벤더 권장값으로 정비
  long:
  - Disk 15·153·Storport 129 경보와 스토리지 경로 상태 정기 점검
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/troubleshoot/windows-server/performance/registry-troubleshooting-advanced-users)
  note: Disk 15 존재 확인, 현재 의미 유지
  vendor_cause: 'System 로그 원본 disk 이벤트 15 "The device, \Device\HarddiskN\DRn, is not ready for access yet." — OS 가 디스크에 I/O 를 보냈는데 장치가 아직 접근 준비가 안 됐다(Not Ready)고 응답한 상태. 흔한 원인은 SAN·iSCSI 경로 끊김이나 LUN 미응답, 디스크 기동 지연, 컨트롤러·드라이버 구성 오류이며, 이벤트 9·11 과 함께 반복되면 저장장치 하드웨어 문제 신호다(Microsoft KB 822705).'
  verify_note: 미검증 — 이벤트 15 메시지 원문은 Microsoft Q&A 사례로만 확인, Microsoft Learn 공식 문서에는 '9·11·15 는 하드웨어 문제 신호' 라는 언급(KB 822705)만 있고 15 단독 정의 본문은 없음
  vendor_action: 해당 디스크에 chkdsk /r을 실행하고 컨트롤러 펌웨어·드라이버와 시스템 BIOS를 최신화
  vendor_url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/performance/registry-troubleshooting-advanced-users
  versions:
