- code: '57'
  severity: error
  category: storage
  title: NTFS 데이터 플러시 실패
  vendor_cause: NTFS 가 트랜잭션 로그로 데이터를 플러시하지 못해 "Corruption may occur" 를 남긴 경고 — 외장/USB 디스크 비정상 제거, SAN·iSCSI 경로 단절, 스토리지 응답 지연(Device Busy)·디스크 고장이 흔한 원인이며 이후 NTFS 손상(55)으로 이어질 수 있다.
  immediate:
  - 'Ntfs 57 의 볼륨·장치 확인: `Get-WinEvent -FilterHashtable @{LogName="System"; Id=57} -MaxEvents 20 | fl TimeCreated,ProviderName,Message` (2008 R2+)'
  - '같은 시각 저장 경로 이벤트 확인: `Get-WinEvent -FilterHashtable @{LogName="System"; Id=129,153,157; StartTime=(Get-Date).AddHours(-6)} | fl TimeCreated,Id,ProviderName,Message`'
  - '`fsutil dirty query <드라이브>:` 와 `Get-Volume | ft DriveLetter,FileSystem,HealthStatus,SizeRemaining` (2012+) 로 볼륨 dirty·상태 확인'
  short:
  - '(2차·승인 후, 롤백: 백업 복원) 저장 경로 복구 후 `chkdsk <드라이브>: /scan` (2012+, 수정 없이 온라인 검사), 손상 발견 시 업무 중단 시간에 `chkdsk <드라이브>: /spotfix` 또는 `/f`'
  mid:
  - 외장 디스크는 안전 제거 절차 적용, SAN/iSCSI 는 MPIO·타임아웃 값 정비
  long:
  - Ntfs 55/57/98·Disk 153 이벤트 경보와 백업 복구 훈련
  source: GPT 수집·공식 문서 미확인(보류)(https://learn.microsoft.com/en-us/answers/questions/1065891/event-57-on-2008r2)
  note: Learn Q&A만 확인, 공식문서 미확인
