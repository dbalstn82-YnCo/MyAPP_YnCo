- code: '134'
  severity: warn
  category: connection
  title: Time-Service NTP DNS실패
  immediate:
  - '`w32tm /query /status` 와 `w32tm /query /peers` 로 현재 시간원·마지막 동기 시각·Stratum 확인'
  - '`w32tm /query /configuration` 의 NtpServer 값 확인 후 `Resolve-DnsName <NTP서버>` (2012+) 또는 `nslookup <NTP서버>` 로 이름 해석 확인'
  - '`w32tm /stripchart /computer:<NTP서버> /samples:3 /dataonly` 로 UDP 123 응답·오프셋 확인 — 오류면 방화벽·서버 NTP 광고 상태 확인'
  short:
  - '(2차·승인 후, 롤백: 이전 NtpServer 값 복원) 도메인 구성원은 도메인 계층(NT5DS) 사용 확인, PDC 에뮬레이터·독립 서버는 `w32tm /config /manualpeerlist:"<서버>,0x8" /syncfromflags:manual /update` 후 `w32tm /resync`'
  mid:
  - NTP 서버 이름의 DNS 등록과 UDP 123 방화벽 정책 문서화, 도메인에서는 PDC 에뮬레이터만 기준 시간원 사용
  long:
  - w32tm 오프셋 정기 측정과 Time-Service 경고 이벤트 감시
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/error-message-run-w32tm-resync-no-time-data-available)
  note: Critical→Warning, DNS 실패로 유형 수정
  vendor_cause: NTP 서버 DNS 해석 실패·잘못된 이름/IP, UDP 123 차단 또는 서버가 NTP를 광고하지 않음
  vendor_action: NTPServer 이름·IP와 DNS를 확인하고 UDP 123 트래픽을 점검하며 대상 서버의 NTP 광고 상태를 확인
  vendor_url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/error-message-run-w32tm-resync-no-time-data-available
  versions:
