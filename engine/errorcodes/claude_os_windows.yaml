- code: '1000'
  severity: error
  category: internal
  title: 애플리케이션 오류
  immediate:
  - '`Get-WinEvent -FilterHashtable @{LogName="Application"; Id=1000} -MaxEvents 20 | fl TimeCreated,Message` 로 실패 애플리케이션·모듈·예외 코드·발생 빈도 확인 (2008 R2+)'
  - 'WER 보고서 확인: `Get-ChildItem C:\ProgramData\Microsoft\Windows\WER\ReportArchive | Sort-Object LastWriteTime -Descending | Select-Object -First 5`'
  - 해당 서비스면 `Get-Service <서비스> | fl Name,Status,StartType` 로 현재 기동 상태 확인 — 재기동은 2차
  short:
  - '(2차) 실패 모듈이 서드파티 DLL 이면 공급업체 확인, 시스템 모듈이면 `sfc /verifyonly` 로 점검 후 (승인 후, 롤백: 백업·시스템 복원 지점) `sfc /scannow`, 덤프는 WinDbg `!analyze -v` 로 분석'
  mid:
  - '(2차·승인 후, 롤백: 추가한 키 삭제) WER LocalDumps(HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps) 로 크래시 덤프 수집 설정, 결함 버전 패치'
  long:
  - Application Error 1000 발생 횟수 감시(프로세스별 일 1회 이상 경보)와 패치 회귀 시험
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/troubleshoot/windows-client/shell-experience/microsoft-store-apps-fail-to-start)
  note: 공식 Learn 확인
  vendor_cause: Application Error — 애플리케이션 프로세스가 처리되지 않은 예외로 비정상 종료됨. 본문의 실패 애플리케이션·실패 모듈·예외 코드(예 0xc0000005 접근 위반)가 원인 단서이며, 문서 사례로 레지스트리·파일 권한이 기본값에서 바뀌어 초기화 중 Access Denied 가 나는 경우가 있다.
  vendor_action: '문서 사례: ALL APPLICATION PACKAGES에 필요한 권한을 복원하고 권한을 변경하는 그룹 정책도 수정'
