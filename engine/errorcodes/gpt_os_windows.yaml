product: windows
layer: os
note: GPT 협업 수집분 — 벤더 공식 문서와 대조 후 확정
codes:
- code: '98'
  severity: error
  category: storage
  title: 볼륨 복구 필요
  immediate:
  - '`Get-WinEvent -FilterHashtable @{LogName="System"; Id=98} -MaxEvents 20 | fl TimeCreated,Message` 로 대상 볼륨·문구 확인 — "needs to be taken offline"(오프라인 Chkdsk 필요)면 확정, "is healthy" 면 정보성 (2012 R2+)'
  - '`Get-Volume -DriveLetter <X> | fl HealthStatus,OperationalStatus` 와 `fsutil dirty query <X>:` 로 볼륨 상태·dirty 비트 확인(읽기 전용, 관리자) — Healthy 가 아니거나 Dirty 면 손상 표시 (2012 R2+)'
  - 해당 볼륨을 쓰는 서비스와 최근 백업 성공 시각 확인(`wbadmin get versions`, Windows Server Backup 사용 시) — 복구 작업 전 데이터 보호 판단 근거
  short:
  - '(2차·승인 후, 롤백: 사전 백업에서 복원) 정지 시간에 `Repair-Volume -DriveLetter <X> -OfflineScanAndFix` 또는 `chkdsk <X>: /f` 수행 — 볼륨 잠금·서비스 중단 동반'
  - CHKDSK 검사 결과와 디스크 및 파일시스템 이벤트를 분석
  mid:
  - 정비창에 Repair-Volume 또는 CHKDSK 복구를 수행
  long:
  - 볼륨 상태검사와 스토리지 오류 조기경보를 운영
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/troubleshoot/windows-server/backup-and-storage/troubleshoot-data-corruption-and-disk-errors)
  note: 오프라인 Chkdsk 필요 사례
  vendor_cause: 불량 섹터가 있거나 파일시스템의 I/O 요청이 디스크 서브시스템에서 정상 완료되지 않아 NTFS가 손상됨
  vendor_action: chkdsk /f /r을 실행하고 하드웨어 상태·SCSI/RAID 드라이버·필터 드라이버·스토리지 펌웨어를 확인·갱신
  vendor_url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/backup-and-storage/troubleshoot-data-corruption-and-disk-errors
  versions:
  - Windows Server 2012/R2
  - '2016'
  - '2019'
  - '2022'
  - '2025'
  version_note: NTFS 98(볼륨 복구 필요) 2012 이후
- code: '129'
  severity: warn
  category: storage
  title: Storport 장치 리셋
  immediate:
  - '`Get-WinEvent -FilterHashtable @{LogName="System"; Id=129,153,157} -MaxEvents 30 | ft TimeCreated,Id,ProviderName -AutoSize` 로 RaidPort 번호·발생 간격·Disk 153/157 동반 확인 — 수 분 간격 반복이면 경로·장치 이상 (2008 R2+)'
  - '`Get-PhysicalDisk | ft FriendlyName,HealthStatus,OperationalStatus` (2012+) 와 MPIO 구성 시 `mpclaim -s -d` 로 디스크·경로 상태 확인 — Healthy 아님 또는 경로 수 감소면 경로 장애'
  - '`Get-Counter "\PhysicalDisk(*)\Avg. Disk sec/Transfer" -SampleInterval 2 -MaxSamples 5` 로 지연 확인 — 0.025(25ms) 이상 지속이면 스토리지 과부하·응답 지연'
  short:
  - '(2차·승인 후, 롤백: 원래 작업 일정 복원) 백업·배치 등 대량 I/O 작업 시간대를 옮겨 스토리지 부하 완화'
  - HBA와 SAN 및 MPIO와 드라이버 타임아웃 로그를 분석
  mid:
  - 스토리지 경로와 펌웨어 및 드라이버를 개선하거나 결함 부품을 교체
  long:
  - 스토리지 latency와 reset 이벤트를 상시 모니터링
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/troubleshoot/windows-server/backup-and-storage/troubleshoot-data-corruption-and-disk-errors)
  note: Critical→Warning
  vendor_cause: 스토리지 과부하로 요청이 시간초과되며 LUN 무응답 또는 불량 SAN 라우터 같은 하드웨어 문제가 원인일 수 있음
  vendor_action: 스토리지 네트워크 안정성과 LUN 응답을 확인하고 디스크 timeout 조정은 스토리지 공급업체 지침에 따라 수행
  vendor_url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/backup-and-storage/troubleshoot-data-corruption-and-disk-errors
  versions:
  - Windows Server 2008/R2
  - 2012/R2
  - '2016'
  - '2019'
  - '2022'
  - '2025'
  version_note: Storport 129 는 2008 이후
- code: '157'
  severity: warn
  category: storage
  title: Disk 예기치 않은 제거
  immediate:
  - '`Get-WinEvent -FilterHashtable @{LogName="System"; Id=157,153,129} -MaxEvents 30 | fl TimeCreated,Id,Message` 로 제거된 디스크 번호·Storport 리셋 동반·반복 여부 확인 (2008 R2+)'
  - '`Get-Disk | ft Number,FriendlyName,OperationalStatus,HealthStatus,IsOffline` (2012+) 로 해당 디스크 존재·Offline 여부 확인 — 목록에 없거나 Offline 이면 확정, MPIO 면 `mpclaim -s -d` 로 남은 경로 수 확인'
  - 해당 디스크를 쓰는 서비스(DB·파일 공유)와 최근 백업 시각 확인 — 쓰기 중지 여부는 2차에서 결정
  short:
  - '(2차·승인 후, 롤백: 경로 복구 후 서비스 재기동) 경로가 복구될 때까지 해당 볼륨에 쓰는 서비스 중지로 데이터 보호'
  - 스토리지 연결과 케이블 및 HBA와 디스크 이벤트를 상관분석
  mid:
  - 결함 경로 또는 장비를 교체하고 다중경로 구성을 검증
  long:
  - 디스크 연결상태와 path loss 이벤트를 실시간 감시
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/troubleshoot/azure/virtual-machines/windows/disk-has-been-surprise-removed-event-id-157)
  note: Critical→Warning
  vendor_cause: SAN·SCSI 통신 장애, 디스크 고장·분리, 과도한 I/O, 낮은 timeout 또는 VM 메모리 부족으로 디스크 통신이 끊김
  vendor_action: 디스크·연결·I/O 상태와 timeout 설정을 점검하고 Azure에서는 디스크 상태·성능·throttling을 확인
  vendor_url: https://learn.microsoft.com/en-us/troubleshoot/azure/virtual-machines/windows/disk-has-been-surprise-removed-event-id-157
  versions:
  - Windows Server 2012/R2
  - '2016'
  - '2019'
  - '2022'
  - '2025'
  version_note: Disk 157 은 2012 이후
- code: '2019'
  severity: error
  category: memory
  title: Srv 비페이징 풀 고갈
  immediate:
  - '`Get-Counter "\Memory\Pool Nonpaged Bytes","\Memory\Available MBytes" -SampleInterval 5 -MaxSamples 6` 로 비페이징 풀 크기·추세 확인 — 계속 증가하면 누수 의심 (2008 R2+)'
  - '`Get-Process | Sort-Object NPM -Descending | Select-Object -First 10 Name,Id,NPM,Handles` 로 프로세스별 비페이징 풀·핸들 상위 확인 — 핸들이 수십만이면 해당 프로세스 누수'
  - '`poolmon.exe -b` (WDK 도구 설치 시) 로 태그별 사용량 상위 확인, 태그의 드라이버는 `findstr /m /l <태그> C:\Windows\System32\drivers\*.sys` 로 식별'
  short:
  - pool tag와 드라이버별 nonpaged pool 증가 추세를 분석
  mid:
  - 메모리 누수 드라이버를 업데이트 또는 교체하고 서버 메모리를 재산정
  long:
  - 커널 풀 사용률과 드라이버 누수 회귀시험을 운영
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/troubleshoot/outlook/data-files/limits-using-pst-files-over-lan-wan)
  note: Critical→Error
  vendor_cause: 'Server(Srv) 서비스가 시스템 비페이징 풀에서 메모리를 할당하지 못한 상태(풀이 비어 있음) — 드라이버·필터 드라이버의 풀 누수, 과도한 핸들·연결 수, 느린 I/O 로 Server 작업 항목이 쌓이는 경우가 흔한 원인. 예: 네트워크 PST 파일 I/O 지연으로 작업 큐가 쌓인 사례'
  vendor_action: '문서 사례: 공유 PST를 분리하고 Exchange 파일과 동일 스토리지에 PST를 두지 않음'
  vendor_url: https://learn.microsoft.com/en-us/troubleshoot/outlook/data-files/limits-using-pst-files-over-lan-wan
  versions:
  - Windows Server 2003
  - 2008/R2
  - 2012/R2
  - '2016'
  - '2019'
  - '2022'
  - '2025'
  version_note: 이벤트 ID 전 버전 공통(2003 포함). CSV 내보내기는 2008 R2+ Get-WinEvent, 2003/2008 은 wevtutil/Get-EventLog
- code: '2020'
  severity: error
  category: memory
  title: Srv 페이징 풀 고갈
  immediate:
  - '`Get-Counter "\Memory\Pool Paged Bytes","\Memory\Pool Paged Resident Bytes" -SampleInterval 5 -MaxSamples 6` 로 페이징 풀 크기·추세 확인 — 계속 증가하면 누수 의심 (2008 R2+)'
  - '`Get-Process | Sort-Object PagedSystemMemorySize64 -Descending | Select-Object -First 10 Name,Id,PagedSystemMemorySize64,Handles` 로 페이징 풀·핸들 상위 프로세스 확인'
  - '`(Get-SmbOpenFile).Count` (2012+) 로 SMB 열린 파일 수 확인 — 평소보다 크게 많으면 열린 파일 누적이 원인, 태그별 확인은 `poolmon.exe -b` (WDK 도구 설치 시)'
  short:
  - '(2차·승인 후, 롤백: 서비스 재기동·시작 유형 원복) 원인 프로세스·비필수 서비스 중지로 페이징 풀 부담 완화'
  - PoolMon으로 과다 pool tag와 열린 파일 및 드라이버 누수를 분석
  mid:
  - 원인 드라이버와 서비스 설정을 수정하고 패치를 적용
  long:
  - Paged Pool 사용률과 누수 추세를 지속 모니터링
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/troubleshoot/windows-server/performance/unable-allocate-memory-system-paged-pool)
  note: Critical→Error
  vendor_cause: 많은 열린 파일 등으로 paged pool이 소진되고 Memory Manager가 수요 증가 속도만큼 빠르게 trim하지 못함
  vendor_action: 레지스트리를 백업한 뒤 PoolUsageMaximum을 60으로 설정하고 필요하면 PagedPoolSize를 0xFFFFFFFF로 설정
  vendor_url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/performance/unable-allocate-memory-system-paged-pool
  versions:
