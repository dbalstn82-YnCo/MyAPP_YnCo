  - 2008/R2
  - 2012/R2
  - '2016'
  - '2019'
  - '2022'
  - '2025'
  version_note: 이벤트 ID 전 버전 공통(2003 포함). CSV 내보내기는 2008 R2+ Get-WinEvent, 2003/2008 은 wevtutil/Get-EventLog
- code: '4227'
  severity: warn
  category: capacity
  title: Tcpip 송신 포트 고갈
  immediate:
  - '`netstat -ano | find /c "TIME_WAIT"` 와 `netstat -ano | find /c "ESTABLISHED"` 로 상태별 연결 수 확인 — 동적 포트 범위 크기(기본 16384개)에 근접하면 고갈'
  - '`netsh int ipv4 show dynamicport tcp` 로 동적 포트 범위 확인 (2008+), `Get-NetTCPConnection | Group-Object OwningProcess | Sort-Object Count -Descending | Select-Object -First 5 Name,Count` (2012+) 로 포트를 가장 많이 쓰는 PID 확인'
  short:
  - '(2차·승인 후, 롤백: 설정 원복) 포트를 과다 소비하는 애플리케이션의 신규 연결 생성 제한 또는 연결 재사용 설정 적용'
  - 프로세스별 ephemeral port 사용량과 연결풀 누수를 분석
  mid:
  - 연결 재사용과 풀 설정 및 포트 범위를 워크로드에 맞게 조정
  long:
  - 포트 사용률과 신규 연결률 및 TIME_WAIT 추세를 감시
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/troubleshoot/windows-server/printing/printing-pauses-event-2004-4227-lpr-port)
  note: Critical→Warning
  vendor_cause: 'TCP/IP 가 선택한 로컬 끝점(포트)이 같은 원격 끝점에 최근 사용되어(TIME_WAIT) 송신 연결을 맺지 못한 상태 — 짧은 연결을 빠르게 열고 닫아 사용 가능한 로컬 포트가 소진될 때 흔히 발생. 예: LPR 이 TCP 721~731 의 11개 포트만 써서 인쇄 연결 반복 시 소진된 사례'
  vendor_action: '문서 사례: LPR 대신 표준 TCP/IP 포트 사용을 권장'
  vendor_url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/printing/printing-pauses-event-2004-4227-lpr-port
  versions:
  - Windows Server 2008/R2
  - 2012/R2
  - '2016'
  - '2019'
  - '2022'
  - '2025'
  version_note: Tcpip 4227 2008 이후
- code: '4231'
  severity: warn
  category: capacity
  title: Tcpip 임시 포트 할당 실패
  immediate:
  - '`Get-NetTCPConnection | Group-Object State | ft Name,Count` (2012+) / `netstat -ano | find /c "TIME_WAIT"` (2008 R2) 로 상태별 연결 수 확인 — TIME_WAIT·BOUND 합이 동적 포트 범위(기본 16384개)에 근접하면 고갈'
  - '`netsh int ipv4 show dynamicport tcp` 로 범위 확인, `Get-NetTCPConnection | Group-Object OwningProcess | Sort-Object Count -Descending | Select-Object -First 5 Name,Count` (2012+) 로 포트 소비 상위 PID 확인 후 `Get-Process -Id <PID>` 로 프로세스 식별'
  short:
  - '(2차·승인 후, 롤백: 서비스 재기동·설정 원복) 포트를 해제하지 않는 프로세스의 연결 수 제한 또는 해당 서비스 재시작, 공급업체에 소켓 누수 확인 요청'
  - 프로세스별 소켓 생성률과 연결 해제 패턴을 분석
  mid:
  - 애플리케이션 연결풀과 동적 포트 범위를 최적화
  long:
  - 포트 고갈 임계치와 소켓 생성률을 상시 모니터링
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/troubleshoot/windows-client/networking/tcp-ip-port-exhaustion-troubleshooting)
  note: Critical→Warning
  vendor_cause: 프로세스가 소비한 포트를 정상 해제하지 못해 TIME_WAIT·BOUND 연결이 누적되면서 동적 포트가 고갈됨
  vendor_action: netstat -anobq 또는 Get-NetTCPConnection으로 포트 소비 프로세스를 식별하고 종료 후 해당 앱 공급업체에 확인
  vendor_url: https://learn.microsoft.com/en-us/troubleshoot/windows-client/networking/tcp-ip-port-exhaustion-troubleshooting
  versions:
  - Windows Server 2008/R2
  - 2012/R2
  - '2016'
  - '2019'
  - '2022'
  - '2025'
  version_note: Tcpip 4231 2008 이후
- code: '5719'
  severity: error
  category: connection
  title: 도메인 연결 실패
  immediate:
  - '`nltest /sc_query:<도메인>` 으로 보안 채널 상태 확인 — "NERR_Success" 가 아니면 보안 채널 이상, `Test-ComputerSecureChannel` (2012+, -Repair 없이 읽기 전용) 결과 False 도 같은 판단'
  - '`nltest /dsgetdc:<도메인>` 과 `Resolve-DnsName -Type SRV _ldap._tcp.dc._msdcs.<도메인>` (2012+) 로 DC 탐색·DNS SRV 확인 — 실패면 DNS·네트워크 원인'
  - '`Test-NetConnection <DC> -Port 389` (2012 R2+) 로 LDAP 도달성 확인 — 부팅 직후 1회만 발생하고 이후 정상이면 NIC·네트워크 준비 지연(문서 사례)'
  short:
  - 방화벽과 네트워크 및 DNS와 secure channel 상태를 분석
  mid:
  - 도메인 연결 경로와 DNS 및 스위치 구성을 개선
  long:
  - DC 도달성과 Netlogon 오류 및 인증 실패율을 통합 감시
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/troubleshoot/windows-server/group-policy/netlogon-event-id-5719-or-group-policy-event-1129)
  note: 공식 Learn 확인
