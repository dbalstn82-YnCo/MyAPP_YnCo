- code: '503.4'
  severity: critical
  category: capacity
  title: FastCGI 큐 포화
  immediate:
  - '`%windir%\system32\inetsrv\appcmd list config -section:system.webServer/fastCgi` (cmd) 로 maxInstances·queueLength·activityTimeout 확인 (IIS 7.5+)'
  - '`(Get-Process php-cgi -ErrorAction SilentlyContinue).Count` 와 `Get-Counter ''\Processor(_Total)\% Processor Time''` 로 FastCGI 프로세스 수·CPU 확인 — maxInstances 에 닿고 CPU 가 높으면 포화 확정(php-cgi 외 실행 파일은 이름을 바꿔 확인)'
  short:
