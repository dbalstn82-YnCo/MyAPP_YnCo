  severity: critical
  category: capacity
  title: ASP.NET 큐 포화
  immediate:
  - '`Get-Counter ''\ASP.NET\Requests Queued'',''\ASP.NET\Requests Current''` 로 대기·처리 중 요청 수 확인 — Requests Queued 가 계속 늘면 확정'
  - '`%windir%\system32\inetsrv\appcmd list requests /elapsed:10000` (cmd) 로 10초 넘게 실행 중인 요청 URL 확인 — 특정 URL 이 쌓이면 DB·외부 API 지연 확인 대상 (Request Monitor 기능 필요, IIS 7.5+)'
