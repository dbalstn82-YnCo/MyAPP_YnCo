  vendor_cause: "Communication link failure(SQLSTATE 08S01) — 클라이언트·서버 또는 노드 사이 통신 링크가 끊겼다는 뜻(오류 메시지 매뉴얼: 네트워크 연결과 통신 인프라 확인). 서버 프로세스 종료·네트워크 순단·방화벽 세션 만료가 흔한 원인."
