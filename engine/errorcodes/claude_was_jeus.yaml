  - "(2차·승인 후, 롤백: domain.xml 백업 복원) DB 측 원인(계정 잠김·비밀번호 만료·리스너 장애)은 DBA 와 해소, 접속 정보 오류면 데이터소스 설정 수정 후 풀 재생성"
  mid:
  - "데이터소스 접속 검사(check-query)와 연결 타임아웃 표준 설정, 비밀번호 암호화 저장"
  long:
  - "DB 계정 비밀번호 만료 일정 관리와 연결 실패 경보"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: JEUS 데이터소스가 DB 에 물리 연결을 만들지 못한 상태. DB·리스너 미기동, 네트워크·방화벽 차단, 계정 잠김·비밀번호 오류, 잘못된 URL·드라이버가 흔한 원인.
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: 문구 기반 별칭(JVM·공통 예외 문구) — JEUS 6~9 공통
- code: JEUS-DS-POOL-EXHAUSTED
  severity: critical
  category: capacity
  title: 커넥션 풀 고갈
  immediate:
  - "`$JEUS_HOME/bin/jeusadmin -host <host>:9736 -u <user> 'connection-pool-info -server <server> -id <DS> -active'` 로 사용 중 연결·대기 확인(JEUS 7+, 읽기 전용) — 사용 중이 max 와 같으면 고갈 확정"
