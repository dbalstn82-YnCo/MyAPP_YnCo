product: jeus
layer: was
note: GPT 협업 수집분 — 벤더 공식 문서와 대조 후 확정 · 2026-10-16 G7a 4단 보강(JEUS Reference Guide jeusadmin server-info/list-servers/thread-info/connection-pool-info/transaction-info, JEUS 9 Server Guide 로깅 대조). <SERVER_HOME>=$JEUS_HOME/domains/<domain>/servers/<server>(JEUS 7+), JEUS 6 은 $JEUS_HOME/logs 하위 노드·컨테이너 로그
codes:
- code: JEUS-SERVER-BOOT-FAIL
  severity: critical
  category: internal
  title: 서버 부팅 실패
  immediate:
  - "`tail -100 <SERVER_HOME>/logs/JeusLauncher.log` 와 `grep -n -E 'SEVERE|Exception|Caused by' <SERVER_HOME>/logs/JeusServer.log | tail -30` 로 최초 실패 원인(설정·포트·라이선스·DAS 접속) 확인(JEUS 7+)"
  - "`$JEUS_HOME/bin/jeusadmin -host <host>:9736 -u <user> 'server-info -server <server> -state'` 로 상태(SHUTDOWN·STANDBY·FAILED) 확인, `ss -ltnp | grep <base_port>` 로 포트 선점 확인"
  short:
  - "(2차·승인 후, 롤백: domain.xml 백업 복원) 원인(설정 오류·포트 충돌·라이선스) 해소 후 jeusadmin start-server 또는 startManagedServer 로 기동"
  mid:
  - "domain.xml 변경 전 백업·변경 이력 기록, 기동 순서(DAS→MS) 표준 절차서"
  long:
  - "기동 후 server-info 상태 RUNNING 자동 점검과 기동 소요 시간 기록"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: JEUS 서버(JVM)가 기동 단계에서 설정 로딩·서비스 초기화·포트 바인드 중 실패해 RUNNING 에 이르지 못한 상태. domain.xml 오류, 포트 충돌, 라이선스 문제, DAS(MASTER) 접속 실패, JVM 옵션 오류가 흔한 원인.
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: 문구 기반 별칭(JVM·공통 예외 문구) — JEUS 6~9 공통
- code: JEUS-LICENSE-FAIL
  severity: critical
  category: security
  title: 라이선스 검증 실패
  immediate:
  - "`grep -n -i 'license' <SERVER_HOME>/logs/JeusLauncher.log <SERVER_HOME>/logs/JeusServer.log | tail -20` 로 사유(만료·호스트 불일치·파일 없음) 확인"
  - "`ls -l $JEUS_HOME/license/` 와 `hostname` 으로 라이선스 파일 존재·발급 호스트명 일치 확인 — 서버 이전·호스트명 변경 직후면 노드 불일치 의심"
  short:
  - "(2차·승인 후, 롤백: 기존 라이선스 파일 보관) TmaxSoft 기술지원에 호스트명·만료일 전달해 재발급, 교체 후 서버 기동"
  mid:
  - "라이선스 만료일·발급 호스트 대장 관리, 서버 이전·호스트명 변경 절차에 라이선스 재발급 포함"
  long:
  - "라이선스 만료 60/30일 전 경보"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: JEUS 기동 시 $JEUS_HOME/license 의 라이선스를 검증하지 못한 상태. 라이선스 만료, 발급 호스트명과 실제 호스트명 불일치, 파일 손상·누락, 에디션 범위를 넘는 기능 사용이 흔한 원인.
  verify_note: "미검증 — 라이선스 정보 조회 명령(jeusadmin -licenseinfo / -licensedue 옵션 위치)을 공식 문서 원문으로 확인 못 해 1차에 넣지 않음"
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: 문구 기반 별칭(JVM·공통 예외 문구) — JEUS 6~9 공통
- code: JEUS-PORT-BIND-FAIL
  severity: critical
  category: connection
  title: 포트 바인드 실패
  immediate:
  - "`grep -n -B2 -A5 -E 'BindException|Address already in use' <SERVER_HOME>/logs/JeusServer.log | tail -20` 로 충돌 포트 확인"
  - "`ss -ltnp | grep ':<port> '` 로 점유 PID 확인 후 `ps -fp <PID>` 로 같은 서버의 이전 프로세스(중복 기동)인지 다른 서비스인지 구분"
  short:
  - "(2차·승인 후, 롤백: domain.xml 백업 복원) 남은 구 프로세스는 소유자 확인 후 정상 종료(jeusadmin stop-server) 우선, 다른 서비스와 겹치면 리스너 포트 변경 후 기동"
  mid:
  - "서버별 base·http·webtob·JMS 리스너 포트 대장 운영"
  long:
  - "기동 전 포트 점유 점검 자동화"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: JEUS 서버가 base 포트나 웹·JMS 리스너 포트를 열려 했으나 이미 다른 프로세스가 사용 중이라 바인드에 실패한 상태. 이전 프로세스 미종료(중복 기동), 다른 서비스와 포트 중복이 흔한 원인.
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: 문구 기반 별칭(JVM·공통 예외 문구) — JEUS 6~9 공통
- code: JEUS-DEPLOY-FAIL
  severity: critical
  category: internal
  title: 애플리케이션 배포 실패
  immediate:
  - "`grep -n -A20 -E 'DEPLOY-|JeusDeploymentException|Deploying.*failed' <SERVER_HOME>/logs/JeusServer.log | grep -E 'DEPLOY-|Exception|Caused by' | tail -30` 로 실패 앱과 최초 원인 확인"
  - "`unzip -tq <배포파일>` 로 패키지 무결성 확인, `df -h $JEUS_HOME` 로 공간 확인 — 디스크립터(jeus-web-dd.xml) 오류면 SAXParseException 문구가 함께 보인다"
  short:
  - "(2차·승인 후, 롤백: 이전 정상 배포본 보관) 원인(디스크립터·라이브러리 충돌) 수정본으로 재배포, 급하면 이전 정상 배포본으로 되돌린다"
  mid:
  - "배포 전 검증 환경 배포 시험과 디스크립터 스키마 검증"
  long:
  - "배포 이력·배포본 보관(되돌림용)과 배포 실패 경보"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: EAR·WAR·JAR 배포(distribute/start) 중 패키지·디스크립터 분석이나 모듈 기동이 실패해 애플리케이션이 RUNNING 이 되지 못한 상태. 손상된 패키지, jeus-web-dd.xml 등 디스크립터 오류, 라이브러리 충돌·누락 클래스가 흔한 원인.
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: 문구 기반 별칭(JVM·공통 예외 문구) — JEUS 6~9 공통
- code: JEUS-CONTEXT-INIT-FAIL
  severity: critical
  category: internal
  title: 컨텍스트 초기화 실패
  immediate:
  - "`grep -n -A20 -E 'contextInitialized|ServletContextListener|context.*init' <SERVER_HOME>/logs/JeusServer.log | grep -E 'Exception|Caused by' | head -20` 로 실패 리스너·최초 원인 확인"
  - "원인이 DB 연결이면 `nc -zvw3 <db_host> <db_port>` 와 jeusadmin 'connection-pool-info -server <server>' 로 데이터소스 상태 확인(읽기 전용)"
  short:
  - "(2차·승인 후, 롤백: 이전 배포본 재배포) 설정 파일·DB 접속 정보·누락 라이브러리 수정 후 재배포"
  mid:
  - "컨텍스트 초기화의 외부 의존(DB·원격 설정) 실패 처리와 재시도 보완"
  long:
  - "배포 후 헬스체크 URL 자동 점검"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: 웹 모듈 기동 시 ServletContextListener(예 Spring 컨텍스트 로더) 초기화가 예외로 실패해 웹 컨텍스트가 시작되지 못한 상태. 설정 파일 오류, DB 연결 실패, 누락 클래스가 흔한 원인.
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: 문구 기반 별칭(JVM·공통 예외 문구) — JEUS 6~9 공통
- code: JEUS-THREAD-BLOCK
  severity: critical
  category: thread
  title: 스레드 블록 감지
  immediate:
  - "`$JEUS_HOME/bin/jeusadmin -host <host>:9736 -u <user> 'thread-info -server <server>'` 로 스레드 풀 상태·장시간 실행 스레드 확인(JEUS 7+, 읽기 전용)"
  - "`for i in 1 2 3; do jcmd <PID> Thread.print > td_$(date +%H%M%S)_$i.txt; sleep 10; done` 로 덤프 3회 — BLOCKED 스레드가 같은 락·같은 후단 호출을 기다리면 그 지점이 병목"
  short:
  - "(2차·승인 후, 롤백: 설정 백업 복원) 블로킹 원인(락 경합·후단 지연) 해소, 서비스 회복이 안 되면 웹서버 우회 후 서버 재기동"
  - "(2차·승인 후) 스레드 풀 상한·요청 타임아웃 조정은 domain.xml 백업 후 반영"
  mid:
  - "후단 호출 타임아웃·락 범위 축소, 서블릿 스레드 풀(min/max) 재산정"
  long:
  - "thread-info 기반 활성 스레드 비율·장시간 스레드 수 감시"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: 요청 처리 스레드가 락 대기·후단 응답 대기 등으로 장시간 진행하지 못해 JEUS 가 블록(hang)으로 감지한 상태. DB·외부 API 지연, 동기화 블록 경합, 교착이 흔한 원인.
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: 문구 기반 별칭(JVM·공통 예외 문구) — JEUS 6~9 공통
- code: JEUS-THREADPOOL-FULL
  severity: critical
  category: thread
  title: 스레드 풀 고갈
  immediate:
  - "`$JEUS_HOME/bin/jeusadmin -host <host>:9736 -u <user> 'thread-info -server <server>'` 로 리스너별 활성/전체 스레드 확인(JEUS 7+) — 활성이 max 와 같으면 고갈 확정"
  - "`jcmd <PID> Thread.print > td_$(date +%H%M%S).txt` 로 덤프 보존 후 대기 지점(DB·외부 HTTP·락) 집계"
  short:
  - "(2차·승인 후, 롤백: domain.xml 백업 복원) 후단 지연 해소가 우선, 필요 시 웹 리스너 스레드 풀 max 조정 후 서버 재기동 일정 반영"
  mid:
  - "스레드 풀 크기를 DB 풀·CPU 와 함께 산정, 후단 타임아웃을 요청 타임아웃보다 짧게"
  long:
  - "활성 스레드 비율 70% 경보"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: 웹 리스너(또는 WebtoB 연결) 스레드 풀의 스레드가 모두 사용 중이라 새 요청이 대기·거절되는 상태. 후단(DB·외부 API) 지연, 락 경합, 트래픽 급증이 흔한 원인.
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: 문구 기반 별칭(JVM·공통 예외 문구) — JEUS 6~9 공통
- code: JEUS-OOM
  severity: critical
  category: memory
  title: 메모리 부족
  immediate:
  - "`jstat -gcutil <PID> 1000 5` 로 Old(O)·Metaspace(M) 사용률과 FGC 증가 확인 — O 95% 이상 유지면 힙 고갈 확정"
  - "`ls -lt <SERVER_HOME>/*.hprof <SERVER_HOME>/logs/*.hprof 2>/dev/null | head` 로 자동 힙덤프 유무 확인, 없으면 `jmap -histo <PID> | head -30`(live 옵션 없이 — Full GC 유발 안 함)으로 상위 객체만 기록(전체 힙덤프는 2차)"
  short:
  - "(2차·승인 후, 롤백: 우회 해제) WebtoB·LB 에서 서버 우회 → 힙덤프 확보(디스크 여유 확인) → jeusadmin stop-server/start-server 로 재기동"
  mid:
  - "힙덤프 분석으로 누수 수정, domain.xml JVM 옵션 -Xmx·-XX:+HeapDumpOnOutOfMemoryError 표준화"
  long:
  - "Old 영역 85% 경보와 메모리 회귀 부하시험"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: JEUS 서버 JVM 의 힙(또는 메타 영역)이 고갈되어 java.lang.OutOfMemoryError 가 발생한 상태. 세션·캐시 누수, 대량 조회 결과 적재, 워크로드 대비 작은 -Xmx 가 흔한 원인.
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: 문구 기반 별칭(JVM·공통 예외 문구) — JEUS 6~9 공통
- code: JEUS-DS-CONNECT-FAIL
  severity: critical
  category: connection
  title: 데이터소스 연결 실패
  immediate:
  - '`grep -n -A5 -E ''SQLException|ORA-|Connection refused|JDBC-'' <SERVER_HOME>/logs/JeusServer.log | tail -30` 로 DB 오류 코드(계정 잠김·리스너 없음 등) 확인'
