- code: MSSQL-945
  severity: critical
  category: storage
  title: DB 파일 또는 자원 부족
  immediate:
  - "DB 파일 경로 확인: `SELECT physical_name, state_desc FROM sys.master_files WHERE database_id=DB_ID(N'<db>');` 후 `Test-Path <physical_name>` 으로 파일 존재 확인 (읽기 전용)"
  - "ERRORLOG 의 945 직전 OS 오류(2·3·5·32) 확인: `EXEC xp_readerrorlog 0, 1, N'<db>'`, 볼륨 여유 `Get-Volume`"
  short:
  - "(2차·승인 후) 드라이브 재연결·서비스 계정 권한 복구·공간 확보 후 `ALTER DATABASE <db> SET ONLINE` — 롤백: 권한 변경 전 ACL 저장, 실패 시 백업 복원 절차로 전환"
  mid:
  - "DB 파일 볼륨의 드라이브 문자·마운트 지점 고정과 파일 경로 권한 표준"
  long:
  - "DB 상태(ONLINE 외)·볼륨 사용률 감시 알림과 복구 절차 문서화"
  vendor_cause: 파일에 접근할 수 없거나 메모리·디스크 공간이 부족해 데이터베이스를 열 수 없는 경우(심각도 14). 파일 경로 변경·드라이브 미연결·서비스 계정 권한 부족이 흔한 원인이며 ERRORLOG 에 세부 사유가 남는다.
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/database-engine-events-and-errors-0-to-999?view=sql-server-ver17)
