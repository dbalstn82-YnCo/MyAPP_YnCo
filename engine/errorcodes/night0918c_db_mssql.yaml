codes:
- code: MSSQL-229
  severity: warn
  category: security
  title: 객체 권한 거부
  immediate:
  - "오류 원문(Msg 229)의 권한 종류·객체·DB·스키마와 실행 계정 기록(애플리케이션 로그)"
  - "해당 계정의 부여 권한 조회: `SELECT permission_name, state_desc, OBJECT_NAME(major_id) AS obj FROM sys.database_permissions WHERE grantee_principal_id = USER_ID(N'<user>');` (해당 DB, 읽기 전용)"
  short:
  - "(2차·승인 후) 필요한 최소 권한만 `GRANT <권한> ON <schema>.<object> TO <user>` — 롤백: 대응 REVOKE 문 미리 작성, 보안 담당 승인"
  mid:
  - "역할(DB Role) 기반 권한 부여로 표준화하고 배포 스크립트에 권한 부여문 포함"
  long:
  - "권한 변경 감사(SQL Server Audit)와 분기별 계정 권한 검토"
  vendor_cause: 로그인/DB 사용자에게 대상 객체(테이블·뷰·프로시저)의 SELECT·EXECUTE 등 권한이 없어 문장이 거부된 경우(심각도 14). 권한 회수·스키마 변경·실행 계정 변경이 흔한 원인이다.
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/database-engine-events-and-errors-0-to-999?view=sql-server-ver17)
  versions:
  - SQL Server 2005
  - SQL Server 2008/2008 R2
  - SQL Server 2012
  - SQL Server 2014
  - SQL Server 2016
  - SQL Server 2017
  - SQL Server 2019
  - SQL Server 2022
  - SQL Server 2025
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: '-'
- code: MSSQL-547
  severity: warn
  category: internal
  title: 제약조건 충돌
  immediate:
  - "오류 원문에서 제약 이름·테이블·컬럼 기록 후 정의 확인: `SELECT name, OBJECT_NAME(parent_object_id) AS tbl, OBJECT_NAME(referenced_object_id) AS ref_tbl FROM sys.foreign_keys WHERE name=N'<제약명>';` (CHECK 제약이면 sys.check_constraints)"
  - "호출 화면·배치와 입력값을 애플리케이션 로그에서 확인 — 데이터 수정은 하지 않음"
  short:
  - "(2차·승인 후) 개발팀과 입력 순서(부모→자식)·삭제 순서 수정, 데이터 보정 SQL 은 대상 행을 백업 테이블로 복사한 뒤 실행(롤백: 백업 테이블에서 원복)"
  mid:
  - "애플리케이션 입력 검증에 FK·CHECK 제약 규칙을 반영해 DB 도달 전 차단"
  long:
  - "제약 위반(547) 발생 건수 감시와 월간 데이터 정합성 점검"
  vendor_cause: INSERT·UPDATE·DELETE 문이 FOREIGN KEY 또는 CHECK 제약 조건과 충돌해 거부된 경우(Msg 547). 부모 행 없음·참조 중인 자식 행 존재·허용 범위 밖 값이 흔한 원인이다.
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/database-engine-events-and-errors-0-to-999?view=sql-server-ver17)
  versions:
  - SQL Server 2005
  - SQL Server 2008/2008 R2
  - SQL Server 2012
  - SQL Server 2014
  - SQL Server 2016
  - SQL Server 2017
  - SQL Server 2019
  - SQL Server 2022
  - SQL Server 2025
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: FK 외 CHECK 제약 등도 포함
- code: MSSQL-2627
  severity: warn
  category: internal
  title: 고유 제약 조건 위반
  immediate:
  - 오류 원문의 제약 이름·중복 키 값·객체 기록, 같은 키를 넣은 배치·재처리 여부를 애플리케이션 로그로 확인
  - '제약 구성 열 확인(읽기 전용): `SELECT kc.name, kc.type_desc, c.name AS column_name FROM sys.key_constraints kc JOIN sys.index_columns ic ON ic.object_id=kc.parent_object_id AND ic.index_id=kc.unique_index_id JOIN sys.columns c ON c.object_id=ic.object_id AND c.column_id=ic.column_id WHERE kc.parent_object_id=OBJECT_ID(N''<schema>.<table>'') ORDER BY kc.name, ic.key_ordinal;`'
  - 제약 열이 IDENTITY 일 때만 `SELECT IDENT_CURRENT(N'<schema>.<table>');` 와 실제 최대 키 값을 비교(시드 어긋남 확인) — IDENTITY 가 아닌 UNIQUE 위반에는 쓰지 않는다
  short:
  - "(2차·승인 후) 중복 재처리 방지(존재 확인 후 입력) 로직 보강, IDENTITY 재설정(DBCC CHECKIDENT RESEED)은 현재 최대값 확인·백업 후 — 롤백: 이전 시드 값 기록"
  mid:
  - "키 생성 방식(SEQUENCE·IDENTITY) 표준화와 재처리 멱등성 설계"
  long:
  - "중복 키(2627·2601) 오류 건수 감시와 데이터 정합성 점검 주기 운영"
  vendor_cause: PRIMARY KEY 또는 UNIQUE 제약에 이미 있는 키 값을 넣으려 해 거부된 경우(Msg 2627, 중복 키 값이 메시지에 표시됨). 재처리로 인한 중복 입력·키 채번 충돌이 흔한 원인이다.
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/database-engine-events-and-errors-2000-to-2999?view=sql-server-ver17)
  versions:
  - SQL Server 2005
  - SQL Server 2008/2008 R2
  - SQL Server 2012
  - SQL Server 2014
  - SQL Server 2016
  - SQL Server 2017
  - SQL Server 2019
  - SQL Server 2022
  - SQL Server 2025
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: '-'
- code: MSSQL-3201
  severity: error
  category: disk
  title: 백업 장치 열기 실패
  immediate:
  - "오류 원문의 백업 경로와 Operating system error 번호 기록 → `net helpmsg <번호>` 로 의미 확인(5=접근 거부, 3=경로 없음, 53=네트워크 경로 없음)"
  - "SQL 서비스 계정 확인 `SELECT servicename, service_account FROM sys.dm_server_services;` (2008 R2 SP1+) 후 그 계정의 대상 경로 권한 조회 `icacls <path>` (조회만)"
  - "대상 경로 존재·여유 공간 확인: `Test-Path <path>` · `Get-PSDrive`"
  short:
  - "(2차·승인 후) 서비스 계정에 백업 경로 쓰기 권한 부여 또는 백업 경로 수정 후 재수행 — 롤백: 변경 전 ACL 저장(`icacls <path> /save <aclfile>`)"
  mid:
  - "백업 전용 볼륨·공유 경로의 권한·용량(85% 경보) 표준 수립"
  long:
  - "SQL Agent 백업 작업 실패 시 운영자 알림과 일일 백업 성공 여부 점검"
  vendor_cause: BACKUP·RESTORE 가 지정한 백업 장치(파일·공유 경로)를 열지 못한 경우(심각도 16). 메시지의 Operating system error 번호가 원인(접근 거부·경로 없음·네트워크 경로 없음 등)을 알려준다.
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/database-engine-events-and-errors-3000-to-3999?view=sql-server-ver17)
  versions:
  - SQL Server 2005
  - SQL Server 2008/2008 R2
  - SQL Server 2012
  - SQL Server 2014
  - SQL Server 2016
  - SQL Server 2017
  - SQL Server 2019
  - SQL Server 2022
  - SQL Server 2025
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: 오류 자체는 심각도 16
- code: MSSQL-4060
  severity: error
  category: connection
  title: 요청 데이터베이스 열기 실패
  immediate:
  - "`SELECT name, state_desc, user_access_desc FROM sys.databases WHERE name=N'<db>';` 로 존재·상태(OFFLINE·SUSPECT·RESTORING) 확인 — 행이 없으면 DB 이름 오류 (읽기 전용)"
  - "ERRORLOG 의 18456 동반 줄(State 38 = 지정 DB 열기 실패)로 대상 DB·클라이언트 확인: `EXEC xp_readerrorlog 0, 1, N'18456'`"
  short:
  - "(2차·승인 후) DB 온라인 전환(`ALTER DATABASE <db> SET ONLINE`)·복구 또는 로그인을 DB 사용자로 매핑(`CREATE USER <user> FOR LOGIN <login>`) — 롤백: 변경 전 상태·매핑 기록"
  mid:
  - "접속 문자열의 DB 이름과 DB 이전·이름 변경 절차를 변경 관리에 연계"
  long:
  - "로그인 실패(4060·18456) 출처 감시와 DB 복구 절차 문서화"
  vendor_cause: 로그인 시 요청한 데이터베이스를 열 수 없어 로그인이 실패한 경우(심각도 11). DB 이름 오류, DB 가 OFFLINE·RESTORING·SUSPECT 상태, 해당 DB 에 사용자 매핑이 없는 경우가 흔한 원인이다.
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/database-engine-events-and-errors-4000-to-4999?view=sql-server-ver17)
  versions:
  - SQL Server 2005
  - SQL Server 2008/2008 R2
  - SQL Server 2012
  - SQL Server 2014
  - SQL Server 2016
  - SQL Server 2017
  - SQL Server 2019
  - SQL Server 2022
  - SQL Server 2025
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: 로그인 시 대상 DB 열기 실패
- code: MSSQL-4064
  severity: error
  category: connection
  title: 사용자 기본 DB 열기 실패
  immediate:
  - "로그인의 기본 DB 확인: `SELECT name, default_database_name FROM sys.server_principals WHERE name=N'<login>';` 후 그 DB 상태를 `sys.databases` 에서 확인 (읽기 전용)"
  - "클라이언트에서 DB 를 명시해 접속 시험(`sqlcmd -S <server> -d master -E`) — 성공하면 로그인 자체가 아닌 기본 DB 문제"
  short:
  - "(2차·승인 후) `ALTER LOGIN <login> WITH DEFAULT_DATABASE = <db>` 로 기본 DB 변경 — 롤백: 이전 default_database_name 기록 후 원복"
  mid:
  - "로그인 생성 시 기본 DB 를 존재가 보장된 DB 로 지정하는 계정 생성 표준"
  long:
  - "DB 삭제·이름 변경 전 기본 DB 의존 로그인 점검을 변경 절차에 포함"
  vendor_cause: 로그인의 기본 데이터베이스가 삭제·이름 변경·OFFLINE 이거나 그 DB 에 사용자 매핑이 없어 로그인 자체가 실패한 경우. ERRORLOG 에 18456(State 40)이 함께 남는다.
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/database-engine-events-and-errors-4000-to-4999?view=sql-server-ver17)
  versions:
  - SQL Server 2005
  - SQL Server 2008/2008 R2
  - SQL Server 2012
  - SQL Server 2014
  - SQL Server 2016
  - SQL Server 2017
  - SQL Server 2019
  - SQL Server 2022
  - SQL Server 2025
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: '-'
- code: MSSQL-7303
  severity: error
  category: upstream
  title: 연결된 서버 초기화 실패
  immediate:
  - "연결된 서버 설정 확인: `SELECT name, provider, data_source FROM sys.servers WHERE is_linked=1;` 와 로그인 매핑 `SELECT * FROM sys.linked_logins;` (비밀번호는 표시되지 않음, 읽기 전용)"
  - "`Test-NetConnection <원격서버> -Port <port>` 로 도달성 확인, 오류 원문의 공급자 메시지(로그인 실패·네트워크·공급자 미등록) 기록"
  short:
  - "(2차·승인 후) 원격 로그인 매핑 갱신(`sp_addlinkedsrvlogin`) 또는 공급자 옵션 수정 — 롤백: 변경 전 sys.servers·sys.linked_logins 조회 결과 저장"
  mid:
  - "연결된 서버 의존 쿼리 축소와 연계 계정 최소 권한 지정"
  long:
  - "연결된 서버 헬스체크(`EXEC sp_testlinkedserver N'<linked>'`) 정기 실행"
  vendor_cause: 연결된 서버의 OLE DB 공급자 데이터 원본 개체를 초기화하지 못한 경우(심각도 16). 원격 서버 도달 불가·원격 로그인 실패·공급자 미설치 또는 옵션 오류·이중 홉 Kerberos 위임 문제가 흔한 원인이다.
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/database-engine-events-and-errors-7000-to-7999?view=sql-server-ver17)
