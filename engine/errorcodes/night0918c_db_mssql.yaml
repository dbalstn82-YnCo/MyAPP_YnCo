- code: MSSQL-926
  severity: critical
  category: storage
  title: 데이터베이스 SUSPECT 로 표시
  immediate:
  - "`SELECT name, state_desc FROM sys.databases WHERE state_desc='SUSPECT';` 로 대상 확인, 애플리케이션 측 재시도 중단 요청(DB 자체는 건드리지 않음)"
  - "ERRORLOG 의 926 이전 오류(823/824·9001·3414) 확인: `EXEC xp_readerrorlog 0, 1, N'<db>'` 와 `SELECT * FROM msdb.dbo.suspect_pages;` (읽기 전용)"
  short:
  - "(2차·승인 후) 정상 백업 복원이 우선, 불가할 때만 EMERGENCY 모드 진단 — 롤백: 작업 전 mdf/ldf 사본 보관, REPAIR_ALLOW_DATA_LOSS 는 데이터 손실 감수 승인 필요"
  mid:
  - "스토리지 무결성 검증(장비 진단·SQLIOSim)과 손상 원인 제거"
  long:
  - "복구 리허설과 정기 CHECKDB·백업 검증 체계 운영"
  vendor_cause: 복구 과정에서 데이터베이스가 SUSPECT 로 표시되어 열 수 없는 상태(심각도 14). 데이터·로그 파일 손상, 스토리지 I/O 오류, 복구 중 공간 부족이 흔한 원인이며 상세는 ERRORLOG 의 선행 오류에 있다.
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/database-engine-events-and-errors-0-to-999?view=sql-server-ver17)
