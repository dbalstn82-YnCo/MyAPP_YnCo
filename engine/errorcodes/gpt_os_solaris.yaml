product: solaris
layer: os
note: GPT 협업 수집분 — 벤더 공식 문서와 대조 후 확정
codes:
- code: SOL-KERNEL-PANIC
  severity: critical
  category: internal
  title: Solaris 커널 패닉
  vendor_cause: 커널이 복구 불가능한 오류로 시스템을 정지한 상태('panic[cpuN]/thread='). 드라이버·커널 결함, 하드웨어(메모리·CPU)
    오류가 흔한 원인이며 savecore 가 저장한 크래시 덤프 분석으로 확정한다.
  immediate:
  - 시스템 복귀 후 `dumpadm` 으로 덤프 장치·savecore 디렉터리 확인, `ls -l <savecore디렉터리>` 로 vmdump.N/vmcore.N
    저장 여부 확인
  - '`grep -i -A 5 ''panic'' /var/adm/messages* | head -40` 으로 panic 문자열·스택 첫 줄, `fmadm
    faulty` 로 하드웨어 결함 진단 여부 확인'
  short:
  - mdb로 덤프와 스택 및 로드 모듈을 분석
  mid:
  - 원인 커널 패치와 드라이버 또는 하드웨어 조치를 적용
  long:
  - 덤프 생성검증과 패치 수명주기 및 복구훈련을 운영
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: '''panic[cpuN]/thread='' 전 버전'
- code: SOL-SWAP-EXHAUSTED
  severity: critical
  category: memory
  title: 스왑 공간 고갈
  vendor_cause: 가상 메모리(스왑 예약 공간)가 고갈되어 메모리 할당·프로세스 생성이 실패하는 상태. Solaris 는 할당 시점에 스왑을
    예약하므로 물리 스왑 여유가 있어도 예약 한도에 닿을 수 있으며 메모리 과다 사용·tmpfs 대용량 파일이 흔한 원인.
  immediate:
  - '`swap -s` 로 allocated/reserved/available 확인 — available 이 거의 없으면 확정, `swap -l`
    로 스왑 장치별 사용 확인'
  - '`prstat -s rss -n 10 5 1` 로 메모리 상위 프로세스, `df -h /tmp` 로 tmpfs 사용량 확인(정리는 2차·승인
    후)'
  short:
  - 프로세스별 메모리와 swap 예약 실패 및 누수 여부를 분석
  mid:
  - 물리 메모리와 swap 용량을 재산정하고 애플리케이션 제한을 조정
  long:
  - 가상메모리 사용률과 swap 고갈 임계치 경보를 운영
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: /var/adm/messages '[ID nnnnn facility.level]' 형식 8~11.4 공통
- code: SOL-FS-FULL
  severity: critical
  category: storage
  title: 파일시스템 공간 고갈
  vendor_cause: 파일시스템 공간이 고갈되어 쓰기가 실패하는 상태('file system full'). 로그·코어·임시 파일 누적과 삭제했지만
    열린 채 남은 파일이 흔한 원인.
  immediate:
  - '`df -h` 로 사용률 95% 이상 파일시스템 식별, `du -dsk <mount>/* 2>/dev/null | sort -n | tail
    -15` 로 큰 디렉터리 확인'
  - '`fuser -c <mount>` 로 사용 프로세스 확인 — 공간 정리는 2차·담당자 승인 후'
  short:
  - 로그와 core 및 임시파일 증가와 삭제 후 열린 파일을 분석
  mid:
  - 파일시스템을 증설하고 로그 보존과 용량정책을 재설계
  long:
  - 파일시스템 증가율과 용량 임계치를 상시 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: /var/adm/messages '[ID nnnnn facility.level]' 형식 8~11.4 공통
- code: SOL-NFS-NOT-RESPONDING
  severity: error
  category: upstream
  title: NFS 서버 응답 없음
  vendor_cause: NFS 클라이언트가 서버 응답을 받지 못한 상태('NFS server <server> not responding still
    trying'). 하드 마운트면 해당 경로 접근 프로세스가 멈춘다. 서버 장애·과부하, 네트워크 단절, 방화벽이 흔한 원인.
  immediate:
  - "`grep -i 'not responding' /var/adm/messages | tail -20` 으로 서버명·최초 시각, `ping <server>` 와 `rpcinfo -T tcp <server> nfs` 로 도달성·NFS 응답 확인 — rpcinfo 실패면 서버·방화벽 측"
  - "`nfsstat -m` 로 해당 마운트 옵션(hard/soft·timeo·retrans), `nfsstat -c | head -20` 으로 retrans·timeout 증가 확인 — hard 마운트면 접근 프로세스가 멈춰 있을 수 있어 인자 없는 `df` 는 쓰지 않음 (Solaris 10/11)"
  short:
  - nfsstat와 네트워크 손실 및 서버 부하와 mount 옵션을 분석
  mid:
  - NFS 이중화와 네트워크 경로 및 타임아웃 정책을 개선
  long:
  - NFS 지연과 재전송률 및 서버 가용성을 지속 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: /var/adm/messages '[ID nnnnn facility.level]' 형식 8~11.4 공통
- code: SOL-SCSI-BUS-HUNG
  severity: critical
  category: hardware
  title: SCSI 버스 응답 정지
  vendor_cause: SCSI 버스가 응답하지 않아 드라이버가 버스 리셋을 시도한 상태('SCSI bus hung'). 장치·케이블·터미네이터
    불량, 외부 장비 전원 문제, 컨트롤러·드라이버 결함이 흔한 원인.
  immediate:
  - '`grep -i -E ''bus hung|reset|transport'' /var/adm/messages | tail -20` 으로 해당
    컨트롤러·장치·반복 빈도 확인'
  - '`iostat -En` 으로 장치별 Transport 오류, `cfgadm -al` 로 컨트롤러·장치 연결 상태 확인(물리 점검은 2차)'
  short:
  - iostat와 시스템 메시지 및 장치 오류를 분석
  mid:
  - 결함 디스크와 케이블 또는 컨트롤러를 교체하고 패치를 적용
  long:
  - SCSI 장치 상태와 I/O 오류를 예방 모니터링
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: /var/adm/messages '[ID nnnnn facility.level]' 형식 8~11.4 공통
- code: SOL-ZFS-FAULT
  severity: critical
  category: storage
  title: ZFS 풀 장애
  vendor_cause: ZFS 풀의 장치가 FAULTED/DEGRADED 되었거나 데이터 오류가 보고된 상태. 디스크 장애·경로 단절·체크섬
    오류 누적이 흔한 원인이며 중복성 상실 시 데이터 손실 위험이 있다.
  immediate:
  - "`zpool status -x` 로 이상 풀, `zpool status -v <pool>` 로 FAULTED/DEGRADED 장치와 READ/WRITE/CKSUM 오류·영구 오류 파일 확인 — DEGRADED 면 중복성 감소, FAULTED 면 사용 불가"
  - "`fmadm faulty` 로 FMA 진단 결과(장치·FRU), `iostat -En | head -60` 으로 디스크별 Hard/Transport Errors 확인 — 같은 장치가 겹치면 교체 대상(zpool replace 는 2차·승인 후)"
  short:
  - FMA와 디스크 오류 및 checksum과 scrub 결과를 분석
  mid:
  - 결함 장치를 교체하고 resilver와 scrub 완료 후 정합성을 검증
  long:
  - 정기 scrub과 ZFS 상태 및 디스크 오류 경보를 운영
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: ZFS 는 Solaris 10 6/06 이후(11 은 ZFS 루트)
- code: SOL-SMF-MAINTENANCE
  severity: error
  category: internal
  title: SMF 서비스 유지보수
  vendor_cause: SMF 서비스가 시작 메서드 실패·반복 종료로 maintenance 상태가 된 것. 설정 오류, 의존 서비스·파일 부재가
    흔한 원인이며 svcadm clear 전까지 자동 재시작되지 않는다.
  immediate:
  - svcs -xv로 maintenance 서비스와 Reason 및 로그 위치를 확인
  short:
  - 서비스 시작 메서드와 설정 및 의존 서비스를 분석
  mid:
  - 원인을 수정한 후 svcadm clear와 재기동으로 정상 상태를 검증
  long:
  - SMF 상태 감시와 반복 maintenance 자동경보를 운영
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: SMF 는 Solaris 10 도입 — 8/9 는 init.d 스크립트(문구 없음)
- code: SOL-FMA-FAULT
  severity: critical
  category: hardware
  title: FMA 하드웨어 결함
  vendor_cause: FMA(Fault Management)가 하드웨어 오류 보고(ereport)를 분석해 특정 FRU 의 결함을 진단한 상태(SUNW-MSG-ID).
    CPU·메모리·디스크·전원 등 FRU 교체가 필요한 경우가 대부분이다.
  immediate:
  - fmadm faulty로 결함 FRU와 MSG-ID 및 영향을 받은 자원을 확인
  short:
  - fmdump와 하드웨어 진단으로 결함 구성요소를 분석
  mid:
  - 지정 FRU를 교체하고 fmadm repair 절차로 상태를 정상화
  long:
  - FMA fault 실시간 경보와 FRU 장애이력 관리를 운영
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: FMA(SUNW-MSG-ID) 10+ — 8/9 는 syslog 하드웨어 문구만
