  versions:
  - Tibero 4
  - Tibero 5/5 SP1
  - Tibero 6
  - Tibero 7
  version_note: 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: MOUNT 모드에서 alias의 대상 instance가 복수일 때 발생
