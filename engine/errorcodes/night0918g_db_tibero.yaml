- code: TBR-1070
  severity: error
  category: storage
  title: 불완전 미디어 복구 완료
  immediate:
  - "현재 상태: tbsql `select status from v$instance;` — MOUNT 인지 확인"
  - "복구 목표 시점이 승인된 시점과 같은지 복구 작업 기록과 대조 — 다르면 RESETLOGS 전에 2차 판단"
  short:
  - "(2차·승인 후, 롤백: RESETLOGS 이후에는 이전 백업으로 되돌릴 수 없음 — 직전 파일 사본 보관) `tbdown` 후 `tbboot -t RESETLOGS` 로 기동, 이어 정상 기동·전체 백업 수행"
  mid:
  - 기동 후 데이터파일 상태와 데이터베이스 정상 오픈 여부를 확인한다.
  long:
  - 불완전 복구에 필요한 백업과 아카이브 로그 보관 절차를 관리한다.
  source: GPT 수집 2026-09-18·벤더 문서 대조 완료(https://support.tibero.com/hc/en-us/articles/15438684840207-TTA-BMT-Function-Verification-Scenario-SINGLE-Configuration-Backup-Recovery)
  vendor_cause: "불완전(시점) 미디어 복구가 끝났다는 알림 — 이후에는 RESETLOGS 모드(`tbboot -t RESETLOGS`)로 기동해야 함(관리자 안내서). 장애라기보다 다음 단계 안내."
  versions:
  - Tibero 4
  - Tibero 5/5 SP1
  - Tibero 6
  - Tibero 7
  version_note: 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: 복구 완료 후 RESETLOGS 필요
- code: TBR-1147
  severity: error
  category: storage
  title: 복구 로그 파일 필요
  immediate:
  - "요구 시퀀스: `grep -h \"TBR-1147\" $TB_HOME/instance/$TB_SID/log/slog/* | tail -5` (Tibero 6/7)"
  - "아카이브 위치·존재: `grep -i \"ARCHIVE\" $TB_HOME/config/$TB_SID.tip` 후 `ls -l <archive_dir> | grep <sequence>`"
  - "백업 매체(tbrmgr 백업·테이프)에 해당 시퀀스가 있는지 백업 담당에 확인"
  short:
  - "(2차·승인 후, 롤백: 해당 없음) 요구 로그를 백업에서 복원해 아카이브 경로에 두고 복구 계속, 로그가 없으면 불완전 복구 범위 승인"
  mid:
  - 누락 로그와 복구 대상 데이터파일 상태를 함께 점검한다.
  long:
  - 복구에 필요한 아카이브 로그가 백업과 함께 보존되도록 관리한다.
  source: GPT 수집 2026-09-18·벤더 문서 대조 완료(https://support.tibero.com/hc/en-us/articles/14577751794191-Restoring-Specific-Tablespaces-Using-Clone-DB)
  vendor_cause: "미디어 복구를 계속하려면 오류에 표시된 thread·sequence 의 아카이브(또는 리두) 로그가 필요함 — 아카이브 경로에 없거나 백업에서 아직 복원하지 않은 상태."
  versions:
  - Tibero 4
  - Tibero 5/5 SP1
  - Tibero 6
  - Tibero 7
  version_note: 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: 복구에 특정 thread sequence 로그 필요
