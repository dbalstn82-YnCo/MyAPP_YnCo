  severity: error
  category: internal
  title: Java 클래스명 오류
  immediate:
  - "경로 설정: `grep -i \"JAVA_CLASS_PATH\" $TB_HOME/config/$TB_SID.tip`"
  - "클래스 파일: `ls -l <class_path>/<패키지 경로>/<Class>.class` — 모든 노드에서 같은지 확인"
