  source: GPT 수집 2026-09-18·벤더 문서 대조 완료(https://docs.tmaxsoft.com/ko/openframe_tacf/MSP_7.3/tacf-installation-guide/chapter-troubleshooting.html)
  vendor_cause: "클라이언트가 지정한 데이터소스(접속 별칭)를 tbdsn.tbr 에서 찾지 못함 — 별칭 오타, TB_HOME 환경 차이, tbdsn.tbr 미배포가 흔한 원인."
  versions:
  - Tibero 4
  - Tibero 5/5 SP1
  - Tibero 6
  - Tibero 7
  version_note: 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: Data source was not found
