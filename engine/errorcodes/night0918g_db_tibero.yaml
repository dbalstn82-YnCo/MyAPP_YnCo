  vendor_cause: "지정한 데이터파일 크기가 허용 범위를 벗어남 — 블록 크기에 따른 데이터파일 최대 크기를 넘거나 지나치게 작은 SIZE 를 지정한 경우(기존 근거: 테이블스페이스 생성 7107 사례)."
