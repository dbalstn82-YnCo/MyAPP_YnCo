- code: TBR-11048
  severity: error
  category: upstream
  title: DBLink 문자 변환 오류
  immediate:
  - "링크·대상: tbsql `select owner, db_link, host from dba_db_links;` 와 실패 SQL·대상 컬럼 길이"
  - "원격 문자셋(원격 Oracle 예): `select value from nls_database_parameters where parameter='NLS_CHARACTERSET';` 를 원격 담당에 요청, Tibero 쪽 문자셋과 대조"
  short:
  - 공식 조치 조건에 해당하면 문자 변환 관련 설정을 적용해 재검증한다.
  mid:
  - 변환되는 데이터가 대상 컬럼의 길이와 문자셋 범위에 맞는지 확인한다.
  long:
  - DBLink 대상별 문자셋과 변환 정책을 인터페이스 기준으로 관리한다.
  source: GPT 수집 2026-09-18·벤더 문서 대조 완료(https://support.tibero.com/hc/ko/articles/14442121364495-TBR-11048-%EC%98%A4%EB%A5%98-%EC%A1%B0%EC%B9%98-%EB%B0%A9%EC%95%88-T-to-O-DB-link)
  vendor_cause: "DB 링크(Tibero→원격, Gateway 경유)에서 문자셋 변환 중 오류 — 변환 뒤 길이가 늘어 대상 버퍼·컬럼을 넘거나 대상 문자셋에 없는 문자가 있는 경우(기존 근거: T→O 링크 데이터 길이 증가)."
  verify_note: "미검증 — Tibero 쪽 DB 문자셋 조회 뷰 이름(NLS_DATABASE_PARAMETERS 제공 여부)을 공식 문서로 확인하지 못함"
  versions:
  - Tibero 4
  - Tibero 5/5 SP1
  - Tibero 6
  - Tibero 7
  version_note: 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: DBLink 문자셋 변환 과정에서 데이터 길이 증가로 발생
