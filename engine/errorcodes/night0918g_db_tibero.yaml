  long:
  - 반복 발생 원인이 확인되지 않으면 수집 자료와 함께 기술지원을 요청한다.
  source: GPT 수집 2026-09-18·벤더 문서 대조 완료(https://support.tibero.com/hc/en-us/articles/14353956780559-Tibero-Operation-Guide-for-Beginners-Trouble-Shooting)
  vendor_cause: "Tibero 클라이언트·서버 통신이나 파일 입출력에서 일반 I/O 오류가 발생함 — 네트워크 단절·상대 프로세스 종료·파일 접근 실패 등 하위 원인은 같은 시각 서버 로그에 남음."
  versions:
  - Tibero 4
  - Tibero 5/5 SP1
  - Tibero 6
  - Tibero 7
  version_note: 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: Generic I/O error
