  - "`lspath | grep -v Enabled` 로 Failed/Missing 경로 확인 — 링크 복구 뒤에도 Failed 로 남으면 경로 자동 복귀 실패, VIOS 에서 `lsmap -all -npiv`(padmin) 로 Status(LOGGED_IN 여부)·FC name 확인"
