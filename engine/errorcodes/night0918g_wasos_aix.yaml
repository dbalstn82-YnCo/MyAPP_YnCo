- code: 804E987A
  severity: warn
  category: hardware
  title: CPU_DEALLOC_SUCCESS CPU격리완료
  vendor_cause: 장애가 예측된 논리 CPU 를 AIX 가 동적으로 격리(deallocate)하는 데 성공한 상태(CPU_DEALLOC_SUCCESS).
    서비스는 계속되지만 CPU 자원이 줄었고 하드웨어 교체가 남아 있다.
  immediate:
