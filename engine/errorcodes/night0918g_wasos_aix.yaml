- code: A19337FA
  severity: critical
  category: hardware
  title: SC_DISK_SDDAPPCM_ER 서브시스템장애
  vendor_cause: SDDPCM 경로 제어 모듈이 스토리지 서브시스템 구성요소 장애를 보고한 상태(SC_DISK_SDDAPPCM_ER).
    스토리지 배열의 디스크 매체·전원·팬 등 내부 구성요소 문제가 흔한 원인.
  immediate:
  - "`errpt -a -j A19337FA | head -80` 으로 장애 hdisk·PATH ID·SENSE DATA 기록(스토리지 지원 의뢰 자료)"
  - "`pcmpath query device <N>` 으로 경로별 State·Errors, `pcmpath query adapter` 로 어댑터 상태 확인 — DEAD/FAILED 경로가 있으면 이중화 상실 (SDDPCM 설치 시, AIXPCM 이면 `lspath -l hdisk<N>`)"
  short:
  - 스토리지 배열과 디스크 미디어 및 전원과 팬 구성요소 상태를 점검한다.
  mid:
