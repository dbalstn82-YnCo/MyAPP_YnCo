- code: AE7C4B0F
  severity: critical
  category: connection
  title: VFC4_ERR15 FC링크다운
  vendor_cause: VIOS 가 가상 FC 의 물리 링크 다운(LINK_DOWN)을 보고한 상태(VFC4_ERR15). SAN 스위치·케이블·VIOS
