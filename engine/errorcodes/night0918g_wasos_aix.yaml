  - "`bindprocessor -q` 로 현재 사용 가능 논리 CPU, `lparstat -i | head -30` 의 Online Virtual CPUs 확인, `vmstat 2 5` 의 us+sy 가 80% 이상이면 줄어든 CPU 로 서비스 영향 있음"
  short:
  - 시스템의 남은 CPU 자원과 서비스 영향을 확인한다.
  mid:
  - 예측 장애가 발생한 CPU에 대해 필요한 유지보수를 수행한다.
  long:
  - CPU 자동 격리 이벤트 발생 후 하드웨어 정비가 누락되지 않도록 관리한다.
