  title: GOENT_LINK_DOWN 이더넷링크다운
  vendor_cause: 기가비트 이더넷 어댑터(goent)의 물리 링크가 끊긴 상태(GOENT_LINK_DOWN). 케이블·스위치 포트 장애,
