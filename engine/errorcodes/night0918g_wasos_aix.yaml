- code: 65DE6DE3
  severity: error
  category: storage
  title: 요청 작업 수행 불가
  vendor_cause: 디스크가 요청 작업을 수행할 수 없다고 응답한 상태(SC_DISK_ERR10). sense code 가 0118 이면
    다른 initiator 의 SCSI 예약(reservation) 충돌이며, 공유 디스크의 reserve_policy 불일치가 흔한 원인.
  immediate:
  - "`errpt -a -j 65DE6DE3 | head -80` 으로 hdisk·PATH ID·SENSE DATA 확인 — sense code 0118 이면 다른 initiator 의 예약(reservation) 충돌"
  - "`lsattr -El hdisk<N> -a reserve_policy` 로 예약 정책(no_reserve·single_path·PR_exclusive 등) 확인 — 공유 디스크인데 노드마다 값이 다르면 정책 불일치 의심"
  short:
  - 해당 디스크를 예약한 다른 initiator와 현재 reserve 정책을 확인한다.
  mid:
  - 클러스터와 MPIO의 디스크 예약 정책을 올바른 구성으로 조정한다.
  long:
  - 공유 디스크의 예약 정책과 접근 노드를 구성관리 대상으로 유지한다.
