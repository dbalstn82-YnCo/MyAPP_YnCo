  category: hardware
  title: CPU_FAIL_PREDICTED CPU장애예측
  vendor_cause: 프로세서의 정정 가능 오류가 임계를 넘어 펌웨어가 해당 CPU 의 장애를 예측한 상태(CPU_FAIL_PREDICTED).
