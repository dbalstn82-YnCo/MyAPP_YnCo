  - "`lspath -p fscsi<N>` 로 그 포트를 쓰는 경로 확인 — 경로가 없으면 미사용 포트(반복 기록 가능), 있으면 `fcstat fcs<N> | head -40` 으로 Link 상태·오류 카운터 확인"
