- code: 7BFEEA1F
  severity: error
  category: connection
  title: FCA_ERR4 FC링크오류
  vendor_cause: FC 어댑터 포트가 링크 오류를 보고한 상태(FCA_ERR4). 실제 사용 중 포트의 케이블·SFP·스위치 문제이거나,
    연결하지 않은 미사용 포트가 Available 로 남아 반복 기록되는 경우가 있다.
