  version_note: 로그 문구 기반 별칭 — 4.1/5/6 공통(로그 레이아웃은 사이트 설정에 따라 다름)
- code: WEBTOB-DIRECTORY-LISTING
  severity: warn
  category: security
  title: 디렉터리 목록 노출
  immediate:
  - '`grep -n -i "index" $WEBTOBDIR/config/http.m` 로 디렉터리 인덱스 관련 설정 확인(읽기 전용)'
  - '접근 로그에서 디렉터리 URL(끝이 /) 요청의 응답 코드 확인 — 200 이면 목록 노출 가능성, 403 이면 index 파일 누락'
  short:
  - '(2차·승인 후, 롤백: http.m 백업 복원) 목록 노출이면 디렉터리 인덱스 비활성화, 누락이면 index 파일 배포'
  mid:
