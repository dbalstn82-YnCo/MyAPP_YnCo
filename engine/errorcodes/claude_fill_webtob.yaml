  long:
  - '정기 보안 점검에 디렉터리 노출 점검 포함'
  vendor_cause: '이 사전 별칭상 디렉터리 목록(인덱스) 표시와 관련된 기록이다. 디렉터리 목록 노출이 켜져 있으면 파일 구조가 외부에 드러나는 보안 문제가 되고, 꺼져 있는데 index 파일이 없으면 403 이 난다.'
