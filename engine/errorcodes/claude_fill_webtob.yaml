- code: WEBTOB-SSL-CERT-EXPIRED
  severity: critical
  category: security
  title: SSL 인증서 만료
  immediate:
  - '`grep -n -i "Certificate" $WEBTOBDIR/config/http.m` 로 *SSL 절의 인증서 파일 경로 확인 후 `openssl x509 -in <인증서> -noout -enddate -subject` 로 만료일 확인'
  - '`openssl s_client -connect <host>:<sslport> -servername <host> </dev/null 2>/dev/null | openssl x509 -noout -enddate` 로 실제 제공 인증서 확인'
  short:
  - '(2차·승인 후, 롤백: 이전 인증서 파일 복원) 새 인증서·키·체인을 같은 경로에 배치하고 `wscfl -i http.m` 컴파일 후 재기동 일정에 적용'
  mid:
  - '인증서 갱신 절차(발급·체인·배치·확인) 표준화'
  long:
  - '인증서 만료 60/30/7일 전 경보'
  vendor_cause: '이 사전 별칭상 WebtoB SSL 인증서가 만료됐다. 만료된 인증서로는 브라우저가 접속을 거부하거나 경고를 띄우며, 갱신 누락이 원인이다.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - WebtoB 4.1
  - WebtoB 5.x
