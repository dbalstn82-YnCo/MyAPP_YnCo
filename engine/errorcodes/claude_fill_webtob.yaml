codes:
- code: WEBTOB-HTH-HANG
  severity: critical
  category: thread
  title: HTH 응답 없음
  immediate:
  - '`ps -ef | grep -E "[w]sm|[h]tl|[h]th"` 로 HTH 프로세스 생존·CPU 확인'
  - '`$WEBTOBDIR/bin/wsadmin` 접속 후 `st -p` 로 서버 프로세스 상태, `st -s` 로 서비스 큐 대기 수 확인 — 큐 적체면 백엔드(JEUS) 지연'
  - '`ls -lt $WEBTOBDIR/log | head` 로 최근 로그 파일을 찾아 `tail -100` 으로 hang 전후 오류 확인'
  short:
  - '(2차·승인 후, 롤백: 없음 — 기동 확인으로 대체) 백엔드 지연 원인 확인 뒤에도 응답이 없으면 `wsdown` 후 `wsboot` 로 재기동, 전후 `wsadmin` st 결과 보관'
  mid:
  - 'HTH 수·MaxUser 와 JSV MinProc/MaxProc 를 동시 접속량 기준으로 재산정'
  long:
  - 'HTH 응답성(헬스체크 URL 응답 시간) 감시와 큐 대기 수 경보'
  vendor_cause: '이 사전 별칭(로그 문구 hth … hang/not respond)상 HTH(HTTP 요청 처리 프로세스)가 응답하지 않는 상태다. HTH 가 처리 중인 요청이 JSV(JEUS)·CGI 응답을 기다리며 묶였거나 클라이언트 폭주로 HTH 처리 한도에 도달한 것이 흔한 원인.'
  verify_note: '미검증 — HTH hang 로그 문구의 공식 메시지 표를 확인하지 못함(별칭 기반 의사코드)'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - WebtoB 4.1
  - WebtoB 5.x
  - WebtoB 6.x
  version_note: 로그 문구 기반 별칭 — 4.1/5/6 공통(로그 레이아웃은 사이트 설정에 따라 다름)
- code: WEBTOB-SVR-QUEUE-FULL
  severity: critical
  category: capacity
  title: 서버 큐 가득참
  immediate:
  - '`$WEBTOBDIR/bin/wsadmin` 접속 후 `st -s` 로 서비스별 큐 대기 수, `st -p` 로 서버 프로세스 상태(모두 처리 중인지) 확인'
  - '같은 시각 JEUS 쪽 스레드·DB 대기 로그 확인 — 백엔드 지연이면 WebtoB 설정이 아닌 WAS 원인'
  short:
  - '(2차) 백엔드 지연 원인(DB 잠금·외부 연동) 담당에 통보, 프로세스 수·큐 한도 조정은 원인 확인 뒤 승인 후(롤백: http.m 백업 복원 후 wscfl)'
  mid:
  - '*SERVER MinProc/MaxProc·MaxQCount 를 처리량 기준으로 재산정하고 JEUS 워커 수와 일치'
