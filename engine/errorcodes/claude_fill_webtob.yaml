- code: WEBTOB-JSV-RECONNECT
  severity: warn
  category: connection
  title: JSV 재연결
  immediate:
  - '`$WEBTOBDIR/bin/wsadmin` 접속 후 `si` 로 JSV(JEUS) 서버 상태(RDY)·연결 수 확인 (`si` 는 내부 서버(JSV) 상태 — `ci` 는 WebtoB 5 에서 클라이언트 정보라 JEUS 연결 확인에 쓰지 않는다)'
  - '같은 시각 JEUS 서버 기동 로그(서버 시작 시각) 확인 — 기동 시각과 일치하면 JEUS 쪽 기동(교체)이 원인'
  short:
