  version_note: 로그 문구 기반 별칭 — 4.1/5/6 공통(로그 레이아웃은 사이트 설정에 따라 다름)
- code: WEBTOB-SVR-MAXPROC
  severity: error
  category: capacity
  title: 서버 프로세스 최대 도달
  immediate:
  - '`$WEBTOBDIR/bin/wsadmin` 접속 후 `st -p` 로 처리 중 프로세스 수, `cfg` 로 MinProc·MaxProc 설정 확인'
  - '`grep -n -i "MaxProc\|MinProc" $WEBTOBDIR/config/http.m` 로 설정 파일 값 확인(읽기 전용)'
  short:
  - '(2차·승인 후, 롤백: http.m 백업 복원 후 wscfl) 백엔드 지연이 아니면 MaxProc 상향 후 `wscfl -i http.m` 컴파일·재기동 일정 협의'
  mid:
  - 'MaxProc 를 피크 동시 요청량과 JEUS 처리 스레드 수 기준으로 재산정'
  long:
