  vendor_cause: '이 사전 별칭상 서버 그룹의 처리 프로세스 수가 MaxProc 에 도달했다. 동시 요청 증가 또는 프로세스가 응답 대기로 오래 묶여 새 요청이 큐에 쌓이기 시작한 상태다.'
