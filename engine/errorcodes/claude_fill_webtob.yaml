  - '`st -s` 큐 대기 수 주기 수집·경보'
  vendor_cause: '이 사전 별칭상 WebtoB 서버(서비스) 큐가 가득 찬 상태다. 요청이 백엔드(JSV·CGI) 처리 프로세스 수보다 많이 들어와 대기 요청이 MaxQCount 한도에 닿은 것으로, 백엔드 처리 지연이나 요청 폭주가 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
