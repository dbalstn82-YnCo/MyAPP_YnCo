  version_note: 로그 문구 기반 별칭 — 4.1/5/6 공통(로그 레이아웃은 사이트 설정에 따라 다름)
- code: WEBTOB-CLIENT-DISCONNECT
  severity: warn
  category: connection
  title: 클라이언트 연결 종료
  immediate:
