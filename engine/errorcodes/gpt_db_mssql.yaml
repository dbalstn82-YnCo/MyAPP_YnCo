codes:
- code: MSSQL-802
  severity: critical
  category: memory
  title: 버퍼풀 메모리 부족
  immediate:
  - "메모리 상태: `SELECT physical_memory_in_use_kb/1024 AS sql_mb, memory_utilization_percentage, process_physical_memory_low FROM sys.dm_os_process_memory;` 와 `SELECT total_physical_memory_kb/1024 AS total_mb, available_physical_memory_kb/1024 AS avail_mb, system_memory_state_desc FROM sys.dm_os_sys_memory;` — 'Available physical memory is low' 면 OS 압박 (2012~2022, 읽기 전용)"
  - "설정·큰 소비자: `SELECT name, value_in_use FROM sys.configurations WHERE name IN ('max server memory (MB)','min server memory (MB)');` · `SELECT TOP 10 type, SUM(pages_kb)/1024 AS mb FROM sys.dm_os_memory_clerks GROUP BY type ORDER BY mb DESC;` — 버퍼풀 외 clerk 가 크면 그쪽이 원인"
  - "메모리 grant 대기: `SELECT session_id, requested_memory_kb, granted_memory_kb, wait_time_ms FROM sys.dm_exec_query_memory_grants WHERE granted_memory_kb IS NULL;` — 대기 행이 많으면 대형 정렬·해시 쿼리 원인"
  short:
  - "(2차·승인 후, 롤백: 이전 값 기록 후 같은 명령으로 원복) 동거 프로세스 메모리 확보 또는 `EXEC sp_configure 'max server memory (MB)', <MB>; RECONFIGURE;` 로 상한 조정(show advanced options 필요) — 큰 grant 쿼리 세션은 업무 담당 확인 후 종료"
  mid:
  - 버퍼풀 수요에 맞게 메모리 구성과 서버 용량을 조정
  long:
  - 메모리 SLO와 성능 카운터 기반 예측관리를 운영
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/mssqlserver-802-database-engine-error?view=sql-server-ver17)
  vendor_cause: 버퍼 풀이 가득 찼고 더 이상 확장할 수 없음
  vendor_action: 다른 프로세스의 메모리 사용과 SQL 메모리 설정·부하를 확인하고 필요 시 max server memory 증가 또는 캐시 해제
  vendor_url: https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/mssqlserver-802-database-engine-error?view=sql-server-ver17
