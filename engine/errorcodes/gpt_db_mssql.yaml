- code: MSSQL-17120
  severity: critical
  category: thread
  title: 백그라운드 스레드 실패
  immediate:
  - "ERRORLOG 에서 실패한 스레드명과 직전 오류 기록: 기동 중이면 `EXEC xp_readerrorlog 0, 1, N'could not spawn';`, 내려가 있으면 `Get-Content '<path>\\MSSQL\\Log\\ERRORLOG' -Tail 80` (2012~2022, 읽기 전용)"
  - "같은 시각 OS 자원 부족: `Get-WinEvent -FilterHashtable @{LogName='System'; Level=1,2,3; StartTime=(Get-Date).AddHours(-2)} | Select-Object -First 30 TimeCreated, ProviderName, Id, Message` — Resource-Exhaustion-Detector(2004) 가 있으면 가상 메모리 부족"
  - "메모리 여유: `Get-CimInstance Win32_OperatingSystem | Select-Object FreePhysicalMemory, FreeVirtualMemory` (KB) 와 기동 중이면 `SELECT max_workers_count FROM sys.dm_os_sys_info;` · `SELECT COUNT(*) FROM sys.dm_os_workers;`"
  short:
  - "(2차·승인 후, 롤백: 변경 전 값 기록) 동거 프로세스 정리·페이지 파일 확장 등 OS 메모리 확보 후 서비스 시작, 'max worker threads' 를 기본(0) 외 값으로 바꿔 둔 경우 원복 검토"
  mid:
  - 원인 자원을 증설하거나 설정 오류를 수정하고 패치를 검토
  long:
  - 스레드와 메모리 자원 포화 모니터링을 운영
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/mssqlserver-17120-database-engine-error?view=sql-server-ver17)
