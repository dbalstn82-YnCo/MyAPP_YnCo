- code: MSSQL-1222
  severity: error
  category: lock
  title: 잠금 요청 시간초과
  immediate:
  - "blocking 체인: `SELECT session_id, blocking_session_id, wait_type, wait_time, wait_resource, DB_NAME(database_id) AS db FROM sys.dm_exec_requests WHERE blocking_session_id <> 0;` — blocking_session_id 를 따라가 자신은 대기하지 않는 세션이 원점 (2012~2022, 읽기 전용)"
  - "원점 세션 정보: `SELECT session_id, login_name, host_name, program_name, status, open_transaction_count, last_request_end_time FROM sys.dm_exec_sessions WHERE session_id = <원점 session_id>;` — status 가 sleeping 인데 open_transaction_count > 0 이면 커밋 누락 애플리케이션"
  - "원점 세션의 마지막 SQL: `SELECT event_info FROM sys.dm_exec_input_buffer(<session_id>, NULL);` (2014 SP2·2016+) 또는 `DBCC INPUTBUFFER(<session_id>);`"
  short:
  - "(2차·승인 후, 롤백: KILL 한 세션의 트랜잭션은 롤백되어 되돌릴 수 없음 — 세션·SQL 기록 선행) 업무 담당 확인 후 원점 세션 `KILL <session_id>;`"
  - "(2차) 1222 는 문장만 실패하고 트랜잭션은 자동 롤백되지 않으므로 애플리케이션이 `@@TRANCOUNT` 확인 후 롤백·재시도하도록 보강"
  mid:
  - 장기 트랜잭션과 쿼리, 인덱스를 개선
  long:
  - 잠금대기 기준과 배치 동시성 정책을 운영
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/mssqlserver-1222-database-engine-error?view=sql-server-ver17)
  vendor_cause: 다른 트랜잭션이 필요한 자원의 잠금을 쿼리 대기 가능 시간보다 오래 보유함
  vendor_action: 잠금 보유 트랜잭션을 찾아 적절하면 종료 후 재실행; 반복되면 잠금 제한시간이나 장시간 잠금 트랜잭션 수정
  vendor_url: https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/mssqlserver-1222-database-engine-error?view=sql-server-ver17
