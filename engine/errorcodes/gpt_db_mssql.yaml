- code: MSSQL-833
  severity: warn
  category: disk
  title: 장시간 I/O 발생
  immediate:
  - "ERRORLOG 의 833 줄에서 파일·DB·발생 횟수 기록: `EXEC xp_readerrorlog 0, 1, N'longer than 15 seconds';` (2012~2022, 읽기 전용)"
  - "파일별 누적 지연: `SELECT DB_NAME(database_id) AS db, file_id, io_stall_read_ms/NULLIF(num_of_reads,0) AS avg_read_ms, io_stall_write_ms/NULLIF(num_of_writes,0) AS avg_write_ms FROM sys.dm_io_virtual_file_stats(NULL, NULL) ORDER BY avg_read_ms DESC;` — 서비스 기동 이후 누적치이므로 833 파일이 상위인지로 판단"
  - "현재 디스크 지연: `Get-Counter '\\PhysicalDisk(*)\\Avg. Disk sec/Read','\\PhysicalDisk(*)\\Avg. Disk sec/Write' -SampleInterval 5 -MaxSamples 6` — 수십 ms 이상 지속이면 스토리지 병목"
  short:
  - "(2차) 스토리지 담당에 해당 볼륨·LUN 지연과 다중경로 상태 확인 요청, 같은 시각 백업·CHECKDB·인덱스 재구성 작업 일정 이동(승인 후, 롤백: 원래 일정 복귀)"
  mid:
  - 스토리지 성능과 다중경로, 파일 배치를 개선
  long:
  - I/O 지연 SLO와 지속 latency 모니터링을 운영
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/mssqlserver-833-database-engine-error?view=sql-server-ver17)
