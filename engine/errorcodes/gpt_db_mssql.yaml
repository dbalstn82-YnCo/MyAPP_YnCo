- code: MSSQL-825
  severity: critical
  category: hardware
  title: 디스크 읽기 재시도 성공
  immediate:
  - "ERRORLOG 의 825 줄에서 파일·offset·실패 횟수 기록: `EXEC xp_readerrorlog 0, 1, N'succeeded after failing';` — 같은 파일에서 반복되면 해당 볼륨 I/O 경로 이상 (2012~2022, 읽기 전용)"
  - "의심 페이지: `SELECT database_id, file_id, page_id, event_type, error_count, last_update_date FROM msdb.dbo.suspect_pages ORDER BY last_update_date DESC;` — 행이 있으면 823/824 손상도 이미 발생한 것"
  - "같은 시각 OS 디스크 이벤트: `Get-WinEvent -FilterHashtable @{LogName='System'; Level=1,2,3; StartTime=(Get-Date).AddDays(-1)} | Where-Object ProviderName -match 'disk|storport|Ntfs' | Select-Object -First 30` — 있으면 하드웨어·드라이버 원인"
  short:
  - "(2차·승인 후, 롤백: 데이터 변경 없는 검사지만 I/O 부하가 커 업무 외 시간) `DBCC CHECKDB (<db>) WITH NO_INFOMSGS, ALL_ERRORMSGS;` 로 무결성 확인, 스토리지 담당에 해당 LUN·다중경로·컨트롤러 펌웨어 진단 요청"
  mid:
  - 문제 I/O 부품을 선제 교체하고 펌웨어를 검증
  long:
  - 예측진단과 825 이벤트 즉시경보를 운영
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/mssqlserver-825-database-engine-error?view=sql-server-ver17)
  note: 읽기는 재시도로 성공했지만 공식 문서가 DB 무결성 위협과 데이터 손실 가능성을 명시하므로 critical이 타당함
  vendor_cause: 읽기 작업을 한 번 이상 재시도해야 했으며 이는 디스크 하드웨어의 중대한 문제를 나타냄
  vendor_action: 오류 로그를 확인하고 디스크·컨트롤러·어레이 카드·드라이버를 점검하며 제조사 진단 도구와 최신 드라이버 사용
  vendor_url: https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/mssqlserver-825-database-engine-error?view=sql-server-ver17
