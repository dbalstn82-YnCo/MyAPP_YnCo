- code: MSSQL-1204
  severity: error
  category: lock
  title: LOCK 자원 확보 실패
  immediate:
  - "잠금 수 많은 세션: `SELECT TOP 10 request_session_id, COUNT(*) AS lock_cnt FROM sys.dm_tran_locks GROUP BY request_session_id ORDER BY lock_cnt DESC;` — 한 세션이 수십만 개 이상이면 대량 트랜잭션 원인 (2012~2022, 읽기 전용 — 잠금이 매우 많으면 조회도 무거우니 1회만)"
  - "lock 메모리와 고정 한도: `SELECT type, SUM(pages_kb)/1024 AS mb FROM sys.dm_os_memory_clerks WHERE type = 'OBJECTSTORE_LOCK_MANAGER' GROUP BY type;` 와 `SELECT value_in_use FROM sys.configurations WHERE name = 'locks';` — locks 가 0(동적) 이 아니면 고정 상한이 원인 후보"
  - "장기 트랜잭션: `SELECT s.session_id, s.host_name, s.program_name, t.transaction_begin_time FROM sys.dm_tran_active_transactions t JOIN sys.dm_tran_session_transactions st ON st.transaction_id = t.transaction_id JOIN sys.dm_exec_sessions s ON s.session_id = st.session_id ORDER BY t.transaction_begin_time;`"
  short:
  - "(2차·승인 후, 롤백: KILL 한 세션의 트랜잭션은 롤백되어 되돌릴 수 없고 대량이면 롤백 시간이 김 — 세션·SQL 기록 선행) 업무 담당 확인 후 대량 잠금 세션 `KILL <session_id>;`, 'locks' 가 고정값이면 0(동적)으로 되돌리는 것 검토(서비스 재시작 필요)"
  mid:
  - 대량 트랜잭션을 분할하고 메모리 및 잠금 구성을 재산정
  long:
  - 잠금 자원 임계치와 대량작업 사전검증을 운영
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/mssqlserver-1204-database-engine-error?view=sql-server-ver17)
  note: LOCK 자원 고갈로 해당 문장이 실패하지만 단독 코드만으로 서비스 중단을 뜻하지 않음
  vendor_cause: 메모리 부족, Lock Manager 메모리 한도, 비기본 locks 설정 또는 1211/1224 추적 플래그로 잠금 자원 고갈
  vendor_action: 메모리 소비를 줄이거나 max server memory를 늘리고, 잠금 과다 트랜잭션 종료·locks 기본값 복원·추적 플래그 점검
  vendor_url: https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/mssqlserver-1204-database-engine-error?view=sql-server-ver17
