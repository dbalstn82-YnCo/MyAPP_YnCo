- code: MSSQL-17182
  severity: critical
  category: connection
  title: TDS 초기화 실패
  immediate:
  - "ERRORLOG 의 error·status code 기록: 기동 중이면 `EXEC xp_readerrorlog 0, 1, N'TDSSNIClient';`, 내려가 있으면 `Get-Content '<path>\\MSSQL\\Log\\ERRORLOG' -Tail 80` — error 0x2740 은 포트 사용 중, 0x80092004 는 인증서를 찾지 못함 (읽기 전용)"
  - "인증서 바인딩: `Get-ItemProperty 'HKLM:\\SOFTWARE\\Microsoft\\Microsoft SQL Server\\<MSSQLxx.인스턴스>\\MSSQLServer\\SuperSocketNetLib' | Select-Object Certificate, ForceEncryption` 후 `Get-ChildItem Cert:\\LocalMachine\\My | Where-Object Thumbprint -eq '<지문>' | Select-Object Subject, NotAfter` — 없거나 NotAfter 경과면 원인"
  - "포트 점유: `Get-NetTCPConnection -LocalPort <port> -State Listen` (Windows Server 2012+) — 다른 프로세스가 잡고 있으면 원인"
  short:
  - "(2차·승인 후, 롤백: 변경 전 레지스트리 Certificate 값·포트 설정 기록) 유효 인증서로 교체(서비스 계정 개인키 읽기 권한 포함) 또는 포트 충돌 해소 후 서비스 시작 — 성공: ERRORLOG 'Server is listening on'"
  verify_note: "미검증 — TDSSNIClient status code 값별 의미는 공식 문서에서 확인하지 못함(0x2740·0x80092004 는 Windows 오류 코드 기준)"
  mid:
