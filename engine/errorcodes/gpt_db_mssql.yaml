- code: MSSQL-18456
  severity: error
  category: security
  title: 로그인 인증 실패
  immediate:
  - "ERRORLOG 의 Reason·State·CLIENT 기록: `EXEC xp_readerrorlog 0, 1, N'Login failed';` — State 2/5 계정 없음, 8 비밀번호 불일치, 18 비밀번호 변경 필요, 38/40 기본·요청 DB 접근 불가, 58 SQL 인증 미허용 (2012~2022, 읽기 전용)"
  - "인증 모드: `SELECT SERVERPROPERTY('IsIntegratedSecurityOnly');` — 1 이면 Windows 인증 전용"
  - "계정 상태: `SELECT name, is_disabled, LOGINPROPERTY(name,'IsLocked') AS is_locked, LOGINPROPERTY(name,'IsExpired') AS is_expired, default_database_name FROM sys.sql_logins WHERE name = N'<user>';` — 비밀번호 값은 기록하지 않는다"
  short:
