- code: MSSQL-832
  severity: critical
  category: hardware
  title: 메모리 페이지 변조
  immediate:
  - "ERRORLOG 의 832 줄 기록(DB·파일·page·expected/actual checksum): `EXEC xp_readerrorlog 0, 1, N'should have been constant';` (2012~2022, 읽기 전용)"
  - "하드웨어 메모리 오류: `Get-WinEvent -FilterHashtable @{LogName='System'; ProviderName='Microsoft-Windows-WHEA-Logger'} -MaxEvents 20` — WHEA 메모리 오류가 있으면 하드웨어 원인 유력"
  - "SQL 프로세스에 로드된 외부 모듈: `SELECT name, company, file_version FROM sys.dm_os_loaded_modules WHERE company IS NULL OR company NOT LIKE 'Microsoft%';` — 백신·필터·모니터링 DLL 이 보이면 원인 후보"
  short:
  - "(2차·승인 후, 롤백: 데이터 변경 없는 검사지만 I/O 부하가 커 업무 외 시간) `DBCC CHECKDB (<db>) WITH NO_INFOMSGS, ALL_ERRORMSGS;` 로 디스크상 손상 여부 확인, 서버 제조사 메모리 진단은 서비스 중단 일정 승인 후"
  mid:
  - 불량 메모리 또는 원인 구성요소를 교체하고 패치를 적용
  long:
