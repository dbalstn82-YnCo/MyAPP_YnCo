codes:
- code: ERR-16004
  severity: error
  category: security
  title: 사용자명·비밀번호 틀려 로그인 거부
  immediate:
  - "gsql·애플리케이션 로그에서 같은 계정·접속 출처의 반복 실패 건수와 시각을 집계(비밀번호 값은 기록하지 않음)"
  - "gsql 에서 `SELECT USER_NAME, PROGRAM_NAME, CLIENT_ADDRESS, LOGON_TIME FROM V$SESSION WHERE USER_NAME = '<user>';` 로 같은 계정의 정상 세션 존재 여부 확인 — 정상 세션이 있으면 특정 애플리케이션 설정 문제"
  short:
  - "(2차) 계정 잠금 정책·애플리케이션 접속 설정(데이터소스 비밀번호) 점검, 비밀번호 변경은 계정 관리자 승인 후 애플리케이션과 동시에 반영"
  mid:
  - "접속 계정을 애플리케이션별로 분리하고 비밀번호 변경 시 데이터소스 반영 절차를 표준화"
  long:
  - "로그인 실패(ERR-16004) 건수를 계정·출처별로 감시하고 짧은 시간 다발 시 보안 담당 경보"
  source: 룰 학습 5차(2026-10-15) — GPT 14차 벤더 문서 대조 + 원문 재확인
  vendor_cause: 사용자명 또는 비밀번호가 맞지 않아 로그인 거부
