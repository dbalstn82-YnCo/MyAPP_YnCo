- code: ERR-16312
  severity: warn
  category: security
  title: 비밀번호 만료
  immediate:
  - "`grep -n \"16312\" <애플리케이션 로그> | tail -20` 으로 만료 계정·접속 프로그램·시각 확인(비밀번호 값은 기록하지 않음) (26c)"
  - "gsql 로 DBA 접속 후 `SELECT * FROM V$SESSION;` 에서 같은 계정을 쓰는 다른 프로그램(영향 범위) 확인 (V$ 뷰·칼럼은 26c 매뉴얼 기준 — 20c·22c 에서 칼럼이 다르면 `SELECT *` 로 확인)"
  short:
