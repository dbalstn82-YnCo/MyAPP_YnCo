product: jeus
layer: was
note: GPT 협업 수집분 — 벤더 공식 문서와 대조 후 확정 · 2026-10-16 G7a 4단 보강(JEUS Reference Guide jeusadmin server-info·thread-info·connection-pool-info, JEUS 9 Server Guide 로깅 대조)
codes:
- code: JEUS-JNDI-LOOKUP-FAIL
  severity: error
  category: internal
  title: JNDI 조회 실패
  immediate:
  - "`grep -n -A5 -E 'NameNotFoundException|NamingException' <SERVER_HOME>/logs/JeusServer.log | tail -30` 로 조회 실패한 JNDI 이름·호출 클래스 확인(<SERVER_HOME>=$JEUS_HOME/domains/<domain>/servers/<server>, JEUS 7+ · JEUS 6 은 $JEUS_HOME/logs 하위)"
  - "`$JEUS_HOME/bin/jeusadmin -host <host>:9736 -u <user> \"connection-pool-info -server <server>\"` 로 데이터소스 JNDI 이름이 해당 서버에 있는지 확인(JEUS 7+, 읽기 전용) — 없으면 데이터소스가 그 서버·클러스터에 대상 지정되지 않은 것"
  short:
  - "(2차·승인 후, 롤백: domain.xml 백업 복원) 앱의 lookup 이름과 domain.xml 데이터소스 export-name·대상 서버 일치화, jeus-web-dd.xml 의 res-ref 매핑 수정 후 재배포"
  mid:
  - "JNDI 이름 규칙(jdbc/<업무>)과 데이터소스·EJB 대상 서버 지정 기준 문서화"
  long:
  - "배포 후 핵심 JNDI 자원 조회 스모크 시험 자동화"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: 애플리케이션이 JNDI 로 데이터소스·EJB·JMS 자원을 조회했으나 해당 이름이 바인딩되어 있지 않아 NameNotFoundException 등이 발생한 상태. 자원이 대상 서버에 등록되지 않음, export-name·res-ref 매핑 불일치, 자원 기동 실패가 흔한 원인.
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: 문구 기반 별칭(JVM·공통 예외 문구) — JEUS 6~9 공통
- code: JEUS-WEBAPP-RELOAD-FAIL
  severity: error
  category: internal
  title: 웹앱 리로드 실패
  immediate:
  - "`grep -n -B3 -A15 -i -E 'reload|redeploy' <SERVER_HOME>/logs/JeusServer.log | grep -E 'Exception|Caused by|WEB-|DEPLOY-' | tail -20` 로 리로드 실패 앱·원인 확인(JEUS 7+ 경로)"
  - "`jstat -gcutil <PID> 1000 3` 로 Metaspace(M) 사용률 확인 — 리로드 반복 후 90% 이상이면 클래스로더 누수 동반"
  short:
  - "(2차·승인 후, 롤백: 이전 배포본 보관) 원인 수정본으로 재배포, 리로드가 반복 실패하면 서버 재기동 일정으로 전환(jeusadmin stop-server/start-server)"
  mid:
  - "운영 중 자동 리로드(auto-reload) 사용 해제, 배포는 정해진 절차(재배포·재기동)로만"
  long:
  - "배포 이력과 Metaspace 추세를 함께 감시"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: 웹 모듈을 다시 읽어 들이는(reload/redeploy) 과정에서 이전 모듈 자원 정리나 새 모듈 초기화가 실패한 상태. 파일 잠금·정리되지 않은 스레드·클래스로더 누수, 배포본 오류가 흔한 원인.
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: 문구 기반 별칭(JVM·공통 예외 문구) — JEUS 6~9 공통
- code: JEUS-ADMIN-AUTH-FAIL
  severity: error
  category: security
  title: 관리 콘솔 인증 실패
  immediate:
  - "`grep -n -i -E 'authenticat|login fail|security' <SERVER_HOME>/logs/JeusServer.log | tail -20` 로 실패 계정·출처 주소·시각 확인(JEUS 7+ 경로, 관리 서버(DAS/MASTER) 로그 우선)"
  - "짧은 시간 같은 출처에서 반복되면 대입 시도로 보고 보안 담당에 출처 전달 — 관리 포트(기본 9736)가 업무망에 노출되어 있는지 `ss -ltnp | grep 9736` 로 확인"
  short:
  - "(2차·승인 후, 롤백: 변경 전 accounts.xml·방화벽 규칙 백업) 관리 포트 접근을 관리망으로 제한, 계정 비밀번호 변경은 계정 소유자·보안 담당 승인 하에"
  mid:
  - "관리자 계정 개인화(공용 administrator 사용 지양)와 접근 IP 제한 표준"
  long:
  - "관리 인증 실패 건수 감시와 관리 계정 정기 점검"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: JEUS 관리 도구(jeusadmin·WebAdmin)에 로그인할 때 계정·비밀번호 인증이 실패한 상태. 비밀번호 오입력·변경 미공유, 스크립트에 남은 구 비밀번호, 외부 대입 시도가 흔한 원인.
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: 문구 기반 별칭(JVM·공통 예외 문구) — JEUS 6~9 공통
- code: JEUS-GC-OVERHEAD
  severity: critical
  category: memory
  title: GC 오버헤드 초과
  immediate:
  - "`jstat -gcutil <PID> 1000 10` 로 Old(O) 사용률·FGC 증가 확인 — 초 단위로 Full GC 가 반복되면 확정"
  - "`jmap -histo <PID> | head -30` 으로 상위 객체 기록(live 옵션 없이 — Full GC 유발 안 함), `<SERVER_HOME>/logs/jvm.log` 또는 GC 로그 경로에서 Full GC 정지 시간 확인(전체 힙덤프는 2차)"
  short:
  - "(2차·승인 후, 롤백: 우회 해제) 웹서버(WebtoB)·LB 에서 해당 서버 우회 → 힙덤프(디스크 여유 확인) → jeusadmin stop-server/start-server 로 재기동"
  mid:
  - "힙덤프 분석으로 누수 수정, domain.xml JVM 옵션(-Xmx·GC 알고리즘)을 시험 환경에서 검증 후 반영"
  long:
  - "Full GC 빈도·정지 시간 SLO 감시와 메모리 용량계획"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: 'JVM 이 실행 시간 대부분을 GC 에 쓰고도 힙을 거의 회수하지 못해 OutOfMemoryError: GC overhead limit exceeded 가 발생한 상태. 메모리 누수, 대량 조회 결과 적재, 작은 -Xmx 가 흔한 원인.'
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: 문구 기반 별칭(JVM·공통 예외 문구) — JEUS 6~9 공통
- code: JEUS-METASPACE-OOM
  severity: critical
  category: memory
  title: Metaspace 고갈
  immediate:
  - "`jstat -gcutil <PID> 1000 5` 로 M(Metaspace) 사용률 확인 — 95% 이상이면 확정"
  - "`jmap -histo <PID> | head -30` 으로 상위 클래스 기록(live 옵션 없이 — Full GC 유발 안 함), `grep -n -i 'deploy' <SERVER_HOME>/logs/JeusServer.log | tail -20` 으로 운영 중 반복 배포(redeploy) 이력 확인 — 반복되면 클래스로더 누수 의심"
  short:
  - "(2차·승인 후, 롤백: domain.xml JVM 옵션 백업 복원) 클래스 정보 보존 후 jeusadmin stop-server/start-server 로 재기동해 Metaspace 회수"
  mid:
  - "-XX:MaxMetaspaceSize 재산정, 운영 중 반복 재배포 금지와 클래스로더 누수 수정"
  long:
  - "Metaspace 사용률 85% 경보와 배포 회귀시험"
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  vendor_cause: 'Java 8+ 의 클래스 메타데이터 영역(Metaspace)이 고갈되어 OutOfMemoryError: Metaspace 가 발생한 상태. 반복 재배포로 인한 클래스로더 누수, 동적 프록시 클래스 과다 생성, 작은 MaxMetaspaceSize 가 흔한 원인.'
  versions:
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: Metaspace 는 Java 8 이후 — JEUS 7(JDK 7/8)+ (JEUS 6 은 JDK 5/6 PermGen)
