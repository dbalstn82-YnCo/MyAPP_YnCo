product: apache
layer: web
note: 5차 핵심 코드 보강(2026-10-16) — Apache httpd 2.4.x 소스(server/core.c·config.c·mpm_common.c)의 APLOGNO 원문과 httpd.apache.org core 지시자 문서 대조. <error_log> 는 `apachectl -S` 의 Main ErrorLog
codes:
- code: AH00111
  severity: warn
  category: internal
  title: 설정 변수 미정의(${변수})
  vendor_cause: 설정 파일의 ${변수} 를 Define 지시자나 환경 변수에서 찾지 못했다는 경고(Config variable ${…} is not defined). 그 자리는 '${변수}' 글자 그대로 남아 경로·값이 틀어지며, Debian/Ubuntu 에서 envvars 를 읽지 않고 apache2 바이너리를 직접 실행할 때(APACHE_RUN_DIR 등) 흔하다.
  vendor_action: ''
  vendor_url: https://raw.githubusercontent.com/apache/httpd/2.4.x/server/core.c
  immediate:
  - "`grep -n 'AH00111' <error_log> | tail -10` 로 정의되지 않은 변수 이름 기록, 같은 기동에서 경로 관련 오류(AH00526·AH00015 등)가 이어졌는지 확인"
  - "`grep -rn 'Define <변수>' /etc/httpd/conf /etc/httpd/conf.d` (RHEL) 또는 `grep -n '<변수>' /etc/apache2/envvars` (Debian/Ubuntu) 로 정의 위치 확인 — 기동 방식이 `apachectl`/`systemctl` 이 아닌 바이너리 직접 실행인지 운영자에게 확인"
  short:
  - "(2차·승인 후, 롤백: 백업한 설정 복원) 누락된 Define 또는 envvars 항목을 추가하거나 표준 기동 명령(apachectl·systemctl)으로 기동하도록 바로잡고 `apachectl -t` Syntax OK 확인"
  mid:
  - "설정에서 쓰는 변수 목록을 한 파일(Define 모음 또는 envvars)로 모으고 기동 스크립트를 표준 명령으로 통일"
  long:
  - "설정 변경 후 `apachectl -t` 와 error_log 의 AH00111 유무 점검을 배포 절차에 포함"
  versions:
  - Apache 2.4
  version_note: AH 코드는 Apache 2.4 에서 도입 — 2.4.x 소스 server/core.c 의 APLOGNO(00111) 원문 확인
  source: 공식 문서 대조(2026-10-16 5차 보강)
- code: AH00130
  severity: info
  category: internal
  title: 경로 뒤 추가 경로(PATH_INFO) 거부로 404
  vendor_cause: 기본 처리기가 실제 파일 뒤에 붙은 추가 경로(예 /a.html/more)를 받아들이지 않아 404 를 돌려주며 남기는 정보 로그(File does not exist). core 문서상 일반 파일 처리기는 기본적으로 PATH_INFO 요청을 거부한다 — 파일이 정말 없는 AH00128 과 구분된다.
  vendor_action: 추가 경로를 받아야 하는 자원이면 해당 범위에 AcceptPathInfo On 을 지정(core 문서 예시)
  vendor_url: https://raw.githubusercontent.com/apache/httpd/2.4.x/server/core.c
  immediate:
  - "`grep -c 'AH00130' <error_log>` 와 `grep 'AH00130' <error_log> | tail -10` 로 건수·요청 경로 확인 — 소수면 잘못된 링크·스캐너로 보고 관찰만"
  - "같은 URL 이 업무 기능(예 /app/page.jsp/xxx)인지 담당에 확인 — 업무 URL 이면 백엔드 연계 설정(ProxyPass·JkMount 범위)에서 빠진 경로인지 `apachectl -S` 와 설정 grep 으로 확인"
  short:
  - "(2차·승인 후, 롤백: 설정 원복) 업무상 추가 경로가 필요한 자원이면 해당 <Files>/<Location> 에 AcceptPathInfo On 지정 또는 백엔드 연계 범위 보정 후 `apachectl -t` 확인"
  mid:
  - "AcceptPathInfo 를 쓰는 자원 목록을 문서화하고 그 외 범위는 기본값(거부)을 유지하는 기준 수립"
  long:
  - "AH00130 건수를 일 단위로 세어 급증 시 스캐닝 여부 확인"
  versions:
  - Apache 2.4
  version_note: AH 코드는 Apache 2.4 에서 도입 — 2.4.x 소스 server/core.c 의 APLOGNO(00130) 원문 확인(문구는 AH00128 과 같은 'File does not exist')
  source: 공식 문서 대조(2026-10-16 5차 보강)
- code: AH00534
  severity: critical
  category: internal
  title: MPM 구성 오류로 기동 불가
  vendor_cause: "설정 처리 후 MPM 검사가 실패해 기동이 중단되었다는 치명 오류(httpd: Configuration error: <사유>). 소스상 사유 문구는 'No MPM loaded.'(MPM 모듈 미적재)·'More than one MPM loaded.'(MPM 중복 적재)·'The MPM cannot be changed during restart.'(재시작 중 MPM 변경) 셋 중 하나다."
  vendor_action: ''
  vendor_url: https://raw.githubusercontent.com/apache/httpd/2.4.x/server/config.c
  immediate:
  - '`grep -n ''AH00534'' <error_log> | tail -5` 와 `journalctl -u httpd -n 50 --no-pager | grep AH00534` (기동 실패 시 오류가 error_log 대신 표준 오류로 남을 수 있음) 로 사유 문구 기록'
  - '`grep -rn -E ''^[[:space:]]*LoadModule[[:space:]]+mpm_'' /etc/httpd/conf /etc/httpd/conf.modules.d` (RHEL) 또는 `ls -l /etc/apache2/mods-enabled/ | grep mpm_` (Debian/Ubuntu) 로 적재 설정된 MPM 개수 확인 — 0개 또는 2개 이상이면 확정'
  - '`httpd -M 2>&1 | grep -i -E ''mpm|AH00534''` 로 실제 적재 모듈 확인(설정 오류면 같은 오류를 그대로 보여 준다, 읽기 전용)'
  short:
  - "(2차·승인 후, 롤백: 백업한 conf.modules.d·mods-enabled 복원) MPM LoadModule 을 정확히 하나만 남기고 `apachectl -t` 확인 — 'cannot be changed during restart' 면 graceful 이 아닌 완전 정지 후 기동으로 반영"
  mid:
  - "MPM 선택(event·worker·prefork)을 서버 표준 구성으로 고정하고 패키지 갱신 후 MPM 설정 파일 변경 여부를 점검"
  long:
  - "구성 변경 전 `apachectl -t`·`httpd -V` 결과 보관과 기동 실패(AH00534) 경보 운영"
  versions:
  - Apache 2.4
  version_note: AH 코드·로더블 MPM 은 Apache 2.4 도입 — 2.4.x 소스 config.c APLOGNO(00534), 문구는 mpm_common.c ap_check_mpm 원문 확인
  source: 공식 문서 대조(2026-10-16 5차 보강)
- code: AH02296
  severity: warn
  category: internal
  title: .htaccess 의 알 수 없는 지시자 무시
  vendor_cause: .htaccess 에 알 수 없는 지시자(오타이거나 적재되지 않은 모듈의 지시자)가 있어 무시하고 경고만 남겼다는 메시지. AllowOverride Nonfatal=Unknown(또는 All)이 설정된 경우에만 500 대신 이렇게 처리되며, 그 지시자가 의도한 기능(재작성·인증 등)은 적용되지 않는다.
  vendor_action: Nonfatal=Unknown 은 오타와 적재되지 않은 모듈의 지시자를 경고만 남기고 무시하므로, 지시자 철자를 고치거나 필요한 모듈을 적재(core 문서 AllowOverride)
  vendor_url: https://httpd.apache.org/docs/2.4/mod/core.html#allowoverride
  immediate:
  - "`grep -n 'AH02296' <error_log> | tail -10` 로 지시자 이름과 요청 경로 기록"
  - "`apachectl -M | grep -i <모듈이름>` 로 그 지시자를 제공하는 모듈이 적재되었는지 확인, 해당 디렉터리 .htaccess 를 `grep -n -i '<지시자>' <DocumentRoot>/<경로>/.htaccess` 로 확인 — 보안 설정(인증·접근 제한)이 무시된 것이면 보안 담당에 즉시 통보"
  short:
  - "(2차·승인 후, 롤백: .htaccess·설정 백업 복원) 지시자 철자를 고치거나 필요한 모듈을 적재하고 `apachectl -t` 확인, 보안 지시자였다면 적용 여부를 실제 요청으로 확인"
  mid:
  - ".htaccess 사용을 줄이고 설정을 서버 설정(<Directory>)으로 옮기는 기준 수립, Nonfatal 사용 범위 문서화"
  long:
  - "AH02296 발생을 콘텐츠 배포 점검 항목에 넣어 무시된 지시자를 조기 발견"
  versions:
  - Apache 2.4
  version_note: 2.4.x 소스 server/config.c APLOGNO(02296)·core.c Nonfatal 처리 원문 확인 — AllowOverride Nonfatal 을 지원하는 2.4 판에서만 나타남(지원 판은 core 문서로 확인)
  source: 공식 문서 대조(2026-10-16 5차 보강)
