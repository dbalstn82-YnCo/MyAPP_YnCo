- code: MY-1449
  severity: error
  category: security
  title: DEFINER 사용자 없음
  immediate:
  - "오류 원문의 DEFINER('<user>'@'<host>') 기록 후 계정 존재 확인: `SELECT user, host FROM mysql.user WHERE user='<user>';` (읽기 전용)"
  - "그 DEFINER 를 쓰는 객체 목록: `SELECT routine_schema, routine_name FROM information_schema.ROUTINES WHERE definer='<user>@<host>';` · `SELECT table_schema, table_name FROM information_schema.VIEWS WHERE definer='<user>@<host>';` (트리거·이벤트도 같은 방식)"
  short:
  - "(2차·승인 후) 같은 이름 계정 재생성(최소 권한) 또는 객체를 존재하는 DEFINER 로 재생성 — 롤백: 변경 전 `SHOW CREATE VIEW/PROCEDURE` 결과 저장"
  mid:
  - "객체 소유(DEFINER) 전용 계정 표준화와 SQL SECURITY 정책 정리"
  long:
  - "계정 삭제 전 DEFINER 의존 객체 점검을 계정 관리 절차에 포함"
  vendor_cause: 뷰·저장 프로시저·트리거·이벤트의 DEFINER 로 지정된 계정이 존재하지 않아 실행이 거부된 경우(ER_NO_SUCH_USER). 계정 삭제·다른 서버에서 덤프 복원 시 계정 미생성이 흔한 원인이다.
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://dev.mysql.com/doc/mysql-errors/8.4/en/server-error-reference.html)
  versions:
  - MySQL 5.5
  - MySQL 5.6
  - MySQL 5.7
  - MySQL 8.0
  - MySQL 8.4
  - MySQL 9.x
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: '-'
- code: MY-1878
  severity: error
  category: disk
  title: 임시 파일 쓰기 실패
  immediate:
  - "임시 경로 확인: `SELECT @@tmpdir;` 후 `df -h <tmpdir>` · `ls -ld <tmpdir>` — 공간 100% 또는 mysql 계정 쓰기 불가면 확정 (읽기 전용)"
  - "같은 시각 대형 정렬·ALTER TABLE(온라인 DDL 임시 파일) 작업 여부와 `dmesg -T | tail -50` 의 I/O 오류 확인"
  short:
  - "(2차·승인 후) tmpdir 공간 확보 또는 여유 볼륨으로 tmpdir 변경(my.cnf, 재기동 필요) — 롤백: my.cnf 백업, 이전 경로 기록"
  mid:
  - "임시 공간을 많이 쓰는 쿼리(파일 정렬·임시 테이블) 튜닝과 대형 DDL 시간대 분리"
  long:
  - "tmpdir 볼륨 사용률 경보와 대형 작업 사전 공간 점검"
  vendor_cause: 임시 파일 쓰기에 실패한 경우(ER_TEMP_FILE_WRITE_FAILURE, 'Temporary file write failure.'). tmpdir 공간 부족·권한 문제·I/O 오류가 흔한 원인이며 대형 정렬이나 온라인 DDL 중 자주 발생한다.
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://dev.mysql.com/doc/mysql-errors/8.4/en/server-error-reference.html)
