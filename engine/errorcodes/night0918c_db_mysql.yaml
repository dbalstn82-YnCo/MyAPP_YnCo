  - MySQL 5.6
  - MySQL 5.7
  - MySQL 8.0
  - MySQL 8.4
  - MySQL 9.x
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: MySQL 공식 오류번호 1969 확인 불가
- code: MY-2026
  severity: error
  category: security
  title: SSL 연결 오류
  immediate:
  - "서버 TLS 설정 확인: `SHOW GLOBAL VARIABLES LIKE 'tls_version';` · `SHOW GLOBAL STATUS LIKE 'Ssl_server_not_after';` (인증서 만료일) (읽기 전용)"
  - "오류 원문의 SSL 상세 메시지와 클라이언트 드라이버 버전·지원 TLS 버전 기록 — 8.0.28 부터 TLSv1/1.1 미지원"
  short:
  - "(2차·승인 후) 인증서 갱신 또는 서버·클라이언트 TLS 버전·cipher 정합(서버 tls_version, 클라이언트 ssl-mode/드라이버 갱신) — 롤백: 기존 인증서·my.cnf 백업"
  mid:
  - "DB 접속 TLS 정책(허용 버전·cipher) 표준화"
  long:
  - "인증서 만료일(Ssl_server_not_after) 감시와 갱신 일정 관리"
  vendor_cause: 클라이언트가 서버와 SSL/TLS 연결을 맺지 못한 클라이언트 오류(CR_SSL_CONNECTION_ERROR). 서버·클라이언트 TLS 버전 또는 cipher 불일치, 인증서 만료·CA 불일치가 흔한 원인이다.
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://dev.mysql.com/doc/mysql-errors/8.4/en/client-error-reference.html)
  versions:
  - MySQL 5.5
  - MySQL 5.6
  - MySQL 5.7
  - MySQL 8.0
  - MySQL 8.4
  - MySQL 9.x
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: 클라이언트 오류 CR_SSL_CONNECTION_ERROR
- code: MY-3161
  severity: error
  category: internal
  title: 스토리지 엔진 비활성
  immediate:
  - "비활성 엔진 목록 확인: `SELECT @@disabled_storage_engines;` (5.7.8+) 와 오류 원문의 엔진 이름(MyISAM·MEMORY 등) 대조 (읽기 전용)"
  - "실패한 CREATE TABLE 문의 ENGINE= 지정과 `SELECT @@default_storage_engine;` 확인 — 배포 스크립트·덤프에 비활성 엔진 지정 여부"
  short:
  - "(2차·승인 후) 배포 스크립트·덤프의 ENGINE 을 InnoDB 로 수정(권장), disabled_storage_engines 변경은 my.cnf·재기동 필요 — 롤백: my.cnf 백업"
  mid:
  - "스토리지 엔진 사용 표준(InnoDB) 수립과 배포 전 ENGINE 검사"
  long:
