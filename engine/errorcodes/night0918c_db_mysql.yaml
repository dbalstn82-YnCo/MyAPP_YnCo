- code: MY-1969
  severity: warn
  category: capacity
  title: max_execution_time 초과로 중단
  immediate:
  - "서버 제품·버전 확인: `SELECT VERSION(), @@version_comment;` — 1969 는 MariaDB 오류 번호(ER_STATEMENT_TIMEOUT)이므로 MariaDB 여부 먼저 확인 (읽기 전용)"
  - "중단된 SQL 과 제한값 확인: MariaDB `SELECT @@max_statement_time;` (초, 10.1+) / MySQL 은 `SELECT @@max_execution_time;`(ms, 3024 로 보고), 실행계획은 `EXPLAIN <SQL>` 로만"
  short:
  - "(2차·승인 후) 인덱스 추가·쿼리 재작성으로 실행 시간 단축, 제한값 조정은 세션 단위 우선 — 롤백: 전역 변경 시 이전 값 기록"
  mid:
  - "업무별 쿼리 시간 기준(SLO)과 서버 실행 시간 제한값 정렬"
  long:
  - "실행 시간 초과 건수와 상위 지연 쿼리 정기 튜닝"
  vendor_cause: MySQL 공식 서버 오류표에는 1969 가 없고(1888~2999 미사용), MariaDB 의 ER_STATEMENT_TIMEOUT 'Query execution was interrupted (max_statement_time exceeded)' 이다. 실행 시간이 max_statement_time 을 넘어 문장이 중단된 경우다.
  vendor_url: https://mariadb.com/docs/server/reference/error-codes/mariadb-error-code-reference
  verify_note: "미검증 — MySQL 8.0 오류표에 1969 없음·MariaDB 오류표의 ER_STATEMENT_TIMEOUT 은 확인, max_statement_time 도입 버전(10.1)과 수집 로그가 실제 MariaDB 인지는 미확인"
  source: Claude 수집 2026-09-18·공식 문서 미확인(보류)(https://dev.mysql.com/doc/mysql-errors/8.4/en/server-error-reference.html)
  versions:
