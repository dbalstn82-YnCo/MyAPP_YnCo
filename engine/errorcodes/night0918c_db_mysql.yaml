  - "누가 언제 설정했는지 my.cnf 변경 이력과 error log 의 기동 기록(`grep -i 'force_recovery' <log_error 경로> | tail -20`) 확인, 이 상태에서 쓰기 작업 중단 요청"
  short:
  - "(2차·승인 후) 복구 모드에서 `mysqldump` 로 데이터 확보 후 innodb_force_recovery 제거·정상 기동(필요 시 재구축) — 영향: 4 이상은 데이터 손실 위험, 롤백: 작업 전 datadir 사본 보관"
