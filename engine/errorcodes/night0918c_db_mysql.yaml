codes:
- code: MY-1032
  severity: error
  category: internal
  title: 레코드를 찾을 수 없음
  immediate:
  - "오류 원문의 테이블 기록, 복제본이면 적용 스레드 오류 위치 확인: `SHOW REPLICA STATUS\\G` (8.0.22+) / `SHOW SLAVE STATUS\\G` (이전) 의 Last_SQL_Error·Relay_Log_Pos (읽기 전용)"
  - "error log 에서 같은 테이블의 손상·InnoDB 오류 동반 여부 확인: `grep -i '<table>' <log_error 경로> | tail -30`"
  short:
  - "(2차·승인 후) 업무 외 시간 `CHECK TABLE <db>.<table>;`(대형 테이블은 부하·잠금)로 무결성 확인, 복제 불일치면 원본 기준 재동기화 계획 — 롤백: 작업 전 해당 테이블 덤프"
  mid:
  - "원본·복제본 데이터 정합성 비교 절차(체크섬 비교) 수립"
  long:
  - "복제 오류(1032·1062) 감시와 분기 정합성 점검"
  vendor_cause: 요청한 행을 테이블에서 찾지 못한 경우(ER_KEY_NOT_FOUND). 복제본에서 원본과 데이터가 어긋나 행 기반 이벤트의 대상 행이 없을 때 흔하며, 드물게 테이블·인덱스 손상이 원인이다.
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://dev.mysql.com/doc/mysql-errors/8.4/en/server-error-reference.html)
  versions:
  - MySQL 5.5
  - MySQL 5.6
  - MySQL 5.7
  - MySQL 8.0
  - MySQL 8.4
  - MySQL 9.x
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: '-'
- code: MY-1034
  severity: critical
  category: storage
  title: 키 파일 손상
  immediate:
  - "대상 테이블 엔진 확인: `SELECT table_schema, table_name, engine FROM information_schema.TABLES WHERE table_name='<table>';` — MyISAM 이면 .MYI 키 파일 손상 의심 (읽기 전용)"
  - "같은 시각 공간·I/O 오류 확인: `df -h <datadir>` · `dmesg -T | tail -50`, 최근 백업 위치 확인"
  short:
  - "(2차·승인 후) 테이블 백업(파일 복사 또는 덤프) 후 `REPAIR TABLE <db>.<table>;`(MyISAM, 테이블 잠금) 또는 백업 복원 — 롤백: 수리 전 .MYD/.MYI 사본 보관"
  mid:
  - "MyISAM 테이블의 InnoDB 전환 검토와 디스크 오류 원인 제거"
  long:
  - "스토리지 상태·테이블 손상 오류 감시"
  vendor_cause: 테이블의 키(인덱스) 파일이 잘못되어 사용할 수 없다는 오류(ER_NOT_KEYFILE, 'try to repair it'). 주로 MyISAM 테이블의 비정상 종료·디스크 공간 부족·I/O 오류로 인덱스 파일이 손상된 경우다.
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://dev.mysql.com/doc/mysql-errors/8.4/en/server-error-reference.html)
  versions:
  - MySQL 5.5
  - MySQL 5.6
  - MySQL 5.7
  - MySQL 8.0
  - MySQL 8.4
  - MySQL 9.x
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: '-'
- code: MY-1142
  severity: warn
  category: security
  title: 명령 권한 거부
  immediate:
  - "오류 원문의 명령(SELECT·INSERT 등)·'<user>'@'<host>'·테이블 기록 후 `SHOW GRANTS FOR '<user>'@'<host>';` 로 부여 권한 조회 (읽기 전용)"
  - "최근 REVOKE·계정 변경·배포 이력을 변경 기록과 대조 — 실제 매칭 계정은 `SELECT CURRENT_USER();` 로 확인(USER() 와 다르면 다른 계정 줄에 매칭)"
  short:
  - "(2차·승인 후) 필요한 테이블·명령만 `GRANT <명령> ON <db>.<table> TO '<user>'@'<host>';` — 롤백: 대응 REVOKE 문 작성, 보안 담당 승인"
  mid:
  - "애플리케이션 계정 권한 표준(역할·부여 스크립트) 수립"
  long:
  - "권한 변경 이력 관리와 분기별 권한 검토"
  vendor_cause: 사용자에게 해당 테이블에 대한 명령 권한(SELECT·INSERT·UPDATE 등)이 없어 거부된 경우(ER_TABLEACCESS_DENIED_ERROR). 권한 회수·새 테이블 배포 후 권한 누락·다른 계정 매칭이 흔한 원인이다.
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://dev.mysql.com/doc/mysql-errors/8.4/en/server-error-reference.html)
  versions:
  - MySQL 5.5
  - MySQL 5.6
  - MySQL 5.7
  - MySQL 8.0
  - MySQL 8.4
  - MySQL 9.x
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: '-'
- code: MY-1153
  severity: error
  category: capacity
  title: 패킷이 max_allowed_packet 초과
  immediate:
  - "현재 한도 확인: `SELECT @@global.max_allowed_packet, @@session.max_allowed_packet;` (바이트, 8.0 기본 64MB·5.7 기본 4MB) (읽기 전용)"
  - "오류를 낸 SQL 의 BLOB·대량 다건 INSERT 크기와 클라이언트(mysqldump·JDBC) 쪽 max_allowed_packet 설정 확인"
  short:
  - "(2차·승인 후) `SET PERSIST max_allowed_packet=<바이트>` (8.0+) 또는 my.cnf [mysqld] 수정, 클라이언트 쪽 값도 함께 상향 — 영향: 연결당 메모리 증가, 롤백: 이전 값 기록"
  mid:
  - "대량 데이터는 분할 INSERT·파일 적재(LOAD DATA)로 처리"
  long:
  - "데이터 크기 기준(행·BLOB 최대 크기) 정립과 1153 감시"
  vendor_cause: 서버(또는 클라이언트)가 max_allowed_packet 보다 큰 패킷을 받아 연결을 끊은 경우(ER_NET_PACKET_TOO_LARGE). 큰 BLOB·대량 다건 INSERT·덤프 복원이 흔한 원인이다.
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://dev.mysql.com/doc/mysql-errors/8.4/en/server-error-reference.html)
  versions:
  - MySQL 5.5
  - MySQL 5.6
  - MySQL 5.7
  - MySQL 8.0
  - MySQL 8.4
  - MySQL 9.x
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: '-'
- code: MY-1236
  severity: critical
  category: upstream
  title: 바이너리 로그 읽기 치명적 오류
  immediate:
  - "복제본에서 오류·요청 위치 확인: `SHOW REPLICA STATUS\\G` (8.0.22+) / `SHOW SLAVE STATUS\\G` (이전) 의 Last_IO_Error·Source_Log_File(Master_Log_File)·Retrieved_Gtid_Set (읽기 전용)"
  - "원본에서 해당 binlog 존재 확인: `SHOW BINARY LOGS;` 와 `SELECT @@gtid_purged;` — 요청 파일·GTID 가 이미 정리됐으면 원인 확정"
  short:
  - "(2차·승인 후) 원본에 binlog 가 없으면 최신 백업으로 복제본 재구축(GTID 사용 시 gtid_purged 설정) — 롤백: 재구축 전 복제본 설정·데이터 백업, 복제 중단 영향 공지"
  mid:
  - "binlog 보존 기간(binlog_expire_logs_seconds 8.0+ / expire_logs_days 5.7)을 복제 최대 지연보다 길게 조정"
  long:
  - "복제 IO 스레드 상태·지연 감시와 복제 재구축 절차 문서화"
  vendor_cause: 복제본의 IO 스레드가 원본 binlog 를 읽다 치명적 오류를 받은 경우(8.0.33 부터 ER_SOURCE_FATAL_ERROR_READING_BINLOG). 요청한 binlog 파일·GTID 가 원본에서 이미 정리됨, binlog 손상, max_allowed_packet 초과가 흔한 원인이다.
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://dev.mysql.com/doc/mysql-errors/8.4/en/server-error-reference.html)
  versions:
