product: iis
layer: web
note: GPT 협업 수집분 — 벤더 공식 문서와 대조 후 확정
codes:
- code: IIS-HTTPERR-TIMER-MINBYTESPERSECOND
  severity: warn
  category: connection
  title: 최소 전송 속도 미달
  immediate:
  - '`Select-String -Path "%SystemRoot%\System32\LogFiles\HTTPERR\httperr*.log" -Pattern "Timer_MinBytesPerSecond" | Measure-Object` 로 건수 확인(PowerShell에서는 `$env:SystemRoot` 사용) — 평소 대비 급증이면 이상'
  - 'HTTPERR 줄의 c-ip 칸으로 출처 IP 상위 10개 확인 — 특정 IP 편중이면 slow read 공격 의심(보안 담당 통보), 고르게 분산이면 회선 품질 문제'
  short:
  - '(2차·승인 후, 롤백: 원래 값 복원) `appcmd list config -section:system.applicationHost/webLimits` 로 minBytesPerSecond 현재 값 확인 후, 대용량 다운로드 사이트에 한해 값 조정 — 0(해제)은 DoS 노출로 금지'
  mid:
  - '대용량 파일 다운로드 경로를 별도 사이트/CDN 으로 분리하고 공격 출처는 방화벽·dynamicIpSecurity 로 차단 정책화'
  long:
  - 'HTTPERR Timer_MinBytesPerSecond 시간당 건수 기준선 수립·급증(기준선 3배) 경보'
  vendor_cause: 'HTTP.sys(HTTPERR) 사유 Timer_MinBytesPerSecond — 클라이언트가 응답을 최소 전송 속도(HTTP Server API 문서 기본 150바이트/초, IIS 에서는 webLimits minBytesPerSecond 로 설정 — IIS 구성 기본 240)보다 느리게 받아 HTTP.sys 가 연결을 끊었다. 저속 회선·모바일 클라이언트 또는 느린 응답 수신형(slow read) 공격이 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - IIS 6.0 (2003)
  - IIS 7.0/7.5 (2008/R2)
  - IIS 8.0/8.5 (2012/R2)
  - IIS 10.0 (2016~2025)
  version_note: HTTP.sys 오류 로그(HTTPERR) 사유 문구 — 2003(IIS 6.0)부터 동일
- code: IIS-HTTPERR-CLIENT-RESET
  severity: warn
  category: connection
  title: 클라이언트 리셋
  immediate:
  - '`Select-String -Path "$env:SystemRoot\System32\LogFiles\HTTPERR\httperr*.log" -Pattern "Client_Reset|Timer_EntityBody|Timer_HeaderWait" | Group-Object { $_.Matches[0].Value } | Select Count,Name` 로 사유별 건수 확인'
  - '같은 시각 W3C 로그(`C:\inetpub\logs\LogFiles\W3SVC<siteID>`)의 time-taken 과 LB·방화벽 세션 타임아웃 값 대조 — 특정 IP 반복이면 공격 의심'
  short:
  - '(2차) LB·방화벽 유휴 타임아웃이 IIS connectionTimeout(기본 120초)보다 짧으면 장비 쪽 값을 IIS 이상으로 맞추도록 네트워크 담당에 변경 요청'
  mid:
  - '슬로우 요청 공격 대비 Http.sys 타이머(HeaderWait·EntityBody)와 dynamicIpSecurity 요청 빈도 제한 정책 수립'
  long:
  - 'Client_Reset·Timer_HeaderWait 일별 건수 추세 감시와 출처 IP 상위 목록 주간 보고'
  vendor_cause: 'HTTP.sys(HTTPERR) 사유 Client_Reset·Timer_EntityBody·Timer_HeaderWait — 요청 헤더/본문을 받는 도중 클라이언트가 연결을 끊었거나 ConnectionTimeout(기본 2분) 안에 헤더·본문이 도착하지 않았다. 클라이언트 취소·중간 장비(LB·방화벽) 세션 종료·느린 요청(slowloris) 공격이 흔한 원인.'
  verify_note: '미검증 — Client_Reset 사유 문구는 Win32 HTTP Server API 사유 표(learn.microsoft.com/windows/win32/http/types-of-errors-logged-by-the-http-server-api)에 없어 공식 정의 문구를 확인하지 못함(Timer_EntityBody·Timer_HeaderWait 는 확인)'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - IIS 6.0 (2003)
  - IIS 7.0/7.5 (2008/R2)
  - IIS 8.0/8.5 (2012/R2)
  - IIS 10.0 (2016~2025)
  version_note: HTTP.sys 오류 로그(HTTPERR) 사유 문구 — 2003(IIS 6.0)부터 동일
- code: IIS-HTTPERR-INTERNAL
  severity: error
  category: internal
  title: HTTP.sys 내부 오류
  immediate:
  - '`Select-String -Path "$env:SystemRoot\System32\LogFiles\HTTPERR\httperr*.log" -Pattern " Internal" | Select-Object -Last 20` 로 발생 시각·URL·사이트ID 확인'
  - '`Get-WinEvent -FilterHashtable @{LogName="System"; ProviderName="Microsoft-Windows-HttpEvent"} -MaxEvents 20 | Format-List TimeCreated,Id,Message` 로 HTTP.sys 이벤트 동반 여부 확인'
  - '`netsh http show servicestate` 로 요청 큐·URL 그룹 상태 확인(읽기 전용)'
  short:
  - '(2차) 같은 시각 System 이벤트·SSL 바인딩(`netsh http show sslcert`)과 대조해 원인 범위를 좁히고, 최신 누적 업데이트 적용 여부를 Windows 담당과 확인'
  mid:
  - 'Windows 누적 업데이트(HTTP.sys 포함) 적용 주기 표준화, 적용은 변경 관리 승인 후 정기 점검 시간에'
  long:
  - 'HTTPERR Internal 건수 0 기준 경보, 발생 시 System 이벤트 자동 첨부'
  vendor_cause: 'HTTP.sys(HTTPERR) 사유 Internal — HTTP.sys 내부 서버 오류(HTTP 500)로 요청을 처리하지 못했다. 드라이버·SSL 바인딩 이상이나 커널 자원 부족 등 IIS 앱 바깥(커널 모드) 문제에서 나며, 반복되면 OS 패치 수준과 시스템 이벤트를 함께 봐야 한다.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - IIS 6.0 (2003)
  - IIS 7.0/7.5 (2008/R2)
  - IIS 8.0/8.5 (2012/R2)
  - IIS 10.0 (2016~2025)
  version_note: HTTP.sys 오류 로그(HTTPERR) 사유 문구 — 2003(IIS 6.0)부터 동일
- code: IIS-HTTPERR-URL-LENGTH
  severity: warn
  category: capacity
  title: URL 길이 초과
  immediate:
  - '`Select-String -Path "$env:SystemRoot\System32\LogFiles\HTTPERR\httperr*.log" -Pattern "URL_Length" | Select-Object -Last 20` 로 대상 URL·출처 IP 확인'
  - '`reg query HKLM\System\CurrentControlSet\Services\HTTP\Parameters` 로 UrlSegmentMaxLength·MaxFieldLength 설정 여부 확인(값 없으면 기본값)'
  short:
  - '(2차·승인 후, 롤백: 레지스트리 내보내기 후 복원) 정상 업무 URL 이면 UrlSegmentMaxLength 를 필요한 최소만큼 상향 — HTTP 서비스 재시작 필요해 서비스 중단 일정 확보'
  mid:
  - '긴 데이터를 URL 대신 POST 본문으로 전달하도록 애플리케이션 설계 변경 요청'
  long:
  - 'URL_Length 거부 건수와 출처 IP 를 보안 감시 항목에 등록'
  vendor_cause: 'HTTP.sys(HTTPERR) 사유 URL_Length — 요청 URL 이 허용 최대 크기를 넘어 HTTP.sys 가 거부했다(경로 세그먼트 한도 UrlSegmentMaxLength 기본 260자, 헤더 한도 MaxFieldLength 기본 16384바이트). 비정상 긴 쿼리·스캐너 요청이 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - IIS 6.0 (2003)
  - IIS 7.0/7.5 (2008/R2)
  - IIS 8.0/8.5 (2012/R2)
  - IIS 10.0 (2016~2025)
  version_note: HTTP.sys 오류 로그(HTTPERR) 사유 문구 — 2003(IIS 6.0)부터 동일
- code: IIS-HTTPERR-HEADER
  severity: warn
  category: security
  title: 헤더 오류
  immediate:
  - '`Select-String -Path "$env:SystemRoot\System32\LogFiles\HTTPERR\httperr*.log" -Pattern " Header" | Select-Object -Last 30` 로 출처 IP·URL 확인'
  - '출처가 내부 프록시·LB 면 그 장비가 추가하는 헤더 크기를, 외부 다수 IP 면 스캔 여부를 보안 담당과 확인'
  short:
  - '(2차) 정상 클라이언트로 확인되면 문제 요청을 재현(curl -v)해 헤더 구성 확인 후 MaxFieldLength·MaxRequestBytes 조정 필요성 검토(변경은 승인 후)'
  mid:
  - 'WAF/요청 필터링에서 비정상 헤더 차단 규칙 수립'
  long:
  - 'HTTPERR Header 거부 건수 일별 추세 감시'
  vendor_cause: 'HTTP.sys(HTTPERR) 사유 Header — 요청 헤더를 해석하다 구문 오류가 나 HTTP.sys 가 400 으로 거부했다. 잘못된 헤더 형식을 보내는 클라이언트·프록시, 헤더 한도(MaxFieldLength) 초과, 비정상 요청 스캔이 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - IIS 6.0 (2003)
  - IIS 7.0/7.5 (2008/R2)
  - IIS 8.0/8.5 (2012/R2)
  - IIS 10.0 (2016~2025)
  version_note: HTTP.sys 오류 로그(HTTPERR) 사유 문구 — 2003(IIS 6.0)부터 동일
- code: IIS-HTTPERR-FORBIDDEN
  severity: warn
  category: security
  title: 금지된 요청
  immediate:
  - '`Select-String -Path "$env:SystemRoot\System32\LogFiles\HTTPERR\httperr*.log" -Pattern "Forbidden" | Select-Object -Last 30` 로 URL·출처 IP 확인'
  - '같은 IP 가 짧은 시간 다수 시도하면 공격으로 분류해 보안 담당에 IP·시각 전달'
  short:
  - '(2차) 정상 업무 요청으로 확인되면 애플리케이션 측 URL 인코딩 수정 요청, 공격이면 방화벽·IP 제한(ipSecurity) 등록을 승인 후 적용'
  mid:
  - 'HTTP.sys 거부 사유(Forbidden·URL·Header)를 WAF 차단 정책과 연계한 대응 기준 수립'
  long:
  - 'Forbidden 거부 건수·출처 IP 를 보안 관제에 연동'
  vendor_cause: 'HTTP.sys(HTTPERR) 사유 Forbidden — 요청을 해석하던 중 허용되지 않는 요소나 문자열 순서를 만나 HTTP.sys 가 거부했다. 경로 조작(../)·제어 문자 포함 URL 같은 공격성 요청이나 잘못 인코딩된 클라이언트 요청이 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - IIS 6.0 (2003)
  - IIS 7.0/7.5 (2008/R2)
  - IIS 8.0/8.5 (2012/R2)
  - IIS 10.0 (2016~2025)
  version_note: HTTP.sys 오류 로그(HTTPERR) 사유 문구 — 2003(IIS 6.0)부터 동일
- code: IIS-HTTPERR-CONNLIMIT
  severity: critical
  category: capacity
  title: 연결 한도 초과
  immediate:
  - '`Get-Counter "\Web Service(_Total)\Current Connections"` 로 현재 연결 수와 `%windir%\system32\inetsrv\appcmd list site /config` 의 limits maxConnections 비교'
  - '`Select-String -Path "$env:SystemRoot\System32\LogFiles\HTTPERR\httperr*.log" -Pattern "ConnLimit" | Measure-Object` 로 거부 건수, W3C 로그 time-taken 으로 응답 지연 동반 여부 확인'
  short:
  - '(2차·승인 후, 롤백: 이전 값 복원) 정상 증가로 확인되면 사이트 maxConnections 상향, 지연이 원인이면 백엔드(앱 풀·DB) 지연 해소를 우선'
  mid:
  - '연결 수 최대치 기반 maxConnections·서버 대수 재산정과 부하 분산 구성'
  long:
  - 'Current Connections 가 한도의 80% 도달 시 경보'
  vendor_cause: 'HTTP.sys(HTTPERR) 사유 ConnLimit — 사이트 수준 연결 한도(limits maxConnections)에 도달해 HTTP.sys 가 503 으로 거부했다. 접속 폭주나 응답 지연으로 연결이 오래 유지된 것이 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - IIS 6.0 (2003)
  - IIS 7.0/7.5 (2008/R2)
  - IIS 8.0/8.5 (2012/R2)
  - IIS 10.0 (2016~2025)
  version_note: HTTP.sys 오류 로그(HTTPERR) 사유 문구 — 2003(IIS 6.0)부터 동일
- code: IIS-HTTPERR-LOGGING-FAIL
  severity: error
  category: disk
  title: 로그 쓰기 실패
  immediate:
  - '`Get-PSDrive C` 와 `Get-ChildItem $env:SystemRoot\System32\LogFiles\HTTPERR | Measure-Object Length -Sum` 로 드라이브 여유·로그 총량 확인 — 여유 5% 미만이면 디스크 원인'
  - '`reg query HKLM\System\CurrentControlSet\Services\HTTP\Parameters /v ErrorLoggingDir` 와 `icacls <로그폴더>` 로 경로·권한 확인(읽기 전용)'
  short:
  - '(2차·승인 후, 롤백: 옮긴 파일 원위치) 오래된 httperr*.log 를 다른 볼륨으로 보관 이동해 공간 확보, 권한은 Administrators·SYSTEM 전체 권한으로 복구'
  mid:
  - 'ErrorLogFileTruncateSize(기본 1MB, 순환 단위)와 보관 일수 기준 정리 작업(예약 작업) 표준화, 로그 전용 볼륨 검토'
  long:
  - '시스템 드라이브 사용률 85%/95% 경보와 HTTPERR 폴더 크기 월간 점검'
  vendor_cause: 'HTTP.sys 오류 로그(HTTPERR) 기록 실패 — 로그 폴더(ErrorLoggingDir, 기본 %SystemRoot%\System32\LogFiles\HTTPERR) 쓰기 중 오류가 나 HTTP.sys 가 이벤트 로그로 기록 실패를 알렸다. 디스크 가득참·폴더 권한 변경(Administrators·SYSTEM 전용)·잘못된 경로 설정이 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - IIS 6.0 (2003)
  - IIS 7.0/7.5 (2008/R2)
  - IIS 8.0/8.5 (2012/R2)
  - IIS 10.0 (2016~2025)
  version_note: HTTP.sys 오류 로그(HTTPERR) 사유 문구 — 2003(IIS 6.0)부터 동일
- code: IIS-W3SVC-1004
  severity: error
  category: connection
  title: 사이트 URL 접두사 등록 실패
  immediate:
  - '`Get-WinEvent -FilterHashtable @{LogName="System"; Id=1004} -MaxEvents 10 | Format-List TimeCreated,ProviderName,Message` 로 비활성화된 사이트·URL 접두사 확인'
  - '`netsh http show urlacl` 와 `netsh http show iplisten` 으로 같은 접두사·IP 를 다른 프로세스가 선점했는지 확인(읽기 전용)'
  - '`%windir%\system32\inetsrv\appcmd list site` 로 해당 사이트 state 가 Stopped 인지 확인'
  short:
  - '(2차·승인 후, 롤백: 바인딩 원복) 접두사 충돌·권한(Access is denied) 원인을 제거하고 사이트 바인딩 수정 후 사이트 시작'
  mid:
  - '사이트 바인딩(IP·포트·호스트 헤더) 대장 관리와 HTTP.sys 를 쓰는 다른 서비스(WinRM·Reporting 등) 포트 정리'
  long:
  - 'W3SVC 1004 이벤트 즉시 경보와 사이트 state 감시(Stopped 감지)'
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/answers/questions/2601492/iis-unable-to-start-default-site-access-is-denied)
  note: 웹 서비스 전체 시작 실패가 아니라 해당 사이트 URL 접두사 등록 실패로 사이트가 비활성화되는 오류임
  vendor_cause: WWW Service가 사이트의 URL 접두사를 등록하지 못해 해당 사이트를 비활성화했다.
  vendor_action: ''
  vendor_url: https://learn.microsoft.com/en-us/answers/questions/2601492/iis-unable-to-start-default-site-access-is-denied
  versions:
  - IIS 6.0 (2003)
  - IIS 7.0/7.5 (2008/R2)
  - IIS 8.0/8.5 (2012/R2)
  - IIS 10.0 (2016~2025)
  version_note: W3SVC 이벤트 ID — IIS 6.0~10.0 공통
- code: IIS-W3SVC-1007
  severity: error
  category: connection
  title: 사이트 URL 접두사 등록 실패
  immediate:
  - '`Get-WinEvent -FilterHashtable @{LogName="System"; Id=1007} -MaxEvents 10 | Format-List TimeCreated,ProviderName,Message` 로 대상 사이트·바인딩 확인'
