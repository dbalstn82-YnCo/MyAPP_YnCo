  vendor_cause: 데이터소스 연결이 유효하지 않다고 판정됐다(IllegalStateException Connection is not valid). DB 재기동·방화벽 유휴 세션 정리로 끊긴 연결이 풀에 남아 있거나 검증 설정이 없는 경우가 흔한 원인.
