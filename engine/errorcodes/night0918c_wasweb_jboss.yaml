- code: WFLYCTL0190
  severity: error
  category: internal
  title: 롤백 단계 핸들러 실패
  immediate:
  - "`grep -n -B10 -A10 'WFLYCTL0190' $JBOSS_HOME/standalone/log/server.log | grep -E 'WFLYCTL|Caused by' | head -20` 로 실패한 원래 작업·주소, 동반 실패 서비스 이름과 rollback 단계 실패 사유 확인"
  - "`$JBOSS_HOME/bin/jboss-cli.sh -c ':read-attribute(name=server-state)'` 로 reload-required·restart-required 여부 확인(읽기 전용, EAP 7/8) — 설정이 반쯤 적용된 상태일 수 있음"
  short:
  - "(2차·승인 후, 롤백: standalone_xml_history 의 직전 설정) 원래 작업의 실패 원인 수정 후 작업 재실행, server-state 가 reload-required 면 영향 확인 뒤 :reload"
  mid:
  - "관리 작업은 CLI batch 로 묶어 검증 환경 시험 후 운영 반영"
  long:
  - "관리 작업 감사 로그와 구성 변경 이력 관리"
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://access.redhat.com/webassets/avalon/d/red_hat_jboss_enterprise_application_platform/7.3/mgmt_model/log-message-reference.html)
  vendor_cause: 실패한 관리 작업을 되돌리는(rollback) 단계에서 step handler 가 다시 실패했다(Step handler %s for operation %s at address %s failed handling operation rollback). 원래 작업 실패에 더해 자원 상태가 일관되지 않을 때 나타나며, 설정이 일부만 적용됐을 수 있다.
  vendor_url: https://access.redhat.com/webassets/avalon/d/red_hat_jboss_enterprise_application_platform/7.3/mgmt_model/log-message-reference.html
