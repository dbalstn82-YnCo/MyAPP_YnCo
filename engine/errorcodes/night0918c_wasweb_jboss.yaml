  - "`grep -n -B5 -A10 'WFLYJCA0047' $JBOSS_HOME/standalone/log/server.log | grep -E 'IJ0|Caused by|SQLException' | head -10` 로 동반 원인 확인, `nc -zvw3 <db_host> <db_port>` 로 도달성 확인"
