  source: GPT 수집·벤더 문서 대조 완료(https://docs.oracle.com/en/error-help/db/ora-03135/)
  note: connection lost contact
  vendor_cause: 서버가 예기치 않게 종료·강제 종료됐거나 서버가 연결 timeout을 발생시킴
  vendor_action: 서버 세션 종료 여부와 sqlnet.ora의 timeout 파라미터가 올바른지 확인
  vendor_url: https://docs.oracle.com/en/error-help/db/ora-03135/
