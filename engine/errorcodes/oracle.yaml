product: oracle
layer: db
codes:
- code: ORA-04030
  severity: critical
  category: memory
  title: Oracle 프로세스 전용 메모리 부족
  immediate:
  - "PGA 상위: `select s.sid, s.username, s.sql_id, round(p.pga_alloc_mem/1024/1024) mb from v$process p join v$session s on s.paddr=p.addr order by p.pga_alloc_mem desc fetch first 10 rows only;` (12c+)"
  - "전체·OS: `select name, round(value/1024/1024) mb from v$pgastat where name in ('total PGA allocated','maximum PGA allocated');` 와 `free -m`·oracle 계정 `ulimit -a`"
  - "trace 의 할당 실패 영역(`out of process memory when trying to allocate … (<영역>)`) 확인"
  short:
  - "(2차·승인 후, 롤백: 원래 값 scope=both) 원인 SQL 튜닝 요청, `pga_aggregate_limit`(12c+)·`pga_aggregate_target` 조정, 메모리 과다 세션은 업무 확인 후 종료"
  mid:
  - "PGA 파라미터 재산정과 메모리 과다 사용 SQL(대형 정렬·컬렉션) 튜닝"
  long:
  - "서버 메모리 증설 계획과 PGA 사용량 추세 감시"
  source: GPT 수집·벤더 문서 대조 완료(https://docs.oracle.com/en/error-help/db/ora-04030/)
  note: OS 메모리 고갈 또는 프로세스 private-memory 한도, PGA로만 한정 불가
  vendor_cause: "서버 프로세스가 OS 에서 private(PGA) 메모리를 더 할당받지 못함 — OS 메모리·swap 고갈, ulimit(data·vmem) 한도, 대형 정렬·해시·PL/SQL 컬렉션 과다 사용이 흔한 원인."
  vendor_action: 다른 Oracle 인스턴스·애플리케이션의 메모리 사용을 확인하고 private memory 공간 확보를 위해 shared memory 축소 고려
  vendor_url: https://docs.oracle.com/en/error-help/db/ora-04030/
  versions:
  - Oracle 10gR2
  - Oracle 11gR1/11gR2
  - Oracle 12cR1
  - Oracle 12cR2/18c
  - Oracle 19c
  - Oracle 21c
  - Oracle 23ai/26ai
  version_note: ORA 코드 번호·의미는 10gR2~26ai 동일 — alert log 형식만 12.2 부터 ISO8601 시각(파서가 고전·ISO 두 형식 처리)
- code: ORA-04031
  severity: critical
  category: memory
  title: Oracle 공유 메모리 부족
  immediate:
  - "메시지의 pool·요청 크기 확인 뒤 `select pool, round(bytes/1024/1024) free_mb from v$sgastat where name='free memory';` — 해당 pool free 가 요청 크기보다 작거나 매우 적으면 확정"
  - "`select component, round(current_size/1024/1024) mb, last_oper_type, last_oper_time from v$sga_dynamic_components where current_size > 0;` (10g+) — shared pool 이 SHRINK 직후면 자동 조정 영향"
  - "`select request_failures, last_failure_size from v$shared_pool_reserved;` 와 `select name, value from v$sysstat where name in ('parse count (hard)','parse count (total)');` — 하드파싱 비율이 높으면 리터럴 SQL 원인"
  short:
  - "(2차·승인 후, 롤백: 해당 없음 — 플러시 직후 하드파싱 급증 주의) 긴급 시 `alter system flush shared_pool;` 는 임시 조치로만, 근본은 SGA·shared_pool_size 재산정"
  - shared_pool_size·하드파싱 비율 점검
  mid:
  - 바인드 변수 미사용 SQL 개선
  long:
  - SGA 재산정
  source: GPT 수집·벤더 문서 대조 완료(https://docs.oracle.com/en/error-help/db/ora-04031/)
  note: Shared Pool뿐 아니라 Streams/Large Pool 등 가능
  vendor_cause: 요청한 작업에 필요한 shared memory가 현재 사용 가능한 양보다 많음
  vendor_action: SGA_TARGET·MEMORY_TARGET 등을 늘리거나 부족한 pool 크기를 늘리고 invalid request이면 Oracle Support 문의
  vendor_url: https://docs.oracle.com/en/error-help/db/ora-04031/
  versions:
  - Oracle 10gR2
  - Oracle 11gR1/11gR2
  - Oracle 12cR1
  - Oracle 12cR2/18c
  - Oracle 19c
  - Oracle 21c
  - Oracle 23ai/26ai
  version_note: ORA 코드 번호·의미는 10gR2~26ai 동일 — alert log 형식만 12.2 부터 ISO8601 시각(파서가 고전·ISO 두 형식 처리)
- code: ORA-01652
  severity: error
  category: storage
  title: 테이블스페이스 세그먼트 확장 실패
  immediate:
  - "TEMP 상위 세션·SQL: `select s.sid, s.username, u.sql_id, u.tablespace, u.blocks from v$tempseg_usage u join v$session s on s.saddr=u.session_addr order by u.blocks desc;` (10gR2+)"
  - "TEMP 여유: `select tablespace_name, round(tablespace_size/1024/1024) size_mb, round(free_space/1024/1024) free_mb from dba_temp_free_space;` (11g+)"
  - "메시지의 테이블스페이스가 TEMP 가 아니면 인덱스 생성·CTAS 대상 공간을 `dba_tablespace_usage_metrics` 로 확인"
  short:
  - "(2차·승인 후, 롤백: `alter tablespace <temp> drop tempfile '<path>';`) `alter tablespace <temp> add tempfile '<path>' size 4G autoextend on maxsize 16G;`"
  - "원인 SQL(sql_id) 실행계획 개선을 개발팀에 요청"
  mid:
  - "정렬 최소화 튜닝(인덱스·조인 방식)과 PGA_AGGREGATE_TARGET 적정화"
  long:
  - "TEMP 용량 계획과 TEMP 사용 상위 SQL 정기 보고"
  source: GPT 수집·벤더 문서 대조 완료(https://docs.oracle.com/en/error-help/db/ora-01652/)
  note: TEMP뿐 아니라 permanent segment도 대상
  vendor_cause: "정렬·해시·인덱스 생성 등에 필요한 임시 세그먼트를 지정 테이블스페이스에서 확장하지 못함 — TEMP 크기·자동확장 한도 도달, 대형 정렬 SQL, 동시 TEMP 사용 급증이 원인. 영구 테이블스페이스 이름이면 CTAS·인덱스 생성 공간 부족."
  vendor_action: 작업 재시도 또는 tablespace resize·파일 추가·AUTOEXTEND 활성화·MAXSIZE/스토리지 용량 증설
  vendor_url: https://docs.oracle.com/en/error-help/db/ora-01652/
  versions:
  - Oracle 10gR2
  - Oracle 11gR1/11gR2
  - Oracle 12cR1
  - Oracle 12cR2/18c
  - Oracle 19c
  - Oracle 21c
  - Oracle 23ai/26ai
  version_note: ORA 코드 번호·의미는 10gR2~26ai 동일 — alert log 형식만 12.2 부터 ISO8601 시각(파서가 고전·ISO 두 형식 처리)
- code: ORA-03113
  severity: critical
  category: connection
  title: 클라이언트-서버 통신 채널 단절
  immediate:
  - "`grep -nE \"ORA-0(0600|7445|4031)|Instance terminated\" <alert_SID.log> | tail -20` — 같은 시각 내부 오류·인스턴스 종료 기록이 있으면 서버 측 원인"
  - "`select instance_name, status, startup_time from v$instance;` — startup_time 이 오류 시각 이후면 인스턴스가 다시 올라온 것"
  - "서버 기록이 없으면 `lsnrctl status <listener>` 와 클라이언트 `tnsping <alias>` 로 네트워크 구간 확인"
  short:
  - 네트워크·방화벽 세션 타임아웃 확인
  mid:
  - 원인별 패치·설정 반영
  long:
  - 연결 복원력(재시도) 표준화
  source: GPT 수집·벤더 문서 대조 완료(https://docs.oracle.com/en/error-help/db/ora-03113/)
  note: 서버 fatal error·DB 중단·네트워크 단절 등 원인 가능
  vendor_cause: DB 계획·비계획 중단, 서버 프로세스 치명 오류 또는 네트워크 단절로 Client-Server 연결이 끊김
  vendor_action: alert log의 중단·프로세스 종료를 확인하고 네트워크와 SQL*Net 설정을 점검한 뒤 문제 해결 후 재시도
  vendor_url: https://docs.oracle.com/en/error-help/db/ora-03113/
  versions:
  - Oracle 10gR2
  - Oracle 11gR1/11gR2
  - Oracle 12cR1
  - Oracle 12cR2/18c
  - Oracle 19c
  - Oracle 21c
  - Oracle 23ai/26ai
  version_note: ORA 코드 번호·의미는 10gR2~26ai 동일 — alert log 형식만 12.2 부터 ISO8601 시각(파서가 고전·ISO 두 형식 처리)
- code: ORA-03135
  severity: error
  category: connection
  title: 연결 끊김 (connection lost contact)
  immediate:
  - "`grep -inE \"EXPIRE_TIME|RECV_TIMEOUT|SEND_TIMEOUT\" $ORACLE_HOME/network/admin/sqlnet.ora` (TNS_ADMIN 지정 시 그 경로) 로 현재 설정 확인"
  - "앱 로그의 오류 직전 유휴 시간: `grep -n -B5 \"ORA-03135\" <app_log> | tail -40` — 매번 비슷한 유휴 시간(예: 30·60분) 뒤 발생하면 방화벽 idle timeout 원인"
  - "서버 측 세션 종료 여부: `grep -nE \"ORA-0(0600|7445|0028)\" <alert_SID.log> | tail -20` — 기록이 있으면 서버 측 원인"
  short:
  - sqlnet expire_time 설정 점검
  mid:
  - 방화벽 정책 협의
  long:
