- code: MSSQL-1418
  severity: error
  category: connection
  title: 미러링 엔드포인트 접근 불가
  immediate:
  - "양쪽 엔드포인트 상태: `SELECT e.name, e.state_desc, t.port FROM sys.database_mirroring_endpoints e JOIN sys.tcp_endpoints t ON e.endpoint_id=t.endpoint_id;` — STARTED 가 아니면 원인 확정 (읽기 전용)"
  - "`Test-NetConnection <파트너서버> -Port <엔드포인트포트>` 로 포트 도달성 확인, 파트너 주소(TCP://<fqdn>:<port>) 철자 대조"
  short:
  - "(2차·승인 후) 엔드포인트 시작(`ALTER ENDPOINT <name> STATE=STARTED`)·상대 서비스 계정에 `GRANT CONNECT ON ENDPOINT::<name> TO <login>`·방화벽 허용 — 롤백: 변경 전 상태·권한 기록"
  mid:
  - "파트너 주소를 FQDN 으로 표준화하고 양쪽 서비스 계정을 도메인 계정으로 통일"
  long:
  - "sys.database_mirroring 의 mirroring_state_desc 감시(미러링은 AG 전환 검토 대상)"
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/mssqlserver-1418-database-engine-error?view=sql-server-ver17)
