- code: MSSQL-1206
  severity: error
  category: upstream
  title: MS DTC 분산거래 취소
  immediate:
  - "양쪽 서버의 MSDTC 서비스 상태 확인: `Get-Service MSDTC` — Running 이 아니면 분산 트랜잭션 불가"
  - "같은 시각 DTC 관련 이벤트: `Get-WinEvent -LogName Application -MaxEvents 300 | Where-Object ProviderName -like '*DTC*'` (읽기 전용)"
  - "`Test-NetConnection <상대서버> -Port 135` 로 RPC 엔드포인트 매퍼 도달성 확인"
  short:
  - "(2차·승인 후) 구성 요소 서비스(dcomcnfg) › 로컬 DTC 보안 설정(네트워크 DTC 액세스·인바운드/아웃바운드 허용) 양쪽 일치 확인·수정 — MSDTC 재시작 필요, 롤백: 변경 전 설정 화면 캡처"
  mid:
