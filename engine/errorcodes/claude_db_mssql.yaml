- code: MSSQL-3041
  severity: error
  category: storage
  title: BACKUP 명령 완료 실패
  immediate:
  - "ERRORLOG 에서 같은 시각 동반 오류 확인: `EXEC xp_readerrorlog 0, 1, N'BACKUP'` — 3201(장치 열기)·3013·Operating system error 번호 기록 (읽기 전용)"
  - "최근 백업 이력: `SELECT TOP 20 b.database_name, b.type, b.backup_finish_date, m.physical_device_name FROM msdb.dbo.backupset b JOIN msdb.dbo.backupmediafamily m ON b.media_set_id=m.media_set_id ORDER BY b.backup_finish_date DESC;`"
  - "백업 대상 경로 여유 공간 확인(`Get-PSDrive` 또는 공유 폴더 속성)"
  short:
  - "(2차·승인 후) 동반 오류의 원인(경로 권한·공간·네트워크 공유·손상 페이지) 해소 후 백업 재실행, 성공 후 `RESTORE VERIFYONLY FROM DISK=N'<백업파일>'` 로 백업 유효성 확인"
  mid:
  - "백업 대상 볼륨 분리·용량 85% 경보와 SQL Agent 백업 작업 실패 알림 설정"
