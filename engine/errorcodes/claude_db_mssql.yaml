- code: MSSQL-233
  severity: error
  category: connection
  title: 파이프 상대 프로세스 없음
  immediate:
  - "같은 시각 선행 로그인 오류 확인: `EXEC xp_readerrorlog 0, 1, N'Login failed';` — 18456 Reason 기록이 있으면 그것이 실제 원인(인증 실패가 233 으로 보이는 경우가 흔함) (읽기 전용, 2012~2022)"
  - "인증 모드·수신 프로토콜: `SELECT SERVERPROPERTY('IsIntegratedSecurityOnly') AS win_only;` (1 이면 SQL 로그인 불가) 와 `EXEC xp_readerrorlog 0, 1, N'Server is listening on';` · `EXEC xp_readerrorlog 0, 1, N'named pipe provider is ready';` — 클라이언트가 쓴 프로토콜 기록이 없으면 비활성"
  - "연결 수 한도: `SELECT value_in_use FROM sys.configurations WHERE name = 'user connections';` 와 `SELECT COUNT(*) FROM sys.dm_exec_sessions WHERE is_user_process = 1;` — value_in_use 가 0 이 아니고 세션 수가 거의 같으면 한도 도달"
  short:
  - "(2차·승인 후, 롤백: 변경 전 Configuration Manager 프로토콜 화면·인증 모드 기록) SQL Server Configuration Manager › SQL Server 네트워크 구성 › <instance> 프로토콜에서 TCP/IP·Named Pipes 사용 설정 또는 혼합 인증 모드로 변경 — 둘 다 서비스 재시작 필요, 업무 외 시간"
  mid:
  - 프로토콜 구성 표준화
  long:
  - 연결 오류율 감시
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/mssqlserver-233-database-engine-error?view=sql-server-ver17)
  note: 일반 전송 오류가 아니라 파이프 반대편에 프로세스가 없는 연결 오류임
  vendor_cause: SQL Server가 Shared Memory 또는 Named Pipes 프로토콜에서 수신 대기하지 않음
  vendor_action: SQL Server Configuration Manager에서 필요한 프로토콜을 활성화하고 Database Engine을 재시작
  vendor_url: https://learn.microsoft.com/en-us/troubleshoot/sql/database-engine/connect/network-related-or-instance-specific-error-occurred-while-establishing-connection
