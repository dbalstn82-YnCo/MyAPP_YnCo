- code: MSSQL-1105
  severity: error
  category: storage
  title: 파일그룹 공간 할당 실패
  immediate:
  - "가득 찬 파일 확인(해당 DB): `SELECT name, physical_name, size/128 AS size_mb, FILEPROPERTY(name,'SpaceUsed')/128 AS used_mb, max_size, growth FROM sys.database_files;` — used≈size 이고 max_size 도달이면 확정 (읽기 전용)"
  - "파일 볼륨 여유 확인: `SELECT DISTINCT volume_mount_point, available_bytes/1048576 AS free_mb FROM sys.database_files f CROSS APPLY sys.dm_os_volume_stats(DB_ID(), f.file_id);` (2008 R2 SP1+)"
  short:
  - "(2차·승인 후) `ALTER DATABASE <db> MODIFY FILE (NAME=<논리파일명>, MAXSIZE=<값>)` 또는 `ALTER DATABASE <db> ADD FILE (…) TO FILEGROUP <fg>` 로 공간 확보 — 영향: 증설 중 I/O, 롤백: 추가 파일은 비운 뒤 REMOVE FILE"
  mid:
  - "파일그룹별 사용률 85% 경보와 자동증가 단위(고정 MB) 표준화, 대용량 테이블 파일그룹 분리"
  long:
  - "월별 데이터 증가량 기반 디스크·파일그룹 용량 계획 수립"
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/mssqlserver-1105-database-engine-error?view=sql-server-ver17)
  note: 파일그룹 공간 부족으로 해당 할당 작업이 실패하며 단독으로 서비스 전체 중단을 뜻하지 않음
  vendor_cause: 파일그룹에 사용 가능한 디스크 공간이 없음
  vendor_action: 자동 증가를 켜거나 파일그룹에 파일을 추가하고, 불필요한 인덱스·테이블 삭제로 공간을 확보
  vendor_url: https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/mssqlserver-1105-database-engine-error?view=sql-server-ver17
  versions:
  - SQL Server 2005
  - SQL Server 2008/2008 R2
  - SQL Server 2012
  - SQL Server 2014
  - SQL Server 2016
  - SQL Server 2017
  - SQL Server 2019
  - SQL Server 2022
  - SQL Server 2025
  version_note: 'Msg 번호·Severity·State 체계는 2005~2025 동일 — ERRORLOG ''YYYY-MM-DD hh:mm:ss.nn spidNN Error: n, Severity: n, State: n.'' 형식 공통'
- code: MSSQL-1203
  severity: error
  category: lock
  title: 잠금 소유권 오류
  immediate:
  - "ERRORLOG 에서 1203 전후 동반 오류와 세션 확인: `EXEC xp_readerrorlog 0, 1, N'1203'` (읽기 전용)"
  - "같은 시각 대기 중인 잠금: `SELECT request_session_id, resource_type, request_mode, request_status FROM sys.dm_tran_locks WHERE request_status <> 'GRANT';` (읽기 전용)"
  short:
  - "(2차·승인 후) 업무 외 시간에 `DBCC CHECKDB(<db>) WITH NO_INFOMSGS`(대량 I/O) 실행 — 오류 없으면 연결 재설정 후 명령 재실행, 반복되면 Microsoft 지원 의뢰"
  mid:
  - "현재 빌드의 누적 업데이트(CU) 수정 목록에서 1203 관련 항목 확인 후 패치 계획 반영"
  long:
  - "잠금 오류(1203·1205) 발생 건수 감시와 정기 CHECKDB 일정 운영"
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/mssqlserver-1203-database-engine-error?view=sql-server-ver17)
  vendor_cause: 일반 정리 외 작업 중 잠금 해제하려는 페이지가 이미 잠금 해제된 상태임
  vendor_action: 해당 DB에 DBCC CHECKDB 실행; 오류가 없으면 연결을 다시 설정하고 명령 재실행. 복구되지 않으면 지원 문의
  vendor_url: https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/mssqlserver-1203-database-engine-error?view=sql-server-ver17
