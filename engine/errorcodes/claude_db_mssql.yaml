codes:
- code: MSSQL-17
  severity: critical
  category: connection
  title: SQL Server 없음/접근 거부
  immediate:
  - "서버에서 서비스 상태 확인: `Get-Service MSSQL*, SQLBrowser` (또는 `sc query MSSQLSERVER`) — Stopped 이면 인스턴스가 내려간 상태로 확정"
  - "클라이언트에서 포트 도달성 확인: `Test-NetConnection <server> -Port <port>` — TcpTestSucceeded False 면 방화벽·포트 문제 (PowerShell 4+ / Windows Server 2012 R2+)"
  - "명명된 인스턴스는 실제 TCP 포트를 ERRORLOG 에서 확인: `Select-String -Path <ERRORLOG 경로> -Pattern 'Server is listening on'` (읽기 전용)"
  short:
  - "(2차·승인 후) SQL Server Configuration Manager 에서 TCP/IP 활성화·고정 포트 지정, 방화벽 인바운드(<port>/TCP, Browser 사용 시 UDP 1434) 허용 — 서비스 재시작 필요, 롤백: 변경 전 설정 캡처 후 원복"
  mid:
  - "접속 문자열을 '<server>,<port>' 고정 포트 형식으로 표준화해 SQL Browser(UDP 1434) 의존 제거"
  long:
  - "인스턴스 TCP 포트 접속 헬스체크(1분 주기)와 서비스 중지 이벤트(Service Control Manager 7036) 감시 등록"
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/troubleshoot/sql/database-engine/connect/network-related-or-instance-specific-error-occurred-while-establishing-connection)
  vendor_cause: 'SQL Server 인스턴스를 찾지 못함: 컴퓨터명 오류, 잘못된 IP 해석 또는 TCP 포트 지정 오류'
  vendor_action: 인스턴스 실행 여부와 서버/인스턴스명·IP·TCP 포트를 확인하고 필요한 프로토콜과 방화벽 설정을 점검
  vendor_url: https://learn.microsoft.com/en-us/troubleshoot/sql/database-engine/connect/network-related-or-instance-specific-error-occurred-while-establishing-connection
  versions:
  - SQL Server 2005
  - SQL Server 2008/2008 R2
  - SQL Server 2012
  - SQL Server 2014
  - SQL Server 2016
  - SQL Server 2017
  - SQL Server 2019
  - SQL Server 2022
  - SQL Server 2025
  version_note: 'Msg 번호·Severity·State 체계는 2005~2025 동일 — ERRORLOG ''YYYY-MM-DD hh:mm:ss.nn spidNN Error: n, Severity: n, State: n.'' 형식 공통'
- code: MSSQL-53
  severity: critical
  category: connection
  title: 네트워크 경로 없음
  immediate:
  - "클라이언트에서 이름 해석 확인: `Resolve-DnsName <server>` 또는 `nslookup <server>` — 실패하거나 다른 IP 면 DNS/hosts 문제"
  - "`Test-NetConnection <server> -Port <port>` 로 TCP 도달성 확인 — False 면 방화벽에서 막혔거나 서비스가 포트를 수신하지 않는 상태 의심 (PowerShell 4+, Windows Server 2012 R2+)"
  - "서버 측 서비스 상태 확인: `Get-Service MSSQL*` — 명명된 인스턴스면 `Get-Service SQLBrowser` 도 Running 인지 확인 (읽기 전용)"
  short:
  - "(2차·승인 후) DNS 레코드·클라이언트 별칭(Configuration Manager › SQL Native Client 구성 › 별칭) 정정과 방화벽 규칙 추가 — 롤백: 변경 전 레코드·규칙 내보내기 보관"
  mid:
  - "접속 대상을 DNS 별칭 또는 AG 리스너로 일원화하고 서버 이전 시 별칭 갱신을 변경 절차에 포함"
  long:
  - "클라이언트→DB 구간 포트 도달성 감시(분 단위)와 DNS 변경 이력 관리"
  source: GPT 수집·벤더 문서 대조 완료(https://learn.microsoft.com/en-us/troubleshoot/sql/database-engine/connect/network-related-or-instance-specific-error-occurred-while-establishing-connection)
  vendor_cause: 인스턴스 중지, 서버·인스턴스명 오류, 네트워크 프로토콜 구성 오류 또는 방화벽의 필수 포트 차단
  vendor_action: 인스턴스 실행, 서버명·포트, SQL Server Browser, 활성 프로토콜과 방화벽 허용 여부를 순서대로 확인
