product: nginx
layer: web
note: GPT 협업 수집분 — 벤더 공식 문서와 대조 후 확정
codes:
- code: NGX-BIND-FAIL
  severity: critical
  category: connection
  title: 포트 바인드 실패
  immediate:
  - '`grep -n "bind()" /var/log/nginx/error.log | tail -5` 로 주소·포트·errno 확인'
  - '`ss -ltnp | grep ":<port> "` 로 포트 점유 프로세스·PID 확인(root 권한 필요 시 sudo)'
  - '`ip addr | grep <listen_ip>` 로 지정 IP 가 서버에 있는지 확인'
  short:
  - '(2차·승인 후) 점유 프로세스 담당과 협의해 정리하거나 listen 설정 수정 후 `nginx -t` 성공 시 기동(롤백: 설정 원복)'
  mid:
  - '서버별 포트 사용 대장과 중복 기동 방지(systemd 단일 관리)'
  long:
  - 'nginx 기동 실패 경보와 포트 점유 감시'
  vendor_cause: 'nginx 가 listen 주소·포트에 bind() 하지 못했다(98: Address already in use 또는 13: Permission denied). 이미 다른 프로세스(이전 nginx·다른 웹서버)가 포트를 쓰거나, 1024 미만 포트를 권한 없이 열려 했거나, 없는 IP 를 지정한 것이 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-CONFIG-INVALID
  severity: critical
  category: internal
  title: 설정 오류로 기동 실패
  immediate:
  - '`nginx -t` 로 설정 시험(읽기 전용) — 출력의 파일명:줄번호가 오류 위치'
  - '`nginx -V 2>&1 | tr " " "\n" | grep module` 로 빌드 포함 모듈 확인 — 오류 지시어의 모듈이 없으면 원인 확정'
  - '`ls -lt /etc/nginx/conf.d /etc/nginx/nginx.conf | head` 로 최근 수정 파일 확인'
  short:
  - '(2차·승인 후, 롤백: 백업한 설정 복원) 오류 줄 수정 또는 직전 정상 설정으로 복원 후 `nginx -t` 성공 확인, 기동 실패 상태면 기동·실행 중이면 reload'
  mid:
  - '설정 저장소(버전 관리)·배포 전 `nginx -t` 의무화'
  long:
  - '설정 변경 이력과 시험 결과 기록 관리'
  vendor_cause: '설정 파일에 알 수 없는 지시어·잘못된 값·괄호 불일치가 있어 nginx 가 설정을 거부했다([emerg]). 기동 시면 서비스가 뜨지 않고, reload 시면 이전 설정으로 계속 동작한다. 최근 설정 변경·빌드에 없는 모듈 지시어 사용이 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-WORKER-EXIT-SIGNAL
  severity: critical
  category: internal
  title: 워커 프로세스 비정상 종료
  immediate:
  - '`grep -n "exited on signal\|exited with fatal code" /var/log/nginx/error.log | tail -20` 로 시그널 번호·빈도 확인'
  - '`dmesg -T | grep -i -E "segfault|nginx" | tail -10` 로 커널 기록·충돌 주소 확인, `nginx -V` 로 버전·서드파티 모듈 기록'
  short:
  - '(2차·승인 후) worker_rlimit_core·working_directory 로 코어 덤프 수집을 설정해 재발 시 분석 자료 확보(롤백: 설정 원복), 최근 추가 모듈이 있으면 제외 시험'
  mid:
  - '서드파티 모듈 정리와 nginx 안정 버전(stable) 업그레이드 계획'
  long:
  - '워커 비정상 종료 건수 경보(1건이라도)'
  vendor_cause: 'nginx 워커 프로세스가 시그널(예 11 SIGSEGV·6 SIGABRT)로 비정상 종료돼 마스터가 새 워커를 띄웠다. 서드파티 모듈 결함·메모리 손상·nginx 버그가 흔한 원인이며 그 순간 처리 중이던 요청은 끊긴다.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-UPSTREAM-SENT-INVALID-HEADER
  severity: error
  category: upstream
  title: 업스트림 잘못된 헤더
  immediate:
  - '`grep -n "upstream sent invalid\|no valid HTTP" /var/log/nginx/error.log | tail -10` 로 업스트림 주소·URL 확인'
  - '`curl -sv http://<upstream_ip>:<port>/<경로> -o /dev/null 2>&1 | head -30` 로 백엔드 응답 첫 줄·헤더 직접 확인(조회 요청만)'
  short:
  - '(2차) proxy_pass 의 스킴(http/https)·포트가 백엔드 프로토콜과 맞는지 대조해 정정(승인 후, 롤백: 설정 원복), 헤더 결함은 백엔드 담당 수정'
  mid:
  - '백엔드 응답 헤더 규격 검증을 배포 시험에 포함'
  long:
  - '업스트림 502 비율 감시'
  vendor_cause: '업스트림이 HTTP 규격에 맞지 않는 응답 헤더를 보내 nginx 가 해석하지 못하고 502 를 반환했다. 백엔드가 HTTP 가 아닌 프로토콜(AJP·HTTPS 포트에 평문)로 응답하거나, 헤더에 잘못된 문자를 넣는 것이 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-UPSTREAM-BIG-BODY
  severity: warn
  category: capacity
  title: 업스트림 큰 응답 버퍼링
  immediate:
  - '`grep -c "buffered to a temporary file" /var/log/nginx/error.log` 로 빈도 확인, 같은 줄 request 로 대상 URL 확인'
  - '`df -h <proxy_temp_path>` 와 `iostat -x 5 3` 으로 임시 경로 공간·I/O 대기 확인 — 여유 충분·I/O 낮으면 조치 불필요'
  short:
  - '(2차·승인 후, 롤백: 설정 원복) 대용량 다운로드 location 에 한해 proxy_buffering off 또는 proxy_max_temp_file_size 조정'
  mid:
  - '대용량 다운로드 경로 분리와 임시 경로 전용 볼륨'
  long:
  - '임시 파일 버퍼링 건수·임시 경로 I/O 감시'
  vendor_cause: '업스트림 응답이 메모리 버퍼(proxy_buffers)보다 커서 임시 파일에 기록했다는 [warn] 이다. 대용량 응답(파일 다운로드·보고서)에서 정상적으로 나며, 잦으면 디스크 I/O 로 응답이 느려질 수 있다.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-CLIENT-BODY-TOO-LARGE
  severity: warn
  category: capacity
  title: 클라이언트 본문 크기 초과
  immediate:
  - '`grep -n "too large body" /var/log/nginx/error.log | tail -10` 로 요청 크기(bytes)·URL·client 확인'
  - '`nginx -T 2>/dev/null | grep -n "client_max_body_size"` 로 http/server/location 별 한도 확인'
  short:
  - '(2차·승인 후, 롤백: 설정 원복) 업무상 필요한 업로드 location 에 한해 client_max_body_size 상향 후 `nginx -t`·reload — 백엔드 한도도 같이 확인'
  mid:
  - '업로드 크기 기준 문서화와 업로드 경로 분리'
  long:
  - '413 응답 건수 감시'
  vendor_cause: '클라이언트 요청 본문(Content-Length)이 client_max_body_size(기본 1m)를 넘어 nginx 가 413 으로 거부했다. 업로드 한도 미조정이나 비정상 대용량 요청이 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-CLIENT-HEADER-TOO-LARGE
  severity: warn
  category: capacity
  title: 클라이언트 헤더 크기 초과
  immediate:
  - '`grep -n "too large\|too long" /var/log/nginx/error.log | tail -10` 로 대상 URL·client 확인'
  - '`nginx -T 2>/dev/null | grep -n "large_client_header_buffers\|client_header_buffer_size"` 로 현재 값 확인'
  short:
  - '(2차·승인 후, 롤백: 설정 원복) 정상 업무면 large_client_header_buffers 크기 상향 후 `nginx -t`·reload'
  mid:
  - '쿠키 크기·쿼리 길이 축소를 애플리케이션 담당과 협의'
  long:
  - '400/414/494 응답 건수 감시'
  vendor_cause: '클라이언트 요청 줄 또는 헤더가 large_client_header_buffers(기본 4 8k) 크기를 넘어 nginx 가 400·414·494 로 거부했다. 큰 쿠키·긴 쿼리 문자열·인증 토큰이 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-CLIENT-TIMEOUT
  severity: warn
  category: connection
  title: 클라이언트 시간 초과
  immediate:
  - '`grep -c "client timed out" /var/log/nginx/error.log` 로 건수 확인, "while reading client request headers/body" 문맥으로 단계 구분'
  - '`grep "client timed out" /var/log/nginx/error.log | grep -o "client: [0-9.]*" | sort | uniq -c | sort -rn | head` 로 출처 IP 편중 확인'
  short:
  - '(2차) 특정 IP 편중이면 limit_conn 또는 방화벽 차단을 승인 후 적용(롤백: 규칙 제거), 정상 저속 사용자면 값 유지'
  mid:
  - '타임아웃 값(client_header_timeout 등)을 서비스 특성별로 표준화'
  long:
  - 'client timed out 건수 기준선 감시'
  vendor_cause: '클라이언트가 client_header_timeout·client_body_timeout(기본 60초) 안에 요청을 보내지 않거나 send_timeout 안에 응답을 받지 않아 nginx 가 연결을 닫았다(110: Connection timed out). 느린 회선·모바일, slowloris 류 공격이 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-CLIENT-CLOSED
  severity: warn
  category: connection
  title: 클라이언트 연결 종료
  immediate:
  - '`awk ''$9==499'' /var/log/nginx/access.log | wc -l` 로 499 건수 확인(combined 형식 기준 9번째 칸이 상태)'
  - '499 요청 URL 상위 확인 `awk ''$9==499 {print $7}'' /var/log/nginx/access.log | sort | uniq -c | sort -rn | head` — 특정 URL 집중이면 그 백엔드 지연'
  short:
  - '(2차) 집중 URL 의 업스트림 응답 시간($upstream_response_time 기록 시)을 확인해 백엔드 담당에 지연 개선 요청'
  mid:
  - 'LB 타임아웃·proxy_read_timeout·백엔드 처리 시간 정렬'
  long:
  - '499 비율과 업스트림 응답 시간 감시'
  vendor_cause: '응답을 보내기 전에 클라이언트가 연결을 닫았다(access log 상태 499). 응답 지연으로 사용자·앞단 LB 가 기다리다 포기한 경우가 흔하며, 업스트림 처리 시간이 길어진 신호일 수 있다.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-SSL-CERT-FAIL
  severity: critical
  category: security
  title: SSL 인증서 로드 실패
  immediate:
  - '`nginx -t` 로 오류 파일 경로 확인 후 `ls -l <인증서경로>` 로 존재·권한 확인'
  - '`openssl x509 -in <인증서경로> -noout -subject -enddate` 로 PEM 해석·만료일 확인 — 해석 실패면 형식 손상'
  short:
  - '(2차·승인 후, 롤백: 이전 인증서 파일 복원) 올바른 PEM 인증서(서버+중간 순서)로 교체하고 `nginx -t` 성공 시 reload'
  mid:
  - '인증서 교체 절차(형식 변환·체인 순서·권한)를 표준화'
  long:
  - '인증서 만료 60/30/7일 전 경보'
  vendor_cause: 'ssl_certificate 로 지정한 인증서 파일을 읽거나 해석하지 못했다(cannot load certificate·PEM_read_bio). 경로 오류·권한(nginx 마스터가 읽기 불가)·PEM 형식 손상·DER 형식 사용이 흔한 원인이며 기동·reload 가 거부된다.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-SSL-KEY-MISMATCH
  severity: critical
  category: security
  title: SSL 키 불일치
  immediate:
  - '`openssl x509 -noout -modulus -in <인증서> | openssl md5` 와 `openssl rsa -noout -modulus -in <키> | openssl md5` 비교 — 다르면 확정(RSA 키 기준, 키 내용은 출력하지 않음)'
  - '`nginx -t` 로 어느 server 블록의 인증서인지 확인'
  short:
  - '(2차·승인 후, 롤백: 이전 인증서·키 복원) 같은 CSR 로 만든 키를 배포하고 `nginx -t` 성공 시 reload'
  mid:
  - '인증서·키를 한 묶음으로 관리하고 배포 전 modulus 대조 자동화'
  long:
  - '인증서 교체 작업 기록 관리'
  vendor_cause: 'ssl_certificate 의 인증서와 ssl_certificate_key 의 개인 키가 짝이 맞지 않아(key values mismatch) nginx 가 설정을 거부했다. 인증서 갱신 때 다른 CSR 의 키를 배포했거나 파일 순서를 바꿔 지정한 것이 흔한 원인.'
