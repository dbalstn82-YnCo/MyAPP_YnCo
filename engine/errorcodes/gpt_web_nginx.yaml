product: nginx
layer: web
note: GPT 협업 수집분 — 벤더 공식 문서와 대조 후 확정
codes:
- code: NGX-WORKER-CONNECTIONS
  severity: critical
  category: capacity
  title: 워커 연결 한도 초과
  immediate:
  - '`grep -c "worker_connections are not enough" /var/log/nginx/error.log` 로 건수, `nginx -T 2>/dev/null | grep -n "worker_connections\|worker_processes\|worker_rlimit_nofile"` 로 한도 확인'
  - '`ss -s` 와 `ss -tan state established | wc -l` 로 현재 연결 수 확인, stub_status 를 쓰면 `curl -s http://127.0.0.1/<status경로>` 로 Active connections 확인'
  short:
  - '(2차·승인 후, 롤백: 설정 원복) worker_connections 와 worker_rlimit_nofile(2배 이상) 상향 후 `nginx -t`·reload, 업스트림 지연이 원인이면 백엔드 우선 조치'
  mid:
  - '동시 접속량 기준으로 worker_connections·FD 한도 재산정, keepalive_timeout 단축 검토'
  long:
  - '연결 사용률(Active/한도) 80% 경보'
  vendor_cause: '워커 프로세스 하나가 처리할 수 있는 동시 연결 수(worker_connections, 업스트림 연결 포함)를 모두 써서 새 연결을 받지 못했다("worker_connections are not enough"). 접속 폭주·업스트림 지연으로 연결이 오래 유지된 것이 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-UPSTREAM-CONNECT
  severity: critical
  category: upstream
  title: 업스트림 연결 실패
  immediate:
  - '`grep -n "while connecting to upstream" /var/log/nginx/error.log | tail -20` 로 errno·upstream 주소 확인'
  - '`nc -zvw3 <upstream_ip> <port>` 로 nginx 서버에서 백엔드 포트 도달 확인 — 111 이면 백엔드 미기동, 110 이면 방화벽·과부하'
  short:
  - '(2차) 백엔드 담당에 기동·상태 복구 요청, 방화벽이면 네트워크 담당 해제 요청 — 장애 노드 제외(down)는 승인 후(롤백: 원복)'
  mid:
  - '업스트림 다중 서버·max_fails/fail_timeout·proxy_next_upstream 정책 개선'
  long:
  - '업스트림 연결 성공률·노드 상태 상시 감시'
  vendor_cause: 'nginx 가 업스트림(백엔드) 주소·포트로 TCP 연결을 맺지 못했다(connect() failed, 111 Connection refused·110 timed out·113 No route). 백엔드 프로세스 중지·포트 미개방·방화벽 차단이 흔한 원인이며 사용자에게 502/504 가 나간다.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-UPSTREAM-TIMEOUT
  severity: error
  category: upstream
  title: 업스트림 응답 시간초과
  immediate:
  - '`grep -n "upstream timed out" /var/log/nginx/error.log | tail -20` 로 "while reading response header"(처리 지연) 또는 "while connecting"(연결 지연) 문맥·URL 확인'
  - '같은 URL 의 백엔드 처리 시간(백엔드 로그·$upstream_response_time) 확인 — 특정 URL 집중이면 해당 기능 지연'
  short:
  - '(2차) 백엔드 담당에 지연 URL 전달, 타임아웃 상향은 백엔드 원인 확인 뒤 해당 location 한정으로 승인 후(롤백: 설정 원복)'
  mid:
  - '느린 백엔드 로직 개선과 LB·nginx·WAS·DB 타임아웃 계층 정렬'
  long:
  - '업스트림 응답 시간 SLO 와 504 비율 통합 감시'
  vendor_cause: '업스트림이 proxy_read_timeout(기본 60초) 안에 응답하지 않았거나 proxy_connect_timeout 안에 연결되지 않아 nginx 가 504 를 반환했다("upstream timed out (110)"). 백엔드 처리 지연(DB 잠금·외부 연동 대기)이 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-NO-LIVE-UPSTREAMS
  severity: critical
  category: upstream
  title: 가용 업스트림 없음
  immediate:
  - '`grep -n "no live upstreams" /var/log/nginx/error.log | tail -10` 로 upstream 그룹 이름 확인 후 `nginx -T 2>/dev/null | grep -n -A10 "upstream <그룹>"` 로 서버 목록 확인'
  - '목록의 각 서버에 `nc -zvw3 <ip> <port>` 로 도달 여부 확인 — 전부 실패면 백엔드 전체 장애'
  short:
  - '(2차) 백엔드 담당에 전체 장애 통보·복구 요청, 복구 뒤 fail_timeout 경과 또는 reload(승인 후)로 재투입 확인'
  mid:
  - '백엔드 노드 증설·헬스체크와 장애 복귀 정책 개선'
  long:
  - '가용 업스트림 수 경보(1대 이하)'
  vendor_cause: 'upstream 그룹의 모든 서버가 실패(max_fails)로 제외돼 보낼 서버가 없다("no live upstreams"). 백엔드 전체 장애·전 노드 과부하, 또는 짧은 fail_timeout 안의 연쇄 실패가 원인이며 해당 서비스 전체가 502 가 된다.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-UPSTREAM-CLOSED
  severity: error
  category: upstream
  title: 업스트림 조기 종료
  immediate:
  - '`grep -n "prematurely closed" /var/log/nginx/error.log | tail -20` 로 "while reading response header/upstream" 문맥·URL·upstream 확인'
  - '같은 시각 백엔드 애플리케이션 로그에서 예외·프로세스 기동 시각 변화·타임아웃 확인'
  short:
  - '(2차) 백엔드 담당에 시각·URL 전달, 백엔드 타임아웃이 nginx 보다 짧으면 값 정렬을 승인 후 적용'
  mid:
  - '백엔드 안정성 개선과 연결·응답 타임아웃 정책 정렬'
  long:
  - '조기 종료율·502·백엔드 재기동 상관 감시'
  vendor_cause: '업스트림이 응답을 다 보내기 전에 연결을 닫았다("upstream prematurely closed connection"). 백엔드 프로세스 충돌·백엔드 측 타임아웃·응답 생성 중 예외가 흔한 원인이며 502 가 나간다.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-UPSTREAM-BIG-HEADER
  severity: error
  category: capacity
  title: 업스트림 헤더 과대
  immediate:
  - '`grep -n "too big header" /var/log/nginx/error.log | tail -10` 로 URL·upstream 확인'
  - '`curl -s -D - -o /dev/null http://<upstream_ip>:<port>/<경로> | wc -c` 로 백엔드 응답 헤더 크기 확인, `nginx -T 2>/dev/null | grep -n "proxy_buffer_size"` 로 현재 값 확인'
  short:
  - '(2차·승인 후, 롤백: 설정 원복) 해당 location 의 proxy_buffer_size·proxy_buffers 를 헤더 크기 이상으로 상향 후 reload'
  mid:
  - '불필요한 응답 헤더·쿠키 축소를 애플리케이션 담당과 협의'
  long:
  - '헤더 크기 기준과 배포 회귀시험 운영'
  vendor_cause: '업스트림 응답 헤더가 proxy_buffer_size(기본 4k 또는 8k) 버퍼보다 커서 nginx 가 502 를 반환했다("upstream sent too big header"). 큰 Set-Cookie·인증 헤더가 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-SSL-HANDSHAKE
  severity: error
  category: security
  title: TLS 핸드셰이크 실패
  immediate:
  - '`grep -n "SSL_do_handshake() failed" /var/log/nginx/error.log | tail -20` 로 SSL 오류 문구(no shared cipher·unsupported protocol 등)·client IP 확인'
  - '`openssl s_client -connect <host>:443 -servername <host> </dev/null 2>/dev/null | head -20` 로 서버 체인·프로토콜 확인(조회만)'
  short:
  - '(2차) 업무 클라이언트 실패면 클라이언트 TLS 지원 범위와 ssl_protocols·ssl_ciphers 대조, 예외 허용은 보안 승인 후(롤백: 원복)'
  mid:
  - 'TLS 정책과 인증서 체인 표준화, 취약 프로토콜 제거'
  long:
  - 'TLS 실패율·인증서 만료·호환성 지속 감시'
  vendor_cause: 'TLS 핸드셰이크(SSL_do_handshake)가 실패했다. 클라이언트와 서버의 프로토콜·암호군 불일치, SNI 미전송, 인증서 체인 문제, 스캐너·비 TLS 접속이 흔한 원인이며 대부분 [info]·[crit] 수준으로 클라이언트 단위 실패다.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-ACCEPT-FAILED
  severity: critical
  category: connection
  title: 클라이언트 수락 실패
  immediate:
  - '`grep -n -E "accept4?\(\) failed" /var/log/nginx/error.log | tail -10` 로 errno 확인'
  - '`cat /proc/<워커PID>/limits | grep "open files"` 와 `ls /proc/<워커PID>/fd | wc -l` 로 FD 한도·사용량, `cat /proc/sys/fs/file-nr` 로 시스템 전체 사용량 확인'
  short:
  - '(2차·승인 후, 롤백: 설정 원복) worker_rlimit_nofile·LimitNOFILE 상향, 연결 폭주면 출처 제한 우선'
  mid:
  - 'FD·listen backlog·동시 접속 용량 재산정'
  long:
  - 'accept 실패율과 FD 사용률 사전 감시'
  vendor_cause: 'nginx 가 listen 소켓에서 새 연결을 accept() 하지 못했다. 24(Too many open files)·23(file table overflow)처럼 FD 한도 소진이 가장 흔하며, 이때 신규 접속이 거부된다.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-TOO-MANY-OPEN-FILES
  severity: critical
  category: capacity
  title: 파일 한도 초과
  immediate:
  - '`grep -c "Too many open files" /var/log/nginx/error.log` 로 건수 확인'
  - '`for p in $(pgrep -f "nginx: worker"); do ls /proc/$p/fd | wc -l; done` 와 `grep "open files" /proc/$(pgrep -f "nginx: worker" | head -1)/limits` 로 사용량·한도 비교'
  short:
  - '(2차·승인 후, 롤백: 설정 원복) worker_rlimit_nofile 과 systemd LimitNOFILE 상향, 비정상 연결 출처는 제한'
  mid:
  - 'worker_rlimit_nofile·OS 한도를 worker_connections×2 이상으로 표준화'
  long:
  - 'FD 사용률·장기 증가 추세 감시'
  vendor_cause: 'nginx 프로세스가 열 수 있는 파일 디스크립터 한도(RLIMIT_NOFILE, worker_rlimit_nofile)를 다 써 파일·소켓을 더 열지 못했다(24: Too many open files). 연결 폭주·업스트림 지연으로 연결 누적이 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
- code: NGX-NO-SPACE
  severity: critical
  category: disk
  title: 디스크 공간 고갈
  immediate:
  - '`grep -n "No space left" /var/log/nginx/error.log | tail -10` 로 실패 경로 확인 후 `df -h <경로>` 와 `df -i <경로>` 로 공간·inode 확인'
  - '`du -xsh /var/log/nginx /var/cache/nginx 2>/dev/null` 로 nginx 사용량 확인(-x 로 같은 파일시스템만)'
  short:
  - '(2차·승인 후, 롤백: 옮긴 파일 원위치) 오래된 압축 로그를 다른 볼륨으로 이동해 공간 확보, 열린 로그는 logrotate 강제 실행으로 순환'
  mid:
  - '로그·캐시 전용 볼륨과 proxy_cache max_size·logrotate 보관 기간 재산정'
  long:
  - '파일시스템 사용률 85%/95% 경보와 증가율 예측'
  vendor_cause: 'nginx 가 로그·캐시·임시 파일을 쓰다 파일시스템 공간 부족(28: No space left on device)을 만났다. 로그 순환 실패·캐시 무제한 증가·대용량 임시 파일이 흔한 원인이며, 로그 유실과 업로드·프록시 실패가 함께 난다.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: 'nginx error log 형식(''YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid msg'')·메시지 문구는 0.7 이후 동일 — 1.14~1.31 공통'
