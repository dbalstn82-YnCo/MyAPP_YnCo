- code: ERR-16038
  severity: warn
  category: internal
  title: 무결성 제약조건 위반
  vendor_cause: "integrity constraint violation(SQLSTATE 23000) — 제약조건을 위반함. 매뉴얼 예시는 DEFERRED 로 미룬 제약을 위반한 채 IMMEDIATE 로 바꾸려 할 때이며, 중복 키 입력 등 애플리케이션 데이터 오류가 흔한 원인."
  vendor_action: 제약조건을 위반하지 않도록 데이터를 고친 뒤 실행한다.
  vendor_url: https://manual.sunjesoft.co.kr/goldilocks/26c_1/manual/en/4f0d98b11f1e6ab4
  immediate:
  - "`grep -n \"16038\" <애플리케이션 로그> | tail -20` 으로 오류 뒤의 제약조건 이름(예 T1_PK(1))과 실패 SQL·입력 값 확인(DB 장애 아님)"
  - "`grep -c \"16038\" <애플리케이션 로그>` 로 건수 확인, 같은 키의 중복 요청(재시도·이중 처리) 여부를 애플리케이션 로그로 확인하고 업무 담당에 데이터 확인 요청 — 소수 건이면 업무 데이터 문제"
  short:
  - "(2차·승인 후, 롤백: 수정 전 대상 행을 백업 테이블로 복사) 데이터 오류면 업무 담당 확인 후 정정, 채번 꼬임이면 시퀀스를 기존 최대 키보다 크게 맞춤"
  mid:
  - "애플리케이션에 멱등 처리(재시도 전 존재 확인)를 반영하고 DEFERRED 제약 사용 업무의 커밋 전 검증 추가"
  long:
  - "업무별 16038 건수를 집계해 급증 시 경보, 제약 해제는 변경관리 승인 없이 금지"
  versions:
  - GOLDILOCKS 20c.1
  - GOLDILOCKS 22c.1
  - GOLDILOCKS 26c.1
  version_note: 26c.1 Appendix B(B.6 SQL Handling), 20c.1·22c.1 표에서 번호·SQLSTATE(23000) 동일 확인. 3.x 는 미대조
  source: "공식 문서 대조(2026-10-16 5차 보강)"
