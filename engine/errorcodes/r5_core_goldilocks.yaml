  vendor_cause: "failed to create system threads(SQLSTATE HY000) — 기동 중 gmaster 시스템 스레드를 만들지 못함. 원인은 다양하나 대개 OS 자원(프로세스·스레드 수, 메모리) 부족이며 서버가 기동되지 못한다."
  vendor_action: 원인을 해소한 뒤 서버를 재기동한다.
