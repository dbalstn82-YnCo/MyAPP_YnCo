  vendor_cause: "Communication link failure(SQLSTATE 08S01) — 통신 연결이 끊김. 서버 프로세스 종료·재기동, 네트워크 순단, 방화벽 유휴 세션 만료가 흔한 원인."
  vendor_action: 접속 설정을 확인하고 다시 연결한다.
