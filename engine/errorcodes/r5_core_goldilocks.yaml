  long:
  - "SQL 별 수행 시간 추이를 감시하고 QUERY_TIMEOUT 을 업무 유형별 기준으로 문서화"
  versions:
  - GOLDILOCKS 20c.1
  - GOLDILOCKS 22c.1
  - GOLDILOCKS 26c.1
  version_note: 26c.1 Appendix B·10.216 QUERY_TIMEOUT(ALTER SYSTEM IMMEDIATE·ALTER SESSION 가능), 20c.1·22c.1 표에서 번호·SQLSTATE(HYT00) 동일 확인. 3.x 는 미대조
  source: "공식 문서 대조(2026-10-16 5차 보강)"
- code: ERR-13040
