  - "애플리케이션 로그에서 시간 초과된 SQL·발생 시각을 확인하고 `grep -n \"(13039)\" $GOLDILOCKS_DATA/trc/system.trc | tail -10` 으로 집중 시간대 확인 — 여러 SQL 이 동시에 초과면 잠금 대기·자원 부족 의심"
  short:
  - "개발·DBA 에 해당 SQL 실행 계획 점검 요청, 필요 시 (2차·승인 후, 롤백: ALTER SYSTEM 으로 이전 값 복원) QUERY_TIMEOUT 을 업무 SLA 에 맞게 조정"
  mid:
