# 5차 보강(2026-10-16) — GPT 핵심 코드 대조에서 빠진 SUNJESOFT GOLDILOCKS 코드 추가.
# 근거: GOLDILOCKS 26c.1 User Manual (en) Appendix B. Error Codes (manual.sunjesoft.co.kr — 코드별 Cause·Action),
#       20c.1·22c.1 매뉴얼 오류 코드 표(번호·SQLSTATE·메시지 동일 확인)
#       뷰·프로퍼티: 26c.1 9장 Database Information(V$SESSION·V$PROPERTY·V$TABLESPACE·V$BACKUP·V$CLUSTER_MEMBER·V$CLUSTER_LOCATION·DBA_USERS),
#       10장 Server Property(PROCESS_MAX_COUNT·CLIENT_MAX_COUNT·QUERY_TIMEOUT·PLAN_CACHE_SIZE), 43장 glsnr(--status), 7장 백업·복구(ALTER DATABASE RECOVER)
# 코드 표기: 실로그 ERR-<SQLSTATE>(내부번호) → 사전 ERR-<내부번호> (파서 _gd_code)
product: goldilocks
layer: db
note: 5차 보강 — 공식 매뉴얼(26c.1 Appendix B, 20c.1·22c.1 표)과 대조해 추가
codes:
- code: ERR-13024
  severity: error
  category: capacity
  title: 최대 프로세스 수 초과
  vendor_cause: "exceeded maximum number of processes(SQLSTATE HY000) — 동시에 접속 가능한 프로세스 수를 넘음. D/A 모드·C/S dedicated 모드는 접속마다 프로세스가 생기므로 커넥션 폭주·연결 누수가 흔한 원인."
  vendor_action: PROCESS_MAX_COUNT 프로퍼티 값을 수정한다.
  vendor_url: https://manual.sunjesoft.co.kr/goldilocks/26c_1/manual/en/4f0d98b11f1e6ab4
  immediate:
  - "gsql 로 DBA 접속 후 `SELECT PROPERTY_NAME, PROPERTY_VALUE FROM V$PROPERTY WHERE PROPERTY_NAME IN ('PROCESS_MAX_COUNT', 'CLIENT_MAX_COUNT');` 로 한도 확인(읽기 전용)"
  - "`SELECT CONNECTION_TYPE, SERVER_TYPE, PROGRAM_NAME, COUNT(*) FROM V$SESSION GROUP BY CONNECTION_TYPE, SERVER_TYPE, PROGRAM_NAME ORDER BY 4 DESC;` 로 접속 형태·프로그램별 편중 확인 — 특정 프로그램 급증이면 연결 누수 의심"
  - "`grep -n \"(13024)\" $GOLDILOCKS_DATA/trc/system.trc | tail -10` 로 발생 시작 시각·빈도 확인"
  short:
  - "(2차·승인 후, 롤백: 원래 값으로 되돌린 뒤 재기동) $GOLDILOCKS_DATA/conf/goldilocks.properties.conf 의 PROCESS_MAX_COUNT 를 상향하고 정기 점검 시간에 재기동 — 운영 중 ALTER SYSTEM 으로는 바꿀 수 없음(매뉴얼 10.215, 기본 128·최대 65535)"
  - "편중된 프로그램이 있으면 애플리케이션 담당에 커넥션 풀 최대값·반납 누락 점검 요청"
  mid:
  - "접속 형태(DA·dedicated·shared)별 프로세스 수를 산정해 대량 접속 업무는 C/S shared 모드 전환 검토"
  long:
  - "V$SESSION 건수가 PROCESS_MAX_COUNT 의 80%/90% 에 이르면 경보하도록 감시 등록"
  versions:
  - GOLDILOCKS 20c.1
  - GOLDILOCKS 22c.1
  - GOLDILOCKS 26c.1
  version_note: 26c.1 Appendix B 에서 Cause·Action, 20c.1·22c.1 오류 코드 표에서 번호·SQLSTATE(HY000)·메시지 동일 확인. 3.x 는 미대조. 실로그 표기 ERR-HY000(13024)
  source: "공식 문서 대조(2026-10-16 5차 보강)"
- code: ERR-13039
  severity: warn
  category: performance
  title: 최대 질의 실행 시간 초과
  vendor_cause: "Exceeded maximum query time(SQLSTATE HYT00) — 질의 실행 시간이 QUERY_TIMEOUT 한도를 넘어 중단됨. 실행 계획 변경·통계 노후, 잠금 대기, 대량 데이터 조회가 흔한 원인."
  vendor_action: 질의를 수정하거나 QUERY_TIMEOUT 프로퍼티를 조정한다.
