- code: ERR-16309
  severity: error
  category: security
  title: 계정 잠김
  vendor_cause: "the account is locked — 접속 계정이 잠긴 상태. 관리자의 ACCOUNT LOCK 또는 로그인 실패 횟수 초과(프로파일)로 잠긴 경우가 흔하며, 애플리케이션 계정이면 해당 업무 접속이 모두 실패한다."
  vendor_action: 계정 잠금을 해제한다(ALTER USER … ACCOUNT UNLOCK).
  vendor_url: https://manual.sunjesoft.co.kr/goldilocks/26c_1/manual/en/4f0d98b11f1e6ab4
  immediate:
  - "gsql 로 DBA 접속(비밀번호는 프롬프트 입력) 후 `SELECT * FROM DBA_USERS WHERE USERNAME = '<USER>';` 로 계정 상태·잠김 시각·실패 횟수·프로파일 확인 (읽기 전용, 결과에 비밀번호 관련 칼럼이 있으면 기록·반출하지 않음)"
  - "잠김 직전 접속 시도 출처를 애플리케이션·WAS 로그에서 확인 — 비밀번호 변경 미반영 풀이나 무차별 대입 시도인지 구분해 보안 담당에 공유"
  short:
  - "(2차·승인 후, 롤백: ALTER USER <user> ACCOUNT LOCK) 원인(잘못된 비밀번호를 쓰는 접속처) 정리 후 `ALTER USER <user> ACCOUNT UNLOCK;`"
  mid:
  - "애플리케이션 계정 비밀번호 변경 시 커넥션 풀·배치 설정 동시 반영 절차를 정함"
  long:
  - "계정 잠김·로그인 실패 급증을 보안 감시 항목으로 등록하고 프로파일 잠금 기준을 정기 점검"
  versions:
  - GOLDILOCKS 20c.1
  - GOLDILOCKS 22c.1
  - GOLDILOCKS 26c.1
  version_note: 26c.1 Appendix B·DBA_USERS 칼럼 기준, 20c.1·22c.1 표에서 번호·메시지 동일 확인. 표의 SQLSTATE 는 42000 이나 매뉴얼 예시 실출력은 ERR-28000(16309) — 파서는 괄호 안 번호로 대응. 3.x 는 미대조
  verify_note: "미검증 — 이전 1차 줄의 DBA_USERS 칼럼 'PROFIL_NAME'(PROFILE_NAME 오기 의심)과 LOCK_DATE·FAILED_LOGIN_ATTEMPTS 칼럼 이름을 허용된 공식 도메인 문서로 확인하지 못해 칼럼을 단정하지 않는 SELECT * 로 바꿈"
  source: "공식 문서 대조(2026-10-16 5차 보강)"
- code: ERR-44004
