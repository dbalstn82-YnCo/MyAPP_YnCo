- code: AIX-HMC-CONNECT-FAIL
  severity: warn
  category: connection
  title: HMC 연결 실패
  vendor_cause: LPAR 과 HMC 간 RMC 연결이 끊긴 상태. DLPAR·LPM·운영체제 종료 등 HMC 기능을 쓸 수 없게 된다.
    방화벽(포트 657) 차단, IP 변경, RSCT 데몬 이상, 노드 ID 중복이 흔한 원인.
  immediate:
  - '`lssrc -s ctrmc` 로 RMC 데몬 상태, `lsrsrc IBM.MCP` 로 등록된 HMC 와 IP 확인(root)'
  - HMC 에서 `lspartition -dlpar` 로 해당 LPAR 의 Active 값 확인, `ping -c 3 <HMC IP>` 로 도달성
    확인
  short:
  - (2차·승인 후) 방화벽 TCP/UDP 657 개방 확인, IBM 'Fixing the No RMC Connection Error' 절차의
    `/usr/sbin/rsct/bin/rmcctrl -z; rmcctrl -A; rmcctrl -p` 수행 후 수 분 뒤 재확인
  mid:
  - LPAR 복제 시 RSCT 노드 ID 재생성 절차 표준화, HMC 관리 네트워크 경로 정비
  long:
  - HMC 에서 rmc_state 를 주기 점검
