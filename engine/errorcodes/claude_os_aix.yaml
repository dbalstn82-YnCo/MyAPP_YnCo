- code: AIX-NFS-HANG
  severity: error
  category: connection
  title: NFS 응답 없음
  vendor_cause: NFS 클라이언트가 서버 응답을 받지 못해 'NFS server not responding' 상태가 된 것. 하드 마운트면
    해당 경로 접근 프로세스가 멈춘다. 서버 장애·네트워크 단절·방화벽이 흔한 원인.
  immediate:
  - '`mount | grep -i nfs` 로 NFS 마운트 목록과 옵션 확인(멈춘 경로에 df·ls 금지 — 세션이 멈춤)'
  - '`ping -c 3 <server>` 와 `rpcinfo -p <server>` 로 서버·nfsd/mountd 응답 확인, `nfsstat
    -c` 의 timeout·retrans 증가 확인'
  short:
  - (2차·승인 후) 서버·네트워크 복구가 우선, 장기화 시 영향 프로세스 확인(`fuser -cu <mount>`) 후 `umount -f <mount>`
    로 강제 해제 검토
  mid:
  - 업무 성격에 따라 soft/hard·intr·timeo 옵션 재설계, NFS 서버 이중화
  long:
  - NFS 응답 시간·retrans 감시 등록
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
