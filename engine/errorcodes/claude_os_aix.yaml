product: aix
layer: os
note: GPT 협업 수집분 — 벤더 공식 문서와 대조 후 확정
codes:
- code: AIX-CORE-DUMP
  severity: error
  category: internal
  title: 프로세스 코어 덤프
  vendor_cause: 프로세스가 비정상 종료하며 core 파일을 남긴 상태(errpt LABEL CORE_DUMP, 'SOFTWARE PROGRAM
    ABNORMALLY TERMINATED'). 애플리케이션 결함(세그멘테이션 오류)·라이브러리 불일치·메모리 손상이 흔한 원인.
  immediate:
  - '`errpt -a -J CORE_DUMP | head -60` 으로 PROGRAM NAME·CORE FILE NAME·신호 번호 확인'
  - '`lscore` (AIX 5.3+) 로 코어 생성 위치·압축 설정 확인, `ls -l <코어경로>` 로 파일이 완전한지(크기) 확인'
  short:
  - (2차) `snapcore -d /var/tmp <core> <program>` 으로 코어와 라이브러리 묶음 수집, `dbx <program>
    <core>` 의 where 로 스택 확인 후 개발사 전달
  mid:
  - 개발사 패치·라이브러리 버전 정합 조치, 코어 경로를 전용 FS 로 지정(`chcore -p on -l <경로>`, 변경 관리)
  long:
  - errpt CORE_DUMP 발생 감시와 코어 FS 사용률 감시 등록
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - AIX 5.3
  - AIX 6.1
  - AIX 7.1
  - AIX 7.2
  - AIX 7.3
  version_note: 'CORE_DUMP(LABEL) / ''SOFTWARE PROGRAM ABNORMALLY TERMINATED'' 전 버전.
    errpt LABEL/IDENTIFIER 형식은 AIX 5.3~7.3 동일(errpt -a: LABEL·IDENTIFIER·Date/Time·Sequence·Machine
    Id·Node Id·Class·Type·Resource Name·Description)'
- code: AIX-DISK-OP-ERROR
  severity: critical
  category: disk
  title: 디스크 작업 오류
  vendor_cause: 디스크 장치 드라이버가 I/O 동작 실패를 기록한 상태(DISK_ERR1~4, 'DISK OPERATION ERROR').
    디스크 매체·하드웨어 불량, SCSI/SAS 버스 오류, 스토리지 컨트롤러 이상이 흔한 원인.
  immediate:
  - '`errpt -a -N hdisk<N> | head -80` 으로 LABEL·Type(PERM/TEMP)·sense data 확인 — PERM
    이면 하드웨어 결함 가능성 높음'
  - '`lspv` 와 `lsvg -p <vg>` 로 해당 PV 상태(active/missing)와 소속 VG, `lsdev -Cc disk` 로
    Available 여부 확인'
  short:
  - (2차·승인 후) 미러 구성이면 영향 LV 확인 후 `diag -d hdisk<N>` 진단(업무 영향 시간 협의), 비미러면 데이터 백업 우선
  mid:
  - 결함이 확인되면 HW 유지보수 업체에 교체 의뢰, 미러면 replacepv/unmirrorvg→교체→mirrorvg 절차로 복구
  long:
  - errpt 하드웨어(H) 클래스 오류 실시간 감시와 rootvg·데이터 VG 미러 구성 표준화
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - AIX 5.3
  - AIX 6.1
  - AIX 7.1
  - AIX 7.2
  - AIX 7.3
  version_note: DISK_ERR1~4 'DISK OPERATION ERROR' 전 버전
- code: AIX-SC-DISK-ERR
  severity: critical
  category: disk
  title: SCSI 디스크 오류
  vendor_cause: SCSI/FC 디스크 드라이버가 기록한 오류(SC_DISK_ERR1~10). 번호별로 하드웨어 오류·경로 오류·스토리지
    측 거부 등 의미가 다르며 sense data 로 원인을 구분한다. SAN fabric·스토리지 포트 문제가 흔하다.
  immediate:
  - '`errpt -a -N hdisk<N> | head -80` 으로 LABEL 번호(SC_DISK_ERRn)·PATH ID·SENSE DATA
    기록'
  - '`lspath -l hdisk<N>` 으로 경로별 Enabled/Failed, `lspv | grep hdisk<N>` 으로 소속 VG 확인'
  short:
  - (2차) sense data 와 PATH ID 를 스토리지·SAN 담당에 전달해 해당 LUN·포트 오류 대조, 경로 복구는 스토리지 측 조치
    후 `lspath` 로 확인
  mid:
  - 결함 경로·포트·HBA 를 특정해 해당 부품만 교체, 멀티패스 알고리즘·health check 속성(`lsattr -El hdisk<N>`)
    표준화
  long:
  - SC_DISK_ERR 발생 건수와 Failed 경로 감시 등록
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - AIX 5.3
  - AIX 6.1
  - AIX 7.1
  - AIX 7.2
  - AIX 7.3
  version_note: SC_DISK_ERR1~10 전 버전 (ERR2/ERR4 가 가장 흔함, IDENTIFIER DCB47997 등)
- code: AIX-LVM-IO-FAIL
  severity: critical
  category: storage
  title: LVM I/O 실패
  vendor_cause: LVM 이 물리 볼륨 I/O 실패를 기록한 상태(LVM_IO_FAIL). 하부 디스크·경로 장애로 LV 쓰기/읽기가 실패한
    것이며 미러가 없으면 데이터 접근 불가로 이어진다.
  immediate:
  - '`errpt -a -J LVM_IO_FAIL | head -60` 으로 대상 PV·LV 와 시각, 같은 시각 SC_DISK_ERR 동반 여부
    확인'
  - '`lsvg -p <vg>` 로 PV STATE(active/missing/removed), `lsvg -l <vg>` 로 LV STATE(stale
    여부) 확인'
  short:
  - '(2차·승인 후, 롤백: 변경 전 lsvg 결과 보관) 디스크·경로 복구 후 PVID 일치 확인(`lquerypv -h /dev/hdisk<N>
    80 10`), `varyonvg <vg>` 로 PV 재활성화 후 `syncvg -v <vg>`'
  mid:
  - 반복 PV 는 replacepv 로 교체, 데이터 VG 미러·MPIO 이중 경로 구성 확인
  long:
  - LVM_IO_FAIL·LVM_SA_PVMISS 감시와 lsvg stale PP 수 일일 점검
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - AIX 5.3
  - AIX 6.1
  - AIX 7.1
  - AIX 7.2
  - AIX 7.3
  version_note: LVM_IO_FAIL(E86653C3)·LVM_SA_PVMISS(F7DDA124) 전 버전
- code: AIX-LVM-STALE
  severity: error
  category: storage
  title: LV 미러 stale
  vendor_cause: 미러된 LV 의 일부 복사본(PP)이 최신이 아니어서 stale 로 표시된 상태(LVM_SA_STALEPP). 한쪽 디스크
    I/O 실패·일시 경로 단절 후 재동기화되지 않은 것이 흔한 원인.
  immediate:
  - '`lsvg -l <vg>` 에서 LV STATE 가 ''open/stale'' 인 LV 식별, `lsvg <vg>` 의 STALE PPs
    수 확인'
  - '`lsvg -p <vg>` 로 어느 PV 가 문제인지, `errpt | head -20` 에 해당 PV 오류가 있는지 확인'
  short:
  - '(2차·승인 후, 롤백: 불필요 — 읽기 동기화, 단 I/O 부하 발생) 디스크 정상 확인 후 업무 부하가 낮은 시간에 `syncvg -l
    <lv>` 또는 `syncvg -v <vg>` 실행'
  mid:
  - stale 이 반복되는 PV 는 교체 계획, 미러 쓰기 일관성(MWC) 설정 확인
  long:
  - STALE PPs 0 이 아닌 VG 를 일일 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - AIX 5.3
  - AIX 6.1
  - AIX 7.1
  - AIX 7.2
  - AIX 7.3
  version_note: LVM_SA_STALEPP(EAA3D429) 전 버전
- code: AIX-VG-QUORUM-LOST
  severity: critical
  category: storage
  title: VG 쿼럼 상실
  vendor_cause: VG 의 VGDA 과반을 가진 디스크에 접근할 수 없어 쿼럼을 잃은 상태(LVM_SA_QUORCLOSE). 쿼럼이 켜진
    VG 는 자동 varyoff 되어 모든 LV 접근이 끊긴다. 디스크·경로 다중 장애가 원인.
  immediate:
  - '`lsvg -o` 로 해당 VG 가 활성 목록에서 빠졌는지, `errpt -a -J LVM_SA_QUORCLOSE | head -40` 으로
    시각·VG 확인'
  - '`lspv` 와 `lsdev -Cc disk` 로 소속 디스크의 PVID·Available 상태, `lspath` 로 경로 상태 확인'
  short:
  - '(2차·승인 후, 롤백: 복구 전 lspv·lsvg 출력 보관) 디스크·경로를 먼저 복구한 뒤 `varyonvg <vg>`, 강제(-f)
    활성화는 데이터 정합성 위험이 있어 IBM 지원과 협의 후에만'
  mid:
  - 2-디스크 미러 VG 는 쿼럼 정책(`chvg -Q`)을 설계 기준에 맞게 재검토, 디스크를 서로 다른 경로·스토리지에 분산
  long:
  - VG 활성 상태(lsvg -o)와 PV missing 감시 등록
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - AIX 5.3
  - AIX 6.1
  - AIX 7.1
  - AIX 7.2
  - AIX 7.3
  version_note: LVM_SA_QUORCLOSE 전 버전
- code: AIX-FS-FULL
  severity: critical
  category: disk
  title: 파일시스템 가득참
  vendor_cause: JFS/JFS2 파일시스템에 남은 블록이 없어 쓰기가 실패한 상태(JFS2_FS_FULL, 'FILE SYSTEM FULL').
    로그·코어·임시 파일 누적과 열린 채 삭제된 파일이 흔한 원인.
  immediate:
  - '`errpt | grep -i full | head -20` 으로 대상 자원·시각 확인, `df -g <mount>` 로 현재 사용률 확인'
  - '`du -sm <mount>/* 2>/dev/null | sort -rn | head` 와 `fuser -cu <mount>` 로 큰 디렉터리와
    사용 프로세스 확인(정리는 2차)'
  short:
  - '(2차·승인 후, 롤백: 정리 대상 tar 보관) 소유자 확인 후 로그·코어 정리 또는 `chfs -a size=+<n>G <mount>`
    로 온라인 증설'
  mid:
  - VG 여유 PP 확보(디스크 추가·extendvg), 애플리케이션 로그 순환·보존 주기 정비
  long:
  - df -g 85%/95% 감시 임계와 증가율 기반 용량 계획
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - AIX 5.3
  - AIX 6.1
  - AIX 7.1
  - AIX 7.2
  - AIX 7.3
  version_note: JFS2_FS_FULL 은 JFS2(5.1+) 전 버전, JFS 는 'FILE SYSTEM FULL'
- code: AIX-JFS2-ERROR
  severity: critical
  category: storage
  title: JFS2 메타데이터 오류
  vendor_cause: JFS2 가 메타데이터 손상·로그 대기 등 무결성 문제를 기록한 상태(JFS2_META_CORRUPTION 등). 하부
    디스크 I/O 오류, 비정상 종료 후 로그 재생 실패가 흔한 원인이며 방치 시 파일시스템이 읽기 전용·마운트 불가로 악화된다.
  immediate:
  - '`errpt -a | grep -E ''^LABEL:'' | grep -i j2 | sort | uniq -c` 로 LABEL 종류, `errpt
    -a -J <LABEL> | head -60` 으로 대상 LV·시각 확인, 같은 시각 디스크·LVM 오류 동반 여부 확인'
  - '`lsvg -l <vg>` 와 `mount | grep <lv>` 로 해당 LV 의 마운트 상태 확인 — 응용 오류(입출력 실패) 신고와
    대조'
  short:
  - '(2차·승인 후, 롤백: 사전 백업 필수) 업무 중단 창에서 umount 후 `fsck -y /dev/<lv>`, 하부 디스크 오류가 있으면
    디스크 복구가 먼저'
  mid:
  - fsck 로 복구되지 않으면 백업에서 복원, 디스크·경로 결함 부품 교체
  long:
  - JFS2 계열 errpt 감시와 정기 백업 복원 시험
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - AIX 5.3
  - AIX 6.1
  - AIX 7.1
  - AIX 7.2
  - AIX 7.3
  version_note: JFS2_META_CORRUPTION·JFS2_LOG_WAIT 등 JFS2 전 버전
- code: AIX-PAGING-LOW
  severity: critical
  category: memory
  title: 페이징 공간 부족
  vendor_cause: 페이징 공간 사용률이 임계에 도달한 상태('PAGING SPACE LOW'). 계속 증가하면 커널이 SIGDANGER
    를 보내고 이어 프로세스를 강제로 끝낸다(PGSP_KILL). 메모리 누수·과다 할당·페이징 공간 과소가 원인.
  immediate:
  - '`lsps -a` 와 `lsps -s` 로 페이징 공간별 사용률 확인 — 70% 이상 경고, 90% 이상 위험'
  - '`svmon -G` 로 실메모리·페이징 사용 현황, `ps -eo pid,vsz,user,args | sort -k2 -rn | head`
    로 가상 메모리 상위 프로세스 확인'
  short:
  - '(2차·승인 후, 롤백: 추가한 PP 는 chps -d 로 축소 가능) `chps -s <LP수> hd6` 로 페이징 공간 즉시 확장, 누수
    프로세스는 담당자 확인 후 재시작 일정'
  mid:
  - 애플리케이션 메모리 설정(JVM -Xmx, DB 캐시) 재산정, 필요 시 LPAR 메모리 증설(DLPAR)
  long:
  - lsps 사용률 70% 감시와 svmon 메모리 추세 기록
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - AIX 5.3
  - AIX 6.1
  - AIX 7.1
  - AIX 7.2
  - AIX 7.3
  version_note: PGSP_KILL / 'PAGING SPACE LOW' 전 버전
- code: AIX-MEMORY-ERROR
  severity: error
  category: hardware
  title: 메모리 하드웨어 오류
  vendor_cause: 메모리(DIMM) 하드웨어 오류가 errpt 에 기록된 상태. 정정 가능 오류가 누적되면 펌웨어가 해당 메모리를 격리(deconfigure)할
    수 있으며 정정 불가 오류는 시스템 중단으로 이어진다.
  immediate:
  - "`errpt -d H | head -20` 으로 하드웨어 클래스 오류, `errpt -a -j <IDENTIFIER> | head -60` 으로 위치 코드(Location)·FRU 확인 — H 클래스 PERM 메모리 항목이 있으면 확정"
  - "`lsattr -El mem0` 의 size 와 goodsize 비교 — goodsize 가 작으면 메모리 일부가 펌웨어에 의해 사용 제외(deconfigure)된 상태"
  short:
  - (2차) HMC 의 Serviceable Events(`lssvcevents -t hardware`)와 대조해 FRU 위치를 확정하고 HW
    유지보수 업체에 접수
  mid:
  - 업체 일정에 맞춰 DIMM 교체(대개 시스템 정지 필요 — 변경 관리), 교체 후 lsattr -El mem0 정상 확인
  long:
  - HMC Call Home·errpt H 클래스 감시 등록
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - AIX 5.3
  - AIX 6.1
  - AIX 7.1
  - AIX 7.2
  - AIX 7.3
  version_note: SCAN_ERROR_CHRP / MEMORY 계열 하드웨어 오류 전 버전(POWER 세대별 LABEL 상이)
- code: AIX-CPU-ERROR
  severity: critical
  category: hardware
  title: CPU 하드웨어 오류
  vendor_cause: 프로세서 하드웨어 오류가 errpt 에 기록된 상태. 반복되면 CPU Guard/펌웨어가 해당 CPU 를 동적으로 격리하며,
    정정 불가 오류는 LPAR·시스템 중단으로 이어진다.
  immediate:
  - '`errpt -d H | head -20` 으로 CPU 관련 항목, `errpt -a -j <IDENTIFIER> | head -60` 으로
    Location·FRU 확인'
  - '`lsdev -Cc processor` 와 `lparstat -i | grep -i -E ''Online Virtual CPUs|Entitled''`
    로 현재 CPU 구성 확인, `lsattr -El sys0 -a cpuguard` 로 CPU Guard 설정 확인'
  short:
  - (2차) HMC Serviceable Events 와 대조해 FRU 확정 후 HW 유지보수 업체 접수, 격리로 CPU 가 줄었으면 업무 부하
    영향 평가
  mid:
