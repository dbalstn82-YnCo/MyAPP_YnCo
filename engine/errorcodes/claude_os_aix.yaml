- code: AIX-VIOS-PATH-FAIL
  severity: critical
  category: storage
  title: VIOS 가상 경로 실패
  vendor_cause: VIOS 를 통한 가상 SCSI/FC 경로가 실패한 상태. VIOS 재기동·장애, VIOS 의 물리 경로 장애가 원인이며
    이중 VIOS 구성이면 남은 경로로 I/O 가 계속된다.
  immediate:
  - 클라이언트 LPAR 에서 `lspath | grep -v Enabled` 로 Failed 경로와 부모(vscsi/fscsi) 확인, `errpt
    | head -20` 으로 시각 확인
  - VIOS(padmin)에서 `lsmap -all | head -60` 으로 매핑, `errlog | head -20` 으로 VIOS 측 오류
    확인
  short:
  - (2차) VIOS 복구 후 경로 자동 복귀 확인, 남으면 승인 후 `chpath -l hdisk<N> -p vscsi<N> -s enable`
  mid:
  - 이중 VIOS·hcheck_interval 설정 표준화, VIOS 업데이트는 한 대씩 순차 진행
  long:
  - 클라이언트 Failed 경로 수와 VIOS 상태 감시
