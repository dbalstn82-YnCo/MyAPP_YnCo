  - AIX 6.1
  - AIX 7.1
  - AIX 7.2
  - AIX 7.3
  version_note: NFS 클라이언트 문구 전 버전
- code: AIX-FD-EXHAUSTED
  severity: critical
  category: capacity
  title: 파일디스크립터 고갈
  vendor_cause: 프로세스가 열 수 있는 파일 디스크립터 한도에 도달해 'Too many open files'(EMFILE) 가 발생한
    상태. 소켓·파일 누수 또는 nofiles 한도 과소가 흔한 원인.
  immediate:
  - '`ls /proc/<PID>/fd | wc -l` 로 해당 프로세스의 열린 FD 수 확인(대상 종류 확인용 procfiles 는 2차)'
  - '`lsuser -a nofiles nofiles_hard <user>` 로 한도 확인 — 열린 수가 한도에 근접하면 확정'
  short:
  - '(2차·승인 후, 롤백: 원래 값으로 chuser) `procfiles <PID> | head -30` 으로 열린 대상 종류 확인(대상 프로세스를
    잠시 멈출 수 있음) 후 `chuser nofiles=<값> <user>` 로 한도 상향(다음 로그인·재시작부터 적용), 누수면 개발사 확인'
  mid:
  - 애플리케이션 커넥션 풀·파일 close 누락 수정, /etc/security/limits 기본값 표준화
  long:
  - 주요 프로세스 FD 사용률(한도 대비 80%) 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - AIX 5.3
  - AIX 6.1
  - AIX 7.1
  - AIX 7.2
  - AIX 7.3
  version_note: EMFILE 전 버전
- code: AIX-PROC-LIMIT
  severity: critical
  category: capacity
  title: 프로세스 한도 초과
  vendor_cause: 사용자당 프로세스 수 한도(sys0 maxuproc)에 도달해 fork 가 실패한 상태. 프로세스 폭주·좀비 누적·기본값(128
    등) 과소가 흔한 원인.
  immediate:
  - '`lsattr -El sys0 -a maxuproc` 로 한도, `ps -fu <user> | wc -l` 로 해당 사용자 프로세스 수 확인'
  - '`ps -e -o user,ppid,comm | sort | uniq -c | sort -rn | head` 로 폭주 부모 프로세스·명령
    식별, `ps -ef | grep -c defunct` 로 좀비 수 확인'
  short:
  - '(2차·승인 후, 롤백: 이전 값으로 chdev) `chdev -l sys0 -a maxuproc=<값>` 으로 즉시 상향(재부팅 불필요),
    폭주 원인 프로세스는 담당자 확인 후 정리'
  mid:
  - 애플리케이션 프로세스 생성 구조 개선, maxuproc 표준값 수립
  long:
  - 사용자별 프로세스 수 감시(한도 대비 80%)
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - AIX 5.3
  - AIX 6.1
  - AIX 7.1
  - AIX 7.2
  - AIX 7.3
  version_note: maxuproc 전 버전
- code: AIX-AUTH-FAIL
  severity: error
  category: security
  title: 인증 실패 반복
  vendor_cause: 로그인 인증 실패가 반복된 상태(3004-xxx 메시지). 비밀번호 오입력·만료, loginretries 초과 잠금,
    무차별 대입 시도가 흔한 원인.
  immediate:
  - '`who /etc/security/failedlogin | tail -20` 으로 실패 계정·터미널·시각, 인증 로그에서 출발지 확인'
  - '`lsuser -a unsuccessful_login_count account_locked loginretries <user>` 로 잠금
    여부 확인'
  short:
  - '(2차·승인 후, 롤백: 차단 해제) 외부 반복 시도면 출발지 차단, 정상 사용자면 본인 확인 후 `chsec -f /etc/security/lastlog
    -a unsuccessful_login_count=0 -s <user>`'
  mid:
  - /etc/security/user 의 loginretries·maxage 정책과 원격 접속 경로 제한 정비
  long:
