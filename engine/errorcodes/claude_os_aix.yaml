- code: AIX-NTP-FAIL
  severity: warn
  category: connection
  title: NTP 동기화 실패
  vendor_cause: xntpd/ntpd 가 시간 서버와 동기화하지 못한 상태. 서버 도달 불가(UDP 123 차단), 시간 차이가 너무 커서
    동기화 거부, 데몬 정지가 흔한 원인.
  immediate:
  - '`lssrc -ls xntpd | head -20` 으로 데몬 상태·sys peer 확인, `ntpq -p` 로 서버별 reach·offset
    확인 — reach 0 이면 통신 불가'
  - '`grep -v ''^#'' /etc/ntp.conf` 로 server 설정 확인, `date` 와 시간 서버 시각 비교'
  short:
  - '(2차·승인 후, 롤백: ntp.conf 백업 복원) 방화벽 UDP 123 확인, 시각 차가 크면 업무 영향 검토 후 `ntpdate -d
    <server>` 로 확인 후 단계 보정, `stopsrc/startsrc -s xntpd`'
  mid:
  - 시간 서버 2대 이상 지정, 부팅 시 자동 기동(/etc/rc.tcpip) 확인
  long:
  - 'ntpq offset 임계(예: 100ms) 감시'
