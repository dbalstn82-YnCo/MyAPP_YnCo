- code: '-13'
  severity: critical
  category: disk
  title: 볼륨 페이지 읽기 오류
  immediate:
  - "`grep -n -A1 -w \"CODE = -13\" $CUBRID/log/server/<db>_*.err | tail -20` 로 읽기 실패한 볼륨 이름·페이지 번호와 반복 여부 확인 — 같은 볼륨이 반복되면 해당 볼륨 디스크 결함 의심 (9.3·10.x·11.x)"
  - "`cubrid spacedb <db>` 로 오류 볼륨 번호(volid)와 실제 볼륨 경로를 대응한 뒤 `df -h <볼륨 경로>` 로 해당 파일시스템 상태 확인"
  - "`dmesg -T | grep -i -E \"I/O error|medium error|blk_update\" | tail -20` 으로 OS 디스크 오류 동반 여부 확인 — 동반되면 스토리지 장애로 확정, 없으면 DB 내부 손상 쪽으로 2차 의뢰(Linux)"
  short:
  - "(2차·업무 담당 승인 후, 롤백: 보류한 배치를 원래 일정으로 재개) 오류 볼륨을 쓰는 대량 조회·배치 일시 보류, 스토리지 담당에 경로·디스크 점검 요청"
