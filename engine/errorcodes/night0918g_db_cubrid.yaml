- code: '-10'
  severity: error
  category: storage
  title: 로그 디스크 볼륨 마운트 실패
  immediate:
  - "`grep -n \"ha_copy_log_base\" $CUBRID/conf/cubrid_ha.conf` 로 복제 로그 경로 확인 후 `ls -l <copylog_path>/` 로 파일 존재·소유자 확인"
  - "`tail -50 $CUBRID/log/<db>@<node>_copylogdb.err` 또는 `ls $CUBRID/log/*applylogdb*.err` 의 최근 파일로 오류 대상 파일명 확인"
  short:
  - "(2차·승인 후) 경로·권한을 바로잡은 뒤 `cubrid heartbeat copylogdb <stop|start> <db> <peer_node>`(applylogdb 도 같은 형식)로 해당 프로세스만 다시 올림(롤백: 변경 전 경로·권한 기록 후 원복)"
  mid:
  - 복제 로그 상태를 cubrid applyinfo로 점검한다.
  long:
  - HA 복제 로그 경로와 파일 존재 여부를 정기적으로 확인한다.
  vendor_cause: "HA 복제 로그 처리 중 'Cannot mount the disk volume' — copylogdb/applylogdb 가 복제 로그 파일을 열지 못했다는 뜻(CUBRID HA 매뉴얼). 복제 로그 경로(ha_copy_log_base) 변경·파일 누락·권한 문제가 흔한 원인."
  source: GPT 수집 2026-09-18·벤더 문서 대조 완료(https://www.cubrid.org/manual/en/latest/ha.html)
