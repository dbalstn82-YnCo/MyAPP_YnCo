- code: '-4'
  severity: error
  category: internal
  title: 작업 인터럽트됨
  immediate:
  - "`grep -nE \"CODE = -4([^0-9]|$)\" $CUBRID/log/server/<db>_*.err | tail -20` 로 발생 시각·Tran 번호·CLIENT(호스트:프로그램) 확인 — 같은 시각 다수면 일괄 취소·종료 신호 의심"
  - "`cubrid broker status -b -f` 의 CANCELED·LONG-Q 증가와 `$CUBRID/log/broker/sql_log/<broker>_<n>.sql.log` 의 같은 시각 질의 확인 — 취소/타임아웃 원인 구분"
  - "같은 시각 서버 종료 여부는 `cubrid server status` 와 `$CUBRID/log/<hostname>_master.err` 로 확인(읽기 전용)"
  short:
  - "(2차) 타임아웃 원인이면 해당 SQL 실행계획(`;plan` 또는 sql_trace_execution_plan)으로 튜닝 후 cubrid_broker.conf MAX_QUERY_TIMEOUT·애플리케이션 queryTimeout 값을 업무 SLA 와 맞춰 조정(승인 후, 롤백: 원래 값으로 복원 후 cubrid broker reset <broker>)"
  mid:
  - "장시간 질의는 LONG_QUERY_TIME(브로커) 초과 목록으로 정기 추출해 인덱스·질의 개선, 일괄 작업은 업무 시간 밖으로 분리"
  long:
  - "broker status 의 CANCELED·LONG-Q 수치와 server .err 의 -4 건수를 감시 지표로 등록(평시 대비 3배 이상 경보)"
  source: GPT 수집·벤더 문서 대조 완료(https://www.cubrid.org/manual/en/latest/admin/control.html)
  note: ER_INTERRUPTED
