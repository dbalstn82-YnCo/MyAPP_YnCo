- code: '-111'
  severity: error
  category: internal
  title: 서버 다운으로 트랜잭션 중단
  immediate:
  - "`cubrid server status` 와 `ps -ef | grep cub_server` 로 서버 기동 상태 확인, `ls -lt $CUBRID/log/server/ | head` 로 최근 .err 파일과 서버가 다시 올라온 시각 확인"
  - "`tail -100 $CUBRID/log/server/<db>_<최근>.err` 와 `dmesg -T | grep -i \"out of memory\" | tail` 로 다운 원인(크래시·OOM) 확인, core 파일 존재는 `ls -l $CUBRID/core* <db경로>/core* 2>/dev/null` 로만 확인"
  - "HA 구성이면 `cubrid heartbeat status` 로 노드 역할(master/slave) 변화와 현재 active 노드 확인"
  short:
  - "(2차·승인 후) 서버가 내려가 있으면 원인 자료(.err·core) 보존 후 `cubrid server start <db>` 로 기동(롤백: 기동 실패 시 .err 확인 뒤 제조사 지원), 중단된 거래는 애플리케이션 재처리 대상 목록으로 정리"
  mid:
  - "다운 원인별 조치 — OOM 이면 data_buffer_size·max_clients 와 OS 메모리 재산정, 크래시면 core·.err 로 제조사 패치 확인"
  long:
  - "cub_server 프로세스 생존·재기동 감시와 .err 의 fatal/-111 건수 경보 등록, HA 구성으로 단일 장애점 제거"
  source: GPT 수집·벤더 문서 대조 완료(https://github.com/CUBRID/cubrid/blob/develop/src/base/error_code.h)
