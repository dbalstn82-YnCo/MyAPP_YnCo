- code: '403.1'
  severity: warn
  category: security
  title: 실행 접근 금지
  immediate:
  - '`%windir%\system32\inetsrv\appcmd list config "<site>/<path>" -section:handlers` 로 accessPolicy 값(Read,Script,Execute) 확인'
  - '거부된 URL 확장자와 해당 폴더 처리기 매핑 대조'
  short:
  - '(2차·승인 후, 롤백: web.config 백업 복원) 필요한 폴더에 한해 accessPolicy 에 Script 또는 Execute 추가'
  mid:
  - '업로드 폴더 실행 금지 원칙을 유지한 폴더별 권한 표준'
  long:
  - 'W3C 로그 403.1 건수 감시와 처리기 접근 정책 변경 이력 관리'
  vendor_cause: 'IIS 하위 상태 403.1 — 실행 접근 금지: 처리기 매핑의 접근 정책(accessPolicy)에 Execute/Script 권한이 없어 스크립트·실행 파일 요청이 거부됐다.'
