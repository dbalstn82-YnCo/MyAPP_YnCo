product: websphere
layer: was
note: GPT 협업 수집분 — 벤더 공식 문서와 대조 후 확정
codes:
- code: WSVR0100W
  severity: warn
  category: internal
  title: 애플리케이션 초기화 오류
  immediate:
  - "`grep -n -A 20 \"WSVR0100W\" <PROFILE_ROOT>/logs/<server>/SystemOut.log | head -40` 으로 init 실패 대상과 동반 예외 확인"
  - "같은 시각 FFDC `ls -lt <PROFILE_ROOT>/logs/ffdc/ | head` 와 해당 FFDC 파일의 예외 확인 — 특정 애플리케이션이면 그 앱만 영향"
  short:
  - 동반 예외가 가리키는 구성(리소스 참조·클래스 로더·공유 라이브러리)을 점검해 담당에 전달, 지속되면 메시지 ID 로 IBM 지원 문서 검색
  mid:
  - '(2차·승인 후, 롤백: 이전 EAR 재배포) 원인 수정본 배포 후 애플리케이션 시작 확인'
  long:
  - 기동 시 WSVR0100W 출력 여부를 기동 점검 항목에 포함
  source: GPT 수집·벤더 문서 대조 완료(https://www.ibm.com/docs/en/was-nd/8.5.5?topic=deployment-application-startup-problems)
  note: 서버 전체가 아닌 애플리케이션 초기화 경고
  vendor_cause: 예기치 않은 초기화 예외이며 원인을 즉시 알 수 없음
  vendor_action: 지속되면 메시지 ID로 IBM WebSphere Application Server Support의 문제 판별 정보를 확인
  vendor_url: https://www.ibm.com/docs/en/was-nd/8.5.5?topic=deployment-application-startup-problems
  versions:
  - WAS traditional 7.0
  - WAS traditional 8.0
  - WAS traditional 8.5/8.5.5
  - WAS traditional 9.0
  version_note: WSVR 메시지 ID 는 traditional 7.0~9.0 동일 — traditional 전용(Liberty 는 CWWK* 체계)
- code: WSVR0194I
  severity: warn
  category: internal
  title: 앱 기동 실패 알림
  immediate:
  - '`grep -n -A 20 "WSVR0194" <PROFILE_ROOT>/logs/<server>/SystemOut.log | head -40` 으로 실제 접미사(I·E)·composition unit·BLA 이름과 동반 예외 확인'
  - '`<PROFILE_ROOT>/bin/wsadmin.sh -lang jython -c "print AdminControl.queryNames(''type=Application,process=<server>,*'')"` 로 실행 중 애플리케이션 목록 확인 — 목록에 없으면 시작 실패 확정'
  short:
  - '동반 예외(클래스 로딩·리소스 참조)를 배포 담당에 전달, (2차·승인 후, 롤백: 이전 버전) 수정본 배포'
  mid:
  - 배포 전 스테이징 서버 기동 검증
  long:
  - 애플리케이션 시작 상태 감시
  source: GPT 수집·공식 문서 미확인(보류)(https://www.ibm.com/docs/SS7K4U_8.5.5/com.ibm.websphere.messages.doc/WSVR.html)
  verify_note: 미검증 — IBM WAS 8.5.5 WSVR 메시지 문서에 WSVR0194I 없음(WSVR0194E 'Composition unit failed to start' 만 확인), 접미사·레벨 미확인
  vendor_cause: IBM 메시지 문서에는 WSVR0194E(BLA 의 composition unit 시작 실패)만 있고 I 접미사는 확인되지 않음 — 같은 번호라면 비즈니스 수준 애플리케이션(BLA) 구성 단위가 시작되지 못한 상태를 가리킨다.
  note: IBM WSVR 레퍼런스에서 WSVR0194E만 확인
  versions:
  - WAS traditional 7.0
  - WAS traditional 8.0
  - WAS traditional 8.5/8.5.5
  - WAS traditional 9.0
  version_note: WSVR 메시지 ID 는 traditional 7.0~9.0 동일 — traditional 전용(Liberty 는 CWWK* 체계)
- code: WSVR0606W
  severity: warn
  category: thread
  title: 행 스레드 해제
  immediate:
  - '`grep -nE "WSVR0605W|WSVR0606W" <PROFILE_ROOT>/logs/<server>/SystemOut.log | tail -20` 으로 같은 스레드의 행 보고(0605W)와 해제(0606W) 시각·지속 시간 확인 — 짝이 맞고 재발이 없으면 일시 지연'
  - 해제되지 않은 행 스레드가 남아 있으면 `<PROFILE_ROOT>/bin/wsadmin.sh -lang jython -c "AdminControl.invoke(AdminControl.completeObjectName('type=JVM,process=<server>,*'), 'dumpThreads')"` 로 javacore 확보(스레드 덤프, 프로세스는 유지)
  short:
  - 반복되는 대기 지점(DB·외부 호출·동기화)을 javacore 분석(IBM TMDA)으로 확인해 담당에 전달
  mid:
  - JDBC·외부 호출 타임아웃 설정, com.ibm.websphere.threadmonitor.threshold 를 업무 응답 기준에 맞춤
  long:
  - 행 스레드 수·WebContainer 스레드 풀 activeCount 감시
  source: GPT 수집·벤더 문서 대조 완료(https://www.ibm.com/docs/en/was/8.5.5?topic=messages-wsvr)
  note: 이전에 hung 보고된 스레드가 완료됨
  vendor_cause: 이전에 hung으로 보고된 스레드의 작업이 완료되어 더 이상 활성 상태가 아님
  vendor_action: 문제가 지속되면 메시지 ID로 IBM WebSphere Application Server Support 정보를 확인
  vendor_url: https://www.ibm.com/docs/en/was/8.5.5?topic=messages-wsvr
  versions:
