  source: GPT 수집·벤더 문서 대조 완료(https://www.ibm.com/docs/SS7K4U_8.5.5/com.ibm.websphere.messages.doc/WSVR.html)
  note: 서버 종료 예외가 아님
  vendor_cause: com.ibm.websphere.threadpool.clearThreadLocal 속성이 아직 사용 중이나 향후 제거될 deprecated 옵션임
  vendor_action: JVM 특성에서 com.ibm.websphere.threadpool.clearThreadLocal 속성을 제거
