  severity: warn
  category: internal
  title: deprecated ThreadLocal 옵션 적용
  immediate:
  - '`grep -n "WSVR0623W" <PROFILE_ROOT>/logs/<server>/SystemOut.log | tail -3` 로 경고 확인 — 서비스 영향 없는 구성 경고'
