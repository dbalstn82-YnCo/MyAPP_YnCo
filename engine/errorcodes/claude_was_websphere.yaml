  - "① 대상 묶음 찾기 — 기본 로그면 `grep -n 'CNTR0020E' <PROFILE_ROOT>/logs/<server>/SystemOut.log | grep '<HH:MM>'`(첫 칸 = 머리 줄 번호, '[시각]' 뒤 8자리 16진 = 스레드 ID), HPEL 이면(SystemOut.log 가 장애 시각까지 갱신되지 않음) `<PROFILE_ROOT>/bin/logViewer.sh -startDate \"<MM/dd/yy H:m:s:S z>\" -stopDate \"<MM/dd/yy H:m:s:S z>\" > ~/cntr0020e_hpel.txt`(스레드 ID 를 알면 -thread <ID> 로 좁힘)로 꺼낸 파일에 같은 grep — EJB 이름·메서드·예외 데이터·스레드 ID 기록"
  - "② 그 묶음의 Caused by 사슬: `awk -v s=<머리줄번호> 'NR<s {next} NR>s && /^[[:space:]]*\\[[0-9]/ {exit} {print NR, $0}' <SystemOut.log 또는 HPEL 출력 파일> | grep 'Caused by:'` — 다음 '[시각]' 줄 직전까지만 읽어 빈 줄·들여쓰기 없는 중간 예외 줄에서 끊기지 않고 다른 요청을 섞지 않는다, 마지막 줄이 맨 안쪽 원인(없으면 예외 데이터의 마지막 nested exception)"
  - "③ 그 묶음 안의 FFDC 안내: ②와 같은 awk 로 뽑은 묶음 전체에서 `awk -v s=<머리줄번호> 'NR<s {next} NR>s && /^[[:space:]]*\\[[0-9]/ {exit} {print NR, $0}' <로그> | grep 'FFDC'` — FFDC 인시던트 안내는 시각 줄과 다른 줄에 있을 수 있어 같은 시각 한 줄만 보지 않는다(같은 시각·같은 스레드 ID 로 따로 찍힌 FFDC 줄도 함께 본다). 가리키는 인시던트 파일을 `ls -lt <PROFILE_ROOT>/logs/ffdc/ | head -20` 과 맞추되 확장자를 *.txt 로만 가정하지 않는다 — 최근 20개만 본 것은 부분 확인, 없으면 장애 시각 범위 파일까지 넓힌다. 맨 안쪽 원인 유형(DB·클래스 로딩·보안·자원·애플리케이션)으로 담당을 가르고, 스택에 어느 패키지가 보이는지만으로 앱/WAS 결함을 단정하지 않는다"
  short:
  - '(2차) 맨 안쪽 원인 유형별 이관 — DB(SQLException·DSRA)는 DBA·데이터소스, 자원(J2CA 풀)은 풀 설정, 보안(SECJ)은 보안 설정, 클래스 로딩은 배포·클래스 로더 순서, 업무 예외는 개발 담당. 유형이 불명확하면 메시지 ID·예외로 IBM 지원 문서 검색'
  mid:
