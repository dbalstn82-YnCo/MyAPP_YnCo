- code: WEBTOB-HTH-DOWN
  severity: critical
  category: internal
  title: HTH 프로세스 다운
  immediate:
  - '`ps -ef | grep -E "[w]sm|[h]tl|[h]th"` 로 HTH 생존 수 확인 — 0 이면 서비스 중단'
  - '`ls -lt $WEBTOBDIR/log | head` 로 최근 로그를 찾아 `tail -200` 으로 종료 직전 오류 확인, `dmesg -T | tail -20` 로 OOM·충돌 기록 확인'
  - '`ls -lt $WEBTOBDIR/bin/core* $WEBTOBDIR/core* 2>/dev/null | head` 로 코어 파일 생성 여부 확인'
  short:
  - '(2차·승인 후, 롤백: 없음 — 기동 확인으로 대체) 코어·로그 보존 후 `wsdown` → `wsboot` 로 재기동하고 `wsadmin` `st -p` 로 정상 상태 확인'
  mid:
  - '코어 분석 결과에 따른 WebtoB 패치(Fix) 적용'
  long:
  - 'HTH 프로세스 수 감시(기대값 미만 즉시 경보)'
  vendor_cause: '이 사전 별칭상 HTH(HTTP 처리) 프로세스가 종료됐다. HTH 가 모두 내려가면 정적·동적 요청을 처리하지 못하며, 프로세스 충돌·OS 자원 부족(메모리·FD)·강제 종료가 흔한 원인.'
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - WebtoB 4.1
  - WebtoB 5.x
