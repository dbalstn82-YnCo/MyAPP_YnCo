- code: HPUX-SEM-FAIL
  severity: error
  category: memory
  title: 세마포어 할당 실패
  vendor_cause: 세마포어 생성이 실패한 상태(semget ENOSPC 등). 세마포어 집합 수(semmni)·총 세마포어 수(semmns)
    한도 도달, 비정상 종료 후 남은 세마포어가 흔한 원인.
  immediate:
  - '`ipcs -sa | head -40` 으로 세마포어 집합 수·소유자 확인'
  - '`kctune semmni semmns semmsl`(11i v2+) 또는 `kmtune -q semmni`(11i v1) 로 한도 확인'
  short:
  - '(2차·승인 후, 롤백: 이전 값으로 kctune) 잔여 세마포어는 소유 프로세스 부재 확인 후 `ipcrm -s <id>`, 한도 부족이면
    `kctune semmni=<값>`'
