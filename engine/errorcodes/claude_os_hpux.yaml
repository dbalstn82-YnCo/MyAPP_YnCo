- code: HPUX-VPAR-FAIL
  severity: critical
  category: internal
  title: vPar 오류
  vendor_cause: vPars 가상 파티션의 기동·자원 할당·모니터 동작이 실패한 상태. CPU·메모리·I/O 자원 할당 충돌, vPar
    데이터베이스 불일치, 펌웨어·vPars 버전 불일치가 흔한 원인.
  immediate:
  - '`vparstatus` 로 각 vPar 상태(Up/Down)와 `vparstatus -v -p <vpar>` 로 할당 자원 확인'
  - '`grep -i vpar /var/adm/syslog/syslog.log | tail -30` 으로 오류 문구·시각 확인'
  short:
  - '(2차·승인 후, 롤백: vPar 구성 변경 전 vparstatus -v 출력 보관) 자원 충돌이면 `vparmodify` 로 재할당, 기동은
    `vparboot -p <vpar>`'
  mid:
  - vPars·펌웨어 버전 정합성 확인과 패치 적용
  long:
  - vPar 상태 감시와 구성 변경 이력 관리
