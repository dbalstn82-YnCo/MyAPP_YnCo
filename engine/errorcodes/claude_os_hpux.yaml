- code: HPUX-SWAP-FULL
  severity: critical
  category: memory
  title: 스왑 고갈
  vendor_cause: 장치 스왑과 pseudo-swap(swapmem_on) 을 포함한 스왑 예약 공간이 고갈된 상태. 메모리 과다 사용·누수,
    스왑 장치 과소가 흔한 원인이며 새 프로세스·메모리 할당이 실패한다.
  immediate:
  - '`swapinfo -tam` 의 total 행 PCT USED 확인 — 90% 이상 위험, `kctune swapmem_on` 으로 pseudo-swap
    사용 여부 확인'
  - '`UNIX95= ps -eo pid,vsz,user,comm | sort -k2 -rn | head -10` 으로 가상 메모리 상위 프로세스
    확인(정리는 2차)'
  short:
  - '(2차·승인 후, 롤백: /etc/fstab 에 넣지 않으면 재부팅 시 원래 구성으로 복귀) `lvcreate -L <MB> -n swap2
    vg00` 후 `swapon /dev/vg00/swap2` 로 장치 스왑 추가, 누수 프로세스 재기동 일정'
  mid:
  - 물리 메모리 대비 장치 스왑 크기 재산정, 애플리케이션 메모리 설정 조정
  long:
  - swapinfo 사용률 70%/90% 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
