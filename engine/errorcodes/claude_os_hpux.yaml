product: hpux
layer: os
note: GPT 협업 수집분 — 벤더 공식 문서와 대조 후 확정
codes:
- code: HPUX-PANIC
  severity: critical
  category: internal
  title: 시스템 패닉
  vendor_cause: 커널이 복구 불가능한 오류로 시스템을 정지한 상태(panic). 드라이버·커널 결함, 하드웨어(메모리·CPU·I/O)
    오류, 자원 고갈이 흔한 원인이며 크래시 덤프 분석으로 확정한다.
  immediate:
  - 시스템 복귀 후 `cat /etc/shutdownlog | tail -10` 으로 panic 문자열·시각, `ls -l /var/adm/crash`
    로 crash.N 저장 여부 확인
  - '`cat /var/adm/crash/crash.<N>/INDEX` 로 panic 문구·덤프 정보, `grep -i -E ''panic|HPMC|MCA''
    /var/adm/syslog/OLDsyslog.log | tail -20` 으로 직전 오류 확인'
  short:
  - (2차) crash 디렉터리와 OLDsyslog.log 를 HPE 지원에 전달해 분석 의뢰(전송 전 크기·승인), HPMC/MCA 면 하드웨어
    점검 병행
  mid:
  - 분석 결과의 패치(swinstall)·펌웨어 업데이트를 변경 관리로 적용
  long:
  - 패치 수준 표준화와 덤프 설정(crashconf) 정기 점검
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - HP-UX 11i v1 (11.11)
  - HP-UX 11i v2 (11.23)
  - HP-UX 11i v3 (11.31)
  version_note: syslog.log 문구 기반 — 11i v1~v3 공통(형식 동일)
- code: HPUX-DISK-ERROR
  severity: critical
  category: disk
  title: 디스크 오류
  vendor_cause: 디스크 장치 드라이버가 I/O 오류를 syslog 에 기록한 상태. 디스크 매체·하드웨어 불량, SCSI/FC 경로 오류,
    스토리지 컨트롤러 이상이 흔한 원인.
  immediate:
  - '`grep -i -E ''disk|scsi|lbolt'' /var/adm/syslog/syslog.log | tail -30` 으로 오류
    장치(하드웨어 경로·dev 번호)와 시각 확인'
  - 11i v3 는 `ioscan -P health -C disk` 로 장치 health(online/offline/limited), v1/v2
    는 `ioscan -kfnC disk` 로 CLAIMED 여부 확인
  short:
  - (2차) `diskinfo /dev/rdsk/<장치>`(v1/v2) 또는 `scsimgr get_info -D /dev/rdisk/disk<N>`(11i
    v3) 로 상세 확인 후 미러 여부 판단, 비미러면 백업 우선
  mid:
  - 결함 확인 시 HPE 지원에 교체 의뢰, MirrorDisk/UX 미러면 pvchange/vgcfgrestore 절차로 교체 후 vgsync
  long:
  - EMS 디스크 모니터·syslog I/O 오류 감시와 vg00 미러 표준화
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - HP-UX 11i v1 (11.11)
  - HP-UX 11i v2 (11.23)
  - HP-UX 11i v3 (11.31)
  version_note: syslog.log 문구 기반 — 11i v1~v3 공통(형식 동일)
- code: HPUX-LVM-PV-MISSING
  severity: critical
  category: storage
  title: PV 누락
  vendor_cause: LVM 이 VG 에 속한 PV 에 접근하지 못해 누락(unavailable)으로 판단한 상태. 디스크 장애, 모든 경로
    단절, 장치 파일 변경이 흔한 원인이며 미러가 없으면 해당 LV 접근이 불가하다.
  immediate:
  - '`vgdisplay -v <vg> | grep -i -E ''PV Name|PV Status|Cur PV|Act PV''` 로 Cur PV
    와 Act PV 차이와 unavailable PV 확인'
  - '`ioscan -kfnC disk`(v1/v2) 또는 `ioscan -kfnNC disk`(11i v3) 로 해당 장치 CLAIMED 여부,
    syslog 에서 같은 시각 경로 오류 확인'
  short:
  - '(2차·승인 후, 롤백: 실행 전 vgdisplay -v 출력 보관) 디스크·경로 복구 후 `vgchange -a y <vg>` 로 PV
    재연결, 미러 LV 는 `vgsync <vg>` 로 재동기화'
  mid:
  - 교체가 필요하면 `vgcfgrestore -n <vg> <장치>` 로 LVM 구성 복원 후 vgsync, 경로 이중화 점검
  long:
  - Cur PV/Act PV 불일치와 stale extent 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - HP-UX 11i v1 (11.11)
  - HP-UX 11i v2 (11.23)
  - HP-UX 11i v3 (11.31)
  version_note: syslog.log 문구 기반 — 11i v1~v3 공통(형식 동일)
- code: HPUX-LVM-STALE
  severity: error
  category: storage
  title: LV 미러 stale
  vendor_cause: MirrorDisk/UX 미러 LV 의 일부 extent 가 최신이 아니어서 stale 로 표시된 상태. 한쪽 디스크
    I/O 실패·일시 경로 단절 후 재동기화되지 않은 것이 흔한 원인.
  immediate:
  - '`lvdisplay -v /dev/<vg>/<lv> | grep -c stale` 로 stale extent 수, `lvdisplay -v
    /dev/<vg>/<lv> | head -40` 으로 미러 사본 수 확인'
  - '`vgdisplay -v <vg> | grep -i -E ''PV Name|PV Status''` 로 문제 PV, syslog 에서 같은
    PV 오류 확인'
  short:
  - '(2차·승인 후, 롤백: 불필요 — 동기화 I/O 부하 발생) 디스크 정상 확인 후 부하가 낮은 시간에 `lvsync /dev/<vg>/<lv>`
    또는 `vgsync <vg>`'
  mid:
  - stale 이 반복되는 PV 는 교체 계획, 미러 사본을 서로 다른 경로·컨트롤러에 배치
  long:
  - stale extent 0 유지 일일 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - HP-UX 11i v1 (11.11)
  - HP-UX 11i v2 (11.23)
  - HP-UX 11i v3 (11.31)
  version_note: syslog.log 문구 기반 — 11i v1~v3 공통(형식 동일)
- code: HPUX-VXVM-FAIL
  severity: critical
  category: storage
  title: VxVM 장애
  vendor_cause: VERITAS Volume Manager 가 디스크·플렉스·볼륨 장애를 보고한 상태(디스크 failed/detached,
    플렉스 DISABLED 등). 디스크 장애·경로 단절이 흔한 원인.
  immediate:
  - '`vxdisk -o alldgs list` 로 failed/error 디스크, `vxprint -ht | grep -i -E ''DISABLED|DETACHED|NODEVICE|IOFAIL''`
    로 영향 볼륨·플렉스 확인'
  - '`vxdg list` 로 디스크 그룹 상태, syslog 의 vxvm·vxio 메시지로 시각 확인'
  short:
  - '(2차·승인 후, 롤백: `vxprint -ht` 출력·구성 백업 보관) 디스크·경로 복구 후 `vxreattach` 와 `vxrecover
    -b -g <dg>` 로 플렉스 복구'
  mid:
  - 디스크 교체가 필요하면 vxdiskadm 의 'Replace a failed or removed disk' 절차로 교체 후 재동기화
  long:
  - vxprint 상태(ENABLED/ACTIVE 외) 감시와 핫 스페어 구성
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - HP-UX 11i v1 (11.11)
  - HP-UX 11i v2 (11.23)
  - HP-UX 11i v3 (11.31)
  version_note: VxVM 3.5(v1)~5.x(v3)
- code: HPUX-FS-INODE-FULL
  severity: error
  category: capacity
  title: inode 고갈
  vendor_cause: 파일시스템 inode 가 소진되어 공간이 남아도 새 파일을 만들 수 없는 상태. HFS 는 생성 시 inode 수가 고정되고,
    VxFS 는 동적 할당이지만 블록이 부족하면 inode 도 늘지 못한다. 작은 파일 대량 생성이 흔한 원인.
  immediate:
  - '`bdf -i <mount>` 로 iused/ifree/%iuse 확인 — %iuse 95% 이상이면 확정, `fstyp /dev/<vg>/<lv>`
    로 HFS/VxFS 구분'
  - '`find <mount> -xdev -type d -size +200 | head` 로 파일이 많이 쌓인 디렉터리 후보 식별(정리는 2차)'
  short:
  - '(2차·승인 후, 롤백: 정리 대상 tar 보관) 애플리케이션 담당과 합의해 오래된 세션·임시·큐 파일 정리'
  mid:
  - HFS 는 inode 밀도를 높여 재생성 또는 VxFS 로 이전, VxFS 는 블록 증설(lvextend + fsadm -b)
  long:
  - bdf -i %iuse 85%/95% 감시와 소파일 보존 주기 표준화
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - HP-UX 11i v1 (11.11)
  - HP-UX 11i v2 (11.23)
  - HP-UX 11i v3 (11.31)
  version_note: syslog.log 문구 기반 — 11i v1~v3 공통(형식 동일)
- code: HPUX-MEMORY-LOW
  severity: critical
  category: memory
  title: 메모리 부족
  vendor_cause: 가용 물리 메모리가 부족해 페이징(page out)이 증가한 상태. 애플리케이션 메모리 과다, 파일 캐시(11i v1/v2
    dbc_max_pct, 11i v3 filecache_max) 과대 설정, 메모리 누수가 흔한 원인.
  immediate:
  - '`vmstat 2 5` 의 free·po(페이지 아웃) 확인 — po 가 계속 0 보다 크면 메모리 압박, `swapinfo -tam` 으로
    스왑 사용률 확인'
  - '`UNIX95= ps -eo pid,vsz,sz,user,comm | sort -k2 -rn | head -10` 으로 메모리 상위 프로세스
    확인'
  short:
  - '(2차·승인 후, 롤백: 이전 값으로 kctune) 파일 캐시 과대면 `kctune filecache_max`(11i v3)·`kctune
    dbc_max_pct`(11i v2) 조정 검토, 누수 프로세스는 재기동 일정 수립'
  mid:
  - 애플리케이션 메모리 설정(JVM 힙·DB 캐시) 재산정, 필요 시 메모리 증설
  long:
  - vmstat po·swapinfo 사용률 추세 감시(sar -r·glance 기록)
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - HP-UX 11i v1 (11.11)
  - HP-UX 11i v2 (11.23)
  - HP-UX 11i v3 (11.31)
  version_note: syslog.log 문구 기반 — 11i v1~v3 공통(형식 동일)
- code: HPUX-NPROC-LIMIT
  severity: critical
  category: capacity
  title: 프로세스 한도 초과
  vendor_cause: '시스템 전체 프로세스 수(nproc) 또는 사용자당 한도(maxuprc)에 도달해 fork 가 실패한 상태(''proc:
    table is full''). 프로세스 폭주·좀비 누적·기본값 과소가 흔한 원인.'
  immediate:
  - '`sar -v 2 3` 의 proc-sz(현재/한도)와 ov 값 확인, `kctune nproc maxuprc`(11i v2+) 또는 `kmtune
    -q nproc`(11i v1) 로 한도 확인'
  - '`ps -ef | wc -l` 과 `UNIX95= ps -e -o user= | sort | uniq -c | sort -rn | head`
    로 사용자별 프로세스 수 확인'
  short:
  - '(2차·승인 후, 롤백: 이전 값으로 kctune) 폭주 원인 프로세스를 담당자 확인 후 정리, `kctune nproc=<값>` 상향(동적
    여부 확인)'
  mid:
  - 애플리케이션 프로세스 생성 구조 개선, nproc·maxuprc 표준값 수립
  long:
  - sar -v proc-sz(한도 대비 80%) 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - HP-UX 11i v1 (11.11)
  - HP-UX 11i v2 (11.23)
  - HP-UX 11i v3 (11.31)
  version_note: syslog.log 문구 기반 — 11i v1~v3 공통(형식 동일)
- code: HPUX-NFILE-LIMIT
  severity: critical
  category: capacity
  title: 파일 테이블 고갈
  vendor_cause: '시스템 파일 테이블(nfile) 또는 프로세스당 열린 파일 한도(maxfiles/maxfiles_lim)에 도달한 상태(''file:
    table is full''). 소켓·파일 누수, 한도 과소가 흔한 원인.'
  immediate:
  - '`sar -v 2 3` 의 file-sz(현재/한도)와 ov 확인, `kctune nfile maxfiles maxfiles_lim`(11i
    v2+) 로 한도 확인'
  - lsof 가 설치되어 있으면 `lsof -p <PID> | wc -l` 로 의심 프로세스의 열린 파일 수 확인(없으면 GlancePlus 의
    Open Files 화면)
  short:
  - '(2차·승인 후, 롤백: 이전 값으로 kctune) 누수 프로세스를 담당자 확인 후 재기동, `kctune nfile=<값>`·`kctune
    maxfiles=<값>` 상향(동적 여부 확인)'
  mid:
  - 애플리케이션 커넥션 풀·close 누락 수정, 커널 파라미터 표준값 수립
  long:
  - sar -v file-sz 감시(한도 대비 80%)
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - HP-UX 11i v1 (11.11)
  - HP-UX 11i v2 (11.23)
  - HP-UX 11i v3 (11.31)
  version_note: syslog.log 문구 기반 — 11i v1~v3 공통(형식 동일)
- code: HPUX-LAN-DOWN
  severity: error
  category: connection
  title: LAN 링크 다운
  vendor_cause: LAN 인터페이스의 물리 링크가 끊긴 상태. 케이블·스위치 포트 장애, 속도/듀플렉스 불일치, NIC 불량이 흔한 원인.
  immediate:
  - '`lanscan` 으로 인터페이스 Hardware State·NamePPA 확인, `netstat -in` 으로 Ierrs/Oerrs 확인'
  - 11i v3 는 `nwmgr` 로 인터페이스별 상태 목록, v1/v2 는 `lanadmin -x <PPA>` 로 속도·듀플렉스 확인
  short:
  - (2차) 네트워크 담당과 스위치 포트 상태·로그 대조, 케이블 교체 후 링크 Up 확인
  mid:
  - 반복 시 NIC 교체, 단일 링크 구성은 APA(Auto Port Aggregation) 이중화
  long:
  - 링크 상태와 인터페이스 오류 카운터 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - HP-UX 11i v1 (11.11)
  - HP-UX 11i v2 (11.23)
  - HP-UX 11i v3 (11.31)
  version_note: syslog.log 문구 기반 — 11i v1~v3 공통(형식 동일)
  verify_note: 미검증 — 11i v3 nwmgr 단독 실행 출력 형식(링크 상태 열)을 HPE 매뉴얼로 확인하지 못함
- code: HPUX-APA-FAILOVER
  severity: warn
  category: connection
  title: APA 링크 전환
  vendor_cause: APA(Auto Port Aggregation) 장애 조치 그룹에서 활성 링크가 끊겨 대기 링크로 전환된 상태. 통신은
    유지되지만 이중화가 깨진 상태이며 주 링크 케이블·스위치 문제가 원인.
  immediate:
  - "`lanscan -q` 로 집합(aggregate)과 구성원 포트 확인, `lanscan` 으로 구성원 Hardware State 확인 — 구성원 중 DOWN 이 있으면 이중화 상실"
  - "`grep -i apa /var/adm/syslog/syslog.log | tail -20` 으로 failover 발생 시각, `lanadmin -x -v <집합PPA>`(11i v1/v2) 또는 `nwmgr -S apa -I <집합PPA> -v`(11i v3) 로 집합 상태·활성 포트 확인"
  verify_note: "미검증 — APA 집합 상태 조회 옵션(lanadmin -x -v <PPA>, nwmgr -S apa -I <PPA> -v)은 HPE 커뮤니티 사례로만 확인, HP Auto Port Aggregation Administrator's Guide 원문 미대조(기존 lanadmin -x -i 는 근거를 찾지 못해 교체)"
  short:
  - (2차) 끊긴 구성원 포트 케이블·스위치 복구 후 링크 Up 과 그룹 복귀 확인
  mid:
  - 구성원 포트를 서로 다른 스위치에 연결, 장애 조치 모드·감시(poll) 설정 표준화
  long:
