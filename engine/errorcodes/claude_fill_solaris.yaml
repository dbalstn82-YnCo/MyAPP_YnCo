product: solaris
layer: os
note: GPT 협업 수집분 — 벤더 공식 문서와 대조 후 확정
codes:
- code: SOL-INODE-FULL
  severity: error
  category: capacity
  title: inode 고갈
  vendor_cause: UFS 파일시스템의 inode 가 소진되어 공간이 남아도 새 파일을 만들 수 없는 상태('out of inodes').
    UFS 는 newfs 때 inode 수가 고정되어 작은 파일 대량 생성 시 흔하다. ZFS 는 inode 를 동적으로 할당하므로 해당하지 않는다.
  immediate:
  - '`df -F ufs -o i <mount>` 로 iused/ifree/%iused 확인 — 95% 이상이면 확정'
  - '`find <mount> -mount -type d -size +200 | head` 로 파일이 많이 쌓인 디렉터리 후보 식별(정리는 2차)'
  short:
  - '(2차·승인 후, 롤백: 정리 대상 tar 보관) 애플리케이션 담당과 합의해 오래된 세션·임시·큐 파일 정리'
  mid:
  - inode 밀도를 높인 newfs(-i 값 축소)로 재생성하거나 ZFS 데이터셋으로 이전
  long:
  - df -o i %iused 85%/95% 감시와 소파일 보존 주기 표준화
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: /var/adm/messages '[ID nnnnn facility.level]' 형식 8~11.4 공통
- code: SOL-NIC-ERROR
  severity: error
  category: connection
  title: NIC 오류
  vendor_cause: 네트워크 인터페이스 드라이버가 수신/송신 오류(CRC·overflow·collision 등)를 보고한 상태. 케이블·스위치
    포트 불량, 속도/듀플렉스 불일치, NIC 하드웨어 불량이 흔한 원인.
  immediate:
  - '`netstat -in` 으로 인터페이스별 Ierrs/Oerrs/Collis 확인, 1분 간격 두 번 실행해 증가 여부 판단'
  - '`dladm show-phys`(11) 또는 `dladm show-dev`(10) 로 링크 상태·속도·듀플렉스, `kstat -p <드라이버>:<인스턴스>::*err*`
    로 오류 카운터 확인'
  short:
  - (2차) 네트워크 담당과 스위치 포트 오류·속도 설정 대조, 케이블·포트 교체 후 오류 증가 멈춤 확인
  mid:
  - 반복 시 NIC 교체, 드라이버 패치(SRU/패치 클러스터) 적용
  long:
  - 인터페이스 오류 카운터 증가율 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: /var/adm/messages '[ID nnnnn facility.level]' 형식 8~11.4 공통
- code: SOL-SVM-METADEVICE-FAIL
  severity: critical
  category: storage
  title: SVM 메타디바이스 실패
  vendor_cause: Solaris Volume Manager 메타디바이스(미러 서브미러·RAID5 구성 요소)가 Maintenance/Needs
    maintenance 상태가 된 것. 하부 디스크 I/O 오류가 흔한 원인이며 상태 DB 복제본(metadb) 손상도 포함된다.
  immediate:
  - '`metastat | grep -i -E ''maint|needs|last erred''` 로 문제 메타디바이스, `metastat -p`
    로 구성 확인'
  - '`metadb -i` 로 상태 DB 복제본 상태(대문자 플래그=오류) 확인, `iostat -En <디스크>` 로 하부 디스크 오류 확인'
  short:
  - '(2차·승인 후, 롤백: metastat -p 출력 보관) 디스크 정상 확인 후 `metareplace -e <mirror> <slice>`
    로 재동기화, 디스크 교체 시 metadb 복제본도 재생성'
  mid:
  - 결함 디스크 교체 후 미러 재동기화, metadb 복제본을 서로 다른 디스크·컨트롤러에 3개 이상 배치
  long:
  - metastat Okay 외 상태 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: '8: Solstice DiskSuite / 9+: SVM — ''md:'' 문구 공통. 11 은 ZFS 로 대체(SVM
    유지)'
- code: SOL-CRON-FAIL
  severity: warn
  category: internal
  title: 크론 작업 실패
  vendor_cause: cron 이 예약 작업을 실행하지 못했거나 작업이 0 이 아닌 코드로 끝난 상태. cron.allow/deny 권한,
    최소 환경(PATH) 차이, 스크립트 오류, cron 서비스 정지가 흔한 원인.
  immediate:
  - '`tail -50 /var/cron/log` 에서 해당 작업의 시작(>)·종료(<) 줄과 rc= 값 확인 — rc 가 0 이 아니면 스크립트
    오류'
  - '`svcs -l svc:/system/cron:default`(10+) 로 서비스 상태, `crontab -l <user>`(root) 와
    /etc/cron.d/cron.allow·cron.deny 로 권한 확인'
  short:
  - (2차) 같은 사용자·최소 환경으로 스크립트를 시험 실행해 오류 재현, 스크립트에 PATH 명시
  mid:
  - 배치 스크립트에 로그 파일·종료 코드 기록 표준화, 실패 시 알림 추가
  long:
  - 중요 배치의 실행 여부·rc 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: /var/adm/messages '[ID nnnnn facility.level]' 형식 8~11.4 공통
- code: SOL-SENDMAIL-QUEUE
  severity: warn
  category: capacity
  title: 메일 큐 적체
  vendor_cause: sendmail 큐에 전송하지 못한 메일이 쌓인 상태. 릴레이(스마트 호스트) 도달 불가, DNS 해석 실패, 수신 서버
    거부, 시스템 알림 메일 폭주가 흔한 원인.
  immediate:
  - '`mailq | tail -30` 으로 큐 건수·대표 오류 문구(Deferred 사유) 확인, `du -sk /var/spool/mqueue`
    로 큐 용량 확인'
  - '`svcs -l svc:/network/smtp:sendmail`(10+) 로 서비스 상태, `grep -i DS /etc/mail/sendmail.cf`
    로 스마트 호스트 확인'
  short:
  - '(2차·승인 후, 롤백: 큐 파일 백업) 릴레이·DNS 원인 해결 후 `sendmail -q -v` 로 큐 재처리, 폭주 원인(알림 스크립트)은
    담당자와 조정'
  mid:
  - 시스템 알림 메일 수신자·빈도 정리, 스마트 호스트 이중화
  long:
  - mqueue 건수 임계 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: /var/adm/messages '[ID nnnnn facility.level]' 형식 8~11.4 공통
- code: SOL-AUDIT-FULL
  severity: error
  category: disk
  title: 감사 로그 공간 부족
  vendor_cause: 감사(audit) 로그 저장 디렉터리의 공간이 minfree 기준 이하로 떨어진 상태(audit_warn soft/hard).
    감사 파일 순환·보관 미흡이 흔한 원인이며 hard 한도에 도달하면 정책에 따라 감사 레코드가 버려지거나 시스템이 멈출 수 있다.
  immediate:
  - '`df -h /var/audit` 로 저장 공간 확인, `ls -lt /var/audit | head` 로 감사 파일 크기·개수 확인'
  - 11 은 `auditconfig -getplugin audit_binfile` 로 p_dir·p_minfree, 10 은 `grep -E 'dir|minfree'
    /etc/security/audit_control` 로 설정 확인
  short:
  - '(2차·승인 후, 롤백: 보관 전 체크섬 기록) `audit -n` 으로 새 파일로 전환한 뒤 닫힌 감사 파일을 보관 서버로 이동, 보안
    담당 승인 없이 삭제 금지'
  mid:
  - 감사 파일 정기 이관(cron)·보관 정책 수립, 감사 디렉터리를 전용 FS 로 분리
  long:
  - 감사 디렉터리 사용률과 audit_warn 메일 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: BSM(8~10) / audit(11) 문구
- code: SOL-RESOURCE-CONTROL
  severity: warn
  category: capacity
  title: 자원 제어 한도 도달
  vendor_cause: 프로세스·태스크·프로젝트·zone 에 설정된 자원 제어(rctl) 한도에 도달한 상태. project.max-shm-memory·process.max-file-descriptor·zone.max-processes
    등의 한도 과소나 자원 과다 사용이 원인.
  immediate:
  - '`grep -i rctl /var/adm/messages | tail -20` 으로 어떤 rctl·프로세스·프로젝트가 한도에 닿았는지 확인'
  - '`prctl -n <rctl이름> -i process <PID>` 또는 `prctl -n <rctl이름> -i project <project>`
    로 현재 한도·사용량, `id -p <user>` 로 소속 프로젝트 확인'
  short:
  - '(2차·승인 후, 롤백: 원래 값으로 prctl/projmod) 즉시 완화는 `prctl -n <rctl> -r -v <값> -i project
    <project>`, 영구 반영은 `projmod -s -K ''<rctl>=(priv,<값>,deny)'' <project>`'
  mid:
  - 애플리케이션별 project 를 만들어 요구 자원 기준으로 rctl 표준화
  long:
  - rctl 경고 메시지 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: rctl 은 Solaris 9 도입
- code: SOL-USB-ERROR
  severity: warn
  category: hardware
  title: USB 장치 오류
  vendor_cause: USB 컨트롤러 또는 연결 장치(키보드·저장장치 등)에서 오류가 보고된 상태. 장치 분리·불량, 케이블·허브 문제가 흔한
    원인이며 서버 업무 영향은 대개 작다.
  immediate:
  - '`grep -i usb /var/adm/messages | tail -20` 으로 오류 장치·시각 확인'
  - '`cfgadm -al | grep -i usb` 로 포트별 연결 상태 확인 — 승인되지 않은 저장장치 연결이면 보안 담당 통보'
  short:
  - (2차) 불필요 장치 분리, 필요한 장치는 다른 포트로 재연결해 오류 재현 여부 확인
  mid:
  - 반복 시 장치 교체, 서버 USB 저장장치 사용 정책 수립
  long:
  - USB 연결 이벤트 감시(보안 정책 연계)
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: /var/adm/messages '[ID nnnnn facility.level]' 형식 8~11.4 공통
- code: SOL-FIBRE-OFFLINE
  severity: critical
  category: storage
  title: FC 링크 오프라인
  vendor_cause: FC HBA 포트 또는 원격 포트가 오프라인이 된 상태. 케이블·SFP 불량, SAN 스위치 포트·zoning 변경,
    스토리지 포트 장애가 흔한 원인이며 MPxIO 대체 경로가 없으면 I/O 가 멈춘다.
  immediate:
  - '`fcinfo hba-port` 로 포트별 State(online/offline)·Current Speed 확인(10+), `luxadm
    -e port` 로 CONNECTED 여부 확인'
  - '`fcinfo remote-port -p <HBA포트WWN>` 으로 보이는 스토리지 포트, `grep -i -E ''fp|fctl|qlc|emlxs''
    /var/adm/messages | tail -20` 으로 시각 확인'
  short:
  - (2차) SAN 담당과 스위치 포트·zoning 변경 이력 대조, 케이블·SFP 교체 후 fcinfo 로 online 복귀 확인
  mid:
  - 반복 시 HBA 교체, 모든 LUN 이 서로 다른 fabric 2개 이상 경로를 갖도록 MPxIO 구성
  long:
  - HBA 포트 상태와 mpathadm 경로 수 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: /var/adm/messages '[ID nnnnn facility.level]' 형식 8~11.4 공통
- code: SOL-DNS-FAIL
  severity: error
  category: connection
  title: DNS 해석 실패
  vendor_cause: '이름 해석이 DNS 서버 응답을 받지 못했거나 이름 없음 응답을 받은 상태. DNS 서버 장애·방화벽, resolv.conf
    오류, name-service 스위치 설정(hosts: files dns) 누락이 흔한 원인.'
  immediate:
  - '`cat /etc/resolv.conf` 와 `grep hosts /etc/nsswitch.conf` 로 nameserver·해석 순서 확인(11
    은 `svccfg -s network/dns/client listprop config` 로 원본 설정 확인)'
  - '`nslookup <host> <nameserver>` 와 `getent hosts <host>` 로 서버별·시스템 경로 해석 결과 비교'
  short:
  - '(2차·승인 후, 롤백: 설정 백업 복원) 장애 서버를 뒤로 돌리거나 핵심 호스트를 /etc/hosts 에 임시 등록(11 은 svccfg
    로 변경 후 refresh)'
  mid:
  - DNS 서버 2대 이상 지정, 핵심 호스트 hosts 관리 기준 수립
  long:
  - 주요 이름 해석 시간·실패 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: /var/adm/messages '[ID nnnnn facility.level]' 형식 8~11.4 공통
- code: SOL-LDAP-FAIL
  severity: error
  category: security
  title: LDAP 인증 서버 연결 실패
  vendor_cause: LDAP 네이밍 클라이언트(ldap_cachemgr)가 디렉터리 서버에 연결하지 못한 상태. 서버 장애·방화벽(389/636),
    인증서 만료, 프록시 계정 비밀번호 변경이 흔한 원인이며 LDAP 사용자 로그인이 실패한다.
  immediate:
  - '`svcs -l svc:/network/ldap/client:default` 로 서비스 상태, `ldapclient list | grep
    -v -i passwd` 로 서버 목록·인증 방식 확인(비밀번호 줄 제외)'
  - '`ldaplist -l passwd <user>` 로 조회 성공 여부, `grep -i ldap /var/adm/messages | tail
    -20` 으로 오류 문구 확인'
  short:
  - '(2차·승인 후, 롤백: 변경 전 ldapclient list 보관) 서버·방화벽·인증서 원인 해결 후 `svcadm restart ldap/client`,
    프록시 비밀번호 변경이면 ldapclient mod 로 갱신'
  mid:
  - LDAP 서버 2대 이상 지정, 인증서 만료일 관리, 비상용 로컬 관리자 계정 유지
  long:
  - LDAP 조회 응답 시간·실패 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: /var/adm/messages '[ID nnnnn facility.level]' 형식 8~11.4 공통
- code: SOL-SSH-FAIL
  severity: error
  category: security
  title: SSH 인증 실패 반복
  vendor_cause: sshd 인증 실패가 반복된 상태. 비밀번호 오입력·만료·잠금, 키 파일 권한 오류, 외부 무차별 대입이 흔한 원인.
  immediate:
  - '`grep auth /etc/syslog.conf` 로 인증 로그 위치를 찾은 뒤 `grep sshd <로그> | grep -i -E ''fail|invalid''
    | tail -30` 으로 계정·출발지 IP 확인'
  - '`passwd -s <user>` 로 계정 상태(LK=잠금), `last | head -20` 으로 최근 성공 로그인 확인'
  short:
  - '(2차·승인 후, 롤백: 차단 규칙 제거) 외부 반복 시도면 IP Filter/방화벽으로 출발지 차단, 정상 사용자면 본인 확인 후 `passwd
    -u <user>` 로 잠금 해제'
  mid:
  - sshd_config 의 PermitRootLogin no·MaxAuthTries 정비, /etc/default/login 의 RETRIES·/etc/security/policy.conf
    의 LOCK_AFTER_RETRIES 설정
  long:
  - 계정·IP 별 인증 실패 임계 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
