- code: SOL-SUDO-FAIL
  severity: warn
  category: security
  title: sudo 실패
  vendor_cause: sudo 실행이 거부되었거나 비밀번호 인증에 실패한 상태. sudoers 에 없는 명령, 비밀번호 오입력, sudoers
    문법 오류가 흔한 원인.
  immediate:
  - sudo 로그 위치(sudoers 의 logfile 또는 syslog auth)에서 `grep sudo <로그> | tail -30` 으로
    사용자·명령·거부 문구 확인
  - '`sudo -l -U <user>` (root 로) 로 허용 명령 확인, RBAC 로 대체 운영 중이면 `profiles -l <user>`
    도 확인'
  short:
  - '(2차·승인 후, 롤백: sudoers 백업 복원) 정당한 업무면 `visudo` 로 최소 권한 규칙 추가, 아니면 보안 담당에 오남용 보고'
  mid:
  - sudo 와 RBAC 중 권한 위임 방식을 하나로 표준화하고 변경 이력 관리
  long:
  - sudo 거부 건수 감시와 분기별 권한 재검토
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: /var/adm/messages '[ID nnnnn facility.level]' 형식 8~11.4 공통
- code: SOL-RBAC-DENY
  severity: warn
  category: security
  title: RBAC 권한 거부
  vendor_cause: RBAC(역할 기반 접근 제어)에서 사용자에게 필요한 권한 프로파일·인가(authorization)·역할이 없어 명령이
    거부된 상태. 프로파일 미할당, pfexec 미사용, 역할 전환(su) 누락이 흔한 원인.
  immediate:
  - '`profiles -l <user>` 로 할당 프로파일과 허용 명령, `auths <user>` 로 인가, `roles <user>` 로
    역할 확인'
  - '`grep <user> /etc/user_attr` 로 로컬 할당 내용 확인 — 거부된 명령이 프로파일에 없으면 확정'
  short:
  - '(2차·승인 후, 롤백: usermod 이전 값 기록) 업무 필요성이 승인되면 `usermod -P ''<프로파일>'' <user>` 또는
    역할 부여, 명령은 pfexec 로 실행하도록 안내'
  mid:
  - 업무별 권한 프로파일 정의·최소 권한 원칙 정비
  long:
  - RBAC 거부 이벤트(감사 로그) 감시와 분기별 권한 재검토
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: RBAC 8+
- code: SOL-DISK-FULL
  severity: critical
  category: disk
  title: 디스크 가득참
  vendor_cause: UFS 파일시스템의 블록이 소진되어 쓰기가 실패하는 상태('file system full'). 로그·코어·크래시 덤프
    누적, 삭제했지만 프로세스가 열고 있는 파일이 흔한 원인(ZFS 는 SOL-ZFS-NO-SPACE 참조).
  immediate:
  - '`df -h` 로 사용률 95% 이상 파일시스템 식별, `du -dsk <mount>/* 2>/dev/null | sort -n | tail
    -15` 로 큰 디렉터리 확인'
  - '`find <mount> -mount -type f -size +2097152 -exec ls -l {} \; | head` 로 1GB 이상
    파일과 소유자 식별(삭제는 2차)'
  short:
  - '(2차·승인 후, 롤백: 정리 대상 tar 보관) 담당자 확인 후 로그·코어 정리, 열린 파일은 `fuser -c <mount>` 로 소유
    프로세스 확인 후 재시작 일정과 함께 비우기'
  mid:
  - SVM 이면 metattach 로 볼륨 확장 후 `growfs -M <mount> /dev/md/rdsk/<d>` 로 온라인 확장, 로그 순환(logadm)
    정비
  long:
  - df 사용률 85%/95% 감시 임계와 증가율 기반 증설 계획
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: /var/adm/messages '[ID nnnnn facility.level]' 형식 8~11.4 공통
- code: SOL-TMP-FULL
  severity: error
  category: disk
  title: /tmp 가득참
  vendor_cause: /tmp(tmpfs, 스왑 공간 기반)가 가득 차 임시 파일을 만들 수 없는 상태. /tmp 사용량은 곧 가상 메모리(스왑)
    사용이므로 대용량 임시 파일이 시스템 전체 메모리 부족으로 번질 수 있다.
  immediate:
  - '`df -h /tmp` 와 `swap -s` 로 /tmp 사용량과 가용 스왑 확인'
  - '`du -dsk /tmp/* 2>/dev/null | sort -n | tail -15` 로 큰 항목과 소유자 확인, `fuser -c /tmp`
    로 사용 프로세스 확인(정리는 2차)'
  short:
  - '(2차·승인 후, 롤백: 정리 전 필요한 파일은 디스크 FS 로 복사) 소유자 확인 후 불필요 임시 파일 정리, 열린 파일은 서비스 재시작
    일정과 함께'
  mid:
  - /etc/vfstab 의 tmpfs 에 size= 옵션으로 상한 설정(다음 부팅부터), 대용량 임시 파일은 /var/tmp 등 디스크 FS
    로 유도
  long:
  - /tmp 사용률과 swap -s 가용량 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: /var/adm/messages '[ID nnnnn facility.level]' 형식 8~11.4 공통
- code: SOL-PROCESS-KILLED
  severity: error
  category: internal
  title: 프로세스 강제 종료
  vendor_cause: 프로세스가 신호로 비정상 종료된 상태. 운영자·스크립트의 kill, SMF 재시작기(restarter)의 정지, 스왑
    부족에 따른 메모리 할당 실패, 애플리케이션 자체 abort 가 흔한 원인.
  immediate:
  - '`grep -i -E ''signal|core|exited'' /var/adm/messages | tail -20` 와 `swap -s`
    로 같은 시각 자원 부족 여부 확인'
  - SMF 관리 서비스면 `svcs -xv <FMRI>` 와 해당 /var/svc/log 로그 확인, `last | head -20` 으로 그
    시각 운영자 접속 대조
  short:
  - (2차·승인 후) 재발 시 `dtrace -n 'proc:::signal-send { @[execname, args[2], stringof(args[1]->pr_fname)]
    = count(); }'` 로 신호 송신자 추적(부하 작음, 종료 시 Ctrl-C)
  mid:
  - 운영자 작업 절차·스크립트 정비 또는 메모리·스왑 증설
  long:
  - 핵심 프로세스 생존 감시(SMF 또는 감시 도구)
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: /var/adm/messages '[ID nnnnn facility.level]' 형식 8~11.4 공통
