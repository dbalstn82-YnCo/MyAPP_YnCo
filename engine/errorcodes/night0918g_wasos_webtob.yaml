- code: HTH0499
  severity: error
  category: upstream
  title: 비요청 JSV 응답 수신
  immediate:
  - '`grep -n "HTH0499" <오류로그> | tail -20` 로 발생 시각·JSV 이름 확인 후 같은 시각 JEUS 로그에서 해당 요청이 시간 초과 뒤 늦게 응답했는지 대조 (`ls -lt $WEBTOBDIR/log | head` 로 최근 오류 로그 찾기)'
  - '`$WEBTOBDIR/bin/wsadmin` 접속 후 `si` 로 해당 JSV 서버가 다시 RDY 로 연결됐는지 확인 — 연결 수가 원래대로면 일시 현상, 줄어든 채면 JEUS 쪽 확인'
  short:
  - '(2차) 반복되면 JEUS 측 비정상 응답 조건을 WAS 담당·기술지원과 조사'
  mid:
  - '동일 메시지 반복 시 JEUS 비정상 응답 발생 조건 분석'
  long:
  - 'WebtoB·JEUS 패치 수준 관리와 연동 오류 감시'
  vendor_cause: 'HTH0499 — WebtoB 가 보낸 요청에 대응하지 않는 JSV 응답을 받아 폐기하고 그 연결을 종료했다. JEUS 쪽 응답 순서 오류·시간 초과 뒤 늦게 도착한 응답이 흔한 원인.'
  source: GPT 수집 2026-09-18·벤더 문서 대조 완료(https://docs.tmaxsoft.com/en/webtob/5_fix4/release-note/chapter-5-fix3.html)
