- code: HTH0529
  severity: error
  category: upstream
  title: JEUS 큐 대기시간 초과
  immediate:
  - '`$WEBTOBDIR/bin/wsadmin` 접속 후 `st -s` 로 JSV 큐 대기 수, `si` 로 JSV 서버 상태(RDY·연결 수) 확인 (`si` 는 내부 서버(JSV) 상태 — `ci` 는 WebtoB 5 에서 클라이언트 정보라 JEUS 연결 확인에 쓰지 않는다)'
  - '같은 시각 JEUS 스레드 풀·DB 대기 상태를 WAS 담당에 확인 요청'
  short:
  - '(2차) JEUS 지연 해소가 우선, 큐 대기 시간·프로세스 수 조정은 원인 확인 뒤 승인 후(롤백: http.m 백업 복원)'
  mid:
  - '반복 발생 시 WebtoB·JEUS 요청 큐와 처리량을 함께 재산정'
  long:
  - 'JEUS 연동 구간 지연·대기 요청 지속 감시'
  vendor_cause: 'HTH0529 — JEUS(JSV)로 전달하려던 요청이 큐에서 대기하는 동안 시간 제한을 넘었다(queuing 상태 timeout). JEUS 처리 프로세스가 모두 바빠 요청이 큐에 머문 것이 원인이며 사용자에게 시간 초과 오류가 나간다.'
  source: GPT 수집 2026-09-18·벤더 문서 대조 완료(https://docs.tmaxsoft.com/en/webtob/5_fix4/release-note/chapter-5-fix3.html)
  versions:
