  mid:
  - "NIO 채널·스레드 인터럽트 사용 규칙을 개발 표준에 명시"
  long:
  - "ClosedChannelException 건수 감시와 코드 리뷰 점검 항목 운영"
  vendor_cause: "이미 닫혔거나 해당 작업 방향이 닫힌 채널에 입출력을 시도했다는 뜻(Java SE API). 연결 종료 후 재사용, 인터럽트로 채널이 닫힌 뒤 접근이 흔한 원인."
