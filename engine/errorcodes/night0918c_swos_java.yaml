- code: ORG.SPRINGFRAMEWORK.BEANS.FACTORY.BEANCREATIONEXCEPTION
  severity: error
  category: internal
  title: 빈 생성 중 오류
  immediate:
  - "① 장애 시각의 기동 실패 묶음 찾기: `awk '/^[[:space:]]*[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9][ T][0-9][0-9]:[0-9][0-9]/ {h=NR; hl=$0} /Error creating bean with name/ && h {print h, substr(hl,1,200)}' <app_log> | uniq | grep '<HH:MM>' | tail -20` — 첫 칸 = 머리 줄 번호, '[ … ]' 안 = 스레드, 기동을 여러 번 했으면 장애 시각·스레드가 맞는 줄 하나를 고른다 · 지원 로그 형식: 각 항목이 `YYYY-MM-DD HH:MM`(또는 ISO `YYYY-MM-DDTHH:MM`) 머리로 시작한다고 가정한 추출 — 다른 패턴이면 추출을 믿지 말고 `grep -n 'Error creating bean' <app_log>` 로 찾은 줄 앞뒤를 `sed -n '<시작줄>,<끝줄>p' <app_log>` 로 원문 그대로 읽는다"
  - "② 그 묶음 안에서 실패 빈과 맨 안쪽 원인: `awk -v s=<머리줄번호> 'NR<s {next} NR>s && /^[[:space:]]*[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9][ T][0-9][0-9]:[0-9][0-9]/ {exit} {print NR, $0}' <app_log> | grep -E 'Error creating bean with name|Caused by:'` — 다음 '날짜 시각' 줄 직전까지만 읽어 빈 줄·들여쓰기 없는 중간 예외 줄에서 끊기지 않는다, 빈 이름과 마지막 Caused by 가 한 짝(따로 grep 한 줄끼리 짝짓지 않는다) — 마지막 Caused by 는 보통의 사슬에서 맨 안쪽 원인이지만 Suppressed:·함께 찍힌 다른 원인이 있을 수 있어 유일한 근본 원인이라 보장되지는 않는다"
  - "맨 안쪽 원인이 연결 실패(Connection refused·timed out·UnknownHost)일 때만 선택적 능동 확인으로 `nc -zvw3 <host> <port>`, 설정값 누락·의존 빈 없음·클래스 없음이면 직전 설정·배포 변경 이력 확인 (Too many open files 면 절차의 FD 확인 단계)"
  short:
  - "(2차·승인 후) 근본 원인(설정·의존성·연결) 정정 후 애플리케이션 기동(롤백: 직전 배포본·설정으로 원복)"
  mid:
  - "기동 시험(컨텍스트 로딩 시험)을 배포 파이프라인에 넣고 환경별 설정값 누락 검사 추가"
  long:
  - "환경 설정 구성관리와 기동 실패 감시(기동 후 헬스체크) 운영"
  vendor_cause: "Spring 컨테이너가 빈을 생성·초기화하다 실패했다는 뜻. 대개 기동 시 발생하며 실제 원인은 중첩된 cause(설정값 누락, 의존 빈 없음, DB 연결 실패 등)에 있다."
  verify_note: "미검증 — Spring Framework 공식 문서(docs.spring.io)는 허용 도메인 목록 밖이라 우리가 직접 대조하지 못함 — BeanCreationException 클래스 정의(빈 생성 실패 예외, 중첩 cause 보유)는 2차 교차 검토자가 Spring Framework 5.3 API 문서로 대조했다고 전함, 메시지 문구('Error creating bean with name')와 다른 판(6.x) 문서는 직접 대조 못 함"
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/beans/factory/BeanCreationException.html)
  versions:
