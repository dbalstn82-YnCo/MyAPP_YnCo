codes:
- code: JAVA.LANG.ARRAYINDEXOUTOFBOUNDSEXCEPTION
  severity: error
  category: internal
  title: 배열 인덱스 범위 초과(소스 결함)
  immediate:
  - "`grep -n -A15 \"ArrayIndexOutOfBoundsException\" <app_log> | head -60` 으로 'Index N out of bounds for length M' 값과 최초 애플리케이션 프레임(클래스:줄) 확인"
  - "`grep -c \"ArrayIndexOutOfBoundsException\" <app_log>` 로 발생 빈도와 특정 요청·입력에만 나는지 확인 — 입력 전문은 개인정보 가린 뒤 보존"
  short:
  - "(2차) 해당 프레임에 경계 검사·입력 길이 검증을 추가하는 수정안을 개발 담당에 이관, 배포는 승인 후"
  mid:
  - "입력 전문·배열 처리 공통 유틸에 길이 검증을 넣고 경계값 단위 시험 보강"
  long:
  - "정적 분석 규칙(배열 경계)과 예외 건수 감시를 배포 품질 지표로 운영"
  vendor_cause: "배열에 음수이거나 배열 크기 이상인 인덱스로 접근했다는 뜻(Java SE API). 입력 전문 길이·구분자 개수가 예상과 다르거나 경계 검사가 없는 소스 결함이 흔한 원인."
  vendor_url: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/ArrayIndexOutOfBoundsException.html"
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/ArrayIndexOutOfBoundsException.html)
  versions:
  - JDK 6
  - JDK 7
  - JDK 8
  - JDK 11
  - JDK 17
  - JDK 21
  - JDK 25
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: '-'
- code: JAVA.LANG.CLASSCASTEXCEPTION
  severity: error
  category: internal
  title: 형 변환 실패(소스 결함)
  immediate:
  - "`grep -n -A15 \"ClassCastException\" <app_log> | head -60` 으로 'class A cannot be cast to class B' 의 두 클래스명·클래스로더 정보와 최초 애플리케이션 프레임 확인"
  - "두 클래스명이 같고 로더만 다르면 jar 중복 의심 — `find <배포경로> -xdev -name \"*.jar\" | xargs -I{} sh -c 'unzip -l {} | grep -q <클래스경로> && echo {}'` 로 중복 jar 확인"
  short:
  - "(2차) 중복 jar 정리(배포본 기준) 또는 형변환 코드 수정안을 개발/WAS 담당에 이관, 반영은 승인 후 배포"
  mid:
  - "제네릭 타입 적용과 instanceof 검사로 형변환 지점을 정리하고 공유 라이브러리와 애플리케이션 jar 의 중복을 제거"
  long:
  - "빌드 시 jar 중복 검사와 ClassCastException 건수 감시를 운영"
  vendor_cause: "객체를 실제 인스턴스가 아닌 하위 클래스로 형변환하려 했다는 뜻(Java SE API). 서로 다른 클래스로더가 같은 이름의 클래스를 로드한 경우(배포 jar 중복)나 제네릭 미사용 컬렉션의 잘못된 원소가 흔한 원인."
  vendor_url: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/ClassCastException.html"
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/ClassCastException.html)
  versions:
  - JDK 6
  - JDK 7
  - JDK 8
  - JDK 11
  - JDK 17
  - JDK 21
  - JDK 25
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: '-'
- code: JAVA.LANG.ILLEGALARGUMENTEXCEPTION
  severity: error
  category: internal
  title: 부적절한 메서드 인자
  immediate:
  - "`grep -n -A15 \"IllegalArgumentException\" <app_log> | head -60` 으로 예외 메시지(어떤 인자가 왜 거부됐는지)와 최초 애플리케이션 프레임 확인"
  - "같은 시각 설정 변경·배포 이력과 대조해 설정값 원인인지 입력값 원인인지 구분"
  short:
  - "(2차) 입력값 원인이면 검증 로직 보강, 설정값 원인이면 설정 정정안을 작성해 승인 후 반영(롤백: 변경 전 설정 사본 보관)"
  mid:
  - "API 인자 규격(허용 범위·형식)을 명세에 명시하고 호출부 입력 검증을 공통화"
  long:
  - "예외 메시지별 건수 감시와 설정 변경 사전 검증(형식 검사)을 운영"
  vendor_cause: "메서드에 허용되지 않거나 부적절한 인자가 전달됐다는 뜻(Java SE API). 입력 검증 누락, 설정값 형식 오류, 라이브러리 사용 방법 오류가 흔한 원인."
  vendor_url: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/IllegalArgumentException.html"
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/IllegalArgumentException.html)
  versions:
  - JDK 6
  - JDK 7
  - JDK 8
  - JDK 11
  - JDK 17
  - JDK 21
  - JDK 25
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: 입력 검증 부족으로 원인을 한정할 수 없음
- code: JAVA.LANG.UNSUPPORTEDOPERATIONEXCEPTION
  severity: error
  category: internal
  title: 지원하지 않는 연산 호출
  immediate:
  - "`grep -n -A15 \"UnsupportedOperationException\" <app_log> | head -60` 으로 호출된 메서드(add/remove/put 등)와 최초 애플리케이션 프레임 확인"
  - "발생 빈도·특정 기능 한정 여부를 `grep -c` 로 집계해 영향 범위 기록"
  short:
  - "(2차) 수정 가능한 컬렉션으로 복사(new ArrayList<>(...)) 후 변경하도록 소스 수정안을 개발 담당에 이관, 배포는 승인 후"
  mid:
  - "불변/가변 컬렉션 사용 규칙을 개발 표준에 명시하고 해당 패턴을 정적 분석으로 점검"
  long:
  - "UnsupportedOperationException 건수를 기능별로 감시하고 코드 리뷰 점검 항목에 포함"
  vendor_cause: "요청한 연산을 지원하지 않는 객체에 호출했다는 뜻(Java SE API). List.of()/Collections.unmodifiableList 같은 불변 컬렉션 수정, Arrays.asList 결과에 add/remove 호출이 흔한 원인."
  vendor_url: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/UnsupportedOperationException.html"
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/UnsupportedOperationException.html)
  versions:
  - JDK 6
  - JDK 7
  - JDK 8
  - JDK 11
  - JDK 17
  - JDK 21
  - JDK 25
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: '-'
- code: JAVA.IO.FILENOTFOUNDEXCEPTION
  severity: error
  category: disk
  title: 파일 없음 또는 권한 없음
  immediate:
  - "예외 메시지의 경로와 사유('No such file or directory'·'Permission denied')를 확인 후 `ls -l <path>` 와 `ls -ld $(dirname <path>)` 로 존재·권한 확인"
  - "`df -h $(dirname <path>)` 와 `mount | grep <마운트지점>` 으로 파일시스템 마운트 상태, `ps -o user= -p <PID>` 로 실행 계정 확인"
  short:
  - "(2차·승인 후) 경로 설정 정정 또는 권한 부여·마운트 복구(롤백: 변경 전 권한·설정 사본 보관)"
  mid:
  - "파일 경로를 외부 설정으로 분리하고 배포·기동 전 필수 경로 존재 점검을 추가"
  long:
  - "필수 디렉터리·마운트 상태 감시와 배포 검증 점검표 운영"
  vendor_cause: "지정한 경로의 파일을 열지 못했다는 뜻 — 파일이 없거나, 디렉터리이거나, 접근 권한이 없을 때 발생(Java SE API). 경로 설정 오류·마운트 누락·권한 변경이 흔한 원인."
  vendor_url: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/io/FileNotFoundException.html"
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/io/FileNotFoundException.html)
  versions:
  - JDK 6
  - JDK 7
  - JDK 8
  - JDK 11
  - JDK 17
  - JDK 21
  - JDK 25
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: '-'
- code: JAVA.IO.EOFEXCEPTION
  severity: error
  category: internal
  title: 입력 중 예기치 않은 EOF
  immediate:
  - "`grep -n -B3 -A15 \"EOFException\" <app_log> | head -60` 으로 읽던 대상(소켓·파일·세션 직렬화)과 최초 애플리케이션 프레임 확인"
  - "소켓이면 같은 시각 상대 시스템 종료·타임아웃 로그와 대조, 파일이면 `ls -l <file>` 로 크기 이상(0바이트·잘림) 확인"
  short:
  - "(2차) 상대 측 조기 종료면 연계 담당과 타임아웃·keep-alive 정합, 파일 손상이면 원본 재수신 요청(승인 후)"
  mid:
  - "응답 길이 검증과 불완전 응답 재시도 로직을 연계 처리에 추가"
  long:
  - "연계 대상별 EOFException 건수를 감시하고 연계 안정성 지표로 관리"
  vendor_cause: "입력 도중 예상치 않게 파일·스트림의 끝에 도달했다는 뜻(Java SE API). 상대가 응답을 끝까지 보내기 전에 연결을 닫았거나, 잘린 파일·직렬화 데이터를 읽은 경우가 흔한 원인."
  vendor_url: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/io/EOFException.html"
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/io/EOFException.html)
  versions:
  - JDK 6
  - JDK 7
  - JDK 8
  - JDK 11
  - JDK 17
  - JDK 21
  - JDK 25
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: 네트워크 연결에 한정되지 않음
- code: JAVA.NET.BINDEXCEPTION
  severity: error
  category: connection
  title: 로컬 주소 바인드 실패
  immediate:
  - "예외 메시지의 포트를 확인 후 `ss -ltnp | grep :<port>` 로 해당 포트를 점유한 프로세스 확인"
  - "`ps -ef | grep java` 로 같은 애플리케이션의 중복 기동·이전 프로세스 잔존 여부 확인(정리는 2차)"
  short:
  - "(2차·승인 후) 잔존·중복 프로세스 정리 또는 포트 설정 정정 후 기동(롤백: 정리 전 프로세스 명령행·PID 기록)"
  mid:
  - "서버별 포트 할당표를 관리하고 기동 스크립트에 포트 점유 사전 점검을 추가"
  long:
  - "기동 검증 자동화(포트 LISTEN 확인)와 포트 변경 이력 관리"
  vendor_cause: "소켓을 로컬 주소·포트에 바인드하지 못했다는 뜻 — 포트가 이미 사용 중이거나 요청한 로컬 주소를 할당할 수 없을 때 발생(Java SE API). 중복 기동·이전 프로세스 잔존이 흔한 원인."
  vendor_url: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/net/BindException.html"
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/net/BindException.html)
  versions:
  - JDK 6
  - JDK 7
  - JDK 8
  - JDK 11
  - JDK 17
  - JDK 21
  - JDK 25
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: 포트 사용 중은 가능한 원인 중 하나
- code: JAVA.NET.NOROUTETOHOSTEXCEPTION
  severity: error
  category: connection
  title: 원격 호스트 경로 없음
  immediate:
  - "`ip route get <host>` 와 `ping -c 3 <host>` 로 경로·도달 확인, `nc -zvw3 <host> <port>` 로 포트 응답 확인"
  - "같은 시각 방화벽·네트워크 변경 이력과 대상 서버 상태를 확인(설정 변경 없이 조회만)"
  short:
  - "(2차) 네트워크 담당에 경로·방화벽 정책 점검 요청, 정책 변경은 승인 후 반영(롤백: 변경 전 정책 사본)"
  mid:
  - "연계 구간 방화벽 정책·라우팅을 문서화하고 이중 경로 구성을 검토"
  long:
  - "연계 대상 도달성 감시와 네트워크 변경관리 절차에 연계 영향 확인 단계 포함"
  vendor_cause: "원격 주소로 연결하는 중 경로가 없어 실패했다는 뜻 — 대개 방화벽 차단이나 중간 라우터 다운이 원인(Java SE API)."
  vendor_url: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/net/NoRouteToHostException.html"
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/net/NoRouteToHostException.html)
  versions:
  - JDK 6
  - JDK 7
  - JDK 8
  - JDK 11
  - JDK 17
  - JDK 21
  - JDK 25
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: 예외 자체가 항상 치명적이지 않음
