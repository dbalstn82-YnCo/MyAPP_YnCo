- code: SOL-SHM-FAIL
  severity: error
  category: memory
  title: 공유 메모리 할당 실패
  vendor_cause: "공유 메모리 세그먼트 생성(shmget)이 실패한 상태. Solaris 10+ 에서 EINVAL 은 요청 크기가 프로젝트·zone 의 남은 max-shm-memory 한도를 넘었거나 같은 key 의 기존 세그먼트가 요청보다 작을 때, ENOSPC 는 project.max-shm-ids 초과, ENOMEM 은 가용 메모리 부족이며 DB 설치 요구값 미반영이 흔한 원인이다."
  immediate:
  - "`ps -o pid,projid,project,args -p <PID>` 로 실패 프로세스의 실제 프로젝트 확인, `prctl -n project.max-shm-memory -i project <project>` 와 `prctl -n project.max-shm-ids -i project <project>` 로 한도 확인 (Solaris 10+ · 8/9 는 `grep shmsys /etc/system`)"
  - "`ipcs -mJ | head -40` 으로 프로젝트별 기존 세그먼트, `ipcs -mA | head -40` 으로 SEGSZ·소유자 확인 — 기존 합계+요청 크기가 max-shm-memory 를 넘으면 한도 EINVAL, 세그먼트 수가 max-shm-ids 에 닿으면 ENOSPC"
  - "애플리케이션 로그의 errno·요청 크기·key 를 위 결과와 대조 — 같은 key 의 기존 세그먼트가 요청보다 작으면 한도와 무관한 EINVAL(기존 세그먼트 정리는 2차·승인 후)"
  vendor_action: "shmget(2) NOTES — 세그먼트 최대 크기는 project.max-shm-memory·zone.max-shm-memory 에서 이미 쓰는 세그먼트를 뺀 값, 식별자 수는 project.max-shm-ids·zone.max-shm-ids 로 제한된다"
  vendor_url: "https://docs.oracle.com/cd/E36784_01/html/E36872/shmget-2.html"
  short:
  - '(2차·승인 후, 롤백: 원래 값으로 prctl/projmod) 즉시 완화 `prctl -n project.max-shm-memory -r
    -v <크기> -i project <project>`, 영구 반영 `projmod -s -K ''project.max-shm-memory=(priv,<크기>,deny)''
    <project>`'
  mid:
  - DB·미들웨어 설치 가이드 요구값으로 project 자원 제어 표준화
  long:
  - 공유 메모리 사용량(한도 대비 80%) 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: /var/adm/messages '[ID nnnnn facility.level]' 형식 8~11.4 공통
