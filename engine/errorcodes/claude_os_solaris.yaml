product: solaris
layer: os
note: GPT 협업 수집분 — 벤더 공식 문서와 대조 후 확정
codes:
- code: SOL-SVC-MAINTENANCE
  severity: error
  category: internal
  title: SMF 서비스 유지보수 상태
  vendor_cause: SMF 서비스가 시작 메서드 실패·반복 종료로 maintenance 상태가 된 것. 설정 오류, 의존 서비스·파일 부재,
    시작 메서드 시간 초과가 흔한 원인이며 원인 해결 전까지 자동 재시작되지 않는다.
  immediate:
  - '`svcs -xv` 로 maintenance 서비스·Reason·로그 위치(See:) 확인'
  - '`tail -50 /var/svc/log/<서비스 로그>.log` 로 시작 메서드의 마지막 오류 확인, `svcs -d <FMRI>` 로
    의존 서비스 상태 확인'
  short:
  - '(2차·승인 후, 롤백: 설정 변경 시 svccfg export 로 사전 백업) 원인 수정 후 `svcadm clear <FMRI>` 로
    maintenance 해제, `svcs <FMRI>` 로 online 확인'
  mid:
  - 반복 실패 서비스는 매니페스트의 시작 메서드·timeout_seconds·의존성 속성(svccfg) 정비
  long:
  - svcs -x 출력(정상 시 비어 있음) 주기 감시와 maintenance 전환 알림 등록
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: SMF 10+
- code: SOL-SVC-DEGRADED
  severity: warn
  category: internal
  title: SMF 서비스 저하
  vendor_cause: SMF 서비스가 degraded 상태 — 동작은 하지만 일부 기능·인스턴스가 정상이 아닌 상태. 의존 서비스 일부 실패,
    서비스 자체가 보고한 부분 장애가 흔한 원인.
  immediate:
  - '`svcs -xv <FMRI>` 로 degraded 사유와 로그 위치 확인'
  - '`svcs -d <FMRI>` 로 의존 서비스 상태, `tail -50 /var/svc/log/<서비스 로그>.log` 로 최근 오류 확인'
  short:
  - '(2차·승인 후, 롤백: svccfg export 백업) 의존 서비스·설정 원인 수정 후 `svcadm refresh <FMRI>`, 필요
    시 업무 영향 확인 후 `svcadm restart <FMRI>`'
  mid:
  - 서비스 매니페스트의 의존성·속성 정비
  long:
  - svcs -x 출력(정상 시 비어 있음) 주기 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: SMF 10+
- code: SOL-ZPOOL-DEGRADED
  severity: critical
  category: storage
  title: ZFS 풀 저하
  vendor_cause: ZFS 풀의 일부 장치가 FAULTED/UNAVAIL 이 되어 중복성(mirror/raidz)이 줄어든 상태. 데이터
    접근은 계속되지만 추가 장애 시 데이터 손실 위험이 있다. 디스크 장애·경로 단절이 흔한 원인.
  immediate:
  - '`zpool status -x` 로 문제 풀만 확인, `zpool status -v <pool>` 로 장치별 상태와 READ/WRITE/CKSUM
    오류 수 확인'
  - '`fmadm faulty` 로 FMA 가 진단한 결함 디스크·FRU, `iostat -En <디스크>` 로 하드웨어 오류 확인'
  short:
  - '(2차·승인 후, 롤백: 교체 전 zpool status 출력 보관) 디스크 교체 후 `zpool replace <pool> <장치>` 로
    resilver, 일시 경로 문제였으면 `zpool online <pool> <장치>`'
  mid:
  - resilver 완료 후 `zpool scrub <pool>` 로 정합성 확인, 핫 스페어 구성
  long:
  - zpool status -x 주기 감시와 월 1회 scrub
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: ZFS 10 6/06+
- code: SOL-ZPOOL-FAULTED
  severity: critical
  category: storage
  title: ZFS 풀 실패
  vendor_cause: ZFS 풀이 중복성 이상의 장치를 잃어 FAULTED(사용 불가)가 된 상태. 다중 디스크·경로 동시 장애, 스토리지
    전체 단절이 원인이며 장치 복구 없이는 데이터에 접근할 수 없다.
  immediate:
  - "`zpool status -x` 로 이상 풀, `zpool status -v <pool>` 로 FAULTED/UNAVAIL 장치·영구 오류 파일 확인 — 풀 state 가 FAULTED 면 확정 (Solaris 10 6/06+, 11.x)"
  - "`fmadm faulty` 로 FMA 결함 진단(장치·FRU), `iostat -En | head -60` 으로 디스크별 Hard/Transport Errors 확인 — 같은 경로의 여러 장치가 함께 오류면 경로·스토리지 단절 의심"
  - "`zpool import`(풀 이름 없이 = 가져오기 후보 목록만 표시)로 장치 인식 상태 확인 — 실제 import(-F 포함)·`zpool clear` 는 2차"
  short:
  - '(2차·승인 후, 롤백: 복구 시도 전 zpool status·fmdump 결과 보관) 장치·경로를 먼저 복구한 뒤 `zpool clear
    <pool>` 로 재시도, 회복 모드 import(-F) 는 데이터 일부 손실 가능성이 있어 Oracle 지원과 협의 후'
  mid:
  - 장치 복구가 불가능하면 풀을 재생성하고 백업에서 복원, 재생성 시 mirror/raidz2 등 중복 수준 재설계
  long:
  - zpool status -x 주기 감시·월 1회 scrub·백업 복원 시험 정례화
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: ZFS 10 6/06+
- code: SOL-ZFS-CHECKSUM
  severity: error
  category: storage
  title: ZFS 체크섬 오류
  vendor_cause: ZFS 가 읽은 데이터의 체크섬이 맞지 않음을 발견한 상태. 중복 구성이면 자동 복구되지만, 디스크·케이블·HBA·메모리
    문제로 반복되면 데이터 손상 위험 신호다.
  immediate:
  - '`zpool status -v <pool>` 의 CKSUM 열과 ''Permanent errors'' 파일 목록 확인 — 목록이 있으면 복구
    불가 손상'
  - '`fmdump -eV | grep -i -E ''class|checksum'' | tail -20` 으로 체크섬 ereport 장치, `iostat
    -En` 으로 해당 디스크 오류 확인'
  short:
  - '(2차·승인 후, 롤백: 불필요 — 단 scrub 은 I/O 부하 발생) 원인 장치 조치 후 업무 부하가 낮은 시간에 `zpool scrub
    <pool>`, 오류 카운터 정리는 `zpool clear <pool>`'
  mid:
  - 같은 장치에서 반복되면 디스크·케이블·HBA 교체, 영구 손상 파일은 백업에서 복원
  long:
  - CKSUM 0 유지 감시와 월 1회 scrub
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: ZFS 10 6/06+
- code: SOL-ZFS-NO-SPACE
  severity: critical
  category: disk
  title: ZFS 공간 부족
  vendor_cause: ZFS 풀 또는 데이터셋 quota 공간이 부족해 쓰기가 실패한 상태. 스냅샷이 잡고 있는 공간, quota/reservation
    설정, 풀 사용률 과다가 흔한 원인(풀은 80% 이상부터 성능 저하).
  immediate:
  - '`zpool list` 로 풀 CAP, `zfs list -o space -r <pool> | head -30` 으로 데이터셋별 USEDSNAP·USEDDS
    확인'
  - '`zfs list -t snapshot -o name,used -s used | tail -15` 로 큰 스냅샷, `zfs get quota,refquota,reservation
    <dataset>` 로 한도 확인'
  short:
  - '(2차·승인 후, 롤백: 스냅샷 삭제는 되돌릴 수 없어 백업 확인 필수) 불필요 스냅샷 정리(`zfs destroy <스냅샷>`) 또는 `zfs
    set quota=<크기> <dataset>` 조정'
  mid:
  - '`zpool add` 로 장치 추가(같은 중복 구조로), 스냅샷 보존 정책 정비'
  long:
  - 풀 CAP 80% 와 데이터셋 quota 대비 사용률 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: ZFS 10 6/06+
- code: SOL-MPXIO-PATH-OFFLINE
  severity: critical
  category: storage
  title: 멀티패스 경로 오프라인
  vendor_cause: MPxIO(scsi_vhci) 다중 경로 중 일부 경로가 offline/failed 가 된 상태. 남은 경로로 I/O
    는 계속되지만 이중화가 깨진 상태이며 FC 케이블·HBA·스위치·스토리지 포트 장애가 원인.
  immediate:
  - '`mpathadm list lu` 로 LU 별 Total/Operational Path Count 확인 — 두 값이 다르면 경로 손실'
  - '`mpathadm show lu <장치>` 로 경로별 상태, `fcinfo hba-port` 로 HBA 포트 상태 확인'
  short:
  - (2차) SAN·스토리지 측 원인 해결 후 경로 자동 복귀 확인, 남은 offline 경로는 `cfgadm -al -o show_FCP_dev`
    로 상태 확인 후 승인 하에 재구성
  mid:
  - 결함 HBA·케이블·포트 교체, 모든 LU 가 서로 다른 fabric 경로를 갖도록 구성
  long:
  - Operational Path Count 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: MPxIO 8(패치)~11, 10 부터 기본 활성
- code: SOL-DISK-ERROR
  severity: critical
  category: disk
  title: 디스크 하드 오류
  vendor_cause: 'sd/ssd 디스크 드라이버가 복구할 수 없는 오류(Error Level: Fatal)를 보고한 상태. 디스크 매체·하드웨어
    불량, 경로 오류가 흔한 원인.'
  immediate:
  - '`iostat -En` 으로 장치별 Soft/Hard/Transport 오류 수와 Media Error·Predictive Failure
    Analysis 확인'
  - '`grep -i -E ''error for command|fatal'' /var/adm/messages | tail -20` 으로 오류 장치·블록,
    `fmadm faulty` 로 FMA 결함 진단 확인'
  short:
  - (2차) 해당 디스크가 속한 ZFS 풀/SVM 미러 확인 후 미러면 교체 계획, 비미러면 데이터 백업 우선
  mid:
  - Oracle/유지보수 업체에 디스크 교체 의뢰, 교체 후 zpool replace 또는 metareplace 로 재동기화
  long:
  - iostat -En Hard 오류 증가 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: /var/adm/messages '[ID nnnnn facility.level]' 형식 8~11.4 공통
- code: SOL-DISK-RETRYABLE
  severity: warn
  category: disk
  title: 디스크 재시도 오류
  vendor_cause: 'sd/ssd 드라이버가 재시도로 복구된 디스크 오류(Error Level: Retryable)를 보고한 상태. 일시적
    경로·버스 문제일 수 있으나 반복되면 디스크·케이블 열화의 전조다.'
  immediate:
  - '`grep -i ''retryable'' /var/adm/messages | tail -20` 으로 오류 장치·빈도 확인'
  - '`iostat -En <장치>` 로 Soft/Transport 오류 수와 Predictive Failure Analysis 값 확인 — 증가
    추세면 교체 대상'
  short:
  - (2차) 같은 HBA·경로의 다른 장치에도 오류가 있는지 비교해 디스크/경로 원인 구분, 케이블·포트 점검 의뢰
  mid:
  - 반복 디스크는 미러 상태 확인 후 선제 교체
  long:
  - Soft/Transport 오류 증가율 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: /var/adm/messages '[ID nnnnn facility.level]' 형식 8~11.4 공통
- code: SOL-MEMORY-ECC
  severity: error
  category: hardware
  title: 메모리 ECC 오류
  vendor_cause: 메모리 ECC 오류가 감지된 상태. 정정 가능 오류가 누적되면 FMA 가 해당 페이지·DIMM 을 격리(retire)하며,
    정정 불가 오류는 패닉으로 이어질 수 있다.
  immediate:
  - '`fmadm faulty` 로 결함 진단된 DIMM·FRU 위치와 SUNW-MSG-ID 확인'
  - '`fmdump -e | tail -20` 으로 메모리 ereport 발생 빈도, `fmdump -v -u <UUID>` 로 해당 결함 상세
    확인'
  short:
  - (2차) SUNW-MSG-ID 와 FRU 위치를 Oracle 지원에 접수해 DIMM 교체 일정 수립
  mid:
  - 교체 후 `fmadm faulty` 가 비었는지 확인(교체 인식이 안 되면 승인 하에 fmadm repair)
  long:
  - FMA 결함 이벤트(fmd) 알림 연동
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: FMA 코드 10+, ECC syslog 문구 전 버전
- code: SOL-CPU-FAULT
  severity: critical
  category: hardware
  title: CPU 결함
  vendor_cause: FMA 가 CPU(스트랜드·코어) 결함을 진단했거나 CPU 가 오프라인 처리된 상태. 하드웨어 결함이 원인이며 결함 CPU
    는 자동 격리되어 처리 용량이 줄어든다.
  immediate:
  - '`fmadm faulty` 로 결함 CPU·FRU·SUNW-MSG-ID 확인'
  - '`psrinfo -v | grep -i -E ''off-line|faulted''` 로 오프라인 CPU, `psrinfo | wc -l`
    로 가용 CPU 수 확인'
  short:
  - (2차) Oracle 지원에 FRU 교체 접수, 줄어든 CPU 로 업무 부하 영향 평가
  mid:
  - 업체 일정에 맞춰 교체(변경 관리), 교체 후 psrinfo 로 CPU 수 정상 확인
  long:
  - FMA 결함 알림과 CPU 수 변화 감시
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 8
  - Solaris 9
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: SUN4U/SUN4V-8000 FMA 코드는 10+, 'CPU offlined' 문구는 전 버전
- code: SOL-FMA-RETIRE
  severity: error
  category: hardware
  title: FMA 자원 격리
  vendor_cause: FMA 가 결함 자원(CPU·메모리 페이지·I/O 장치)을 사용 중지(retire)한 상태. 하드웨어 결함 진단의 결과이며
    FRU 교체 전까지 해당 자원은 쓰이지 않는다.
  immediate:
  - '`fmadm faulty` 로 retire 된 자원·FRU·영향 범위 확인'
  - '`fmdump -v | tail -20` 으로 진단 이력과 같은 FRU 반복 여부 확인'
  short:
  - (2차) Oracle 지원에 FRU 교체 접수, 오진단이 의심되면 지원 확인 후 승인 하에 `fmadm acquit <UUID>`
  mid:
  - FRU 교체 후 fmadm faulty 정상 확인
  long:
  - FMA 결함 알림(SNMP/메일) 연동
  source: 자체 정의 의사코드(메시지 별칭 regex 기반, _aliases.yaml)
  versions:
  - Solaris 10
  - Solaris 11.3
  - Solaris 11.4
  version_note: fmd 10+
- code: SOL-LINK-DOWN
  severity: error
  category: connection
  title: 네트워크 링크 다운
  vendor_cause: 네트워크 데이터링크의 물리 링크가 끊긴 상태('link down'). 케이블·스위치 포트 장애, 속도/듀플렉스 불일치,
    NIC 불량이 흔한 원인.
