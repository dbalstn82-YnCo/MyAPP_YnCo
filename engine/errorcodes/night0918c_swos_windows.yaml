- code: '1074'
  severity: warn
  category: internal
  title: 시스템 종료·재시작 시작됨
  vendor_cause: User32 이벤트 — 프로세스(shutdown.exe·winlogon·Windows Update 등)가 사용자 대신 시스템 종료·재시작을 시작하며 사유 코드·주석을 남긴 정상 종료 기록. 비계획이면 수행 계정·프로세스 확인이 필요하다.
  immediate:
  - '`Get-WinEvent -FilterHashtable @{LogName="System"; Id=1074} -MaxEvents 10 | fl TimeCreated,Message` 로 시작 프로세스·사용자·사유·종류(다시 시작 또는 끄기) 확인'
  - '같은 기간 비정상 종료 여부 대조: `Get-WinEvent -FilterHashtable @{LogName="System"; Id=41,6008,6006,6005} -MaxEvents 20 | ft TimeCreated,Id -AutoSize`'
  - 변경 요청·패치 일정과 대조 — 비계획이면 수행 계정의 로그온(4624) 기록 확인 후 보안 담당 통보
  short:
  - (2차) 비계획 재시작이면 수행 계정·원격 실행 경로(예약 작업·관리 도구) 조사, Windows Update 자동 재시작이면 유지 관리 시간 정책 정비
  mid:
  - 종료 권한(시스템 종료·원격 시스템 종료 사용자 권한) 보유 계정 최소화와 재시작 승인 절차 수립
  long:
  - 1074·6008 이벤트 자동 수집과 변경 관리 기록 대조 보고
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://learn.microsoft.com/en-us/troubleshoot/windows-server/performance/troubleshoot-unexpected-reboots-system-event-logs)
