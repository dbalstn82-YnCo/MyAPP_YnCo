- code: '4771'
  severity: warn
  category: security
  title: Kerberos 사전 인증 실패
  vendor_cause: DC 의 KDC 가 Kerberos 사전 인증(AS 요청)에 실패해 TGT 발급을 거부한 감사 이벤트 — Failure Code 0x18 은 잘못된 비밀번호, 0x12 는 계정 비활성·잠김·만료, 0x25 는 시간 차(clock skew)가 대표 원인.
  immediate:
  - DC 에서 `Get-WinEvent -FilterHashtable @{LogName="Security"; Id=4771; StartTime=(Get-Date).AddHours(-1)} -MaxEvents 30 | fl TimeCreated,Message` 로 계정·Client Address·Failure Code 확인
  - Failure Code 로 원인 구분(0x18 비밀번호, 0x12 계정 잠김/비활성, 0x25 시간 차) — 0x25 면 클라이언트 `w32tm /query /status` 확인
  - 같은 Client Address 에서 여러 계정 실패면 비밀번호 대입 공격 의심, 보안 담당 통보 — 차단은 2차
  short:
  - '(2차·승인 후) 원천 기기(Client Address)의 저장 자격 증명 갱신, 공격 출처 차단(롤백: 규칙 제거), 시간 차면 시간 동기화 복구'
  mid:
  - 계정·출처별 인증 실패 임계 감시 규칙 운영
  long:
  - Kerberos 인증 실패·잠금 상관 분석과 서비스 계정 gMSA 전환
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4771)
  versions:
  - Windows Server 2003
  - 2008/R2
  - 2012/R2
  - '2016'
  - '2019'
  - '2022'
  - '2025'
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: '-'
- code: '5722'
  severity: error
  category: security
  title: 도메인 컨트롤러 보안 채널 설정 실패
  vendor_cause: DC 의 Netlogon 이 컴퓨터(또는 트러스트) 계정의 보안 채널 세션 설정 인증에 실패한 상태 — 컴퓨터 계정 비밀번호 불일치(스냅숏 복원·재설치·이름 중복), 삭제·비활성 계정이 흔한 원인.
  immediate:
  - DC 에서 `Get-WinEvent -FilterHashtable @{LogName="System"; Id=5722} -MaxEvents 20 | fl TimeCreated,Message` 로 실패 컴퓨터·계정·오류 확인
  - 해당 구성원 서버에서 `Test-ComputerSecureChannel -Verbose` 또는 `nltest /sc_query:<도메인>` 로 보안 채널 상태 확인 (조회만, -Repair 는 2차)
  - '`Get-ADComputer <컴퓨터> -Properties Enabled,PasswordLastSet,whenChanged` 로 계정 존재·활성·비밀번호 변경 시각 확인, VM 스냅숏 복원 이력 확인'
  short:
  - '(2차·승인 후, 롤백: 실패 시 도메인 재가입) `Test-ComputerSecureChannel -Repair -Credential <도메인관리자>` 또는 `Reset-ComputerMachinePassword -Server <DC>` 로 재설정'
  mid:
  - 스냅숏 복원 절차에 보안 채널 점검 포함, 중복 컴퓨터 이름 정리
  long:
  - Netlogon 5722/5719 경보와 컴퓨터 계정 수명 관리
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/event-id-5722-logged-on-domain-controller)
  versions:
  - Windows Server 2003
  - 2008/R2
  - 2012/R2
