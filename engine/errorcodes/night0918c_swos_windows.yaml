  - 2008/R2
  - 2012/R2
  - '2016'
  - '2019'
  - '2022'
  - '2025'
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: 치명도로 고정할 근거 없음
- code: '7045'
  severity: warn
  category: security
  title: 새 서비스 설치됨
  vendor_cause: SCM 이 새 서비스 등록을 기록한 정보 이벤트 — 정상 설치(에이전트·패치) 외에 악성코드·원격 실행 도구가 서비스를 만들어 실행하는 경우가 많아 보안 감시 대상이다.
  immediate:
  - '`Get-WinEvent -FilterHashtable @{LogName="System"; Id=7045} -MaxEvents 20 | fl TimeCreated,Message` 로 서비스 이름·파일 경로·시작 유형·계정 확인'
  - '`Get-AuthenticodeSignature "<서비스 파일 경로>" | fl Status,SignerCertificate` 와 `Get-FileHash "<경로>" -Algorithm SHA256` 로 서명·해시 확인 — 서명 없음·임시 폴더·무작위 이름이면 보안 담당 즉시 통보'
  - 같은 시각 설치 계정의 로그온(4624/4648) 기록과 변경 요청 대조 — 비인가 서비스 정리는 2차
  short:
  - '(2차·보안 담당 승인 후, 롤백: 정리 전 서비스 구성·파일 증거 보관) 비인가 서비스는 증거 보존 후 `sc.exe stop`·`sc.exe delete` 로 정리하고 침해 대응 절차 개시'
  mid:
  - 서비스 설치 권한 최소화와 허용 서비스 목록 관리
  long:
  - 7045·4697 이벤트 SIEM 실시간 경보
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://learn.microsoft.com/en-us/troubleshoot/windows-server/performance/troubleshoot-unexpected-reboots-system-event-logs)
