  - '2019'
  - '2022'
  - '2025'
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: '-'
- code: '40960'
  severity: error
  category: security
  title: LSA Kerberos 인증 실패
  vendor_cause: LSA(LsaSrv)가 특정 서버와의 인증에서 Kerberos 등 인증 프로토콜 오류를 기록 — 본문의 실패 코드(시간 차, 대상 SPN 없음·중복, 계정 문제)가 원인이며 DC 연결 불가·DNS 오류·시간 불일치가 흔하다.
  immediate:
  - '`Get-WinEvent -FilterHashtable @{LogName="System"; Id=40960,40961} -MaxEvents 20 | fl TimeCreated,Id,Message` 로 대상 서버·실패 코드 확인'
  - '`w32tm /query /status` 로 시간 동기, `nltest /dsgetdc:<도메인>` 로 DC 탐색 확인'
  - '`klist` 로 캐시된 티켓 확인, `setspn -Q <서비스>/<호스트>` 로 대상 SPN 등록·중복 여부 확인'
  short:
  - '(2차·승인 후, 롤백: 이전 SPN 재등록) 시간 동기 복구, 중복 SPN 은 AD 담당 승인 후 `setspn -D` 로 정리'
  mid:
  - DC 의 DNS 등록·AD 사이트 구성 정비
  long:
  - LsaSrv 40960/40961 경보와 SPN 변경 관리
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/replication-error-1722-rpc-server-unavailable)
  versions:
  - Windows Server 2003
  - 2008/R2
  - 2012/R2
  - '2016'
  - '2019'
  - '2022'
  - '2025'
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: LSASRV 인증 오류 이벤트
- code: '40961'
  severity: error
  category: security
  title: LSA 보안 연결 설정 실패
  vendor_cause: LSA 가 대상 서버와 보안 연결을 맺을 인증 프로토콜(Kerberos·NTLM)을 하나도 쓸 수 없었던 상태 — DC 연결 불가, DNS·SPN 오류, NTLM 제한 정책과 Kerberos 실패가 겹칠 때 흔하다.
  immediate:
  - '`Get-WinEvent -FilterHashtable @{LogName="System"; Id=40961} -MaxEvents 20 | fl TimeCreated,Message` 로 대상 서버·발생 시각 확인'
  - '`nltest /sc_query:<도메인>` 과 `Resolve-DnsName <대상서버>` 로 보안 채널·이름 해석 확인'
  - '`setspn -Q <서비스>/<대상서버>` 로 SPN 존재 확인, NTLM 제한 GPO 적용 여부는 `gpresult /r` 로 확인'
  short:
  - '(2차·승인 후, 롤백: 이전 SPN·정책 복원) 누락 SPN 등록(`setspn -S`) 또는 NTLM 제한 예외 정비, DC 연결 복구'
  mid:
  - 서비스 계정별 SPN 대장 관리와 Kerberos 전환 계획
  long:
  - LSA 인증 실패 경보와 AD 운영 표준 반영
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/replication-error-1722-rpc-server-unavailable)
  versions:
  - Windows Server 2003
  - 2008/R2
  - 2012/R2
  - '2016'
  - '2019'
  - '2022'
  - '2025'
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: 특정 Kerberos 서버 인증 실패로 한정되지 않음
- code: '4199'
  severity: error
  category: connection
  title: IP 주소 충돌
  vendor_cause: TCP/IP 가 이 서버의 IP 주소를 다른 하드웨어(MAC) 주소를 가진 장비가 쓰고 있음을 감지한 상태 — 수동 IP 중복 설정, DHCP 범위와 고정 IP 겹침, VM 복제가 흔한 원인이며 해당 주소 통신이 끊길 수 있다.
  immediate:
  - '`Get-WinEvent -FilterHashtable @{LogName="System"; Id=4199} -MaxEvents 10 | fl TimeCreated,Message` 로 충돌 IP·상대 MAC 확인'
  - '`Get-NetIPAddress -AddressFamily IPv4 | ft InterfaceAlias,IPAddress,AddressState` (2012+) 로 Duplicate 상태 주소 확인'
  - 네트워크 담당에 상대 MAC 의 스위치 포트·장비 확인 요청, `Get-NetNeighbor -IPAddress <IP>` (2012+) 또는 `arp -a` 로 현재 매핑 확인
  short:
  - '(2차·승인 후, 롤백: 원래 IP 설정) 정당한 소유 장비 확인 후 다른 쪽 IP 재할당, DHCP 범위 제외 설정'
  mid:
  - IP 관리 대장 정비와 DHCP 예약·제외 범위 정합
  long:
  - IPAM 도입과 IP 충돌 이벤트 감시
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://learn.microsoft.com/en-us/troubleshoot/windows-server/networking/event-4199-windows-client-cannot-get-ip-address-dhcp-server)
  versions:
  - Windows Server 2003
  - 2008/R2
  - 2012/R2
  - '2016'
  - '2019'
  - '2022'
  - '2025'
  version_note: 야간 수집 2026-09-18 — 버전 범위 미확인(제품 공통값 적용)
  note: Microsoft 문서상 Event Level Error
- code: '7038'
  severity: error
  category: security
  title: 서비스 계정 로그온 실패
  vendor_cause: SCM 이 서비스 실행 계정으로 로그온하지 못해 서비스를 시작하지 못한 상태 — 계정 비밀번호 변경 후 서비스 미갱신, 계정 잠김·만료·비활성, 서비스로 로그온 권한 누락이 흔한 원인.
  immediate:
  - '`Get-WinEvent -FilterHashtable @{LogName="System"; Id=7038,7000} -MaxEvents 20 | fl TimeCreated,Id,Message` 로 서비스·계정·오류 확인'
  - '`Get-CimInstance Win32_Service -Filter "Name=''<서비스>''" | fl Name,StartName,State` 로 실행 계정 확인'
  - 도메인 계정이면 `Get-ADUser <계정> -Properties LockedOut,Enabled,PasswordLastSet,AccountExpirationDate` 로 상태 확인, 서비스로 로그온 권한은 `gpresult /h <파일>` 보고서로 확인
  short:
  - '(2차·승인 후, 롤백: 이전 계정 설정) 서비스 속성 대화상자(services.msc → 로그온 탭)에서 비밀번호 갱신 후 기동 — sc.exe config … password= 처럼 명령줄 인자로 넣지 말 것(셸 이력·감사 기록에 남음), 비밀번호는 화면·기록에 남기지 않음'
  mid:
  - 서비스 계정 비밀번호 변경 시 사용처 대장 관리와 gMSA 전환 검토
  long:
  - 서비스 계정 만료·잠금 사전 경보
  source: Claude 수집 2026-09-18·GPT 벤더 문서 대조 완료(https://learn.microsoft.com/en-us/troubleshoot/windows-server/networking/services-not-automatically-restart-nic-teaming)
  versions:
