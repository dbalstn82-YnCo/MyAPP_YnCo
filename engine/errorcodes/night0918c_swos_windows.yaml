- code: '10010'
  severity: error
  category: internal
  title: DCOM 서버 등록 시간초과
  vendor_cause: DCOM 서버(COM+/DCOM 애플리케이션)가 시작 후 정해진 시간 안에 DCOM 에 등록하지 않아 활성화가 시간 초과된 상태 — 해당 서버 프로세스 시작 실패·행, 권한 문제, 시스템 부하가 원인이며 일부 구성 요소는 정상 동작 중에도 기록된다.
  immediate:
  - '`Get-WinEvent -FilterHashtable @{LogName="System"; Id=10010} -MaxEvents 20 | fl TimeCreated,Message` 로 CLSID·발생 빈도 확인'
  - 'CLSID 구성 요소 확인: `Get-ItemProperty "Registry::HKEY_CLASSES_ROOT\CLSID\{<CLSID>}"` 후 관련 서비스 `Get-Service <서비스> | fl Status`'
  - 같은 시각 해당 기능(관리 콘솔·애플리케이션) 장애 여부 확인 — 없으면 관찰
  short:
  - '(2차·승인 후, 롤백: 변경 전 설정 기록으로 원복) 해당 COM+ 애플리케이션·서비스 재기동, dcomcnfg 의 ID·권한 설정이 공급업체 권장과 같은지 확인'
  mid:
  - 해당 COM 서버 공급업체 패치와 실행 계정 권한 정비
  long:
