codes:
- code: ERR-0109D
  severity: error
  category: memory
  title: 메모리 부족
  immediate:
  - OS 가용 메모리·스왑 확인 — Linux `free -m ; vmstat 1 5`, AIX `svmon -G`, Solaris `vmstat 1 5`
  - iSQL `SELECT * FROM V$MEMSTAT;` 로 Altibase 모듈별 메모리 사용 상위 확인(읽기 전용)
  short:
  - '(2차·승인 후, 롤백: 없음) 비필수 부하(배치·대량 조회) 중지 요청, 메모리 관련 property 조정은 변경 관리 후'
  - 프로세스별 메모리와 메모리 관련 property 및 누수 여부를 분석
  mid:
  - 물리 메모리와 Altibase 메모리 설정을 워크로드 기준으로 재산정
  long:
  - 메모리 헤드룸과 할당 실패 조기경보를 운영
  source: GPT 수집·벤더 문서 대조 완료(https://docs.altibase.com/display/FAQE/ERR-0109D%2BInsufficient%2Bmemory)
  note: 쿼리 수행을 위한 메모리 부족 오류로 단독 코드만으로 서비스 전체 중단을 뜻하지 않음
  vendor_cause: 쿼리 실행 메모리 할당 중 EXECUTE_STMT_MEMORY_MAXIMUM 한도를 초과했다.
  vendor_action: Query_Execute 증가량과 현재 한도를 확인하고 EXECUTE_STMT_MEMORY_MAXIMUM을 ALLOC_SIZE보다 크게 설정해 설정 파일에도 반영한다.
  vendor_url: https://docs.altibase.com/display/FAQE/ERR-0109D%2BInsufficient%2Bmemory
  versions:
  - Altibase 5.x
  - Altibase 6.1.1
  - Altibase 6.3.1/6.5.1
  - Altibase 7.1
  - Altibase 7.3
  version_note: ERR-xxxxx(16진 5자리) 코드는 5.x~7.3 공통. 6.3.1 부터 qp 로그에 ERR-xxxxx 직접 출력, 6.1.1 이하는 8자리 10진 errorcode(예 822329545=0x3103C049→ERR-3103C) → 파서가 변환해 대응
- code: ERR-01027
  severity: error
  category: capacity
  title: IPC 채널 고갈
  immediate:
  - "isql 로 sys 접속 후 `SELECT NAME, VALUE1 FROM V$PROPERTY WHERE NAME = 'IPC_CHANNEL_COUNT';` 와 `SELECT SUBSTR(COMM_NAME,1,3) CONN, COUNT(*) FROM V$SESSION GROUP BY SUBSTR(COMM_NAME,1,3);` — IPC 세션 수가 IPC_CHANNEL_COUNT 와 같으면 확정"
  - "IPC 세션 상세: `SELECT ID, COMM_NAME, DB_USERNAME, CLIENT_PID, IDLE_START_TIME FROM V$SESSION WHERE COMM_NAME LIKE 'IPC%';` 뒤 `ps -p <CLIENT_PID>` — 클라이언트 프로세스가 없으면 미반납 채널 (7.x 컬럼, 6.5 는 `SELECT * FROM V$SESSION;`)"
  short:
  - "(2차·승인 후, 롤백: 원래 접속 방식·값) 신규 접속을 TCP 로 돌리고, IPC_CHANNEL_COUNT 상향은 altibase.properties 수정 뒤 계획 재기동"
  - 비정상 세션과 IPC 채널 미반납 여부를 점검
  mid:
  - 업무량 기준으로 IPC_CHANNEL_COUNT를 조정하고 서버를 재기동
  long:
  - IPC 사용률과 동시접속량을 상시 모니터링
  source: GPT 수집·벤더 문서 대조 완료(https://docs.altibase.com/display/FAQE/ERR-01027%2BNo%2Bmore%2BIPC%2Bchannel)
  note: IPC 접속 채널 한도 초과로 해당 접속이 실패하므로 error가 타당함
  vendor_cause: IPC_CHANNEL_COUNT가 최대값을 초과해 IPC 연결을 설정할 수 없다.
  vendor_action: IPC_CHANNEL_COUNT를 늘린 후 서버를 재시작한다.
  vendor_url: https://docs.altibase.com/display/FAQE/ERR-01027%2BNo%2Bmore%2BIPC%2Bchannel
  versions:
  - Altibase 5.x
  - Altibase 6.1.1
  - Altibase 6.3.1/6.5.1
  - Altibase 7.1
  - Altibase 7.3
  version_note: ERR-xxxxx(16진 5자리) 코드는 5.x~7.3 공통. 6.3.1 부터 qp 로그에 ERR-xxxxx 직접 출력, 6.1.1 이하는 8자리 10진 errorcode(예 822329545=0x3103C049→ERR-3103C) → 파서가 변환해 대응
