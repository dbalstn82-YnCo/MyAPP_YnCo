  severity: error
  category: lock
  title: 교착상태 감지
  immediate:
  - "`grep -n -B3 \"ERR-11041\" <app_log> | tail -40` 로 실패 SQL·시각 확인 — 같은 테이블 쌍에서 반복되면 접근 순서 문제"
  - "isql 로 sys 접속 후 `SELECT TRANS_ID, WAIT_FOR_TRANS_ID FROM V$LOCK_WAIT;` 와 `SELECT SESSION_ID, TX_ID, QUERY FROM V$STATEMENT WHERE TX_ID IN (SELECT WAIT_FOR_TRANS_ID FROM V$LOCK_WAIT);` — 서로를 기다리는 쌍이 계속 보이면 교착 반복 중 (7.x 컬럼)"
