  note: 데이터파일 확장 작업 실패로 단독 코드만으로 서비스 전체 중단을 뜻하지 않음
  vendor_cause: AUTOEXTEND OFF 데이터파일을 MAXSIZE보다 크게 변경하려 했다.
  vendor_action: 데이터파일의 AUTOEXTEND를 ON으로 변경한 뒤 파일 크기 변경 작업을 수행한다.
  vendor_url: https://docs.altibase.com/pages/viewpage.action?pageId=16876378
