- code: ERR-11098
  severity: error
  category: storage
  title: NOARCHIVE 온라인백업 불가
  immediate:
  - "`isql -s localhost -u sys` 로 접속(비밀번호는 프롬프트 입력) 후 `SELECT * FROM V$ARCHIVE;` 로 아카이브 모드 표시 칼럼 확인 — 아카이브 모드가 꺼져(NOARCHIVE) 있으면 확정 (읽기 전용)"
  - "실행한 백업 구문: `grep -n -i \"BACKUP\" <backup_script>` 로 온라인 백업(ALTER DATABASE BACKUP …) 사용 여부와 수행 시각 확인 — 오프라인 백업으로 대체 가능한지 판단 자료"
  short:
  - "(2차·승인 후, 롤백: NOARCHIVELOG 로 원복) 온라인 백업이 필요하면 CONTROL 단계에서 `ALTER DATABASE ARCHIVELOG;` 로 아카이브 모드 전환(서버 재기동 동반), 그전엔 오프라인 백업 사용"
  - 백업 정책과 archive log 설정 및 복구 요구사항을 점검
  mid:
  - 필요 시 archive log 모드 전환 절차를 검토하고 백업 방식을 조정
  long:
  - 백업과 복구정책을 archive mode 기준으로 표준화
  source: GPT 수집·벤더 문서 대조 완료(https://docs.altibase.com/display/FAQE/ERR-11098%2BsmERR_ABORT_BackupLogMode%2Bcannot%2Bbe%2Bexecuted%2Bin%2Bno%2Barchive%2Blog%2Bmode)
  note: 공식 의미는 NOARCHIVE LOG 모드에서 온라인 백업을 수행할 수 없다는 뜻임
  vendor_cause: NO ARCHIVING 모드에서 온라인 백업을 수행했다.
  vendor_action: DB를 ARCHIVING 모드로 변경한 뒤 SERVICE 단계에서 온라인 백업을 다시 수행한다.
  vendor_url: https://docs.altibase.com/display/FAQE/ERR-11098%2BsmERR_ABORT_BackupLogMode%2Bcannot%2Bbe%2Bexecuted%2Bin%2Bno%2Barchive%2Blog%2Bmode
  verify_note: "미검증 — 이전 1차 줄의 `SELECT ARCHIVELOG_MODE FROM V$LOG` 에서 V$LOG 의 ARCHIVELOG_MODE 칼럼을 Altibase General Reference 로 확인하지 못해 칼럼 이름을 단정하지 않는 `SELECT * FROM V$ARCHIVE` 로 바꿈 — 아카이브 모드를 나타내는 실제 칼럼 이름은 버전별 매뉴얼에서 확인"
  versions:
