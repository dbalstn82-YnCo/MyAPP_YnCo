  mid:
  - "끊김 시각을 네트워크 장비·방화벽 세션 로그와 대조하고 같은 시각 장시간 트랜잭션 롤백 여부 확인"
  long:
  - "이중화 갭·재접속 횟수 감시 임계를 등록하고 이중화 네트워크 품질(지연·손실)을 정기 측정"
  versions:
  - Altibase 7.1
  - Altibase 7.3
  version_note: ALTIBASE/Documents 7.1·7.3 Error Message Reference 에서 확인, REPLICATION_RECEIVE_TIMEOUT(기본 7200초, 운영 중 변경 가능)은 7.3 General Reference-1 기준. 6.x 이하는 미대조
