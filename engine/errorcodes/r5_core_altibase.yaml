  mid:
  - "이중화 생성·삭제 스크립트를 양쪽 서버 한 묶음으로 관리하고 수행 후 SYS_REPLICATIONS_ 대조"
  long:
  - "이중화 구성표(이름·대상 테이블·호스트)를 형상관리하고 월 1회 메타와 대조 점검"
  versions:
  - Altibase 7.1
  - Altibase 7.3
  version_note: ALTIBASE/Documents 7.1·7.3 Error Message Reference 에서 확인, SYS_REPLICATIONS_·SYS_REPL_HOSTS_ 칼럼은 7.3 Data Dictionary 기준. 6.x 이하는 미대조
  source: "공식 문서 대조(2026-10-16 5차 보강)"
- code: ERR-61012
  severity: error
  category: upstream
  title: 이중화 송신자 상대 서버 접속 실패
  vendor_cause: "rpERR_ABORT_RP_SENDER_CONNECT_PEER — 이중화 송신자(Sender)가 상대 서버에 접속하지 못함. 상대 서버 미기동, IP 주소·포트 오설정, 네트워크 장애가 원인(제조사 문서)."
  vendor_action: 상대 서버가 기동 중인지, IP 주소와 포트 번호가 올바른지, 네트워크가 정상인지 확인한다.
  vendor_url: https://github.com/ALTIBASE/Documents/blob/master/Manuals/Altibase_7.3/kor/Error%20Message%20Reference.md
  immediate:
  - "isql 로 sys 접속 후 `SELECT REPLICATION_NAME, HOST_IP, PORT_NO FROM SYSTEM_.SYS_REPL_HOSTS_;` 로 상대 IP·포트 확인"
  - "`ping -c 5 <peer_ip>` 와 `nc -zvw3 <peer_ip> <port>` 로 경로·이중화 포트 도달 확인, 상대 서버에서 `ps -ef | grep [a]ltibase` 로 기동 여부 확인"
  - "`tail -100 $ALTIBASE_HOME/trc/altibase_rp.log` 와 `SELECT REP_NAME, REP_GAP FROM V$REPGAP;` 로 실패 반복·갭 누적 확인 — 갭이 계속 늘면 2차 즉시 호출"
  short:
  - "(2차·승인 후, 롤백: 변경 전 방화벽·이중화 호스트 설정 기록 후 원복) 상대 서버 기동 또는 방화벽 포트 허용, IP 가 바뀌었으면 이중화 호스트 정보를 수정한 뒤 ALTER REPLICATION <rep> START"
  mid:
  - "이중화 전용 네트워크 경로를 이중화하고 REPLICATION_CONNECT_TIMEOUT(기본 10초) 값이 경로 지연에 맞는지 검토"
  long:
  - "V$REPSENDER 상태·V$REPGAP 갭을 상시 감시해 송신 중단을 분 단위로 경보"
  versions:
  - Altibase 7.1
  - Altibase 7.3
  version_note: ALTIBASE/Documents 7.1·7.3 Error Message Reference 에서 확인(원인 3가지·조치 3가지 동일). 6.x 이하는 미대조
  source: "공식 문서 대조(2026-10-16 5차 보강)"
- code: ERR-61003
  severity: error
  category: upstream
  title: 이중화 소켓 읽기 실패
  vendor_cause: "rpERR_ABORT_RP_READ_SOCKET — 이중화 연결이 끊겼거나 지정한 시간 안에 데이터를 받지 못함. 네트워크 순단, 상대 서버 지연·중단, 이중화 타임아웃 과소가 흔한 원인."
  vendor_action: 이중화 관련 타임아웃을 늘리거나, 로컬·원격 altibase_rp.log 를 확인해 연결이 끊긴 이유를 찾는다.
  vendor_url: https://github.com/ALTIBASE/Documents/blob/master/Manuals/Altibase_7.3/kor/Error%20Message%20Reference.md
  immediate:
  - "로컬과 상대 서버의 `tail -100 $ALTIBASE_HOME/trc/altibase_rp.log` 를 같은 시각으로 대조해 어느 쪽이 먼저 연결을 닫았는지 확인"
  - "isql 로 sys 접속 후 `SELECT NAME, VALUE1 FROM V$PROPERTY WHERE NAME LIKE 'REPLICATION%TIMEOUT';` 로 현재 타임아웃 값 확인(변경은 2차)"
  - "`SELECT REP_NAME, PEER_IP, PEER_PORT, STATUS FROM V$REPSENDER;` 와 `SELECT REP_NAME, REP_GAP FROM V$REPGAP;` 로 송신자 상태·갭 확인"
