- code: ERR-11058
  severity: warn
  category: internal
  title: 고유 인덱스 중복 키
  vendor_cause: "smERR_ABORT_smnUniqueViolation — 고유(unique) 인덱스에 같은 키의 행이 이미 있어 INSERT/UPDATE 가 실패함. 애플리케이션 중복 요청·재처리, 채번 꼬임, 양방향 이중화 키 충돌이 흔한 원인."
  vendor_action: 중복 키를 넣거나 갱신하지 않는다. 또는 unique 제약을 제거한다(제약 제거는 정합성 훼손 위험이 있어 표준 조치에서 제외).
  vendor_url: https://github.com/ALTIBASE/Documents/blob/master/Manuals/Altibase_7.3/kor/Error%20Message%20Reference.md
  immediate:
  - "애플리케이션 로그에서 실패 SQL·대상 테이블·입력 키를 확인하고 같은 키의 중복 요청(재시도·이중 처리) 여부 확인"
  - "isql 로 `SELECT C.CONSTRAINT_NAME, C.CONSTRAINT_TYPE FROM SYSTEM_.SYS_CONSTRAINTS_ C, SYSTEM_.SYS_TABLES_ T WHERE C.TABLE_ID = T.TABLE_ID AND T.TABLE_NAME = '<TABLE>' AND C.CONSTRAINT_TYPE IN (2, 3, 6);` 로 고유 제약(2 UNIQUE·3 PRIMARY KEY·6 LOCAL UNIQUE) 확인(읽기 전용)"
  short:
  - "(2차·승인 후, 롤백: 수정 전 대상 행을 백업 테이블로 복사) 채번 꼬임이면 시퀀스를 기존 최대 키보다 크게 맞추고, 데이터 오류면 업무 담당 확인 후 정정"
  mid:
  - "애플리케이션에 멱등 처리(재시도 전 존재 확인)를 반영하고, 양방향 이중화 구성이면 키 충돌 회피 규칙(채번 범위 분리)을 점검"
  long:
  - "테이블별 ERR-11058 건수를 집계해 급증 시 경보, 제약 제거·비활성화는 변경관리 승인 없이 금지"
  versions:
  - Altibase 7.1
  - Altibase 7.3
  version_note: ALTIBASE/Documents 7.1·7.3 Error Message Reference 에서 확인, SYS_CONSTRAINTS_.CONSTRAINT_TYPE 값은 7.3 Data Dictionary 기준. 6.x 이하는 미대조
  source: "공식 문서 대조(2026-10-16 5차 보강)"
