# WEB — Nginx 시그니처
rules:
- id: WEB-NGX-005
  layer: web
  product:
  - nginx
  match:
    regex: upstream timed out
  severity: error
  category: upstream
  verdict: 백엔드(WAS) 응답 시간 초과 — 504
  immediate:
  - '`grep "upstream timed out" <error_log> | grep -oE "upstream: [^,]+" | sort | uniq -c | sort -rn | head` 로 시간 초과 백엔드 상위 확인 — 한 대에 몰리면 그 WAS, 전체면 공통 의존(DB 등)'
  - '`nginx -T 2>/dev/null | grep -E "proxy_read_timeout|fastcgi_read_timeout|proxy_connect_timeout"` 로 타임아웃 값 확인(기본 60s) 후 WAS 로그의 같은 요청 처리 시간과 비교'
  short:
  - proxy_read_timeout과 실제 응답 시간 비교
  mid:
  - 지연 API 개선 결과에 따라 타임아웃 재조정
  long:
  - 응답 시간 SLO 정의·상시 측정 체계
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: '''upstream timed out'' 전 버전'
- id: WEB-NGX-006
  layer: web
  product:
  - nginx
  match:
    regex: connect\(\) failed .* while connecting to upstream|no live upstreams
  severity: critical
  category: upstream
  verdict: 백엔드 연결 불가 — WAS 다운 의심 (502)
  immediate:
  - '`ss -lntp | grep <WAS포트>` 와 `curl -s -o /dev/null -w ''%{http_code}'' http://<WAS>:<port>/<health>` 로 WAS 리스너·응답 확인'
  - error.log 의 'connect() failed (111' 반복 대상 upstream 확인 — `grep 'connect() failed' error.log | tail -20`
  short:
  - '(2차·승인 후, 롤백: 없음) 다운된 WAS 기동(담당 승인) 후 502 소멸 확인'
  - WAS 비정상 종료 원인 분석
  mid:
  - 헬스체크·자동 제외(upstream health) 구성
  long:
  - WAS 이중화·무중단 배포 체계
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: '''connect() failed … while connecting to upstream'' 전 버전'
- id: WEB-NGX-010
  layer: web
  product:
  - nginx
  match:
    regex: worker_connections are not enough
  severity: error
  category: capacity
  verdict: 워커 커넥션 한도 도달
  immediate:
  - '`nginx -T 2>/dev/null | grep -E "worker_processes|worker_connections|worker_rlimit_nofile"` 로 한도 확인 — 최대 연결 ≈ worker_processes × worker_connections(프록시는 요청당 2개 사용)'
  - '`ss -tan state established "( sport = :80 or sport = :443 )" | wc -l` 로 현재 연결 수, `tail -50000 <access_log> | awk ''{print $1}'' | sort | uniq -c | sort -rn | head` 로 출처 쏠림 확인 — 소수 IP 집중이면 공격·폭주'
  short:
  - '(2차·승인 후, 롤백: 설정 원복) 공격성이면 보안 담당과 출처 차단, 정상 증가면 worker_connections·worker_rlimit_nofile 상향 후 `nginx -t` 확인 뒤 reload'
  mid:
  - keepalive·버퍼 등 커넥션 설정 최적화
  long:
  - WEB 계층 스케일아웃 계획
  versions:
  - nginx 1.14~1.31 (오류 로그 형식 0.7 이후 동일)
  version_note: '''worker_connections are not enough'' 전 버전'
- id: WEB-NGX-011
  layer: web
  product:
  - nginx
  match:
    regex: '(?:malloc\(\d+\)|(?:posix_)?memalign\(\d+,\s*\d+\)) failed \(12: Cannot allocate memory\)'
  severity: critical
  category: memory
  verdict: Nginx 메모리 할당 실패 — 요청 처리 중단 가능
  immediate:
  - 같은 시각 서버 전체 메모리·스왑 사용량과 다른 프로세스 점유 확인(free·top, 읽기 전용)
  - 반복 여부와 함께 나온 worker 종료(exited on signal) 줄 확인
  short:
  - 버퍼·캐시 관련 설정(proxy_buffers·client_body_buffer_size·keys_zone)의 합계와 실제 메모리 비교(2차)
  mid:
  - 메모리 한도(ulimit·cgroup) 정책 검토
  long:
  - 서버 메모리 용량·동거 프로세스 배치 재설계
  versions:
  - nginx 1.14~1.27 (Linux/Unix)
  version_note: ngx_alloc.c 의 malloc·posix_memalign·memalign 실패 — errno 12(ENOMEM)일 때만
- id: WEB-NGX-012
  layer: web
  product:
  - nginx
  match:
    regex: 'thread pool "[^"]*" queue overflow: \d+ tasks waiting'
  severity: error
  category: thread
  verdict: Nginx 스레드 풀 대기열 넘침 — 파일 입출력 작업 거부
  immediate:
  - 같은 시각 디스크 I/O 대기(iostat)와 큰 파일 전송·aio threads 사용 위치 확인
  - 대기 작업 수와 반복 빈도 기록
  short:
  - thread_pool 의 threads·max_queue 값과 실제 부하 비교(2차)
  mid:
  - 큰 정적 파일 전송 경로의 디스크 성능·캐시 검토
  long:
  - 정적 파일 전용 저장소·CDN 분리 검토
  versions:
  - nginx 1.7.11~1.27 (thread_pool 지시어 도입 이후)
  version_note: 'ngx_thread_pool.c ''queue overflow: N tasks waiting'' — max_queue 도달 시 작업 거부'
- id: WEB-NGX-013
  layer: web
  product:
  - nginx
  match:
    regex: a client request body is buffered to a temporary file
  severity: info
  category: performance
  verdict: 요청 본문을 디스크 임시 파일로 기록 — 한 번은 정상 버퍼링, 잦으면 업로드·큰 요청 지연 원인
  immediate:
  - '`grep -c "buffered to a temporary file" <error_log>` 로 빈도 확인 — 가끔이면 정상 버퍼링, 분당 수십 건 이상이면 큰 요청 집중'
  - '`nginx -T 2>/dev/null | grep -E "client_body_buffer_size|client_body_temp_path|client_max_body_size"` 로 버퍼·임시 경로 확인 후 `df -h <임시 경로>` 와 `iostat -x 1 3` 로 디스크 여유·await 확인'
  short:
  - client_body_buffer_size 와 실제 요청 본문 크기 비교(2차)
  mid:
  - 큰 업로드 경로 분리·전용 설정 검토
  long:
  - 업로드 처리 구조(직접 저장소 업로드 등) 재설계 검토
  versions:
  - nginx 1.14~1.27
  version_note: ngx_http_request_body.c 의 [warn] 문구지만 단독 발생은 장애가 아니다 — info, 빈도·디스크 I/O·지연과 함께 볼 것
- id: WEB-NGX-014
  layer: web
  product:
  - nginx
  match:
    regex: '(?:pread|read|pwrite|pwritev|write|writev|open)\(\) "[^"\r\n]+" failed \(5: Input/output error\)'
  severity: error
  category: storage
  verdict: Nginx 파일 입출력 오류(EIO) — 디스크·파일시스템 이상 의심
  immediate:
  - 같은 시각 커널 로그(dmesg·/var/log/messages)의 디스크·파일시스템 오류 확인(읽기 전용)
  - 오류 난 파일 경로가 어느 장치·마운트인지 기록
  short:
  - 해당 장치 SMART·스토리지 상태 점검(2차)
  mid:
  - 파일시스템 점검(fsck)은 변경 관리 승인 후 정지 시간에
  long:
  - 스토리지 이중화·교체 계획
  versions:
  - nginx 1.14~1.27 (Linux/Unix)
  version_note: ngx_files.c 의 파일 입출력(파일명 포함)만 — 소켓 readv/writev 실패는 파일명이 없어 걸리지 않는다. 하드웨어 고장 확정 아님
- id: WEB-NGX-015
  layer: web
  product:
  - nginx
  match:
    regex: sem_wait\(\) failed while waiting on shmtx
  severity: error
  category: lock
  verdict: Nginx 공유 메모리 잠금(shmtx) 대기 실패 — 워커 간 잠금 이상
  immediate:
  - 같은 줄 errno 와 반복 빈도, 같은 시각 워커 종료 줄('worker process … exited') 확인
  - 시스템 세마포어 사용 현황 확인(ipcs -s, 읽기 전용)
  short:
  - 워커 수·공유 메모리 영역(keys_zone·limit_req_zone) 설정 검토(2차)
  mid:
  - nginx 재시작은 변경 관리 승인 후
  long:
  - 커널 세마포어 한도·nginx 버전 점검 계획
  versions:
  - nginx 1.14~1.27 (POSIX 세마포어 사용 빌드)
  version_note: ngx_shmtx.c 의 NGX_LOG_ALERT 문구
- id: WEB-NGX-016
  layer: web
  product:
  - nginx
  match:
    regex: sem_init\(\) failed
  severity: warn
  category: lock
  verdict: Nginx 세마포어 초기화 실패 — 다른 잠금 방식으로 계속 동작(성능 저하 가능)
  immediate:
  - '`grep -n "sem_init" <error_log> | tail -5` 로 errno(38 Function not implemented·28 No space 등)와 기동 시점 여부 기록'
  - '`uname -r` 와 `nginx -V 2>&1 | head -3` 로 커널·빌드 확인, `head /proc/1/cgroup` 로 컨테이너 실행 여부 확인 — 기동 시 한 번이면 원자 연산 잠금으로 계속 동작하므로 서비스 영향 없음'
  short:
  - 커널 세마포어 한도(kernel.sem)·컨테이너 제약 검토(2차)
  mid:
  - 같은 빌드를 쓰는 다른 서버와 비교
  long:
  - 실행 환경 표준화
  versions:
  - nginx 1.14~1.27 (POSIX 세마포어 사용 빌드)
  version_note: ngx_shmtx.c — 실패해도 원자 연산 잠금으로 계속 동작하므로 critical 아님
- id: WEB-NGX-018
  layer: web
  product:
  - nginx
  match:
    regex: (?:pwrite|write|writev|pwritev)\(\) "[^"\r\n]+" has written only \d+ of \d+
  severity: error
  category: storage
  verdict: Nginx 파일 부분 쓰기 — 캐시·임시 파일 일부만 기록(저장 장치 여유·오류 의심)
  immediate:
  - 같은 시각 해당 경로 파일시스템 여유 공간·inode(df -h·df -i)와 커널 로그 확인(읽기 전용)
  short:
  - 캐시·임시 경로 용량 정책(max_size·inactive) 검토(2차)
  mid:
  - 캐시 디렉터리 전용 볼륨 분리 검토
  long:
  - 스토리지 용량 계획
  versions:
  - nginx 1.14~1.27 (Linux/Unix)
  version_note: ngx_files.c 의 'has written only N of M'
