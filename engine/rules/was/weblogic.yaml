# WAS — Oracle WebLogic 시그니처 (룰 학습 1차 2026-10-13: Claude 초안 → 기계 검증 → GPT 벤더 문서 대조, 근거 URL 은 version_note)
rules:
- id: WAS-WLS-011
  layer: was
  product:
  - weblogic
  match:
    regex: \bPoolDisabledSQLException\b|No resources currently available in pool
  severity: error
  category: connection
  verdict: JDBC 커넥션 풀 비활성·고갈 — DB 연결 획득 불가
  immediate:
  - '`grep -nE "PoolDisabledSQLException|No resources currently available" <DOMAIN_HOME>/servers/<server>/logs/<server>.log | tail -20` 로 대상 풀 이름·발생 시각 확인'
  - WLST(`java weblogic.WLST` → `connect(url='t3://<admin_host>:<port>')`, 자격증명은 프롬프트 입력) 에서 `domainRuntime()` → `cd('ServerRuntimes/<server>/JDBCServiceRuntime/<server>/JDBCDataSourceRuntimeMBeans/<ds>')` → `get('State')`·`get('ActiveConnectionsCurrentCount')`·`get('WaitingForConnectionCurrentCount')` 확인 — Suspended·Disabled 면 비활성, Active=MaxCapacity·Waiting>0 이면 고갈
  - 같은 시각 DB 상태·리스너·네트워크 확인(`nc -zvw3 <db_host> <port>`), 풀 점유 장기 SQL 은 DB 담당이 조회
  short:
  - '(2차·승인 후, 롤백: 해당 없음) DB 원인 해소 후 관리 콘솔 데이터소스 Control › Resume 또는 WLST 데이터소스 런타임의 `cmo.resume()` 으로 재활성, State Running 확인'
  mid:
  - '(2차·승인 후, 롤백: 원래 값 기록) Maximum Capacity·Inactive Connection Timeout(누수 회수)·Test Connections On Reserve 조정'
  long:
  - DB 이중화(Multi Data Source·Active GridLink)와 풀 사용률·대기 수 경보
  versions:
  - WebLogic 10.3.6
  - WebLogic 12.1.3
  - WebLogic 12.2.1
  - WebLogic 14.1.1
  version_note: BEA-001129·001112 는 코드 사전이 판정 — 이 룰은 코드 없는 예외 줄용. 반복·업무 영향 확인 시 critical 로 본다 — https://docs.oracle.com/cd/E50629_01/core/FMERR/chapter_bea_messages.htm
- id: WAS-WLS-012
  layer: was
  product:
  - weblogic
  match:
    regex: \bBEA-310003\b|Free memory in the server is [\d,]+ bytes\. There is danger of receiving an OutOfMemoryError
  severity: warn
  category: memory
  verdict: 힙 여유 메모리 부족 경고 — OOM 임박(실제 OOM 은 아님)
  immediate:
  - '`grep -n "BEA-310003" <DOMAIN_HOME>/servers/<server>/logs/<server>.log | tail -10` 으로 여유 메모리 바이트 추세 확인, 같은 시각 대량 요청·배치 여부 확인'
  - '`jstat -gcutil <PID> 5000 5` 로 Old 영역 사용률·Full GC 횟수 증가 확인(HotSpot JDK) — Old 90% 이상 유지면 OOM 임박'
  short:
  - '(2차·승인 후, 롤백: 해당 없음 — 덤프 중 일시 정지·디스크 사용) `jcmd <PID> GC.heap_dump <path>/heap.hprof` 로 힙 덤프 확보 후 점유 객체 분석'
  mid:
  - 힙 크기(-Xms·-Xmx)·GC 정책 조정과 누수 코드 수정
  long:
  - 힙 사용률·Full GC 빈도 경보, 용량 계획에 세션 수·캐시 크기 반영
  versions:
  - WebLogic 10.3.6
  - WebLogic 12.1.3
  - WebLogic 12.2.1
  - WebLogic 14.1.1
  version_note: 공식 Type WARNING — 실제 OOM 과 겹치면 OOM 룰이 critical — https://docs.oracle.com/cd/E50629_01/core/FMERR/chapter_bea_messages.htm
- id: WAS-WLS-013
  layer: was
  product:
  - weblogic
  match:
    regex: \bBEA-000383\b|A critical service failed\. The server will shut itself down|Server state changed to FAILED
  severity: critical
  category: internal
  verdict: 핵심 서비스 실패로 서버 자체 종료·FAILED 상태
  immediate:
  - '`grep -nE "<(Critical|Emergency|Error)>" <DOMAIN_HOME>/servers/<server>/logs/<server>.log | tail -30` 으로 BEA-000383 직전의 첫 Error·Critical 메시지(근본 원인) 확인'
  - WLST(`java weblogic.WLST` → `connect(url='t3://<admin_host>:<port>')`, 자격증명은 프롬프트 입력) 에서 `state('<server>')` 와 Node Manager 로그(`<DOMAIN_HOME>/nodemanager/nodemanager.log`, 10.3.6 은 `<WL_HOME>/common/nodemanager/nodemanager.log`)로 Node Manager 의 자동 기동 시도 여부 확인
  short:
  - '(2차·승인 후, 롤백: 변경 전 config.xml 사본) 원인 해소 후 Node Manager·기동 스크립트로 기동, BEA-000365 RUNNING 확인'
  mid:
  - Node Manager CrashRecoveryEnabled 와 서버 Auto Restart·Restart Max 정책 점검
  long:
  - 클러스터 이중화와 서버 상태(RUNNING 외) 감시 경보
  versions:
  - WebLogic 10.3.6
  - WebLogic 12.1.3
  - WebLogic 12.2.1
  - WebLogic 14.1.1
  version_note: FORCE_SHUTTING_DOWN 은 관리자 강제 종료일 수 있어 뺐다 — https://docs.oracle.com/cd/E50629_01/core/FMERR/chapter_bea_messages.htm
- id: WAS-WLS-014
  layer: was
  product:
  - weblogic
  match:
    regex: \bBEA-002606\b|unable to create a server socket for listening on channel
  severity: critical
  category: connection
  verdict: 수신 포트 열기 실패 — 주소 오류·포트 충돌
  immediate:
  - 같은 포트를 쓰는 프로세스·listen 주소(IP 변경) 확인 — 비필수 채널 하나면 영향 범위 확인
  - '`grep -n -A 10 "BEA-002606" <DOMAIN_HOME>/servers/<server>/logs/<server>.log | tail -20` 로 채널·주소·포트 확인 후 `ss -ltnp | grep <port>`(Linux, 그 외 `netstat -an | grep <port>`)와 `ip addr | grep <listen_addr>` 로 점유·주소 존재 확인'
  short:
  - '(2차·승인 후, 롤백: 원래 Listen Address 기록) 남은 인스턴스 정리 또는 Listen Address 수정 후 기동'
  mid:
  - 기동 스크립트에 포트 점유 사전 확인(`ss -ltn`) 추가
  long:
  - 도메인별 포트 배정 대장과 IP 변경 시 Listen Address 갱신 절차
  versions:
  - WebLogic 10.3.6
  - WebLogic 12.1.3
  - WebLogic 12.2.1
  - WebLogic 14.1.1
  version_note: https://docs.oracle.com/cd/E50629_01/core/FMERR/chapter_bea_messages.htm
- id: WAS-WLS-015
  layer: was
  product:
  - weblogic
  match:
    regex: '\bBEA-090402\b|Authentication denied: Boot identity not valid'
  severity: critical
  category: security
  verdict: 기동 계정(boot.properties) 인증 실패 — 서버 기동 불가(외부 공격 아님)
  immediate:
  - 최근 관리자 비밀번호 변경·boot.properties 변경 여부 확인
  - '`ls -l <DOMAIN_HOME>/servers/<server>/security/boot.properties` 로 파일 존재·수정 시각만 확인(내용 열람·복사 금지), `grep -n "BEA-090402" <DOMAIN_HOME>/servers/<server>/logs/<server>.log | tail -5`'
  short:
  - '(2차·승인 후, 롤백: 기존 boot.properties 사본) boot.properties 를 username·password 평문으로 재작성(기동 시 자동 암호화) 후 기동'
  mid:
  - 비밀번호 변경 절차에 boot.properties 반영 포함
  long:
  - 관리 계정 비밀번호 변경 점검표(boot.properties·Node Manager·WLST 키 파일) 표준
  versions:
  - WebLogic 10.3.6
  - WebLogic 12.1.3
  - WebLogic 12.2.1
  - WebLogic 14.1.1
  version_note: https://docs.oracle.com/cd/E50629_01/core/FMERR/chapter_bea_messages.htm
- id: WAS-WLS-016
  layer: was
  product:
  - weblogic
  match:
    regex: \bBEA-149231\b|Unable to set the activation state to true for the application
  severity: error
  category: internal
  verdict: 애플리케이션 활성화 실패(개별 앱 — 서버 전체 장애와 구분)
  immediate:
  - 직후의 Stack trace·원인 예외 확인, 최근 배포 변경 확인
  - '`grep -n -A 30 "BEA-149231" <DOMAIN_HOME>/servers/<server>/logs/<server>.log | head -60` 으로 애플리케이션 이름·원인 예외 확인, 관리 콘솔 Deployments 상태 확인'
  short:
  - '(2차·승인 후, 롤백: 이전 버전 아카이브) 원인 예외 해소 후 재배포, 상태 Active 확인'
  mid:
  - 배포 전 스테이징 검증·`weblogic.appc` 검사
  long:
  - 배포 자동화와 배포 결과(Active·Failed) 감시
  versions:
  - WebLogic 10.3.6
  - WebLogic 12.1.3
  - WebLogic 12.2.1
  - WebLogic 14.1.1
  version_note: BEA-149205 는 코드 사전이 판정 — https://docs.oracle.com/cd/E50629_01/core/FMERR/chapter_bea_messages.htm
- id: WAS-WLS-018
  layer: was
  product:
  - weblogic
  match:
    regex: \bBEA-000333\b|Queue usage is greater than QueueLengthThresholdPercent
  severity: warn
  category: thread
  verdict: 실행 큐 적체(임계 비율 초과) — 요청 대기 증가
  immediate:
  - 같은 시각 STUCK 스레드·DB·연동 지연 여부 확인
  - '`grep -nE "BEA-000333|BEA-000337" <DOMAIN_HOME>/servers/<server>/logs/<server>.log | tail -20` 확인 후 스레드 덤프 `java weblogic.Admin -url t3://<host>:<port> -username <user> THREAD_DUMP`(10.3.6, 비밀번호는 프롬프트) 또는 `jcmd <PID> Thread.print`(HotSpot JDK 7+, 스레드 덤프 — 프로세스는 유지)'
  short:
  - '지연 원인(STUCK·DB·연동) 해소, (2차·승인 후, 롤백: 원래 값 기록) Execute Queue 스레드 수·QueueLengthThresholdPercent 조정'
  mid:
  - 셀프 튜닝 Work Manager 로 전환하고 업무별 제약(max-threads-constraint) 설계
  long:
  - 큐 길이·대기 요청 감시와 용량 계획
  versions:
  - WebLogic 10.3.6
  version_note: 구형 Execute Queue 설정에서 나온다(셀프 튜닝 기본인 12c 이상에서는 드묾) — https://docs.oracle.com/cd/E50629_01/core/FMERR/chapter_bea_messages.htm
- id: WAS-WLS-019
  layer: was
  product:
  - weblogic
  match:
    regex: \bBEA-002608\b|The ListenThread failed because of an error
  severity: error
  category: connection
  verdict: 수신 스레드(ListenThread) 오류 — 새 연결 수락 실패
  immediate:
  - '`grep -n -A 10 "BEA-002608" <DOMAIN_HOME>/servers/<server>/logs/<server>.log | tail -30` 으로 ListenThread 오류 예외(Too many open files 등) 확인'
  - '`ls /proc/<PID>/fd | wc -l` 와 `grep "open files" /proc/<PID>/limits` 비교 — 한도 근접이면 FD 부족 확정 (Linux)'
  - '`ss -s` 로 TCP 연결 상태 요약, `ip -s link` 로 네트워크 인터페이스 오류 확인'
  short:
  - '(2차·승인 후, 롤백: 원래 limits 값 기록) nofile 한도 상향 또는 네트워크 원인 해소 후 다음 기동 시 반영, 리슨 복구 확인'
  mid:
  - FD 사용률·CLOSE_WAIT 수 감시와 연결 누수 수정
  long:
  - 클러스터 이중화로 단일 서버 수신 실패 영향 축소
  versions:
  - WebLogic 10.3.6
  - WebLogic 12.1.3
  - WebLogic 12.2.1
  - WebLogic 14.1.1
  version_note: https://docs.oracle.com/cd/E50629_01/core/FMERR/chapter_bea_messages.htm
- id: WAS-WLS-021
  layer: was
  product:
  - weblogic
  match:
    regex: \bBEA-000384\b|A fatal configuration failure occurred during startup
  severity: critical
  category: internal
  verdict: 기동 중 치명적 설정 오류 — 서버 기동 불가
  immediate:
  - 직전 설정(config.xml) 변경 이력 확인
  - '`grep -n -A 20 "BEA-000384" <DOMAIN_HOME>/servers/<server>/logs/<server>.log | head -40` 으로 오류 설정 항목 확인, `ls -lt <DOMAIN_HOME>/config/ | head` 로 최근 변경 파일 확인'
  short:
  - '(2차·승인 후, 롤백: 현재 config.xml 사본 보관) 직전 정상 config.xml 로 원복 또는 오류 항목 수정 후 기동'
  mid:
  - 설정 변경은 관리 콘솔 Lock & Edit 후 검증·활성화 절차로 통제
  long:
  - config.xml 형상 관리(변경 이력·백업)
  versions:
  - WebLogic 10.3.6
  - WebLogic 12.1.3
  - WebLogic 12.2.1
  - WebLogic 14.1.1
  version_note: https://docs.oracle.com/cd/E50629_01/core/FMERR/chapter_bea_messages.htm
