# 상용SW — 제네릭 Java 애플리케이션 (API Gateway 등)
rules:
- id: SW-JAVA-001
  layer: sw
  product:
  - java
  - mesim-esb
  - mesim-apig
  match:
    regex: 'java\.lang\.OutOfMemoryError(?!: (?:Metaspace|PermGen|unable to create|Direct buffer|GC overhead))'
  severity: critical
  category: memory
  verdict: JVM 힙 메모리 고갈
  immediate:
  - '`jcmd <PID> GC.heap_info` 와 `jstat -gcutil <PID> 1000 5` 로 Old 영역 사용률·Full GC 반복 확인(읽기 전용, GC.heap_info 는 JDK 9+ — JDK 8 은 jstat 만)'
  - '`grep -n ''OutOfMemoryError'' <로그>` 로 첫 발생 시각과 종류(''Java heap space''·''Metaspace''·''unable to create native thread'') 확인'
  short:
  - '(2차·승인 후, 롤백: 없음) `jcmd <PID> GC.heap_dump <경로>` 로 힙 덤프 확보(수 초~수십 초 정지) 후 프로세스 재기동 — 서비스 우선 복구'
  - GC 로그·메모리 추이 확인, 직전 변경 이력 점검
  mid:
  - 힙 크기 재산정
  long:
  - 메모리 누수 프로파일링
  versions:
  - JDK 6
  - JDK 7
  - JDK 8
  - JDK 11
  - JDK 17
  - JDK 21
  - JDK 25
  version_note: java.lang.OutOfMemoryError(힙) — JDK 6~25 공통
- id: SW-JAVA-002
  layer: sw
  product:
  - java
  match:
    regex: java\.net\.SocketTimeoutException|java\.net\.UnknownHostException|Read timed out
  severity: error
  category: upstream
  verdict: 백엔드/연동 대상 연결 실패
  immediate:
  - "`grep -n -E 'SocketTimeoutException|UnknownHostException|Read timed out' <log> | tail -30` 로 대상 host:port·예외 종류 확인 — UnknownHost 면 DNS, connect timed out 이면 도달, Read timed out 이면 대상 응답 지연"
  - "`getent hosts <host>` 와 `nc -zvw3 <host> <port>` 로 이 서버에서 이름해석·도달 확인 — 둘 다 성공하면 대상 응답 지연 쪽(대상 담당 문의)"
  - "`curl -s -o /dev/null -w '%{http_code} %{time_total}\\n' --max-time 30 <대상 URL>` 로 응답시간 측정(HTTP 대상·조회성 URL만) — read timeout 근처면 지연 확정"
  short:
  - 타임아웃 설정과 대상 응답 시간 비교
  mid:
  - 재시도·서킷브레이커 설정 점검
  long:
  - 연동 구간 이중화 검토
  versions:
  - JDK 6
  - JDK 7
  - JDK 8
  - JDK 11
  - JDK 17
  - JDK 21
  - JDK 25
  version_note: java.net 예외 — 공통
- id: SW-JAVA-003
  layer: sw
  product:
  - java
  - mesim-esb
  - mesim-apig
  match:
    regex: Too many open files
  severity: critical
  category: internal
  verdict: 리소스 한계 (스택/파일디스크립터)
  immediate:
  - Too many open files 면 `ls /proc/<PID>/fd | wc -l` 과 `grep 'open files' /proc/<PID>/limits` 로 사용량·한도 비교
  - StackOverflowError 면 스택트레이스에서 반복 메서드 확인, `jcmd <PID> VM.flags` 로 ThreadStackSize(-Xss) 확인
  short:
  - '(2차·승인 후, 롤백: 설정 원복) fd 한도 상향(systemd LimitNOFILE 또는 limits.conf) 또는 프로세스 재기동'
  - fd 누수·재귀 호출 지점 분석
  mid:
  - ulimit 재산정, 코드 수정
  long:
  - 리소스 사용 감시 체계
  versions:
  - JDK 6
  - JDK 7
  - JDK 8
  - JDK 11
  - JDK 17
  - JDK 21
  - JDK 25
  version_note: '''Too many open files''(EMFILE) — OS/JDK 공통'
- id: SW-APP-VALID-001
  layer: sw
  product:
  - java
  - jeus
  match:
    regex: 검증실패|검증 실패|유효값 검증|validation failed|ValidationException
  severity: warn
  category: internal
  verdict: 애플리케이션 입력(전문·패키지) 검증 실패 — 상대 시스템이 보낸 데이터 형식 오류
  immediate:
  - "`grep -n -E '검증실패|검증 실패|유효값 검증|validation failed|ValidationException' <log> | tail -30` 로 실패 건의 송신 시스템·시각·검증 항목(예: 패키지 버전) 기록"
  - "`grep -c -E '검증실패|검증 실패|validation failed|ValidationException' <log>` 를 전일 로그 결과와 비교 — 특정 송신 시스템에 몰려 급증하면 송신 측 규격 변경·배포 의심, 평소 수준이면 개별 데이터 오류"
  short:
  - 송신 측 규격 변경·배포 이력 대조
  mid:
  - 검증 실패 건 재처리 절차
  long:
  - 인터페이스 규격 변경 관리
  versions:
  - 제품·버전 무관 (키워드 공통 룰)
  version_note: 업무 앱 검증 실패 문구(한글·ValidationException) — 제품 버전 무관
- id: SW-APP-BIZ-001
  layer: sw
  product:
  - java
  - jeus
  match:
    regex: CAS.{0,10}삭제된 자료|There is no data\. File = null|\[CASGetFile\] 2\. There is no data
  severity: warn
  category: internal
  verdict: 업무 오류 — 이미 삭제됐거나 없는 자료 조회 요청(장애가 아닌 데이터 상태 오류)
  immediate:
  - "`grep -c -E 'CASGetFile|There is no data' <log>` 로 건수 확인 후 전일 로그와 비교 — 평소 수준이면 데이터 상태 오류(장애 아님), 급증했다면 상대 시스템의 자료 정리·동기화 문제 확인"
  - "`grep -E 'CASGetFile|There is no data' <log> | tail -20` 로 요청 출처(시스템·사용자)·시각 확인 — 같은 출처가 반복 조회하면 출처 측 목록 갱신 누락"
  short:
  - 요청 출처(시스템·사용자)별 집계
  mid:
  - 삭제 자료 조회 시 사용자 안내 메시지 처리
  long:
  - 자료 상태 동기화 점검
  versions:
  - BizMaster 4.x (Tmax EAI, JEUS 6 기반)
  version_note: BizMaster GISS 업무 앱 문구(CAS) — 실로그 기준
