  - 재작성 규칙 변경은 시험계에서 `LogLevel alert rewrite:trace3` 으로 검증한 뒤 운영 반영하는 절차 수립
  long:
  - 재작성 규칙을 형상관리하고 AH00124 발생 건수 감시
  source_note: 'legacy-analyzer-v2.2 rules.json APACHE_AH00124_20d6 (원 출처: scraped)'
  versions:
  - Apache 2.4
  version_note: AH00124 — 2.4
- id: LEG-RHEL-OOM-KILLER-A548
  layer: os
  product:
  - linux
  match:
    regex: (?:OOM\ killer)|(?:OOM killer)
  severity: warn
  category: memory
  verdict: 메모리 부족 — OOM killer 발생
  immediate:
  - '커널 로그에서 메모리 고갈 시각·희생 프로세스 확인: `journalctl -k --since ''-2 hours'' | grep -iE ''out of memory|oom'' | tail -20` (RHEL 7+, RHEL 6 은 `grep -i ''out of memory'' /var/log/messages`)'
  - '현재 메모리 상태(읽기): `free -m` 과 `ps -eo pid,rss,cmd --sort=-rss | head -10` — available 수백 MB 이하·스왑 사용 지속이면 고갈 진행 중'
  short:
  - '(2차·승인 후, 롤백: 변경 전 sysctl·서비스 설정 사본) 희생된 서비스 재기동, 메모리 상한(MemoryMax)·JVM -Xmx 를 물리 메모리 기준으로 재산정'
  mid:
  - 메모리 과다 사용 프로세스의 누수 분석(힙·RSS 추이)과 vm.overcommit·스왑 크기 기준 재검토
  long:
  - MemAvailable 10% 미만 감시 임계 등록과 중요 서비스 OOMScoreAdjust 보호 설정 표준화
  source_note: 'legacy-analyzer-v2.2 rules.json RHEL_OOM killer_a548 (원 출처: scraped)'
  versions:
  - RHEL 5~10
  - CentOS 6~Stream 9
  - Rocky/Alma 8~9
  - Ubuntu 16.04~24.04
  - SLES 12~15
  version_note: 일반 문구('OOM killer')
- id: LEG-RHEL-I-O-ERROR-B055
  layer: os
  product:
  - linux
  match:
    regex: (?:I/O\ error)|(?:I/O error)
  severity: warn
  category: disk
  verdict: 디스크/IO — I/O error 발생
  immediate:
  - '오류 장치·섹터 확인: `dmesg -T | grep -iE ''I/O error|blk_update_request'' | tail -20` (RHEL 7+) — 같은 장치 반복이면 디스크·경로 결함'
  - '장치 건강 상태(읽기): 로컬 디스크 `smartctl -H /dev/<sdX>` / SAN `multipath -ll` — FAILED·failed faulty 경로면 확정'
  - '읽기전용 전환 여부: `awk ''$4 ~ /^ro/'' /proc/mounts` — 업무 파일시스템이 ro 면 즉시 2차 통보'
  short:
  - '(2차·승인 후, 롤백: 교체 전 최신 백업 확인) 결함 디스크 교체 또는 SAN 경로 복구, 파일시스템 오류 동반 시 언마운트 후 e2fsck/xfs_repair 수행'
  mid:
  - smartd·multipathd 로 상태를 상시 점검하고 디스크 펌웨어·HBA 드라이버를 제조사 권고 판으로 정비
  long:
  - I/O error 커널 메시지 감시 등록과 디스크 사용 연수 기반 교체 계획
  source_note: 'legacy-analyzer-v2.2 rules.json RHEL_I/O error_b055 (원 출처: scraped)'
  versions:
  - RHEL 5~10
  - CentOS 6~Stream 9
  - Rocky/Alma 8~9
  - Ubuntu 16.04~24.04
  - SLES 12~15
  version_note: 일반 문구
- id: LEG-RHEL-EXT4-FS-ERROR-699F
  layer: os
  product:
  - linux
  match:
    regex: (?:EXT4\-fs\ error)|(?:EXT4-fs error)
  severity: warn
  category: internal
  verdict: 시스템 오류 — EXT4-fs error 발생
  immediate:
  - '오류 장치·inode·함수 확인: `dmesg -T | grep ''EXT4-fs error'' | tail -20` — 같은 장치 반복 여부 기록'
  - '파일시스템 상태(읽기): `tune2fs -l /dev/<dev> | grep -iE ''state|errors behavior|error count''` — ''clean with errors''·error count 증가면 점검 필요'
  - '읽기전용 재마운트 여부: `awk ''$4 ~ /^ro/'' /proc/mounts`'
  short:
  - '(2차·승인 후, 롤백: 점검 전 백업·스냅샷 확보) 서비스 중단 창에서 언마운트 후 `e2fsck -f /dev/<dev>` 실행, 루트 파일시스템은 복구 모드에서 수행'
  mid:
  - 하부 디스크 I/O 오류 동반 여부 확인 후 디스크 교체, mount 옵션 errors=remount-ro 표준화
  long:
  - EXT4-fs error 커널 메시지 감시와 정기 파일시스템 점검 일정 수립
  source_note: 'legacy-analyzer-v2.2 rules.json RHEL_EXT4_fs error_699f (원 출처: scraped)'
  versions:
  - RHEL 6~10
  - CentOS 6~Stream 9
  - Rocky/Alma 8~9
  - Ubuntu 16.04~24.04
  - SLES 12~15
  version_note: ext4 2.6.28+ (RHEL 6+)
- id: LEG-AIX-0XX-8-7AC6
  layer: os
  product:
  - aix
  match:
    regex: (?:0xX\{8\})|(?:0x[0-9A-Fa-f]{8})
  severity: warn
  category: internal
  verdict: 16진 8자리 값(0x…)이 든 오류 줄 — 선별력 낮은 일반 패턴, errpt 와 대조 필요
  immediate:
  - '16진 값이 errpt 오류·식별자인지 주소인지 같은 시각 항목으로 대조: `errpt | head -20`'
  - '해당 시각 상세(읽기): `errpt -a -s <MMDDhhmmYY> | head -80` — CLASS(H/S)·TYPE(PERM/TEMP)·Probable Causes 기록'
  - '하드웨어 분류만 보기: `errpt -d H | head -20`'
  short:
  - (2차·승인 후) 하드웨어(H)·영구(PERM) 유형이면 IBM 지원 의뢰 자료(`snap -gc`) 수집, 소프트웨어 유형이면 해당 응용 담당 이관
  mid:
  - 16진 일반 패턴은 선별력이 낮으므로 errpt 식별자 기반 개별 룰로 대체
  long:
  - errpt 영구(PERM) 하드웨어 오류 감시와 errnotify 기반 알림 등록
  source_note: 'legacy-analyzer-v2.2 rules.json AIX_0xX{8}_7ac6 (원 출처: scraped)'
  versions:
  - AIX 5.3
  - AIX 6.1
  - AIX 7.1
  - AIX 7.2
  - AIX 7.3
  version_note: 16진수 8자리 일반 패턴 — 버전 무관(선별력 낮음, 기존 도구 이관)
- id: LEG-AIX-HSCL-W-6FF8
  layer: os
  product:
  - aix
  match:
    regex: (?:HSCL\\w\+)|(?:HSCL\w+)
  severity: warn
  category: internal
  verdict: AIX HMC 오류 코드(HSCL…) 발생 — 코드별 의미는 코드 사전·HMC 메시지 참조
  immediate:
  - 'HSCL 메시지 번호와 대상 관리 시스템·파티션 확인 — HMC 명령행(읽기): `lssvcevents -t console -d 1 | grep HSCL`'
  - '관리 시스템·파티션 상태(읽기): `lssyscfg -r sys -F name,state` 와 `lssyscfg -r lpar -m <managed_system> -F name,state` — No Connection·Incomplete 이면 HMC 연결 문제'
  short:
  - '(2차·승인 후, 롤백: 변경 전 HMC 콘솔 데이터 백업 `bkconsdata`) HSCL 번호를 HMC 도움말 메시지 설명과 대조해 HMC-서버(FSP) 연결 복구는 HMC 담당이 수행'
  mid:
  - HMC 판을 관리 대상 서버 펌웨어 지원 범위(IBM FLRT)와 맞춤
  long:
  - HMC 콘솔 이벤트(HSCL) 감시와 HMC 이중화 구성 검토
  source_note: 'legacy-analyzer-v2.2 rules.json AIX_HSCL\w+_6ff8 (원 출처: scraped)'
  versions:
  - AIX 5.3
  - AIX 6.1
  - AIX 7.1
  - AIX 7.2
  - AIX 7.3
  version_note: HMC HSCL 메시지 — HMC 버전 기준(AIX 무관)
