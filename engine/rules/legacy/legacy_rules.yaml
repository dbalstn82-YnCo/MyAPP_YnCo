# 기존 'AI 로그분석기 v2.2' 내장 룰에서 변환 반입(tools/import_legacy_rules.py) — 중복(코드·패턴) 제외
# 심각도 CRITICAL→critical HIGH→error MEDIUM→warn LOW→info · immediate_actions→즉시 · root_actions→중기 · negative_patterns→exclude
rules:
- id: LEG-ORACLE-ORA-001-0AEE
  layer: db
  product:
  - oracle
  match:
    regex: (?:ORA\-001)
  severity: warn
  category: internal
  verdict: Oracle ORA-001xx 오류(공유 서버·디스패처·리스너 파라미터·XA 대역) 발생 — 정확한 번호는 로그 원문 참조
  immediate:
  - 'alert log 에서 ORA-001 로 시작하는 정확한 번호(ORA-00100~00199)와 전후 문맥 확인: `grep -n ''ORA-001'' $ORACLE_BASE/diag/rdbms/<db>/<SID>/trace/alert_<SID>.log | tail -20` (11g+ ADR 경로)'
  - '번호의 공식 문구 확인: `oerr ora <번호>` (Unix/Linux, 예: oerr ora 132) — 001xx 대역은 공유 서버·디스패처(00101~00118)·리스너 파라미터(00119·00132)·XA 분산 트랜잭션(00150~00165) 오류이므로 신규 접속 실패 동반 여부로 심각도 판단'
  - '디스패처·공유 서버 상태 조회(읽기): `SELECT name,status,accept,messages FROM v$dispatcher;` 와 `SHOW PARAMETER local_listener` — 디스패처 없음·리스너 별칭 미해석이면 원인 후보'
  short:
  - '(2차·승인 후, 롤백: 변경 전 `CREATE PFILE=''<path>/init_<SID>_bak.ora'' FROM SPFILE;`) ORA-00119/00132 이면 LOCAL_LISTENER·REMOTE_LISTENER 값을 해석 가능한 별칭 또는 (ADDRESS=…) 형식으로 수정'
  - (2차·승인 후) ORA-00104·00115(공유 서버·디스패처 한도) 이면 SHARED_SERVERS·MAX_SHARED_SERVERS·DISPATCHERS 상향을 DBA 가 spfile 백업 후 적용
  - ORA-0015x(XA) 이면 WAS 트랜잭션 매니저 로그와 DBA_2PC_PENDING 을 대조해 미결 트랜잭션 처리 방침을 업무 담당과 결정
  mid:
  - 공유 서버가 필요 없는 업무는 전용 서버(SERVER=DEDICATED) 접속으로 표준화하고 디스패처·공유 서버 수를 V$SHARED_SERVER_MONITOR 최대값 기준으로 재산정
  long:
  - alert log 의 ORA-001xx 발생 건수를 일 단위 감시 항목에 등록하고 파라미터 변경은 spfile 백업·변경 이력 관리 절차로 통제
  source_note: 'legacy-analyzer-v2.2 rules.json ORACLE_ORA_001_0aee (원 출처: scraped)'
  versions:
  - Oracle 10gR2
  - Oracle 11gR1/11gR2
  - Oracle 12cR1
  - Oracle 12cR2/18c
  - Oracle 19c
  - Oracle 21c
  - Oracle 23ai/26ai
  version_note: ORA/TNS 코드·alert log 문구 — 10gR2~26ai 공통
- id: LEG-ORACLE-SP2-001-4653
  layer: db
  product:
  - oracle
  match:
    regex: (?:SP2\-001)|(?:SP2-\d+)
  severity: warn
  category: internal
  verdict: SQL*Plus 클라이언트 오류(SP2-…) 발생 — 번호별 의미는 로그 원문·SQL*Plus 오류 메시지 참조
  immediate:
  - 'SP2 번호와 실행 주체(배치 스크립트·cron·사용자) 확인: `grep -n ''SP2-'' <배치로그경로> | tail -20` — SP2 는 SQL*Plus 클라이언트 오류로 DB 인스턴스 장애가 아님'
  - '번호로 원인 구분: SP2-0310(스크립트 파일 열기 실패)·SP2-0157(접속 3회 실패)·SP2-0640(미접속 상태 실행)·SP2-0734(알 수 없는 명령) — SQL*Plus User''s Guide and Reference 의 오류 메시지 부록과 대조'
  - '같은 시각 접속 경로 확인(읽기): `tnsping <서비스명>` — 성공이면 스크립트 경로·문법 문제, 실패면 TNS- 코드로 DB/네트워크 담당 이관'
  short:
  - '(2차·승인 후, 롤백: 수정 전 스크립트 사본 보관) SP2-0310 이면 스크립트 경로·권한·문자셋(BOM) 확인 후 배치 정의 수정'
  - SP2-0157 이면 접속 문자열·계정 잠금(ORA-28000) 여부를 DBA 와 확인, 계정 잠금 해제는 보안 담당 승인 후
  mid:
  - 배치 스크립트 앞부분에 `WHENEVER SQLERROR EXIT SQL.SQLCODE` 와 `WHENEVER OSERROR EXIT FAILURE` 를 넣어 실패를 종료 코드로 감지
  long:
  - SQL*Plus 배치의 종료 코드·SP2 메시지를 작업 스케줄러 감시 항목으로 등록하고 클라이언트(Instant Client) 판을 DB 판과 맞춰 관리
  source_note: 'legacy-analyzer-v2.2 rules.json ORACLE_SP2_001_4653 (원 출처: scraped)'
  versions:
  - Oracle 10gR2
  - Oracle 11gR1/11gR2
  - Oracle 12cR1
  - Oracle 12cR2/18c
  - Oracle 19c
  - Oracle 21c
  - Oracle 23ai/26ai
  version_note: ORA/TNS 코드·alert log 문구 — 10gR2~26ai 공통
- id: LEG-ORACLE-PLS-001-B3AE
  layer: db
  product:
  - oracle
  match:
    regex: (?:PLS\-001)
  severity: warn
  category: internal
  verdict: 시스템 오류 — PLS-001 발생
  immediate:
  - '컴파일 오류 대상 객체·줄 확인(읽기): `SELECT owner,name,type,line,position,text FROM dba_errors WHERE text LIKE ''PLS-001%'' ORDER BY owner,name,sequence;`'
  - 'INVALID 객체 수 확인: `SELECT owner,object_type,COUNT(*) FROM dba_objects WHERE status=''INVALID'' GROUP BY owner,object_type;` — 최근 배포·DDL 직후 급증이면 배포 결함'
  - PLS-00103(Encountered the symbol, 문법 오류) 등 번호와 객체·줄을 기록해 개발팀 전달 — DB 인스턴스 장애 아님
  short:
  - '(2차·승인 후, 롤백: 수정 전 `DBMS_METADATA.GET_DDL` 로 추출한 소스로 재생성) 오류 객체 소스 수정 후 `ALTER PROCEDURE <name> COMPILE;` 또는 `@?/rdbms/admin/utlrp.sql` 로 재컴파일'
  mid:
  - PL/SQL 배포 전 검증 단계에서 dba_errors 0건 확인을 필수 관문으로 두고 개발계에서 PLSQL_WARNINGS='ENABLE:ALL' 로 사전 경고 수집
  long:
  - PL/SQL 소스를 형상관리에 두고 배포 후 INVALID 객체 수(0 유지) 감시 항목 등록
  source_note: 'legacy-analyzer-v2.2 rules.json ORACLE_PLS_001_b3ae (원 출처: scraped)'
  versions:
  - Oracle 10gR2
  - Oracle 11gR1/11gR2
  - Oracle 12cR1
  - Oracle 12cR2/18c
  - Oracle 19c
  - Oracle 21c
  - Oracle 23ai/26ai
  version_note: ORA/TNS 코드·alert log 문구 — 10gR2~26ai 공통
- id: LEG-TIBERO-TBR-001-D666
  layer: db
  product:
  - tibero
  match:
    regex: (?:TBR\-001)
  severity: warn
  category: internal
  verdict: 시스템 오류 — TBR-001 발생
  immediate:
  - 'sys.log 에서 TBR- 정확한 번호와 앞뒤 [E]/[F] 줄 확인: `grep -n ''TBR-'' $TB_HOME/instance/$TB_SID/log/slog/sys.log | tail -30`'
  - '인스턴스 상태 확인(읽기): `ps -ef | grep [t]bsvr` 와 tbsql 접속 후 `SELECT status FROM v$instance;` — NORMAL(OPEN) 이 아니면 즉시 2차 통보'
  - 번호 설명은 TmaxTibero 에러 참조 안내서(Error Reference)에서 확인하고 연관 업무(배치·세션)와 발생 시각 기록
  short:
  - '(2차·승인 후, 롤백: `$TB_HOME/config/$TB_SID.tip` 백업본 복원 후 재기동) 번호가 가리키는 대상(테이블스페이스·세션·파일)에 맞는 조치를 Tibero 담당이 수행'
  mid:
  - sys.log 의 [E]/[F] 등급 TBR 코드 빈도를 주간 집계해 반복 코드는 개별 룰·절차로 승격
  long:
  - Tibero 패치(FS) 수준을 TmaxTibero 기술지원 권고 판으로 유지하고 tip 파일 변경 이력 관리
  source_note: 'legacy-analyzer-v2.2 rules.json TIBERO_TBR_001_d666 (원 출처: scraped)'
  versions:
  - Tibero 4
  - Tibero 5/5 SP1
  - Tibero 6
  - Tibero 7
  version_note: TBR 코드·문구 — 4~7 공통(번호 재편 근거 없음)
- id: LEG-TIBERO-TBRU-001-62FE
  layer: db
  product:
  - tibero
  match:
    regex: (?:TBRU\-001)
  severity: warn
  category: internal
  verdict: 시스템 오류 — TBRU-001 발생
  immediate:
  - 'TBRU 메시지를 남긴 유틸리티(tbexport·tbimport·tbloader 등)와 작업 로그 확인: `grep -n ''TBRU-'' <작업로그경로> | tail -20`'
  - '대상 DB 상태 확인(읽기): tbsql 접속 후 `SELECT status FROM v$instance;` — DB 정상이면 유틸리티 인자·파일 경로·공간 문제로 분류'
  short:
  - '(2차·승인 후, 롤백: 작업 전 백업본으로 복원) 실패한 export/import/load 작업을 원인(경로·권한·공간) 해소 후 재실행, 부분 적재분 처리 방침은 업무 담당과 결정'
  mid:
  - 유틸리티 작업 스크립트에 종료 코드 검사와 작업 로그 보관(최근 30일) 추가
  long:
  - TBRU 코드 체계를 TmaxTibero 기술지원에 확인해 코드별 조치표로 정리하고 개별 룰로 승격
  source_note: 'legacy-analyzer-v2.2 rules.json TIBERO_TBRU_001_62fe (원 출처: scraped)'
  versions:
  - Tibero 4
  - Tibero 5/5 SP1
  - Tibero 6
  - Tibero 7
  version_note: TBRU 유틸리티 코드 — 도입 버전 미확인
- id: LEG-TIBERO-TPR-001-D40A
  layer: db
  product:
  - tibero
  match:
    regex: (?:TPR\-001)
  severity: warn
  category: internal
  verdict: 시스템 오류 — TPR-001 발생
  immediate:
  - 'TPR(Tibero Performance Repository) 스냅샷 작업 오류 확인: `grep -n ''TPR-'' $TB_HOME/instance/$TB_SID/log/slog/sys.log | tail -20`'
  - '테이블스페이스 여유 확인(읽기): tbsql 에서 `SELECT tablespace_name, SUM(bytes)/1048576 free_mb FROM dba_free_space GROUP BY tablespace_name;` — 여유 부족이면 스냅샷 저장 실패 원인'
  short:
  - '(2차·승인 후, 롤백: 변경 전 파라미터 값 기록) TPR 저장 테이블스페이스 증설 또는 TPR 수집 설정 조정 — 파라미터 이름은 TmaxTibero 기술지원 확인 후 적용'
  mid:
  - TPR 스냅샷 실패가 반복되면 성능 이력 공백이 생기므로 TPR 저장 공간 사용률 85% 감시 임계 등록
  long:
  - '성능 이력(TPR) 보관 기간을 장애 분석 요구 기간(예: 30일)에 맞춰 표준화'
  source_note: 'legacy-analyzer-v2.2 rules.json TIBERO_TPR_001_d40a (원 출처: scraped)'
  versions:
  - Tibero 4
  - Tibero 5/5 SP1
  - Tibero 6
  - Tibero 7
  version_note: TPR 코드 — 도입 버전 미확인
- id: LEG-ALTIBASE-ERR-W-036F
  layer: db
  product:
  - altibase
  match:
    regex: (?:ERR\-\\w\+)|(?:ERR-\w+)
  severity: warn
  category: internal
  verdict: Altibase 오류 코드(ERR-…) 발생 — 코드별 의미는 코드 사전 참조
  immediate:
  - 'trc 로그에서 ERR- 코드와 직전 문맥 확인: `grep -n ''ERR-'' $ALTIBASE_HOME/trc/*.log | tail -30`'
  - '서버 상태 확인(읽기): `ps -ef | grep [a]ltibase` 와 iSQL 접속 후 `SELECT STARTUP_PHASE FROM V$INSTANCE;` — SERVICE 단계가 아니면 즉시 2차 통보'
  - ERR 코드(16진 5자리)를 Altibase Error Message Reference 에서 찾아 대상(세션·테이블스페이스·복제)으로 분류
  short:
  - '(2차·승인 후, 롤백: altibase.properties 백업본 복원) 코드가 가리키는 대상별 조치(메모리 테이블스페이스 증설·세션 정리·복제 재시작)를 Altibase 담당이 수행'
  mid:
  - trc 로그 ERR- 코드 빈도를 주간 집계해 반복 코드는 개별 룰·절차로 승격
  long:
  - Altibase 패치 수준을 기술지원 권고 판으로 유지하고 altibase.properties 변경 이력 관리
  source_note: 'legacy-analyzer-v2.2 rules.json ALTIBASE_ERR_\w+_036f (원 출처: scraped)'
  versions:
  - Altibase 5.x
  - Altibase 6.1.1
  - Altibase 6.3.1/6.5.1
  - Altibase 7.1
  - Altibase 7.3
  version_note: ERR 코드·문구 — 5.x~7.3 공통(6.1.1 이하 10진 코드는 파서 변환)
- id: LEG-ALTIBASE-0XX-5661
  layer: db
  product:
  - altibase
  match:
    regex: (?:0xX\+)|(?:0x[0-9A-Fa-f]+)
  severity: warn
  category: internal
  verdict: Altibase 16진 오류 코드(0x…) 발생 — 코드별 의미는 코드 사전 참조(선별력 낮은 일반 패턴)
  immediate:
  - '16진 값이 Altibase 오류 코드(예: 0x410E3 = ERR-410E3)인지 메모리 주소(콜스택)인지 문맥으로 구분: `grep -n ''0x'' $ALTIBASE_HOME/trc/*.log | tail -30`'
  - 오류 코드면 ERR-<16진> 으로 바꿔 Error Message Reference 에서 원인 확인, 주소 값이면 서버 비정상 종료 여부를 `ps -ef | grep [a]ltibase` 로 확인
  short:
  - (2차) 콜스택·덤프가 동반되면 Altibase 기술지원 의뢰 자료(trc 디렉터리 전체·altibase.properties·제품 판 정보)를 수집해 전달 승인 요청
  mid:
  - 16진 일반 패턴은 선별력이 낮으므로 ERR- 코드 룰과 함께 판정하고 단독 발생 건은 참고(info) 성격으로 검토
  long:
  - 로그 파서에서 0x 코드를 ERR 코드로 바꾸는 변환 표를 관리해 오탐을 줄임
  source_note: 'legacy-analyzer-v2.2 rules.json ALTIBASE_0xX+_5661 (원 출처: scraped)'
  versions:
  - Altibase 5.x
  - Altibase 6.1.1
  - Altibase 6.3.1/6.5.1
  - Altibase 7.1
  - Altibase 7.3
  version_note: ERR 코드·문구 — 5.x~7.3 공통(6.1.1 이하 10진 코드는 파서 변환)
- id: LEG-JEUS-SERVER-001-73A6
  layer: was
  product:
  - jeus
  match:
    regex: (?:SERVER\-001)|(?:SERVER-\d+)
  severity: warn
  category: internal
  verdict: JEUS 서버 메시지(SERVER-…) 발생 — 번호·상태 전이는 로그 원문 참조
  immediate:
  - "서버 로그에서 SERVER- 번호와 상태 흐름 확인: `grep -n 'SERVER-[0-9]' $DOMAIN_HOME/servers/<server>/logs/JeusServer.log | tail -30` (JEUS 7+)"
  - "서버 상태 조회(읽기): `$JEUS_HOME/bin/jeusadmin -host localhost:9736 -u <user>` 접속(비밀번호는 프롬프트 입력) 후 `server-info` — RUNNING 이 아니면(STANDBY·SHUTDOWN) 2차 통보"
  - "SERVER-0250(STANDBY 유지)·SERVER-0248(RUNNING 진입) 등 번호를 기록하고 Launcher 로그 `tail -n 100 $DOMAIN_HOME/servers/<server>/logs/JeusLauncher.log` 와 대조"
  short:
  - '(2차·승인 후, 롤백: 직전 domain.xml 백업본 복원) STANDBY 원인(포트 충돌·MASTER 통신·설정 오류) 해소 후 `startManagedServer -server <server>` 로 기동'
  mid:
  - JeusServer.log 의 SERVER- 경고·오류 코드를 감시 항목으로 등록하고 기동 실패 시 Launcher 로그 자동 수집
  long:
  - JEUS Fix 수준과 domain.xml 변경 이력을 형상관리로 통제
  source_note: 'legacy-analyzer-v2.2 rules.json JEUS_SERVER_001_73a6 (원 출처: scraped)'
  versions:
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
