  - JDBC 드라이버 최신 버전 업그레이드
  - 커넥션 풀 설정 최적화
  long:
  - "DB·드라이버 판 호환표 관리와 ORA 오류 코드별 건수 감시"
  source_note: 'legacy-analyzer-v2.2 jboss_rules.json WFLY-ORA-JDBC (원 출처: builtin)'
  exclude: (?:WebContainer)
  versions:
  - JBoss EAP 6.x (AS 7)
  - JBoss EAP 7.0~7.4 (WildFly 10~23)
  - JBoss EAP 8.0/8.1 (WildFly 28+)
  version_note: Oracle JDBC 드라이버 클래스 — 버전 무관
