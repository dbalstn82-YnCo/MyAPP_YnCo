# 기존 'AI 로그분석기 v2.2' 내장 룰에서 변환 반입(tools/import_legacy_rules.py) — 중복(코드·패턴) 제외
# 심각도 CRITICAL→critical HIGH→error MEDIUM→warn LOW→info · immediate_actions→즉시 · root_actions→중기 · negative_patterns→exclude
rules:
- id: LEG-WEBTOB-DOWN
  layer: web
  product:
  - webtob
  match:
    regex: (?:wbsvr.*down)|(?:wsadmin.*down)|(?:htts.*error)|(?:WebtoB.*stop)|(?:wbsvr.*crash)|(?:wbsvr.*terminated)
  severity: critical
  category: internal
  verdict: WebtoB 프로세스 다운 — WebtoB 데몬(wbsvr) 비정상 종료
  immediate:
  - '`ps -ef | grep -E "[w]sm|[h]tl|[h]th"` 로 WebtoB 프로세스(WSM·HTL·HTH) 생존 확인'
  - '`ls -lt $WEBTOBDIR/log | head` 로 최근 로그를 찾아 종료 직전 오류 확인, `dmesg -T | tail -20` 로 OOM 확인'
  short:
  - '(2차·승인 후, 롤백: 없음 — 기동 확인으로 대체) 웹 서비스 전체 중단 상태 — 로그·코어 보존 후 `wsdown` → `wsboot` 재기동, `wsadmin` `st -p` 로 정상 확인'
  mid:
  - '$WEBTOBDIR/config/http.m 설정 검토, 코어 발생 시 분석, WebtoB 패치(Fix) 적용'
  long:
  - 'WebtoB 프로세스 생존·서비스 포트 감시'
  source_note: 'legacy-analyzer-v2.2 webtob_rules.json WEBTOB-DOWN (원 출처: builtin)'
  versions:
  - WebtoB 4.1
  - WebtoB 5.x
  - WebtoB 6.x
  version_note: 문구 기반
- id: LEG-WEBTOB-SSL
  layer: web
  product:
  - webtob
  match:
    regex: (?:WebtoB.*ssl)|(?:htts.*ssl)|(?:certificate.*expire.*webtob)|(?:ssl.*fail.*wbsvr)
  severity: error
  category: security
  verdict: WebtoB SSL 인증서 오류 — SSL 인증서 만료 또는 설정 오류
  immediate:
  - 'WebtoB 5: `grep -n -i -E "SSLFlag|SSLName|CertificateFile|CertificateKeyFile|CertificateChainFile" $WEBTOBDIR/config/http.m` 로 NODE/VHOST 의 SSLName 이 가리키는 *SSL 절의 인증서·키·체인 경로 확인 / WebtoB 6: `grep -rn -i -E "ssl_configs|certificate_file|certificate_key_file" $WEBTOBDIR/config/` 로 ssl_configs 절의 인증서·키 경로 확인(WebtoB 6 Administrator Guide SSL Section) — 이어 `openssl x509 -enddate -noout -in <인증서>` 로 만료일'
  - '체인·호스트 검증 — 출력을 grep 으로 걸러 실패를 가리지 말고 전체를 남긴다: `openssl s_client -connect <host>:<port> -servername <host> -verify_hostname <host> -verify_return_error </dev/null > ~/s_client.txt 2>&1 ; echo "종료 코드=$?"` (OpenSSL 1.1.0+/3) 뒤 파일의 "Verify return code" 를 읽는다 — 0 (ok) 가 아니면 그 코드(10 만료·62 호스트 불일치·18/19 자체 서명·20/21 중간 인증서 누락 또는 신뢰 기준(사내 CA) 없음 — 사내 CA 면 `-CAfile <ca.pem>` 을 붙여 다시), 그 줄이 없고 connect/errno 오류면 검증이 아니라 연결 실패'
  - '인증서·키 짝(RSA·EC 무관): `set -o pipefail` 뒤 `openssl x509 -in <인증서> -noout -pubkey | openssl sha256` 와 `openssl pkey -in <키> -pubout | openssl sha256` 값 비교, 각 명령의 종료 코드(`echo $?`)가 0 일 때만 유효 — 어느 쪽이든 실패(권한 거부·형식 오류)면 빈 입력 해시끼리 같아 보일 수 있어 비교 무효 · 키 읽기 권한 필요, 개인 키 내용은 출력·복사하지 않음(-pubout 은 공개 키만), 암호 걸린 키는 프롬프트에서 입력'
  short:
  - '(2차·승인 후, 롤백: 이전 인증서·키·http.m 복원) HTTPS 접속 불가 상태 — 인증서·체인 교체 후 WebtoB 5 는 `wscfl -i http.m` 컴파일·재기동 일정에 적용(WebtoB 6 은 그 판 적용 방법 확인)'
  mid:
  - '인증서 자동 갱신 알림 설정과 중간 인증서 체인 포함 확인'
  long:
  - '인증서 만료 60/30/7일 전 경보'
  source_note: 'legacy-analyzer-v2.2 webtob_rules.json WEBTOB-SSL (원 출처: builtin)'
  versions:
  - WebtoB 4.1
  - WebtoB 5.x
  - WebtoB 6.x
  version_note: 문구 기반
  verify_note: "미검증 — WebtoB 6 은 ssl_configs 절의 certificate_file·certificate_key_file 까지 Administrator Guide 'SSL Section' 으로 확인(2차 교차 검토), 체인·CA 항목 이름과 설정 적용(컴파일·재적재) 방법은 docs.tmaxsoft.com 접속 불가로 확인 못 함(WebtoB 5 의 *SSL 절 CertificateFile·CertificateKeyFile·CertificateChainFile 과 NODE/VHOST 의 SSLFlag·SSLName 은 WebtoB 5 관리자 안내서 3.17 로 확인)"
- id: LEG-WEBTOB-MAXPROC
  layer: web
  product:
  - webtob
  match:
    regex: (?:too many.*webtob)|(?:MaxProc.*webtob)|(?:wbsvr.*max.*proc)|(?:MAXPROC.*exceeded)
  severity: error
  category: capacity
  verdict: WebtoB 최대 프로세스 초과 — WebtoB 최대 처리 프로세스 초과
  immediate:
  - '`$WEBTOBDIR/bin/wsadmin` 접속 후 `st -p` 로 처리 프로세스 상태, `cfg` 로 MinProc·MaxProc 확인'
  - '`grep -n -i "MaxProc" $WEBTOBDIR/config/http.m` 로 설정 파일 값 확인(읽기 전용)'
  short:
  - '(2차·승인 후, 롤백: http.m 백업 복원) 신규 요청 거부 상태 — 백엔드 지연이 아니면 *SERVER MaxProc 상향 후 `wscfl -i http.m` 컴파일·재기동 일정 협의'
  mid:
  - 'MaxProc 를 피크 동시 요청량·JEUS 처리 스레드 기준으로 재산정'
  long:
  - '처리 프로세스 사용률 80% 경보'
  source_note: 'legacy-analyzer-v2.2 webtob_rules.json WEBTOB-MAXPROC (원 출처: builtin)'
  versions:
  - WebtoB 4.1
  - WebtoB 5.x
  - WebtoB 6.x
  version_note: 문구 기반
- id: LEG-WEBTOB-WAS
  layer: web
  product:
  - webtob
  match:
    regex: (?:webtob.*jeus.*connect.*fail)|(?:htts.*was.*error)|(?:webtob.*tmax)|(?:SYSLOG_FAIL)
  severity: error
  category: capacity
  verdict: WebtoB-WAS 연동 오류 — WebtoB와 WAS(JEUS/Tmax) 간 연동 실패
  immediate:
  - '`$WEBTOBDIR/bin/wsadmin` 접속 후 `si` 로 JSV(JEUS) 서버 프로세스 상태, `st -s` 로 JSV 큐 대기 확인 — si 에 JSV 프로세스가 없거나 0 이면 JEUS 쪽 장애(조회만)'
  - 'WAS(JEUS) 프로세스 기동 상태를 WAS 담당과 확인, `grep -n -i "JSVPORT" $WEBTOBDIR/config/http.m` 로 연동 포트 확인'
  short:
  - '(2차) 동적 요청 처리 불가 상태 — JEUS 복구 요청, 포트·방화벽 문제면 네트워크 담당 해제 요청(승인 후)'
  mid:
  - 'WebtoB ↔ WAS 연동 포트·주소·연결 수 설정 검토'
  long:
  - 'JSV 연결 수·큐 대기 수 감시'
  verify_note: "미검증 — wsadmin ci/si 출력 항목 원문 대조 못 함(WebtoB 5.x 기준 si=서버(JSV 등) 정보·ci=클라이언트 접속 정보로 보고 si 로 고침, 6.x 는 별칭 체계가 다를 수 있어 설치본 wsadmin 의 help 로 확인)"
  source_note: 'legacy-analyzer-v2.2 webtob_rules.json WEBTOB-WAS (원 출처: builtin)'
  versions:
  - WebtoB 4.1
  - WebtoB 5.x
  - WebtoB 6.x
  version_note: 문구 기반
- id: LEG-WEBTOB-CONFIG
  layer: web
  product:
  - webtob
  match:
    regex: (?:wbconfig.*error)|(?:wbsvr.m.*syntax)|(?:WebtoB.*config.*invalid)
  severity: error
  category: internal
  verdict: WebtoB 설정 오류 — wbsvr.m 설정 파일 문법 또는 값 오류
  immediate:
  - '`ls -l $WEBTOBDIR/config/` 로 http.m 과 컴파일본(wsconfig) 수정 시각 비교'
  - '`diff <백업 http.m> $WEBTOBDIR/config/http.m` 로 최근 변경 줄 확인(읽기 전용)'
  short:
  - '(2차·승인 후, 롤백: 백업 http.m·wsconfig 복원) WebtoB 기동 불가 상태 — 오류 줄 수정 또는 직전 정상 http.m 복원 후 `wscfl -i http.m` 컴파일 성공 확인'
  mid:
  - '설정 변경 전 백업과 WebtoB 관리자 안내서의 환경 파일 항목 기준 검토'
  long:
  - 'http.m 버전 관리와 변경 이력 기록'
  source_note: 'legacy-analyzer-v2.2 webtob_rules.json WEBTOB-CONFIG (원 출처: builtin)'
  versions:
  - WebtoB 4.1
  - WebtoB 5.x
  - WebtoB 6.x
  version_note: 문구 기반
- id: LEG-WEBTOB-LOG
  layer: web
  product:
  - webtob
  match:
    regex: (?:disk.*full.*webtob)|(?:No space.*wbsvr)|(?:webtob.*log.*full)
  severity: error
  category: disk
  verdict: WebtoB 디스크 공간 부족 — WebtoB 로그 파일 디스크 고갈
  immediate:
  - '`df -h $WEBTOBDIR/log` 와 `df -i $WEBTOBDIR/log` 로 공간·inode 확인'
  - '`ls -lS $WEBTOBDIR/log | head` 로 큰 로그 파일 확인(정리는 2차)'
  short:
  - '(2차·승인 후, 롤백: 옮긴 파일 원위치) 로그 기록 불가 상태 — 오래된 로그를 다른 볼륨으로 이동·압축해 공간 확보'
  mid:
  - 'WebtoB 로그 순환 설정과 별도 로그 파티션 구성'
  long:
  - '로그 볼륨 사용률 85%/95% 경보'
  source_note: 'legacy-analyzer-v2.2 webtob_rules.json WEBTOB-LOG (원 출처: builtin)'
  versions:
  - WebtoB 4.1
  - WebtoB 5.x
  - WebtoB 6.x
  version_note: 문구 기반
- id: LEG-WTB-JEUS-CONN-FAIL
  layer: web
  product:
  - webtob
  match:
    regex: (?:WebtoBConnectionManager)|(?:WebtoBConnector)|(?:WJPV2Registration)|(?:registerToWebtoB)|(?:\[WEB-3347\])|(?:\[WEB-3346\])|(?:Connecting to WebtoB.*failed)|(?:Check if WebtoB is running)|(?:WebtoBConnectionManager\.createConnection)|(?:jsvgroup.*connection.*fail)
  severity: error
  category: connection
  verdict: WebtoB↔JEUS WJP 연결 실패
  immediate:
  - '`ps -ef | grep -E "[w]sm|[h]tl|[h]th"` 로 WebtoB 기동 상태 확인'
  - '`$WEBTOBDIR/bin/wsadmin` 접속 후 `si` 로 JSV(JEUS) 서버 프로세스 상태 확인, `grep -n -i "JSVPORT" $WEBTOBDIR/config/http.m` 로 연동 포트 확인'
  short:
  - '(2차) 웹 서비스 중단 상태 — WebtoB 미기동이면 승인 후 `wsboot`, JEUS 쪽 WebtoB 연결 설정(주소·포트)과 http.m 대조 후 불일치 정정(롤백: 설정 원복)'
  mid:
  - 'JEUS 서버 IP/포트와 WebtoB JSV 설정 일치 검증 절차'
  long:
  - 'WebtoB-JEUS 연결 수 감시'
  verify_note: "미검증 — wsadmin ci/si 출력 항목 원문 대조 못 함(WebtoB 5.x 기준 si=서버(JSV 등) 정보·ci=클라이언트 접속 정보로 보고 si 로 고침, 6.x 는 별칭 체계가 다를 수 있어 설치본 wsadmin 의 help 로 확인)"
  source_note: 'legacy-analyzer-v2.2 webtob_rules.json WTB-JEUS-CONN-FAIL (원 출처: builtin)'
  exclude: (?:JeusDeploymentException)
  versions:
  - WebtoB 4.1
  - WebtoB 5.x
  - WebtoB 6.x
  version_note: JEUS 쪽 클래스명(WebtoBConnectionManager 등) — JEUS 6~9 공통
- id: LEG-WTB-WJP-ALL
  layer: web
  product:
  - webtob
  match:
    regex: (?:\[WEB-3346\])|(?:\[WEB-3347\])|(?:\[WEB-3348\])|(?:\[WEB-3349\])|(?:\[WEB-3350\])|(?:WebtoBConnectionManager)|(?:WebtoBConnector)|(?:WJPV2Registration)|(?:WebtoBConnectionManager\.registerToWebtoB)|(?:WebtoBConnectionManager\.createConnection)|(?:WebtoBConnector\.run)|(?:WJPV2Registration\.readRegstrationReply)|(?:Connecting
      to WebtoB.*failed)|(?:registerToWebtoB.*failed)|(?:Check if WebtoB is running)|(?:Socket\[unconnected\].*WebtoB)|(?:java\.io\.EOFException.*WebtoB)|(?:Connection refused.*WebtoB)|(?:wbsvr.*not running)|(?:WebtoB.*not.*running)|(?:WebtoB.*down)|(?:wbsvr.*error)
  severity: error
  category: connection
  verdict: WebtoB WJP 연결 상태 전체 계열
  immediate:
  - '`ps -ef | grep -E "[w]sm|[h]tl|[h]th"` 로 WebtoB 프로세스 확인'
  - '`grep -n -i "JSVPORT" $WEBTOBDIR/config/http.m` 로 JSV 포트 확인 후 `ss -ltn | grep ":<JSV포트> "` 로 LISTEN 확인(기본값 9900 은 환경별 확인)'
  - '`$WEBTOBDIR/bin/wsadmin` 접속 후 `si` 로 JSV(JEUS) 서버 프로세스 상태 확인(조회만)'
  short:
  - '(2차) 웹 서비스 전체 중단 상태 — WebtoB 미기동이면 승인 후 `wsboot`, 포트·방화벽 문제면 네트워크 담당 해제 요청'
  mid:
  - 'JSV 설정 검토·수정 후 `wscfl -i http.m` 컴파일(승인 후, 롤백: http.m 백업 복원)'
  long:
  - 'WJP 연결 실패 건수·JSV 연결 수 감시'
  verify_note: "미검증 — wsadmin ci/si 출력 항목 원문 대조 못 함(WebtoB 5.x 기준 si=서버(JSV 등) 정보·ci=클라이언트 접속 정보로 보고 si 로 고침, 6.x 는 별칭 체계가 다를 수 있어 설치본 wsadmin 의 help 로 확인)"
  source_note: 'legacy-analyzer-v2.2 webtob_rules.json WTB-WJP-ALL (원 출처: builtin)'
  versions:
  - WebtoB 4.1
  - WebtoB 5.x
  - WebtoB 6.x
  version_note: JEUS [WEB-33xx] 코드 — JEUS 6~9 공통
- id: LEG-WTB-CONFIG-ERR
  layer: web
  product:
  - webtob
  match:
    regex: (?:wbconfig.*error)|(?:wbsvr\.m.*error)|(?:webtob\.m.*syntax)|(?:WebtoB.*configuration.*error)|(?:wbconfig.*invalid)|(?:Jsvgroup.*error)|(?:jsvgroup.*not.*found)|(?:WebtoB.*init.*fail)|(?:wbsvr.*start.*fail)
  severity: error
  category: internal
  verdict: WebtoB 설정 오류 계열 — WebtoB 설정 파일(webtob.m/wbsvr.m) 오류
  immediate:
  - '`ls -l $WEBTOBDIR/config/` 로 http.m·wsconfig 수정 시각 확인, 변경 전 백업 존재 확인'
  - '`grep -n -i "JSV\|SVRGROUP" $WEBTOBDIR/config/http.m` 로 JSV 서버 그룹 설정 확인(읽기 전용)'
  short:
  - '(2차·승인 후, 롤백: 백업 http.m·wsconfig 복원) WebtoB 기동 불가 또는 JEUS 연동 불가 상태 — 오류 수정 후 `wscfl -i http.m` 컴파일 성공 시 `wsboot`'
  mid:
  - 'JSV 서버 그룹 설정 검토 기준'
  long:
  - 'http.m 버전 관리와 변경 이력 기록'
  source_note: 'legacy-analyzer-v2.2 webtob_rules.json WTB-CONFIG-ERR (원 출처: builtin)'
  versions:
  - WebtoB 4.1
  - WebtoB 5.x
  - WebtoB 6.x
  version_note: 문구 기반
- id: LEG-WTB-PROCESS-DOWN
  layer: web
  product:
  - webtob
  match:
    regex: (?:\bwbsvr\b.*down)|(?:WebtoB.*stop)|(?:WebtoB.*crash)|(?:wbsvr.*terminated)|(?:WebtoB.*process.*killed)|(?:WebtoB.*not.*respond)|(?:wbsvr.*abnormal)|(?:webtob.*서비스.*중단)
  severity: critical
  category: internal
  verdict: WebtoB 프로세스 다운/재기동 — WebtoB 웹 서버 프로세스 다운 또는 비정상 종료
  immediate:
  - '`ps -ef | grep -E "[w]sm|[h]tl|[h]th"` 로 프로세스 확인'
  - '`ls -lt $WEBTOBDIR/log | head` 로 최근 로그를 찾아 종료 직전 오류 확인'
  - '`$WEBTOBDIR/bin/wsadmin` 접속 가능하면 `st -p` 로 프로세스 상태 확인'
  short:
  - '(2차·승인 후, 롤백: 없음 — 기동 확인으로 대체) 웹 서비스 전체 중단 상태 — 로그·코어 보존 후 `wsdown` → `wsboot` 재기동'
  mid:
  - '비정상 종료 원인 분석 후 근본 조치(패치·자원 한도)'
