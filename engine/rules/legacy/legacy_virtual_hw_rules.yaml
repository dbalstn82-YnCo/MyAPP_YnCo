  version_note: 키워드 기반 공통 룰(HW·네트워크·스토리지·가상화·일반) — 제품·버전 무관
- id: LEG-VMW-RESOURCE-CONTENTION
  layer: os
  product:
  - '*'
  match:
    regex: (?:resource.*contention.*vmware)|(?:CPU.*ready.*high)|(?:memory.*balloon.*vmware)|(?:swap.*vmware)|(?:co-stop.*high)|(?:memory.*compressed)
  severity: error
  category: memory
  verdict: VMware 리소스 경합 — VMware 클러스터 CPU/메모리 자원 경합
  immediate:
  - VM 성능 차트에서 CPU 준비(%RDY)·Co-stop·Balloon·Swap 확인(읽기) — 단일 VM 인지 호스트 전체인지 구분
  - '호스트 실시간: 대화형 `esxtop` 의 c(CPU)·m(메모리) 화면 — %RDY 10% 이상·SWCUR 0 초과면 경합'
  - 리소스 사용 상위 VM 식별
  short:
  - '(2차·승인 후, 롤백: 변경 전 예약·제한 값 기록) 경합 VM 을 여유 호스트로 이동하고 과도한 제한(Limit) 설정 해제'
  - '영향: VM 성능 저하, 응답 지연.'
  mid:
  - VM 리소스 예약/제한 설정
  - 클러스터에 ESXi 호스트 추가
  - VM 마이그레이션으로 부하 분산
  long:
  - 호스트 오버커밋 비율 상한 정책과 분기별 용량 계획
  source_note: 'legacy-analyzer-v2.2 virtual_hw_rules.json VMW-RESOURCE-CONTENTION (원 출처: builtin)'
  versions:
  - 제품·버전 무관 (키워드 공통 룰)
  version_note: 키워드 기반 공통 룰(HW·네트워크·스토리지·가상화·일반) — 제품·버전 무관
- id: LEG-KVM-OVERCOMMIT
  layer: os
  product:
  - '*'
  match:
    regex: (?:KVM.*overcommit)|(?:memory.*overcommit.*kvm)|(?:balloon.*driver)|(?:ksm.*active.*high)
  severity: error
  category: memory
  verdict: KVM 메모리 오버커밋 — KVM 호스트 메모리 오버커밋 과다
  immediate:
  - '호스트 메모리(읽기): `free -m` 과 `virsh nodememstats`'
  - 'VM 별 할당 합계: `virsh list --name | xargs -I{} virsh dominfo {} | grep ''Max memory''`'
  - 'KSM·스왑: `cat /sys/kernel/mm/ksm/run` · `cat /sys/kernel/mm/ksm/pages_sharing` 와 `vmstat 1 5` 의 si/so'
  short:
  - '(2차·승인 후, 롤백: 변경 전 `virsh dumpxml <vm>` 보관) VM 메모리 할당 축소 또는 다른 호스트로 VM 이전'
  - '영향: VM 성능 저하 또는 OOM 발생.'
  mid:
  - VM 수 또는 메모리 할당 조정
  - 메모리 오버커밋 비율 낮추기
  - KVM 호스트 물리 메모리 증설
  long:
  - '호스트 메모리 할당률(예: 물리 메모리 1.2배 이내) 정책과 감시'
  source_note: 'legacy-analyzer-v2.2 virtual_hw_rules.json KVM-OVERCOMMIT (원 출처: builtin)'
  versions:
  - 제품·버전 무관 (키워드 공통 룰)
  version_note: 키워드 기반 공통 룰(HW·네트워크·스토리지·가상화·일반) — 제품·버전 무관
