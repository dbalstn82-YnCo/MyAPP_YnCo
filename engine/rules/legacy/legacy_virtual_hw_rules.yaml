- id: LEG-VMW-NW-ERROR
  layer: os
  product:
  - '*'
  match:
    regex: (?:dvSwitch.*error)|(?:distributed switch.*fail)|(?:portgroup.*error)|(?:vmnic.*down)|(?:vDS.*health.*warning)|(?:vmkernel.*network.*error)
  severity: error
  category: hardware
  verdict: VMware 가상 네트워크 오류 — VMware 분산 가상 스위치(dvSwitch) 또는 포트 그룹 오류
  immediate:
  - 'ESXi 물리 NIC 상태(읽기): `esxcli network nic list` — Link Status Down 인 vmnic 기록'
  - 'NIC 통계: `esxcli network nic stats get -n <vmnic>` — 수신 오류·드롭 증가 여부'
  - vCenter › 네트워킹 › dvSwitch › 모니터 › 상태(Health Check) 확인
  short:
  - '(2차·승인 후, 롤백: dvSwitch 설정 내보내기 선행) 업링크 케이블·스위치 포트 복구 또는 포트 그룹 VLAN·팀 구성 수정'
  - '영향: VM 네트워크 통신 불가.'
  mid:
  - dvSwitch 설정 수정
  - vmnic 연결 상태 점검
  - 포트 그룹 VLAN·팀 구성 설정 표준화
  long:
  - vmnic 링크 다운 알람과 업링크 이중화 점검
  source_note: 'legacy-analyzer-v2.2 virtual_hw_rules.json VMW-NW-ERROR (원 출처: builtin)'
  versions:
  - 제품·버전 무관 (키워드 공통 룰)
  version_note: 키워드 기반 공통 룰(HW·네트워크·스토리지·가상화·일반) — 제품·버전 무관
- id: LEG-VMW-VUM-WARN
  layer: os
  product:
  - '*'
  match:
    regex: (?:VUM.*warning)|(?:vSphere Update Manager.*error)|(?:patch.*compliance.*fail)|(?:remediation.*failed.*vmware)
  severity: info
  category: hardware
  verdict: VMware Update Manager 경고 — VMware Update Manager 패치 적용 실패 또는 컴플라이언스 미달
  immediate:
  - vCenter › 업데이트(Lifecycle Manager/Update Manager) 작업 이력에서 실패 호스트·오류 메시지 확인
  - '실패 호스트 판(읽기): `esxcli system version get` 와 `esxcli software vib list | head -30`'
  short:
  - '(2차·승인 후, 롤백: 패치 전 호스트 구성 백업) 유지보수 모드 전환 후 패치 재적용'
  - '영향: 보안 패치 미적용 위험.'
  mid:
  - 실패 원인 해소 후 패치 수동 재적용
  - 업데이트 기준선(Baseline) 재설정·호환성 확인
  - ESXi 유지보수 모드 후 패치 적용
  long:
  - 패치 컴플라이언스 월간 점검과 HCL 기준 판 관리
  source_note: 'legacy-analyzer-v2.2 virtual_hw_rules.json VMW-VUM-WARN (원 출처: builtin)'
  versions:
