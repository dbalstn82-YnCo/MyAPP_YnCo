- id: LEG-VMW-CERT-EXPIRE
  layer: os
  product:
  - '*'
  match:
    regex: (?:certificate.*expired.*vmware)|(?:vCenter.*certificate.*warning)|(?:SSL.*expired.*esxi)|(?:VMCA.*certificate)
  severity: error
  category: security
  verdict: VMware 인증서 만료 — VMware vCenter 또는 ESXi SSL 인증서 만료
  immediate:
  - vCenter › 관리 › 인증서 관리 화면에서 만료 인증서(머신 SSL·STS·솔루션 사용자) 확인
  - '실제 제공 인증서 만료일(읽기): `openssl s_client -connect <vcenter>:443 </dev/null 2>/dev/null | openssl x509 -noout -enddate`'
  - 'ESXi 호스트 인증서: vCenter › 호스트 › 구성 › 인증서 화면의 만료일'
  short:
  - '(2차·승인 후, 롤백: VCSA 파일 기반 백업·스냅샷 선행) vSphere Certificate Manager 또는 UI 로 인증서 갱신'
  - '영향: 관리 UI 접근 불가, VM 마이그레이션 실패.'
  mid:
  - vSphere Certificate Manager로 인증서 갱신
  - VMCA 루트·머신 인증서 교체 절차 문서화
  long:
  - vCenter·ESXi 인증서 만료 60/30일 알람 등록
