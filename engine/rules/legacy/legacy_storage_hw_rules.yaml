# 기존 'AI 로그분석기 v2.2' 내장 룰에서 변환 반입(tools/import_legacy_rules.py) — 중복(코드·패턴) 제외
# 심각도 CRITICAL→critical HIGH→error MEDIUM→warn LOW→info · immediate_actions→즉시 · root_actions→중기 · negative_patterns→exclude
rules:
- id: LEG-STOR-DISK-FAIL
  layer: os
  product:
  - '*'
  match:
    regex: (?:disk.*failed.*storage)|(?:drive.*failure.*array)|(?:disk.*fault.*EMC)|(?:disk.*error.*NetApp)|(?:physical.*disk.*failed)|(?:drive.*slot.*fault)|(?:harddisk.*error)
  severity: critical
  category: disk
  verdict: 스토리지 디스크 장애 — 스토리지 어레이 내 물리 디스크 장애
  immediate:
  - "스토리지 관리 콘솔(제조사 GUI)에서 장애 디스크 위치(인클로저·슬롯)와 핫스페어 대체 여부 확인 — 제조사 CLI 는 show/list 계열 조회만 사용"
  - "서버 측 경로 영향(읽기): Linux `multipath -ll | grep -iE 'failed|faulty'` / AIX `lspath | grep -v Enabled` / ESXi `esxcli storage core path list | grep -c 'State: dead'` — 0 이 아니면 서버 I/O 경로까지 영향"
  - "리빌드(Rebuild) 진행 상태와 완료 예상 시각을 콘솔에서 기록"
  short:
  - '(2차·승인 후, 롤백: 교체 전 RAID 그룹 상태·백업 확인) 제조사 인증 디스크로 Hot-swap 교체, 재구성 중 대량 I/O 작업 연기'
  - '영향: RAID 성능 저하 모드 진입. 추가 장애 시 데이터 손실.'
  mid:
  - 인증된 교체 디스크로 Hot-swap 교체
  - RAID 재구성 완료 모니터링
  - 재구성 중 I/O 부하 최소화
  long:
  - 스토리지 디스크 장애 이벤트(콜홈·SNMP) 알림 연동과 핫스페어 수 기준 유지
  source_note: 'legacy-analyzer-v2.2 storage_hw_rules.json STOR-DISK-FAIL (원 출처: builtin)'
  versions:
  - 제품·버전 무관 (키워드 공통 룰)
  version_note: 키워드 기반 공통 룰(HW·네트워크·스토리지·가상화·일반) — 제품·버전 무관
- id: LEG-STOR-LUN-OFFLINE
  layer: os
  product:
  - '*'
  match:
    regex: (?:LUN.*offline)|(?:LUN.*unavailable)|(?:lun.*not accessible)|(?:volume.*offline)|(?:storage.*LUN.*error)|(?:LUN.*failed)
  severity: critical
  category: disk
  verdict: LUN 오프라인 — 스토리지 LUN 접근 불가. 디스크 장애, 컨트롤러 오류, 경로 문제
  immediate:
  - 스토리지 콘솔에서 LUN 상태·소유 컨트롤러·호스트 매핑 확인
  - '서버 경로 상태(읽기): Linux `multipath -ll` / AIX `lspath -l hdisk<N>` / Windows `mpclaim -s -d`'
  - 'OS 오류: Linux `dmesg -T | grep -iE ''offline|I/O error'' | tail -20` / AIX `errpt | head -20`'
  short:
  - '(2차·승인 후, 롤백: 재스캔 전 `multipath -ll` 출력 보관) 스토리지 측 원인 해소 후 경로 재스캔(Linux `rescan-scsi-bus.sh`, AIX `cfgmgr`)과 파일시스템 점검'
  - '영향: LUN 사용 서버 파일시스템 접근 불가, 서비스 중단.'
  mid:
  - 스토리지 컨트롤러 장애 확인 및 페일오버
  - FC 스위치 존닝 확인
  - LUN 복구 또는 백업에서 복원
  long:
  - LUN 경로 수·상태 감시와 이중 컨트롤러·이중 패브릭 구성 점검
  source_note: 'legacy-analyzer-v2.2 storage_hw_rules.json STOR-LUN-OFFLINE (원 출처: builtin)'
  versions:
  - 제품·버전 무관 (키워드 공통 룰)
  version_note: 키워드 기반 공통 룰(HW·네트워크·스토리지·가상화·일반) — 제품·버전 무관
- id: LEG-STOR-CONTROLLER-FAIL
  layer: os
  product:
  - '*'
  match:
    regex: (?:controller.*failure)|(?:storage.*controller.*error)|(?:array.*controller.*failed)|(?:SP.*failed)|(?:controller.*offline)|(?:storage.*head.*failed)
  severity: critical
  category: storage
  verdict: 스토리지 컨트롤러 장애 — 스토리지 어레이 컨트롤러(SP) 장애. 이중화 컨트롤러 중 하나 장애
  immediate:
  - 스토리지 콘솔에서 컨트롤러(SP·노드) 상태와 LUN 소유권 이전(Trespass·Takeover) 여부 확인
  - '서버 측 경로 감소(읽기): Linux `multipath -ll | grep -c ''active ready''` / AIX `lspath | grep -c Enabled` — 평시 경로 수와 비교'
  - 제조사 긴급 지원 케이스 접수 여부(콜홈 자동 접수) 확인
  short:
  - (2차·승인 후) 제조사 엔지니어 주도로 컨트롤러 교체, 교체 후 LUN 소유권 원복(Failback)·경로 수 복구 확인
  - '영향: 이중화 소실. 단일 컨트롤러 운영으로 성능 저하 및 추가 장애 시 중단.'
  mid:
  - 장애 컨트롤러 교체 (벤더 지원 필요)
  - LUN 로드 밸런싱 재설정
  - 스토리지 펌웨어 업데이트
  long:
  - 컨트롤러 상태·경로 수 감시와 펌웨어 판을 제조사 호환표 기준으로 유지
  source_note: 'legacy-analyzer-v2.2 storage_hw_rules.json STOR-CONTROLLER-FAIL (원 출처: builtin)'
  versions:
  - 제품·버전 무관 (키워드 공통 룰)
  version_note: 키워드 기반 공통 룰(HW·네트워크·스토리지·가상화·일반) — 제품·버전 무관
- id: LEG-STOR-CACHE-FAIL
  layer: os
  product:
  - '*'
  match:
    regex: (?:cache.*failure.*storage)|(?:storage.*cache.*error)|(?:cache.*battery.*storage)|(?:write.*cache.*failed)|(?:dirty.*cache)|(?:cache.*module.*fault)
  severity: error
  category: storage
  verdict: 스토리지 캐시 장애 — 스토리지 캐시 모듈 또는 캐시 배터리 장애
  immediate:
  - 스토리지 콘솔에서 캐시 상태(Write Cache 사용 여부)·캐시 배터리·미러 상태 확인
  - '성능 영향(읽기): Linux `iostat -xz 1 5` / AIX `iostat -D 1 5` — 쓰기 대기시간 증가 여부'
  - 제조사 지원 케이스 접수 여부(콜홈) 확인
  short:
  - (2차·승인 후) 제조사가 캐시 모듈·배터리 교체, 그동안 Write-Through 운영으로 대량 쓰기 작업 연기
  - '영향: Write Cache 비활성화로 I/O 성능 급저하.'
  mid:
  - 캐시 배터리 또는 캐시 모듈 교체
  - 캐시 장애 중 Write-Through 모드 운영
  - 스토리지 벤더 지원 연락
  long:
  - 캐시 상태 변화 이벤트 알림과 배터리 교체 주기 관리
  source_note: 'legacy-analyzer-v2.2 storage_hw_rules.json STOR-CACHE-FAIL (원 출처: builtin)'
  versions:
  - 제품·버전 무관 (키워드 공통 룰)
  version_note: 키워드 기반 공통 룰(HW·네트워크·스토리지·가상화·일반) — 제품·버전 무관
- id: LEG-STOR-POOL-FULL
  layer: os
  product:
  - '*'
  match:
    regex: (?:storage.*pool.*full)|(?:thin.*pool.*warning)|(?:pool.*capacity.*critical)|(?:storage.*pool.*threshold)|(?:datastore.*full)|(?:aggregate.*full.*NetApp)
  severity: error
  category: storage
  verdict: 스토리지 풀 용량 고갈 — 스토리지 풀 또는 애그리게이트 용량 임계값 초과
  immediate:
  - 스토리지 콘솔에서 풀·애그리게이트 사용률과 Thin 초과 할당 비율 확인 — 90% 이상이면 쓰기 실패 임박
  - '증가 원인 조회: 최근 스냅샷 사용량·신규 볼륨 생성 이력(읽기)'
  - VMware 데이터스토어면 `esxcli storage filesystem list` 로 Free 확인
  short:
  - '(2차·승인 후, 롤백: 불가 — 삭제 전 보존 정책·업무 담당 확인) 불필요 스냅샷 삭제 또는 볼륨 이동으로 여유 확보'
  - '영향: 신규 볼륨 생성 불가, Thin Provisioning 환경에서 VM/LUN 쓰기 실패.'
  mid:
  - 디스크 추가로 스토리지 풀 확장
  - 스냅샷 보존 정책 검토 및 단축
  - Thin Provisioning 과다 할당 재검토
  long:
  - 풀 사용률 80%/90% 감시 임계와 Thin 초과 할당 비율 상한 정책
  source_note: 'legacy-analyzer-v2.2 storage_hw_rules.json STOR-POOL-FULL (원 출처: builtin)'
  versions:
  - 제품·버전 무관 (키워드 공통 룰)
  version_note: 키워드 기반 공통 룰(HW·네트워크·스토리지·가상화·일반) — 제품·버전 무관
- id: LEG-STOR-REPL-FAIL
  layer: os
  product:
  - '*'
  match:
    regex: (?:replication.*failed)|(?:mirror.*broken.*storage)|(?:snap.*replication.*error)|(?:SnapMirror.*failed)|(?:storage.*sync.*error)|(?:remote.*replication.*fail)
  severity: error
  category: storage
  verdict: 스토리지 복제 실패 — 스토리지 복제(SnapMirror/SRDF 등) 실패. 네트워크 오류 또는 스토리지 장애
  immediate:
  - 복제 관리 화면(SnapMirror·SRDF·Remote Copy 등)에서 오류 메시지·마지막 성공 시각·지연량 확인
  - '복제 링크 도달(읽기): `ping -c 5 <replication_ip>` — FC 복제면 스위치 포트 상태 확인 요청'
  - 소스·대상 스토리지 상태(용량·컨트롤러) 확인
  short:
  - '(2차·승인 후, 롤백: 재동기화 전 대상 측 스냅샷 확보) 복제 링크 복구 후 재동기화(Resync) 수행'
  - '영향: DR(재해복구) 데이터 동기화 중단. RPO 목표 미달.'
  mid:
  - 복제 네트워크 복구 후 재동기화
  - 스토리지 복제 스케줄 재설정
  - DR 테스트 주기 단축
  long:
  - 복제 지연(RPO) 감시 임계 등록과 DR 전환 훈련 정례화
  source_note: 'legacy-analyzer-v2.2 storage_hw_rules.json STOR-REPL-FAIL (원 출처: builtin)'
  versions:
  - 제품·버전 무관 (키워드 공통 룰)
  version_note: 키워드 기반 공통 룰(HW·네트워크·스토리지·가상화·일반) — 제품·버전 무관
- id: LEG-STOR-SNAPSHOT-FAIL
  layer: os
  product:
  - '*'
  match:
    regex: (?:snapshot.*failed)|(?:snap.*error.*storage)|(?:snapshot.*space.*full)|(?:snap.*creation.*failed)|(?:volume.*snapshot.*error)
  severity: warn
  category: storage
  verdict: 스냅샷 생성 실패 — 스냅샷 생성 실패. 스냅샷 공간 부족 또는 스토리지 오류
  immediate:
  - "스냅샷 예약 공간·볼륨 여유(읽기): 스토리지 콘솔 또는 NetApp ONTAP `volume show-space -volume <vol>` 와 `volume snapshot show -volume <vol>` — 예약 공간 100% 면 생성 실패 원인"
  - "서버 LVM 스냅샷이면 Linux `lvs -o lv_name,origin,data_percent,lv_size` — data_percent 100 이면 스냅샷 가득참(무효)"
  - "실패 작업 이름·시각·오류 문구를 스케줄 작업 이력에서 확인하고 같은 시각 백업 소프트웨어 작업과 겹치는지 대조"
  short:
  - '(2차·승인 후, 롤백: 불가 — 대상 보존 정책 확인) 만료 스냅샷 정리 또는 예약 공간 확장 후 수동 스냅샷 재시도'
  - '영향: 데이터 보호 정책 미달. 스냅샷 기반 복구 불가.'
  mid:
  - 스냅샷 전용 공간 확장
  - 스냅샷 보존 정책 최적화
  - 스냅샷 스케줄을 백업 작업과 겹치지 않게 재설정
  long:
  - 스냅샷 성공률·예약 공간 사용률 감시 등록
  verify_note: "미검증 — NetApp ONTAP 명령·필드 이름은 제조사 문서(docs.netapp.com — 허용 도메인 밖)로 대조하지 못함. 다른 제조사 어레이는 콘솔 화면 기준"
  source_note: 'legacy-analyzer-v2.2 storage_hw_rules.json STOR-SNAPSHOT-FAIL (원 출처: builtin)'
  versions:
  - 제품·버전 무관 (키워드 공통 룰)
  version_note: 키워드 기반 공통 룰(HW·네트워크·스토리지·가상화·일반) — 제품·버전 무관
- id: LEG-STOR-FIBER-CHANNEL
  layer: os
  product:
  - '*'
  match:
    regex: (?:HBA.*error)|(?:fiber channel.*error)|(?:FC.*link.*down)|(?:HBA.*port.*failed)|(?:qla.*error)|(?:lpfc.*error)|(?:FC.*timeout)
  severity: error
  category: hardware
  verdict: FC HBA 오류 — Fiber Channel HBA 포트 오류 또는 링크 다운
  immediate:
  - 'HBA 포트 상태(읽기): Linux `cat /sys/class/fc_host/host*/port_state` 또는 `systool -c fc_host -v` / AIX `fcstat fcs<N>` / Windows `Get-InitiatorPort`'
  - '경로 상태: Linux `multipath -ll | grep -iE ''failed|faulty''` / AIX `lspath | grep -v Enabled`'
  - 'FC 스위치 포트 오류(Brocade 예: `porterrshow`) 확인을 스위치 담당에 요청'
  short:
  - '(2차·승인 후, 롤백: 교체 전 WWPN·조닝 기록) 케이블·SFP 교체, 반복 시 HBA 교체(새 WWPN 이면 조닝·LUN 마스킹 갱신)'
  - '영향: 스토리지 연결 경로 감소. 단일 경로 운영으로 성능 저하.'
  mid:
  - HBA 드라이버 업데이트
  - FC 케이블 및 SFP 트랜시버 점검/교체
  - HBA 카드 교체 (반복 오류 시)
  long:
  - FC 포트 오류 카운터 감시와 HBA 드라이버·펌웨어 호환표 기준 관리
  source_note: 'legacy-analyzer-v2.2 storage_hw_rules.json STOR-FIBER-CHANNEL (원 출처: builtin)'
  versions:
  - 제품·버전 무관 (키워드 공통 룰)
  version_note: 키워드 기반 공통 룰(HW·네트워크·스토리지·가상화·일반) — 제품·버전 무관
- id: LEG-STOR-ISCSI-FAIL
  layer: os
  product:
  - '*'
  match:
    regex: (?:iSCSI.*error)|(?:iSCSI.*session.*lost)|(?:iscsi.*connection.*failed)|(?:iscsiadm.*error)|(?:iscsi.*target.*unreachable)|(?:iSCSI.*timeout)
  severity: error
  category: connection
  verdict: iSCSI 세션 오류 — iSCSI 세션 연결 실패 또는 끊김
  immediate:
  - 'iSCSI 세션 상세(읽기): Linux `iscsiadm -m session -P 1` / Windows `Get-IscsiSession`'
  - '대상 포털 도달: `nc -zvw3 <target_ip> 3260` (iSCSI 기본 포트) / Windows `Test-NetConnection <target_ip> -Port 3260`'
  - '커널 메시지: `dmesg -T | grep -i iscsi | tail -20` — 연결 오류 반복 여부'
  short:
  - '(2차·승인 후, 롤백: 재로그인 전 세션 목록 보관) 네트워크 복구 후 `iscsiadm -m node -T <target_iqn> -p <target_ip> --login` 으로 재연결'
  - '영향: iSCSI LUN 접근 불가.'
  mid:
  - iSCSI 세션 재연결 후 multipath 경로 복구 확인
  - iSCSI 네트워크(전용 VLAN) 확인
  - CHAP 인증 설정 확인
  long:
