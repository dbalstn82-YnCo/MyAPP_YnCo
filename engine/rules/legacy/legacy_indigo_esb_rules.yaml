  severity: info
  category: performance
  verdict: 복호화 인코딩 정보 — EUC-KR 응답 처리 — 정상 처리. 수신 메시지의 인코딩이 EUC-KR임을 확인 후 복호화 수행. EUC-KR 응답에서 userName 등 한글 필드가 깨질 수 있음
  immediate:
