- id: LEG-IND-014
  layer: sw
  product:
  - indigo-esb
  match:
    regex: (?:!+\s*return Body not null\s*!+)
  severity: info
  category: upstream
  verdict: 서비스 응답 Body 정상 수신 확인 — 정상 처리. 외부 연계 서비스로부터 응답 Body가 null이 아닌 정상 데이터로 수신됨을 표시
  immediate:
  - '정상 응답 표시 — 반대 경우 확인: `grep -n ''return Body null'' <로그> | tail -10` 와 NullPointerException 동반 여부'
  - null 응답이 특정 연계 기관에 몰리면 해당 기관 응답 이상으로 통보
  short:
