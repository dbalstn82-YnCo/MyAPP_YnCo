# 기존 'AI 로그분석기 v2.2' 내장 룰에서 변환 반입(tools/import_legacy_rules.py) — 중복(코드·패턴) 제외
# 심각도 CRITICAL→critical HIGH→error MEDIUM→warn LOW→info · immediate_actions→즉시 · root_actions→중기 · negative_patterns→exclude
rules:
- id: LEG-COM-SSL-EXPIRED
  layer: os
  product:
  - '*'
  match:
    regex: (?:certificate.*expired)|(?:SSL.*expired)|(?:certificate.*not.*valid)|(?:CERT_HAS_EXPIRED)|(?:SSL.*handshake.*fail)|(?:certificate.*verify.*fail)
  severity: error
  category: security
  verdict: SSL 인증서 만료 — SSL/TLS 인증서 만료
  immediate:
  - '서버 인증서 만료일 확인(읽기): `openssl x509 -enddate -noout -in <인증서경로>` — notAfter 가 현재 이전이면 만료 확정'
  - '실제 제공 인증서 확인: `openssl s_client -connect <server>:443 -servername <host> </dev/null 2>/dev/null | openssl x509 -noout -subject -enddate` — 만료가 아니면 중간 인증서 누락·시간 오차 확인'
  - 'Windows: `Get-ChildItem Cert:\LocalMachine\My | Select-Object Subject,NotAfter`'
  short:
  - '(2차·승인 후, 롤백: 기존 인증서·키 파일 사본 보관) 갱신 인증서(체인 포함) 설치 후 웹/WAS 에 graceful 방식으로 재적용'
  - '영향: HTTPS 서비스 전체 차단.'
  mid:
  - 인증서 인벤토리(호스트·경로·만료일·발급기관) 작성 후 만료 30일 전 갱신 일정 확정
  - 인증서 교체 후 서비스 재기동·재적용 절차를 제품별(Apache·Nginx·JEUS·Tomcat)로 문서화
  long:
  - 만료 30일/7일 전 자동 알림(openssl 만료일 점검 스크립트 또는 감시 도구) 등록과 내부 CA·중간 인증서 교체 이력 관리
  source_note: 'legacy-analyzer-v2.2 common_rules.json COM-SSL-EXPIRED (원 출처: builtin)'
  versions:
  - 제품·버전 무관 (키워드 공통 룰)
  version_note: 키워드 기반 공통 룰(HW·네트워크·스토리지·가상화·일반) — 제품·버전 무관
- id: LEG-COM-JAVA-OOM
  layer: os
  product:
  - '*'
  match:
    regex: (?:java.lang.OutOfMemoryError)|(?:Java heap space)|(?:GC overhead)|(?:unable.*allocate.*java)
  severity: critical
  category: memory
  verdict: Java OutOfMemoryError — Java 프로세스 메모리 고갈
  immediate:
  - 'OOM 종류 확인: `grep -n ''OutOfMemoryError'' <애플리케이션 로그> | tail -10` — Java heap space / GC overhead / Metaspace / unable to create native thread 중 무엇인지 기록'
  - '현재 힙·GC 상태(읽기): `jstat -gcutil <PID> 5000 6` — O(Old) 95% 이상 유지·FGC 연속 증가면 힙 고갈 진행'
  - '자동 힙 덤프 생성 여부: `ls -l <HeapDumpPath>/*.hprof` (-XX:+HeapDumpOnOutOfMemoryError 설정 시)'
  short:
  - (2차·승인 후) 힙 덤프 `jcmd <PID> GC.heap_dump <path>/heap.hprof` 수집(수 초~수 분 정지, 힙 크기만큼 디스크 필요) 후 서비스 재기동
  - '영향: Java 애플리케이션 서비스 중단.'
  mid:
  - -Xmx·-XX:MaxMetaspaceSize 를 GC 로그 실측(Full GC 후 Old 사용량의 3~4배) 기준으로 재산정
  - 힙 덤프 분석(MAT 등)으로 누수 객체·참조 경로를 찾아 개발팀 수정
  long:
  - -XX:+HeapDumpOnOutOfMemoryError·GC 로그를 표준 JVM 옵션으로 지정하고 Old 영역 사용률 85% 감시 임계 등록
  source_note: 'legacy-analyzer-v2.2 common_rules.json COM-JAVA-OOM (원 출처: builtin)'
  versions:
  - 제품·버전 무관 (키워드 공통 룰)
  version_note: 키워드 기반 공통 룰(HW·네트워크·스토리지·가상화·일반) — 제품·버전 무관
- id: LEG-COM-DBCONN
  layer: os
  product:
  - '*'
  match:
    regex: (?:could not connect.*database)|(?:DB connection.*fail)|(?:JDBC.*connection.*fail)|(?:database.*unreachable)
  severity: error
  category: connection
  verdict: DB 커넥션 실패 — DB 서버 다운, 네트워크 단절, 커넥션 풀 고갈
  immediate:
  - 'DB 리스너 포트 도달 확인(읽기): Linux/AIX `nc -zvw3 <db_host> <port>` (nc 없으면 `telnet <db_host> <port>`) / Windows `Test-NetConnection <db_host> -Port <port>` — 실패면 DB 다운 또는 방화벽'
  - '애플리케이션 로그의 원인 예외·DB 코드 확인: `grep -nE ''ORA-|TBR-|SQLState|Connection refused|timed out'' <앱 로그> | tail -20` — 리스너 없음·풀 고갈·인증 실패 구분'
  - 다른 서버에서도 같은 DB 접속이 실패하는지 확인 — 전체 실패면 DB 측, 일부면 해당 서버 네트워크·풀 문제
  short:
  - '(2차·승인 후, 롤백: 변경 전 데이터소스 설정 사본) DB 측 장애면 DB 담당이 리스너·인스턴스 복구, 풀 고갈이면 미반환 커넥션 원인 확인 후 풀 max 조정'
  - '영향: 애플리케이션 DB 연동 전체 실패.'
  mid:
  - 커넥션 풀 검증 설정(validation query·유휴 검사)과 max 크기를 DB 세션 한도 기준으로 재산정
  - 방화벽 세션 유휴 타임아웃과 풀 유휴 타임아웃을 정합
  long:
  - DB 접속 실패율·풀 사용률 80% 감시 등록과 DB 리스너 이중화(failover) 구성 검토
  source_note: 'legacy-analyzer-v2.2 common_rules.json COM-DBCONN (원 출처: builtin)'
  versions:
  - 제품·버전 무관 (키워드 공통 룰)
  version_note: 키워드 기반 공통 룰(HW·네트워크·스토리지·가상화·일반) — 제품·버전 무관
- id: LEG-COM-HIGH-CPU
  layer: os
  product:
  - '*'
  match:
    regex: (?:cpu.*100%)|(?:load average.*high)|(?:cpu.*spike)|(?:process.*cpu.*high)
  severity: error
  category: internal
  verdict: CPU 100% 점유 — 특정 프로세스의 과도한 CPU 사용
  immediate:
  - 'CPU 상위 프로세스(읽기): Linux `top -bn1 | head -20` / AIX `ps aux | sort -rn -k3 | head -10` / Windows `Get-Process | Sort-Object CPU -Descending | Select-Object -First 10`'
  - 'CPU 사용 구성 확인: `vmstat 1 5` — us 높으면 응용, sy 높으면 커널·시스템콜, wa 높으면 I/O 대기, r 이 CPU 수 초과 지속이면 과부하'
  - 'Java 프로세스면 고 CPU 스레드 확인(프로세스 유지): `top -H -bn1 -p <PID> | head -15` 후 `jcmd <PID> Thread.print` 로 해당 스레드 스택 대조'
  short:
  - '(2차·승인 후, 롤백: 설정 변경 없음 확인) 비정상 루프·폭주 프로세스는 담당 확인 후 서비스 재기동'
  - '영향: 시스템 전체 성능 저하.'
  mid:
  - 고 CPU 스레드 스택으로 원인 코드·쿼리를 찾아 개발/DB 담당에 수정 요청
  - CPU 사용률 지속 70% 이상이면 코어 증설 또는 부하 분산(L4) 재산정
  long:
  - CPU 사용률 85%(5분 지속) 감시 임계와 sar -u·sar -q 이력 30일 보존
  source_note: 'legacy-analyzer-v2.2 common_rules.json COM-HIGH-CPU (원 출처: builtin)'
  versions:
  - 제품·버전 무관 (키워드 공통 룰)
  version_note: 키워드 기반 공통 룰(HW·네트워크·스토리지·가상화·일반) — 제품·버전 무관
- id: LEG-COM-NETWORK-TIMEOUT
  layer: os
  product:
  - '*'
  match:
    regex: (?:Connection timed out)|(?:ETIMEDOUT)|(?:Network timeout)|(?:connection.*timeout)
  severity: warn
  category: upstream
  verdict: 네트워크 타임아웃 — 네트워크 응답 지연 또는 방화벽 차단
  immediate:
  - "연계 대상 포트 응답 시험(읽기): Linux `nc -zvw3 <server> <port>` / AIX `telnet <server> <port>`(nc 는 기본 미설치) / Windows `Test-NetConnection <server> -Port <port>` — 실패면 방화벽 거부 또는 대상 무응답"
  - "경로 지연·손실 확인: Linux/AIX `traceroute -n <server>` / Windows `tracert -d <server>` — 특정 홉 이후 무응답이면 해당 구간 문제"
  - "소켓 상태(읽기): Linux `ss -tan state syn-sent | head` / AIX `netstat -an | grep SYN_SENT` / Windows `Get-NetTCPConnection -State SynSent` — SYN_SENT 누적이면 방화벽에서 막힘·대상 무응답"
  short:
  - '(2차·승인 후, 롤백: 변경 전 정책·설정 기록) 방화벽 정책 누락이면 정책 요청, 대상 과부하면 대상 담당 조치, 애플리케이션 타임아웃 값 조정'
  - '영향: 서비스 간 통신 실패.'
  mid:
  - connect/read 타임아웃을 구간별(연결 3초·응답은 업무 기준)로 표준화하고 재시도는 백오프 적용
  - 방화벽·L4 세션 유휴 타임아웃과 애플리케이션 keepalive 값을 정합
  long:
  - 주요 연계 대상 포트에 1분 주기 TCP 접속 합성 감시 등록
  source_note: 'legacy-analyzer-v2.2 common_rules.json COM-NETWORK-TIMEOUT (원 출처: builtin)'
  versions:
  - 제품·버전 무관 (키워드 공통 룰)
  version_note: 키워드 기반 공통 룰(HW·네트워크·스토리지·가상화·일반) — 제품·버전 무관
- id: LEG-COM-BACKUP-FAIL
  layer: os
  product:
  - '*'
  match:
    regex: (?:backup.*failed)|(?:backup.*error)|(?:rsync.*error)|(?:tar.*fail)
  severity: error
  category: disk
  verdict: 백업 작업 실패 — 백업 스크립트 실패. 디스크 공간, 권한, 네트워크 오류
  immediate:
  - '백업 작업 로그에서 실패 단계·오류 문구 확인: `tail -100 <백업로그경로> | grep -iE ''error|fail|denied|no space''`'
  - '백업 대상·저장 경로 여유(읽기): Linux `df -h <백업경로>` / AIX `df -g <백업경로>` / Windows `Get-Volume` — 95% 이상이면 공간 부족 원인'
  - '원격 저장소면 마운트·접속 확인: `mount | grep <백업경로>` 와 `nc -zvw3 <backup_server> <port>`'
  short:
  - '(2차·승인 후, 롤백: 정리 전 보존 기간·업무 담당 확인) 공간 부족이면 보존 기간 지난 백업본 정리 또는 저장소 증설 후 실패 작업 수동 재실행'
  - '영향: 재해 복구 불가.'
  mid:
  - 백업 저장소 용량을 보존 주기×일 증가량 기준으로 재산정해 증설
  - 백업 계정 권한·원격 마운트 상태를 작업 전 점검 항목으로 추가
  - 백업 작업 종료 코드 감시로 실패 즉시 알림 설정
  long:
  - 월 1회 복원 시험으로 백업 유효성 검증, 백업 성공률 감시 지표 등록
  source_note: 'legacy-analyzer-v2.2 common_rules.json COM-BACKUP-FAIL (원 출처: builtin)'
  versions:
  - 제품·버전 무관 (키워드 공통 룰)
  version_note: 키워드 기반 공통 룰(HW·네트워크·스토리지·가상화·일반) — 제품·버전 무관
