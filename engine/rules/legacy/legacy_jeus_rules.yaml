  immediate:
  - "`grep -o -E 'JNSS-[0-9]{4}' <SERVER_HOME>/logs/JeusServer.log | sort | uniq -c` 로 코드 계열 확인 — JNSS-0402 는 정상 종료 시 발생(종료 시각과 겹치면 무시)"
  - "JNSS-01xx 면 `unzip -p <app>.jar META-INF/jeus-ejb-dd.xml | grep -n 'export-name'` 로 JNDI 이름 확인, JNSS-02xx 면 `nc -zvw3 <peer_host> <port>` 로 서버 간 연결 확인"
  short:
  - '영향: EJB/DataSource JNDI 룩업 실패.'
  mid:
  - 'JNSS-01xx: JNDI 이름 일치 여부 확인 후 재배포'
  - 'JNSS-02xx: 클러스터 네트워크 설정 점검'
  long:
  - "JNDI 이름 규칙 표준과 종료 시각 외 JNSS 오류 건수 감시"
  source_note: 'legacy-analyzer-v2.2 jeus_rules.json JEUS-JNDI-ALL (원 출처: builtin)'
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: JNSS-0001/0002 — JNSS 모듈 6~9.1 공통
