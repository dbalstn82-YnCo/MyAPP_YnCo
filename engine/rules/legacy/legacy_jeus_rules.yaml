  - 'ClassNotFoundException: WAR 파일의 lib 폴더 의존성 확인'
  - "(2차·승인 후) STANDBY 해제: jeusadmin 으로 서버 기동(wsadmin 은 WebtoB 도구 — JEUS 에 쓰지 않는다)"
  - "(2차·승인 후, 롤백: 이전 배포본 보관) 재배포: jeusadmin undeploy 후 deploy"
  long:
