  - "종료 시각 외 NET-02xx/09xx 건수 기준값 대비 급증 감시"
  source_note: 'legacy-analyzer-v2.2 jeus_rules.json JEUS-NET-ERR (원 출처: builtin)'
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: NET-0200/0201 — 기존 도구 룰 유래(도입 버전 미확인), 전 버전 수집
- id: LEG-JEUS-DSESSION
