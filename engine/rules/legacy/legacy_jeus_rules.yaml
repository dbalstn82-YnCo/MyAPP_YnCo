  - '비정상 시: JEUS 클러스터 네트워크 확인'
  long:
  - "종료 시각 외 D_SESSION 연결 종료 건수 감시와 세션 서버 이중화 구성 점검"
  source_note: 'legacy-analyzer-v2.2 jeus_rules.json JEUS-DSESSION (원 출처: builtin)'
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: D_SESSION-2000/2001 — 분산 세션 코드(도입 버전 미확인), 전 버전 수집
