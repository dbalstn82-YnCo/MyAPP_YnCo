  source_note: 'legacy-analyzer-v2.2 jeus_rules.json JEUS-WEB-LIFECYCLE (원 출처: builtin)'
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: WEB-1001/1002 — 6 부터 동일 접두
- id: LEG-JEUS-SERVLET-ERR
  layer: was
  product:
  - jeus
  match:
    regex: (?:\[WEB-2001\].*servlet.*error)|(?:\[WEB-2002\].*filter.*error)|(?:\[WEB-2003\].*session.*error)|(?:\[WEB-2005\].*servlet.*timeout)|(?:\[WEB-2010\].*request.*error)|(?:\[WEB-2011\].*dispatch.*error)|(?:\[WEB-2020\].*encoding.*error)|(?:\[WEB-2030\].*redirect.*error)|(?:\[WEB-2040\].*forward.*error)|(?:\[WEB-2050\].*include.*error)|(?:\[WEB-2100\].*session.*expired)|(?:\[WEB-2101\].*session.*invalid)|(?:\[WEB-2110\].*session.*memory)|(?:servlet.*\[WEB-2\d{3}\])
  severity: error
  category: internal
  verdict: JEUS 서블릿/세션 오류 (WEB-20xx) — JEUS 서블릿 컨테이너 내부 오류. WEB-20xx 계열
  immediate:
  - "`grep -n -B30 -E 'WEB-20[0-9]{2}' <SERVER_HOME>/logs/JeusServer.log | grep -E 'Exception|Caused by|WEB-20' | tail -30` 로 해당 WEB 코드 직전 예외 스택 확인"
  - "스택의 서블릿·필터 클래스(init·doFilter)를 추려 개발 담당에 전달 — `grep -c -E 'WEB-20[0-9]{2}' <SERVER_HOME>/logs/JeusServer.log` 로 건수를 보고 반복이면 우선 처리"
  short:
  - '영향: 해당 HTTP 요청 처리 실패.'
  mid:
  - 근본 예외 유형에 따라 조치
  - "(2차·승인 후, 롤백: 이전 배포본) 서블릿 재배포"
  long:
  - "URI 별 500 비율 감시와 공통 예외 처리 표준"
  source_note: 'legacy-analyzer-v2.2 jeus_rules.json JEUS-SERVLET-ERR (원 출처: builtin)'
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: WEB-2001/2002 — 공통
- id: LEG-JEUS-WJP-ALL
  layer: was
  product:
  - jeus
  match:
    regex: (?:\[WEB-3340\].*WebtoB.*connect)|(?:\[WEB-3341\].*WebtoB.*init)|(?:\[WEB-3342\].*WebtoB.*register)|(?:\[WEB-3343\].*WebtoB.*auth)|(?:\[WEB-3344\].*WebtoB.*handshake)|(?:\[WEB-3345\].*WebtoB.*session)|(?:\[WEB-3346\].*Connecting
      to WebtoB.*failed)|(?:\[WEB-3347\].*Connecting to WebtoB.*network error)|(?:\[WEB-3348\].*WebtoB.*timeout)|(?:\[WEB-3349\].*WebtoB.*reconnect)|(?:\[WEB-3350\].*WebtoB.*disconnect)|(?:\[WEB-3351\].*WebtoB.*recover)|(?:\[WEB-3360\].*WebtoB.*config)|(?:\[WEB-3370\].*WebtoB.*jsvgroup)|(?:jeus\.servlet\.engine\.WebtoBConnectionManager\.)|(?:jeus\.servlet\.engine\.WebtoBConnectionManager\.registerToWebtoB)|(?:jeus\.servlet\.engine\.WebtoBConnectionManager\.createConnection)|(?:jeus\.servlet\.connection\.WebtoBConnector\.)|(?:jeus\.servlet\.connection\.WebtoBConnector\.run)|(?:jeus\.servlet\.engine\.WJPV2Registration\.)|(?:jeus\.servlet\.engine\.WJPV2Registration\.readRegstrationReply)|(?:Connecting
      to WebtoB.*failed)|(?:Check if WebtoB is running)|(?:registerToWebtoB.*failed)|(?:java\.net\.ConnectException.*refused.*[Ww]eb[Tt]o[Bb])|(?:java\.io\.EOFException.*[Ww]eb[Tt]o[Bb])|(?:java\.net\.SocketTimeoutException.*[Ww]eb[Tt]o[Bb])|(?:java\.net\.SocketException.*[Ww]eb[Tt]o[Bb])|(?:java\.io\.IOException.*[Ww]eb[Tt]o[Bb])|(?:Socket\[unconnected\].*[Ww]eb[Tt]o[Bb].*failed)|(?:Socket\[addr=.*port=\d+.*\].*[Ww]eb[Tt]o[Bb].*failed)
  severity: error
  category: upstream
  verdict: JEUS↔WebtoB WJP 연결 오류 전체 (WEB-33xx)
  immediate:
  - "WebtoB 프로세스 즉시 확인: WebtoB 서버에서 `ps -ef | grep -E 'wsm|htl|hth' | grep -v grep`"
  - "WJP 포트 연결 테스트: `nc -zvw3 <webtob_host> <jsv_port>`(또는 telnet)"
  - WebtoB 로그($WEBTOB_HOME/log) 확인
  - 방화벽 JSV 포트(<jsv_port>) 허용 여부 확인
  short:
  - '영향: JEUS WAS HTTP 요청 수신 불가. 웹 서비스 전체 중단.'
  - "(2차·승인 후, 롤백: 설정 백업 복원) WebtoB 기동·JSV 설정 정정은 WebtoB 담당, JEUS webtob-connector 정정은 WAS 담당"
  mid:
  - "(2차·WebtoB 담당 승인 후) WebtoB 미기동: wsboot으로 기동"
  - "(2차·보안 승인 후) 포트 불통: 방화벽 정책 수정"
  - "설정 오류: `wscfl -i <설정파일>.m` 으로 WebtoB 설정 컴파일 검증 후 수정(wbconfig 는 WebtoB 명령이 아님)"
  - 'jsvgroup 설정: $WEBTOB_HOME/conf/webtob.m 검토'
  long:
  - "WebtoB-JEUS 연결 수·WJP 오류 건수 감시"
  source_note: 'legacy-analyzer-v2.2 jeus_rules.json JEUS-WJP-ALL (원 출처: builtin)'
  exclude: (?:JeusDeploymentException)
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: WEB-3340~ WJP 코드 — 공통
