  - "종료와 무관하게 반복되면 메시지의 상대 주소로 `nc -zvw3 <peer_host> <port>` 연결 확인 — 실패면 네트워크 장비·방화벽·상대 서버 원인"
  short:
  - '영향: JEUS 내부 연결 상태 이상.'
  mid:
  - '종료 시 발생: 무시 가능'
  - '비정상 시: 네트워크 장비 점검'
