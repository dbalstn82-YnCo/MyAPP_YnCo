# 기존 'AI 로그분석기 v2.2' 내장 룰에서 변환 반입(tools/import_legacy_rules.py) — 중복(코드·패턴) 제외
# 2026-09-10 광범위 패턴 3종(MSG-ERROR/WEB-MODULE/WEB-ENGINE: [WEB-dddd].*error 류) 제거 — 룰팩 룰·코드 사전과 중복
rules:
- id: LEG-JEUS-OOM-HEAP
  layer: was
  product:
  - jeus
  match:
    regex: (?:jeus.*OutOfMemoryError)|(?:WebContainer.*OutOfMemoryError)|(?:JEUSMain.*heap.*fail)|(?:java\.lang\.OutOfMemoryError:\s*Java heap space)|(?:java\.lang\.OutOfMemoryError:\s*GC overhead limit
      exceeded)|(?:java\.lang\.OutOfMemoryError:\s*unable to create new native thread)|(?:Exception in thread.*OutOfMemoryError)|(?:Heap space.*Exception)|(?:\[Full GC.*->.*\].*Ergonomics)|(?:PSYoungGen.*ParOldGen)|(?:Dumping
      heap to.*\.hprof)|(?:heap dump written to)|(?:-XX:HeapDumpPath)|(?:hs_err_pid\d+\.log)|(?:# A fatal error has been detected by the Java Runtime)|(?:# There is insufficient memory for the Java Runtime)
  severity: critical
  category: memory
  verdict: JVM Heap OutOfMemoryError — JVM 힙 메모리 고갈. 메모리 누수 또는 -Xmx 설정 부족
  immediate:
  - "`jstat -gcutil <PID> 1000 10` 으로 Old(O) 사용률·FGC 증가 확인 — O 95% 이상 유지·FGC 연속 증가면 힙 고갈 확정"
  - "`ls -lt <SERVER_HOME>/*.hprof <SERVER_HOME>/logs/*.hprof 2>/dev/null | head` 로 자동 힙덤프 유무 확인, 없으면 `jmap -histo <PID> | head -30`(live 옵션 없이 — Full GC 유발 안 함)으로 상위 객체만 기록"
  - "`grep -n -B5 'OutOfMemoryError' <SERVER_HOME>/logs/JeusServer.log | tail -30` 로 최초 발생 시각·스레드 확인(<SERVER_HOME>=$JEUS_HOME/domains/<domain>/servers/<server>, JEUS 7+)"
  short:
  - '영향: JEUS 웹 컨테이너 응답 불가, 서비스 전체 중단.'
  - "(2차·승인 후, 롤백: 우회 해제) WebtoB·LB 에서 서버 우회 → `jmap -dump:live,format=b,file=<path>/heap.hprof <PID>`(live 는 Full GC 유발·디스크 여유 확인) → jeusadmin stop-server/start-server 로 재기동"
  mid:
  - jeus domain.xml에서 -Xmx 값 증가 (현재의 1.5~2배)
  - Eclipse MAT으로 힙 덤프 분석 → 누수 클래스 확인
  - HttpSession 타임아웃 단축, 대형 캐시 객체 제거
  - -XX:+UseG1GC 적용 검토
  long:
  - "-XX:+HeapDumpOnOutOfMemoryError·-XX:HeapDumpPath 표준화, Old 영역 85% 경보와 메모리 회귀 부하시험 정례화"
  source_note: 'legacy-analyzer-v2.2 jeus_rules.json JEUS-OOM-HEAP (원 출처: builtin)'
  exclude: (?:Metaspace)|(?:Compressed class)
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: 문구 기반
- id: LEG-JEUS-OOM-META
  layer: was
  product:
  - jeus
  match:
    regex: (?:java\.lang\.OutOfMemoryError:\s*Metaspace)|(?:java\.lang\.OutOfMemoryError:\s*Compressed class space)|(?:java\.lang\.OutOfMemoryError:\s*PermGen space)|(?:OutOfMemoryError.*Metaspace)|(?:MaxMetaspaceSize.*exceeded)|(?:class.*loader.*leak)|(?:ClassLoader.*OutOfMemory)
  severity: error
  category: memory
  verdict: JVM Metaspace/PermGen 고갈 — 클래스 로더 누수 또는 동적 클래스 생성 과다로 Metaspace 고갈
  immediate:
  - "`jstat -gcutil <PID> 1000 5` 로 M(Metaspace) 사용률 확인 — 95% 이상이면 확정(VM.native_memory 는 -XX:NativeMemoryTracking 기동 옵션이 있을 때만 출력)"
  - "`jmap -histo <PID> | head -30` 으로 상위 클래스 기록(live 옵션 없이), `grep -n -i 'deploy' <SERVER_HOME>/logs/JeusServer.log | tail -20` 으로 운영 중 반복 배포(redeploy) 이력 확인"
  short:
  - '영향: 신규 클래스 로딩 불가, JEUS 재기동 필요.'
  - "(2차·승인 후, 롤백: domain.xml JVM 옵션 백업) 클래스 정보 보존 후 jeusadmin stop-server/start-server 로 재기동해 Metaspace 회수"
  mid:
  - -XX:MaxMetaspaceSize=512m 또는 증가
  - 재배포 시 이전 클래스로더 참조 해제 확인
  - OSGi/동적 배포 환경에서 ClassLoader 관리 검토
  long:
  - "Metaspace 사용률 85% 경보와 운영 중 반복 재배포 금지 정책"
  source_note: 'legacy-analyzer-v2.2 jeus_rules.json JEUS-OOM-META (원 출처: builtin)'
  versions:
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: Metaspace 는 Java 8+ (JEUS 7+)
- id: LEG-JEUS-JDBC
  layer: was
  product:
  - jeus
  match:
    regex: (?:jeus.*Cannot get a connection)|(?:jeus.*datasource.*pool.*exhausted)|(?:JEUS.*JDBC.*timeout)|(?:Cannot get a connection.*pool.*exhausted)|(?:Timeout waiting for connection from pool)|(?:HikariPool.*Connection
      is not available)|(?:BoneCP.*timeout.*waiting)|(?:C3P0.*timeout.*acquiring.*connection)|(?:DBCP.*Cannot get a connection)|(?:getConnection.*timed out)|(?:Connection pool.*exhausted)|(?:connection.*pool.*empty)|(?:No
      available.*JDBC.*connection)
  severity: error
  category: connection
  verdict: JDBC 커넥션 풀 고갈 — DB 커넥션 미반환(누수) 또는 커넥션 풀 크기 부족
  immediate:
  - "`$JEUS_HOME/bin/jeusadmin -host <host>:9736 -u <user> 'connection-pool-info -server <server> -id <DS> -active'` 로 사용 중 연결·대기 확인(JEUS 7+, 읽기 전용) — 사용 중이 max 와 같으면 고갈 확정"
  - DB 서버에서 애플리케이션 계정 세션 수 확인
  - 로그에서 커넥션 반환 누락 코드 패턴 확인
  short:
  - '영향: DB 조회/저장 전체 실패, 서비스 오류.'
  - "(2차·승인 후, 롤백: domain.xml 백업 복원) DB 지연 해소가 우선, 누수면 connection-trace 로 미반납 코드 확인 후 수정, 풀 max 조정은 DB 세션 한도 안에서"
  mid:
  - domain.xml connection-pool max-size 증가
  - connection-test-query 설정으로 유효하지 않은 커넥션 제거
  - try-with-resources로 Connection.close() 자동 보장
  - DB 서버 max_connections 파라미터 확인
  long:
  - "풀 사용률 80% 경보와 미반납 추적(connection-trace) 상시 운영"
  source_note: 'legacy-analyzer-v2.2 jeus_rules.json JEUS-JDBC (원 출처: builtin)'
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: 문구 기반
- id: LEG-JEUS-GC
  layer: was
  product:
  - jeus
  match:
    regex: '(?:\[Full GC)|(?:\[GC \(Allocation Failure\))|(?:GC overhead limit exceeded)|(?:Pause Full \(Ergonomics\))|(?:Pause Full \(System\.gc\(\)\))|(?:Pause Young \(Allocation Failure\))|(?:\[GC \(Promotion
      Failure\))|(?:CMS Initial Mark|CMS Final Remark|CMS-concurrent)|(?:G1 Evacuation Pause)|(?:G1 Humongous Allocation)|(?:To-space exhausted)|(?:GC locker: Trying a full collection)'
  severity: warn
  category: memory
  verdict: Full GC 과다/GC 오버헤드 — 힙 메모리 부족 또는 부적절한 GC 정책으로 GC 오버헤드
  immediate:
  - GC 로그 파일에서 Full GC 주기와 지속시간 확인
  - "`jstat -gcutil <PID> 5000 12` 로 1분간 각 영역 사용률·FGC 추이 확인 — Old 가 GC 후에도 내려가지 않으면 누수 의심"
  short:
  - '영향: GC Stop-The-World 동안 서비스 응답 지연.'
  - "(2차·승인 후, 롤백: domain.xml JVM 옵션 백업) GC 로그가 없으면 -verbose:gc(JDK 8)·-Xlog:gc*(JDK 9+) 옵션 추가 — 다음 재기동부터 적용"
  mid:
  - -Xmx 힙 크기 증가
  - -XX:+UseG1GC -XX:MaxGCPauseMillis=200 G1GC 적용
  - -XX:NewRatio 조정으로 Young/Old 비율 최적화
  - -Xlog:gc*:file=gc.log:time:filecount=10,filesize=50m
  long:
  - "GC 정지 시간 SLO(1분 중 GC 10% 이하) 감시와 메모리 용량계획"
  source_note: 'legacy-analyzer-v2.2 jeus_rules.json JEUS-GC (원 출처: builtin)'
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: GC 로그 문구 — JVM 공통
- id: LEG-JEUS-DEPLOY
  layer: was
  product:
  - jeus
  match:
    regex: (?:jeus.*DeploymentException)|(?:jeus.*deploy.*fail)|(?:JEUS.*application.*deploy.*error)|(?:java\.lang\.ClassNotFoundException)|(?:java\.lang\.NoClassDefFoundError)|(?:java\.lang\.NoSuchMethodError)|(?:java\.lang\.NoSuchFieldError)|(?:java\.lang\.VerifyError)|(?:java\.lang\.IncompatibleClassChangeError)|(?:ClassCastException.*loader)|(?:Cannot
      load class)|(?:Class path contains.*duplicate)|(?:WAR.*not deployed)|(?:EAR.*deployment.*failed)|(?:Deployment of.*failed)|(?:Module.*could not be deployed)
  severity: error
  category: internal
  verdict: 애플리케이션 배포 실패 — WAR/EAR 패키지 오류, 클래스 충돌, 설정 파일 오류
  immediate:
  - JEUS 로그에서 'Caused by:' 스택 추적 전체 확인
  - "`unzip -l <배포파일> | grep -E 'WEB-INF/(web.xml|jeus-web-dd.xml|lib/)' | head -30` 로 WAR 내 META-INF·WEB-INF 구조와 포함 라이브러리 확인(읽기 전용)"
  short:
  - '영향: 해당 애플리케이션 서비스 불가.'
  - "(2차·승인 후, 롤백: 실패 배포본 별도 보관) 원인 수정이 늦으면 이전 정상 배포본으로 되돌려 재배포"
  mid:
  - JAR 의존성 충돌 제거 (mvn dependency:tree 분석)
  - web.xml, jeus-web-dd.xml 설정 검토
  - 클래스패스 중복 라이브러리 제거
  long:
  - "배포 전 검증 환경 배포 시험·배포본 보관(되돌림용)과 배포 실패 경보"
  source_note: 'legacy-analyzer-v2.2 jeus_rules.json JEUS-DEPLOY (원 출처: builtin)'
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: 문구 기반
- id: LEG-JEUS-SLOW
  layer: was
  product:
  - jeus
  match:
    regex: (?:jeus.*response.*time.*exceed)|(?:jeus.*slow.*request)|(?:jeus.*request.*timeout)|(?:WebContainer.*timeout)|(?:servlet.*timeout.*jeus)|(?:jeus.*504)|(?:Gateway Timeout.*jeus)|(?:read.*timeout.*jeus)|(?:socket.*timeout.*jeus)|(?:connection.*timeout.*jeus)|(?:jeus.*elapsed.*\d{4,}ms)
  severity: warn
  category: thread
  verdict: JEUS 응답 지연/타임아웃 — DB 쿼리 지연, 외부 서비스 타임아웃, 스레드 풀 고갈
  immediate:
  - "`for i in 1 2 3; do jstack <PID> > td_$(date +%H%M%S)_$i.txt; sleep 10; done` 로 덤프 3회 수집 후 같은 스택에서 대기하는 스레드 분석(프로세스 유지)"
  - DB 슬로우 쿼리 로그 확인
  - 외부 API 연동 서버 응답 시간 측정
  short:
  - '영향: HTTP 504 오류, 사용자 서비스 장애.'
  - "(2차) 덤프의 병목 지점(SQL·외부 API·락)을 DB·연동 담당에 전달, 스레드 풀 조정은 승인 후 domain.xml 백업 뒤 반영"
  mid:
  - DB 쿼리 튜닝 및 인덱스 최적화
  - 외부 API timeout 설정 단축
  - 비동기 처리 도입으로 응답 시간 개선
  long:
  - "URI 별 응답 시간 SLO 감시(servlet access.log 응답 시간 항목)와 느린 URI 상위 개선 관리"
  source_note: 'legacy-analyzer-v2.2 jeus_rules.json JEUS-SLOW (원 출처: builtin)'
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: 문구 기반
- id: LEG-JEUS-CONN-BACKEND
  layer: was
  product:
  - jeus
  match:
    regex: (?:jeus.*ConnectException)|(?:jeus.*Connection refused)|(?:jeus.*backend.*unreachable)|(?:jeus.*upstream.*fail)|(?:WebContainer.*connect.*error)|(?:java\.net\.ConnectException.*refused)|(?:java\.net\.ConnectException.*timeout)|(?:java\.net\.SocketException)|(?:java\.net\.SocketTimeoutException)|(?:java\.rmi\.ConnectException)
  severity: error
  category: upstream
  verdict: JEUS 백엔드 연결 오류 — JEUS가 연결하려는 백엔드(DB, 외부 서비스, RMI)에 접근 불가
  immediate:
  - 백엔드 서버 기동 상태 확인
  - "네트워크 연결 테스트: `nc -zvw3 <backend_host> <port>`(또는 telnet) — 거부면 대상 미기동, 시간 초과면 방화벽·경로"
  - 방화벽 정책 확인
  short:
  - '영향: 해당 백엔드 의존 기능 전체 오류.'
  - "(2차) 대상 시스템 담당에 장애 시각·대상 주소·오류 유형 전달, 방화벽 변경이 필요하면 보안 승인 후 요청"
  mid:
  - 백엔드 서비스 복구
  - 연결 타임아웃 설정 최적화
  - 백엔드 서비스 이중화
  long:
  - "백엔드별 연결 실패율·응답 시간 감시와 서킷브레이커 적용 검토"
  source_note: 'legacy-analyzer-v2.2 jeus_rules.json JEUS-CONN-BACKEND (원 출처: builtin)'
  exclude: (?:LINEPROTO)|(?:LINK-3-UPDOWN)|(?:GigabitEthernet)|(?:FastEthernet)
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: 문구 기반
- id: LEG-JEUS-SESSION
  layer: was
  product:
  - jeus
  match:
    regex: (?:jeus.*session.*memory)|(?:jeus.*session.*leak)|(?:too many.*sessions.*jeus)|(?:session.*overflow.*jeus)|(?:HttpSession.*jeus.*high)|(?:session.*count.*exceed)
  severity: warn
  category: memory
  verdict: 세션 메모리 누수 — 웹 세션 객체 과다 누적. 세션 타임아웃 미설정
  immediate:
  - "`jmap -histo <PID> | grep -i session | head -20` 으로 세션 관련 객체 수·크기 확인(live 옵션 없이 — Full GC 유발 안 함)"
  - JEUS 세션 수 모니터링
  short:
  - '영향: 힙 메모리 증가로 OOM 유발 가능.'
  - "(2차) 세션당 큰 속성(목록·캐시)을 저장하는 기능을 덤프로 특정해 개발 담당에 전달, 세션 타임아웃 변경은 승인 후 재배포"
  mid:
  - web.xml session-timeout 값 단축 (기본 30분 → 15분)
  - 세션에 대형 객체 저장 금지
  - 세션 클러스터링 설정 점검
  long:
  - "활성 세션 수·세션 크기 추세 감시와 세션 사용 개발 표준"
  source_note: 'legacy-analyzer-v2.2 jeus_rules.json JEUS-SESSION (원 출처: builtin)'
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: 문구 기반
- id: LEG-JEUS-CRASH
  layer: was
  product:
  - jeus
  match:
    regex: (?:JEUSMain.*crash)|(?:JEUSMain.*exit)|(?:jeusadmin.*connection.*refused)|(?:jeus.*server.*terminated)|(?:jeus.*process.*killed)|(?:jeus.*abnormal.*shutdown)|(?:hs_err_pid\d+\.log created)|(?:#
      Java.*Runtime Environment.*crash)|(?:SIGSEGV.*jeus)|(?:SIGFPE.*jeus)
  severity: critical
  category: hardware
  verdict: JEUS 프로세스 비정상 종료 — JEUS 서버 프로세스 비정상 종료. JVM crash 또는 OS 시그널
  immediate:
  - "hs_err_pid*.log에서 crash 스택 트레이스 확인 — `ls -lt <SERVER_HOME>/hs_err_pid*.log $JEUS_HOME/bin/hs_err_pid*.log 2>/dev/null | head` 후 `head -40` 으로 문제 프레임(C/J) 확인"
  - "OS dmesg에서 커널 OOM 킬러 동작 여부 확인 — `dmesg -T | grep -i -E 'out of memory|oom' | tail`"
  short:
  - '영향: 웹 서비스 전체 중단.'
  - "(2차·승인 후, 롤백: 해당 없음 — 기동 전 hs_err·core 파일 보존) 원인 자료 보존 후 jeusadmin start-server 또는 startManagedServer 로 기동"
  mid:
  - -XX:+HeapDumpOnOutOfMemoryError 옵션 추가
  - JVM 버전 업그레이드
  - JEUS 패치 최신 적용
  long:
  - "프로세스 생존 감시(자동 경보)와 JDK·JEUS 패치 정기 적용 일정"
  source_note: 'legacy-analyzer-v2.2 jeus_rules.json JEUS-CRASH (원 출처: builtin)'
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: JEUSMain 문구는 JEUS 6, jeusadmin 문구는 6~9 공통
- id: LEG-JEUS-LOG-FULL
  layer: was
  product:
  - jeus
  match:
    regex: (?:jeus.*No space left)|(?:jeus.*disk.*full)|(?:jeus.*log.*full)|(?:jeus.*log.*disk.*error)|(?:jeus.*cannot.*write.*log)
  severity: error
  category: disk
  verdict: JEUS 로그 디스크 부족 — JEUS 로그 파일이 디스크를 가득 채움
  immediate:
  - df -h $JEUS_HOME/logs
  - "`df -i <SERVER_HOME>/logs` 와 `du -sh <SERVER_HOME>/logs/* | sort -h | tail -10` 로 inode·큰 로그 확인(JEUS 6 은 $JEUS_HOME/logs, 정리는 2차)"
  short:
  - '영향: 로그 기록 불가, JEUS 비정상 동작.'
  - "(2차·승인 후, 롤백: 정리 전 압축본을 다른 볼륨에 보관) 회전된 오래된 로그를 압축·이동해 공간 확보, 사용 중인 현재 로그 파일은 건드리지 않는다"
  mid:
  - JEUS 로그 롤링 설정
  - 로그 레벨 조정 (DEBUG → WARN)
  - 로그 파티션 별도 구성
  long:
  - "로그 파일시스템 사용률 85%/95% 감시와 보관 주기 표준"
  source_note: 'legacy-analyzer-v2.2 jeus_rules.json JEUS-LOG-FULL (원 출처: builtin)'
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: 문구 기반
- id: LEG-JEUS-NORMAL-SHUTDOWN
  layer: was
  product:
  - jeus
  match:
    regex: (?:\[SERVER-0248\].*JEUS server is SHUTDOWN)|(?:\[SERVER-0265\].*JEUS server has exited)|(?:\[WEB-1031\].*web engine has shut down)|(?:\[JNSS-0402\].*Shut down the server)|(?:\[JNSS-0030\].*JNDI
      naming server.*unexported)|(?:\[WEB-1504\].*web module.*undistributed)|(?:\[Scheduler-0023\].*JEUS scheduler.*unexported)|(?:\[NET-0214\].*Closing.*JMX)|(?:\[NET-0214\].*Closing BASE)|(?:The JEUS
      server is SHUTDOWN)|(?:The JEUS server has exited)|(?:SERVER-0248)|(?:SERVER-0265)
  severity: info
  category: internal
  verdict: 'JEUS 서버 정상 종료 — JEUS 서버가 정상적인 종료 시퀀스를 수행함.

    정상 종료 순서: 웹모듈 배포해제 → 웹엔진 종료 → JNDI 해제 → 서버 종료 → 프로세스 종료'
  immediate:
  - "jeusadmin 또는 JEUS 관리 콘솔(WebAdmin)에서 종료 명령 실행 이력 확인 — 관리 서버(DAS) JeusServer.log 에서 stop-server·local-shutdown 기록 검색"
  - 종료 전 시간대의 JEUS 로그에서 오류 발생 여부 확인
  - "OS cron(`crontab -l -u <jeus_user>`) 또는 운영 스크립트에 의한 계획된 정지 작업 여부 확인"
  - "`$JEUS_HOME/bin/jeusadmin -host <host>:9736 -u <user> 'server-info -server <server> -state'` 로 현재 상태(SHUTDOWN·RUNNING) 확인(JEUS 7+)"
  short:
  - '영향: JEUS 서버 서비스 중단. 의도된 종료인지 비의도적 종료인지 확인 필요.'
  - "(2차·승인 후, 롤백: 해당 없음) 계획 종료가 아니고 서비스가 필요하면 jeusadmin start-server <server> 또는 startManagedServer 로 기동"
  mid:
  - "정상 종료였다면 재기동은 jeusadmin start-server <server> 또는 $JEUS_HOME/bin/startManagedServer(JEUS 7+) — wsboot 는 WebtoB 기동 명령이므로 JEUS 에 쓰지 않는다"
  - 비의도적 종료였다면 종료 직전 로그에서 원인(OOM/오류) 분석
  - JEUS 자동 재기동 스크립트 설정 검토
  long:
  - "계획 정지·기동 작업을 변경 관리 대장에 기록하고 비계획 종료만 경보"
  source_note: 'legacy-analyzer-v2.2 jeus_rules.json JEUS-NORMAL-SHUTDOWN (원 출처: builtin)'
  versions:
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: SERVER-0248/0265 는 JEUS 7 이후 코드
- id: LEG-JEUS-ABNORMAL-SHUTDOWN
  layer: was
  product:
  - jeus
  match:
    regex: (?:JEUSMain.*abnormal)|(?:JEUS.*killed)|(?:JEUS.*terminated.*unexpectedly)|(?:hs_err_pid\d+\.log)|(?:\[SERVER-0248\].*SHUTDOWN.*(?!normal))|(?:java.*crash.*jeus)|(?:SIGSEGV.*jeus)|(?:SIGKILL.*jeus)
  severity: critical
  category: internal
  verdict: JEUS 서버 비정상 종료 — JEUS 서버 프로세스 비정상 강제 종료
  immediate:
  - "hs_err_pid*.log 확인 — `ls -lt <SERVER_HOME>/hs_err_pid*.log $JEUS_HOME/bin/hs_err_pid*.log 2>/dev/null | head`"
  - "OS dmesg에서 커널 OOM 킬러 동작 여부 확인 — `dmesg -T | grep -i -E 'out of memory|oom' | tail`"
  short:
  - '영향: 웹 서비스 전체 중단.'
  - "(2차·승인 후, 롤백: 해당 없음 — 기동 전 hs_err·core 보존) 원인 자료 보존 후 jeusadmin start-server 로 기동, OOM Killer 면 서버 메모리 점유 프로세스 정리 계획"
  mid:
  - -XX:+HeapDumpOnOutOfMemoryError 추가
  - JVM 버전 업그레이드
  - JEUS 패치 최신 적용
  long:
  - "프로세스 생존 감시와 서버 메모리 여유(물리 대비 힙 합계) 관리"
  source_note: 'legacy-analyzer-v2.2 jeus_rules.json JEUS-ABNORMAL-SHUTDOWN (원 출처: builtin)'
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: JEUSMain(6)·killed/terminated 문구(공통)
- id: LEG-JEUS-JNDI-ERROR
  layer: was
  product:
  - jeus
  match:
    regex: (?:\[JNSS-\d{4}\].*(?:fail|error))|(?:\[NET-\d{4}\].*(?:fail|error))|(?:\[D_SESSION-\d{4}\].*(?:fail|error|closed))|(?:JNDI.*(?:fail|error|lookup.*fail))|(?:naming.*server.*error)|(?:SocketStream.*(?:fail|error))|(?:NET-0907)|(?:D_SESSION-2193)
  severity: warn
  category: internal
  verdict: JEUS JNDI/네트워크 오류 — JEUS JNDI 네이밍 서버 또는 네트워크 세션 오류
  immediate:
  - JEUS 서버 간 네트워크 연결 상태 확인
  - JNDI 설정 파일 검토
  - "`$JEUS_HOME/bin/jeusadmin -host <host>:9736 -u <user> 'server-info'` 로 관련 서버들의 상태 확인(JEUS 7+), 상대 서버에 `nc -zvw3 <peer_ip> <base_port>`"
  short:
  - '영향: EJB 룩업 실패, 분산 세션 오류.'
  - "(2차·승인 후, 롤백: 해당 없음) 상대 서버·네트워크 원인 해소 후에도 JNDI 오류가 지속되면 서버 재기동 계획"
  mid:
  - "(2차·승인 후) JEUS 서버 재기동"
  - 네트워크 방화벽 설정 확인
  long:
  - "서버 간 통신 포트(base 포트) 감시와 방화벽 정책 변경 이력 관리"
  source_note: 'legacy-analyzer-v2.2 jeus_rules.json JEUS-JNDI-ERROR (원 출처: builtin)'
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: JNSS-/NET- 접두 — JNSS 는 9.1 모듈 목록에 존재, NET- 는 기존 도구 룰 유래(도입 버전 미확인) → 전 버전 수집
- id: LEG-JEUS-DEPLOY-XML
  layer: was
  product:
  - jeus
  match:
    regex: (?:jeus\.deploy\.JeusDeploymentException)|(?:Deploying the web module failed)|(?:\[SERVER-0405\].*Distributing.*failed)|(?:\[SERVER-0300\].*Distributing.*failed)|(?:\[SERVER-0250\].*Starting
      server.*failed.*STANDBY)|(?:jeus\.xml\.binding\.JeusJAXBException)|(?:Unmarshalling the XML descriptor failed.*jeus-web-dd)|(?:WEB-INF/jeus-web-dd\.xml)|(?:cvc-complex-type\.\d+\.\d+.*Element.*cannot
      have character)|(?:Element.*cannot have character.*children.*element-only)|(?:webinf-first.*cannot have character)|(?:javax\.xml\.bind\.UnmarshalException)|(?:org\.xml\.sax\.SAXParseException.*cvc-complex)|(?:jeus\.xml\.binding\.BindingHelper)|(?:jeus\.service\.descriptor\.DescriptorFile)|(?:jeus\.servlet\.deployment\.WarFile.*loadWebDescriptors)|(?:jeus\.servlet\.deployment\.WebModuleDeployer)|(?:jeus\.xml\.util\.XMLSurgeon)
  severity: error
  category: internal
  verdict: JEUS 배포 실패 — jeus-web-dd.xml XML 스키마 오류
  immediate:
  - "`grep -n -A10 -E 'jeus-web-dd|webinf-first' <SERVER_HOME>/logs/JeusServer.log | tail -30` 로 오류 요소와 줄 위치 확인"
  - "`unzip -p <app>.war WEB-INF/jeus-web-dd.xml | grep -n -A3 'webinf-first'` 로 배포본의 해당 태그 확인, 이전 정상 배포본의 같은 파일과 `diff` 로 비교"
  - "현재 JEUS 버전에서 지원하는 jeus-web-dd.xml 스키마 확인 — JEUS 판 변경 직후면 판 차이 의심"
  short:
  - '영향: 해당 웹 애플리케이션(<app>) 배포 완전 실패.

    JEUS 서버가 STANDBY 상태로 전환되어 서비스 제공 불가.'
  - "(2차·승인 후, 롤백: 수정 전 jeus-web-dd.xml 보관) DD 파일 수정본으로 재배포, 급하면 이전 정상 배포본으로 되돌림"
  mid:
  - "jeus-web-dd.xml에서 <webinf-first> 값 형식 수정:\n  잘못된 예: <webinf-first>true</webinf-first>\n  올바른 예: <webinf-first><value>true</value></webinf-first>"
  - JEUS 공식 스키마 파일($JEUS_HOME/lib/schemas/) 참조하여 DD 파일 재작성
  - JEUS 버전에 맞는 jeus-web-dd.xml 샘플 파일 활용
  - '배포 전 xmllint로 XML 유효성 검사: xmllint --schema jeus-web-dd.xsd jeus-web-dd.xml'
  long:
  - "빌드 파이프라인에 DD 스키마 검증 단계 추가, JEUS 판 업그레이드 시 DD 호환성 점검"
  source_note: 'legacy-analyzer-v2.2 jeus_rules.json JEUS-DEPLOY-XML (원 출처: builtin)'
  exclude: (?:WebtoBConnectionManager)
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: jeus.deploy.JeusDeploymentException 클래스 — 6~9 공통
- id: LEG-JEUS-WEBTOB-CONN
  layer: was
  product:
  - jeus
  match:
    regex: (?:\[WEB-3347\].*Connecting to WebtoB.*failed.*network error)|(?:\[WEB-3346\].*Connecting to WebtoB.*failed)|(?:Check if WebtoB is running)|(?:jeus\.servlet\.engine\.WebtoBConnectionManager)|(?:jeus\.servlet\.engine\.WJPV2Registration)|(?:jeus\.servlet\.connection\.WebtoBConnector)|(?:WebtoBConnectionManager\.registerToWebtoB)|(?:WebtoBConnectionManager\.createConnection)|(?:WJPV2Registration\.readRegstrationReply)|(?:Connecting
      to WebtoB.*Connection refused)|(?:Connecting to WebtoB.*EOFException)|(?:registerToWebtoB.*failed)|(?:java\.io\.EOFException.*WebtoB)|(?:java\.net\.ConnectException.*Connection refused.*WebtoB)
  severity: error
  category: connection
  verdict: JEUS↔WebtoB 연결 실패 (WJP 프로토콜)
  immediate:
  - WebtoB 서버(<webtob_host>:<jsv_port>) 기동 상태 확인
  - "WebtoB 서버에서 `ps -ef | grep -E 'wsm|htl|hth' | grep -v grep` 로 WebtoB 프로세스(WSM·HTL·HTH) 확인"
  - "JEUS 서버에서 `nc -zvw3 <webtob_host> <jsv_port>`(또는 telnet) 으로 WJP(JSV) 포트 연결 테스트 — 거부면 WebtoB 미기동·포트 불일치"
  - 방화벽 정책에서 JSV 포트(<jsv_port>, 흔히 9900) 허용 여부 확인
  short:
  - '영향: JEUS WAS가 WebtoB에 등록되지 않아 HTTP 요청 수신 불가.

    웹 서비스 전체 중단 (WebtoB → JEUS 트래픽 라우팅 불가).'
  - "(2차·승인 후, 롤백: 설정 백업 복원) WebtoB 담당이 WebtoB 기동(wsboot) 또는 JSV 포트·등록 정보 정정, JEUS 측 webtob-connector 주소 수정"
  mid:
  - "(2차·WebtoB 담당 승인 후) WebtoB 미기동 시: wsboot으로 WebtoB 기동"
  - 'WebtoB jsvgroup 설정 확인: $WEBTOB_HOME/conf/webtob.m의 Jsvgroup 섹션'
  - WebtoB에서 JEUS 서버 등록 설정 확인 (Server 섹션의 jeus_port, ip)
  - 방화벽에서 WebtoB WJP 포트(<jsv_port>) 허용
  long:
  - "WebtoB-JEUS 연결 수 감시와 연동 포트·주소 대장 관리"
  source_note: 'legacy-analyzer-v2.2 jeus_rules.json JEUS-WEBTOB-CONN (원 출처: builtin)'
  exclude: (?:JeusDeploymentException)
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: WEB-3347 — 6·7·8 공통
- id: LEG-JEUS-WEBTOB-DOWN
  layer: was
  product:
  - jeus
  match:
    regex: (?:\[WEB-3347\].*failed because of a network error)|(?:Connection refused.*Connection refused.*WebtoB)|(?:WebtoBConnector.*run.*ConnectException)|(?:Socket\[unconnected\].*WebtoB.*failed)|(?:Check
      if WebtoB is running.*contact the administrator)
  severity: error
  category: connection
  verdict: WebtoB 서버 응답 없음 (JEUS 관점)
  immediate:
  - "WebtoB 프로세스 기동 상태 즉시 확인 — WebtoB 서버에서 `ps -ef | grep -E 'wsm|htl|hth' | grep -v grep`"
  - "네트워크 경로 확인: `ping -c3 <webtob_host>` 와 `nc -zvw3 <webtob_host> <jsv_port>`"
  - WebtoB 로그에서 비정상 종료 원인 확인
  short:
  - '영향: JEUS WAS의 HTTP 요청 수신 불가. 서비스 완전 중단.'
  - "(2차·WebtoB 담당 승인 후, 롤백: 해당 없음) 종료 원인 로그 보존 후 wsboot 로 WebtoB 기동, JEUS 자동 재접속 확인"
  mid:
  - "(2차·승인 후) WebtoB 재기동: wsboot"
  - WebtoB 비정상 종료 원인 분석 후 근본 조치
  - WebtoB 자동 감시/재기동 스크립트 설정
  long:
  - "WebtoB 프로세스 생존 감시와 이중화(복수 WebtoB) 구성 검토"
  source_note: 'legacy-analyzer-v2.2 jeus_rules.json JEUS-WEBTOB-DOWN (원 출처: builtin)'
  versions:
  - JEUS 6
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: WEB-3347·Connection refused — 공통
- id: LEG-JEUS-SERVER-LIFECYCLE
  layer: was
  product:
  - jeus
  match:
    regex: (?:\[SERVER-0405\])|(?:\[SERVER-0300\])|(?:\[SERVER-0250\])|(?:\[SERVER-0248\])|(?:\[SERVER-0265\])|(?:\[SERVER-0201\])|(?:\[SERVER-0210\])|(?:\[SERVER-0400\])|(?:\[SERVER-0401\])|(?:\[SERVER-0402\])|(?:\[SERVER-0403\])|(?:\[SERVER-0406\])|(?:\[SERVER-0407\])|(?:\[SERVER-0101\])|(?:\[SERVER-0120\])|(?:\[SERVER-0130\])|(?:\[SERVER-0131\])
  severity: warn
  category: internal
  verdict: JEUS 서버 상태 변경 (SERVER 코드 계열)
  immediate:
  - SERVER 코드로 공식 JEUS 매뉴얼에서 정확한 원인 확인
  - 해당 코드 전후 로그에서 연관 이벤트 확인
  - "JEUS 관리 콘솔 또는 `$JEUS_HOME/bin/jeusadmin -host <host>:9736 -u <user> 'server-info -server <server> -state'` 로 서버 상태 확인(JEUS 7+)"
  short:
  - '영향: JEUS 서버 또는 배포 애플리케이션 상태 이상.'
  - "(2차·승인 후, 롤백: 설정 백업 복원) STANDBY·SHUTDOWN 원인(배포 실패·설정 오류) 해소 후 jeusadmin 으로 서버 기동"
  mid:
  - 'SERVER-04xx: 배포 파일 및 설정 파일 검토'
  - "SERVER-STANDBY: 배포 실패 해결 후 jeusadmin 으로 서버 기동(STANDBY→RUNNING 전환 명령은 판별 Reference Guide 확인) — wsadmin 은 WebtoB 도구"
  - "SERVER-0265 후 미기동: jeusadmin start-server <server> 또는 startManagedServer 실행(wsboot 는 WebtoB 기동 명령)"
  long:
  - "서버 상태(RUNNING 외) 자동 감시와 기동·정지 작업 변경 관리"
  source_note: 'legacy-analyzer-v2.2 jeus_rules.json JEUS-SERVER-LIFECYCLE (원 출처: builtin)'
  versions:
  - JEUS 7
  - JEUS 8/8.5
  - JEUS 9/9.1
  version_note: SERVER-0405/0300/0250 … JEUS 7 이후
- id: LEG-JEUS-DEPLOY-CODES
  layer: was
  product:
  - jeus
  match:
    regex: (?:\[SERVER-0405\].*Distributing.*failed)|(?:\[SERVER-0300\].*Distributing.*failed)|(?:\[SERVER-0250\].*Starting server.*failed)|(?:\[SERVER-0406\].*application.*fail)|(?:jeus\.deploy\.JeusDeploymentException)|(?:jeus\.deploy\.deployer\.AbstractDeployer)|(?:jeus\.deploy\.deployer\.DeploymentAdministrator)|(?:jeus\.server\.Server\.innerSingleDistribute)|(?:jeus\.server\.Server\$InnerDistributeAppTask)|(?:jeus\.servlet\.deployment\.WebModuleDeployer)|(?:jeus\.servlet\.deployment\.WarFile)|(?:jeus\.service\.descriptor\.DescriptorFile)|(?:jeus\.xml\.binding\.JeusJAXBException)|(?:jeus\.xml\.binding\.BindingHelper)|(?:jeus\.xml\.util\.XMLSurgeon)|(?:Unmarshalling
      the XML descriptor failed)|(?:WEB-INF/jeus-web-dd\.xml)|(?:WEB-INF/web\.xml)|(?:Deploying the web module failed)|(?:Distributing the application.*failed)|(?:cvc-complex-type\.\d+\.\d+)|(?:SAXParseException.*cvc-)|(?:javax\.xml\.bind\.UnmarshalException)|(?:org\.xml\.sax\.SAXParseException)|(?:org\.apache\.xerces\.)|(?:webinf-first.*cannot
      have character)|(?:Element.*cannot have character.*element-only)
  severity: error
  category: internal
  verdict: JEUS 배포 실패 계열 (SERVER-04xx)
