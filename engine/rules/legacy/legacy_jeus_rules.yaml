  - "`grep -n -A5 'NameNotFoundException' <SERVER_HOME>/logs/JeusServer.log | tail -20` 로 찾지 못한 JNDI 이름 확인, `jeusadmin -host <host>:<base_port> -u <user> 'application-info'` 로 그 이름을 내보내는 EJB 애플리케이션이 RUNNING 인지 확인(JEUS 7+)"
  short:
  - '영향: EJB/Resource 룩업 실패, 분산 환경 서비스 장애.'
  - "(2차·승인 후, 롤백: 설정 백업 복원) 바인딩 누락이면 자원(데이터소스·EJB) 대상 서버 지정·export-name 수정 후 재배포"
  mid:
  - "(2차·승인 후) JEUS 재기동으로 JNDI 재초기화"
  - "JNDI 이름 설정 검토 (jeus-ejb-dd.xml, jeus-web-dd.xml, domain.xml — standalone.xml 은 JBoss 설정 파일이므로 해당 없음)"
  long:
  - "JNDI 이름 규칙 표준과 배포 후 핵심 JNDI 조회 스모크 시험"
  source_note: 'legacy-analyzer-v2.2 jeus_rules.json JEUS-JNDI-CODES (원 출처: builtin)'
