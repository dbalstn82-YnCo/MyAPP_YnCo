      down the server)|(?:JNDI naming server.*unexported)|(?:Shut down the server \[)|(?:javax\.naming\.NameNotFoundException)|(?:javax\.naming\.CommunicationException)|(?:javax\.naming\.NamingException)|(?:javax\.naming\.ServiceUnavailableException)|(?:javax\.naming\.AuthenticationException)|(?:javax\.naming\.CannotProceedException)
