# OS — AIX errpt · Windows Security 이벤트 시그니처
rules:
- id: OS-AIX-ERRPT-001
  layer: os
  product:
  - aix
  match:
    regex: \[P/[HS] |DISK OPERATION ERROR \[P|PHYSICAL VOLUME DECLARED MISSING|I/O ERROR DETECTED BY LVM|ADAPTER ERROR \[P
  severity: critical
  category: hardware
  verdict: AIX 영구(PERM) 하드웨어 오류 — 디스크/어댑터/LVM
  immediate:
  - "상세(읽기): `errpt -a -j <IDENTIFIER> | head -60` — Resource Name·Location Code·Probable Causes 기록, 같은 장치 반복이면 장치 장애 확정"
  - "LVM 영향(읽기): `lsvg -p <vg>` 의 PV STATE(missing·removed)와 `lsvg -l <vg> | grep -i stale` — stale LV·missing PV 가 있으면 미러 한쪽 손실"
  - "MPIO 경로(읽기): `lspath | grep -v Enabled` — Failed·Missing 경로가 있으면 경로 장애(디스크 자체와 구분)"
  short:
  - "(2차·승인 후, 롤백: 조치 전 `lspath`·`lsvg -p <vg>` 출력 보관) 서비스 영향이 있으면 정상 미러 사본·MPIO 정상 경로로 우회 운영하고 장애 장치 교체 일정을 제조사와 확정"
  - diag 로 장치 진단, 스토리지/SAN 경로(lspath) 점검
  mid:
  - sense data·PATH ID·MPIO 상태로 장애 지점(디스크/경로/스토리지)을 특정한 뒤 해당 표준 복구 절차 수행, LV stale 이 확인된 경우에만 syncvg
  long:
  - errpt 감시(errnotify)·하드웨어 예측진단
  versions:
  - AIX 5.3
  - AIX 6.1
  - AIX 7.1
  - AIX 7.2
  - AIX 7.3
  version_note: errpt Class/Type '[P/H' 등 형식 전 버전 동일
- id: OS-AIX-ERRPT-002
  layer: os
  product:
  - aix
  match:
    regex: 'PHYSICAL PARTITION MARKED STALE|\[P/U '
  severity: error
  category: storage
  verdict: LVM 미러 stale / 볼륨 그룹 이상
  immediate:
  - lsvg -l <vg> 로 stale LV 확인, 원인 PV 상태 확인
  short:
  - 모든 MPIO 경로·PV 정상과 신규 I/O 오류 중단을 확인한 뒤, stale PP 가 실제 존재할 때만 영향도 검토 후 syncvg -v <vg>
  mid:
  - 미러 구성·쿼럼 정책 점검
  long:
  - LVM 상태 감시
  versions:
  - AIX 5.3
  - AIX 6.1
  - AIX 7.1
  - AIX 7.2
  - AIX 7.3
  version_note: PHYSICAL PARTITION MARKED STALE 전 버전
- id: OS-AIX-ERRPT-003
  layer: os
  product:
  - aix
  match:
    regex: SOFTWARE PROGRAM ABNORMALLY TERMINATED|CORE DUMP|PAGING SPACE LOW|PGSP_KILL
  severity: error
  category: internal
  verdict: 프로세스 비정상 종료 / 페이징 공간 부족
  immediate:
  - errpt -a 로 종료 프로세스·시그널 확인, 코어 파일 보존
  - lsps -a 로 페이징 사용률 확인
  short:
  - 코어 분석(dbx), 메모리 사용 프로세스 분석
  mid:
  - 애플리케이션 수정·메모리/페이징 증설
  long:
  - 프로세스·페이징 감시
  versions:
  - AIX 5.3
  - AIX 6.1
  - AIX 7.1
  - AIX 7.2
  - AIX 7.3
  version_note: CORE DUMP·PAGING SPACE LOW·PGSP_KILL 전 버전
- id: OS-WIN-SEC-001
  layer: os
  product:
  - windows
  match:
    regex: '^(?:\[\d+\] )?Microsoft-Windows-Security-Auditing: .*(로그온하지 못했습니다|failed to log on|An account failed to log on)'
  severity: error
  category: security
  verdict: 반복 로그온 실패 (4625) — 계정·출발지·빈도 확인 필요
  immediate:
  - "출발지별 실패 건수(읽기, 관리자 PowerShell): `Get-WinEvent -FilterHashtable @{LogName='Security';Id=4625;StartTime=(Get-Date).AddHours(-1)} | Group-Object { $_.Properties[19].Value } | Sort-Object Count -Descending | Select-Object -First 10 Count,Name` — 한 출발지에서 수십 건 이상이면 무차별 대입 의심, 보안 담당 즉시 통보"
  - "실패 계정·로그온 유형(읽기): `Get-WinEvent -FilterHashtable @{LogName='Security';Id=4625} -MaxEvents 50 | ForEach-Object { '{0} {1} type={2}' -f $_.TimeCreated,$_.Properties[5].Value,$_.Properties[10].Value }` — 유형 3 네트워크·10 원격 데스크톱"
  - "계정 잠금 동반 여부(읽기): `Get-WinEvent -FilterHashtable @{LogName='Security';Id=4740} -MaxEvents 10 | Format-List TimeCreated,Message`(도메인 계정은 DC 에서) — 서비스 계정 잠김이면 서비스 영향"
  short:
  - 출처 IP 정당성 확인, 서비스 계정 비밀번호 변경 이력 대조
  mid:
  - 계정 잠금 정책·원격 로그온 제한 정비
  long:
  - 인증 실패 감시·SIEM 연계
  versions:
  - Windows Server 2008/R2
  - 2012/R2
  - '2016'
  - '2019'
  - '2022'
  - '2025'
  version_note: 메시지 문구('An account failed to log on'/'로그온하지 못했습니다')는 4625(2008+). 2003 의 529 는 'Logon Failure:' 문구라 별도
- id: OS-WIN-SEC-002
  layer: os
  product:
  - windows
  match:
    regex: 사용자 계정이 잠겼습니다|A user account was locked out
  severity: critical
  category: security
  verdict: 계정 잠금 (4740) — 서비스 계정이면 신규 인증·재연결 영향 확인
  immediate:
  - "잠금 기록·호출자(읽기): `Get-WinEvent -FilterHashtable @{LogName='Security';Id=4740} -MaxEvents 10 | Format-List TimeCreated,Message`(도메인 계정은 PDC 에뮬레이터 DC 에서) — 메시지의 호출자 컴퓨터 이름(Caller Computer Name)이 잠금 유발 출처"
  - "계정 상태(읽기): `Get-ADUser <user> -Properties LockedOut,BadLogonCount,LastBadPasswordAttempt,PasswordLastSet | Format-List` — 비밀번호 바꾼 직후부터 잠김이 반복되면 구 비밀번호를 쓰는 서비스·스케줄 작업 원인"
  - "잠긴 계정이 서비스/배치 계정인지 확인 — 서비스 계정이면 신규 인증·재연결 영향 범위 기록"
  short:
  - "(2차·승인 후, 롤백: 해제 후 다시 잠기면 출처 정리 전까지 재해제 보류) 정당한 계정이면 `Unlock-ADAccount -Identity <user>` 로 잠금 해제(로컬 계정은 컴퓨터 관리 › 로컬 사용자 및 그룹에서 해제)"
  - 잠금 유발 프로세스(구 비밀번호 저장 서비스·스케줄 작업) 추적
  mid:
  - 서비스 계정 비밀번호 관리 절차 정비
  long:
  - 계정 잠금 감시
  versions:
  - Windows Server 2008/R2
  - 2012/R2
  - '2016'
  - '2019'
  - '2022'
  - '2025'
  version_note: 4740(2008+). 2003 은 644
- id: OS-WIN-SEC-003
  layer: os
  product:
  - windows
  match:
    regex: 감사 로그가 지워졌습니다|The audit log was cleared
  severity: critical
  category: security
  verdict: 보안 감사 로그 삭제 (1102) — 승인된 관리 작업인지 확인 필요
  immediate:
  - 감사 로그를 지운 계정 확인(`Get-WinEvent -FilterHashtable @{LogName='Security';Id=1102} -MaxEvents 5 | Format-List TimeCreated,Message` 의 계정 이름), 보안 담당 즉시 통보
  - 해당 계정의 같은 시각 로그온(4624/4648) 기록 보존 — 승인된 관리 작업인지 변경 관리 기록과 대조
  short:
  - 삭제 전후 다른 로그(시스템·방화벽) 확보
  mid:
  - 감사 로그 원격 전송(포워딩) 구성
  long:
  - 로그 무결성 보호 체계
  versions:
  - Windows Server 2008/R2
  - 2012/R2
  - '2016'
  - '2019'
  - '2022'
  - '2025'
  version_note: 1102(2008+). 2003 은 517
