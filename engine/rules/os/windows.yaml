# OS — Windows Server 시그니처 (이벤트 로그 CSV)
rules:
- id: OS-WIN-001
  layer: os
  product:
  - windows
  match:
    regex: terminated unexpectedly|예기치 않게 종료
  severity: critical
  category: internal
  verdict: 서비스 비정상 종료 (Service Control Manager 7031/7034)
  immediate:
  - '`Get-WinEvent -FilterHashtable @{LogName=''System'';Id=7031,7034} -MaxEvents 20` 로 종료된 서비스 이름·횟수 확인'
  - '`Get-Service <name>` 로 현재 상태 확인, 반복 종료면 같은 시각 Application 1000/1026 이벤트 확인'
  short:
  - '(2차·승인 후, 롤백: 없음) 서비스 시작(`Start-Service <name>`) 후 상태·이벤트 재확인 — 반복 종료 중이면 원인 확인 전 시작 보류'
  - 애플리케이션 이벤트 로그에서 종료 원인(예외·크래시) 확인
  mid:
  - 서비스 복구 옵션(자동 재시작) 설정
  long:
  - 근본 원인 패치·업그레이드 계획
  versions:
  - Windows Server 2003
  - 2008/R2
  - 2012/R2
  - '2016'
  - '2019'
  - '2022'
  - '2025'
  version_note: SCM 7034 문구 전 버전
- id: OS-WIN-002
  layer: os
  product:
  - windows
  match:
    regex: Resource-Exhaustion|가상 메모리가 부족|ran out of memory|committed memory
  severity: critical
  category: memory
  verdict: 메모리/가상 메모리 고갈
  immediate:
  - '`Get-Process | Sort-Object WS -Descending | Select-Object -First 10 Name,Id,WS,PM` 로 메모리 대량 사용 프로세스 확인'
  - '`Get-Counter ''\Memory\Available MBytes'',''\Memory\% Committed Bytes In Use''` 로 가용 메모리·커밋 사용률 확인(커밋 90% 이상이면 고갈)'
  short:
  - '(2차·승인 후, 롤백: 없음) 원인 프로세스 재시작은 담당 승인 후, 페이지 파일 확대는 변경 관리 후'
  - 페이지 파일 크기·사용 추이 확인
  mid:
  - 페이지 파일·메모리 재산정
  long:
  - 메모리 증설 또는 워크로드 분산
  versions:
  - Windows Server 2008/R2
  - 2012/R2
  - '2016'
  - '2019'
  - '2022'
  - '2025'
  version_note: Resource-Exhaustion-Detector 2004 는 2008+, '가상 메모리 부족' 문구는 전 버전
- id: OS-WIN-003
  layer: os
  product:
  - windows
  match:
    regex: disk has a bad block|디스크에 잘못된 블록|The device .* has a bad block|Disk \d+ has been surprise removed
  severity: critical
  category: hardware
  verdict: 디스크 불량 블록/이탈 (Disk 7/153)
  immediate:
  - '`Get-WinEvent -FilterHashtable @{LogName="System"; ProviderName="disk"; Id=7,51,153,157} -MaxEvents 30 | fl TimeCreated,Id,Message` 로 디스크 번호(\Device\HarddiskN)·반복 여부 확인 (2008 R2+)'
  - '`Get-PhysicalDisk | ft FriendlyName,MediaType,HealthStatus,OperationalStatus` (2012+) 로 상태 확인 — Healthy 가 아니면 교체 대상, RAID 컨트롤러 뒤 디스크는 iLO/iDRAC 등 벤더 콘솔로 확인'
  - '해당 디스크 서비스 데이터의 최근 백업 성공 시각 확인(`wbadmin get versions`, Windows Server Backup 사용 시) — 백업이 없으면 즉시 백업 담당 통보'
  short:
  - chkdsk·벤더 진단 도구로 상태 점검
  mid:
  - 디스크 교체
  long:
  - 스토리지 이중화·모니터링 체계 정비
  versions:
  - Windows Server 2003
  - 2008/R2
  - 2012/R2
  - '2016'
  - '2019'
  - '2022'
  - '2025'
  version_note: Disk 7/51 문구 전 버전, 157 은 2012+
- id: OS-WIN-004
  layer: os
  product:
  - windows
  match:
    regex: low on disk space|디스크 공간이 부족
  severity: error
  category: disk
  verdict: 디스크 공간 부족 (Event 2013 등)
  immediate:
  - '`Get-Volume | ft DriveLetter,FileSystemLabel,Size,SizeRemaining` (2012+) / `Get-WmiObject Win32_LogicalDisk | ft DeviceID,Size,FreeSpace` (2008 R2) 로 여유 공간 확인 — 10% 미만이면 확정'
  - '`Get-ChildItem <로그·덤프 경로> -Recurse -File -ErrorAction SilentlyContinue | Sort-Object Length -Descending | Select-Object -First 20 FullName,Length,LastWriteTime` 로 대용량 파일·소유 서비스 식별(드라이브 전체 대신 의심 폴더만, 삭제는 2차)'
  short:
  - '(2차·승인 후, 롤백: 삭제 대신 다른 볼륨으로 옮기거나 압축 보관) 소유 서비스 확인 뒤 오래된 로그·덤프 정리로 공간 확보'
  - 급증 원인(로그·덤프) 추적
  mid:
  - 정리 배치·보관 정책 정비
  long:
  - 볼륨 증설 계획
  versions:
  - Windows Server 2003
  - 2008/R2
  - 2012/R2
  - '2016'
  - '2019'
  - '2022'
  - '2025'
  version_note: srv 2013 전 버전
- id: OS-WIN-005
  layer: os
  product:
  - windows
  match:
    regex: '^\[37\] Microsoft-Windows-Kernel-Processor-Power: '
  severity: warn
  category: performance
  verdict: 펌웨어가 CPU 속도를 제한 — 전원·열·BIOS 설정으로 처리 성능 저하
  immediate:
  - '`Get-WinEvent -FilterHashtable @{LogName="System"; ProviderName="Microsoft-Windows-Kernel-Processor-Power"; Id=37} -MaxEvents 10 | fl TimeCreated,Message` 로 제한 비율·지속 시간·반복 여부 확인'
  - '`Get-Counter "\Processor Information(_Total)\% Processor Performance","\Processor(_Total)\% Processor Time" -SampleInterval 2 -MaxSamples 5` 로 실제 성능 비율 확인 — % Processor Performance 가 100 미만으로 지속되면 클럭 제한 중 (2012 R2+)'
  - '`powercfg /getactivescheme` 로 전원 옵션 확인, 하드웨어 관리 콘솔(iLO/iDRAC)에서 전원 공급 장치·온도 경고 확인 — 경고가 같은 시각이면 하드웨어 원인'
  short:
  - BIOS/UEFI 전원 정책(OS 제어·최대 성능)과 Windows 전원 옵션 점검(2차, 변경 관리)
  mid:
  - 같은 모델 서버 펌웨어 버전 비교·업데이트 계획
  long:
  - 전원·냉각 용량 점검
  versions:
  - Windows Server 2012 R2
  - Windows Server 2016
  - Windows Server 2019
  - Windows Server 2022
  version_note: Kernel-Processor-Power 이벤트 37(경고) — 본문 언어와 상관없이 ID 로 판정. 하드웨어 고장 확정 아님
- id: OS-WIN-006
  layer: os
  product:
  - windows
  match:
    regex: '^\[(?:507|508|509|510|532|533)\] ESENT: '
  severity: warn
  category: performance
  verdict: ESE 데이터베이스(AD·Exchange·WSUS 등) 디스크 입출력 지연 — 요청이 비정상적으로 오래 걸림
  immediate:
  - '`Get-WinEvent -FilterHashtable @{LogName="Application"; ProviderName="ESENT"; Id=507,508,509,510,532,533} -MaxEvents 20 | fl TimeCreated,Id,Message` 로 파일 경로·지연 초(seconds)·대상 서비스(AD DS·WSUS·Exchange 등) 기록 (2008 R2+)'
  - '`Get-Counter "\LogicalDisk(*)\Avg. Disk sec/Transfer","\LogicalDisk(*)\Current Disk Queue Length" -SampleInterval 2 -MaxSamples 5` 로 해당 볼륨 지연 확인 — 0.025(25ms) 이상 지속이면 저장 장치 지연, 같은 시각 Disk 153·Storport 129 동반 여부도 확인'
  short:
  - 해당 볼륨 저장 장치·백신 실시간 검사 대상 여부 점검(2차)
  mid:
  - 데이터베이스 파일 위치를 전용·고성능 볼륨으로 분리 검토
  long:
  - 스토리지 성능·용량 계획
  versions:
  - Windows Server 2012 R2
  - Windows Server 2016
  - Windows Server 2019
  - Windows Server 2022
  version_note: ESENT 507·509(읽기 지연)·508(쓰기 지연)·510(I/O 지연)·532(읽기 미완료)·533(쓰기 미완료) — 507·532 는 실제 이벤트 사례로 확인(카탈로그 미확인). 같은 제공자의 다른 ID 는 걸지 않는다
- id: OS-WIN-007
  layer: os
  product:
  - windows
  match:
    regex: '^\[140\] Microsoft-Windows-Ntfs: '
  severity: error
  category: storage
  verdict: NTFS 트랜잭션 로그 기록 실패 — 해당 볼륨 손상 가능(저장 장치 연결·응답 이상 의심)
  immediate:
  - '`Get-WinEvent -FilterHashtable @{LogName="System"; Id=140,153,129,157} -MaxEvents 30 | fl TimeCreated,Id,ProviderName,Message` 로 볼륨 ID·장치 이름과 저장 장치 경고(Disk 153·Storport 129·iSCSI 연결 실패) 동반 확인 (2012 R2+)'
  - '`fsutil dirty query <X>:` (관리자) 와 `Get-Volume -DriveLetter <X> | fl HealthStatus` 로 볼륨 상태 확인 — Dirty 또는 Healthy 아님이면 손상 표시(chkdsk 스캔은 하지 않음)'
  short:
  - 저장 장치 경로(iSCSI·FC·가상 디스크) 안정성 점검(2차)
  mid:
  - chkdsk 복구는 변경 관리 승인 후 정지 시간에
  long:
  - 저장 장치 이중화·경로 다중화
  versions:
  - Windows Server 2012 R2
  - Windows Server 2016
  - Windows Server 2019
  - Windows Server 2022
  version_note: Ntfs 이벤트 140 — 본문 언어와 상관없이 ID 로 판정. 물리 디스크 고장으로 단정하지 않는다
